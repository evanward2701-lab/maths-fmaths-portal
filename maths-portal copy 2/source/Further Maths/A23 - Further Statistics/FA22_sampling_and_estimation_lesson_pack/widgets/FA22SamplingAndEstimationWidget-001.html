<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FA22SamplingAndEstimationWidget-001</title>
<style>:root{--canvas:#FAF9F6;--ivory:#FFFFF0;--line:#E5E5EA;--gold:#C5A059;--deep-gold:#D4AF37;--blush:#FBEFEF;--ink:#2C2C2E}body{margin:0;background:var(--canvas);color:var(--ink);font-family:Arial,sans-serif;line-height:1.5}main{max-width:980px;margin:0 auto;padding:32px 18px 48px}h1{font-family:Georgia,serif}.rule,.question,.score{border:1px solid var(--line);border-radius:18px;padding:16px;margin:16px 0}.rule{background:var(--ivory);border-left:6px solid var(--gold)}.question{background:white}.formula{font-family:Georgia,serif;font-size:1.35rem;background:var(--ivory);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}button{border:none;border-radius:999px;padding:11px 18px;background:var(--gold);font-weight:700;cursor:pointer;margin:12px 8px 0 0}.feedback{padding:10px;border-radius:12px;background:var(--canvas);border:1px solid var(--line)}.correct{border-color:var(--gold);background:var(--ivory)}.incorrect{border-color:var(--deep-gold);background:var(--blush)}</style></head>
<body><main><h1>Statistic or not?</h1><p>A statistic must be calculated only from sample observations and constants. If it contains μ or σ, it is not a statistic.</p><section class="rule"><strong>Rule:</strong> Sample-only expression = statistic. Population parameter included = not a statistic.</section><div id="questions"></div><button onclick="checkAnswers()">Check answers</button><button onclick="resetWidget()">Reset</button><div id="score" class="score">Score will appear here.</div></main>
<script>
const questions=[{id:"q1",formula:"(X₁ + X₂ + X₃) / 3",answer:"yes",explanation:"Only sample observations and constants."},{id:"q2",formula:"max(X₁, X₂, ..., Xₙ)",answer:"yes",explanation:"Only sample observations."},{id:"q3",formula:"Σ ((Xᵢ − μ) / σ)²",answer:"no",explanation:"Contains population parameters μ and σ."},{id:"q4",formula:"ΣXᵢ / n",answer:"yes",explanation:"This is X̄."},{id:"q5",formula:"S² = Σ(Xᵢ − X̄)² / (n − 1)",answer:"yes",explanation:"X̄ is calculated from the sample."}];
function render(){document.getElementById("questions").innerHTML=questions.map((q,i)=>`<section class="question" id="card-${q.id}"><strong>Question ${i+1}</strong><div class="formula">${q.formula}</div><label><input type="radio" name="${q.id}" value="yes"> Is a statistic</label> <label><input type="radio" name="${q.id}" value="no"> Is not a statistic</label><div class="feedback" id="feedback-${q.id}">Choose an answer, then check.</div></section>`).join("")}
function checkAnswers(){let score=0;for(const q of questions){const chosen=document.querySelector(`input[name="${q.id}"]:checked`);const f=document.getElementById(`feedback-${q.id}`);f.className="feedback";if(!chosen){f.textContent="No answer selected.";continue}if(chosen.value===q.answer){score++;f.textContent="Correct. "+q.explanation;f.classList.add("correct")}else{f.textContent="Not quite. "+q.explanation;f.classList.add("incorrect")}}document.getElementById("score").textContent=`Score: ${score} / ${questions.length}.`}
function resetWidget(){document.querySelectorAll("input").forEach(x=>x.checked=false);render();document.getElementById("score").textContent="Score will appear here."}
render();
</script></body></html>
