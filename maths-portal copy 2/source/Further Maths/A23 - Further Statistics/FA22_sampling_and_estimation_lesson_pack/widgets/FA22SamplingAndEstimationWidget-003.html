<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FA22SamplingAndEstimationWidget-003</title>
<style>:root{--canvas:#FAF9F6;--ivory:#FFFFF0;--line:#E5E5EA;--gold:#C5A059;--deep-gold:#D4AF37;--blush:#FBEFEF;--ink:#2C2C2E}body{margin:0;background:var(--canvas);color:var(--ink);font-family:Arial,sans-serif;line-height:1.5}main{max-width:1080px;margin:0 auto;padding:32px 18px 48px}h1{font-family:Georgia,serif}.panel{background:var(--ivory);border:1px solid var(--line);border-radius:18px;padding:16px;margin:18px 0}.warning{background:var(--blush);border-left:6px solid var(--deep-gold)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}label{display:block;font-weight:700}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px}button{border:none;border-radius:999px;padding:11px 18px;background:var(--gold);font-weight:700;margin:12px 8px 0 0}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:14px}.value{font-family:Georgia,serif;font-size:1.35rem}.steps{white-space:pre-wrap;font-family:Georgia,serif;background:white;border:1px solid var(--line);border-radius:12px;padding:14px}</style></head>
<body><main><h1>Confidence interval and sample-size calculator</h1><section class="panel warning"><strong>Important:</strong> enter a standard deviation, not a variance. Formula: x̄ ± zσ/√n.</section><section class="panel"><div class="grid"><div><label>Sample mean x̄</label><input id="xbar" type="number" step="any" value="5.30"></div><div><label>Standard deviation σ or s</label><input id="sd" type="number" step="any" value="1.5"></div><div><label>Sample size n</label><input id="n" type="number" value="100"></div><div><label>Confidence</label><select id="confidence" onchange="updateZ()"><option value="90">90%</option><option value="95" selected>95%</option><option value="99">99%</option><option value="custom">Custom z</option></select></div><div><label>z</label><input id="z" type="number" step="any" value="1.96"></div></div><button onclick="calculateCI()">Calculate CI</button></section><section class="panel"><h2>Output</h2><div class="grid"><div class="card">SE<div class="value" id="se">—</div></div><div class="card">Margin<div class="value" id="margin">—</div></div><div class="card">Lower<div class="value" id="lower">—</div></div><div class="card">Upper<div class="value" id="upper">—</div></div><div class="card">Width<div class="value" id="width">—</div></div></div><div class="steps" id="ciSteps"></div></section><section class="panel"><h2>Sample size</h2><label>Target margin of error E</label><input id="targetMargin" type="number" step="any" placeholder="e.g. 0.8"><label>Target total width W</label><input id="targetWidth" type="number" step="any" placeholder="e.g. 4"><button onclick="calculateSampleSize()">Calculate required n</button><div class="steps" id="nSteps"></div></section></main>
<script>
const zValues={90:1.6449,95:1.96,99:2.5758}; const num=id=>Number(document.getElementById(id).value); const fmt=x=>Number.isFinite(x)?Number(x.toFixed(6)).toString():"—";
function updateZ(){const c=document.getElementById("confidence").value;if(c!=="custom")document.getElementById("z").value=zValues[c];}
function calculateCI(){const xbar=num("xbar"),sd=num("sd"),n=num("n"),z=num("z"); if(sd<=0||n<=0||z<=0){document.getElementById("ciSteps").textContent="Enter positive sd, n and z.";return} const se=sd/Math.sqrt(n), margin=z*se, lower=xbar-margin, upper=xbar+margin, width=2*margin; for(const [id,val] of Object.entries({se,margin,lower,upper,width})){document.getElementById(id).textContent=fmt(val)} document.getElementById("ciSteps").textContent=`SE = σ/√n = ${fmt(sd)}/√${n} = ${fmt(se)}\nMargin = z × SE = ${fmt(z)} × ${fmt(se)} = ${fmt(margin)}\nCI: ${fmt(lower)} < μ < ${fmt(upper)}\nWidth = ${fmt(width)}`;}
function calculateSampleSize(){const sd=num("sd"),z=num("z"),E=num("targetMargin"),W=num("targetWidth");let t=""; if(E>0){const raw=Math.pow(z*sd/E,2); t+=`Margin condition: n ≥ (zσ/E)² = ${fmt(raw)}, so n = ${Math.ceil(raw)}\n`;} if(W>0){const raw=Math.pow(2*z*sd/W,2); t+=`Width condition: n ≥ (2zσ/W)² = ${fmt(raw)}, so n = ${Math.ceil(raw)}\n`;} document.getElementById("nSteps").textContent=t||"Enter a positive target margin or width.";}
calculateCI();
</script></body></html>
