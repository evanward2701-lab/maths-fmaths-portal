<svg width="1200" height="720" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Random Variables vs Observations</title>
<desc id="desc">Notation map for X, x, Xi and xi.</desc>
<metadata>asset_id: FA22LinearCombinationsOfIndependentVariablesSVG-001; unit_code: FA22; topic_code: FA22-LINCOMB; topic_id: FA22LinearCombinationsOfIndependentVariables; source: Teacher transcript notation clarification; purpose: Clarify uppercase and lowercase notation.</metadata>
<rect width="1200" height="720" fill="#FAF9F6"/>
<text x="600" y="60" text-anchor="middle" font-family="Georgia,serif" font-size="34" fill="#2C2C2E" font-weight="700">Random Variables vs Observations</text>
<rect x="70" y="100" width="1060" height="550" rx="24" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/>
<g font-family="Arial,sans-serif" font-size="22" fill="#2C2C2E"><rect x="120" y="150" width="460" height="160" rx="18" fill="#FAF9F6" stroke="#E5E5EA"/><text x="160" y="210" font-family="Georgia,serif" font-size="44" font-style="italic">X</text><text x="230" y="205" font-weight="700">Random variable</text><text x="230" y="245">A whole distribution, not one fixed value.</text><rect x="620" y="150" width="460" height="160" rx="18" fill="#FAF9F6" stroke="#E5E5EA"/><text x="660" y="210" font-family="Georgia,serif" font-size="44" font-style="italic">x</text><text x="730" y="205" font-weight="700">Observation</text><text x="730" y="245">A particular value from X.</text><rect x="120" y="370" width="460" height="170" rx="18" fill="#FAF9F6" stroke="#E5E5EA"/><text x="160" y="430" font-family="Georgia,serif" font-size="38" font-style="italic">xᵢ</text><text x="230" y="425" font-weight="700">Specific sample values</text><text x="230" y="465">x₁, x₂, …, xₙ after observing.</text><rect x="620" y="370" width="460" height="170" rx="18" fill="#FAF9F6" stroke="#E5E5EA"/><text x="660" y="430" font-family="Georgia,serif" font-size="38" font-style="italic">Xᵢ</text><text x="730" y="425" font-weight="700">Sample random variables</text><text x="730" y="465">X₁, X₂, …, Xₙ before values are known.</text><rect x="200" y="585" width="800" height="42" rx="14" fill="#FBEFEF" stroke="#C5A059"/><text x="600" y="613" text-anchor="middle">Warning: 4X is not the same object as X₁+X₂+X₃+X₄.</text></g>
<text x="600" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#5B5B60">FA22-LINCOMB • Linear combinations of independent variables</text>
