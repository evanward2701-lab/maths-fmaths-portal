<title id="title">4X versus 4 separate X values</title>
<desc id="desc">Compare a scaled single observation and a sum of four independent observations.</desc>
<metadata>asset_id: FA22LinearCombinationsOfIndependentVariablesSVG-003; unit_code: FA22; topic_code: FA22-LINCOMB; topic_id: FA22LinearCombinationsOfIndependentVariables; source: FS2-Chp4-CombiningVars.pdf page 7; purpose: Show same mean but different variances.</metadata>
