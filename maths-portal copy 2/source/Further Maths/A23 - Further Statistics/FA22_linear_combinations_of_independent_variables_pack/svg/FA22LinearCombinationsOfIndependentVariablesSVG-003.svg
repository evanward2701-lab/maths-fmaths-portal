<text x="600" y="60" text-anchor="middle" font-family="Georgia,serif" font-size="34" fill="#2C2C2E" font-weight="700">4X versus 4 separate X values</text>
<rect x="70" y="100" width="1060" height="550" rx="24" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/>
<g font-family="Arial,sans-serif" fill="#2C2C2E"><rect x="130" y="170" width="430" height="330" rx="20" fill="#FAF9F6" stroke="#E5E5EA"/><text x="345" y="230" text-anchor="middle" font-family="Georgia,serif" font-size="36">4X</text><text x="345" y="275" text-anchor="middle" font-size="21">One observation stretched by 4</text><text x="345" y="390" text-anchor="middle" font-family="Georgia,serif" font-size="26">Var(4X)=16Var(X)</text><rect x="640" y="170" width="430" height="330" rx="20" fill="#FAF9F6" stroke="#E5E5EA"/><text x="855" y="230" text-anchor="middle" font-family="Georgia,serif" font-size="34">X₁+X₂+X₃+X₄</text><text x="855" y="275" text-anchor="middle" font-size="21">Four independent observations</text><text x="855" y="390" text-anchor="middle" font-family="Georgia,serif" font-size="26">Var(X₁+…+X₄)=4Var(X)</text><rect x="180" y="570" width="840" height="48" rx="16" fill="#FBEFEF" stroke="#C5A059"/><text x="600" y="602" text-anchor="middle" font-size="20" font-weight="700">Same expected value. Different variance.</text></g>
