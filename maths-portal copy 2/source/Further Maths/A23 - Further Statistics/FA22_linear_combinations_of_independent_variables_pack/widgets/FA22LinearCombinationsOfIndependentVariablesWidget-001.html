<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Linear Combination Distribution Calculator</title><style>body{margin:0;background:#FAF9F6;color:#2C2C2E;font-family:Arial,sans-serif}main{max-width:1000px;margin:auto;padding:24px}section{background:#FFFFF0;border:1px solid #E5E5EA;border-radius:24px;padding:22px}h1{font-family:Georgia,serif}input,select,button{padding:10px;border-radius:12px;border:1px solid #E5E5EA;margin:6px}button{background:#C5A059;color:white;font-weight:bold}.out{background:#FBEFEF;border:1px solid #C5A059;border-radius:16px;padding:14px;margin-top:12px;font-family:Georgia,serif;font-size:20px}</style></head><body><main><section><h1>Linear Combination Distribution Calculator</h1><p><strong>Asset ID:</strong> FA22LinearCombinationsOfIndependentVariablesWidget-001</p><p><strong>Source:</strong> AI-proposed teaching enhancement based on lesson evidence.</p><p>Enter values for X~N(μX,σX²), Y~N(μY,σY²), and Z=aX±bY.</p><label>μX <input id="mux" type="number" value="5"></label><label>Var(X) <input id="vx" type="number" value="4"></label><label>μY <input id="muy" type="number" value="10"></label><label>Var(Y) <input id="vy" type="number" value="9"></label><label>a <input id="a" type="number" value="3"></label><select id="sgn"><option value="1">+</option><option value="-1">−</option></select><label>b <input id="b" type="number" value="2"></label><button onclick="calc()">Calculate</button><div class="out" id="out"></div><script>function f(x){return Math.round(x*10000)/10000}function calc(){let mux=+document.getElementById('mux').value,vx=+document.getElementById('vx').value,muy=+document.getElementById('muy').value,vy=+document.getElementById('vy').value,a=+document.getElementById('a').value,b=+document.getElementById('b').value,s=+document.getElementById('sgn').value;let m=a*mux+s*b*muy,v=a*a*vx+b*b*vy;document.getElementById('out').innerHTML='Z ~ N('+f(m)+', '+f(v)+')<br>Calculator σ = √'+f(v)+' = '+f(Math.sqrt(v))+'<br>Variance adds; coefficients are squared.'}calc()</script></section></main></body></html>
