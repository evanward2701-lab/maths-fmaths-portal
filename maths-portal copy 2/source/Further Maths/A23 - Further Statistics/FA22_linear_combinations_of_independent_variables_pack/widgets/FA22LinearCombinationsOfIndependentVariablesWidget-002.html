<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>nX versus X1 + ... + Xn</title><style>body{margin:0;background:#FAF9F6;color:#2C2C2E;font-family:Arial,sans-serif}main{max-width:1000px;margin:auto;padding:24px}section{background:#FFFFF0;border:1px solid #E5E5EA;border-radius:24px;padding:22px}h1{font-family:Georgia,serif}input,select,button{padding:10px;border-radius:12px;border:1px solid #E5E5EA;margin:6px}button{background:#C5A059;color:white;font-weight:bold}.out{background:#FBEFEF;border:1px solid #C5A059;border-radius:16px;padding:14px;margin-top:12px;font-family:Georgia,serif;font-size:20px}</style></head><body><main><section><h1>nX versus X1 + ... + Xn</h1><p><strong>Asset ID:</strong> FA22LinearCombinationsOfIndependentVariablesWidget-002</p><p><strong>Source:</strong> AI-proposed teaching enhancement based on lesson evidence.</p><p>Compare one scaled observation with a sum of independent observations.</p><label>μ <input id="mu" type="number" value="30"></label><label>Var(X) <input id="v" type="number" value="16"></label><label>n <input id="n" type="number" value="4"></label><button onclick="calc()">Compare</button><div class="out" id="out"></div><script>function calc(){let mu=+document.getElementById('mu').value,v=+document.getElementById('v').value,n=+document.getElementById('n').value;document.getElementById('out').innerHTML=n+'X ~ N('+(n*mu)+', '+(n*n*v)+')<br>X₁+...+Xₙ ~ N('+(n*mu)+', '+(n*v)+')<br>Same mean, different variance.'}calc()</script></section></main></body></html>
