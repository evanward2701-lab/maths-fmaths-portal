<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Normal Probability Follow-Through</title><style>body{margin:0;background:#FAF9F6;color:#2C2C2E;font-family:Arial,sans-serif}main{max-width:1000px;margin:auto;padding:24px}section{background:#FFFFF0;border:1px solid #E5E5EA;border-radius:24px;padding:22px}h1{font-family:Georgia,serif}input,select,button{padding:10px;border-radius:12px;border:1px solid #E5E5EA;margin:6px}button{background:#C5A059;color:white;font-weight:bold}.out{background:#FBEFEF;border:1px solid #C5A059;border-radius:16px;padding:14px;margin-top:12px;font-family:Georgia,serif;font-size:20px}</style></head><body><main><section><h1>Normal Probability Follow-Through</h1><p><strong>Asset ID:</strong> FA22LinearCombinationsOfIndependentVariablesWidget-003</p><p><strong>Source:</strong> AI-proposed teaching enhancement based on lesson evidence.</p><p>Calculator translation after a combined distribution has been found.</p><label>μ <input id="mu" type="number" value="26.5"></label><label>Variance <input id="v" type="number" value="0.12"></label><label>Lower <input id="l" type="number" value="26"></label><label>Upper <input id="u" type="number" value="27"></label><button onclick="calc()">Show setup</button><div class="out" id="out"></div><script>function calc(){let mu=+document.getElementById('mu').value,v=+document.getElementById('v').value,l=+document.getElementById('l').value,u=+document.getElementById('u').value;document.getElementById('out').innerHTML='Use normal CDF with lower='+l+', upper='+u+', μ='+mu+', σ=√'+v+'='+Math.sqrt(v).toFixed(4)+'.<br>Remember: calculator uses standard deviation, not variance.'}calc()</script></section></main></body></html>
