<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">FAS2LinearRegressionSVG-003: Residual plot patterns</title>
<desc id="desc">Three residual plot panels comparing random scatter about zero, curved pattern and all-positive residuals.</desc>
<metadata>Asset ID: FAS2LinearRegressionSVG-003; Source: residual plot discussion; Purpose: residual pattern interpretation.</metadata>
<rect width="1200" height="760" fill="#FAF9F6"/><rect x="50" y="50" width="1100" height="660" rx="24" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="2"/>
<text x="85" y="100" font-family="Arial, sans-serif" font-size="34" fill="#2C2C2E" font-weight="700">Residual plots</text><text x="85" y="132" font-family="Arial, sans-serif" font-size="17" fill="#2C2C2E">For least squares residuals, positive and negative errors must balance: Σεᵢ = 0.</text>
<g><rect x="85" y="185" width="320" height="405" rx="18" fill="#FAF9F6" stroke="#E5E5EA" stroke-width="2"/><text x="110" y="225" font-family="Arial" font-size="21" fill="#2C2C2E" font-weight="700">1. Random scatter</text><line x1="125" y1="435" x2="365" y2="435" stroke="#2C2C2E" stroke-width="2"/><line x1="125" y1="520" x2="125" y2="300" stroke="#2C2C2E" stroke-width="2"/><line x1="125" y1="405" x2="365" y2="405" stroke="#D4AF37" stroke-width="2" stroke-dasharray="7 7"/><g fill="#2C2C2E"><circle cx="150" cy="390" r="6"/><circle cx="175" cy="430" r="6"/><circle cx="205" cy="374" r="6"/><circle cx="232" cy="416" r="6"/><circle cx="260" cy="398" r="6"/><circle cx="292" cy="445" r="6"/><circle cx="318" cy="385" r="6"/><circle cx="345" cy="420" r="6"/></g><text x="110" y="625" font-family="Arial" font-size="16" fill="#2C2C2E">Random about zero: suitable.</text></g>
<g><rect x="440" y="185" width="320" height="405" rx="18" fill="#FAF9F6" stroke="#E5E5EA" stroke-width="2"/><text x="465" y="225" font-family="Arial" font-size="21" fill="#2C2C2E" font-weight="700">2. Curved pattern</text><line x1="480" y1="435" x2="720" y2="435" stroke="#2C2C2E" stroke-width="2"/><line x1="480" y1="520" x2="480" y2="300" stroke="#2C2C2E" stroke-width="2"/><line x1="480" y1="405" x2="720" y2="405" stroke="#D4AF37" stroke-width="2" stroke-dasharray="7 7"/><path d="M505 470 C550 350,650 350,700 470" fill="none" stroke="#C5A059" stroke-width="3" stroke-dasharray="6 8"/><g fill="#2C2C2E"><circle cx="505" cy="465" r="6"/><circle cx="535" cy="420" r="6"/><circle cx="565" cy="382" r="6"/><circle cx="600" cy="365" r="6"/><circle cx="635" cy="382" r="6"/><circle cx="668" cy="420" r="6"/><circle cx="700" cy="465" r="6"/></g><text x="465" y="625" font-family="Arial" font-size="16" fill="#2C2C2E">Pattern: linear may fail.</text></g>
<g><rect x="795" y="185" width="320" height="405" rx="18" fill="#FAF9F6" stroke="#E5E5EA" stroke-width="2"/><text x="820" y="225" font-family="Arial" font-size="21" fill="#2C2C2E" font-weight="700">3. All positive</text><line x1="835" y1="435" x2="1075" y2="435" stroke="#2C2C2E" stroke-width="2"/><line x1="835" y1="520" x2="835" y2="300" stroke="#2C2C2E" stroke-width="2"/><line x1="835" y1="435" x2="1075" y2="435" stroke="#D4AF37" stroke-width="2" stroke-dasharray="7 7"/><g fill="#2C2C2E"><circle cx="860" cy="380" r="6"/><circle cx="890" cy="395" r="6"/><circle cx="920" cy="350" r="6"/><circle cx="950" cy="372" r="6"/><circle cx="985" cy="330" r="6"/><circle cx="1020" cy="390" r="6"/><circle cx="1050" cy="360" r="6"/></g><text x="820" y="625" font-family="Arial" font-size="16" fill="#2C2C2E">Not feasible: cannot sum to zero.</text></g>
</svg>
