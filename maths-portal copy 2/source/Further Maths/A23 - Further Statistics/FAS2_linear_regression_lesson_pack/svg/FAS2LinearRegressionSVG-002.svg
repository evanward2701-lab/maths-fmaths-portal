<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">FAS2LinearRegressionSVG-002: Least squares residual diagram</title>
<desc id="desc">Scatter diagram with regression line, observed points, predicted points and vertical dashed residuals labelled as observed minus predicted.</desc>
<metadata>Asset ID: FAS2LinearRegressionSVG-002; Source: least squares residual evidence; Purpose: show residuals.</metadata>
<rect width="1200" height="760" fill="#FAF9F6"/><rect x="60" y="48" width="1080" height="660" rx="24" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="2"/>
<text x="90" y="96" font-family="Arial, sans-serif" font-size="34" fill="#2C2C2E" font-weight="700">Least squares residuals</text><text x="90" y="128" font-family="Arial, sans-serif" font-size="17" fill="#2C2C2E">A residual is observed value minus predicted value.</text>
<rect x="120" y="170" width="730" height="460" rx="12" fill="#FAF9F6" stroke="#E5E5EA" stroke-width="2"/>
<line x1="120" y1="630" x2="870" y2="630" stroke="#2C2C2E" stroke-width="2.5"/><line x1="120" y1="630" x2="120" y2="150" stroke="#2C2C2E" stroke-width="2.5"/>
<line x1="155" y1="575" x2="820" y2="220" stroke="#C5A059" stroke-width="5" stroke-linecap="round"/><text x="602" y="245" font-family="Arial, sans-serif" font-size="18" fill="#2C2C2E" font-weight="700">ŷ = a + bx</text>
<g stroke-linecap="round"><line x1="220" y1="455" x2="220" y2="540" stroke="#2C2C2E" stroke-width="2" stroke-dasharray="7 7"/><circle cx="220" cy="540" r="5" fill="#FFFFF0" stroke="#2C2C2E" stroke-width="2"/><circle cx="220" cy="455" r="8" fill="#2C2C2E" stroke="#FFFFF0" stroke-width="2"/><line x1="310" y1="560" x2="310" y2="492" stroke="#2C2C2E" stroke-width="2" stroke-dasharray="7 7"/><circle cx="310" cy="492" r="5" fill="#FFFFF0" stroke="#2C2C2E" stroke-width="2"/><circle cx="310" cy="560" r="8" fill="#2C2C2E" stroke="#FFFFF0" stroke-width="2"/><line x1="420" y1="360" x2="420" y2="433" stroke="#2C2C2E" stroke-width="2" stroke-dasharray="7 7"/><circle cx="420" cy="433" r="5" fill="#FFFFF0" stroke="#2C2C2E" stroke-width="2"/><circle cx="420" cy="360" r="8" fill="#2C2C2E" stroke="#FFFFF0" stroke-width="2"/><line x1="520" y1="445" x2="520" y2="380" stroke="#2C2C2E" stroke-width="2" stroke-dasharray="7 7"/><circle cx="520" cy="380" r="5" fill="#FFFFF0" stroke="#2C2C2E" stroke-width="2"/><circle cx="520" cy="445" r="8" fill="#2C2C2E" stroke="#FFFFF0" stroke-width="2"/></g>
<rect x="265" y="365" width="150" height="40" rx="12" fill="#FFFFF0" stroke="#D4AF37" stroke-width="2"/><text x="281" y="391" font-family="Arial, sans-serif" font-size="16" fill="#2C2C2E" font-weight="700">εᵢ = yᵢ − ŷᵢ</text>
<rect x="890" y="170" width="250" height="460" rx="18" fill="#FAF9F6" stroke="#E5E5EA" stroke-width="2"/><text x="915" y="210" font-family="Arial, sans-serif" font-size="22" fill="#2C2C2E" font-weight="700">Residual rules</text><line x1="915" y1="226" x2="1088" y2="226" stroke="#D4AF37" stroke-width="2"/><text x="915" y="268" font-family="Arial, sans-serif" font-size="17" fill="#2C2C2E"><tspan x="915">Predicted:</tspan><tspan x="915" dy="28">ŷᵢ = a + bxᵢ</tspan><tspan x="915" dy="45">Residual:</tspan><tspan x="915" dy="28">εᵢ = yᵢ − ŷᵢ</tspan><tspan x="915" dy="45">Least squares:</tspan><tspan x="915" dy="28">minimise Σεᵢ²</tspan><tspan x="915" dy="45">Key fact:</tspan><tspan x="915" dy="28">Σεᵢ = 0</tspan></text>
</svg>
