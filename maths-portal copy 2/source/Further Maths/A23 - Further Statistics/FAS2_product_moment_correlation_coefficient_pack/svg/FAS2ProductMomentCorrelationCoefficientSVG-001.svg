<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">PMCC correlation scale from negative one to positive one</title>
  <desc id="desc">A luxury-minimalist visual showing scatter panels for r equals positive one, positive zero point eight, positive zero point four, zero, negative zero point four, negative zero point eight, and negative one.</desc>
  <metadata>Asset ID: FAS2ProductMomentCorrelationCoefficientSVG-001; Source: Chapter_2_Correlation screenshots + transcript visual explanation; Purpose: Preserve the evidence-backed correlation coefficient scale from -1 to +1.</metadata>
  <rect x="0" y="0" width="1400" height="760" fill="#FAF9F6"/>
  <text x="70" y="78" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="700" fill="#2C2C2E">Product-Moment Correlation Coefficient, r</text>
  <text x="70" y="120" font-family="Inter, Arial, sans-serif" font-size="22" fill="#2C2C2E">r measures how closely paired data fall into a straight-line pattern. It does not measure steepness.</text>
  <line x1="70" y1="155" x2="1330" y2="155" stroke="#E5E5EA" stroke-width="2"/>
  <g font-family="Inter, Arial, sans-serif" fill="#2C2C2E" font-size="24" font-weight="700"><text x="115" y="205">r = 1</text><text x="300" y="205">r ≈ 0.8</text><text x="502" y="205">r ≈ 0.4</text><text x="704" y="205">r ≈ 0</text><text x="888" y="205">r ≈ −0.4</text><text x="1090" y="205">r ≈ −0.8</text><text x="1270" y="205">r = −1</text></g>
  <g fill="#FFFFF0" stroke="#E5E5EA" stroke-width="2"><rect x="60" y="230" width="165" height="250" rx="18"/><rect x="245" y="230" width="165" height="250" rx="18"/><rect x="430" y="230" width="165" height="250" rx="18"/><rect x="615" y="230" width="165" height="250" rx="18"/><rect x="800" y="230" width="165" height="250" rx="18"/><rect x="985" y="230" width="165" height="250" rx="18"/><rect x="1170" y="230" width="165" height="250" rx="18"/></g>
