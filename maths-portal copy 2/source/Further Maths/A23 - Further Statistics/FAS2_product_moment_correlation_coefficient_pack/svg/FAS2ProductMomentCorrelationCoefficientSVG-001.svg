  <g fill="#2C2C2E"><circle cx="655" cy="360" r="4"/><circle cx="674" cy="415" r="4"/><circle cx="690" cy="328" r="4"/><circle cx="706" cy="390" r="4"/><circle cx="724" cy="350" r="4"/><circle cx="745" cy="430" r="4"/><circle cx="664" cy="300" r="4"/></g>
  <g fill="#2C2C2E"><circle cx="836" cy="318" r="4"/><circle cx="850" cy="360" r="4"/><circle cx="867" cy="342" r="4"/><circle cx="884" cy="385" r="4"/><circle cx="902" cy="365" r="4"/><circle cx="920" cy="405" r="4"/><circle cx="935" cy="425" r="4"/></g><line x1="835" y1="310" x2="940" y2="425" stroke="#C5A059" stroke-width="3"/>
  <g fill="#2C2C2E"><circle cx="1020" cy="302" r="4"/><circle cx="1034" cy="326" r="4"/><circle cx="1048" cy="340" r="4"/><circle cx="1062" cy="356" r="4"/><circle cx="1076" cy="375" r="4"/><circle cx="1090" cy="395" r="4"/><circle cx="1105" cy="414" r="4"/><circle cx="1118" cy="435" r="4"/></g><line x1="1018" y1="300" x2="1125" y2="440" stroke="#C5A059" stroke-width="3"/>
  <g fill="#2C2C2E"><circle cx="1202" cy="285" r="5"/><circle cx="1218" cy="310" r="5"/><circle cx="1234" cy="335" r="5"/><circle cx="1250" cy="360" r="5"/><circle cx="1266" cy="385" r="5"/><circle cx="1282" cy="410" r="5"/><circle cx="1298" cy="435" r="5"/></g><line x1="1198" y1="280" x2="1305" y2="445" stroke="#C5A059" stroke-width="4"/>
  <rect x="120" y="585" width="1160" height="92" rx="22" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="2"/>
  <text x="160" y="625" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#2C2C2E">Key warning</text>
  <text x="160" y="660" font-family="Inter, Arial, sans-serif" font-size="21" fill="#2C2C2E">r tells you the strength and direction of linear correlation. It does not prove causation and it does not measure gradient.</text>
</svg>
