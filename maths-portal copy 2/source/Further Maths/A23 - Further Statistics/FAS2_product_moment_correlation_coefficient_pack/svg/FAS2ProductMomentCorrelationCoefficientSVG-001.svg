  <g fill="#2C2C2E"><circle cx="95" cy="440" r="5"/><circle cx="110" cy="415" r="5"/><circle cx="125" cy="390" r="5"/><circle cx="140" cy="365" r="5"/><circle cx="155" cy="340" r="5"/><circle cx="170" cy="315" r="5"/><circle cx="185" cy="290" r="5"/></g><line x1="92" y1="445" x2="190" y2="282" stroke="#C5A059" stroke-width="4"/>
