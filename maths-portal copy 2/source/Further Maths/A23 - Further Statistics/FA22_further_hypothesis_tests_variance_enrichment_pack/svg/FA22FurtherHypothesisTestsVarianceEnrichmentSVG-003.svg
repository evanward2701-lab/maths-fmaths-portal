<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc"><title id="title">Critical regions for one-sample chi-squared variance tests</title><desc id="desc">Three chi-squared distribution diagrams showing upper-tailed, lower-tailed and two-tailed tests for a population variance.</desc><metadata>asset_id: FA22FurtherHypothesisTestsVarianceEnrichmentSVG-003; source_status: Off-spec enrichment, not CCEA core</metadata><rect width="1500" height="900" fill="#FAF9F6"/><rect x="48" y="40" width="1404" height="820" rx="30" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/><text x="750" y="94" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#2C2C2E">One-Sample Variance Tests using χ²</text><text x="750" y="128" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6B6B70">Test statistic: T = (n - 1)S² / σ₀², with T ~ χ²ₙ₋₁ under H₀</text><rect x="80" y="175" width="420" height="520" rx="26" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="2"/><rect x="540" y="175" width="420" height="520" rx="26" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="2"/><rect x="1000" y="175" width="420" height="520" rx="26" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="2"/><text x="290" y="220" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#C5A059">Upper-tailed</text><text x="750" y="220" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#C5A059">Lower-tailed</text><text x="1210" y="220" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#C5A059">Two-tailed</text><text x="290" y="254" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#2C2C2E">H₁: σ² &gt; σ₀²</text><text x="750" y="254" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#2C2C2E">H₁: σ² &lt; σ₀²</text><text x="1210" y="254" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#2C2C2E">H₁: σ² ≠ σ₀²</text><line x1="130" y1="510" x2="450" y2="510" stroke="#2C2C2E" stroke-width="2"/><path d="M130 510 C150 415, 180 325, 238 315 C315 303, 352 420, 450 508" fill="none" stroke="#2C2C2E" stroke-width="4"/><path d="M370 470 C398 493, 425 505, 450 508 L450 510 L370 510 Z" fill="#FBEFEF"/><line x1="370" y1="510" x2="370" y2="470" stroke="#C5A059" stroke-width="3" stroke-dasharray="8 7"/><text x="290" y="600" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#2C2C2E">Critical region: T &gt; χ²ν(α)</text><line x1="590" y1="510" x2="910" y2="510" stroke="#2C2C2E" stroke-width="2"/><path d="M590 510 C610 415, 640 325, 698 315 C775 303, 812 420, 910 508" fill="none" stroke="#2C2C2E" stroke-width="4"/><path d="M590 510 C600 470, 610 438, 642 386 L642 510 Z" fill="#FBEFEF"/><text x="750" y="600" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#2C2C2E">Critical region: T &lt; χ²ν(1 - α)</text><line x1="1050" y1="510" x2="1370" y2="510" stroke="#2C2C2E" stroke-width="2"/><path d="M1050 510 C1070 415, 1100 325, 1158 315 C1235 303, 1272 420, 1370 508" fill="none" stroke="#2C2C2E" stroke-width="4"/><path d="M1050 510 C1060 472, 1070 441, 1102 392 L1102 510 Z" fill="#FBEFEF"/><path d="M1290 470 C1318 493, 1345 505, 1370 508 L1370 510 L1290 510 Z" fill="#FBEFEF"/><text x="1210" y="600" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#2C2C2E">Critical regions: both tails</text><rect x="170" y="735" width="1160" height="74" rx="22" fill="#2C2C2E"/><text x="750" y="766" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFF0">Decision sentence: compare T to the critical region, then answer in context.</text><text x="750" y="795" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#FFFFF0">Required assumption: the population is normally distributed.</text></svg>
