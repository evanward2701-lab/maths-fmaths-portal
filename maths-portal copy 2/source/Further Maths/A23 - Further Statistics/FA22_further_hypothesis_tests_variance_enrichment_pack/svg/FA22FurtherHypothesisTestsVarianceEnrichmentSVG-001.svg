<!-- File: svg/FA22FurtherHypothesisTestsVarianceEnrichmentSVG-001.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Derivation map for chi-squared variance statistic</title>
  <desc id="desc">A structured derivation showing how total standardised squared variation splits into sample spread variation and sample mean variation, leaving n minus 1 degrees of freedom for sample variance.</desc>
  <metadata>asset_id: FA22FurtherHypothesisTestsVarianceEnrichmentSVG-001; source_status: Off-spec enrichment, not CCEA core</metadata>
  <defs><marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#C5A059"/></marker></defs>
  <rect width="1500" height="900" fill="#FAF9F6"/><rect x="50" y="40" width="1400" height="820" rx="30" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/>
  <text x="750" y="95" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#2C2C2E">Why (n - 1)S² / σ² has a χ² distribution</text>
  <text x="750" y="128" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6B6B70">Enrichment derivation: the sample mean uses one degree of freedom</text>
  <rect x="95" y="170" width="390" height="140" rx="22" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="2"/><text x="290" y="205" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#C5A059">Start with normal data</text><text x="130" y="247" font-family="Inter, Arial, sans-serif" font-size="22" fill="#2C2C2E">Xᵢ ~ N(μ, σ²)</text><text x="130" y="282" font-family="Inter, Arial, sans-serif" font-size="22" fill="#2C2C2E">Zᵢ = (Xᵢ - μ) / σ</text>
  <rect x="555" y="170" width="390" height="140" rx="22" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="2"/><text x="750" y="205" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#C5A059">Sum squared Z-values</text><text x="595" y="250" font-family="Inter, Arial, sans-serif" font-size="23" fill="#2C2C2E">Σ[(Xᵢ - μ) / σ]² ~ χ²ₙ</text><text x="595" y="286" font-family="Inter, Arial, sans-serif" font-size="16" fill="#6B6B70">n independent squared standard normals</text>
  <rect x="1015" y="170" width="390" height="140" rx="22" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="2"/><text x="1210" y="205" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#C5A059">Sneaky numerator split</text><text x="1048" y="250" font-family="Inter, Arial, sans-serif" font-size="21" fill="#2C2C2E">Xᵢ - μ = (Xᵢ - x̄) + (x̄ - μ)</text><text x="1048" y="286" font-family="Inter, Arial, sans-serif" font-size="16" fill="#6B6B70">Subtract and add x̄: no value is changed</text>
  <path d="M485 240 H535" stroke="#C5A059" stroke-width="4" marker-end="url(#arrowGold)"/><path d="M945 240 H995" stroke="#C5A059" stroke-width="4" marker-end="url(#arrowGold)"/>
  <rect x="130" y="390" width="1240" height="155" rx="24" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="2"/><text x="750" y="428" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#2C2C2E">Expand the square and sum</text><text x="180" y="480" font-family="Inter, Arial, sans-serif" font-size="22" fill="#2C2C2E">Σ[(Xᵢ - μ) / σ]² =</text><text x="465" y="480" font-family="Inter, Arial, sans-serif" font-size="22" fill="#C5A059">Σ[(Xᵢ - x̄)² / σ²]</text><text x="735" y="480" font-family="Inter, Arial, sans-serif" font-size="22" fill="#2C2C2E">+ 2(x̄ - μ)/σ² ·</text><text x="945" y="480" font-family="Inter, Arial, sans-serif" font-size="22" fill="#2C2C2E">Σ(Xᵢ - x̄)</text><text x="1075" y="480" font-family="Inter, Arial, sans-serif" font-size="22" fill="#2C2C2E">+ n(x̄ - μ)²/σ²</text><line x1="945" y1="491" x2="1075" y2="491" stroke="#D75A4A" stroke-width="4"/><text x="1010" y="525" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#D75A4A">equals 0</text>
  <rect x="120" y="625" width="360" height="130" rx="22" fill="#FBEFEF" stroke="#E5E5EA" stroke-width="2"/><text x="300" y="663" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#2C2C2E">Sample-spread part</text><text x="154" y="710" font-family="Inter, Arial, sans-serif" font-size="24" fill="#2C2C2E">Σ[(Xᵢ - x̄)² / σ²]</text><text x="154" y="738" font-family="Inter, Arial, sans-serif" font-size="17" fill="#6B6B70">This becomes (n - 1)S² / σ²</text>
  <rect x="570" y="625" width="360" height="130" rx="22" fill="#FAF9F6" stroke="#E5E5EA" stroke-width="2"/><text x="750" y="663" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#2C2C2E">Sample-mean part</text><text x="608" y="710" font-family="Inter, Arial, sans-serif" font-size="24" fill="#2C2C2E">[(x̄ - μ)/(σ/√n)]²</text><text x="608" y="738" font-family="Inter, Arial, sans-serif" font-size="17" fill="#6B6B70">This is one squared standard normal</text>
  <rect x="1020" y="625" width="360" height="130" rx="22" fill="#FBEFEF" stroke="#E5E5EA" stroke-width="2"/><text x="1200" y="663" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#2C2C2E">Degrees of freedom</text><text x="1058" y="710" font-family="Inter, Arial, sans-serif" font-size="24" fill="#2C2C2E">χ²ₙ = χ²ₙ₋₁ + χ²₁</text><text x="1058" y="738" font-family="Inter, Arial, sans-serif" font-size="17" fill="#6B6B70">One degree used by x̄, so n - 1 remain</text>
  <path d="M480 690 H550" stroke="#C5A059" stroke-width="4" marker-end="url(#arrowGold)"/><path d="M930 690 H1000" stroke="#C5A059" stroke-width="4" marker-end="url(#arrowGold)"/>
  <rect x="430" y="790" width="640" height="46" rx="23" fill="#2C2C2E"/><text x="750" y="821" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFF0">Therefore: (n - 1)S² / σ² ~ χ²ₙ₋₁</text>
</svg>
