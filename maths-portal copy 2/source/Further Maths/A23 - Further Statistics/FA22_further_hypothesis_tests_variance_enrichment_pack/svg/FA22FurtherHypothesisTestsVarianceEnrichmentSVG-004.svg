<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="880" viewBox="0 0 1500 880" role="img" aria-labelledby="title desc"><title id="title">F-distribution order and reciprocal rule</title><desc id="desc">A diagram showing how F distribution order matters, with two differently shaped F curves and a reciprocal rule panel.</desc><metadata>asset_id: FA22FurtherHypothesisTestsVarianceEnrichmentSVG-004; source_status: Off-spec enrichment, not CCEA core</metadata><defs><marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#C5A059"/></marker></defs><rect width="1500" height="880" fill="#FAF9F6"/><rect x="50" y="40" width="1400" height="800" rx="30" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/><text x="750" y="95" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#2C2C2E">F-Distribution: Order Matters</text><text x="750" y="128" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6B6B70">Used for comparing two population variances in off-spec enrichment</text><rect x="90" y="170" width="800" height="520" rx="26" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="2"/><text x="490" y="214" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#C5A059">Same degrees, different order, different shape</text><line x1="150" y1="590" x2="825" y2="590" stroke="#2C2C2E" stroke-width="3"/><path d="M150 590 C175 420, 225 300, 310 310 C400 322, 445 470, 525 535 C605 585, 720 590, 825 590" fill="none" stroke="#2C2C2E" stroke-width="5"/><path d="M150 590 C182 520, 238 430, 330 400 C455 360, 560 470, 650 535 C720 580, 775 588, 825 590" fill="none" stroke="#C5A059" stroke-width="5" stroke-dasharray="12 10"/><rect x="570" y="290" width="250" height="98" rx="18" fill="#FAF9F6" stroke="#E5E5EA" stroke-width="2"/><line x1="592" y1="322" x2="650" y2="322" stroke="#2C2C2E" stroke-width="5"/><text x="665" y="329" font-family="Inter, Arial, sans-serif" font-size="18" fill="#2C2C2E">F₄,₁₄</text><line x1="592" y1="362" x2="650" y2="362" stroke="#C5A059" stroke-width="5" stroke-dasharray="10 8"/><text x="665" y="369" font-family="Inter, Arial, sans-serif" font-size="18" fill="#2C2C2E">F₁₄,₄</text><text x="485" y="638" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#6B6B70">F is positive and right-skewed. It is not symmetric.</text><rect x="950" y="170" width="460" height="520" rx="26" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="2"/><text x="1180" y="214" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#C5A059">Test statistic</text><text x="990" y="270" font-family="Inter, Arial, sans-serif" font-size="22" fill="#2C2C2E">H₀: σ₁² = σ₂²</text><text x="990" y="320" font-family="Inter, Arial, sans-serif" font-size="22" fill="#2C2C2E">F = S₁² / S₂²</text><text x="990" y="370" font-family="Inter, Arial, sans-serif" font-size="22" fill="#2C2C2E">F ~ Fₙ₁₋₁,ₙ₂₋₁</text><text x="990" y="454" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#2C2C2E">Numerator controls first df:</text><text x="990" y="490" font-family="Inter, Arial, sans-serif" font-size="20" fill="#2C2C2E">S₁² uses n₁ - 1</text><text x="990" y="540" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#2C2C2E">Denominator controls second df:</text><text x="990" y="576" font-family="Inter, Arial, sans-serif" font-size="20" fill="#2C2C2E">S₂² uses n₂ - 1</text><rect x="180" y="720" width="1140" height="78" rx="24" fill="#2C2C2E"/><text x="750" y="750" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFF0">Reciprocal rule for lower-tail values</text><text x="750" y="780" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#FFFFF0">Switch degrees of freedom, take the reciprocal, reverse the inequality sign.</text><path d="M512 698 C580 725, 658 735, 725 747" fill="none" stroke="#C5A059" stroke-width="4" marker-end="url(#arrowGold)"/><path d="M1040 698 C970 725, 895 735, 820 747" fill="none" stroke="#C5A059" stroke-width="4" marker-end="url(#arrowGold)"/></svg>
