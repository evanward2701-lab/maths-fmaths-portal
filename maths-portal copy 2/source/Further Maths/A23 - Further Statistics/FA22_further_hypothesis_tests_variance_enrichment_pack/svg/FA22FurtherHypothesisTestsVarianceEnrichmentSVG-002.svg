<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc"><title id="title">Chi-squared confidence interval for population variance</title><desc id="desc">A right-skewed chi-squared curve with two tail values and the middle 95 percent shaded, connected to the confidence interval formula for sigma squared.</desc><metadata>asset_id: FA22FurtherHypothesisTestsVarianceEnrichmentSVG-002; source_status: Off-spec enrichment, not CCEA core</metadata><defs><linearGradient id="midShade" x1="0" x2="1"><stop offset="0" stop-color="#FBEFEF" stop-opacity="0.9"/><stop offset="1" stop-color="#D4AF37" stop-opacity="0.25"/></linearGradient></defs><rect width="1500" height="850" fill="#FAF9F6"/><rect x="52" y="42" width="1396" height="766" rx="30" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/><text x="750" y="96" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#2C2C2E">Confidence Interval for σ² using χ²</text><text x="750" y="130" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6B6B70">Off-spec enrichment: upper-tail table notation makes the formula look reversed until the denominators speak</text><line x1="145" y1="555" x2="920" y2="555" stroke="#2C2C2E" stroke-width="3"/><path d="M145 555 C175 440, 210 275, 300 245 C390 215, 455 300, 520 385 C600 490, 700 535, 920 552" fill="none" stroke="#2C2C2E" stroke-width="5"/><path d="M220 555 C250 370, 300 245, 385 260 C468 276, 530 400, 610 480 C685 528, 760 545, 835 552 L835 555 Z" fill="url(#midShade)"/><line x1="220" y1="555" x2="220" y2="305" stroke="#C5A059" stroke-width="3" stroke-dasharray="8 8"/><line x1="835" y1="555" x2="835" y2="512" stroke="#C5A059" stroke-width="3" stroke-dasharray="8 8"/><text x="220" y="590" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#2C2C2E">χ²ν(0.975)</text><text x="835" y="590" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#2C2C2E">χ²ν(0.025)</text><text x="526" y="350" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#C5A059">Middle 95%</text><rect x="980" y="210" width="390" height="440" rx="26" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="2"/><text x="1175" y="253" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#C5A059">Formula pathway</text><text x="1015" y="340" font-family="Inter, Arial, sans-serif" font-size="23" fill="#2C2C2E">(n - 1)S² / σ² ~ χ²ₙ₋₁</text><text x="1015" y="430" font-family="Inter, Arial, sans-serif" font-size="22" fill="#2C2C2E">χ²ν(0.975) &lt; statistic &lt; χ²ν(0.025)</text><text x="1015" y="575" font-family="Inter, Arial, sans-serif" font-size="21" fill="#2C2C2E">(n - 1)S² / χ²ν(0.025)</text><text x="1015" y="608" font-family="Inter, Arial, sans-serif" font-size="21" fill="#2C2C2E">&lt; σ² &lt;</text><text x="1015" y="641" font-family="Inter, Arial, sans-serif" font-size="21" fill="#2C2C2E">(n - 1)S² / χ²ν(0.975)</text><rect x="180" y="680" width="1140" height="60" rx="20" fill="#2C2C2E"/><text x="750" y="707" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFF0">Memory ember: χ²ν(0.025) is large, so it sits in the lower-bound denominator.</text><text x="750" y="730" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#FFFFF0">Normality of the population is required.</text></svg>
