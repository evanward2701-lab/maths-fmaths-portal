<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">FA22TDistributionSVG-001: Standard normal curve compared with t-distribution curves</title>
  <desc id="desc">A teaching diagram comparing the standard normal distribution with t-distributions for small and larger degrees of freedom.</desc>
  <metadata>Asset ID: FA22TDistributionSVG-001; Source: Teacher transcript and Dr Frost t-distribution slides; Related lesson section: # 9.2 Normal curve versus t-curves.</metadata>
  <rect x="0" y="0" width="1200" height="760" fill="#FAF9F6"/>
  <rect x="56" y="46" width="1088" height="668" rx="26" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/>
  <text x="96" y="104" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#2C2C2E" font-weight="700">Why the t-distribution has fatter tails</text>
  <text x="96" y="144" font-family="Arial, sans-serif" font-size="19" fill="#2C2C2E">When σ is unknown, the sample standard deviation S is estimated from the same small sample.</text>
  <text x="96" y="172" font-family="Arial, sans-serif" font-size="19" fill="#2C2C2E">That extra uncertainty moves probability from the centre into the tails.</text>
  <rect x="110" y="230" width="690" height="390" rx="18" fill="#FAF9F6" stroke="#E5E5EA" stroke-width="2"/>
  <line x1="150" y1="560" x2="760" y2="560" stroke="#2C2C2E" stroke-width="2"/>
  <line x1="455" y1="560" x2="455" y2="255" stroke="#E5E5EA" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="16" fill="#2C2C2E">
    <text x="142" y="590">−3</text><text x="244" y="590">−2</text><text x="349" y="590">−1</text><text x="450" y="590">0</text><text x="552" y="590">1</text><text x="653" y="590">2</text><text x="755" y="590">3</text>
  </g>
  <path d="M150 560 C180 552, 210 540, 245 520 L245 560 Z" fill="#FBEFEF" stroke="none"/>
  <path d="M665 520 C700 540, 730 552, 760 560 L665 560 Z" fill="#FBEFEF" stroke="none"/>
  <path d="M150 546 C200 538, 245 521, 290 492 C345 456, 385 392, 420 332 C438 302, 472 302, 490 332 C525 392, 565 456, 620 492 C665 521, 710 538, 760 546" fill="none" stroke="#C5A059" stroke-width="6" stroke-linecap="round"/>
  <path d="M150 556 C205 552, 252 535, 302 497 C355 455, 395 360, 430 284 C444 253, 466 253, 480 284 C515 360, 555 455, 608 497 C658 535, 705 552, 760 556" fill="none" stroke="#D4AF37" stroke-width="4" stroke-linecap="round"/>
  <path d="M150 560 C210 558, 255 545, 305 503 C358 458, 392 339, 430 260 C444 232, 466 232, 480 260 C518 339, 552 458, 605 503 C655 545, 700 558, 760 560" fill="none" stroke="#2C2C2E" stroke-width="3.5" stroke-linecap="round"/>
  <g font-family="Arial, sans-serif" font-size="18" fill="#2C2C2E">
    <text x="850" y="354" font-weight="700">t₂</text><text x="882" y="354">small ν, fattest tails</text>
    <text x="850" y="404" font-weight="700">t₁₀</text><text x="894" y="404">closer to normal</text>
    <text x="850" y="454" font-weight="700">Z ∼ N(0, 1)</text>
  </g>
  <rect x="835" y="488" width="258" height="132" rx="16" fill="#FAF9F6" stroke="#C5A059" stroke-width="2"/>
  <text x="858" y="526" font-family="Arial, sans-serif" font-size="18" fill="#2C2C2E" font-weight="700">Key idea</text>
  <text x="858" y="558" font-family="Arial, sans-serif" font-size="17" fill="#2C2C2E">Small samples make S</text>
  <text x="858" y="582" font-family="Arial, sans-serif" font-size="17" fill="#2C2C2E">less stable, so extreme</text>
  <text x="858" y="606" font-family="Arial, sans-serif" font-size="17" fill="#2C2C2E">t-values are more likely.</text>
  <rect x="110" y="640" width="983" height="48" rx="15" fill="#FBEFEF" stroke="#E5E5EA" stroke-width="2"/>
  <text x="142" y="671" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2C2C2E">T = ( X̄ − μ ) / ( S / √n ),     ν = n − 1,     and     ν ↑  ⇒  tν → N(0, 1)</text>
</svg>
