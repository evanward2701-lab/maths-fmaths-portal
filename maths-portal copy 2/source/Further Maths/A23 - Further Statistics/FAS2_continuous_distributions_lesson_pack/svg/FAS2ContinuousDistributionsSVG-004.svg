<?xml version="1.0" encoding="UTF-8"?><svg width="1400" height="760" viewBox="0 0 1400 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">Linear transformation rules for a continuous random variable</title><desc id="desc">A diagram showing how the transformation Y equals aX plus b changes expectation and variance.</desc><rect width="1400" height="760" fill="#FAF9F6"/><text x="700" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="35" fill="#2C2C2E" font-weight="700">Linear Transformations of Random Variables</text><rect x="410" y="105" width="580" height="105" rx="24" fill="#FFFFF0" stroke="#C5A059" stroke-width="3"/><text x="700" y="170" text-anchor="middle" font-family="Georgia, serif" font-size="42" fill="#2C2C2E" font-weight="700">Y = aX + b</text><rect x="120" y="285" width="420" height="300" rx="24" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="2"/><text x="330" y="335" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#2C2C2E" font-weight="700">Original variable X</text><line x1="185" y1="500" x2="480" y2="500" stroke="#2C2C2E" stroke-width="3"/><path d="M 190 493 C 230 487, 250 445, 280 395 C 310 345, 360 345, 390 395 C 420 445, 440 487, 480 493" fill="none" stroke="#C5A059" stroke-width="5" stroke-linecap="round"/><line x1="335" y1="500" x2="335" y2="355" stroke="#D4AF37" stroke-width="4" stroke-dasharray="8 8"/><text x="335" y="535" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#2C2C2E">E(X)</text><text x="330" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#2C2C2E">spread: Var(X)</text><rect x="860" y="285" width="420" height="300" rx="24" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="2"/><text x="1070" y="335" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#2C2C2E" font-weight="700">Transformed variable Y</text><line x1="925" y1="500" x2="1220" y2="500" stroke="#2C2C2E" stroke-width="3"/><path d="M 930 493 C 985 485, 1005 425, 1035 385 C 1070 338, 1120 338, 1155 385 C 1185 425, 1205 485, 1215 493" fill="none" stroke="#C5A059" stroke-width="5" stroke-linecap="round"/><line x1="1085" y1="500" x2="1085" y2="345" stroke="#D4AF37" stroke-width="4" stroke-dasharray="8 8"/><text x="1085" y="535" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#2C2C2E">E(Y)</text><text x="1070" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#2C2C2E">spread: Var(Y)</text><path d="M 560 435 C 650 380, 750 380, 840 435" fill="none" stroke="#D4AF37" stroke-width="5"/><polygon points="840,435 819,430 829,450" fill="#D4AF37"/><text x="700" y="385" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#C5A059" font-weight="700">multiply by a, then add b</text><rect x="155" y="635" width="510" height="70" rx="16" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="2"/><text x="410" y="680" text-anchor="middle" font-family="Georgia, serif" font-size="27" fill="#2C2C2E">E(aX + b) = aE(X) + b</text><rect x="735" y="635" width="510" height="70" rx="16" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="2"/><text x="990" y="680" text-anchor="middle" font-family="Georgia, serif" font-size="27" fill="#2C2C2E">Var(aX + b) = a²Var(X)</text><rect x="420" y="230" width="560" height="48" rx="12" fill="#FBEFEF" stroke="#D4AF37" stroke-width="2"/><text x="700" y="262" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#2C2C2E" font-weight="700">+b shifts the centre, but does not change the spread.</text></svg>