<svg width="1400" height="760" viewBox="0 0 1400 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Discrete bars versus continuous probability density curve</title><desc id="desc">A two-panel comparison showing that discrete probabilities are represented by bar heights p(x), while continuous probabilities are represented by areas under a density curve f(x).</desc><rect width="1400" height="760" fill="#FAF9F6"/><text x="700" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="36" fill="#2C2C2E" font-weight="700">Discrete vs Continuous Random Variables</text><line x1="700" y1="95" x2="700" y2="705" stroke="#E5E5EA" stroke-width="3"/><text x="350" y="125" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#2C2C2E" font-weight="700">Discrete random variable</text><rect x="78" y="158" width="544" height="430" rx="18" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="2"/><line x1="145" y1="515" x2="570" y2="515" stroke="#2C2C2E" stroke-width="3"/><line x1="145" y1="515" x2="145" y2="210" stroke="#2C2C2E" stroke-width="3"/><polygon points="570,515 558,509 558,521" fill="#2C2C2E"/><polygon points="145,210 139,222 151,222" fill="#2C2C2E"/><text x="590" y="522" font-family="Georgia, serif" font-size="24" fill="#2C2C2E">x</text><text x="98" y="220" font-family="Georgia, serif" font-size="24" fill="#2C2C2E">p(x)</text><rect x="190" y="365" width="48" height="150" fill="#FBEFEF" stroke="#C5A059" stroke-width="3"/><rect x="260" y="310" width="48" height="205" fill="#FBEFEF" stroke="#C5A059" stroke-width="3"/><rect x="330" y="250" width="48" height="265" fill="#FBEFEF" stroke="#C5A059" stroke-width="3"/><rect x="400" y="340" width="48" height="175" fill="#FBEFEF" stroke="#C5A059" stroke-width="3"/><rect x="470" y="430" width="48" height="85" fill="#FBEFEF" stroke="#C5A059" stroke-width="3"/><rect x="112" y="610" width="476" height="96" rx="14" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="2"/><text x="350" y="642" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#2C2C2E">p(x) = P(X = x)</text><text x="350" y="675" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#2C2C2E">probability = bar height,  Σp(x) = 1</text><text x="1050" y="125" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#2C2C2E" font-weight="700">Continuous random variable</text><rect x="778" y="158" width="544" height="430" rx="18" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="2"/><line x1="845" y1="515" x2="1270" y2="515" stroke="#2C2C2E" stroke-width="3"/><line x1="845" y1="515" x2="845" y2="210" stroke="#2C2C2E" stroke-width="3"/><polygon points="1270,515 1258,509 1258,521" fill="#2C2C2E"/><polygon points="845,210 839,222 851,222" fill="#2C2C2E"/><text x="1290" y="522" font-family="Georgia, serif" font-size="24" fill="#2C2C2E">x</text><text x="798" y="220" font-family="Georgia, serif" font-size="24" fill="#2C2C2E">f(x)</text><path d="M 870 505 C 930 495, 950 445, 980 365 C 1015 270, 1090 260, 1130 355 C 1165 440, 1205 500, 1250 507" fill="none" stroke="#C5A059" stroke-width="5" stroke-linecap="round"/><path d="M 980 515 L 980 365 C 1015 270, 1090 260, 1130 355 L 1130 515 Z" fill="#FBEFEF" stroke="none" opacity="0.9"/><line x1="980" y1="515" x2="980" y2="365" stroke="#2C2C2E" stroke-width="2" stroke-dasharray="7 7"/><line x1="1130" y1="515" x2="1130" y2="355" stroke="#2C2C2E" stroke-width="2" stroke-dasharray="7 7"/><text x="980" y="548" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#2C2C2E">a</text><text x="1130" y="548" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#2C2C2E">b</text><rect x="812" y="610" width="476" height="96" rx="14" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="2"/><text x="1050" y="642" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#2C2C2E">∫ f(x) dx = 1</text><text x="1050" y="675" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#2C2C2E">probability = area under the curve</text><rect x="450" y="90" width="500" height="54" rx="12" fill="#FBEFEF" stroke="#D4AF37" stroke-width="2"/><text x="700" y="125" text-anchor="middle" font-family="Georgia, serif" font-size="21" fill="#2C2C2E" font-weight="700">Warning: f(x) is density, not P(X = x)</text></svg>