<?xml version="1.0" encoding="UTF-8"?><svg width="1400" height="820" viewBox="0 0 1400 820" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">Bridge from histogram frequency density to probability density</title><desc id="desc">A two-panel bridge diagram comparing histograms, where area of a bar gives frequency, with continuous probability density functions, where area under the curve gives probability.</desc><rect width="1400" height="820" fill="#FAF9F6"/><text x="700" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#2C2C2E" font-weight="700">A-Level Maths Bridge: Density Means Area Matters</text><line x1="700" y1="105" x2="700" y2="720" stroke="#E5E5EA" stroke-width="3"/><text x="350" y="122" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#2C2C2E" font-weight="700">Histogram</text><rect x="75" y="150" width="550" height="450" rx="20" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="2"/><line x1="145" y1="525" x2="570" y2="525" stroke="#2C2C2E" stroke-width="3"/><line x1="145" y1="525" x2="145" y2="210" stroke="#2C2C2E" stroke-width="3"/><text x="580" y="535" font-family="Georgia, serif" font-size="22" fill="#2C2C2E">length</text><text x="92" y="370" transform="rotate(-90 92,370)" font-family="Georgia, serif" font-size="22" fill="#2C2C2E">frequency density</text><rect x="145" y="455" width="105" height="70" fill="#FBEFEF" stroke="#C5A059" stroke-width="3"/><rect x="250" y="335" width="65" height="190" fill="#FBEFEF" stroke="#C5A059" stroke-width="3"/><rect x="315" y="270" width="115" height="255" fill="#FBEFEF" stroke="#C5A059" stroke-width="3"/><rect x="430" y="410" width="110" height="115" fill="#FBEFEF" stroke="#C5A059" stroke-width="3"/><text x="350" y="638" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#2C2C2E">frequency = class width × frequency density</text><rect x="130" y="665" width="440" height="62" rx="14" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="2"/><text x="350" y="705" text-anchor="middle" font-family="Georgia, serif" font-size="23" fill="#2C2C2E" font-weight="700">Area of a bar gives frequency.</text><text x="1050" y="122" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#2C2C2E" font-weight="700">Continuous p.d.f.</text><rect x="775" y="150" width="550" height="450" rx="20" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="2"/><line x1="845" y1="525" x2="1270" y2="525" stroke="#2C2C2E" stroke-width="3"/><line x1="845" y1="525" x2="845" y2="210" stroke="#2C2C2E" stroke-width="3"/><text x="1285" y="535" font-family="Georgia, serif" font-size="22" fill="#2C2C2E">x</text><text x="798" y="222" font-family="Georgia, serif" font-size="22" fill="#2C2C2E">f(x)</text><path d="M 865 518 C 915 508, 940 470, 970 380 C 1005 275, 1085 235, 1145 300 C 1205 365, 1210 470, 1250 515" fill="none" stroke="#2C2C2E" stroke-width="4" stroke-linecap="round"/><path d="M 980 525 L 980 355 C 1015 275, 1085 235, 1145 300 L 1145 525 Z" fill="#FBEFEF" opacity="0.95"/><path d="M 980 355 C 1015 275, 1085 235, 1145 300" fill="none" stroke="#C5A059" stroke-width="5" stroke-linecap="round"/><text x="1050" y="638" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#2C2C2E">P(a &lt; X &lt; b) = ∫ₐᵇ f(x) dx</text><rect x="830" y="665" width="440" height="62" rx="14" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="2"/><text x="1050" y="705" text-anchor="middle" font-family="Georgia, serif" font-size="23" fill="#2C2C2E" font-weight="700">Area under curve gives probability.</text><path d="M 610 390 C 660 350, 740 350, 790 390" fill="none" stroke="#D4AF37" stroke-width="4"/><polygon points="790,390 773,386 781,402" fill="#D4AF37"/><text x="700" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#C5A059" font-weight="700">same area idea</text></svg>