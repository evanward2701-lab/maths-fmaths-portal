<?xml version="1.0" encoding="UTF-8"?><svg width="1400" height="760" viewBox="0 0 1400 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">Continuous uniform distribution rectangle</title><desc id="desc">A continuous uniform distribution shown as a rectangle from a to b with height one over b minus a. A subinterval from c to d is shaded to show probability.</desc><rect width="1400" height="760" fill="#FAF9F6"/><text x="700" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="36" fill="#2C2C2E" font-weight="700">Continuous Uniform Distribution</text><rect x="110" y="110" width="1180" height="510" rx="22" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="2"/><line x1="210" y1="530" x2="1190" y2="530" stroke="#2C2C2E" stroke-width="3"/><line x1="250" y1="530" x2="250" y2="170" stroke="#2C2C2E" stroke-width="3"/><text x="1210" y="538" font-family="Georgia, serif" font-size="24" fill="#2C2C2E">x</text><text x="200" y="182" font-family="Georgia, serif" font-size="24" fill="#2C2C2E">f(x)</text><rect x="380" y="260" width="640" height="270" fill="#FBEFEF" opacity="0.35" stroke="#2C2C2E" stroke-width="4"/><rect x="560" y="260" width="250" height="270" fill="#FBEFEF" stroke="#C5A059" stroke-width="3" opacity="0.95"/><text x="380" y="570" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#2C2C2E">a</text><text x="1020" y="570" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#2C2C2E">b</text><text x="560" y="570" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#C5A059" font-weight="700">c</text><text x="810" y="570" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#C5A059" font-weight="700">d</text><text x="1040" y="268" font-family="Georgia, serif" font-size="28" fill="#2C2C2E">height = 1/(b-a)</text><text x="700" y="405" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#2C2C2E" font-weight="700">total area = 1</text><text x="685" y="332" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#C5A059" font-weight="700">shaded probability</text><rect x="130" y="650" width="540" height="64" rx="14" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="2"/><text x="400" y="692" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#2C2C2E">f(x) = 1/(b-a),  a ≤ x ≤ b</text><rect x="730" y="650" width="540" height="64" rx="14" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="2"/><text x="1000" y="692" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#2C2C2E">P(c &lt; X &lt; d) = (d-c)/(b-a)</text></svg>