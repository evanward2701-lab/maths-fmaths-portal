<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Cyclic Generator Explorer</title><style>body{font-family:Arial,sans-serif;background:#FAF9F6;color:#2C2C2E;margin:0;padding:30px}main{max-width:950px;margin:auto;background:#FFFFF0;border:1px solid #E5E5EA;border-radius:22px;padding:24px}h1{font-family:Georgia,serif}button,input,select,textarea{font:inherit;padding:10px;border-radius:10px;border:1px solid #E5E5EA;margin:6px}button{background:#D4AF37;font-weight:700;cursor:pointer}.box{background:#FBEFEF;border:1px solid #E5E5EA;border-radius:14px;padding:14px;margin:14px 0}table{border-collapse:collapse;margin-top:12px}td,th{border:1px solid #E5E5EA;padding:8px;text-align:center}</style></head><body><main><h1>Cyclic Generator Explorer</h1><div class="box"><strong>Asset ID:</strong> FAS2GroupTheoryWidget-003<br><strong>Source:</strong> AI-proposed teaching enhancement based on lesson evidence.<br><strong>Purpose:</strong> Explore generators in addition modulo n.</div><p>n: <input id="n" type="number" value="8"> a: <input id="a" type="number" value="3"></p><button onclick="run()">Generate</button><div id="out" class="box"></div></main><script>function mod(x,n){return ((x%n)+n)%n} function run(){let n=+document.getElementById("n").value,a=+document.getElementById("a").value; let cur=0,seq=[]; for(let k=1;k<=n*2;k++){cur=mod(cur+a,n); seq.push(cur); if(cur===0)break;} let set=[...new Set(seq)].sort((x,y)=>x-y); document.getElementById("out").innerHTML=`Sequence: ${seq.join(", ")}<br>Generated: {${set.join(", ")}}<br>${set.length===n?"Generator":"Not a generator"}`;} run();</script></body></html>
