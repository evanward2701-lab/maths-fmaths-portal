<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="560" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Three-cup permutation model</title><desc id="desc">Six permutations of three cups with two-row notation.</desc>
<metadata>Asset ID: FAS2GroupTheorySVG-003</metadata>
<rect width="900" height="560" fill="#FAF9F6"/>
<rect x="40" y="40" width="820" height="480" rx="24" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/>
<text x="70" y="95" font-family="Georgia, serif" font-size="30" fill="#2C2C2E" font-weight="700">Permutations of three cups</text>
<text x="70" y="145" font-family="Arial" font-size="20" fill="#2C2C2E">The six permutations of three objects form S₃.</text><g font-family="Arial" font-size="22" fill="#2C2C2E"><text x="100" y="220">(1 2 3 / 1 2 3) do nothing</text><text x="100" y="265">(1 2 3 / 2 1 3) swap 1 and 2</text><text x="100" y="310">(1 2 3 / 1 3 2) swap 2 and 3</text><text x="100" y="355">(1 2 3 / 3 2 1) swap 1 and 3</text><text x="100" y="400">(1 2 3 / 3 1 2) cycle clockwise</text><text x="100" y="445">(1 2 3 / 2 3 1) cycle anticlockwise</text></g>
</svg>