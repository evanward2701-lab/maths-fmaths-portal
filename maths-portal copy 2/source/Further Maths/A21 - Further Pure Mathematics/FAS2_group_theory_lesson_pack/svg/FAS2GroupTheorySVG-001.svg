<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="560" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Addition modulo 3 operation table</title><desc id="desc">Cayley table for G={0,1,2} under addition modulo 3.</desc>
<metadata>Asset ID: FAS2GroupTheorySVG-001</metadata>
<rect width="900" height="560" fill="#FAF9F6"/>
<rect x="40" y="40" width="820" height="480" rx="24" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/>
<text x="70" y="95" font-family="Georgia, serif" font-size="30" fill="#2C2C2E" font-weight="700">Addition modulo 3</text>
<text x="70" y="145" font-family="Arial" font-size="20" fill="#2C2C2E">G = {0,1,2}, a*b ≡ a+b (mod 3)</text>
<g font-family="Arial" font-size="26" text-anchor="middle"><rect x="150" y="190" width="360" height="280" fill="#FAF9F6" stroke="#E5E5EA"/><text x="195" y="230">*</text><text x="285" y="230">0</text><text x="375" y="230">1</text><text x="465" y="230">2</text><text x="195" y="310">0</text><text x="285" y="310">0</text><text x="375" y="310">1</text><text x="465" y="310">2</text><text x="195" y="390">1</text><text x="285" y="390">1</text><text x="375" y="390">2</text><text x="465" y="390">0</text><text x="195" y="455">2</text><text x="285" y="455">2</text><text x="375" y="455">0</text><text x="465" y="455">1</text></g><text x="560" y="250" font-family="Arial" font-size="22" fill="#2C2C2E">0 is identity.</text><text x="560" y="300" font-family="Arial" font-size="22" fill="#2C2C2E">All entries remain in G.</text><text x="560" y="350" font-family="Arial" font-size="22" fill="#2C2C2E">Closure holds.</text>
</svg>