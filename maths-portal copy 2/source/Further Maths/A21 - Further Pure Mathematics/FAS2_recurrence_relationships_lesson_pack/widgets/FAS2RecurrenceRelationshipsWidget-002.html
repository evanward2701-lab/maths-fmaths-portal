<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FAS2RecurrenceRelationshipsWidget-002</title><style>body{margin:0;background:#FAF9F6;color:#2C2C2E;font-family:Arial,sans-serif}.widget{max-width:950px;margin:24px auto;padding:24px;background:#FFFFF0;border:1px solid #E5E5EA;border-radius:24px}h1{font-family:Georgia,serif;text-align:center}.card,.out{background:#FAF9F6;border:1px solid #E5E5EA;border-radius:16px;padding:14px;margin:12px 0}input{width:100%;padding:10px;border:1px solid #E5E5EA;border-radius:10px}button{background:#C5A059;border:0;border-radius:12px;padding:12px 18px;font-weight:bold}.case{background:#FBEFEF;border-left:5px solid #C5A059;padding:12px;border-radius:12px}.formula{font-family:Georgia,serif;font-size:1.2rem}</style></head><body><main class="widget"><h1>Characteristic Equation Helper</h1><p><strong>Asset ID:</strong> FAS2RecurrenceRelationshipsWidget-002</p><section class="card"><p class="formula">uₙ = a uₙ₋₁ + b uₙ₋₂</p><label>a<input id="a" type="number" step="any" value="2"></label><label>b<input id="b" type="number" step="any" value="8"></label></section><button onclick="analyse()">Analyse recurrence</button><section id="out" class="out">Click analyse.</section></main><script>function f(x){if(Math.abs(x)<1e-10)return'0';return Number.isInteger(x)?String(x):String(Math.round(x*1e6)/1e6)}function analyse(){let a=+document.getElementById('a').value,b=+document.getElementById('b').value,D=a*a+4*b,html=`<p class="formula">Auxiliary equation: r² - ${f(a)}r - ${f(b)} = 0</p><p class="formula">Δ = ${f(D)}</p>`;if(D>1e-10){let r1=(a+Math.sqrt(D))/2,r2=(a-Math.sqrt(D))/2;html+=`<div class="case"><h3>Distinct real roots</h3><p class="formula">r=${f(r1)}, ${f(r2)}</p><p class="formula">uₙ=A(${f(r1)})ⁿ+B(${f(r2)})ⁿ</p></div>`}else if(Math.abs(D)<=1e-10){let r=a/2;html+=`<div class="case"><h3>Repeated real root</h3><p class="formula">r=${f(r)}</p><p class="formula">uₙ=(A+Bn)(${f(r)})ⁿ</p><p>Do not use Aαⁿ+Bαⁿ.</p></div>`}else{let real=a/2,imag=Math.sqrt(-D)/2,R=Math.sqrt(real*real+imag*imag),theta=Math.atan2(imag,real);html+=`<div class="case"><h3>Complex roots</h3><p class="formula">r=${f(real)}±${f(imag)}i</p><p class="formula">uₙ=${f(R)}ⁿ(Acos(n·${f(theta)})+Bsin(n·${f(theta)}))</p></div>`}out.innerHTML=html}</script></body></html>
