<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FAS2RecurrenceRelationshipsWidget-003</title><style>body{margin:0;background:#FAF9F6;color:#2C2C2E;font-family:Arial,sans-serif}.widget{max-width:1000px;margin:24px auto;padding:24px;background:#FFFFF0;border:1px solid #E5E5EA;border-radius:24px}h1{font-family:Georgia,serif;text-align:center}.card,.feedback,.scenario{background:#FAF9F6;border:1px solid #E5E5EA;border-radius:16px;padding:14px;margin:12px 0}textarea,select{width:100%;padding:10px;border:1px solid #E5E5EA;border-radius:10px;margin-bottom:12px}button{background:#C5A059;border:0;border-radius:12px;padding:12px 18px;font-weight:bold}.ok{background:#FFFFF0;border-left:5px solid #D4AF37;padding:10px;border-radius:10px}.warn{background:#FBEFEF;border-left:5px solid #C5A059;padding:10px;border-radius:10px}</style></head><body><main class="widget"><h1>Recurrence Model Critique Checker</h1><p><strong>Asset ID:</strong> FAS2RecurrenceRelationshipsWidget-003</p><section class="card"><label>Scenario<select id="sc" onchange="load()"><option value="loan">Loan repayment</option><option value="drug">Drug dosage</option><option value="savings">Savings account</option><option value="staircase">Staircase combinations</option></select></label><div id="scenario" class="scenario"></div><label>Define the variable<textarea id="var"></textarea></label><label>Write recurrence and initial condition(s)<textarea id="rec"></textarea></label><label>Give one limitation<textarea id="crit"></textarea></label></section><button onclick="check()">Check response</button><section id="fb" class="feedback">Complete the boxes and check.</section></main><script>const S={loan:['A loan begins at £5000. Each month, 2% interest is added, then £300 is repaid.',['loan','balance','month'],['1.02','300','5000'],['negative','repaid','balance','zero']],drug:['A patient receives 125 mg of a drug every 24 hours. Each day, only 10% remains.',['drug','amount','day','mg'],['0.1','125'],['timing','dose','medical','safe','ambiguous']],savings:['A savings account initially contains £600. Each month, the balance increases by 1.5%, then £80 is added.',['account','balance','month'],['1.015','80','600'],['interest','fixed','rate','constant']],staircase:['A person climbs stairs by taking one or two steps at a time.',['ways','steps'],['n-1','n-2'],['only','one','two','allowed']]};function load(){scenario.textContent=S[sc.value][0]}load();function score(t,arr){t=t.toLowerCase();return arr.filter(w=>t.includes(w.toLowerCase())).length}function check(){let s=S[sc.value],html='<h2>Feedback</h2>';html+=score(var.value,s[1])>=2?'<div class="ok">Variable definition has useful context.</div>':'<div class="warn">Add what the variable measures, units, and what n counts.</div>';html+=score(rec.value,s[2])>=2?'<div class="ok">Recurrence seems to include key update information.</div>':'<div class="warn">Check multiplier, added/subtracted amount, and initial condition.</div>';html+=score(crit.value,s[3])>=1?'<div class="ok">Criticism is context-specific.</div>':'<div class="warn">Make the limitation specific to the scenario.</div>';fb.innerHTML=html}</script></body></html>
