<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FAS2RecurrenceRelationshipsWidget-001</title><style>body{margin:0;background:#FAF9F6;color:#2C2C2E;font-family:Arial,sans-serif}.widget{max-width:1000px;margin:24px auto;padding:24px;background:#FFFFF0;border:1px solid #E5E5EA;border-radius:24px}h1{font-family:Georgia,serif;text-align:center}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card,.out{background:#FAF9F6;border:1px solid #E5E5EA;border-radius:16px;padding:14px;margin:10px 0}input,select{width:100%;padding:10px;border:1px solid #E5E5EA;border-radius:10px}button{background:#C5A059;border:0;border-radius:12px;padding:12px 18px;font-weight:bold}th{background:#FBEFEF}td,th{padding:8px;border-bottom:1px solid #E5E5EA;text-align:left}.warn{background:#FBEFEF;border-left:5px solid #C5A059;padding:10px;border-radius:10px}</style></head><body><main class="widget"><h1>Term Generator for Recurrence Relations</h1><p><strong>Asset ID:</strong> FAS2RecurrenceRelationshipsWidget-001</p><div class="grid"><div class="card"><label>Type<select id="type" onchange="toggle()"><option value="first">First-order: uₙ=a uₙ₋₁+c</option><option value="second">Second-order: uₙ=a uₙ₋₁+b uₙ₋₂+c</option></select></label></div><div class="card"><label>Terms<input id="terms" type="number" min="2" max="20" value="8"></label></div><div class="card"><label>a<input id="a" type="number" step="any" value="1"></label></div><div class="card" id="bcard"><label>b<input id="b" type="number" step="any" value="1"></label></div><div class="card"><label>c<input id="c" type="number" step="any" value="3"></label></div><div class="card"><label>u₀<input id="u0" type="number" step="any" value="3"></label></div><div class="card" id="u1card"><label>u₁<input id="u1" type="number" step="any" value="1"></label></div></div><button onclick="gen()">Generate terms</button><section class="out" id="out">Choose a recurrence type and generate terms.</section></main><script>function toggle(){let s=document.getElementById('type').value==='second';document.getElementById('bcard').style.display=s?'block':'none';document.getElementById('u1card').style.display=s?'block':'none'}toggle();function f(x){return Number.isInteger(x)?String(x):String(Math.round(x*1e6)/1e6)}function gen(){let type=type=document.getElementById('type').value,n=+terms.value,a=+document.getElementById('a').value,b=+document.getElementById('b').value,c=+document.getElementById('c').value,u0=+document.getElementById('u0').value,u1=+document.getElementById('u1').value,v=[],rows='';if(type==='first'){v[0]=u0;rows+=`<tr><td>0</td><td>${f(u0)}</td><td>Initial condition</td></tr>`;for(let i=1;i<n;i++){v[i]=a*v[i-1]+c;rows+=`<tr><td>${i}</td><td>${f(v[i])}</td><td>u${i}=${f(a)}(${f(v[i-1])})+${f(c)}=${f(v[i])}</td></tr>`}}else{v[0]=u0;v[1]=u1;rows+=`<tr><td>0</td><td>${f(u0)}</td><td>Initial condition</td></tr><tr><td>1</td><td>${f(u1)}</td><td>Initial condition</td></tr>`;for(let i=2;i<n;i++){v[i]=a*v[i-1]+b*v[i-2]+c;rows+=`<tr><td>${i}</td><td>${f(v[i])}</td><td>u${i}=${f(a)}(${f(v[i-1])})+${f(b)}(${f(v[i-2])})+${f(c)}=${f(v[i])}</td></tr>`}}out.innerHTML=`<table><thead><tr><th>n</th><th>uₙ</th><th>Substitution step</th></tr></thead><tbody>${rows}</tbody></table><div class="warn">Check you have enough initial conditions for the order.</div>`}</script></body></html>
