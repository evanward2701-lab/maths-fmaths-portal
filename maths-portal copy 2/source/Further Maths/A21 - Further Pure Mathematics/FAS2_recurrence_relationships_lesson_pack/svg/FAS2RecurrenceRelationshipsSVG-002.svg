<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Anatomy of a recurrence model</title><desc id="desc">Model components for d n equals 0.1d n-1 plus 125.</desc>
<metadata>asset_id: FAS2RecurrenceRelationshipsSVG-002; source: Transcript modelling examples</metadata>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#C5A059"/></marker><style>.bg{fill:#FAF9F6}.card{fill:#FFFFF0;stroke:#E5E5EA;stroke-width:2}.pink{fill:#FBEFEF;stroke:#E5E5EA;stroke-width:2}.gold{stroke:#C5A059;stroke-width:3;fill:none;marker-end:url(#arrow)}.title{font-family:Georgia,serif;font-size:34px;font-weight:700;fill:#2C2C2E}.h{font-family:Arial,sans-serif;font-size:22px;font-weight:700;fill:#2C2C2E}.t{font-family:Arial,sans-serif;font-size:17px;fill:#2C2C2E}.m{font-family:Georgia,serif;font-size:25px;fill:#2C2C2E}</style></defs>
<rect class="bg" width="1200" height="760"/><text class="title" x="600" y="55" text-anchor="middle">Anatomy of a recurrence model</text><rect class="card" x="160" y="120" width="880" height="90" rx="24"/><text class="m" x="600" y="175" text-anchor="middle">dₙ = 0.1dₙ₋₁ + 125,  d₀ = 125</text><rect class="card" x="90" y="300" width="230" height="130" rx="18"/><text class="h" x="205" y="340" text-anchor="middle">State variable</text><text class="m" x="205" y="382" text-anchor="middle">dₙ</text><text class="t" x="205" y="412" text-anchor="middle">amount after n days</text><rect class="pink" x="360" y="300" width="230" height="130" rx="18"/><text class="h" x="475" y="340" text-anchor="middle">Previous amount</text><text class="m" x="475" y="382" text-anchor="middle">0.1dₙ₋₁</text><text class="t" x="475" y="412" text-anchor="middle">10% remains</text><rect class="card" x="630" y="300" width="230" height="130" rx="18"/><text class="h" x="745" y="340" text-anchor="middle">New input</text><text class="m" x="745" y="382" text-anchor="middle">+125</text><text class="t" x="745" y="412" text-anchor="middle">new dose in mg</text><rect class="pink" x="900" y="300" width="210" height="130" rx="18"/><text class="h" x="1005" y="340" text-anchor="middle">Anchor</text><text class="m" x="1005" y="382" text-anchor="middle">d₀ = 125</text><rect class="card" x="200" y="540" width="360" height="105" rx="18"/><text class="h" x="380" y="580" text-anchor="middle">Assumption</text><text class="t" x="380" y="615" text-anchor="middle">Same 24-hour pattern repeats.</text><rect class="pink" x="640" y="540" width="360" height="105" rx="18"/><text class="h" x="820" y="580" text-anchor="middle">Limitation</text><text class="t" x="820" y="615" text-anchor="middle">First-dose timing must be clear.</text></svg>