<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#C5A059"/></marker><style>.bg{fill:#FAF9F6}.card{fill:#FFFFF0;stroke:#E5E5EA;stroke-width:2}.pink{fill:#FBEFEF;stroke:#E5E5EA;stroke-width:2}.gold{stroke:#C5A059;stroke-width:3;fill:none;marker-end:url(#arrow)}.title{font-family:Georgia,serif;font-size:34px;font-weight:700;fill:#2C2C2E}.h{font-family:Arial,sans-serif;font-size:22px;font-weight:700;fill:#2C2C2E}.t{font-family:Arial,sans-serif;font-size:17px;fill:#2C2C2E}.m{font-family:Georgia,serif;font-size:25px;fill:#2C2C2E}</style></defs>
<rect class="bg" width="1200" height="760"/><text class="title" x="600" y="55" text-anchor="middle">A-Level Maths Bridge</text><rect class="card" x="75" y="115" width="480" height="560" rx="24"/><rect class="pink" x="645" y="115" width="480" height="560" rx="24"/><text class="h" x="315" y="160" text-anchor="middle">Ordinary A-Level Maths</text><text class="h" x="885" y="160" text-anchor="middle">Further Maths FAS2-REC</text><text class="m" x="315" y="235" text-anchor="middle">term-to-term rule</text><path class="gold" d="M480 230 L720 230"/><text class="m" x="885" y="235" text-anchor="middle">recurrence relation</text><text class="m" x="315" y="325" text-anchor="middle">nth term</text><path class="gold" d="M480 320 L720 320"/><text class="m" x="885" y="325" text-anchor="middle">closed form</text><text class="m" x="315" y="415" text-anchor="middle">geometric sequence</text><path class="gold" d="M480 410 L720 410"/><text class="m" x="885" y="415" text-anchor="middle">uₙ = a uₙ₋₁ → Caⁿ</text><text class="m" x="315" y="505" text-anchor="middle">summation notation</text><path class="gold" d="M480 500 L720 500"/><text class="m" x="885" y="505" text-anchor="middle">u₀ + Σg(r)</text><text class="m" x="315" y="595" text-anchor="middle">quadratic equations</text><path class="gold" d="M480 590 L720 590"/><text class="m" x="885" y="595" text-anchor="middle">characteristic equation</text><rect class="card" x="210" y="700" width="780" height="40" rx="16"/><text class="t" x="600" y="725" text-anchor="middle">Bridge boundary: ordinary Maths explains background only; CCEA FAS2-REC controls the Further Maths content.</text></svg>