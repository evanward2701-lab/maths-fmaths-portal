<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Characteristic equation route</title><desc id="desc">Route from second-order recurrence to root templates.</desc>
<metadata>asset_id: FAS2RecurrenceRelationshipsSVG-004; source: CCEA LO002 + transcript second-order theory</metadata>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#C5A059"/></marker><style>.bg{fill:#FAF9F6}.card{fill:#FFFFF0;stroke:#E5E5EA;stroke-width:2}.pink{fill:#FBEFEF;stroke:#E5E5EA;stroke-width:2}.gold{stroke:#C5A059;stroke-width:3;fill:none;marker-end:url(#arrow)}.title{font-family:Georgia,serif;font-size:34px;font-weight:700;fill:#2C2C2E}.h{font-family:Arial,sans-serif;font-size:22px;font-weight:700;fill:#2C2C2E}.t{font-family:Arial,sans-serif;font-size:17px;fill:#2C2C2E}.m{font-family:Georgia,serif;font-size:25px;fill:#2C2C2E}</style></defs>
<rect class="bg" width="1200" height="760"/><text class="title" x="600" y="55" text-anchor="middle">Characteristic equation route</text><rect class="card" x="290" y="115" width="620" height="80" rx="22"/><text class="m" x="600" y="165" text-anchor="middle">uₙ = a uₙ₋₁ + b uₙ₋₂</text><path class="gold" d="M600 195 L600 260"/><rect class="pink" x="360" y="260" width="480" height="80" rx="22"/><text class="m" x="600" y="310" text-anchor="middle">r² − ar − b = 0</text><path class="gold" d="M600 340 L600 420"/><text class="h" x="600" y="390" text-anchor="middle">Solve quadratic</text><path class="gold" d="M600 420 L250 520"/><path class="gold" d="M600 420 L600 520"/><path class="gold" d="M600 420 L950 520"/><rect class="card" x="70" y="520" width="340" height="130" rx="20"/><text class="h" x="240" y="560" text-anchor="middle">Distinct roots α, β</text><text class="m" x="240" y="610" text-anchor="middle">uₙ=Aαⁿ+Bβⁿ</text><rect class="pink" x="430" y="520" width="340" height="130" rx="20"/><text class="h" x="600" y="560" text-anchor="middle">Repeated root α</text><text class="m" x="600" y="610" text-anchor="middle">uₙ=(A+Bn)αⁿ</text><rect class="card" x="790" y="520" width="340" height="130" rx="20"/><text class="h" x="960" y="560" text-anchor="middle">Complex roots</text><text class="m" x="960" y="610" text-anchor="middle">Rⁿ(Acos nθ+Bsin nθ)</text><rect class="card" x="325" y="690" width="550" height="40" rx="16"/><text class="t" x="600" y="715" text-anchor="middle">Final step: use two initial conditions to find A and B.</text></svg>