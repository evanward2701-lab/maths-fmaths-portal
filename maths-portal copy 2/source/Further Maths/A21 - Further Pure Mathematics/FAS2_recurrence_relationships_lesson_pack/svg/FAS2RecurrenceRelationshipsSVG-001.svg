<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Recursive form versus closed form</title><desc id="desc">Comparison of recursive and closed forms.</desc>
<metadata>asset_id: FAS2RecurrenceRelationshipsSVG-001; source: Transcript introduction and closed-form discussion</metadata>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#C5A059"/></marker><style>.bg{fill:#FAF9F6}.card{fill:#FFFFF0;stroke:#E5E5EA;stroke-width:2}.pink{fill:#FBEFEF;stroke:#E5E5EA;stroke-width:2}.gold{stroke:#C5A059;stroke-width:3;fill:none;marker-end:url(#arrow)}.title{font-family:Georgia,serif;font-size:34px;font-weight:700;fill:#2C2C2E}.h{font-family:Arial,sans-serif;font-size:22px;font-weight:700;fill:#2C2C2E}.t{font-family:Arial,sans-serif;font-size:17px;fill:#2C2C2E}.m{font-family:Georgia,serif;font-size:25px;fill:#2C2C2E}</style></defs>
<rect class="bg" width="1200" height="760"/><text class="title" x="600" y="55" text-anchor="middle">Recursive form versus closed form</text><rect class="card" x="70" y="120" width="500" height="500" rx="24"/><rect class="pink" x="630" y="120" width="500" height="500" rx="24"/><text class="h" x="320" y="170" text-anchor="middle">Recursive form</text><text class="m" x="320" y="220" text-anchor="middle">uₙ₊₁ = uₙ + 3,  u₀ = 3</text><circle class="card" cx="170" cy="340" r="45"/><circle class="card" cx="285" cy="340" r="45"/><circle class="card" cx="400" cy="340" r="45"/><text class="m" x="170" y="348" text-anchor="middle">3</text><text class="m" x="285" y="348" text-anchor="middle">6</text><text class="m" x="400" y="348" text-anchor="middle">9</text><path class="gold" d="M215 340 L240 340"/><path class="gold" d="M330 340 L355 340"/><text class="t" x="228" y="315" text-anchor="middle">+3</text><text class="t" x="343" y="315" text-anchor="middle">+3</text><text class="h" x="880" y="170" text-anchor="middle">Closed form</text><text class="m" x="880" y="220" text-anchor="middle">uₙ = 3n + 3</text><text class="m" x="880" y="310" text-anchor="middle">u₀ = 3(0)+3 = 3</text><text class="m" x="880" y="360" text-anchor="middle">u₁ = 3(1)+3 = 6</text><text class="m" x="880" y="410" text-anchor="middle">u₂ = 3(2)+3 = 9</text><rect class="card" x="180" y="650" width="840" height="50" rx="16"/><text class="t" x="600" y="681" text-anchor="middle">Indexing warning: u₀-starting and u₁-starting formulae can look different.</text></svg>