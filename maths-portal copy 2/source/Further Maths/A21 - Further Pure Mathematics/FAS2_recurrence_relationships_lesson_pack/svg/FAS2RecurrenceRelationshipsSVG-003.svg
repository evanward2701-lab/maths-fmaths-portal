<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">First-order recurrence method selector</title><desc id="desc">Flowchart for first-order recurrence methods.</desc>
<metadata>asset_id: FAS2RecurrenceRelationshipsSVG-003; source: Transcript solving methods</metadata>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#C5A059"/></marker><style>.bg{fill:#FAF9F6}.card{fill:#FFFFF0;stroke:#E5E5EA;stroke-width:2}.pink{fill:#FBEFEF;stroke:#E5E5EA;stroke-width:2}.gold{stroke:#C5A059;stroke-width:3;fill:none;marker-end:url(#arrow)}.title{font-family:Georgia,serif;font-size:34px;font-weight:700;fill:#2C2C2E}.h{font-family:Arial,sans-serif;font-size:22px;font-weight:700;fill:#2C2C2E}.t{font-family:Arial,sans-serif;font-size:17px;fill:#2C2C2E}.m{font-family:Georgia,serif;font-size:25px;fill:#2C2C2E}</style></defs>
<rect class="bg" width="1200" height="760"/><text class="title" x="600" y="55" text-anchor="middle">First-order recurrence method selector</text><rect class="card" x="390" y="115" width="420" height="80" rx="22"/><text class="m" x="600" y="165" text-anchor="middle">uₙ = a uₙ₋₁ + g(n)</text><path class="gold" d="M600 195 L600 250"/><rect class="pink" x="430" y="250" width="340" height="80" rx="20"/><text class="h" x="600" y="298" text-anchor="middle">Classify first</text><path class="gold" d="M430 330 L250 430"/><path class="gold" d="M600 330 L600 430"/><path class="gold" d="M770 330 L950 430"/><rect class="card" x="80" y="430" width="330" height="170" rx="20"/><text class="h" x="245" y="470" text-anchor="middle">g(n)=0</text><text class="m" x="245" y="515" text-anchor="middle">uₙ = Caⁿ</text><text class="t" x="245" y="555" text-anchor="middle">homogeneous</text><rect class="pink" x="435" y="430" width="330" height="170" rx="20"/><text class="h" x="600" y="470" text-anchor="middle">a=1</text><text class="m" x="600" y="515" text-anchor="middle">uₙ=u₀+Σg(r)</text><text class="t" x="600" y="555" text-anchor="middle">summation route</text><rect class="card" x="790" y="430" width="330" height="170" rx="20"/><text class="h" x="955" y="470" text-anchor="middle">a≠1</text><text class="m" x="955" y="515" text-anchor="middle">CF + PS</text><text class="t" x="955" y="555" text-anchor="middle">full method</text><rect class="card" x="235" y="660" width="730" height="45" rx="16"/><text class="t" x="600" y="689" text-anchor="middle">Exam whisper: do not use the summation shortcut when a ≠ 1.</text></svg>