<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">FA21IntegrationTechniquesBridgeSVG-001: Ordinary A-Level Bridge to Further Maths Reduction Formulae</title><desc id="desc">Compares ordinary A-Level integration by parts with Further Maths reduction formulae.</desc><metadata>Asset ID: FA21IntegrationTechniquesBridgeSVG-001</metadata><defs><marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#C5A059"/></marker></defs><rect width="1200" height="760" fill="#FAF9F6"/><text x="600" y="54" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="33" font-weight="700" fill="#2C2C2E">A-Level Maths Bridge: From One Integral to a Family of Integrals</text><rect x="70" y="135" width="450" height="440" rx="24" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="2"/><rect x="680" y="135" width="450" height="440" rx="24" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="2"/><rect x="95" y="160" width="400" height="58" rx="18" fill="#FFFFF0" stroke="#C5A059" stroke-width="2"/><rect x="705" y="160" width="400" height="58" rx="18" fill="#FFFFF0" stroke="#C5A059" stroke-width="2"/><g font-family="Inter, Arial, sans-serif" fill="#2C2C2E"><text x="295" y="196" text-anchor="middle" font-size="22" font-weight="700">Ordinary A-Level Maths</text><text x="905" y="196" text-anchor="middle" font-size="22" font-weight="700">Further Maths Upgrade</text><text x="115" y="256" font-size="18" font-weight="700">Aim:</text><text x="165" y="256" font-size="18">finish one integral.</text><text x="725" y="256" font-size="18" font-weight="700">Aim:</text><text x="775" y="256" font-size="18">create a recurrence.</text><text x="295" y="326" text-anchor="middle" font-size="20">∫ u v′ dx = uv − ∫ u′v dx</text><text x="905" y="321" text-anchor="middle" font-size="19">Iₙ = ∫ (power n expression) dx</text><text x="905" y="350" text-anchor="middle" font-size="18">Iₙ → Iₙ₋₁ or Iₙ₋₂</text><text x="115" y="452" font-size="17">Find ∫ x⁴eˣ dx.</text><text x="725" y="452" font-size="17">Show that Iₙ = xⁿeˣ − nIₙ₋₁.</text></g><line x1="540" y1="355" x2="660" y2="355" stroke="#C5A059" stroke-width="5" marker-end="url(#arrowGold)"/><rect x="155" y="625" width="890" height="78" rx="24" fill="#FBEFEF" stroke="#D4AF37" stroke-width="2"/><text x="600" y="656" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#2C2C2E">Exam warning</text><text x="600" y="684" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#2C2C2E">The aim is not just the answer. The aim is the formula, the earlier I-term, and the algebra that connects them.</text></svg>