<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">FA21IntegrationTechniquesSVG-002: Integration by Parts Target Map</title><desc id="desc">Shows how to choose u and v prime for common reduction formula integrals.</desc><metadata>Asset ID: FA21IntegrationTechniquesSVG-002</metadata><rect width="1200" height="900" fill="#FAF9F6"/><text x="600" y="56" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#2C2C2E">Integration by Parts Target Map</text><text x="600" y="88" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#2C2C2E">Choose u and v′ so that the leftover integral becomes an earlier I-term.</text><rect x="60" y="130" width="1080" height="66" rx="16" fill="#FFFFF0" stroke="#C5A059" stroke-width="2"/><g font-family="Inter, Arial, sans-serif" fill="#2C2C2E"><text x="195" y="170" text-anchor="middle" font-size="18" font-weight="700">Integral family</text><text x="445" y="170" text-anchor="middle" font-size="18" font-weight="700">Good u choice</text><text x="675" y="170" text-anchor="middle" font-size="18" font-weight="700">Good v′ choice</text><text x="965" y="170" text-anchor="middle" font-size="18" font-weight="700">Target earlier term</text></g><g stroke="#E5E5EA" stroke-width="2"><line x1="330" y1="130" x2="330" y2="807"/><line x1="560" y1="130" x2="560" y2="807"/><line x1="790" y1="130" x2="790" y2="807"/></g><g fill="#FFFFFF" stroke="#E5E5EA" stroke-width="2"><rect x="60" y="215" width="1080" height="118" rx="16"/><rect x="60" y="353" width="1080" height="138" rx="16"/><rect x="60" y="511" width="1080" height="138" rx="16"/><rect x="60" y="669" width="1080" height="138" rx="16"/></g><g font-family="Inter, Arial, sans-serif" fill="#2C2C2E" text-anchor="middle"><text x="195" y="258" font-size="19" font-weight="700">xⁿeˣ</text><text x="445" y="272" font-size="19">u = xⁿ</text><text x="675" y="272" font-size="19">v′ = eˣ</text><text x="965" y="286" font-size="17" font-weight="700">creates Iₙ₋₁</text><text x="195" y="395" font-size="18" font-weight="700">xⁿ(1−x)¹ᐟ²</text><text x="445" y="414" font-size="19">u = xⁿ</text><text x="675" y="399" font-size="17">v′ = (1−x)¹ᐟ²</text><text x="965" y="451" font-size="17" font-weight="700">creates Iₙ₋₁ and Iₙ</text><text x="195" y="552" font-size="19" font-weight="700">sinⁿx</text><text x="445" y="572" font-size="18">u = sinⁿ⁻¹x</text><text x="675" y="572" font-size="19">v′ = sinx</text><text x="965" y="608" font-size="17" font-weight="700">creates Iₙ₋₂ and Iₙ</text><text x="195" y="710" font-size="19" font-weight="700">cosecⁿx</text><text x="445" y="728" font-size="17">u = cosecⁿ⁻²x</text><text x="675" y="716" font-size="18">v′ = cosec²x</text><text x="965" y="766" font-size="17" font-weight="700">creates Iₙ₋₂ and Iₙ</text></g><rect x="95" y="835" width="1010" height="42" rx="16" fill="#FFFFF0" stroke="#C5A059" stroke-width="2"/><text x="600" y="862" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#2C2C2E">The winning choice manufactures an earlier indexed integral, not merely the familiar-looking choice.</text></svg>