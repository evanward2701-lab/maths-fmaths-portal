<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="820" viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">FA21IntegrationTechniquesSVG-001: Reduction Formula Ladders</title>
  <desc id="desc">Visualises reduction formulae as ladders from I_n down to base cases.</desc>
  <metadata>Asset ID: FA21IntegrationTechniquesSVG-001; Source: Transcript examples; Purpose: visualise reduction by 1 and reduction by 2.</metadata>
  <defs><marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#C5A059"/></marker></defs>
  <rect width="1200" height="820" fill="#FAF9F6"/>
  <text x="600" y="58" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#2C2C2E">Reduction Formula Ladders</text>
  <text x="600" y="92" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#2C2C2E">Each recurrence lowers the index until a base case is reached.</text>
  <rect x="70" y="130" width="315" height="72" rx="18" fill="#FFFFF0" stroke="#C5A059" stroke-width="2"/><text x="227.5" y="160" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#2C2C2E">Reduce by 1</text><text x="227.5" y="186" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#2C2C2E">Iₙ = ∫ xⁿeˣ dx</text>
  <rect x="442.5" y="130" width="315" height="72" rx="18" fill="#FFFFF0" stroke="#C5A059" stroke-width="2"/><text x="600" y="160" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#2C2C2E">Reduce by 2, even</text><text x="600" y="186" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#2C2C2E">Iₙ = ∫₀^{π/2} sinⁿx dx</text>
  <rect x="815" y="130" width="315" height="72" rx="18" fill="#FFFFF0" stroke="#C5A059" stroke-width="2"/><text x="972.5" y="160" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#2C2C2E">Reduce by 2, odd</text><text x="972.5" y="186" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#2C2C2E">Same recurrence, different base</text>
  <g font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#2C2C2E" text-anchor="middle">
    <rect x="118" y="240" width="220" height="56" rx="14" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="2"/><text x="228" y="276">I₄</text><rect x="118" y="330" width="220" height="56" rx="14" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="2"/><text x="228" y="366">I₃</text><rect x="118" y="420" width="220" height="56" rx="14" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="2"/><text x="228" y="456">I₂</text><rect x="118" y="510" width="220" height="56" rx="14" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="2"/><text x="228" y="546">I₁</text><rect x="118" y="600" width="220" height="56" rx="14" fill="#FBEFEF" stroke="#D4AF37" stroke-width="2"/><text x="228" y="636">I₀ = eˣ</text>
    <rect x="490" y="240" width="220" height="56" rx="14" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="2"/><text x="600" y="276">I₆</text><rect x="490" y="345" width="220" height="56" rx="14" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="2"/><text x="600" y="381">I₄</text><rect x="490" y="450" width="220" height="56" rx="14" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="2"/><text x="600" y="486">I₂</text><rect x="490" y="555" width="220" height="56" rx="14" fill="#FBEFEF" stroke="#D4AF37" stroke-width="2"/><text x="600" y="591">I₀ = π/2</text>
    <rect x="862" y="240" width="220" height="56" rx="14" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="2"/><text x="972" y="276">I₅</text><rect x="862" y="360" width="220" height="56" rx="14" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="2"/><text x="972" y="396">I₃</text><rect x="862" y="480" width="220" height="56" rx="14" fill="#FBEFEF" stroke="#D4AF37" stroke-width="2"/><text x="972" y="516">I₁ = 1</text>
  </g>
  <g stroke="#C5A059" stroke-width="3" marker-end="url(#arrowGold)"><line x1="228" y1="296" x2="228" y2="324"/><line x1="228" y1="386" x2="228" y2="414"/><line x1="228" y1="476" x2="228" y2="504"/><line x1="228" y1="566" x2="228" y2="594"/><line x1="600" y1="296" x2="600" y2="339"/><line x1="600" y1="401" x2="600" y2="444"/><line x1="600" y1="506" x2="600" y2="549"/><line x1="972" y1="296" x2="972" y2="354"/><line x1="972" y1="416" x2="972" y2="474"/></g>
  <rect x="120" y="740" width="960" height="46" rx="16" fill="#FFFFF0" stroke="#C5A059" stroke-width="2"/><text x="600" y="769" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#2C2C2E">Exam cue: identify whether the recurrence drops by 1 or by 2, then choose the correct base case.</text>
</svg>