<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Ordinary coordinate circle compared with Argand modulus circle</title>
  <desc id="desc">Bridge diagram comparing ordinary coordinate geometry circle notation with complex modulus notation.</desc>
  <defs>
    <style>
      .canvas{fill:#FAF9F6} .panel{fill:#FFFFF0;stroke:#E5E5EA;stroke-width:3} .title{fill:#2C2C2E;font-family:Georgia,serif;font-size:34px;font-weight:700} .body{fill:#2C2C2E;font-family:Arial,sans-serif;font-size:22px} .axis{stroke:#8E8E93;stroke-width:3} .gold{stroke:#C5A059;stroke-width:5;fill:none} .shade{fill:rgba(212,175,55,0.18);stroke:#C5A059;stroke-width:4} .point{fill:#C5A059;stroke:#2C2C2E;stroke-width:2} .open{fill:#FFFFF0;stroke:#C5A059;stroke-width:4}
    </style>
  </defs>
  <rect class="canvas" x="0" y="0" width="1200" height="720"/>
  <rect class="panel" x="60" y="90" width="1080" height="560" rx="28"/>
  <text class="title" x="600" y="150" text-anchor="middle">Bridge: coordinate circle ↔ Argand modulus circle</text>
  
  <line class="axis" x1="150" y1="500" x2="500" y2="500"/><line class="axis" x1="220" y1="220" x2="220" y2="560"/>
  <circle class="shade" cx="340" cy="360" r="90"/><circle class="point" cx="340" cy="360" r="8"/>
  <text class="body" x="325" y="265" text-anchor="middle">(x-a)²+(y-b)²=r²</text>
  <text class="body" x="340" y="385" text-anchor="middle">(a,b)</text>
  <line class="axis" x1="700" y1="500" x2="1050" y2="500"/><line class="axis" x1="770" y1="220" x2="770" y2="560"/>
  <circle class="shade" cx="890" cy="360" r="90"/><circle class="point" cx="890" cy="360" r="8"/>
  <text class="body" x="890" y="265" text-anchor="middle">|z-(a+bi)|=r</text>
  <text class="body" x="890" y="385" text-anchor="middle">a+bi ↔ (a,b)</text>
  <text class="body" x="600" y="600" text-anchor="middle">The fixed complex number a+bi is plotted at (a,b).</text>

</svg>
