<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Three standard CCEA complex-number loci on Argand diagrams</title>
  <desc id="desc">Three diagrams showing modulus circle, equal modulus perpendicular bisector and argument ray.</desc>
  <defs>
    <style>
      .canvas{fill:#FAF9F6} .panel{fill:#FFFFF0;stroke:#E5E5EA;stroke-width:3} .title{fill:#2C2C2E;font-family:Georgia,serif;font-size:34px;font-weight:700} .body{fill:#2C2C2E;font-family:Arial,sans-serif;font-size:22px} .axis{stroke:#8E8E93;stroke-width:3} .gold{stroke:#C5A059;stroke-width:5;fill:none} .shade{fill:rgba(212,175,55,0.18);stroke:#C5A059;stroke-width:4} .point{fill:#C5A059;stroke:#2C2C2E;stroke-width:2} .open{fill:#FFFFF0;stroke:#C5A059;stroke-width:4}
    </style>
  </defs>
  <rect class="canvas" x="0" y="0" width="1200" height="720"/>
  <rect class="panel" x="60" y="90" width="1080" height="560" rx="28"/>
  <text class="title" x="600" y="150" text-anchor="middle">Three core Argand loci</text>
  
  <circle class="shade" cx="240" cy="360" r="80"/><circle class="point" cx="240" cy="360" r="8"/><text class="body" x="240" y="490" text-anchor="middle">|z-a|=r</text>
  <line class="gold" x1="500" y1="470" x2="690" y2="250"/><line class="axis" x1="500" y1="300" x2="690" y2="430"/><circle class="point" cx="520" cy="420" r="8"/><circle class="point" cx="670" cy="310" r="8"/><text class="body" x="600" y="490" text-anchor="middle">|z-a|=|z-b|</text>
  <circle class="open" cx="840" cy="430" r="9"/><line class="gold" x1="840" y1="430" x2="1040" y2="250"/><text class="body" x="950" y="490" text-anchor="middle">arg(z-a)=θ</text>
  <text class="body" x="600" y="590" text-anchor="middle">Circle, perpendicular bisector, ray with excluded endpoint.</text>

</svg>
