<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Boundary inclusion and shading for simple complex-number regions</title>
  <desc id="desc">Diagram showing strict and inclusive boundaries and overlap shading.</desc>
  <defs>
    <style>
      .canvas{fill:#FAF9F6} .panel{fill:#FFFFF0;stroke:#E5E5EA;stroke-width:3} .title{fill:#2C2C2E;font-family:Georgia,serif;font-size:34px;font-weight:700} .body{fill:#2C2C2E;font-family:Arial,sans-serif;font-size:22px} .axis{stroke:#8E8E93;stroke-width:3} .gold{stroke:#C5A059;stroke-width:5;fill:none} .shade{fill:rgba(212,175,55,0.18);stroke:#C5A059;stroke-width:4} .point{fill:#C5A059;stroke:#2C2C2E;stroke-width:2} .open{fill:#FFFFF0;stroke:#C5A059;stroke-width:4}
    </style>
  </defs>
  <rect class="canvas" x="0" y="0" width="1200" height="720"/>
  <rect class="panel" x="60" y="90" width="1080" height="560" rx="28"/>
  <text class="title" x="600" y="150" text-anchor="middle">Simple regions: boundary and overlap</text>
  
  <circle class="shade" cx="280" cy="360" r="95" stroke-dasharray="10 8"/><text class="body" x="280" y="500" text-anchor="middle">|z-a|&lt;r: boundary excluded</text>
  <circle class="shade" cx="600" cy="360" r="95"/><text class="body" x="600" y="500" text-anchor="middle">|z-a|≤r: boundary included</text>
  <circle class="shade" cx="880" cy="365" r="90"/><line class="gold" x1="820" y1="440" x2="1050" y2="440"/><line class="gold" x1="820" y1="440" x2="975" y2="270"/><circle class="open" cx="820" cy="440" r="9"/><text class="body" x="930" y="500" text-anchor="middle">circle AND sector: overlap</text>
  <text class="body" x="600" y="600" text-anchor="middle">&lt;, &gt; exclude boundaries. ≤, ≥ include boundaries.</text>

</svg>
