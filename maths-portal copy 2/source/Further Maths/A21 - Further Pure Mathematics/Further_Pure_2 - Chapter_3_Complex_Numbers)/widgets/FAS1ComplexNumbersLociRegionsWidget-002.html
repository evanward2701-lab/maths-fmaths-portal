<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAS1 Complex Region Builder</title>
<style>
body{margin:0;background:#FAF9F6;color:#2C2C2E;font-family:Inter,system-ui,sans-serif}.card{max-width:1050px;margin:28px auto;background:#FFFFF0;border:1px solid #E5E5EA;border-radius:28px;padding:24px}h1{font-family:Georgia,serif;text-align:center}.grid{display:grid;grid-template-columns:320px 1fr;gap:18px}.panel{background:white;border:1px solid #E5E5EA;border-radius:18px;padding:16px}select,input,button{width:100%;padding:10px;border-radius:12px;border:1px solid #E5E5EA;margin:6px 0}button{background:#C5A059;color:white;font-weight:800}canvas{width:100%;background:#FAF9F6;border:1px solid #E5E5EA;border-radius:16px}.box{background:#FBEFEF;border-radius:14px;padding:12px;margin-top:12px}
</style></head>
<body><main class="card"><h1>Complex Region Builder</h1><p>Build a simple CCEA FAS1 region from one modulus inequality and one argument inequality. The diagram shows the overlap.</p>
<div class="grid"><section class="panel"><label>Circle inequality</label><select id="ineq"><option value="<">&lt;</option><option value="<=" selected>≤</option><option value=">">&gt;</option><option value=">=">≥</option></select><label>Lower ray</label><select id="lower"><option>-π/4</option><option selected>0</option><option>π/4</option></select><label>Upper ray</label><select id="upper"><option>π/4</option><option selected>π/2</option><option>π</option></select><button onclick="draw()">Update region</button><div class="box" id="feedback"></div></section><section class="panel"><canvas id="c" width="680" height="420"></canvas></section></div></main>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
function draw(){ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#FAF9F6';ctx.fillRect(0,0,c.width,c.height);ctx.strokeStyle='#E5E5EA';for(let x=40;x<660;x+=40){ctx.beginPath();ctx.moveTo(x,20);ctx.lineTo(x,400);ctx.stroke()}for(let y=20;y<400;y+=40){ctx.beginPath();ctx.moveTo(30,y);ctx.lineTo(660,y);ctx.stroke()}ctx.strokeStyle='#8E8E93';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(40,320);ctx.lineTo(650,320);ctx.stroke();ctx.beginPath();ctx.moveTo(100,30);ctx.lineTo(100,400);ctx.stroke();ctx.fillStyle='rgba(212,175,55,.22)';ctx.beginPath();ctx.arc(260,250,130,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#C5A059';ctx.lineWidth=4;ctx.setLineDash(document.getElementById('ineq').value.includes('=')?[]:[10,8]);ctx.beginPath();ctx.arc(260,250,130,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle='#C5A059';ctx.beginPath();ctx.moveTo(220,320);ctx.lineTo(520,320);ctx.stroke();ctx.beginPath();ctx.moveTo(220,320);ctx.lineTo(420,100);ctx.stroke();ctx.fillStyle='#FFFFF0';ctx.strokeStyle='#C5A059';ctx.beginPath();ctx.arc(220,320,8,0,Math.PI*2);ctx.fill();ctx.stroke();document.getElementById('feedback').innerHTML='Shade the overlap of the circle condition and the argument sector.<br><b>Boundary rule:</b> strict inequalities exclude boundaries; inclusive inequalities include them. The argument vertex is excluded because arg(0) is undefined.'}
draw();
</script></body></html>
