<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <metadata>
    Asset ID: FA21ProofDivisibilityLanguageSupportBridgeSVG-001
    Source: Ordinary A-Level Maths bridge + CCEA FA21-PROOF-LO001 + uploaded Number Theory notation evidence.
    Related sections: #5, #9, #12.
    Purpose: Compare ordinary factor/HCF language with formal Further Maths divisor notation and the CCEA induction proof upgrade.
  </metadata>
  <title id="title">Bridge from ordinary factor language to Further Maths proof language</title>
  <desc id="desc">A three-column bridge diagram showing ordinary factor and HCF language, formal divisor notation, and the CCEA induction proof upgrade.</desc>

  <defs>
    <style>
      .bg { fill: #FAF9F6; }
      .panel { fill: #FFFFF0; stroke: #E5E5EA; stroke-width: 2; rx: 22; }
      .panelAccent { fill: #FBEFEF; stroke: #D4AF37; stroke-width: 2; rx: 22; }
      .title { fill: #2C2C2E; font-family: Georgia, 'Times New Roman', serif; font-size: 34px; font-weight: 700; }
      .subtitle { fill: #2C2C2E; font-family: Arial, sans-serif; font-size: 17px; }
      .heading { fill: #2C2C2E; font-family: Arial, sans-serif; font-size: 22px; font-weight: 700; }
      .body { fill: #2C2C2E; font-family: Arial, sans-serif; font-size: 18px; }
      .small { fill: #2C2C2E; font-family: Arial, sans-serif; font-size: 15px; }
      .math { fill: #2C2C2E; font-family: Georgia, 'Times New Roman', serif; font-size: 21px; font-style: italic; }
      .line { stroke: #C5A059; stroke-width: 3; fill: none; }
      .softLine { stroke: #E5E5EA; stroke-width: 2; fill: none; }
      .pill { fill: #FAF9F6; stroke: #D4AF37; stroke-width: 1.5; rx: 12; }
      .warning { fill: #2C2C2E; font-family: Arial, sans-serif; font-size: 14px; }
    </style>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C5A059"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="760"/>

  <text class="title" x="60" y="70">From ordinary factors to Further Maths proof</text>
  <text class="subtitle" x="60" y="104">Bridge context only: ordinary language becomes formal notation, then proof structure for CCEA FA21-PROOF.</text>

  <rect class="panel" x="60" y="150" width="320" height="430" rx="22"/>
  <rect class="panel" x="440" y="150" width="320" height="430" rx="22"/>
  <rect class="panelAccent" x="820" y="150" width="320" height="430" rx="22"/>

  <text class="heading" x="92" y="195">Ordinary Maths language</text>
  <line class="softLine" x1="92" y1="215" x2="345" y2="215"/>
  <text class="body" x="92" y="260">“a is a factor of b”</text>
  <text class="body" x="92" y="312">“highest common factor”</text>
  <text class="body" x="92" y="364">“works for these examples”</text>
  <text class="body" x="92" y="416">factorise and simplify</text>
  <text class="small" x="92" y="488">Useful foundation, but not</text>
  <text class="small" x="92" y="510">yet a full Further Maths proof.</text>

  <text class="heading" x="472" y="195">Formal divisor language</text>
  <line class="softLine" x1="472" y1="215" x2="725" y2="215"/>
  <text class="body" x="472" y="256">“a divides b”</text>
  <text class="math" x="472" y="294">a | b</text>
  <text class="math" x="472" y="335">b = ka,  k ∈ ℤ</text>
  <text class="body" x="472" y="388">greatest common divisor</text>
  <text class="math" x="472" y="426">gcd(a,b)</text>
  <text class="small" x="472" y="488">The bracket or multiplier must</text>
  <text class="small" x="472" y="510">be an integer. That matters.</text>

  <text class="heading" x="852" y="195">CCEA proof upgrade</text>
  <line class="softLine" x1="852" y1="215" x2="1105" y2="215"/>
  <text class="body" x="852" y="256">Define the statement</text>
  <text class="math" x="852" y="294">P(n)</text>
  <text class="body" x="852" y="336">Base case</text>
  <text class="body" x="852" y="378">Inductive hypothesis</text>
  <text class="body" x="852" y="420">Inductive step</text>
  <text class="body" x="852" y="462">Final conclusion</text>
  <text class="small" x="852" y="522">This is the CCEA-core route</text>
  <text class="small" x="852" y="544">for FA21-PROOF-LO001.</text>

  <path class="line" d="M 390 365 C 405 365, 415 365, 430 365" marker-end="url(#arrowGold)"/>
  <path class="line" d="M 770 365 C 785 365, 795 365, 810 365" marker-end="url(#arrowGold)"/>

  <rect class="pill" x="88" y="620" width="1025" height="78" rx="12"/>
  <text class="warning" x="118" y="652">Boundary note: the uploaded FP2 Number Theory material supplies useful notation support, but the official CCEA core here is proof by mathematical induction.</text>
  <text class="warning" x="118" y="678">Do not replace an induction answer with algorithms, modular arithmetic, or example checking unless the question explicitly asks for that method.</text>
</svg>
