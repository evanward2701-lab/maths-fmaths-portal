<?xml version="1.0" encoding="UTF-8"?>
<svg width="1300" height="850" viewBox="0 0 1300 850" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <metadata>
    Asset ID: FA21ProofDivisibilityLanguageSupportSVG-001
    Source: Uploaded transcript + screenshot notation table.
    Related sections: #7, #9, #11.
    Purpose: Preserve the visible notation ladder as a clean learning visual.
  </metadata>
  <title id="title">Notation ladder for divisibility language</title>
  <desc id="desc">A table showing ordinary factor language, formal divisor language, notation, and examples including divides, does not divide, gcd, and coprime numbers.</desc>

  <defs>
    <style>
      .bg { fill: #FAF9F6; }
      .title { fill: #2C2C2E; font-family: Georgia, 'Times New Roman', serif; font-size: 34px; font-weight: 700; }
      .subtitle { fill: #2C2C2E; font-family: Arial, sans-serif; font-size: 16px; }
      .tableOuter { fill: #FFFFF0; stroke: #D4AF37; stroke-width: 2.5; rx: 20; }
      .header { fill: #FBEFEF; stroke: #E5E5EA; stroke-width: 1.5; }
      .cell { fill: #FFFFF0; stroke: #E5E5EA; stroke-width: 1.2; }
      .cellAlt { fill: #FAF9F6; stroke: #E5E5EA; stroke-width: 1.2; }
      .headText { fill: #2C2C2E; font-family: Arial, sans-serif; font-size: 17px; font-weight: 700; }
      .body { fill: #2C2C2E; font-family: Arial, sans-serif; font-size: 15.5px; }
      .math { fill: #2C2C2E; font-family: Georgia, 'Times New Roman', serif; font-size: 18px; font-style: italic; }
      .noteBox { fill: #FBEFEF; stroke: #C5A059; stroke-width: 1.8; rx: 16; }
      .note { fill: #2C2C2E; font-family: Arial, sans-serif; font-size: 15px; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1300" height="850"/>
  <text class="title" x="60" y="65">Divisibility notation ladder</text>
  <text class="subtitle" x="60" y="96">Evidence-backed notation support: ordinary factor language becomes precise proof language.</text>

  <rect class="tableOuter" x="60" y="130" width="1180" height="560" rx="20"/>
  <rect class="header" x="80" y="155" width="270" height="62"/>
  <rect class="header" x="350" y="155" width="310" height="62"/>
  <rect class="header" x="660" y="155" width="250" height="62"/>
  <rect class="header" x="910" y="155" width="310" height="62"/>
  <text class="headText" x="100" y="192">Previous language</text>
  <text class="headText" x="370" y="192">Further Maths language</text>
  <text class="headText" x="680" y="192">Notation</text>
  <text class="headText" x="930" y="192">Example</text>

  <rect class="cell" x="80" y="217" width="270" height="76"/><rect class="cell" x="350" y="217" width="310" height="76"/><rect class="cell" x="660" y="217" width="250" height="76"/><rect class="cell" x="910" y="217" width="310" height="76"/>
  <text class="body" x="100" y="248">factor</text><text class="body" x="370" y="248">divisor</text><text class="body" x="680" y="248">no special symbol</text><text class="body" x="930" y="248">3 is a factor of 12</text><text class="body" x="930" y="272">3 is a divisor of 12</text>

  <rect class="cellAlt" x="80" y="293" width="270" height="76"/><rect class="cellAlt" x="350" y="293" width="310" height="76"/><rect class="cellAlt" x="660" y="293" width="250" height="76"/><rect class="cellAlt" x="910" y="293" width="310" height="76"/>
  <text class="body" x="100" y="324">a is a factor of b</text><text class="body" x="370" y="324">a divides b</text><text class="math" x="680" y="326">a | b</text><text class="math" x="930" y="326">3 | 12</text>

  <rect class="cell" x="80" y="369" width="270" height="76"/><rect class="cell" x="350" y="369" width="310" height="76"/><rect class="cell" x="660" y="369" width="250" height="76"/><rect class="cell" x="910" y="369" width="310" height="76"/>
  <text class="body" x="100" y="400">a is not a factor of b</text><text class="body" x="370" y="400">a does not divide b</text><text class="math" x="680" y="402">a ∤ b</text><text class="math" x="930" y="402">5 ∤ 12</text>

  <rect class="cellAlt" x="80" y="445" width="270" height="86"/><rect class="cellAlt" x="350" y="445" width="310" height="86"/><rect class="cellAlt" x="660" y="445" width="250" height="86"/><rect class="cellAlt" x="910" y="445" width="310" height="86"/>
  <text class="body" x="100" y="476">common factor</text><text class="body" x="370" y="476">common divisor</text><text class="math" x="680" y="474">c | a</text><text class="math" x="680" y="502">c | b</text><text class="body" x="930" y="476">c divides both a and b</text>

  <rect class="cell" x="80" y="531" width="270" height="76"/><rect class="cell" x="350" y="531" width="310" height="76"/><rect class="cell" x="660" y="531" width="250" height="76"/><rect class="cell" x="910" y="531" width="310" height="76"/>
  <text class="body" x="100" y="562">highest common factor</text><text class="body" x="370" y="562">greatest common divisor</text><text class="math" x="680" y="564">gcd(a,b)</text><text class="math" x="930" y="564">gcd(15,25)=5</text>

  <rect class="cellAlt" x="80" y="607" width="270" height="58"/><rect class="cellAlt" x="350" y="607" width="310" height="58"/><rect class="cellAlt" x="660" y="607" width="250" height="58"/><rect class="cellAlt" x="910" y="607" width="310" height="58"/>
  <text class="body" x="100" y="641">HCF is 1</text><text class="body" x="370" y="641">coprime or relatively prime</text><text class="math" x="680" y="641">gcd(a,b)=1</text><text class="math" x="930" y="641">gcd(10,21)=1</text>

  <rect class="noteBox" x="80" y="720" width="1140" height="72" rx="16"/>
  <text class="note" x="110" y="752">Boundary label: evidence-backed notation support only. This visual does not claim a standalone CCEA Number Theory syllabus topic.</text>
  <text class="note" x="110" y="776">For CCEA FA21-PROOF, use this language to support mathematical induction and formal proof writing.</text>
</svg>
