<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <metadata>
    Asset ID: FA21ProofDivisibilityLanguageSupportSVG-002
    Source: Uploaded transcript proof a divides b, a divides c implies a divides bn + cm.
    Related sections: #8, #9, #11.
    Purpose: Preserve the algebraic route of the evidence-backed divisibility proof.
  </metadata>
  <title id="title">Algebra map for a direct divisibility proof</title>
  <desc id="desc">A flow diagram proving that if a divides b and a divides c, then a divides bn plus cm, using integer substitutions and factorisation.</desc>

  <defs>
    <style>
      .bg { fill: #FAF9F6; }
      .title { fill: #2C2C2E; font-family: Georgia, 'Times New Roman', serif; font-size: 34px; font-weight: 700; }
      .subtitle { fill: #2C2C2E; font-family: Arial, sans-serif; font-size: 16px; }
      .box { fill: #FFFFF0; stroke: #E5E5EA; stroke-width: 2; rx: 18; }
      .boxGold { fill: #FBEFEF; stroke: #D4AF37; stroke-width: 2.3; rx: 18; }
      .boxCore { fill: #FAF9F6; stroke: #C5A059; stroke-width: 2; rx: 18; }
      .body { fill: #2C2C2E; font-family: Arial, sans-serif; font-size: 17px; }
      .math { fill: #2C2C2E; font-family: Georgia, 'Times New Roman', serif; font-size: 24px; font-style: italic; }
      .mathSmall { fill: #2C2C2E; font-family: Georgia, 'Times New Roman', serif; font-size: 19px; font-style: italic; }
      .arrow { stroke: #C5A059; stroke-width: 3; fill: none; }
      .label { fill: #C5A059; font-family: Arial, sans-serif; font-size: 14px; font-weight: 700; }
      .noteBox { fill: #FBEFEF; stroke: #C5A059; stroke-width: 1.8; rx: 16; }
      .note { fill: #2C2C2E; font-family: Arial, sans-serif; font-size: 15px; }
    </style>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C5A059"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="900"/>
  <text class="title" x="60" y="65">Direct divisibility proof map</text>
  <text class="subtitle" x="60" y="96">Evidence-backed support: translating divisor notation into integer-multiple algebra.</text>

  <rect class="boxGold" x="90" y="145" width="430" height="120" rx="18"/>
  <text class="label" x="120" y="178">GIVEN 1</text>
  <text class="math" x="120" y="218">a | b</text>
  <text class="mathSmall" x="220" y="218">⇒ b = ka,  k ∈ ℤ</text>

  <rect class="boxGold" x="680" y="145" width="430" height="120" rx="18"/>
  <text class="label" x="710" y="178">GIVEN 2</text>
  <text class="math" x="710" y="218">a | c</text>
  <text class="mathSmall" x="810" y="218">⇒ c = ja,  j ∈ ℤ</text>

  <rect class="boxCore" x="345" y="315" width="510" height="96" rx="18"/>
  <text class="label" x="375" y="348">TARGET EXPRESSION</text>
  <text class="math" x="375" y="385">bn + cm</text>

  <path class="arrow" d="M 305 265 C 350 295, 390 305, 455 315" marker-end="url(#arrowGold)"/>
  <path class="arrow" d="M 895 265 C 850 295, 810 305, 745 315" marker-end="url(#arrowGold)"/>

  <rect class="box" x="345" y="460" width="510" height="92" rx="18"/>
  <text class="label" x="375" y="492">SUBSTITUTE</text>
  <text class="math" x="375" y="528">bn + cm = (ka)n + (ja)m</text>
  <path class="arrow" d="M 600 411 L 600 452" marker-end="url(#arrowGold)"/>

  <rect class="box" x="345" y="600" width="510" height="112" rx="18"/>
  <text class="label" x="375" y="632">FACTOR OUT a</text>
  <text class="math" x="375" y="668">bn + cm = kan + jam</text>
  <text class="math" x="375" y="700">bn + cm = a(kn + jm)</text>
  <path class="arrow" d="M 600 552 L 600 592" marker-end="url(#arrowGold)"/>

  <rect class="boxGold" x="90" y="750" width="430" height="86" rx="18"/>
  <text class="label" x="120" y="782">INTEGER CHECK</text>
  <text class="mathSmall" x="120" y="815">k,j,n,m ∈ ℤ ⇒ kn + jm ∈ ℤ</text>

  <rect class="boxCore" x="680" y="750" width="430" height="86" rx="18"/>
  <text class="label" x="710" y="782">CONCLUSION</text>
  <text class="math" x="710" y="816">∴ a | bn + cm</text>

  <path class="arrow" d="M 520 793 L 672 793" marker-end="url(#arrowGold)"/>
  <path class="arrow" d="M 600 712 C 570 735, 500 742, 382 750" marker-end="url(#arrowGold)"/>
  <path class="arrow" d="M 600 712 C 635 735, 735 742, 835 750" marker-end="url(#arrowGold)"/>

  <rect class="noteBox" x="90" y="850" width="1020" height="34" rx="16"/>
  <text class="note" x="118" y="872">Proof-language support for CCEA induction: once an expression is written as a × integer, divisibility by a follows.</text>
</svg>
