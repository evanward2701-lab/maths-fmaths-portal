<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>FAS1MatricesInvariantLinesWidget-002</title><style>:root{--canvas:#FAF9F6;--ivory:#FFFFF0;--line:#E5E5EA;--gold:#C5A059;--deep:#D4AF37;--rose:#FBEFEF;--ink:#2C2C2E;--muted:#66666A}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}main{max-width:1120px;margin:0 auto;padding:28px}.card{background:var(--ivory);border:1px solid var(--line);border-radius:24px;padding:24px}h1,h2{font-family:Georgia,serif;margin:0 0 10px}h1{font-size:30px}.layout{display:grid;grid-template-columns:330px 1fr;gap:20px;margin-top:18px}.matrix,.point{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.matrix{padding:14px;border:2px solid var(--gold);border-radius:18px;background:white}.point{margin-top:12px}label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}input{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;background:#fff;color:var(--ink)}button{border:0;border-radius:14px;background:var(--gold);color:var(--ink);padding:12px 16px;font-weight:700;cursor:pointer;margin-top:16px;width:100%}.result{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px}.math{font-family:Georgia,serif;font-size:18px;margin:6px 0;color:var(--ink)}.good{background:#f6fff6;border-left:5px solid #7bbf7b;padding:10px 12px;border-radius:12px;color:#234523}.bad{background:#fff7f7;border-left:5px solid #cf7b7b;padding:10px 12px;border-radius:12px;color:#532525}canvas{width:100%;max-width:720px;height:auto;background:#fff;border:1px solid var(--line);border-radius:22px;display:block}.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:14px}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}@media(max-width:900px){.layout{grid-template-columns:1fr}}</style></head>
<body><main><!-- Asset ID: FAS1MatricesInvariantLinesWidget-002; Source: AI-proposed teaching enhancement based on lesson evidence; Purpose: Show image point and test invariance. --><section class="card"><h1>Matrix point mover</h1><p>Enter a matrix and a point. The widget computes the image point and checks whether the original point is invariant.</p><div class="layout"><div><h2>Inputs</h2><p>Matrix A = [[a, b], [c, d]]</p><div class="matrix"><div><label for="a">a</label><input id="a" value="1"/></div><div><label for="b">b</label><input id="b" value="2"/></div><div><label for="c">c</label><input id="c" value="0"/></div><div><label for="d">d</label><input id="d" value="1"/></div></div><p style="margin-top:16px">Point P = (x, y)</p><div class="point"><div><label for="x">x</label><input id="x" value="2"/></div><div><label for="y">y</label><input id="y" value="1"/></div></div><button onclick="runMove()">Transform point</button><div class="result" id="output" aria-live="polite"></div></div><div><canvas id="grid" width="720" height="560" aria-label="Coordinate grid showing point and image point"></canvas><div class="legend"><span><span class="dot" style="background:#2C2C2E"></span>Original point P</span><span><span class="dot" style="background:#D4AF37"></span>Image point P′</span></div></div></div></section></main><script>
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=b;b=a%b;a=t}return a||1}function frac(n,d=1){if(d<0){n=-n;d=-d}const g=gcd(n,d);return{n:n/g,d:d/g}}function parseFrac(s){s=String(s).trim();if(!s)throw new Error('Blank');if(s.includes('/')){const p=s.split('/');return frac(Number(p[0]),Number(p[1]))}if(s.includes('.')){const neg=s.startsWith('-');const clean=neg?s.slice(1):s;const p=clean.split('.');const den=10**p[1].length;const num=Number(p[0])*den+Number(p[1]);return frac(neg?-num:num,den)}return frac(Number(s),1)}function add(x,y){return frac(x.n*y.d+y.n*x.d,x.d*y.d)}function mul(x,y){return frac(x.n*y.n,x.d*y.d)}function eq(x,y){return x.n===y.n&&x.d===y.d}function show(x){return x.d===1?String(x.n):x.n+'/'+x.d}function val(x){return x.n/x.d}
function runMove(){const out=document.getElementById('output');try{const a=parseFrac(aEl('a')),b=parseFrac(aEl('b')),c=parseFrac(aEl('c')),d=parseFrac(aEl('d')),x=parseFrac(aEl('x')),y=parseFrac(aEl('y'));const xp=add(mul(a,x),mul(b,y)),yp=add(mul(c,x),mul(d,y));const fixed=eq(x,xp)&&eq(y,yp);out.innerHTML=`<h2>Working</h2><div class="math">x′ = ax + by = ${show(xp)}</div><div class="math">y′ = cx + dy = ${show(yp)}</div><div class="math">P′ = (${show(xp)}, ${show(yp)})</div><div class="${fixed?'good':'bad'}">${fixed?'P is invariant because P′ = P.':'P is not invariant because P′ ≠ P.'}</div>`;draw(val(x),val(y),val(xp),val(yp))}catch(e){out.innerHTML='<div class="bad">Check the inputs. Use integers, decimals or fractions such as 3/4.</div>'}}function aEl(id){return document.getElementById(id).value}
function draw(x,y,xp,yp){const canvas=document.getElementById('grid'),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height;ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);const scale=40,ox=W/2,oy=H/2;function sx(t){return ox+t*scale}function sy(t){return oy-t*scale}ctx.strokeStyle='#E5E5EA';ctx.lineWidth=1;for(let i=-8;i<=8;i++){ctx.beginPath();ctx.moveTo(sx(i),0);ctx.lineTo(sx(i),H);ctx.stroke()}for(let j=-6;j<=6;j++){ctx.beginPath();ctx.moveTo(0,sy(j));ctx.lineTo(W,sy(j));ctx.stroke()}ctx.strokeStyle='#2C2C2E';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,oy);ctx.lineTo(W,oy);ctx.stroke();ctx.beginPath();ctx.moveTo(ox,0);ctx.lineTo(ox,H);ctx.stroke();ctx.strokeStyle='#D4AF37';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(sx(x),sy(y));ctx.lineTo(sx(xp),sy(yp));ctx.stroke();point(x,y,'#2C2C2E','P');point(xp,yp,'#D4AF37','P′');function point(px,py,color,label){ctx.fillStyle=color;ctx.beginPath();ctx.arc(sx(px),sy(py),7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#2C2C2E';ctx.font='16px Georgia';ctx.fillText(label,sx(px)+10,sy(py)-10)}}runMove();
</script></body></html>
