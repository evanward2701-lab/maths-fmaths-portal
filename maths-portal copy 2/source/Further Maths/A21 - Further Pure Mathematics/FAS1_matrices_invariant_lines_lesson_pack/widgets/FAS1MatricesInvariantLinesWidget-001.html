<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FAS1MatricesInvariantLinesWidget-001</title>
  <style>
    :root{--canvas:#FAF9F6;--ivory:#FFFFF0;--line:#E5E5EA;--gold:#C5A059;--deep:#D4AF37;--rose:#FBEFEF;--ink:#2C2C2E;--muted:#66666A}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}main{max-width:1050px;margin:0 auto;padding:28px}.card{background:var(--ivory);border:1px solid var(--line);border-radius:24px;padding:24px}h1,h2{font-family:Georgia,serif;margin:0 0 10px;font-weight:700}h1{font-size:30px}h2{font-size:21px;margin-top:18px}p{margin:8px 0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:18px}.matrix{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:260px;padding:14px;border:2px solid var(--gold);border-radius:18px;background:white}label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}input{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;background:#fff;color:var(--ink)}button{border:0;border-radius:14px;background:var(--gold);color:var(--ink);padding:12px 16px;font-weight:700;cursor:pointer;margin-top:16px}.result{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;min-height:170px}.math{font-family:Georgia,serif;font-size:18px;color:var(--ink);margin:8px 0}.good{background:#f6fff6;border-left:5px solid #7bbf7b;padding:10px 12px;border-radius:12px;color:#234523}.bad{background:#fff7f7;border-left:5px solid #cf7b7b;padding:10px 12px;border-radius:12px;color:#532525}.note{background:var(--rose);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:18px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <!-- Asset ID: FAS1MatricesInvariantLinesWidget-001; Source: AI-proposed teaching enhancement based on lesson evidence; Purpose: Test whether y = mx is invariant under a 2 x 2 matrix. -->
  <section class="card">
    <h1>Invariant-line tester</h1>
    <p>Enter a matrix and a gradient. The widget checks whether the line <strong>y = mx</strong> is invariant.</p>
    <div class="grid"><div><h2>Inputs</h2><p>Matrix A = [[a, b], [c, d]]</p><div class="matrix"><div><label for="a">a</label><input id="a" value="2" /></div><div><label for="b">b</label><input id="b" value="1" /></div><div><label for="c">c</label><input id="c" value="3" /></div><div><label for="d">d</label><input id="d" value="0" /></div></div><div style="max-width:260px;margin-top:12px"><label for="m">Gradient m</label><input id="m" value="1" /></div><button onclick="runCheck()">Check invariant line</button></div><div class="result" id="output" aria-live="polite"></div></div>
    <div class="note">CCEA-safe method: use a general point on the line, [x, mx]<sup>T</sup>, transform it, then require y′ = mx′. This widget does not use eigenvalues or eigenvectors.</div>
  </section>
</main>
<script>
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=b;b=a%b;a=t}return a||1}function frac(n,d=1){if(d<0){n=-n;d=-d}const g=gcd(n,d);return{n:n/g,d:d/g}}function parseFrac(s){s=String(s).trim();if(!s)throw new Error('Blank');if(s.includes('/')){const p=s.split('/');return frac(Number(p[0]),Number(p[1]))}if(s.includes('.')){const neg=s.startsWith('-');const clean=neg?s.slice(1):s;const p=clean.split('.');const den=10**p[1].length;const num=Number(p[0])*den+Number(p[1]);return frac(neg?-num:num,den)}return frac(Number(s),1)}function add(x,y){return frac(x.n*y.d+y.n*x.d,x.d*y.d)}function mul(x,y){return frac(x.n*y.n,x.d*y.d)}function eq(x,y){return x.n===y.n&&x.d===y.d}function show(x){return x.d===1?String(x.n):x.n+'/'+x.d}
function runCheck(){const out=document.getElementById('output');try{const a=parseFrac(document.getElementById('a').value),b=parseFrac(document.getElementById('b').value),c=parseFrac(document.getElementById('c').value),d=parseFrac(document.getElementById('d').value),m=parseFrac(document.getElementById('m').value);const xCoeff=add(a,mul(b,m));const yCoeff=add(c,mul(d,m));const required=mul(m,xCoeff);const ok=eq(yCoeff,required);out.innerHTML=`<h2>Working</h2><div class="math">x′ = x(a + bm) = ${show(xCoeff)}x</div><div class="math">y′ = x(c + dm) = ${show(yCoeff)}x</div><div class="math">Need y′ = mx′, so need ${show(yCoeff)}x = ${show(m)}(${show(xCoeff)}x)</div><div class="math">Right side coefficient = ${show(required)}</div><div class="${ok?'good':'bad'}">${ok?'Yes. The line y = '+show(m)+'x is invariant.':'No. The line y = '+show(m)+'x is not invariant.'}</div>`}catch(e){out.innerHTML='<div class="bad">Check the inputs. Use integers, decimals or fractions such as 3/4.</div>'}}runCheck();
</script>
</body>
</html>
