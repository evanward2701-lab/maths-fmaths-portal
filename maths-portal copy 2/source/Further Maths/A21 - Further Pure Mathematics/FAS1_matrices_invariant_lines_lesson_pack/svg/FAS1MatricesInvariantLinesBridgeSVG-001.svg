<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">FAS1MatricesInvariantLinesBridgeSVG-001: Ordinary vector scaling versus matrix transformation</title>
  <desc id="desc">A bridge diagram comparing ordinary A-Level scalar multiplication of a vector with Further Mathematics matrix transformation of a vector.</desc>
  <!-- Asset ID: FAS1MatricesInvariantLinesBridgeSVG-001; Source: Ordinary A-Level Maths bridge + CCEA FAS1-MAT specification boundary; Purpose: Compare vector scaling with matrix transformations. -->
  <defs><marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C5A059"/></marker><pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E5E5EA" stroke-width="1"/></pattern></defs>
  <rect x="0" y="0" width="1200" height="760" fill="#FAF9F6"/>
  <text x="600" y="56" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#2C2C2E">Bridge: from scalar multiplication to matrix transformation</text>
  <text x="600" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#5A5A5E">Ordinary A-Level Maths scales a vector. Further Maths uses a matrix to mix and transform its components.</text>
  <rect x="70" y="130" width="500" height="545" rx="24" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="2"/>
  <text x="320" y="172" text-anchor="middle" font-family="Georgia, serif" font-size="25" fill="#2C2C2E">Ordinary Maths: scalar multiplication</text>
  <rect x="115" y="215" width="410" height="285" fill="url(#gridPattern)" opacity="0.9"/>
  <line x1="150" y1="455" x2="500" y2="455" stroke="#7A7A7A" stroke-width="2" marker-end="url(#arrowGold)"/><line x1="170" y1="480" x2="170" y2="235" stroke="#7A7A7A" stroke-width="2" marker-end="url(#arrowGold)"/>
  <line x1="170" y1="455" x2="250" y2="375" stroke="#2C2C2E" stroke-width="4" marker-end="url(#arrowGold)"/><text x="232" y="362" font-family="Georgia, serif" font-size="22" fill="#2C2C2E">v</text>
  <line x1="170" y1="455" x2="410" y2="215" stroke="#C5A059" stroke-width="4" marker-end="url(#arrowGold)"/><text x="420" y="222" font-family="Georgia, serif" font-size="22" fill="#2C2C2E">k v</text>
  <rect x="120" y="535" width="400" height="95" rx="18" fill="#FAF9F6" stroke="#D4AF37" stroke-width="2"/>
  <text x="320" y="570" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#2C2C2E">k[x, y]^T = [kx, ky]^T</text>
  <line x1="590" y1="395" x2="650" y2="395" stroke="#D4AF37" stroke-width="4" marker-end="url(#arrowGold)"/>
  <text x="620" y="365" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#2C2C2E">upgrade</text>
  <rect x="670" y="130" width="460" height="545" rx="24" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="2"/>
  <text x="900" y="172" text-anchor="middle" font-family="Georgia, serif" font-size="25" fill="#2C2C2E">Further Maths: matrix transformation</text>
  <rect x="715" y="215" width="370" height="285" fill="url(#gridPattern)" opacity="0.9"/>
  <line x1="745" y1="455" x2="1060" y2="455" stroke="#7A7A7A" stroke-width="2" marker-end="url(#arrowGold)"/><line x1="765" y1="480" x2="765" y2="235" stroke="#7A7A7A" stroke-width="2" marker-end="url(#arrowGold)"/>
  <line x1="765" y1="455" x2="845" y2="375" stroke="#2C2C2E" stroke-width="4" marker-end="url(#arrowGold)"/><text x="830" y="362" font-family="Georgia, serif" font-size="22" fill="#2C2C2E">v</text>
  <line x1="765" y1="455" x2="990" y2="330" stroke="#C5A059" stroke-width="4" marker-end="url(#arrowGold)"/><text x="1000" y="334" font-family="Georgia, serif" font-size="22" fill="#2C2C2E">A v</text>
  <rect x="705" y="535" width="390" height="95" rx="18" fill="#FAF9F6" stroke="#D4AF37" stroke-width="2"/>
  <text x="900" y="570" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#2C2C2E">A[x, y]^T = [ax + by, cx + dy]^T</text>
  <rect x="165" y="704" width="870" height="38" rx="14" fill="#FBEFEF" stroke="#E5E5EA" stroke-width="2"/>
  <text x="600" y="729" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#2C2C2E">Old habit that still helps: vector components. New upgrade: one matrix moves the whole plane.</text>
</svg>
