<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FA22GameTheoryEnrichmentWidget-001</title><style>body{margin:0;background:#FAF9F6;color:#2C2C2E;font-family:Inter,Arial,sans-serif;line-height:1.5}.widget{max-width:1050px;margin:24px auto;padding:24px}.panel{background:#FFFFF0;border:1px solid #E5E5EA;border-radius:24px;padding:24px}textarea,input,select,button{font:inherit;border:1px solid #E5E5EA;border-radius:12px;padding:10px;background:#fff;color:#2C2C2E}textarea{width:100%;min-height:120px;font-family:monospace}button{background:#C5A059;color:white;font-weight:700;cursor:pointer}.boundary,.out{border-radius:16px;padding:14px;margin:14px 0}.boundary{background:#FBEFEF;border:1px solid #C5A059}.out{background:#fff;border:1px solid #E5E5EA}table{border-collapse:collapse;background:#fff;margin-top:12px}td,th{border:1px solid #E5E5EA;padding:8px;text-align:center}th{background:#FBEFEF}.hi{background:#FFF7DD;outline:3px solid #D4AF37}</style></head><body><main class="widget"><section class="panel"><h1>Pay-off Matrix Reader</h1><div class="boundary"><strong>Enrichment boundary:</strong> Game Theory is optional enrichment, not confirmed CCEA core content.</div><p>Enter a matrix from A’s point of view, then choose a row and column.</p><textarea id="m">3 -4 2
-1 4 -2
-3 1 4
1 -1 1</textarea><p><label>A row <select id="r"></select></label> <label>B column <select id="c"></select></label> <button onclick="readCell()">Read cell</button></p><div id="tbl"></div><div class="out" id="out"></div></section></main><script>let M=[];function parse(){M=document.getElementById('m').value.trim().split(/
+/).map(x=>x.trim().split(/[,\s]+/).map(Number));let r=document.getElementById('r'),c=document.getElementById('c');r.innerHTML='';c.innerHTML='';M.forEach((_,i)=>r.add(new Option('A'+(i+1),i)));M[0].forEach((_,j)=>c.add(new Option('B'+(j+1),j)));draw()}function draw(si=-1,sj=-1){let h='<table><tr><th></th>'+M[0].map((_,j)=>'<th>B'+(j+1)+'</th>').join('')+'</tr>';M.forEach((row,i)=>{h+='<tr><th>A'+(i+1)+'</th>'+row.map((v,j)=>'<td class="'+(i==si&&j==sj?'hi':'')+'">'+v+'</td>').join('')+'</tr>'});document.getElementById('tbl').innerHTML=h+'</table>'}function readCell(){if(!M.length)parse();let i=+r.value,j=+c.value,a=M[i][j],b=-a;draw(i,j);out.innerHTML='<b>A pay-off:</b> '+a+'<br><b>B pay-off:</b> '+b+'<br>B pay-off = -(A pay-off).'}parse();</script></body></html>
