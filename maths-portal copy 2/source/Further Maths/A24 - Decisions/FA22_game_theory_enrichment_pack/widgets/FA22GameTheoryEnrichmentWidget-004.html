<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FA22GameTheoryEnrichmentWidget-004</title><style>body{margin:0;background:#FAF9F6;color:#2C2C2E;font-family:Inter,Arial,sans-serif;line-height:1.5}.widget{max-width:1050px;margin:24px auto;padding:24px}.panel{background:#FFFFF0;border:1px solid #E5E5EA;border-radius:24px;padding:24px}textarea,input,select,button{font:inherit;border:1px solid #E5E5EA;border-radius:12px;padding:10px;background:#fff;color:#2C2C2E}textarea{width:100%;min-height:120px;font-family:monospace}button{background:#C5A059;color:white;font-weight:700;cursor:pointer}.boundary,.out{border-radius:16px;padding:14px;margin:14px 0}.boundary{background:#FBEFEF;border:1px solid #C5A059}.out{background:#fff;border:1px solid #E5E5EA}table{border-collapse:collapse;background:#fff;margin-top:12px}td,th{border:1px solid #E5E5EA;padding:8px;text-align:center}th{background:#FBEFEF}.hi{background:#FFF7DD;outline:3px solid #D4AF37}</style></head><body><main class="widget"><section class="panel"><h1>Dominance Reduction Tool</h1><div class="boundary"><strong>Enrichment boundary:</strong> Game Theory is optional enrichment, not confirmed CCEA core content.</div><p>Compare two rows or columns for dominance. Rows: bigger is better for A. Columns: smaller is better for B.</p><textarea id="m">3 0 1
1 -1 5
5 2 2</textarea><p><select id="type"><option value="rows">Rows</option><option value="cols">Columns</option></select> <select id="x"></select> <select id="y"></select> <button onclick="build();compare()">Compare</button></p><div id="tbl"></div><div class="out" id="out"></div></section></main><script>let M=[];function parse(){M=m.value.trim().split(/
+/).map(x=>x.trim().split(/[,\s]+/).map(Number))}function build(){parse();let n=type.value==='rows'?M.length:M[0].length;x.innerHTML='';y.innerHTML='';for(let i=0;i<n;i++){let lab=(type.value==='rows'?'A':'B')+(i+1);x.add(new Option(lab,i));y.add(new Option(lab,i));} if(n>1)y.value=1;}function vec(k){return type.value==='rows'?M[k]:M.map(r=>r[k])}function compare(){let a=vec(+x.value),b=vec(+y.value),rows=type.value==='rows';let ad=rows?a.every((v,i)=>v>=b[i])&&a.some((v,i)=>v>b[i]):a.every((v,i)=>v<=b[i])&&a.some((v,i)=>v<b[i]);let bd=rows?b.every((v,i)=>v>=a[i])&&b.some((v,i)=>v>a[i]):b.every((v,i)=>v<=a[i])&&b.some((v,i)=>v<a[i]);out.innerHTML=ad?'First dominates second. Delete second.':bd?'Second dominates first. Delete first.':'No dominance found.';tbl.innerHTML='<pre>'+JSON.stringify(M)+'</pre>'}type.onchange=build;build();compare();</script></body></html>
