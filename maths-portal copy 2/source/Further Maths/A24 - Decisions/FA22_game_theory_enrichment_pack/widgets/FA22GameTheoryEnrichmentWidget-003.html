<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FA22GameTheoryEnrichmentWidget-003</title><style>body{margin:0;background:#FAF9F6;color:#2C2C2E;font-family:Inter,Arial,sans-serif;line-height:1.5}.widget{max-width:1050px;margin:24px auto;padding:24px}.panel{background:#FFFFF0;border:1px solid #E5E5EA;border-radius:24px;padding:24px}textarea,input,select,button{font:inherit;border:1px solid #E5E5EA;border-radius:12px;padding:10px;background:#fff;color:#2C2C2E}textarea{width:100%;min-height:120px;font-family:monospace}button{background:#C5A059;color:white;font-weight:700;cursor:pointer}.boundary,.out{border-radius:16px;padding:14px;margin:14px 0}.boundary{background:#FBEFEF;border:1px solid #C5A059}.out{background:#fff;border:1px solid #E5E5EA}table{border-collapse:collapse;background:#fff;margin-top:12px}td,th{border:1px solid #E5E5EA;padding:8px;text-align:center}th{background:#FBEFEF}.hi{background:#FFF7DD;outline:3px solid #D4AF37}</style></head><body><main class="widget"><section class="panel"><h1>Saddle Point Detector</h1><div class="boundary"><strong>Enrichment boundary:</strong> Game Theory is optional enrichment, not confirmed CCEA core content.</div><p>A saddle point is smallest in its row and largest in its column.</p><textarea id="m">2 -1 4
3 2 5
-2 0 1</textarea><p><button onclick="detect()">Detect saddle points</button></p><div id="tbl"></div><div class="out" id="out"></div></section></main><script>function parse(){return m.value.trim().split(/
+/).map(x=>x.trim().split(/[,\s]+/).map(Number))}function detect(){let M=parse(),rm=M.map(r=>Math.min(...r)),cm=M[0].map((_,j)=>Math.max(...M.map(r=>r[j]))),s=[];let h='<table><tr><th></th>'+M[0].map((_,j)=>'<th>B'+(j+1)+'</th>').join('')+'</tr>';M.forEach((r,i)=>{h+='<tr><th>A'+(i+1)+'</th>';r.forEach((v,j)=>{let saddle=v===rm[i]&&v===cm[j];if(saddle)s.push('A'+(i+1)+', B'+(j+1)+' value '+v);h+='<td class="'+(saddle?'hi':'')+'">'+v+'</td>'});h+='</tr>'});tbl.innerHTML=h+'</table>';out.innerHTML=s.length?'<b>Saddle point found:</b><br>'+s.join('<br>'):'No saddle point found.'}detect();</script></body></html>
