<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FA22GameTheoryEnrichmentWidget-005</title><style>body{margin:0;background:#FAF9F6;color:#2C2C2E;font-family:Inter,Arial,sans-serif;line-height:1.5}.widget{max-width:1050px;margin:24px auto;padding:24px}.panel{background:#FFFFF0;border:1px solid #E5E5EA;border-radius:24px;padding:24px}textarea,input,select,button{font:inherit;border:1px solid #E5E5EA;border-radius:12px;padding:10px;background:#fff;color:#2C2C2E}textarea{width:100%;min-height:120px;font-family:monospace}button{background:#C5A059;color:white;font-weight:700;cursor:pointer}.boundary,.out{border-radius:16px;padding:14px;margin:14px 0}.boundary{background:#FBEFEF;border:1px solid #C5A059}.out{background:#fff;border:1px solid #E5E5EA}table{border-collapse:collapse;background:#fff;margin-top:12px}td,th{border:1px solid #E5E5EA;padding:8px;text-align:center}th{background:#FBEFEF}.hi{background:#FFF7DD;outline:3px solid #D4AF37}</style></head><body><main class="widget"><section class="panel"><h1>Mixed Strategy Graph Explorer</h1><div class="boundary"><strong>Enrichment boundary:</strong> Game Theory is optional enrichment, not confirmed CCEA core content.</div><p>Enter a 2 by 2 matrix. The widget forms expected winnings lines for A and finds the intersection.</p><p>A1,B1 <input id="a" type="number" value="4"> A1,B2 <input id="b" type="number" value="-2"> A2,B1 <input id="c" type="number" value="-5"> A2,B2 <input id="d" type="number" value="3"></p><p><button onclick="solve()">Solve</button></p><canvas id="can" width="800" height="420" style="width:100%;background:#fff;border:1px solid #E5E5EA;border-radius:16px"></canvas><div class="out" id="out"></div></section></main><script>function f(v){return Math.round(v*10000)/10000}function solve(){let A=+a.value,B=+b.value,C=+c.value,D=+d.value;let m1=A-C,k1=C,m2=B-D,k2=D;let p=(k2-k1)/(m1-m2),V=k1+m1*p;out.innerHTML='E1 = '+f(m1)+'p + '+f(k1)+'<br>E2 = '+f(m2)+'p + '+f(k2)+'<br>p = '+f(p)+', 1-p = '+f(1-p)+'<br>Value to A = '+f(V);draw(m1,k1,m2,k2,p,V)}function draw(m1,k1,m2,k2,p,V){let ctx=can.getContext('2d'),W=can.width,H=can.height;ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);let vals=[k1,k1+m1,k2,k2+m2,V].filter(Number.isFinite),lo=Math.min(...vals)-1,hi=Math.max(...vals)+1;let xs=t=>60+t*(W-100),ys=y=>40+(hi-y)/(hi-lo)*(H-90);ctx.strokeStyle='#E5E5EA';ctx.beginPath();ctx.moveTo(60,40);ctx.lineTo(60,H-50);ctx.lineTo(W-40,H-50);ctx.stroke();function line(m,k,col){ctx.strokeStyle=col;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(xs(0),ys(k));ctx.lineTo(xs(1),ys(k+m));ctx.stroke()}line(m1,k1,'#C5A059');line(m2,k2,'#2C2C2E');ctx.strokeStyle='#D4AF37';ctx.lineWidth=5;ctx.beginPath();for(let i=0;i<=100;i++){let t=i/100,y=Math.min(k1+m1*t,k2+m2*t);if(i===0)ctx.moveTo(xs(t),ys(y));else ctx.lineTo(xs(t),ys(y));}ctx.stroke();if(p>=0&&p<=1){ctx.fillStyle='#D4AF37';ctx.beginPath();ctx.arc(xs(p),ys(V),7,0,7);ctx.fill();}}solve();</script></body></html>
