<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FA22GameTheoryEnrichmentWidget-002</title><style>body{margin:0;background:#FAF9F6;color:#2C2C2E;font-family:Inter,Arial,sans-serif;line-height:1.5}.widget{max-width:1050px;margin:24px auto;padding:24px}.panel{background:#FFFFF0;border:1px solid #E5E5EA;border-radius:24px;padding:24px}textarea,input,select,button{font:inherit;border:1px solid #E5E5EA;border-radius:12px;padding:10px;background:#fff;color:#2C2C2E}textarea{width:100%;min-height:120px;font-family:monospace}button{background:#C5A059;color:white;font-weight:700;cursor:pointer}.boundary,.out{border-radius:16px;padding:14px;margin:14px 0}.boundary{background:#FBEFEF;border:1px solid #C5A059}.out{background:#fff;border:1px solid #E5E5EA}table{border-collapse:collapse;background:#fff;margin-top:12px}td,th{border:1px solid #E5E5EA;padding:8px;text-align:center}th{background:#FBEFEF}.hi{background:#FFF7DD;outline:3px solid #D4AF37}</style></head><body><main class="widget"><section class="panel"><h1>Maximin and Minimax Calculator</h1><div class="boundary"><strong>Enrichment boundary:</strong> Game Theory is optional enrichment, not confirmed CCEA core content.</div><p>Enter a matrix. The widget calculates row minima, row maximin, column maxima, column minimax and stability.</p><textarea id="m">3 -4 2
-1 4 -2
-3 1 4
1 -1 1</textarea><p><button onclick="calc()">Calculate</button></p><div id="tbl"></div><div class="out" id="out"></div></section></main><script>function parse(){return document.getElementById('m').value.trim().split(/
+/).map(x=>x.trim().split(/[,\s]+/).map(Number))}function calc(){let M=parse(),rm=M.map(r=>Math.min(...r)),rmax=Math.max(...rm),cm=M[0].map((_,j)=>Math.max(...M.map(r=>r[j]))),cmin=Math.min(...cm);let h='<table><tr><th></th>'+M[0].map((_,j)=>'<th>B'+(j+1)+'</th>').join('')+'<th>row min</th></tr>';M.forEach((r,i)=>h+='<tr><th>A'+(i+1)+'</th>'+r.map(v=>'<td>'+v+'</td>').join('')+'<td class="hi">'+rm[i]+'</td></tr>');h+='<tr><th>col max</th>'+cm.map(v=>'<td class="hi">'+v+'</td>').join('')+'<td></td></tr></table>';tbl.innerHTML=h;out.innerHTML='<b>Row maximin:</b> '+rmax+'<br><b>Column minimax:</b> '+cmin+'<br><b>Stable?</b> '+(rmax===cmin?'Yes':'No');}calc();</script></body></html>
