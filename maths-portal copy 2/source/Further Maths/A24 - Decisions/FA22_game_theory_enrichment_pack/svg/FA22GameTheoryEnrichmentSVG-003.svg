<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Maximin and Minimax Workflow</title>
<desc id="desc">Asset ID: FA22GameTheoryEnrichmentSVG-003. Optional enrichment only. Maximin and Minimax Workflow</desc>
<rect x="0" y="0" width="1200" height="760" fill="#FAF9F6"/>
<rect x="50" y="40" width="1100" height="680" rx="24" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="2"/>
<text x="90" y="95" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#2C2C2E">Maximin and Minimax Workflow</text>
<text x="90" y="135" font-family="Arial" font-size="18" fill="#2C2C2E">A uses row minima then maximin. B uses column maxima then minimax.</text><g font-family="Arial" font-size="20" fill="#2C2C2E"><rect x="100" y="190" width="670" height="360" fill="#FFFFFF" stroke="#E5E5EA"/><text x="125" y="235">Matrix rows A1–A4, columns B1–B3</text><text x="125" y="290">Row minima: -4, -2, -3, -1</text><text x="125" y="330">Row maximin = -1, so A plays A4</text><text x="125" y="390">Column maxima: 3, 4, 4</text><text x="125" y="430">Column minimax = 3, so B plays B1</text><text x="125" y="490">Since -1 ≠ 3, there is no stable solution.</text></g><rect x="830" y="250" width="260" height="210" rx="18" fill="#FBEFEF" stroke="#C5A059"/><text x="860" y="305" font-family="Arial" font-size="22" fill="#2C2C2E">Stable test</text><text x="860" y="350" font-family="Arial" font-size="20" fill="#2C2C2E">row maximin</text><text x="860" y="385" font-family="Arial" font-size="20" fill="#2C2C2E">= column minimax?</text>
</svg>