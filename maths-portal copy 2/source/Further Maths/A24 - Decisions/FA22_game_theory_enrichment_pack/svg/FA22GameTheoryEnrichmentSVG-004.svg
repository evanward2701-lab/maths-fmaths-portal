<text x="90" y="95" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#2C2C2E">Saddle Point Illustration</text>
<text x="90" y="135" font-family="Arial" font-size="18" fill="#2C2C2E">A saddle point is smallest in its row and largest in its column.</text><rect x="170" y="210" width="520" height="300" fill="#FFFFFF" stroke="#E5E5EA"/><rect x="345" y="330" width="130" height="60" fill="#FFF7DD" stroke="#D4AF37" stroke-width="4"/><g font-family="Arial" font-size="22" fill="#2C2C2E"><text x="210" y="255">A1: 4, 1, 5</text><text x="210" y="315">A2: 6, 2, 7</text><text x="210" y="375">A3: 3, -1, 4</text><text x="210" y="435">A4: 5, 0, 8</text></g><rect x="760" y="240" width="320" height="220" rx="18" fill="#FFF7DD" stroke="#D4AF37"/><text x="790" y="295" font-family="Arial" font-size="20" fill="#2C2C2E">Highlighted entry 2</text><text x="790" y="335" font-family="Arial" font-size="18" fill="#2C2C2E">min(6,2,7)=2</text><text x="790" y="375" font-family="Arial" font-size="18" fill="#2C2C2E">max(1,2,-1,0)=2</text><text x="790" y="415" font-family="Arial" font-size="18" fill="#2C2C2E">Stable solution</text>
</svg>