<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Reading a Zero-Sum Pay-off Matrix</title>
<desc id="desc">Asset ID: FA22GameTheoryEnrichmentSVG-002. Optional enrichment only. Reading a Zero-Sum Pay-off Matrix</desc>
<rect x="0" y="0" width="1200" height="760" fill="#FAF9F6"/>
<rect x="50" y="40" width="1100" height="680" rx="24" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="2"/>
<text x="90" y="95" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#2C2C2E">Reading a Zero-Sum Pay-off Matrix</text>
<text x="90" y="135" font-family="Arial" font-size="18" fill="#2C2C2E">The matrix is written from A's point of view, so B's pay-off is the negative.</text>
<g font-family="Arial" font-size="22" fill="#2C2C2E">
<rect x="110" y="190" width="560" height="300" fill="#FFFFFF" stroke="#E5E5EA"/><line x1="110" y1="250" x2="670" y2="250" stroke="#E5E5EA"/><line x1="110" y1="310" x2="670" y2="310" stroke="#E5E5EA"/><line x1="110" y1="370" x2="670" y2="370" stroke="#E5E5EA"/><line x1="110" y1="430" x2="670" y2="430" stroke="#E5E5EA"/><line x1="250" y1="190" x2="250" y2="490" stroke="#E5E5EA"/><line x1="390" y1="190" x2="390" y2="490" stroke="#E5E5EA"/><line x1="530" y1="190" x2="530" y2="490" stroke="#E5E5EA"/>
<text x="300" y="230">B1</text><text x="440" y="230">B2</text><text x="580" y="230">B3</text><text x="160" y="290">A1</text><text x="160" y="350">A2</text><text x="160" y="410">A3</text><text x="160" y="470">A4</text>
<text x="305" y="290">3</text><text x="445" y="290" fill="#C5A059">-4</text><text x="585" y="290" fill="#C5A059">2</text><text x="305" y="350">-1</text><text x="445" y="350">4</text><text x="585" y="350">-2</text><text x="305" y="410">-3</text><text x="445" y="410" fill="#C5A059">1</text><text x="585" y="410">4</text><text x="305" y="470">1</text><text x="445" y="470">-1</text><text x="585" y="470">1</text></g>
<g font-family="Arial" font-size="19" fill="#2C2C2E"><rect x="745" y="220" width="330" height="90" rx="16" fill="#FFF7DD" stroke="#D4AF37"/><text x="775" y="255">Entry -4: A loses 4, B wins 4.</text><rect x="745" y="340" width="330" height="90" rx="16" fill="#FFF7DD" stroke="#D4AF37"/><text x="775" y="375">Entry 2: A wins 2, B loses 2.</text><rect x="745" y="460" width="330" height="90" rx="16" fill="#FFF7DD" stroke="#D4AF37"/><text x="775" y="495">Entry 1: A wins 1, B loses 1.</text></g>
</svg>