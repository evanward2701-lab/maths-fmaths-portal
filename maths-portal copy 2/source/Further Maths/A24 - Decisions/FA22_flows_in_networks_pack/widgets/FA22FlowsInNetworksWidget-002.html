<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FA22FlowsInNetworksWidget-002</title><style>body{margin:0;font-family:Arial,sans-serif;background:#FAF9F6;color:#2C2C2E}main{max-width:1050px;margin:24px auto;padding:24px;background:#FFFFF0;border:1px solid #E5E5EA;border-radius:24px}h1,h2{font-family:Georgia,serif}.card{background:white;border:1px solid #E5E5EA;border-radius:18px;padding:16px;margin:14px 0}input,textarea{padding:10px;border:1px solid #E5E5EA;border-radius:10px}button{border:0;border-radius:14px;padding:10px 16px;background:#C5A059;color:#2C2C2E;font-weight:700}table{width:100%;border-collapse:collapse}th,td{border:1px solid #E5E5EA;padding:8px}th{background:#FBEFEF}.ok{color:#2F6B4F;font-weight:700}.warn{color:#8A2E2E;font-weight:700}.math{font-family:Georgia,serif}</style></head><body><main><h1>Cut Capacity Trainer</h1><section class="card"><strong>Asset ID:</strong> FA22FlowsInNetworksWidget-002<br><strong>Purpose:</strong> Select a source-side set and calculate cut capacity from capacities only.</section><section class="card"><label>Source-side vertices <input id="side" value="S,A,B"></label><table id="t"><thead><tr><th>From</th><th>To</th><th>Capacity</th></tr></thead><tbody></tbody></table><button onclick="calc()">Calculate cut</button><div id="out"></div></section></main><script>const rows=[['S','A',14],['S','B',15],['A','D',8],['A','C',4],['B','C',7],['B','E',9],['D','T',11],['E','T',16]];const tb=document.querySelector('#t tbody');rows.forEach(r=>tb.innerHTML+=`<tr><td><input value="${r[0]}"></td><td><input value="${r[1]}"></td><td><input type="number" value="${r[2]}"></td></tr>`);function calc(){let side=new Set(document.getElementById('side').value.split(/[ ,]+/).map(s=>s.trim().toUpperCase()).filter(Boolean));let total=0,msg=[];for(const tr of tb.rows){let [a,b,c0]=[...tr.querySelectorAll('input')].map(i=>i.value.toUpperCase());let c=+c0;if(side.has(a)&&!side.has(b)){total+=c;msg.push(`<li class="ok">${a+b} counts: capacity ${c}</li>`);}else if(!side.has(a)&&side.has(b))msg.push(`<li class="warn">${a+b} crosses backwards: do not count.</li>`);else msg.push(`<li>${a+b} is internal to a side.</li>`);}document.getElementById('out').innerHTML=`<h2>Analysis</h2><ul>${msg.join('')}</ul><p class="math"><strong>Cut capacity = ${total}</strong></p><p>Use capacities, not current flows.</p>`}calc();</script></body></html>
