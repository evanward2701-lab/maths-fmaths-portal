<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FA22FlowsInNetworksWidget-001</title><style>body{margin:0;font-family:Arial,sans-serif;background:#FAF9F6;color:#2C2C2E}main{max-width:1050px;margin:24px auto;padding:24px;background:#FFFFF0;border:1px solid #E5E5EA;border-radius:24px}h1,h2{font-family:Georgia,serif}.card{background:white;border:1px solid #E5E5EA;border-radius:18px;padding:16px;margin:14px 0}input,textarea{padding:10px;border:1px solid #E5E5EA;border-radius:10px}button{border:0;border-radius:14px;padding:10px 16px;background:#C5A059;color:#2C2C2E;font-weight:700}table{width:100%;border-collapse:collapse}th,td{border:1px solid #E5E5EA;padding:8px}th{background:#FBEFEF}.ok{color:#2F6B4F;font-weight:700}.warn{color:#8A2E2E;font-weight:700}.math{font-family:Georgia,serif}</style></head><body><main><h1>Feasibility and Conservation Checker</h1><section class="card"><strong>Asset ID:</strong> FA22FlowsInNetworksWidget-001<br><strong>Purpose:</strong> Check arc feasibility, conservation, flow value and saturated arcs.</section><section class="card"><p>Example network loaded. Edit rows then press Check.</p><table id="t"><thead><tr><th>From</th><th>To</th><th>Capacity c</th><th>Flow f</th></tr></thead><tbody></tbody></table><button onclick="check()">Check network</button><div id="out"></div></section></main><script>const rows=[['S','A',20,15],['S','B',18,15],['A','C',10,7],['A','E',12,6],['B','E',14,12],['C','T',17,7],['E','T',20,18]];const tb=document.querySelector('#t tbody');rows.forEach(r=>tb.innerHTML+=`<tr><td><input value="${r[0]}"></td><td><input value="${r[1]}"></td><td><input type="number" value="${r[2]}"></td><td><input type="number" value="${r[3]}"></td></tr>`);function check(){let arcs=[...tb.rows].map(tr=>[...tr.querySelectorAll('input')].map(i=>i.value));let msg=[],sat=[],vin={},vout={};for(const [a,b,c0,f0] of arcs){let c=+c0,f=+f0;vout[a]=(vout[a]||0)+f;vin[b]=(vin[b]||0)+f;if(f<0||f>c)msg.push(`<li class="warn">${a+b} violates 0 ≤ f ≤ c.</li>`);else msg.push(`<li class="ok">${a+b} feasible.</li>`);if(f===c)sat.push(a+b)}let verts=[...new Set(arcs.flatMap(r=>[r[0],r[1]]))].filter(v=>v!=='S'&&v!=='T');for(const v of verts)msg.push((vin[v]||0)===(vout[v]||0)?`<li class="ok">${v} conserved: ${vin[v]||0} = ${vout[v]||0}</li>`:`<li class="warn">${v} not conserved: in ${vin[v]||0}, out ${vout[v]||0}</li>`);document.getElementById('out').innerHTML=`<h2>Results</h2><ul>${msg.join('')}</ul><p class="math">Flow out of S = ${vout.S||0}; flow into T = ${vin.T||0}</p><p class="math">Saturated arcs: ${sat.join(', ')||'none'}</p>`}check();</script></body></html>
