<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FA22FlowsInNetworksWidget-003</title><style>body{margin:0;font-family:Arial,sans-serif;background:#FAF9F6;color:#2C2C2E}main{max-width:1050px;margin:24px auto;padding:24px;background:#FFFFF0;border:1px solid #E5E5EA;border-radius:24px}h1,h2{font-family:Georgia,serif}.card{background:white;border:1px solid #E5E5EA;border-radius:18px;padding:16px;margin:14px 0}input,textarea{padding:10px;border:1px solid #E5E5EA;border-radius:10px}button{border:0;border-radius:14px;padding:10px 16px;background:#C5A059;color:#2C2C2E;font-weight:700}table{width:100%;border-collapse:collapse}th,td{border:1px solid #E5E5EA;padding:8px}th{background:#FBEFEF}.ok{color:#2F6B4F;font-weight:700}.warn{color:#8A2E2E;font-weight:700}.math{font-family:Georgia,serif}</style></head><body><main><h1>Labelling Procedure Trainer</h1><section class="card"><strong>Asset ID:</strong> FA22FlowsInNetworksWidget-003<br><strong>Purpose:</strong> Practise forward labels c−f, backward labels f and augmenting-route bottlenecks.</section><section class="card"><table id="t"><thead><tr><th>From</th><th>To</th><th>Capacity c</th><th>Flow f</th><th>Forward c−f</th><th>Backward f</th></tr></thead><tbody></tbody></table><label>Route <input id="route" value="S>A,A>C,C>D,D>T"></label><label>Current flow value <input id="value" type="number" value="30"></label><button onclick="analyse()">Analyse route</button><div id="out"></div></section></main><script>const rows=[['S','A',20,15],['A','C',10,7],['C','D',12,5],['D','T',13,10],['S','B',18,15]];const tb=document.querySelector('#t tbody');rows.forEach(r=>tb.innerHTML+=`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[2]-r[3]}</td><td>${r[3]}</td></tr>`);function analyse(){const arcs=rows.map(r=>({a:r[0],b:r[1],c:r[2],f:r[3]}));const steps=document.getElementById('route').value.split(',').map(s=>s.trim()).filter(Boolean);let labels=[],msg=[];for(const st of steps){let [a,b]=st.split('>').map(x=>x.trim().toUpperCase());let fw=arcs.find(e=>e.a===a&&e.b===b), bw=arcs.find(e=>e.a===b&&e.b===a);if(fw){let lab=fw.c-fw.f;labels.push(lab);msg.push(`<li class="${lab>0?'ok':'warn'}">${st} forward label = ${lab}</li>`);}else if(bw){let lab=bw.f;labels.push(lab);msg.push(`<li class="${lab>0?'ok':'warn'}">${st} backward label = ${lab}</li>`);}else{labels.push(0);msg.push(`<li class="warn">${st} missing.</li>`);}}let bott=Math.min(...labels), val=+document.getElementById('value').value;document.getElementById('out').innerHTML=`<h2>Route analysis</h2><ul>${msg.join('')}</ul><p class="math">Bottleneck = min(${labels.join(', ')}) = ${bott}</p><p class="math">New flow value = ${val} + ${bott} = ${val+bott}</p>`}analyse();</script></body></html>
