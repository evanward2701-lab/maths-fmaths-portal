<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>OffSpecDecisionAnalysisWidget-002 | Utility and Risk Aversion</title><style>
:root{--canvas:#FAF9F6;--ivory:#FFFFF0;--divider:#E5E5EA;--gold:#C5A059;--warm:#D4AF37;--pink:#FBEFEF;--ink:#2C2C2E;--muted:#66666A;--good:#426B4F;--bad:#8A2E2E}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}main{max-width:1100px;margin:auto;padding:28px}.hero,.card{background:var(--ivory);border:1px solid var(--divider);border-radius:24px;padding:22px}.hero{margin-bottom:18px}h1{margin:0 0 8px;font-size:clamp(1.7rem,4vw,2.55rem)}h2{margin:0 0 12px;font-size:1.2rem}.subtitle{color:var(--muted);margin:0}.grid{display:grid;grid-template-columns:360px 1fr;gap:18px}@media(max-width:820px){.grid{grid-template-columns:1fr}}label{display:block;font-weight:800;margin:12px 0 5px}input,select{width:100%;border:1px solid var(--divider);border-radius:14px;padding:11px;background:#fff;color:var(--ink);font-size:1rem}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:999px;padding:11px 15px;background:var(--gold);color:#fff;font-weight:900;cursor:pointer;margin-top:14px}button.secondary{background:var(--pink);color:var(--ink);border:1px solid var(--divider);margin-left:8px}.result,.message,.formula{border:1px solid var(--divider);border-radius:16px;background:#fff;padding:14px;margin-top:12px}.formula{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow-x:auto}.good{background:rgba(66,107,79,.09);border-color:rgba(66,107,79,.35);color:var(--good)}.bad{background:rgba(138,46,46,.08);border-color:rgba(138,46,46,.35);color:var(--bad)}.warn{background:rgba(212,175,55,.14);border-color:rgba(212,175,55,.55);color:#8A5A00}.big{font-size:2.2rem;font-weight:900;letter-spacing:-.03em}svg,canvas{width:100%;max-width:100%;height:auto;background:var(--canvas);border:1px solid var(--divider);border-radius:18px;margin-top:12px}.note{font-size:.92rem;color:var(--muted)}
</style></head>
<body><main><section class="hero"><h1>Utility and Risk Aversion Explorer</h1><p class="subtitle">Off-spec enrichment widget. Use U(x)=1−e^(−x/R) and compare expected utilities.</p></section><section class="grid"><div class="card"><h2>Inputs</h2><label>Risk parameter R</label><input id="R" type="number" step="1" value="400"><div class="row"><div><label>p₁</label><input id="p1" type="number" step="0.0001" value="0.008537"></div><div><label>x₁</label><input id="x1" type="number" step="0.01" value="-1600"></div></div><div class="row"><div><label>p₂</label><input id="p2" type="number" step="0.0001" value="0.991463"></div><div><label>x₂</label><input id="x2" type="number" step="0.01" value="400"></div></div><label>Alternative utility</label><input id="alt" type="number" step="0.0001" value="0"><button id="calc">Calculate</button><button class="secondary" id="r400">School R=400</button><button class="secondary" id="r200">School R=200</button><p class="note">Smaller R makes losses bite harder.</p></div><div class="card"><h2>Output</h2><div class="row"><div class="result"><b>U(x₁)</b><div class="big" id="u1"></div></div><div class="result"><b>U(x₂)</b><div class="big" id="u2"></div></div></div><div class="result"><b>Expected utility</b><div class="big" id="eu"></div></div><canvas id="g" width="820" height="360"></canvas><div class="formula" id="formula"></div><div class="message" id="msg"></div></div></section></main><script>
const $=id=>document.getElementById(id); const rr=(x,d=4)=>Number(x.toFixed(d)).toString(); const U=(x,R)=>1-Math.exp(-x/R);
function graph(R){const c=$('g'),ctx=c.getContext('2d'),w=c.width,h=c.height,pad=45,xmin=-2000,xmax=1000,ymin=-80,ymax=2;ctx.clearRect(0,0,w,h);ctx.fillStyle='#FAF9F6';ctx.fillRect(0,0,w,h);const X=x=>pad+(x-xmin)/(xmax-xmin)*(w-2*pad),Y=y=>h-pad-(y-ymin)/(ymax-ymin)*(h-2*pad);ctx.strokeStyle='#E5E5EA';ctx.lineWidth=1;for(let i=0;i<6;i++){let x=pad+i*(w-2*pad)/5;ctx.beginPath();ctx.moveTo(x,pad);ctx.lineTo(x,h-pad);ctx.stroke();}ctx.strokeStyle='#2C2C2E';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(pad,Y(0));ctx.lineTo(w-pad,Y(0));ctx.stroke();ctx.beginPath();ctx.moveTo(X(0),pad);ctx.lineTo(X(0),h-pad);ctx.stroke();function plot(R,col,dash=[]){ctx.strokeStyle=col;ctx.lineWidth=3;ctx.setLineDash(dash);ctx.beginPath();let first=true;for(let x=xmin;x<=xmax;x+=10){let y=Math.max(ymin,Math.min(ymax,U(x,R))),cx=X(x),cy=Y(y); if(first){ctx.moveTo(cx,cy);first=false;}else ctx.lineTo(cx,cy);}ctx.stroke();ctx.setLineDash([]);}plot(R,'#C5A059');plot(Math.max(25,R/2),'#D4AF37',[8,6]);ctx.fillStyle='#2C2C2E';ctx.font='14px Inter';ctx.fillText('main R = '+rr(R,0),X(300),Y(U(300,R))-8);ctx.fillText('smaller R',X(-1500),Y(-55));}
function run(){let R=+$('R').value,p1=+$('p1').value,p2=+$('p2').value,x1=+$('x1').value,x2=+$('x2').value,alt=+$('alt').value;if(!(R>0&&p1>=0&&p2>=0&&Math.abs(p1+p2-1)<.005)){$('msg').className='message bad';$('msg').textContent='Check R and probabilities. R must be positive and probabilities should add to 1.';return;}let u1=U(x1,R),u2=U(x2,R),eu=p1*u1+p2*u2;$('u1').textContent=rr(u1,4);$('u2').textContent=rr(u2,4);$('eu').textContent=rr(eu,4);$('formula').textContent=`U(x)=1−e^(−x/R)
U(${rr(x1,2)})=${rr(u1,6)}
U(${rr(x2,2)})=${rr(u2,6)}
EU=(${rr(p1,6)})(${rr(u1,6)})+(${rr(p2,6)})(${rr(u2,6)})=${rr(eu,6)}`;$('msg').className='message '+(eu>alt?'good':'warn');$('msg').textContent=eu>alt?'Expected utility is above the alternative.':'Expected utility is not above the alternative.';graph(R);}
$('calc').onclick=run;$('r400').onclick=()=>{$('R').value=400;run();};$('r200').onclick=()=>{$('R').value=200;run();};['R','p1','p2','x1','x2','alt'].forEach(id=>$(id).addEventListener('input',run));run();
</script></body></html>
