<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>OffSpecDecisionAnalysisWidget-001 | EMV Calculator</title><style>
:root{--canvas:#FAF9F6;--ivory:#FFFFF0;--divider:#E5E5EA;--gold:#C5A059;--warm:#D4AF37;--pink:#FBEFEF;--ink:#2C2C2E;--muted:#66666A;--good:#426B4F;--bad:#8A2E2E}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}main{max-width:1100px;margin:auto;padding:28px}.hero,.card{background:var(--ivory);border:1px solid var(--divider);border-radius:24px;padding:22px}.hero{margin-bottom:18px}h1{margin:0 0 8px;font-size:clamp(1.7rem,4vw,2.55rem)}h2{margin:0 0 12px;font-size:1.2rem}.subtitle{color:var(--muted);margin:0}.grid{display:grid;grid-template-columns:360px 1fr;gap:18px}@media(max-width:820px){.grid{grid-template-columns:1fr}}label{display:block;font-weight:800;margin:12px 0 5px}input,select{width:100%;border:1px solid var(--divider);border-radius:14px;padding:11px;background:#fff;color:var(--ink);font-size:1rem}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:999px;padding:11px 15px;background:var(--gold);color:#fff;font-weight:900;cursor:pointer;margin-top:14px}button.secondary{background:var(--pink);color:var(--ink);border:1px solid var(--divider);margin-left:8px}.result,.message,.formula{border:1px solid var(--divider);border-radius:16px;background:#fff;padding:14px;margin-top:12px}.formula{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow-x:auto}.good{background:rgba(66,107,79,.09);border-color:rgba(66,107,79,.35);color:var(--good)}.bad{background:rgba(138,46,46,.08);border-color:rgba(138,46,46,.35);color:var(--bad)}.warn{background:rgba(212,175,55,.14);border-color:rgba(212,175,55,.55);color:#8A5A00}.big{font-size:2.2rem;font-weight:900;letter-spacing:-.03em}svg,canvas{width:100%;max-width:100%;height:auto;background:var(--canvas);border:1px solid var(--divider);border-radius:18px;margin-top:12px}.note{font-size:.92rem;color:var(--muted)}
</style></head>
<body><main><section class="hero"><h1>EMV Chance Node Calculator</h1><p class="subtitle">Off-spec enrichment widget. Calculate EMV = p x₁ + (1 − p)x₂ and compare with an alternative decision.</p></section><section class="grid"><div class="card"><h2>Inputs</h2><label>Outcome 1 label</label><input id="l1" value="Win"><div class="row"><div><label>p</label><input id="p" type="number" step="0.001" value="0.375"></div><div><label>x₁</label><input id="x1" type="number" step="0.01" value="4"></div></div><label>Outcome 2 label</label><input id="l2" value="Lose"><div class="row"><div><label>1 − p</label><input id="q" type="number" step="0.001" value="0.625"></div><div><label>x₂</label><input id="x2" type="number" step="0.01" value="-2"></div></div><label>Alternative decision value</label><input id="alt" type="number" step="0.01" value="0"><button id="calc">Calculate EMV</button><button class="secondary" id="james">Load James</button><p class="note">Decision branches have no probabilities. Chance branches do.</p></div><div class="card"><h2>Output</h2><div class="result"><div class="big" id="emv">EMV = 0.25</div></div><div class="formula" id="formula"></div><div class="message" id="msg"></div><svg viewBox="0 0 760 330" role="img" aria-label="Simple decision tree"><rect x="40" y="140" width="90" height="60" rx="8" fill="#FAF9F6" stroke="#C5A059" stroke-width="3"/><text x="58" y="175" fill="#2C2C2E" font-size="14" font-family="Inter">Decision</text><path id="bp" d="M130 170 C230 80 310 70 390 80" stroke="#C5A059" stroke-width="4" fill="none"/><path id="ba" d="M130 170 C230 250 310 270 390 275" stroke="#2C2C2E" stroke-width="3" fill="none"/><circle cx="420" cy="80" r="42" fill="#FFFFF0" stroke="#D4AF37" stroke-width="3"/><text id="node" x="395" y="86" fill="#2C2C2E" font-size="13" font-family="Inter">0.25</text><path d="M462 74 C540 40 600 40 660 48" stroke="#2C2C2E" stroke-width="3" fill="none"/><path d="M462 88 C540 128 600 150 660 165" stroke="#2C2C2E" stroke-width="3" fill="none"/><polygon points="720,30 660,48 720,66" fill="#FBEFEF" stroke="#C5A059" stroke-width="3"/><polygon points="720,147 660,165 720,183" fill="#FBEFEF" stroke="#C5A059" stroke-width="3"/><polygon points="450,257 390,275 450,293" fill="#FBEFEF" stroke="#C5A059" stroke-width="3"/><text id="t1" x="500" y="38" fill="#2C2C2E" font-size="13" font-family="Inter">Win, p=0.375</text><text id="t2" x="500" y="140" fill="#2C2C2E" font-size="13" font-family="Inter">Lose, q=0.625</text><text id="py1" x="680" y="30" fill="#2C2C2E" font-size="14" font-family="Inter">+4</text><text id="py2" x="680" y="146" fill="#2C2C2E" font-size="14" font-family="Inter">−2</text><text id="pya" x="405" y="255" fill="#2C2C2E" font-size="14" font-family="Inter">0</text></svg></div></section></main><script>
const $=id=>document.getElementById(id); const r=(x,d=4)=>Number(x.toFixed(d)).toString(); const s=x=>x>0?'+'+r(x,3):x<0?'−'+r(Math.abs(x),3):'0';
function run(){let p=+$('p').value,q=+$('q').value,x1=+$('x1').value,x2=+$('x2').value,alt=+$('alt').value;let ok=Number.isFinite(p)&&p>=0&&p<=1&&Math.abs(q-(1-p))<.002&&Number.isFinite(x1)&&Number.isFinite(x2); if(!ok){$('msg').className='message bad';$('msg').textContent='Check probabilities and pay-offs. q should be 1 − p.';return;} q=1-p;$('q').value=r(q,4);let emv=p*x1+q*x2;$('emv').textContent='EMV = £'+r(emv,4);$('formula').textContent=`EMV = (${r(p,4)})(${r(x1,4)}) + (${r(q,4)})(${r(x2,4)})
    = ${r(emv,4)}`; $('msg').className='message '+(emv>alt?'good':emv<alt?'warn':'warn');$('msg').textContent=emv>alt?'Choose the chance option: EMV is greater than the alternative.':emv<alt?'Reject the chance option: alternative is greater.':'EMV equals the alternative.';$('node').textContent=r(emv,3);$('t1').textContent=$('l1').value+', p='+r(p,3);$('t2').textContent=$('l2').value+', q='+r(q,3);$('py1').textContent=s(x1);$('py2').textContent=s(x2);$('pya').textContent=s(alt);}
$('calc').onclick=run;$('james').onclick=()=>{$('l1').value='Total 6 or more';$('p').value=.375;$('x1').value=4;$('l2').value='Less than 6';$('q').value=.625;$('x2').value=-2;$('alt').value=0;run();};['p','q','x1','x2','alt','l1','l2'].forEach(id=>$(id).addEventListener('input',run));run();
</script></body></html>
