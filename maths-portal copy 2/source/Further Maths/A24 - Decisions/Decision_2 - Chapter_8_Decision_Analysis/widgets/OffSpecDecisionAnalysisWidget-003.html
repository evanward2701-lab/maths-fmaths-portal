<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>OffSpecDecisionAnalysisWidget-003 | Decision Tree Builder</title><style>
:root{--canvas:#FAF9F6;--ivory:#FFFFF0;--divider:#E5E5EA;--gold:#C5A059;--warm:#D4AF37;--pink:#FBEFEF;--ink:#2C2C2E;--muted:#66666A;--good:#426B4F;--bad:#8A2E2E}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}main{max-width:1100px;margin:auto;padding:28px}.hero,.card{background:var(--ivory);border:1px solid var(--divider);border-radius:24px;padding:22px}.hero{margin-bottom:18px}h1{margin:0 0 8px;font-size:clamp(1.7rem,4vw,2.55rem)}h2{margin:0 0 12px;font-size:1.2rem}.subtitle{color:var(--muted);margin:0}.grid{display:grid;grid-template-columns:360px 1fr;gap:18px}@media(max-width:820px){.grid{grid-template-columns:1fr}}label{display:block;font-weight:800;margin:12px 0 5px}input,select{width:100%;border:1px solid var(--divider);border-radius:14px;padding:11px;background:#fff;color:var(--ink);font-size:1rem}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:999px;padding:11px 15px;background:var(--gold);color:#fff;font-weight:900;cursor:pointer;margin-top:14px}button.secondary{background:var(--pink);color:var(--ink);border:1px solid var(--divider);margin-left:8px}.result,.message,.formula{border:1px solid var(--divider);border-radius:16px;background:#fff;padding:14px;margin-top:12px}.formula{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow-x:auto}.good{background:rgba(66,107,79,.09);border-color:rgba(66,107,79,.35);color:var(--good)}.bad{background:rgba(138,46,46,.08);border-color:rgba(138,46,46,.35);color:var(--bad)}.warn{background:rgba(212,175,55,.14);border-color:rgba(212,175,55,.55);color:#8A5A00}.big{font-size:2.2rem;font-weight:900;letter-spacing:-.03em}svg,canvas{width:100%;max-width:100%;height:auto;background:var(--canvas);border:1px solid var(--divider);border-radius:18px;margin-top:12px}.note{font-size:.92rem;color:var(--muted)}
</style></head>
<body><main><section class="hero"><h1>Decision Tree Builder and Checker</h1><p class="subtitle">Off-spec enrichment widget. Check whether probabilities and crossing rules match the node type.</p></section><section class="grid"><div class="card"><h2>Build one split</h2><label>Starting node type</label><select id="type"><option value="decision">Decision node: a person chooses</option><option value="chance">Chance node: a random event occurs</option></select><div class="row"><div><label>Upper label</label><input id="ul" value="play"></div><div><label>Upper probability</label><input id="up" type="number" step="0.001" placeholder="blank for decision"></div></div><label>Upper pay-off</label><input id="ux" type="number" step="0.01" value="0.25"><div class="row"><div><label>Lower label</label><input id="ll" value="do not play"></div><div><label>Lower probability</label><input id="lp" type="number" step="0.001" placeholder="blank for decision"></div></div><label>Lower pay-off</label><input id="lx" type="number" step="0.01" value="0"><button id="check">Check</button><button class="secondary" id="decision">Load decision split</button><button class="secondary" id="chance">Load chance split</button></div><div class="card"><h2>Feedback</h2><div id="msg"></div><div class="formula" id="formula"></div><svg viewBox="0 0 760 330" role="img" aria-label="Decision tree split preview"><rect id="box" x="50" y="135" width="100" height="70" rx="8" fill="#FAF9F6" stroke="#C5A059" stroke-width="3"/><circle id="circ" cx="100" cy="170" r="42" fill="#FFFFF0" stroke="#D4AF37" stroke-width="3" style="display:none"/><text id="nt" x="72" y="176" fill="#2C2C2E" font-size="14" font-family="Inter">Decision</text><path id="b1" d="M150 170 C270 80 400 70 540 82" stroke="#2C2C2E" stroke-width="3" fill="none"/><path id="b2" d="M150 170 C270 260 400 285 540 275" stroke="#2C2C2E" stroke-width="3" fill="none"/><text id="tu" x="290" y="90" fill="#2C2C2E" font-size="13" font-family="Inter">play</text><text id="tl" x="290" y="265" fill="#2C2C2E" font-size="13" font-family="Inter">do not play</text><polygon points="620,52 540,82 620,112" fill="#FBEFEF" stroke="#C5A059" stroke-width="3"/><polygon points="620,245 540,275 620,305" fill="#FBEFEF" stroke="#C5A059" stroke-width="3"/><text id="pu" x="640" y="88" fill="#2C2C2E" font-size="14" font-family="Inter">+0.25</text><text id="pl" x="640" y="281" fill="#2C2C2E" font-size="14" font-family="Inter">0</text></svg></div></section></main><script>
const $=id=>document.getElementById(id); const n=v=>v.trim()===''?null:+v; const r=x=>Number(x.toFixed(4)).toString(); const s=x=>x>0?'+'+r(x):x<0?'−'+r(Math.abs(x)):'0';
function m(cls,t){return `<div class="message ${cls}">${t}</div>`}
function run(){let type=$('type').value,up=n($('up').value),lp=n($('lp').value),ux=+$('ux').value,lx=+$('lx').value,msg=[];$('box').style.display=type==='decision'?'block':'none';$('circ').style.display=type==='chance'?'block':'none';$('nt').textContent=type==='decision'?'Decision':'Chance';$('tu').textContent=$('ul').value+(up!==null?', p='+r(up):'');$('tl').textContent=$('ll').value+(lp!==null?', p='+r(lp):'');$('pu').textContent=s(ux);$('pl').textContent=s(lx); if(type==='decision'){if(up!==null||lp!==null) msg.push(m('bad','Decision branches should not have probabilities.')); else msg.push(m('good','Correct: a decision node has choice branches with no probabilities.'));let choose=ux>lx?'upper':lx>ux?'lower':'tie';$('formula').textContent=`Decision rule: choose the greater branch value.
Upper = ${r(ux)}
Lower = ${r(lx)}
${choose==='tie'?'The two choices are tied.':'Choose the '+choose+' branch.'}`;} else {if(up===null||lp===null) msg.push(m('bad','Chance branches need probabilities.')); if(up!==null&&lp!==null&&Math.abs(up+lp-1)>.002) msg.push(m('bad','Chance probabilities should add to 1.')); if(msg.length===0) msg.push(m('good','Correct: a chance node has probability branches.')); let emv=(up||0)*ux+(lp||0)*lx;$('formula').textContent=`Chance rule: calculate EMV. Do not cross off chance branches.
EMV = (${up??'?'})(${r(ux)}) + (${lp??'?'})(${r(lx)}) = ${Number.isFinite(emv)?r(emv):'?'}`;} $('msg').innerHTML=msg.join('');}
$('check').onclick=run;$('decision').onclick=()=>{$('type').value='decision';$('ul').value='play';$('up').value='';$('ux').value='.25';$('ll').value='do not play';$('lp').value='';$('lx').value='0';run();};$('chance').onclick=()=>{$('type').value='chance';$('ul').value='total 6 or more';$('up').value='.375';$('ux').value='4';$('ll').value='less than 6';$('lp').value='.625';$('lx').value='-2';run();};['type','ul','up','ux','ll','lp','lx'].forEach(id=>$(id).addEventListener('input',run));run();
</script></body></html>
