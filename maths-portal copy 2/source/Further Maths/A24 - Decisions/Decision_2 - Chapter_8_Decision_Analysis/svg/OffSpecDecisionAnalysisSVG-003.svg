<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="950" viewBox="0 0 1600 950" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Jess Example: Multi-Stage Decision Tree</title>
  <desc id="desc">Multi-stage decision tree for Jess with later decision after losing.</desc>
  <defs>
    <style><![CDATA[
      .bg{fill:#FAF9F6} .panel{fill:#FFFFF0;stroke:#E5E5EA;stroke-width:2} .node{fill:#FAF9F6;stroke:#C5A059;stroke-width:4} .chance{fill:#FFFFF0;stroke:#D4AF37;stroke-width:4} .pay{fill:#FBEFEF;stroke:#C5A059;stroke-width:4} .branch{stroke:#2C2C2E;stroke-width:3;fill:none;stroke-linecap:round} .chosen{stroke:#C5A059;stroke-width:4;fill:none;stroke-linecap:round} .cross{stroke:#C5A059;stroke-width:5;stroke-linecap:round} .text{fill:#2C2C2E;font-family:Inter,Arial,sans-serif} .title{font-size:36px;font-weight:700} .small{font-size:17px} .label{font-size:22px;font-weight:700} .math{fill:#2C2C2E;font-family:Times New Roman,serif;font-size:24px}
    ]]></style>
  </defs>
  <rect class="bg" width="1600" height="950"/>
  <text class="text title" x="60" y="70">Jess Example: Multi-Stage Decision Tree</text>
  
  <text class="text small" x="60" y="108">Initial best strategy: do not play. Conditional later strategy: play again if already lost.</text>
  <rect class="panel" x="55" y="140" width="1490" height="705" rx="24"/>
  <rect class="node" x="120" y="430" width="105" height="75" rx="8"/><text class="text small" x="135" y="475">decision</text>
  <path class="branch" d="M225 468 C340 345 460 255 590 240"/><path class="chosen" d="M225 468 C360 610 480 680 625 730"/>
  <line class="cross" x1="340" y1="342" x2="375" y2="377"/><line class="cross" x1="352" y1="330" x2="387" y2="365"/>
  <text class="math" x="338" y="338">p: play</text><text class="math" x="342" y="640">~p: do not play</text>
  <circle class="chance" cx="635" cy="240" r="58"/><text class="math" x="596" y="235">EMV</text><text class="math" x="596" y="263">−1/3</text>
  <path class="branch" d="M693 240 C815 160 930 135 1045 125"/><text class="math" x="795" y="152">same score, 1/6</text><polygon class="pay" points="1135,85 1050,125 1135,165"/><text class="math" x="1155" y="133">+3</text>
  <path class="branch" d="M693 240 C810 335 905 410 1010 505"/><text class="math" x="780" y="352">different score, 5/6</text>
  <rect class="node" x="1010" y="466" width="115" height="80" rx="8"/><text class="text small" x="1022" y="513">decision</text>
  <path class="chosen" d="M1125 506 C1210 435 1295 380 1385 355"/><path class="branch" d="M1125 506 C1205 565 1290 600 1385 625"/>
  <line class="cross" x1="1240" y1="570" x2="1275" y2="605"/><line class="cross" x1="1252" y1="558" x2="1287" y2="593"/>
  <text class="math" x="1208" y="425">play again</text><text class="math" x="1195" y="590">do not play again</text>
  <circle class="chance" cx="1418" cy="342" r="52"/><text class="math" x="1390" y="337">EMV</text><text class="math" x="1400" y="365">−1</text>
  <path class="branch" d="M1468 330 C1505 295 1525 250 1540 205"/><path class="branch" d="M1468 354 C1505 395 1525 445 1540 495"/>
  <text class="math" x="1458" y="253">match, 1/3</text><text class="math" x="1456" y="450">no match, 2/3</text>
  <polygon class="pay" points="1584,165 1512,205 1584,245"/><text class="math" x="1534" y="208">+3</text><polygon class="pay" points="1584,455 1512,495 1584,535"/><text class="math" x="1532" y="499">−3</text>
  <polygon class="pay" points="1470,585 1390,625 1470,665"/><text class="math" x="1490" y="633">−2</text><polygon class="pay" points="720,690 635,730 720,770"/><text class="math" x="740" y="738">0</text>
  <rect class="panel" x="440" y="875" width="720" height="50" rx="16"/><text class="text label" x="470" y="907">Best strategy: do not play initially; if already lost, play again.</text>

</svg>
