<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Theta Loop Trainer</title><!-- Asset ID: OffSpecTransportationProblemsEnrichmentWidget-005 | Purpose: Choose theta from decreasing cells only. | CCEA status: Off-spec enrichment only --><style>:root{--canvas:#FAF9F6;--panel:#FFFFF0;--line:#E5E5EA;--accent:#C5A059;--text:#2C2C2E}body{margin:0;padding:24px;background:var(--canvas);color:var(--text);font-family:Inter,Arial,sans-serif}.widget{max-width:960px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px}label{display:block;font-weight:700;margin:14px 0}textarea,input{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;background:white}button{border:1px solid var(--accent);background:var(--accent);color:white;border-radius:999px;padding:12px 18px;font-weight:700}.out{margin-top:18px;background:white;border:1px solid var(--line);border-radius:16px;padding:16px}table{border-collapse:collapse;margin-top:10px}th,td{border:1px solid var(--line);padding:8px 12px;text-align:center}</style></head><body><main class="widget"><h1>Theta Loop Trainer</h1><p>Choose theta from decreasing cells only.</p>
<label>Decreasing cell values <textarea id="vals">11,12</textarea></label><label>Proposed θ <input id="t" type="number" value="11"></label><button onclick="go()">Check theta</button><div id="out" class="out"></div><script>function p(x){return x.split(/[ ,\n]+/).filter(Boolean).map(Number)}function go(){let a=p(vals.value),t=+document.getElementById('t').value,m=Math.min(...a);let exits=a.map((x,i)=>x==m?i+1:null).filter(Boolean);out.innerHTML='Maximum safe θ = min('+a.join(', ')+') = <b>'+m+'</b>.<br>'+(t==m?'Correct largest safe value.':t<m?'Allowed, but not largest.':'Too large: would create a negative allocation.')+'<br>Exiting cell(s): '+exits.join(', ')}</script>
</main></body></html>
