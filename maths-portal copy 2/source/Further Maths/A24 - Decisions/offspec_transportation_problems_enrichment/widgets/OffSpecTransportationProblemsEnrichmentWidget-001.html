<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Balance Checker</title><!-- Asset ID: OffSpecTransportationProblemsEnrichmentWidget-001 | Purpose: Check whether total supply equals total demand and identify a dummy point. | CCEA status: Off-spec enrichment only --><style>:root{--canvas:#FAF9F6;--panel:#FFFFF0;--line:#E5E5EA;--accent:#C5A059;--text:#2C2C2E}body{margin:0;padding:24px;background:var(--canvas);color:var(--text);font-family:Inter,Arial,sans-serif}.widget{max-width:960px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px}label{display:block;font-weight:700;margin:14px 0}textarea,input{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;background:white}button{border:1px solid var(--accent);background:var(--accent);color:white;border-radius:999px;padding:12px 18px;font-weight:700}.out{margin-top:18px;background:white;border:1px solid var(--line);border-radius:16px;padding:16px}table{border-collapse:collapse;margin-top:10px}th,td{border:1px solid var(--line);padding:8px 12px;text-align:center}</style></head><body><main class="widget"><h1>Balance Checker</h1><p>Check whether total supply equals total demand and identify a dummy point.</p>
<label>Supplies <textarea id="s">14,16,20</textarea></label><label>Demands <textarea id="d">11,15,14,10</textarea></label><button onclick="go()">Check balance</button><div id="out" class="out">Enter values and check.</div><script>function p(x){return x.split(/[ ,\n]+/).filter(Boolean).map(Number)}function sum(a){return a.reduce((x,y)=>x+y,0)}function go(){let ss=p(document.getElementById('s').value),dd=p(document.getElementById('d').value),S=sum(ss),D=sum(dd),o=document.getElementById('out');if(ss.some(x=>!isFinite(x)||x<0)||dd.some(x=>!isFinite(x)||x<0)){o.innerHTML='Use non-negative numbers only.';return}if(S==D)o.innerHTML='<b>Balanced.</b><br>Total supply = '+S+'; total demand = '+D+'. No dummy needed.';else if(S>D)o.innerHTML='<b>Excess supply.</b><br>Add dummy demand '+(S-D)+'. Dummy routes have zero cost.';else o.innerHTML='<b>Excess demand.</b><br>Add dummy supply '+(D-S)+'. Demand assigned to dummy supply is unmet in reality.'}</script>
</main></body></html>
