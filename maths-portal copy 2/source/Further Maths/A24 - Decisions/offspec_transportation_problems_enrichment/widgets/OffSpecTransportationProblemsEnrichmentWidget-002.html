<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>North-West Corner Practice</title><!-- Asset ID: OffSpecTransportationProblemsEnrichmentWidget-002 | Purpose: Run the north-west corner method on a balanced supply and demand list. | CCEA status: Off-spec enrichment only --><style>:root{--canvas:#FAF9F6;--panel:#FFFFF0;--line:#E5E5EA;--accent:#C5A059;--text:#2C2C2E}body{margin:0;padding:24px;background:var(--canvas);color:var(--text);font-family:Inter,Arial,sans-serif}.widget{max-width:960px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px}label{display:block;font-weight:700;margin:14px 0}textarea,input{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;background:white}button{border:1px solid var(--accent);background:var(--accent);color:white;border-radius:999px;padding:12px 18px;font-weight:700}.out{margin-top:18px;background:white;border:1px solid var(--line);border-radius:16px;padding:16px}table{border-collapse:collapse;margin-top:10px}th,td{border:1px solid var(--line);padding:8px 12px;text-align:center}</style></head><body><main class="widget"><h1>North-West Corner Practice</h1><p>Run the north-west corner method on a balanced supply and demand list.</p>
<label>Supplies <textarea id="s">14,16,20</textarea></label><label>Demands <textarea id="d">11,15,14,10</textarea></label><button onclick="run()">Run north-west corner</button><div id="out" class="out">Enter balanced lists and run.</div><script>function p(x){return x.split(/[ ,\n]+/).filter(Boolean).map(Number)}function sum(a){return a.reduce((x,y)=>x+y,0)}function run(){let ss=p(document.getElementById('s').value),dd=p(document.getElementById('d').value),rs=[...ss],rd=[...dd],i=0,j=0,alloc=ss.map(()=>dd.map(()=>'')),steps=[];if(sum(ss)!=sum(dd)){out.innerHTML='Unbalanced: add a dummy point first.';return}while(i<ss.length&&j<dd.length){let a=Math.min(rs[i],rd[j]);alloc[i][j]=a;rs[i]-=a;rd[j]-=a;steps.push('Allocate '+a+' to S'+(i+1)+'D'+(j+1)+'.');if(rs[i]==0&&rd[j]==0){i++;j++;steps.push('Both completed: check for degeneracy.')}else if(rs[i]==0){i++;steps.push('Supply depleted: move down.')}else{j++;steps.push('Demand fulfilled: move right.')}}let html='<table><tr><th></th>'+dd.map((_,k)=>'<th>D'+(k+1)+'</th>').join('')+'</tr>';alloc.forEach((r,k)=>html+='<tr><th>S'+(k+1)+'</th>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>');html+='</table><ol>'+steps.map(x=>'<li>'+x+'</li>').join('')+'</ol>';out.innerHTML=html}</script>
</main></body></html>
