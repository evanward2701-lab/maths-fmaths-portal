<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Occupied Cell Checker</title><!-- Asset ID: OffSpecTransportationProblemsEnrichmentWidget-003 | Purpose: Check the degeneracy count m+n-1. | CCEA status: Off-spec enrichment only --><style>:root{--canvas:#FAF9F6;--panel:#FFFFF0;--line:#E5E5EA;--accent:#C5A059;--text:#2C2C2E}body{margin:0;padding:24px;background:var(--canvas);color:var(--text);font-family:Inter,Arial,sans-serif}.widget{max-width:960px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px}label{display:block;font-weight:700;margin:14px 0}textarea,input{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;background:white}button{border:1px solid var(--accent);background:var(--accent);color:white;border-radius:999px;padding:12px 18px;font-weight:700}.out{margin-top:18px;background:white;border:1px solid var(--line);border-radius:16px;padding:16px}table{border-collapse:collapse;margin-top:10px}th,td{border:1px solid var(--line);padding:8px 12px;text-align:center}</style></head><body><main class="widget"><h1>Occupied Cell Checker</h1><p>Check the degeneracy count m+n-1.</p>
<label>Sources m <input id="m" type="number" value="3"></label><label>Destinations n <input id="n" type="number" value="4"></label><label>Occupied cells <input id="o" type="number" value="6"></label><button onclick="go()">Check</button><div id="out" class="out"></div><script>function go(){let m=+document.getElementById('m').value,n=+document.getElementById('n').value,o=+document.getElementById('o').value,r=m+n-1;if(o<r)out.innerHTML='Degenerate: '+o+' < '+r+'. Add '+(r-o)+' zero allocation(s).';else if(o==r)out.innerHTML='Non-degenerate count: '+o+' = '+r+'.';else out.innerHTML='Too many occupied cells: expected '+r+', got '+o+'.'}</script>
</main></body></html>
