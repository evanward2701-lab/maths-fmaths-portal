<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Improvement Index Calculator</title><!-- Asset ID: OffSpecTransportationProblemsEnrichmentWidget-004 | Purpose: Calculate Iij = cij - (ui + vj). | CCEA status: Off-spec enrichment only --><style>:root{--canvas:#FAF9F6;--panel:#FFFFF0;--line:#E5E5EA;--accent:#C5A059;--text:#2C2C2E}body{margin:0;padding:24px;background:var(--canvas);color:var(--text);font-family:Inter,Arial,sans-serif}.widget{max-width:960px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px}label{display:block;font-weight:700;margin:14px 0}textarea,input{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;background:white}button{border:1px solid var(--accent);background:var(--accent);color:white;border-radius:999px;padding:12px 18px;font-weight:700}.out{margin-top:18px;background:white;border:1px solid var(--line);border-radius:16px;padding:16px}table{border-collapse:collapse;margin-top:10px}th,td{border:1px solid var(--line);padding:8px 12px;text-align:center}</style></head><body><main class="widget"><h1>Improvement Index Calculator</h1><p>Calculate Iij = cij - (ui + vj).</p>
