<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
  <title id="title">Transportation Table Anatomy</title>
  <desc id="desc">A labelled table showing route costs, sources, destinations, stock and demand.</desc>
  <rect width="1100" height="760" fill="#FAF9F6"/>
  <text x="550" y="55" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" fill="#2C2C2E" font-weight="700">Transportation Table Anatomy</text>
  <text x="550" y="88" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#2C2C2E">Off-spec enrichment only</text>
  
  <g transform="translate(140,140)" font-family="Inter, Arial, sans-serif">
    <rect x="0" y="0" width="820" height="440" rx="18" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="2"/>
    <g stroke="#E5E5EA" stroke-width="2">
      <line x1="160" y1="0" x2="160" y2="440"/><line x1="290" y1="0" x2="290" y2="440"/><line x1="420" y1="0" x2="420" y2="440"/><line x1="550" y1="0" x2="550" y2="440"/><line x1="680" y1="0" x2="680" y2="440"/>
      <line x1="0" y1="75" x2="820" y2="75"/><line x1="0" y1="160" x2="820" y2="160"/><line x1="0" y1="245" x2="820" y2="245"/><line x1="0" y1="330" x2="820" y2="330"/>
    </g>
    <g text-anchor="middle" fill="#2C2C2E" font-weight="700">
      <text x="80" y="45">Source</text><text x="225" y="45">W</text><text x="355" y="45">X</text><text x="485" y="45">Y</text><text x="615" y="45">Z</text><text x="750" y="45">Stock</text>
      <text x="80" y="125">A</text><text x="80" y="210">B</text><text x="80" y="295">C</text><text x="80" y="385">Demand</text>
    </g>
    
    <rect x="160" y="75" width="520" height="255" fill="#FBEFEF" opacity="0.55"/>
    <g text-anchor="middle" fill="#2C2C2E" font-size="20">
      <text x="225" y="125">180</text><text x="355" y="125">110</text><text x="485" y="125">130</text><text x="615" y="125">290</text>
      <text x="225" y="210">190</text><text x="355" y="210">250</text><text x="485" y="210">150</text><text x="615" y="210">280</text>
      <text x="225" y="295">240</text><text x="355" y="295">270</text><text x="485" y="295">190</text><text x="615" y="295">120</text>
      <text x="750" y="125" font-weight="700">14</text><text x="750" y="210" font-weight="700">16</text><text x="750" y="295" font-weight="700">20</text>
      <text x="225" y="385" font-weight="700">11</text><text x="355" y="385" font-weight="700">15</text><text x="485" y="385" font-weight="700">14</text><text x="615" y="385" font-weight="700">10</text><text x="750" y="385" font-weight="700">50</text>
    </g>
    <text x="410" y="480" text-anchor="middle" fill="#2C2C2E">Inside grid = unit costs; right edge = stock; bottom edge = demand.</text>

  </g>

</svg>
