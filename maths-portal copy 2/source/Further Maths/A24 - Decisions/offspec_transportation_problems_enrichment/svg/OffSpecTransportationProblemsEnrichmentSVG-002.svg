  <text x="550" y="55" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" fill="#2C2C2E" font-weight="700">North-West Corner Method</text>
  <text x="550" y="88" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#2C2C2E">Off-spec enrichment only</text>
  
  <g transform="translate(140,140)" font-family="Inter, Arial, sans-serif">
    <rect x="0" y="0" width="820" height="440" rx="18" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="2"/>
    <g stroke="#E5E5EA" stroke-width="2">
      <line x1="160" y1="0" x2="160" y2="440"/><line x1="290" y1="0" x2="290" y2="440"/><line x1="420" y1="0" x2="420" y2="440"/><line x1="550" y1="0" x2="550" y2="440"/><line x1="680" y1="0" x2="680" y2="440"/>
      <line x1="0" y1="75" x2="820" y2="75"/><line x1="0" y1="160" x2="820" y2="160"/><line x1="0" y1="245" x2="820" y2="245"/><line x1="0" y1="330" x2="820" y2="330"/>
    </g>
    <g text-anchor="middle" fill="#2C2C2E" font-weight="700">
      <text x="80" y="45">Source</text><text x="225" y="45">W</text><text x="355" y="45">X</text><text x="485" y="45">Y</text><text x="615" y="45">Z</text><text x="750" y="45">Stock</text>
      <text x="80" y="125">A</text><text x="80" y="210">B</text><text x="80" y="295">C</text><text x="80" y="385">Demand</text>
    </g>
    
    <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C5A059"/></marker></defs>
    <g fill="#FBEFEF"><rect x="160" y="75" width="130" height="85"/><rect x="290" y="75" width="130" height="85"/><rect x="290" y="160" width="130" height="85"/><rect x="420" y="160" width="130" height="85"/><rect x="420" y="245" width="130" height="85"/><rect x="550" y="245" width="130" height="85"/></g>
