  <g font-family="Inter, Arial, sans-serif"><g transform="translate(70,150)"><rect x="0" y="0" width="310" height="420" rx="22" fill="#FFFFF0" stroke="#E5E5EA"/><text x="155" y="45" text-anchor="middle" font-size="22" fill="#2C2C2E" font-weight="700">Balanced</text><text x="155" y="120" text-anchor="middle" font-size="34" fill="#C5A059" font-weight="700">50 = 50</text><rect x="40" y="180" width="230" height="120" rx="18" fill="#FBEFEF"/><text x="155" y="230" text-anchor="middle" font-size="18" fill="#2C2C2E" font-weight="700">No dummy point</text><text x="155" y="350" text-anchor="middle" font-size="16" fill="#2C2C2E">Dummy route cost = 0</text></g><g transform="translate(395,150)"><rect x="0" y="0" width="310" height="420" rx="22" fill="#FFFFF0" stroke="#E5E5EA"/><text x="155" y="45" text-anchor="middle" font-size="22" fill="#2C2C2E" font-weight="700">Excess supply</text><text x="155" y="120" text-anchor="middle" font-size="34" fill="#C5A059" font-weight="700">150 > 120</text><rect x="40" y="180" width="230" height="120" rx="18" fill="#FBEFEF"/><text x="155" y="230" text-anchor="middle" font-size="18" fill="#2C2C2E" font-weight="700">Add dummy demand 30</text><text x="155" y="350" text-anchor="middle" font-size="16" fill="#2C2C2E">Dummy route cost = 0</text></g><g transform="translate(720,150)"><rect x="0" y="0" width="310" height="420" rx="22" fill="#FFFFF0" stroke="#E5E5EA"/><text x="155" y="45" text-anchor="middle" font-size="22" fill="#2C2C2E" font-weight="700">Excess demand</text><text x="155" y="120" text-anchor="middle" font-size="34" fill="#C5A059" font-weight="700">214 > 190</text><rect x="40" y="180" width="230" height="120" rx="18" fill="#FBEFEF"/><text x="155" y="230" text-anchor="middle" font-size="18" fill="#2C2C2E" font-weight="700">Add dummy supply 24</text><text x="155" y="350" text-anchor="middle" font-size="16" fill="#2C2C2E">Dummy route cost = 0</text></g></g><text x="550" y="660" text-anchor="middle" font-family="Inter, Arial, sans-serif" fill=