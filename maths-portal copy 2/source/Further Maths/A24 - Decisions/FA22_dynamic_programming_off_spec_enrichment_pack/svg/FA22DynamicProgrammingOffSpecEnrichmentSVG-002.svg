<svg width="1000" height="600" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">Bellman’s Principle of Optimality</title><desc id="desc">Bellman’s Principle of Optimality</desc><rect width="1000" height="600" fill="#FAF9F6"/><rect x="40" y="40" width="920" height="520" rx="24" fill="#FFFFF0" stroke="#E5E5EA"/><text x="500" y="90" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#2C2C2E">Bellman’s Principle of Optimality</text><text x="500" y="190" text-anchor="middle" font-family="Arial" font-size="24">Any part of an optimal path is an optimal path.</text><text x="500" y="300" text-anchor="middle" font-family="Arial" font-size="18">SABCT contains SABC, SAB, SA and ABC.</text><text x="500" y="540" text-anchor="middle" font-family="Arial" font-size="16" fill="#2C2C2E">Off-spec enrichment only</text></svg>