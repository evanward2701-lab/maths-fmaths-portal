<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="760" viewBox="0 0 1450 760" role="img" aria-labelledby="title desc"><title id="title">Supersource and supersink transformation</title><desc id="desc">Multiple sources and sinks connected to artificial supersource and supersink.</desc><defs><marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto"><path d="M2,2 L11,6.5 L2,11 Z" fill="#2C2C2E"/></marker></defs><rect width="1450" height="760" fill="#FAF9F6"/><rect x="55" y="45" width="1340" height="665" rx="30" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/><text x="725" y="100" text-anchor="middle" font-family="Georgia" font-size="38" fill="#2C2C2E" font-weight="700">Supersources and supersinks</text><text x="725" y="140" text-anchor="middle" font-family="Arial" font-size="22" fill="#2C2C2E">Turn multiple sources and sinks into one artificial source and one artificial sink.</text><g stroke="#2C2C2E" stroke-width="5" fill="none" marker-end="url(#arrow)"><line x1="235" y1="250" x2="390" y2="200"/><line x1="235" y1="250" x2="390" y2="300"/><line x1="235" y1="250" x2="390" y2="400"/><line x1="1060" y1="200" x2="1215" y2="250"/><line x1="1060" y1="300" x2="1215" y2="250"/><line x1="1060" y1="400" x2="1215" y2="250"/></g><g font-family="Georgia" font-size="32" font-weight="700" text-anchor="middle"><circle cx="190" cy="250" r="46" fill="#FBEFEF" stroke="#C5A059" stroke-width="5"/><text x="190" y="260" fill="#2C2C2E">S*</text><circle cx="430" cy="200" r="36" fill="#FAF9F6" stroke="#C5A059" stroke-width="4"/><text x="430" y="210" fill="#2C2C2E">A</text><circle cx="430" cy="300" r="36" fill="#FAF9F6" stroke="#C5A059" stroke-width="4"/><text x="430" y="310" fill="#2C2C2E">B</text><circle cx="430" cy="400" r="36" fill="#FAF9F6" stroke="#C5A059" stroke-width="4"/><text x="430" y="410" fill="#2C2C2E">C</text><circle cx="1020" cy="200" r="36" fill="#FAF9F6" stroke="#C5A059" stroke-width="4"/><text x="1020" y="210" fill="#2C2C2E">H</text><circle cx="1020" cy="300" r="36" fill="#FAF9F6" stroke="#C5A059" stroke-width="4"/><text x="1020" y="310" fill="#2C2C2E">F</text><circle cx="1020" cy="400" r="36" fill="#FAF9F6" stroke="#C5A059" stroke-width="4"/><text x="1020" y="410" fill="#2C2C2E">I</text><circle cx="1260" cy="250" r="46" fill="#FBEFEF" stroke="#C5A059" stroke-width="5"/><text x="1260" y="260" fill="#2C2C2E">T*</text></g><rect x="160" y="520" width="1130" height="115" rx="24" fill="#FBEFEF" stroke="#E5E5EA" stroke-width="3"/><text x="725" y="565" text-anchor="middle" font-family="Arial" font-size="23" fill="#2C2C2E" font-weight="700">Rule for lower and upper capacities</text><text x="725" y="602" text-anchor="middle" font-family="Georgia" font-size="28" fill="#2C2C2E">New artificial arc label = (sum of lower capacities, sum of upper capacities)</text></svg>