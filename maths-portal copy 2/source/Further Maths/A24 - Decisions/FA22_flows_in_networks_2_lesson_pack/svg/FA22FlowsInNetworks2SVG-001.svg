<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Lower and upper capacity notation</title><desc id="desc">Arc A to B labelled (3,5), showing 3 less than or equal to f_AB less than or equal to 5.</desc>
<defs><marker id="a" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M2,2 L12,7 L2,12 Z" fill="#C5A059"/></marker></defs>
<rect width="1200" height="520" fill="#FAF9F6"/><rect x="70" y="50" width="1060" height="420" rx="28" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/>
<text x="600" y="100" text-anchor="middle" font-family="Georgia" font-size="34" fill="#2C2C2E" font-weight="700">Capacity pair notation on a directed arc</text>
<line x1="250" y1="245" x2="750" y2="245" stroke="#2C2C2E" stroke-width="8" stroke-linecap="round" marker-end="url(#a)"/>
<circle cx="220" cy="245" r="34" fill="#FAF9F6" stroke="#C5A059" stroke-width="5"/><circle cx="800" cy="245" r="34" fill="#FAF9F6" stroke="#C5A059" stroke-width="5"/>
<text x="220" y="255" text-anchor="middle" font-family="Georgia" font-size="34" fill="#2C2C2E" font-weight="700">A</text><text x="800" y="255" text-anchor="middle" font-family="Georgia" font-size="34" fill="#2C2C2E" font-weight="700">B</text>
<rect x="455" y="160" width="150" height="72" rx="18" fill="#FBEFEF" stroke="#C5A059" stroke-width="3"/><text x="530" y="207" text-anchor="middle" font-family="Georgia" font-size="38" fill="#2C2C2E">(3, 5)</text>
<rect x="395" y="285" width="410" height="70" rx="20" fill="#FFFFF0" stroke="#D4AF37" stroke-width="3"/><text x="600" y="330" text-anchor="middle" font-family="Georgia" font-size="31" fill="#2C2C2E">3 ≤ f<tspan baseline-shift="sub" font-size="20">AB</tspan> ≤ 5</text>
<rect x="145" y="335" width="300" height="72" rx="18" fill="#FAF9F6" stroke="#E5E5EA" stroke-width="3"/><text x="295" y="365" text-anchor="middle" font-family="Arial" font-size="22" fill="#2C2C2E" font-weight="700">lower capacity</text><text x="295" y="394" text-anchor="middle" font-family="Georgia" font-size="28" fill="#2C2C2E">l = 3</text>
<rect x="705" y="335" width="300" height="72" rx="18" fill="#FAF9F6" stroke="#E5E5EA" stroke-width="3"/><text x="855" y="365" text-anchor="middle" font-family="Arial" font-size="22" fill="#2C2C2E" font-weight="700">upper capacity</text><text x="855" y="394" text-anchor="middle" font-family="Georgia" font-size="28" fill="#2C2C2E">u = 5</text>
