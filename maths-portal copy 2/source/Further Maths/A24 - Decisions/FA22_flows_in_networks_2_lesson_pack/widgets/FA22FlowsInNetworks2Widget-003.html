<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Feasible Flow Node Checker</title><style>:root{--canvas:#FAF9F6;--panel:#FFFFF0;--line:#E5E5EA;--accent:#C5A059;--soft:#FBEFEF;--ink:#2C2C2E}body{margin:0;background:var(--canvas);color:var(--ink);font-family:Arial,sans-serif}.widget{max-width:1000px;margin:24px auto;padding:24px;background:var(--panel);border:2px solid var(--line);border-radius:24px}h1{font-family:Georgia,serif}textarea,input{width:100%;padding:10px;border:1px solid var(--line);border-radius:12px}button{border:0;border-radius:999px;padding:12px 18px;background:var(--accent);color:white;font-weight:700;margin-top:12px}.card{background:var(--canvas);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}.result{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:18px}.rule{background:var(--soft);border-radius:16px;padding:16px;margin:18px 0;font-family:Georgia,serif}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main class="widget"><h1>Feasible Flow Node Checker</h1><p>Check capacity limits and node balance.</p><div class="rule">At an intermediate node: total flow in = total flow out, and each arc satisfies l ≤ f ≤ u.</div><div class="grid"><div class="card"><label>Incoming arcs: name,lower,upper,flow</label><textarea id="in">SC,2,8,2
BC,4,6,4</textarea></div><div class="card"><label>Outgoing arcs: name,lower,upper,flow</label><textarea id="out">CG,3,6,6</textarea></div></div><button onclick="check()">Check node</button><section id="r" class="result">Result will appear here.</section></main><script>function parse(t){return t.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>{let p=x.split(',').map(y=>y.trim());return{name:p[0],l:+p[1],u:+p[2],f:+p[3]}})}function check(){let a=parse(document.getElementById('in').value),b=parse(document.getElementById('out').value),si=a.reduce((s,x)=>s+x.f,0),so=b.reduce((s,x)=>s+x.f,0),bad=a.concat(b).filter(x=>!(x.l<=x.f&&x.f<=x.u));document.getElementById('r').innerHTML=`Σ in = ${si}<br>Σ out = ${so}<br>${si===so&&bad.length===0?'<strong>Feasible at this node.</strong>':'<strong>Not feasible: capacity violation or node imbalance.</strong>'}`}</script></body></html>
