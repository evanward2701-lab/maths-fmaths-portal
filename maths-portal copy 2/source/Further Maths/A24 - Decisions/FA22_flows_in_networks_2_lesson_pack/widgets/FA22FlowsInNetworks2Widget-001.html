<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cut Value Calculator</title><style>:root{--canvas:#FAF9F6;--panel:#FFFFF0;--line:#E5E5EA;--accent:#C5A059;--soft:#FBEFEF;--ink:#2C2C2E}body{margin:0;background:var(--canvas);color:var(--ink);font-family:Arial,sans-serif}.widget{max-width:1000px;margin:24px auto;padding:24px;background:var(--panel);border:2px solid var(--line);border-radius:24px}h1{font-family:Georgia,serif}textarea,input{width:100%;padding:10px;border:1px solid var(--line);border-radius:12px}button{border:0;border-radius:999px;padding:12px 18px;background:var(--accent);color:white;font-weight:700;margin-top:12px}.card{background:var(--canvas);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}.result{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:18px}.rule{background:var(--soft);border-radius:16px;padding:16px;margin:18px 0;font-family:Georgia,serif}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main class="widget"><h1>Cut Value Calculator</h1><p>Forward crossing arcs use upper capacities. Backward crossing arcs use lower capacities and are subtracted.</p><div class="rule">cut value = Σ upper forwards − Σ lower backwards</div><div class="grid"><div class="card"><label>Forward upper capacities</label><textarea id="f">12, 6, 8, 7, 6</textarea></div><div class="card"><label>Backward lower capacities</label><textarea id="b">4</textarea></div></div><button onclick="calc()">Calculate</button><section id="r" class="result">Result will appear here.</section></main><script>function nums(x){return x.trim()?x.split(/[\s,;]+/).filter(Boolean).map(Number):[]}function sum(a){return a.reduce((s,x)=>s+x,0)}function calc(){let f=nums(document.getElementById('f').value),b=nums(document.getElementById('b').value);if(f.some(isNaN)||b.some(isNaN)){r.innerHTML='Check entries.';return}let sf=sum(f),sb=sum(b),v=sf-sb;document.getElementById('r').innerHTML=`Forward total = ${sf}<br>Backward lower total = ${sb}<br><strong>Cut value = ${v}</strong>`}</script></body></html>
