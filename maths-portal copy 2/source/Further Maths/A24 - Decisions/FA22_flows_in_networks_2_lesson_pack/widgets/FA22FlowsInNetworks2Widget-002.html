<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Residual Arrow Checker</title><style>:root{--canvas:#FAF9F6;--panel:#FFFFF0;--line:#E5E5EA;--accent:#C5A059;--soft:#FBEFEF;--ink:#2C2C2E}body{margin:0;background:var(--canvas);color:var(--ink);font-family:Arial,sans-serif}.widget{max-width:1000px;margin:24px auto;padding:24px;background:var(--panel);border:2px solid var(--line);border-radius:24px}h1{font-family:Georgia,serif}textarea,input{width:100%;padding:10px;border:1px solid var(--line);border-radius:12px}button{border:0;border-radius:999px;padding:12px 18px;background:var(--accent);color:white;font-weight:700;margin-top:12px}.card{background:var(--canvas);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}.result{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:18px}.rule{background:var(--soft);border-radius:16px;padding:16px;margin:18px 0;font-family:Georgia,serif}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main class="widget"><h1>Residual Arrow Checker</h1><p>For lower/upper capacity arcs: forward residual = u − f and backward residual = f − l.</p><div class="rule">forward = u − f &nbsp; | &nbsp; backward = f − l</div><div class="grid"><div class="card"><label>Lower l</label><input id="l" type="number" value="15"></div><div class="card"><label>Flow f</label><input id="f" type="number" value="17"></div><div class="card"><label>Upper u</label><input id="u" type="number" value="20"></div></div><button onclick="calc()">Calculate</button><section id="r" class="result">Result will appear here.</section></main><script>function calc(){let l=+document.getElementById('l').value,f=+document.getElementById('f').value,u=+document.getElementById('u').value;let ok=l<=f&&f<=u;document.getElementById('r').innerHTML=`Forward residual = ${u} − ${f} = <strong>${u-f}</strong><br>Backward residual = ${f} − ${l} = <strong>${f-l}</strong><br>${ok?'Feasible arc flow.':'Not feasible: check l ≤ f ≤ u.'}`}</script></body></html>
