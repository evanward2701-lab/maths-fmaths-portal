<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="760"
     viewBox="0 0 1200 760"
     role="img"
     aria-labelledby="title desc">
  <title id="title">FAS2RecurrenceRelationshipsSVG-002: Anatomy of a first-order recurrence</title>
  <desc id="desc">Diagram labelling the current term, homogeneous part, non-homogeneous part, complementary function and particular solution route for a first-order recurrence.</desc>

  <metadata>
    <![CDATA[
    Asset ID: FAS2RecurrenceRelationshipsSVG-002
    Source: Uploaded recurrence transcript, first-order homogeneous and non-homogeneous solving sections.
    Related lesson section: # 9. Visual Asset Integration
    Used placeholder: FAS2RecurrenceRelationshipsSVG-002
    Purpose: Show how u_n = a u_{n-1} + g(n) splits into homogeneous and non-homogeneous parts.
    ]]>
  </metadata>

  <defs>
    <marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#C5A059"/>
    </marker>
    <style>
      .bg { fill: #FAF9F6; }
      .card { fill: #FFFFF0; stroke: #E5E5EA; stroke-width: 2; rx: 22; }
      .accentCard { fill: #FBEFEF; stroke: #D4AF37; stroke-width: 2; rx: 22; }
      .title { font-family: Inter, Arial, sans-serif; font-size: 30px; font-weight: 700; fill: #2C2C2E; }
      .subtitle { font-family: Inter, Arial, sans-serif; font-size: 17px; fill: #2C2C2E; }
      .label { font-family: Inter, Arial, sans-serif; font-size: 19px; fill: #2C2C2E; }
      .small { font-family: Inter, Arial, sans-serif; font-size: 15px; fill: #2C2C2E; }
      .math { font-family: Georgia, 'Times New Roman', serif; font-size: 34px; fill: #2C2C2E; }
      .mathMid { font-family: Georgia, 'Times New Roman', serif; font-size: 25px; fill: #2C2C2E; }
      .mathSmall { font-family: Georgia, 'Times New Roman', serif; font-size: 21px; fill: #2C2C2E; }
      .arrow { stroke: #C5A059; stroke-width: 3; fill: none; marker-end: url(#arrowGold); }
      .line { stroke: #E5E5EA; stroke-width: 2; }
      .gold { fill: #C5A059; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="760"/>

  <text x="600" y="58" text-anchor="middle" class="title">Anatomy of a First-Order Recurrence</text>
  <text x="600" y="88" text-anchor="middle" class="subtitle">Split the machine before you solve the machine</text>

  <rect class="accentCard" x="160" y="125" width="880" height="100" rx="22"/>
  <text x="600" y="188" text-anchor="middle" class="math">uₙ = a uₙ₋₁ + g(n)</text>

  <rect class="card" x="80" y="275" width="310" height="150" rx="22"/>
  <text x="235" y="318" text-anchor="middle" class="label">Current term</text>
  <text x="235" y="365" text-anchor="middle" class="mathMid">uₙ</text>
  <text x="235" y="395" text-anchor="middle" class="small">the state at step n</text>

  <rect class="card" x="445" y="275" width="310" height="150" rx="22"/>
  <text x="600" y="318" text-anchor="middle" class="label">Homogeneous part</text>
  <text x="600" y="365" text-anchor="middle" class="mathMid">a uₙ₋₁</text>
  <text x="600" y="395" text-anchor="middle" class="small">previous term multiplied by a</text>

  <rect class="card" x="810" y="275" width="310" height="150" rx="22"/>
  <text x="965" y="318" text-anchor="middle" class="label">Non-homogeneous part</text>
  <text x="965" y="365" text-anchor="middle" class="mathMid">g(n)</text>
  <text x="965" y="395" text-anchor="middle" class="small">extra function of n</text>

  <line class="arrow" x1="600" y1="225" x2="600" y2="270"/>
  <line class="arrow" x1="600" y1="225" x2="235" y2="270"/>
  <line class="arrow" x1="600" y1="225" x2="965" y2="270"/>

  <rect class="accentCard" x="110" y="495" width="440" height="150" rx="22"/>
  <text x="330" y="535" text-anchor="middle" class="label">Complementary function</text>
  <text x="330" y="582" text-anchor="middle" class="mathMid">uₙ = a uₙ₋₁</text>
  <text x="330" y="622" text-anchor="middle" class="mathMid">uₙ = C aⁿ</text>

  <rect class="accentCard" x="650" y="495" width="440" height="150" rx="22"/>
  <text x="870" y="535" text-anchor="middle" class="label">Particular solution</text>
  <text x="870" y="575" text-anchor="middle" class="mathSmall">choose a form to match g(n)</text>
  <text x="870" y="612" text-anchor="middle" class="mathSmall">λ, λn + μ, λqⁿ, …</text>

  <line class="arrow" x1="600" y1="425" x2="330" y2="490"/>
  <line class="arrow" x1="965" y1="425" x2="870" y2="490"/>

  <rect class="card" x="350" y="680" width="500" height="48" rx="18"/>
  <text x="600" y="711" text-anchor="middle" class="mathSmall">general solution = CF + PS</text>
</svg>
