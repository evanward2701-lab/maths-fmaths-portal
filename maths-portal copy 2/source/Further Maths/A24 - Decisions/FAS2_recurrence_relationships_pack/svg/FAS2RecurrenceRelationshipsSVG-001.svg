<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="760"
     viewBox="0 0 1200 760"
     role="img"
     aria-labelledby="title desc">
  <title id="title">FAS2RecurrenceRelationshipsSVG-001: Recurrence form versus closed form</title>
  <desc id="desc">Two-panel comparison showing a recurrence relation using previous terms and a closed form using n directly.</desc>

  <metadata>
    <![CDATA[
    Asset ID: FAS2RecurrenceRelationshipsSVG-001
    Source: Uploaded recurrence transcript and screenshot evidence.
    Related lesson section: # 9. Visual Asset Integration
    Used placeholder: FAS2RecurrenceRelationshipsSVG-001
    Purpose: Compare recursive form and closed form using the add 3 sequence.
    ]]>
  </metadata>

  <defs>
    <marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#C5A059"/>
    </marker>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#E5E5EA" flood-opacity="0.5"/>
    </filter>
    <style>
      .bg { fill: #FAF9F6; }
      .panel { fill: #FFFFF0; stroke: #E5E5EA; stroke-width: 2; rx: 24; filter: url(#softShadow); }
      .panelTitle { font-family: Inter, Arial, sans-serif; font-size: 28px; font-weight: 700; fill: #2C2C2E; }
      .label { font-family: Inter, Arial, sans-serif; font-size: 20px; fill: #2C2C2E; }
      .small { font-family: Inter, Arial, sans-serif; font-size: 16px; fill: #2C2C2E; }
      .math { font-family: Georgia, 'Times New Roman', serif; font-size: 28px; fill: #2C2C2E; }
      .mathSmall { font-family: Georgia, 'Times New Roman', serif; font-size: 22px; fill: #2C2C2E; }
      .accent { fill: #C5A059; }
      .chip { fill: #FBEFEF; stroke: #D4AF37; stroke-width: 1.5; rx: 14; }
      .line { stroke: #C5A059; stroke-width: 3; fill: none; marker-end: url(#arrowGold); }
      .divider { stroke: #E5E5EA; stroke-width: 2; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="760"/>

  <text x="600" y="60" text-anchor="middle" class="panelTitle">Recurrence Form versus Closed Form</text>
  <text x="600" y="92" text-anchor="middle" class="small">Same mathematical movement, different machinery</text>

  <rect class="panel" x="55" y="125" width="520" height="570" rx="24"/>
  <rect class="panel" x="625" y="125" width="520" height="570" rx="24"/>

  <text x="315" y="175" text-anchor="middle" class="panelTitle">Recursive form</text>
  <text x="885" y="175" text-anchor="middle" class="panelTitle">Closed form</text>

  <text x="315" y="230" text-anchor="middle" class="math">uₙ₊₁ = uₙ + 3,   u₀ = 3</text>
  <text x="885" y="230" text-anchor="middle" class="math">uₙ = 3n + 3</text>
  <text x="885" y="262" text-anchor="middle" class="small">when the sequence is indexed from u₀ = 3</text>

  <line class="line" x1="315" y1="265" x2="315" y2="310"/>
  <text x="315" y="340" text-anchor="middle" class="mathSmall">u₀ = 3</text>
  <line class="line" x1="315" y1="355" x2="315" y2="400"/>
  <text x="315" y="430" text-anchor="middle" class="mathSmall">u₁ = u₀ + 3 = 6</text>
  <line class="line" x1="315" y1="445" x2="315" y2="490"/>
  <text x="315" y="520" text-anchor="middle" class="mathSmall">u₂ = u₁ + 3 = 9</text>
  <line class="line" x1="315" y1="535" x2="315" y2="580"/>
  <text x="315" y="610" text-anchor="middle" class="mathSmall">u₃ = u₂ + 3 = 12</text>

  <rect class="chip" x="112" y="640" width="150" height="36" rx="14"/>
  <text x="187" y="664" text-anchor="middle" class="small">uses previous term</text>
  <rect class="chip" x="282" y="640" width="185" height="36" rx="14"/>
  <text x="374.5" y="664" text-anchor="middle" class="small">needs u₀ to start</text>

  <text x="885" y="335" text-anchor="middle" class="mathSmall">u₀ = 3(0) + 3 = 3</text>
  <text x="885" y="385" text-anchor="middle" class="mathSmall">u₁ = 3(1) + 3 = 6</text>
  <text x="885" y="435" text-anchor="middle" class="mathSmall">u₂ = 3(2) + 3 = 9</text>
  <text x="885" y="485" text-anchor="middle" class="mathSmall">u₃ = 3(3) + 3 = 12</text>

  <line class="divider" x1="700" y1="525" x2="1070" y2="525"/>
  <text x="885" y="565" text-anchor="middle" class="mathSmall">uₙ = 3n</text>
  <text x="885" y="598" text-anchor="middle" class="small">also gives 3, 6, 9, … if first term is u₁</text>

  <rect class="chip" x="700" y="640" width="155" height="36" rx="14"/>
  <text x="777.5" y="664" text-anchor="middle" class="small">uses n directly</text>
  <rect class="chip" x="875" y="640" width="195" height="36" rx="14"/>
  <text x="972.5" y="664" text-anchor="middle" class="small">no previous term needed</text>

  <circle cx="600" cy="410" r="38" fill="#FBEFEF" stroke="#D4AF37" stroke-width="2"/>
  <text x="600" y="405" text-anchor="middle" class="small">indexing</text>
  <text x="600" y="426" text-anchor="middle" class="small">matters</text>
</svg>
