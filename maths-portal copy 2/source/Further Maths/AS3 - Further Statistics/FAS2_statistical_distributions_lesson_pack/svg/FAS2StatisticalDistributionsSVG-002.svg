<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="900" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">FAS2StatisticalDistributionsSVG-002: Poisson upper-tail probability</title><desc id="desc">A Poisson upper-tail probability diagram for X following Poisson with mean 20.</desc><metadata>asset_id: FAS2StatisticalDistributionsSVG-002</metadata><rect width="1400" height="900" fill="#FAF9F6"/><text x="70" y="80" font-family="Georgia" font-size="40" fill="#2C2C2E" font-weight="700">Poisson Upper Tail: Inclusive Endpoints</text><text x="70" y="125" font-family="Arial" font-size="24" fill="#2C2C2E">Example structure from the uploaded coins evidence: X ~ Po(20), observed value 25.</text><line x1="70" y1="155" x2="1330" y2="155" stroke="#D4AF37" stroke-width="4"/><rect x="90" y="190" width="570" height="145" rx="20" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/><text x="125" y="235" font-family="Arial" font-size="28" fill="#2C2C2E" font-weight="700">Model</text><text x="125" y="285" font-family="Arial" font-size="32" fill="#2C2C2E">X ~ Po(20)</text><rect x="740" y="190" width="570" height="145" rx="20" fill="#FBEFEF" stroke="#C5A059" stroke-width="3"/><text x="775" y="235" font-family="Arial" font-size="28" fill="#2C2C2E" font-weight="700">Upper-tail probability</text><text x="775" y="285" font-family="Arial" font-size="32" fill="#2C2C2E">P(X ≥ 25) = 1 − P(X ≤ 24)</text><rect x="90" y="385" width="1220" height="300" rx="24" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/><text x="130" y="435" font-family="Arial" font-size="24" fill="#2C2C2E" font-weight="700">Discrete number line</text><line x1="170" y1="570" x2="1230" y2="570" stroke="#2C2C2E" stroke-width="3"/><polygon points="1230,570 1215,562 1215,578" fill="#2C2C2E"/><rect x="170" y="515" width="705" height="50" rx="12" fill="#E5E5EA" opacity="0.85"/><text x="370" y="550" font-family="Arial" font-size="24" fill="#2C2C2E">complement: X ≤ 24</text><rect x="895" y="515" width="335" height="50" rx="12" fill="#D4AF37" opacity="0.55"/><text x="940" y="550" font-family="Arial" font-size="24" fill="#2C2C2E" font-weight="700">upper tail: X ≥ 25</text><line x1="220" y1="555" x2="220" y2="590" stroke="#2C2C2E" stroke-width="2"/><text x="212" y="620" font-family="Arial" font-size="20" fill="#2C2C2E">0</text><line x1="875" y1="545" x2="875" y2="600" stroke="#C5A059" stroke-width="4"/><text x="843" y="635" font-family="Arial" font-size="23" fill="#2C2C2E">24</text><line x1="895" y1="545" x2="895" y2="600" stroke="#D4AF37" stroke-width="5"/><text x="885" y="635" font-family="Arial" font-size="23" fill="#2C2C2E" font-weight="700">25</text><text x="950" y="625" font-family="Arial" font-size="22" fill="#2C2C2E">26</text><text x="1015" y="625" font-family="Arial" font-size="22" fill="#2C2C2E">27</text><text x="1080" y="625" font-family="Arial" font-size="22" fill="#2C2C2E">...</text><rect x="90" y="725" width="1220" height="95" rx="20" fill="#FBEFEF" stroke="#C5A059" stroke-width="3"/><text x="130" y="765" font-family="Arial" font-size="25" fill="#2C2C2E" font-weight="700">Endpoint warning:</text><text x="355" y="765" font-family="Arial" font-size="25" fill="#2C2C2E">because 25 is included in the upper tail, the complement stops at 24.</text><text x="130" y="800" font-family="Arial" font-size="25" fill="#2C2C2E">Do not write P(X ≥ 25) = 1 − P(X ≤ 25).</text></svg>