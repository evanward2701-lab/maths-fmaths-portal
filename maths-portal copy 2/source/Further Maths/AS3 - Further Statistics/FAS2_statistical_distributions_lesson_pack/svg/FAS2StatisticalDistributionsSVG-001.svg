<title id="title">FAS2StatisticalDistributionsSVG-001: Distribution comparison grid</title><desc id="desc">A comparison grid for binomial, geometric and Poisson distributions.</desc><metadata>asset_id: FAS2StatisticalDistributionsSVG-001</metadata><rect width="1400" height="900" fill="#FAF9F6"/><text x="70" y="85" font-family="Georgia, serif" font-size="42" fill="#2C2C2E" font-weight="700">FAS2 Statistical Distributions</text><text x="70" y="130" font-family="Arial" font-size="24" fill="#2C2C2E">Choose the model before calculating. Define X first, then choose the distribution.</text><line x1="70" y1="160" x2="1330" y2="160" stroke="#D4AF37" stroke-width="4"/><rect x="70" y="210" width="1260" height="560" rx="22" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/><rect x="70" y="210" width="1260" height="90" rx="22" fill="#FBEFEF" stroke="#E5E5EA" stroke-width="3"/><line x1="70" y1="300" x2="1330" y2="300" stroke="#E5E5EA" stroke-width="3"/><line x1="320" y1="210" x2="320" y2="770" stroke="#E5E5EA" stroke-width="3"/><line x1="650" y1="210" x2="650" y2="770" stroke="#E5E5EA" stroke-width="3"/><line x1="890" y1="210" x2="890" y2="770" stroke="#E5E5EA" stroke-width="3"/><line x1="1095" y1="210" x2="1095" y2="770" stroke="#E5E5EA" stroke-width="3"/><line x1="70" y1="455" x2="1330" y2="455" stroke="#E5E5EA" stroke-width="3"/><line x1="70" y1="610" x2="1330" y2="610" stroke="#E5E5EA" stroke-width="3"/><text x="105" y="265" font-family="Arial" font-size="25" fill="#2C2C2E" font-weight="700">Distribution</text><text x="355" y="265" font-family="Arial" font-size="25" fill="#2C2C2E" font-weight="700">When used</text><text x="690" y="265" font-family="Arial" font-size="25" fill="#2C2C2E" font-weight="700">Parameters</text><text x="930" y="265" font-family="Arial" font-size="25" fill="#2C2C2E" font-weight="700">Mean</text><text x="1130" y="265" font-family="Arial" font-size="25" fill="#2C2C2E" font-weight="700">Variance</text><text x="105" y="355" font-family="Georgia" font-size="32" fill="#2C2C2E" font-weight="700">Binomial</text><text x="105" y="395" font-family="Arial" font-size="24" fill="#2C2C2E">X ~ B(n, p)</text><text x="355" y="345" font-family="Arial" font-size="23" fill="#2C2C2E">Fixed number of trials</text><text x="355" y="382" font-family="Arial" font-size="23" fill="#2C2C2E">Count successes</text><text x="690" y="365" font-family="Arial" font-size="25" fill="#2C2C2E">n, p</text><text x="930" y="365" font-family="Arial" font-size="27" fill="#2C2C2E">np</text><text x="1130" y="365" font-family="Arial" font-size="27" fill="#2C2C2E">np(1 - p)</text><text x="105" y="512" font-family="Georgia" font-size="32" fill="#2C2C2E" font-weight="700">Geometric</text><text x="105" y="552" font-family="Arial" font-size="24" fill="#2C2C2E">X ~ Geo(p)</text><text x="355" y="500" font-family="Arial" font-size="23" fill="#2C2C2E">Trials until first success</text><text x="355" y="537" font-family="Arial" font-size="23" fill="#2C2C2E">X starts at 1</text><text x="690" y="520" font-family="Arial" font-size="25" fill="#2C2C2E">p</text><text x="930" y="520" font-family="Arial" font-size="27" fill="#2C2C2E">1 / p</text><text x="1130" y="520" font-family="Arial" font-size="27" fill="#2C2C2E">(1 - p) / p²</text><text x="105" y="665" font-family="Georgia" font-size="32" fill="#2C2C2E" font-weight="700">Poisson</text><text x="105" y="705" font-family="Arial" font-size="24" fill="#2C2C2E">X ~ Po(λ)</text><text x="355" y="655" font-family="Arial" font-size="23" fill="#2C2C2E">Events in a fixed interval</text><text x="355" y="692" font-family="Arial" font-size="23" fill="#2C2C2E">Rate language: per hour, per minute</text><text x="690" y="675" font-family="Arial" font-size="25" fill="#2C2C2E">λ</text><text x="930" y="675" font-family="Arial" font-size="27" fill="#2C2C2E">λ</text><text x="1130" y="675" font-family="Arial" font-size="27" fill="#2C2C2E">λ</text><rect x="70" y="805" width="1260" height="55" rx="16" fill="#FBEFEF" stroke="#C5A059" stroke-width="2"/><text x="100" y="840" font-family="Arial" font-size="23" fill="#2C2C2E" font-weight="700">CCEA-safe core:</text><text x="285" y="840" font-family="Arial" font-size="23" fill="#2C2C2E">model choice, probability calculation, mean, variance, and contextual interpretation.</text></svg>