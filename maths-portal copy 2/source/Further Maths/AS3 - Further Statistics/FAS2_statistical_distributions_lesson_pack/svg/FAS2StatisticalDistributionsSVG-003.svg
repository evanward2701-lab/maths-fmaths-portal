<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="900" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">FAS2StatisticalDistributionsSVG-003: Geometric tail direction</title><desc id="desc">A geometric waiting-time diagram showing that smaller success probability means a longer expected wait.</desc><metadata>asset_id: FAS2StatisticalDistributionsSVG-003</metadata><rect width="1400" height="900" fill="#FAF9F6"/><text x="70" y="80" font-family="Georgia" font-size="40" fill="#2C2C2E" font-weight="700">Geometric Distribution: Tail Direction</text><text x="70" y="125" font-family="Arial" font-size="24" fill="#2C2C2E">If success is rarer, the first success usually takes longer.</text><line x1="70" y1="155" x2="1330" y2="155" stroke="#D4AF37" stroke-width="4"/><rect x="90" y="190" width="1220" height="115" rx="22" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/><text x="125" y="235" font-family="Arial" font-size="27" fill="#2C2C2E" font-weight="700">Model:</text><text x="230" y="235" font-family="Arial" font-size="27" fill="#2C2C2E">X = number of trials up to and including the first success</text><text x="125" y="275" font-family="Arial" font-size="27" fill="#2C2C2E">X ~ Geo(p), where X starts at 1</text><rect x="90" y="350" width="1220" height="170" rx="24" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/><text x="125" y="395" font-family="Arial" font-size="28" fill="#2C2C2E" font-weight="700">Higher p</text><text x="270" y="395" font-family="Arial" font-size="24" fill="#2C2C2E">success is more likely each trial</text><line x1="180" y1="465" x2="1160" y2="465" stroke="#2C2C2E" stroke-width="3"/><polygon points="1160,465 1145,457 1145,473" fill="#2C2C2E"/><circle cx="260" cy="465" r="15" fill="#D4AF37"/><text x="245" y="505" font-family="Arial" font-size="21" fill="#2C2C2E">1</text><circle cx="340" cy="465" r="15" fill="#D4AF37"/><text x="325" y="505" font-family="Arial" font-size="21" fill="#2C2C2E">2</text><circle cx="420" cy="465" r="15" fill="#D4AF37"/><text x="405" y="505" font-family="Arial" font-size="21" fill="#2C2C2E">3</text><text x="500" y="455" font-family="Arial" font-size="24" fill="#2C2C2E">first success tends to arrive sooner</text><rect x="90" y="560" width="1220" height="190" rx="24" fill="#FBEFEF" stroke="#C5A059" stroke-width="3"/><text x="125" y="605" font-family="Arial" font-size="28" fill="#2C2C2E" font-weight="700">Lower p</text><text x="260" y="605" font-family="Arial" font-size="24" fill="#2C2C2E">success is rarer each trial</text><line x1="180" y1="675" x2="1160" y2="675" stroke="#2C2C2E" stroke-width="3"/><polygon points="1160,675 1145,667 1145,683" fill="#2C2C2E"/><circle cx="260" cy="675" r="9" fill="#E5E5EA" stroke="#2C2C2E" stroke-width="1"/><text x="245" y="715" font-family="Arial" font-size="21" fill="#2C2C2E">1</text><circle cx="340" cy="675" r="9" fill="#E5E5EA" stroke="#2C2C2E" stroke-width="1"/><text x="325" y="715" font-family="Arial" font-size="21" fill="#2C2C2E">2</text><circle cx="420" cy="675" r="9" fill="#E5E5EA" stroke="#2C2C2E" stroke-width="1"/><text x="405" y="715" font-family="Arial" font-size="21" fill="#2C2C2E">3</text><circle cx="860" cy="675" r="18" fill="#D4AF37"/><text x="845" y="715" font-family="Arial" font-size="21" fill="#2C2C2E">x</text><text x="500" y="665" font-family="Arial" font-size="24" fill="#2C2C2E">first success tends to arrive later</text><rect x="90" y="790" width="1220" height="70" rx="18" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/><text x="125" y="835" font-family="Arial" font-size="28" fill="#2C2C2E" font-weight="700">Upper-tail formula:</text><text x="395" y="835" font-family="Arial" font-size="28" fill="#2C2C2E">P(X ≥ x) = (1 − p)^(x − 1)</text><text x="860" y="835" font-family="Arial" font-size="24" fill="#2C2C2E">smaller p ⇒ larger waiting time X</text></svg>