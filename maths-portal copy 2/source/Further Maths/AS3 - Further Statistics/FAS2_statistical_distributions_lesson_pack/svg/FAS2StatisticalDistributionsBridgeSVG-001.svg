<svg width="1400" height="900" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">FAS2StatisticalDistributionsBridgeSVG-001: Ordinary Maths to Further Maths bridge</title><desc id="desc">A bridge diagram showing ordinary A-Level binomial hypothesis testing as prior knowledge and CCEA Further Maths distribution modelling as the core destination.</desc><metadata>asset_id: FAS2StatisticalDistributionsBridgeSVG-001</metadata><rect width="1400" height="900" fill="#FAF9F6"/><text x="70" y="80" font-family="Georgia" font-size="40" fill="#2C2C2E" font-weight="700">A-Level Maths Bridge → Further Maths FAS2-DIST</text><text x="70" y="125" font-family="Arial" font-size="24" fill="#2C2C2E">Use ordinary hypothesis-test language as background, not as automatic CCEA Further Maths core.</text><line x1="70" y1="155" x2="1330" y2="155" stroke="#D4AF37" stroke-width="4"/><rect x="80" y="210" width="520" height="480" rx="28" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/><text x="120" y="265" font-family="Georgia" font-size="32" fill="#2C2C2E" font-weight="700">Ordinary A-Level Maths</text><text x="120" y="315" font-family="Arial" font-size="25" fill="#2C2C2E" font-weight="700">Prior toolkit</text><text x="165" y="373" font-family="Arial" font-size="23" fill="#2C2C2E">Binomial model: X ~ B(n, p)</text><text x="165" y="423" font-family="Arial" font-size="23" fill="#2C2C2E">Null and alternative hypotheses</text><text x="165" y="473" font-family="Arial" font-size="23" fill="#2C2C2E">Significance level and p-value</text><text x="165" y="523" font-family="Arial" font-size="23" fill="#2C2C2E">Critical region</text><text x="165" y="573" font-family="Arial" font-size="23" fill="#2C2C2E">Tail probabilities</text><text x="165" y="623" font-family="Arial" font-size="23" fill="#2C2C2E">Contextual conclusion</text><line x1="620" y1="450" x2="780" y2="450" stroke="#C5A059" stroke-width="8" stroke-linecap="round"/><polygon points="780,450 745,430 745,470" fill="#C5A059"/><text x="632" y="420" font-family="Arial" font-size="22" fill="#2C2C2E" font-weight="700">bridge</text><rect x="800" y="210" width="520" height="480" rx="28" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/><text x="840" y="265" font-family="Georgia" font-size="32" fill="#2C2C2E" font-weight="700">Further Maths FAS2-DIST</text><text x="840" y="315" font-family="Arial" font-size="25" fill="#2C2C2E" font-weight="700">CCEA-safe core</text><text x="885" y="373" font-family="Arial" font-size="23" fill="#2C2C2E">Define X clearly</text><text x="885" y="423" font-family="Arial" font-size="23" fill="#2C2C2E">Poisson model: X ~ Po(λ)</text><text x="885" y="473" font-family="Arial" font-size="23" fill="#2C2C2E">Geometric model: X ~ Geo(p)</text><text x="885" y="523" font-family="Arial" font-size="23" fill="#2C2C2E">Calculate probabilities</text><text x="885" y="573" font-family="Arial" font-size="23" fill="#2C2C2E">Use E(X) and Var(X)</text><text x="885" y="623" font-family="Arial" font-size="23" fill="#2C2C2E">Interpret in context</text><rect x="80" y="735" width="1240" height="95" rx="22" fill="#FBEFEF" stroke="#C5A059" stroke-width="4"/><text x="120" y="775" font-family="Arial" font-size="26" fill="#2C2C2E" font-weight="700">Boundary warning:</text><text x="350" y="775" font-family="Arial" font-size="26" fill="#2C2C2E">Poisson/geometric hypothesis-test conclusions are enrichment here.</text><text x="120" y="815" font-family="Arial" font-size="24" fill="#2C2C2E">Core CCEA FAS2-DIST: distribution modelling, probability calculations, mean, variance, and interpretation.</text></svg>