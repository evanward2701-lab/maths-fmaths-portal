<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>FAS2StatisticalDistributionsWidget-002</title><style>:root{--canvas:#FAF9F6;--cream:#FFFFF0;--line:#E5E5EA;--gold:#D4AF37;--soft-gold:#C5A059;--blush:#FBEFEF;--text:#2C2C2E}*{box-sizing:border-box}body{margin:0;padding:24px;background:var(--canvas);color:var(--text);font-family:Inter,Arial,sans-serif;line-height:1.5}.widget{max-width:1100px;margin:0 auto;background:var(--cream);border:1px solid var(--line);border-radius:24px;padding:28px}h1{margin:0 0 8px;font-family:Georgia,serif;font-size:clamp(1.8rem,4vw,2.6rem)}.subtitle{margin:0 0 22px;font-size:1.05rem}.boundary{background:var(--blush);border:2px solid var(--soft-gold);border-radius:16px;padding:14px 16px;margin-bottom:22px;font-weight:600}.controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:20px}@media(max-width:850px){.controls,.trainer{grid-template-columns:1fr!important}}.card{background:var(--canvas);border:1px solid var(--line);border-radius:18px;padding:18px}label{display:block;font-weight:700;margin-bottom:8px}select,input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--text);font-size:1rem}button{appearance:none;border:0;border-radius:14px;background:var(--gold);color:var(--text);padding:12px 18px;font-weight:800;cursor:pointer;font-size:1rem}.trainer{display:grid;grid-template-columns:1fr 1fr;gap:18px}.choice{display:block;width:100%;margin:8px 0;background:white;border:1px solid var(--line);text-align:left}.choice.correct{border:2px solid var(--soft-gold);background:var(--cream)}.choice.incorrect{border:2px solid var(--blush);background:var(--blush)}.output{background:white;border:1px solid var(--line);border-radius:18px;padding:18px}.math{font-family:"Times New Roman",serif;font-size:1.18rem;background:var(--cream);padding:10px 12px;border-radius:12px;border:1px solid var(--line);overflow-x:auto;margin:10px 0}.warning{background:var(--blush);border-left:5px solid var(--soft-gold);padding:12px 14px;border-radius:12px;margin-top:10px}.pill{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--blush);border:1px solid var(--soft-gold);font-size:.9rem;font-weight:700;margin-right:6px}.numberline{margin-top:12px;background:var(--canvas);border:1px solid var(--line);border-radius:16px;padding:16px;overflow-x:auto}svg{width:100%;min-width:620px;height:145px}.small{font-size:.92rem;opacity:.9}</style></head><body><main class="widget"><h1>Tail-Direction Trainer</h1><p class="subtitle">Choose the probability tail before calculating.</p><div class="boundary">Core skill: choose and interpret a probability statement. Hypothesis-test decisions are labelled enrichment unless CCEA explicitly asks.</div><section class="controls"><div class="card"><label for="distribution">Distribution</label><select id="distribution"><option value="poisson">Poisson: count events in an interval</option><option value="geometric">Geometric: trials until first success</option></select></div><div class="card"><label for="direction">Claim direction / unusual observation</label><select id="direction"><option value="higher">Higher rate/probability or unusually high count</option><option value="lower">Lower rate/probability or unusually low count</option><option value="changed">Changed / not equal / two-sided wording</option></select></div><div class="card"><label for="observed">Observed value</label><input id="observed" type="number" step="1" min="1" value="17"/></div></section><section class="trainer"><div class="card"><label>Choose the probability statement</label><button class="choice" data-choice="lower">P(X ≤ observed)</button><button class="choice" data-choice="upper">P(X ≥ observed)</button><button class="choice" data-choice="two-sided-lower">Two-sided: lower side, compare with half the level</button><button class="choice" data-choice="two-sided-upper">Two-sided: upper side, compare with half the level</button><button id="newScenario">Reset feedback</button></div><div class="output" id="output"><p>Select a probability statement to see feedback.</p></div></section></main><script>const distribution=document.getElementById('distribution'),direction=document.getElementById('direction'),observed=document.getElementById('observed'),output=document.getElementById('output'),choiceButtons=Array.from(document.querySelectorAll('.choice')),reset=document.getElementById('newScenario');function correctChoice(){const dist=distribution.value,dir=direction.value;if(dist==='poisson'){if(dir==='higher')return'upper';if(dir==='lower')return'lower';return'two-sided-upper'}if(dist==='geometric'){if(dir==='higher')return'lower';if(dir==='lower')return'upper';return'two-sided-upper'}return'upper'}function explanation(choice){const dist=distribution.value,dir=direction.value,x=Math.floor(Number(observed.value)),correct=correctChoice(),isCorrect=choice===correct;let statement='',reason='',boundary='Core probability calculation. Any hypothesis-test comparison is enrichment unless CCEA explicitly asks.';if(dist==='poisson'){if(dir==='higher'){statement=`P(X ≥ ${x}) = 1 − P(X ≤ ${x-1})`;reason='For a Poisson model, a higher rate λ tends to produce larger counts, so an unusually high observation uses the upper tail.'}else if(dir==='lower'){statement=`P(X ≤ ${x})`;reason='For a Poisson model, a lower rate λ tends to produce smaller counts, so an unusually low observation uses the lower tail.'}else{statement='Two-sided wording: choose the side suggested by the observed value, then use half the significance level only in enrichment tests.';reason='Two-sided wording such as changed or not equal does not automatically mean add both tails in a simple probability question.'}}if(dist==='geometric'){if(dir==='higher'){statement=`P(X ≤ ${x})`;reason='For a geometric model, a higher success probability p means success tends to happen sooner, so smaller X values are relevant.'}else if(dir==='lower'){statement=`P(X ≥ ${x}) = (1 − p)^(${x-1})`;reason='For a geometric model, a lower success probability p means success is rarer, so the first success tends to happen later.'}else{statement='Two-sided wording: choose lower or upper side from whether the observed waiting time is unusually short or unusually long.';reason='Short wait suggests larger p; long wait suggests smaller p.'}}return{isCorrect,statement,reason,boundary}}function renderNumberLine(choice){const x=Math.floor(Number(observed.value)),isUpper=choice==='upper'||choice==='two-sided-upper',labelLeft=isUpper?`X ≤ ${x-1}`:`X ≤ ${x}`,labelRight=isUpper?`X ≥ ${x}`:'larger values',goldX=isUpper?405:350,rectLeftWidth=isUpper?300:355,rectRightX=isUpper?410:465,rectRightWidth=isUpper?335:280;return`<div class="numberline"><svg viewBox="0 0 760 145" role="img" aria-label="Discrete probability tail number line"><rect x="0" y="0" width="760" height="145" rx="16" fill="#FAF9F6"></rect><line x1="65" y1="75" x2="705" y2="75" stroke="#2C2C2E" stroke-width="3"></line><polygon points="705,75 690,67 690,83" fill="#2C2C2E"></polygon><rect x="65" y="43" width="${rectLeftWidth}" height="28" rx="8" fill="#E5E5EA"></rect><rect x="${rectRightX}" y="43" width="${rectRightWidth}" height="28" rx="8" fill="#D4AF37" opacity="0.55"></rect><line x1="${goldX}" y1="50" x2="${goldX}" y2="100" stroke="#C5A059" stroke-width="5"></line><text x="100" y="35" font-family="Arial" font-size="18" fill="#2C2C2E">${labelLeft}</text><text x="505" y="35" font-family="Arial" font-size="18" fill="#2C2C2E">${labelRight}</text><text x="${goldX-12}" y="125" font-family="Arial" font-size="18" fill="#2C2C2E">observed ${x}</text></svg></div>`}function handleChoice(event){const choice=event.currentTarget.dataset.choice,feedback=explanation(choice);choiceButtons.forEach(btn=>{btn.classList.remove('correct','incorrect');if(btn.dataset.choice===choice)btn.classList.add(feedback.isCorrect?'correct':'incorrect')});output.innerHTML=`<p><span class="pill">${feedback.isCorrect?'Good choice':'Try again'}</span></p><div class="math">${feedback.statement}</div><p>${feedback.reason}</p><div class="warning">${feedback.boundary}</div>${renderNumberLine(choice)}<p class="small">Endpoint reminder for integer X: P(X ≥ a) = 1 − P(X ≤ a − 1).</p>`}function clearFeedback(){choiceButtons.forEach(btn=>btn.classList.remove('correct','incorrect'));output.innerHTML='<p>Select a probability statement to see feedback.</p>'}choiceButtons.forEach(btn=>btn.addEventListener('click',handleChoice));reset.addEventListener('click',clearFeedback);distribution.addEventListener('change',clearFeedback);direction.addEventListener('change',clearFeedback);observed.addEventListener('input',clearFeedback);</script></body></html>
