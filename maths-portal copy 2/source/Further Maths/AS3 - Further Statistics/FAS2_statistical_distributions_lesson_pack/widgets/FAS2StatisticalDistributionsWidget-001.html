<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>FAS2StatisticalDistributionsWidget-001</title><style>:root{--canvas:#FAF9F6;--cream:#FFFFF0;--line:#E5E5EA;--gold:#D4AF37;--soft-gold:#C5A059;--blush:#FBEFEF;--text:#2C2C2E}*{box-sizing:border-box}body{margin:0;padding:24px;background:var(--canvas);color:var(--text);font-family:Inter,Arial,sans-serif;line-height:1.5}.widget{max-width:1100px;margin:0 auto;background:var(--cream);border:1px solid var(--line);border-radius:24px;padding:28px}h1{margin:0 0 8px;font-family:Georgia,serif;font-size:clamp(1.8rem,4vw,2.6rem)}.subtitle{margin:0 0 22px;font-size:1.05rem}.boundary{background:var(--blush);border:2px solid var(--soft-gold);border-radius:16px;padding:14px 16px;margin-bottom:22px;font-weight:600}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}@media(max-width:760px){.grid{grid-template-columns:1fr}}.card{background:var(--canvas);border:1px solid var(--line);border-radius:18px;padding:18px}label{display:block;font-weight:700;margin-bottom:8px}select,input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--text);font-size:1rem}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.row.three{grid-template-columns:repeat(3,minmax(0,1fr))}@media(max-width:620px){.row,.row.three{grid-template-columns:1fr}}button{appearance:none;border:0;border-radius:14px;background:var(--gold);color:var(--text);padding:12px 18px;font-weight:800;cursor:pointer;margin-top:16px;font-size:1rem}.output{margin-top:22px;display:grid;gap:14px}.result{background:white;border:1px solid var(--line);border-radius:18px;padding:18px}.math{font-family:"Times New Roman",serif;font-size:1.15rem;background:var(--cream);padding:10px 12px;border-radius:12px;border:1px solid var(--line);overflow-x:auto;margin:10px 0}.warning{background:var(--blush);border-left:5px solid var(--soft-gold);padding:12px 14px;border-radius:12px;margin-top:10px}.small{font-size:.92rem;opacity:.9}.hidden{display:none}.pill{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--blush);border:1px solid var(--soft-gold);font-size:.9rem;font-weight:700;margin-right:6px}</style></head><body><main class="widget"><h1>Distribution Chooser + Probability Calculator</h1><p class="subtitle">Define X, choose the model, calculate the probability, then interpret it.</p><div class="boundary">CCEA-safe core: distribution modelling and probability calculation. Hypothesis-test conclusions are not generated here.</div><section class="grid"><div class="card"><label for="scenario">What is being counted?</label><select id="scenario"><option value="binomial">Successes in a fixed number of trials</option><option value="poisson">Events in a fixed time/space interval</option><option value="geometric">Trials up to and including the first success</option></select></div><div class="card"><label for="probType">What probability do you need?</label><select id="probType"><option value="exact">P(X = x)</option><option value="lower">P(X ≤ x)</option><option value="upper">P(X ≥ x)</option><option value="interval">P(a ≤ X ≤ b)</option></select></div><div class="card" id="binomialParams"><label>Binomial parameters</label><div class="row"><div><label for="n">n</label><input id="n" type="number" min="0" step="1" value="20"/></div><div><label for="pBin">p</label><input id="pBin" type="number" min="0" max="1" step="0.0001" value="0.2"/></div></div></div><div class="card hidden" id="poissonParams"><label>Poisson parameter</label><div class="row"><div><label for="lambda">λ</label><input id="lambda" type="number" min="0" step="0.0001" value="6.5"/></div><div><label for="rateNote">Rate note</label><input id="rateNote" type="text" value="must match X interval"/></div></div></div><div class="card hidden" id="geometricParams"><label>Geometric parameter</label><div><label for="pGeo">p</label><input id="pGeo" type="number" min="0" max="1" step="0.0001" value="0.125"/></div></div><div class="card"><label>Probability values</label><div class="row three"><div><label for="x">x</label><input id="x" type="number" min="0" step="1" value="4"/></div><div><label for="a">a</label><input id="a" type="number" min="0" step="1" value="3"/></div><div><label for="b">b</label><input id="b" type="number" min="0" step="1" value="8"/></div></div><button id="calculate">Calculate</button></div></section><section class="output" id="output"></section></main><script>const scenario=document.getElementById('scenario'),probType=document.getElementById('probType'),calculate=document.getElementById('calculate'),output=document.getElementById('output'),binomialParams=document.getElementById('binomialParams'),poissonParams=document.getElementById('poissonParams'),geometricParams=document.getElementById('geometricParams');function updatePanels(){const v=scenario.value;binomialParams.classList.toggle('hidden',v!=='binomial');poissonParams.classList.toggle('hidden',v!=='poisson');geometricParams.classList.toggle('hidden',v!=='geometric')}scenario.addEventListener('change',updatePanels);function factorial(n){if(n<0||!Number.isInteger(n))return NaN;let r=1;for(let i=2;i<=n;i++)r*=i;return r}function combination(n,r){if(r<0||r>n||!Number.isInteger(n)||!Number.isInteger(r))return 0;r=Math.min(r,n-r);let num=1,den=1;for(let i=1;i<=r;i++){num*=n-r+i;den*=i}return num/den}function binomialPMF(n,p,x){if(x<0||x>n||!Number.isInteger(x))return 0;return combination(n,x)*Math.pow(p,x)*Math.pow(1-p,n-x)}function poissonPMF(l,x){if(x<0||!Number.isInteger(x))return 0;return Math.exp(-l)*Math.pow(l,x)/factorial(x)}function geometricPMF(p,x){if(x<1||!Number.isInteger(x))return 0;return Math.pow(1-p,x-1)*p}function cumulativePMF(pmf,lo,hi){let t=0;for(let k=lo;k<=hi;k++)t+=pmf(k);return t}function format(num){if(!Number.isFinite(num))return'invalid';return Number(num).toFixed(6).replace(/0+$/,'').replace(/\.$/,'')}function modelText(type){if(type==='binomial')return`X ~ B(${Number(document.getElementById('n').value)}, ${Number(document.getElementById('pBin').value)})`;if(type==='poisson')return`X ~ Po(${Number(document.getElementById('lambda').value)})`;return`X ~ Geo(${Number(document.getElementById('pGeo').value)})`}function getPMF(type){if(type==='binomial'){const n=Number(document.getElementById('n').value),p=Number(document.getElementById('pBin').value);return{pmf:k=>binomialPMF(n,p,k),min:0,max:n,valid:n>=0&&Number.isInteger(n)&&p>=0&&p<=1,warning:''}}if(type==='poisson'){const l=Number(document.getElementById('lambda').value);return{pmf:k=>poissonPMF(l,k),min:0,max:Math.max(200,Math.ceil(l+12*Math.sqrt(l+1))),valid:l>=0,warning:'Check that λ matches the interval used in your definition of X.'}}const p=Number(document.getElementById('pGeo').value);return{pmf:k=>geometricPMF(p,k),min:1,max:1000,valid:p>0&&p<=1,warning:'For Geo(p), X starts at 1 because the first success can happen on trial 1.'}}function calculateProbability(){const type=scenario.value,choice=probType.value,x=Math.floor(Number(document.getElementById('x').value)),a=Math.floor(Number(document.getElementById('a').value)),b=Math.floor(Number(document.getElementById('b').value)),data=getPMF(type);if(!data.valid){output.innerHTML='<div class="result"><h2>Check your parameters</h2><p>One or more parameters are outside the valid range.</p></div>';return}let probability=0,statement='',formula='',extraWarning='';if(choice==='exact'){probability=data.pmf(x);statement=`P(X = ${x})`;formula=type==='geometric'?'P(X = x) = (1 − p)^(x − 1)p':type==='poisson'?'P(X = x) = e^(−λ)λ^x / x!':'P(X = x) = C(n, x)p^x(1 − p)^(n − x)'}if(choice==='lower'){probability=cumulativePMF(data.pmf,data.min,x);statement=`P(X ≤ ${x})`;if(type==='geometric'){const p=Number(document.getElementById('pGeo').value);probability=x<1?0:1-Math.pow(1-p,x);formula='P(X ≤ x) = 1 − (1 − p)^x'}else formula='P(X ≤ x) = sum of probabilities from the lowest possible X up to x'}if(choice==='upper'){statement=`P(X ≥ ${x})`;if(type==='geometric'){const p=Number(document.getElementById('pGeo').value);probability=x<=1?1:Math.pow(1-p,x-1);formula='P(X ≥ x) = (1 − p)^(x − 1)';extraWarning='Geometric direction: if p is smaller, success is rarer, so X tends to be larger.'}else{probability=1-cumulativePMF(data.pmf,data.min,x-1);formula=`P(X ≥ ${x}) = 1 − P(X ≤ ${x-1})`;extraWarning=`Endpoint warning: use ${x-1}, not ${x}, in the complement.`}}if(choice==='interval'){const lower=Math.min(a,b),upper=Math.max(a,b);statement=`P(${lower} ≤ X ≤ ${upper})`;if(type==='geometric'){const p=Number(document.getElementById('pGeo').value),upperCum=upper<1?0:1-Math.pow(1-p,upper),lowerCum=lower-1<1?0:1-Math.pow(1-p,lower-1);probability=upperCum-lowerCum}else probability=cumulativePMF(data.pmf,lower,upper);formula=`P(${lower} ≤ X ≤ ${upper}) = P(X ≤ ${upper}) − P(X ≤ ${lower-1})`}output.innerHTML=`<div class="result"><h2>Result</h2><p><span class="pill">Model</span> ${modelText(type)}</p><div class="math">${statement} = ${format(probability)}</div><p><span class="pill">Method</span> ${formula}</p>${data.warning?`<div class="warning">${data.warning}</div>`:''}${extraWarning?`<div class="warning">${extraWarning}</div>`:''}<p class="small">Interpretation prompt: write this probability in the words of the original question.</p></div>`}calculate.addEventListener('click',calculateProbability);updatePanels();calculateProbability();</script></body></html>
