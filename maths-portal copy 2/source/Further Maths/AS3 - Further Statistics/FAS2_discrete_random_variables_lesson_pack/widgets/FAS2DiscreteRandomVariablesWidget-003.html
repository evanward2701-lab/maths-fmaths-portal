<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>FAS2 Discrete Random Variables Widget 003</title><style>:root{--canvas:#FAF9F6;--ivory:#FFFFF0;--line:#E5E5EA;--gold:#C5A059;--pink:#FBEFEF;--text:#2C2C2E;--muted:#626267;--danger:#8A3A3A;--ok:#2E6B4E}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--canvas);color:var(--text);line-height:1.5}main{max-width:1120px;margin:0 auto;padding:28px}.card{background:var(--ivory);border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:22px}h1,h2{font-family:Georgia,serif;margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-weight:700;margin-bottom:6px}textarea,input,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px}textarea{min-height:84px}.button-row{display:flex;gap:12px;margin-top:18px}button{border:none;background:var(--gold);color:white;padding:12px 18px;border-radius:999px;font-weight:700}.secondary{background:var(--text)}.status{border-radius:14px;padding:14px 16px;margin-top:16px;font-weight:700}.ok{background:#EEF8F2;color:var(--ok);border:1px solid #B8D9C5}.warn{background:var(--pink);color:var(--danger);border:1px solid #E6B7B7}table{width:100%;border-collapse:collapse;background:white;border-radius:14px;overflow:hidden;margin-top:14px;border:1px solid var(--line)}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}tr.selected{background:var(--pink);outline:2px solid var(--gold);outline-offset:-2px}.formula{background:var(--pink);border-left:4px solid var(--gold);border-radius:14px;padding:14px 16px;margin:12px 0;font-family:Georgia,serif}.result{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:14px}.value{font-size:1.7rem;font-weight:800;color:var(--gold)}.controls{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px}</style></head>
<body><main><section class="card"><h1>Inequality Probability Selector</h1><p>Asset ID: <strong>FAS2DiscreteRandomVariablesWidget-003</strong></p></section><section class="card"><h2>1. Enter a discrete distribution</h2><div class="grid"><div><label for="outcomes">Outcomes x</label><textarea id="outcomes">-2, -1, 0, 1</textarea></div><div><label for="probabilities">Probabilities P(X=x)</label><textarea id="probabilities">0.2, 0.3, 0.1, 0.4</textarea></div></div><div class="button-row"><button id="calculate">Update table</button><button class="secondary" id="loadExample">Load P(Y&lt;X) example</button></div><div id="status" class="status ok">Ready.</div></section><section class="card"><h2>2. Choose the inequality</h2><div class="controls"><div><label for="lowerType">Lower endpoint</label><select id="lowerType"><option value="none">No lower endpoint</option><option value="gt">&gt;</option><option value="ge">≥</option></select></div><div><label for="lowerValue">Lower value</label><input id="lowerValue" value="-1"/></div><div><label for="upperType">Upper endpoint</label><select id="upperType"><option value="none">No upper endpoint</option><option value="lt">&lt;</option><option value="le">≤</option></select></div><div><label for="upperValue">Upper value</label><input id="upperValue" value="1/2"/></div></div><div class="button-row"><button id="applyInequality">Apply inequality</button></div><div class="formula" id="statement">Statement will appear here.</div><div class="result"><div>Selected probability</div><div class="value" id="probability">–</div></div><div id="tableWrap"></div></section></main><script>
let currentRows=[];function parseNumber(token){const t=String(token).trim();if(t.includes('/')){const p=t.split('/');if(p.length!==2)return NaN;const n=Number(p[0].trim()),d=Number(p[1].trim());return Number.isFinite(n)&&Number.isFinite(d)&&d!==0?n/d:NaN}const n=Number(t);return Number.isFinite(n)?n:NaN}function parseList(text){return text.split(/[,;\n]+/).map(s=>s.trim()).filter(Boolean).map(parseNumber)}function fmt(n){return Number.isFinite(n)?String(Math.round(n*1e10)/1e10):'–'}function setStatus(m,ok){const el=document.getElementById('status');el.textContent=m;el.className=ok?'status ok':'status warn'}function readDistribution(){const xs=parseList(outcomes.value),ps=parseList(probabilities.value);if(xs.length===0||xs.length!==ps.length||xs.some(x=>!Number.isFinite(x))||ps.some(p=>!Number.isFinite(p))){setStatus('Enter matching valid lists.',false);return false}currentRows=xs.map((x,i)=>({x,p:ps[i],selected:false}));renderTable();setStatus('Distribution loaded.',true);return true}function satisfies(x,lt,lv,ut,uv){let ok=true;if(lt==='gt')ok=ok&&x>lv;if(lt==='ge')ok=ok&&x>=lv;if(ut==='lt')ok=ok&&x<uv;if(ut==='le')ok=ok&&x<=uv;return ok}function buildStatement(lt,lv,ut,uv){let mid='X';if(lt==='gt')mid=fmt(lv)+' < X';if(lt==='ge')mid=fmt(lv)+' ≤ X';if(ut==='lt')mid+=' < '+fmt(uv);if(ut==='le')mid+=' ≤ '+fmt(uv);return 'P('+mid+')'}function applyInequality(){if(currentRows.length===0&&!readDistribution())return;const lt=lowerType.value,ut=upperType.value,lv=parseNumber(lowerValue.value),uv=parseNumber(upperValue.value);currentRows=currentRows.map(r=>({...r,selected:satisfies(r.x,lt,lv,ut,uv)}));const total=currentRows.filter(r=>r.selected).reduce((s,r)=>s+r.p,0);statement.textContent=buildStatement(lt,lv,ut,uv);probability.textContent=fmt(total);setStatus('Selected outcomes: '+currentRows.filter(r=>r.selected).map(r=>fmt(r.x)).join(', '),true);renderTable()}function renderTable(){tableWrap.innerHTML='<table><thead><tr><th>Status</th><th>x</th><th>P(X=x)</th></tr></thead><tbody>'+currentRows.map(r=>`<tr class="${r.selected?'selected':''}"><td>${r.selected?'✓ included':''}</td><td>${fmt(r.x)}</td><td>${fmt(r.p)}</td></tr>`).join('')+'</tbody></table>'}calculate.addEventListener('click',()=>{readDistribution();applyInequality()});applyInequality.addEventListener('click',applyInequality);loadExample.addEventListener('click',()=>{outcomes.value='-2, -1, 0, 1';probabilities.value='0.2, 0.3, 0.1, 0.4';lowerType.value='none';upperType.value='lt';upperValue.value='-1';readDistribution();applyInequality()});readDistribution();applyInequality();
</script></body></html>
