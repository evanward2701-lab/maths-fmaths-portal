<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FAS2 Discrete Random Variables Widget 001</title>
  <style>
    :root{--canvas:#FAF9F6;--ivory:#FFFFF0;--line:#E5E5EA;--gold:#C5A059;--pink:#FBEFEF;--text:#2C2C2E;--muted:#626267;--danger:#8A3A3A;--ok:#2E6B4E}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--canvas);color:var(--text);line-height:1.5}main{max-width:1120px;margin:0 auto;padding:28px}.card{background:var(--ivory);border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:22px}h1,h2{font-family:Georgia,serif;margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:800px){.grid{grid-template-columns:1fr}}label{display:block;font-weight:700;margin-bottom:6px}textarea,input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:1rem;background:white;color:var(--text)}textarea{min-height:92px}.button-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}button{border:none;background:var(--gold);color:white;padding:12px 18px;border-radius:999px;font-weight:700;cursor:pointer}.secondary{background:var(--text)}.ghost{background:white;color:var(--text);border:1px solid var(--line)}.status{border-radius:14px;padding:14px 16px;margin-top:14px;font-weight:700}.ok{background:#EEF8F2;color:var(--ok);border:1px solid #B8D9C5}.warn{background:var(--pink);color:var(--danger);border:1px solid #E6B7B7}.formula{background:var(--pink);border-left:4px solid var(--gold);border-radius:12px;padding:12px 14px;font-family:Georgia,serif}.result-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.result{background:white;border:1px solid var(--line);border-radius:14px;padding:14px}.value{font-size:1.4rem;font-weight:800;color:var(--gold)}table{width:100%;border-collapse:collapse;background:white;border-radius:14px;overflow:hidden;margin-top:14px;border:1px solid var(--line)}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}th{background:var(--ivory)}code{background:var(--pink);padding:1px 5px;border-radius:6px}
  </style>
</head>
<body>
<main>
<section class="card"><h1>DRV Table Builder</h1><p>Asset ID: <strong>FAS2DiscreteRandomVariablesWidget-001</strong></p></section>
<section class="card"><h2>1. Enter the distribution</h2><div class="grid"><div><label for="outcomes">Outcomes x</label><textarea id="outcomes">-10, 0, 15, 40</textarea><p>Decimals and fractions such as <code>1/6</code> are accepted.</p></div><div><label for="probabilities">Probabilities P(X=x)</label><textarea id="probabilities">0.40, 0.25, 0.30, 0.05</textarea></div></div><div class="button-row"><button id="calculate">Calculate</button><button class="secondary" id="loadDie">Load fair die</button><button class="ghost" id="loadGameB">Load Game B</button></div><div id="status" class="status ok" aria-live="polite">Ready.</div></section>
<section class="card"><h2>2. Results</h2><div class="formula">E(X)=ΣxP(X=x), E(X²)=Σx²P(X=x), Var(X)=E(X²)-[E(X)]²</div><div class="result-grid"><div class="result"><div>Σp</div><div class="value" id="sumP">–</div></div><div class="result"><div>E(X)</div><div class="value" id="ex">–</div></div><div class="result"><div>E(X²)</div><div class="value" id="ex2">–</div></div><div class="result"><div>Var(X)</div><div class="value" id="variance">–</div></div><div class="result"><div>SD</div><div class="value" id="sd">–</div></div></div><div id="tableWrap"></div></section>
</main>
<script>
function parseNumber(token){const t=String(token).trim();if(t.includes('/')){const p=t.split('/');if(p.length!==2)return NaN;const a=Number(p[0].trim()),b=Number(p[1].trim());return Number.isFinite(a)&&Number.isFinite(b)&&b!==0?a/b:NaN}const n=Number(t);return Number.isFinite(n)?n:NaN}
function parseList(text){return text.split(/[,;\n]+/).map(s=>s.trim()).filter(Boolean).map(parseNumber)}
function fmt(n){if(!Number.isFinite(n))return '–';return String(Math.round(n*1e10)/1e10)}
function setStatus(m,ok){const el=document.getElementById('status');el.textContent=m;el.className=ok?'status ok':'status warn'}
function calculate(){const xs=parseList(document.getElementById('outcomes').value),ps=parseList(document.getElementById('probabilities').value);if(xs.length===0||xs.length!==ps.length||xs.some(x=>!Number.isFinite(x))||ps.some(p=>!Number.isFinite(p))){setStatus('Enter matching valid outcomes and probabilities.',false);return}const sumP=ps.reduce((a,b)=>a+b,0),ex=xs.reduce((s,x,i)=>s+x*ps[i],0),ex2=xs.reduce((s,x,i)=>s+x*x*ps[i],0),v=ex2-ex*ex,vc=Math.abs(v)<1e-12?0:v,sd=vc>=0?Math.sqrt(vc):NaN;document.getElementById('sumP').textContent=fmt(sumP);document.getElementById('ex').textContent=fmt(ex);document.getElementById('ex2').textContent=fmt(ex2);document.getElementById('variance').textContent=fmt(vc);document.getElementById('sd').textContent=fmt(sd);let ok=true,msg='Valid distribution.';if(ps.some(p=>p<0||p>1)){ok=false;msg='At least one probability is outside 0 to 1.'}else if(Math.abs(sumP-1)>1e-9){ok=false;msg='The probabilities do not add to 1.'}setStatus(msg,ok);document.getElementById('tableWrap').innerHTML='<table><thead><tr><th>#</th><th>x</th><th>P</th><th>xP</th><th>x²</th><th>x²P</th></tr></thead><tbody>'+xs.map((x,i)=>`<tr><td>${i+1}</td><td>${fmt(x)}</td><td>${fmt(ps[i])}</td><td>${fmt(x*ps[i])}</td><td>${fmt(x*x)}</td><td>${fmt(x*x*ps[i])}</td></tr>`).join('')+`<tr><td><strong>Total</strong></td><td></td><td><strong>${fmt(sumP)}</strong></td><td><strong>${fmt(ex)}</strong></td><td></td><td><strong>${fmt(ex2)}</strong></td></tr></tbody></table>`}
document.getElementById('calculate').addEventListener('click',calculate);document.getElementById('loadDie').addEventListener('click',()=>{outcomes.value='1,2,3,4,5,6';probabilities.value='1/6,1/6,1/6,1/6,1/6,1/6';calculate()});document.getElementById('loadGameB').addEventListener('click',()=>{outcomes.value='-10,40,990';probabilities.value='0.94,0.05,0.01';calculate()});calculate();
</script>
</body>
</html>
