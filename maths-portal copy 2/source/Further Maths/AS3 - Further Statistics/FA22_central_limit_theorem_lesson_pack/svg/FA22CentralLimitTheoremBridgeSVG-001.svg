<title id="title">A-Level Maths bridge: from one normal variable to the sampling distribution of the sample mean</title><desc id="desc">Two-column comparison of ordinary X and Further Maths X-bar</desc><metadata>Asset ID: FA22CentralLimitTheoremBridgeSVG-001</metadata><defs><style>.bg{fill:#FAF9F6}.panel{fill:#FFFFF0;stroke:#E5E5EA;stroke-width:2}.ink{fill:#2C2C2E;font-family:Arial,sans-serif}.title{font-size:34px;font-weight:700}.label{font-size:24px;font-weight:700}.small{font-size:18px}.formula{font-family:Times New Roman,serif;font-size:28px;fill:#2C2C2E}.gold{stroke:#C5A059;fill:none;stroke-width:4}.bar{fill:#C5A059;opacity:.8}.bar2{fill:#D4AF37;opacity:.7}.rose{fill:#FBEFEF;stroke:#C5A059;stroke-width:2}.axis{stroke:#2C2C2E;stroke-width:2}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#C5A059"/></marker></defs><rect class="bg" width="1200" height="760"/><rect class="panel" x="35" y="30" width="1130" height="700" rx="28"/><text class="ink title" x="80" y="90">A-Level Maths Bridge: what changes?</text><rect class="panel" x="85" y="170" width="420" height="380" rx="26"/><text class="ink label" x="120" y="215">Ordinary A-Level Maths</text><text class="formula" x="120" y="290">X ∼ N(μ, σ²)</text><path d="M150,450 C210,440 250,340 330,325 C410,340 450,440 490,450" class="gold"/><path d="M515 350 C560 350 600 350 645 350" stroke="#C5A059" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect class="panel" x="695" y="170" width="420" height="380" rx="26"/><text class="ink label" x="730" y="215">Further Maths CLT</text><text class="formula" x="730" y="290">X̄ ≈ N(μ, σ²/n)</text><path d="M800,450 C860,430 900,315 955,305 C1010,315 1050,430 1110,450" stroke="#D4AF37" fill="none" stroke-width="4"/><rect class="rose" x="220" y="610" width="760" height="88" rx="22"/><text class="formula" x="260" y="665">Calculator SD: σ/√n, not σ²/n</text></svg>