<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Spinner sums and sample means approaching a normal shape</title><desc id="desc">A fair spinner is spun three times; the sum distribution begins to resemble a bell shape, then dividing by 3 forms the sample mean</desc><metadata>Asset ID: FA22CentralLimitTheoremSVG-002</metadata><defs><style>.bg{fill:#FAF9F6}.panel{fill:#FFFFF0;stroke:#E5E5EA;stroke-width:2}.ink{fill:#2C2C2E;font-family:Arial,sans-serif}.title{font-size:34px;font-weight:700}.label{font-size:24px;font-weight:700}.small{font-size:18px}.formula{font-family:Times New Roman,serif;font-size:28px;fill:#2C2C2E}.gold{stroke:#C5A059;fill:none;stroke-width:4}.bar{fill:#C5A059;opacity:.8}.bar2{fill:#D4AF37;opacity:.7}.rose{fill:#FBEFEF;stroke:#C5A059;stroke-width:2}.axis{stroke:#2C2C2E;stroke-width:2}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#C5A059"/></marker></defs><rect class="bg" width="1200" height="760"/><rect class="panel" x="35" y="30" width="1130" height="700" rx="28"/><text class="ink title" x="80" y="90">Spinner example: from sums to sample means</text><text class="ink small" x="80" y="125">A fair three-sided spinner has outcomes 1, 2, 3.</text><text class="formula" x="180" y="250">X₁</text><text class="formula" x="520" y="250">X₂</text><text class="formula" x="860" y="250">X₃</text><circle cx="210" cy="310" r="55" fill="#FBEFEF" stroke="#C5A059"/><circle cx="550" cy="310" r="55" fill="#FBEFEF" stroke="#C5A059"/><circle cx="890" cy="310" r="55" fill="#FBEFEF" stroke="#C5A059"/><text class="formula" x="360" y="430">Y = X₁ + X₂ + X₃</text><rect class="panel" x="220" y="475" width="760" height="150" rx="20"/><rect class="bar" x="340" y="578" width="28" height="12"/><rect class="bar" x="410" y="556" width="28" height="34"/><rect class="bar" x="480" y="532" width="28" height="58"/><rect class="bar2" x="550" y="520" width="28" height="70"/><rect class="bar" x="620" y="532" width="28" height="58"/><rect class="bar" x="690" y="556" width="28" height="34"/><rect class="bar" x="760" y="578" width="28" height="12"/><line class="axis" x1="300" y1="590" x2="850" y2="590"/><text class="formula" x="370" y="710">X̄ = (X₁ + X₂ + X₃) / 3</text></svg>