<title id="title">Central Limit Theorem: variance shrinks as sample size increases</title><desc id="desc">Three normal curves share the same centre mu; as sample size increases the sampling distribution narrows</desc><metadata>Asset ID: FA22CentralLimitTheoremSVG-003</metadata><defs><style>.bg{fill:#FAF9F6}.panel{fill:#FFFFF0;stroke:#E5E5EA;stroke-width:2}.ink{fill:#2C2C2E;font-family:Arial,sans-serif}.title{font-size:34px;font-weight:700}.label{font-size:24px;font-weight:700}.small{font-size:18px}.formula{font-family:Times New Roman,serif;font-size:28px;fill:#2C2C2E}.gold{stroke:#C5A059;fill:none;stroke-width:4}.bar{fill:#C5A059;opacity:.8}.bar2{fill:#D4AF37;opacity:.7}.rose{fill:#FBEFEF;stroke:#C5A059;stroke-width:2}.axis{stroke:#2C2C2E;stroke-width:2}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#C5A059"/></marker></defs><rect class="bg" width="1200" height="760"/><rect class="panel" x="35" y="30" width="1130" height="700" rx="28"/><text class="ink title" x="80" y="90">As sample size increases, the sample mean varies less</text><text class="ink small" x="80" y="125">The centre remains μ, but Var(X̄)=σ²/n.</text><line class="axis" x1="165" y1="520" x2="800" y2="520"/><path d="M175,520 C250,518 310,462 355,405 C400,348 430,310 482,310 C534,310 564,348 609,405 C654,462 714,518 790,520" stroke="#C5A059" fill="none" stroke-width="4" opacity=".55"/><path d="M275,520 C335,515 380,440 410,365 C435,302 455,270 482,270 C509,270 529,302 554,365 C584,440 629,515 690,520" stroke="#D4AF37" fill="none" stroke-width="4"/><path d="M375,520 C408,500 425,398 447,300 C458,250 468,230 482,230 C496,230 506,250 517,300 C539,398 556,500 589,520" stroke="#2C2C2E" fill="none" stroke-width="4"/><text class="formula" x="468" y="555">μ</text><rect class="rose" x="860" y="240" width="270" height="150" rx="20"/><text class="formula" x="890" y="295">Var(X̄)=σ²/n</text><text class="formula" x="890" y="345">SD(X̄)=σ/√n</text></svg>