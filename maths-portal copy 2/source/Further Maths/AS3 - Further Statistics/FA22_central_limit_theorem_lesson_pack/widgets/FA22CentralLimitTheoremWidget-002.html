<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FA22CentralLimitTheoremWidget-002</title><style>body{margin:0;background:#FAF9F6;color:#2C2C2E;font-family:Inter,Aptos,Arial,sans-serif}main{max-width:1050px;margin:24px auto;padding:24px}.shell{background:#FFFFF0;border:1px solid #E5E5EA;border-radius:28px;padding:28px}.grid{display:grid;grid-template-columns:340px 1fr;gap:22px}.card{background:white;border:1px solid #E5E5EA;border-radius:20px;padding:18px}label{display:block;margin-top:12px;font-weight:700}input,select{width:100%;padding:10px;border:1px solid #E5E5EA;border-radius:12px}button{margin-top:16px;width:100%;padding:12px;background:#C5A059;border:0;border-radius:14px;font-weight:800}.box{background:#FAF9F6;border:1px solid #E5E5EA;border-radius:14px;padding:12px;margin-top:10px}.warn{background:#FBEFEF;border:1px solid #C5A059;border-radius:14px;padding:12px;margin-top:10px}.ok{background:#FFFFF0;border:1px solid #C5A059;border-radius:14px;padding:12px;margin-top:10px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main><section class="shell"><p>Asset ID: FA22CentralLimitTheoremWidget-002 | Purpose: Prevent the variance vs standard deviation calculator error.</p><h1>Variance vs Standard Deviation Trap</h1><div class="grid"><div class="card"><label>Variance numerator</label><input id="num" value="13" type="number"><label>Variance denominator</label><input id="den" value="160" type="number"><label>Planned calculator σ</label><input id="planned" value="0.08125" type="number" step="any"><button onclick="check()">Check</button></div><div class="card"><div class="box" id="out"></div><div id="fb"></div></div></div></section></main><script>function f(x){return Number(x).toFixed(6).replace(/\.?0+$/,'');}function check(){let num=+document.getElementById('num').value,den=+document.getElementById('den').value,p=+document.getElementById('planned').value,v=num/den,sd=Math.sqrt(v),close=(a,b)=>Math.abs(a-b)<Math.max(1e-4,Math.abs(b)*1e-3);document.getElementById('out').textContent=`Variance = ${f(v)}; correct calculator σ = ${f(sd)}`;let fb=document.getElementById('fb');if(close(p,sd)){fb.className='ok';fb.textContent='Correct: this is the standard deviation.'}else if(close(p,v)){fb.className='warn';fb.textContent='This is the variance. The calculator needs the standard deviation.'}else{fb.className='warn';fb.textContent='Recalculate √(variance of X̄).'}}check();</script></body></html>
