<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FA22CentralLimitTheoremWidget-003</title><style>body{margin:0;background:#FAF9F6;color:#2C2C2E;font-family:Inter,Aptos,Arial,sans-serif}main{max-width:1050px;margin:24px auto;padding:24px}.shell{background:#FFFFF0;border:1px solid #E5E5EA;border-radius:28px;padding:28px}.grid{display:grid;grid-template-columns:340px 1fr;gap:22px}.card{background:white;border:1px solid #E5E5EA;border-radius:20px;padding:18px}label{display:block;margin-top:12px;font-weight:700}input,select{width:100%;padding:10px;border:1px solid #E5E5EA;border-radius:12px}button{margin-top:16px;width:100%;padding:12px;background:#C5A059;border:0;border-radius:14px;font-weight:800}.box{background:#FAF9F6;border:1px solid #E5E5EA;border-radius:14px;padding:12px;margin-top:10px}.warn{background:#FBEFEF;border:1px solid #C5A059;border-radius:14px;padding:12px;margin-top:10px}.ok{background:#FFFFF0;border:1px solid #C5A059;border-radius:14px;padding:12px;margin-top:10px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main><section class="shell"><p>Asset ID: FA22CentralLimitTheoremWidget-003 | Purpose: Solve one-sided minimum sample-size CLT inequalities.</p><h1>Minimum Sample Size Solver</h1><div class="grid"><div class="card"><label>μ</label><input id="mu" value="50" type="number"><label>σ²</label><input id="v" value="25" type="number"><label>Upper threshold a</label><input id="a" value="52" type="number"><label>Tail probability α</label><input id="alpha" value="0.05" type="number" step="any"><button onclick="solve()">Solve</button></div><div class="card"><div class="box" id="out"></div><div class="box" id="ans"></div><div id="msg" class="ok"></div></div></div></section></main><script>function erf(x){const s=x>=0?1:-1;x=Math.abs(x);const a1=.254829592,a2=-.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=.3275911,t=1/(1+p*x);return s*(1-(((((a5*t+a4)*t+a3)*t+a2)*t+a1)*t)*Math.exp(-x*x));}function cdf(z){return .5*(1+erf(z/Math.sqrt(2)));}function inv(p){let lo=-10,hi=10;for(let i=0;i<100;i++){let m=(lo+hi)/2;if(cdf(m)<p)lo=m;else hi=m;}return(lo+hi)/2;}function f(x){return Number(x).toFixed(5).replace(/\.?0+$/,'');}function solve(){let mu=+document.getElementById('mu').value,v=+document.getElementById('v').value,a=+document.getElementById('a').value,alpha=+document.getElementById('alpha').value,s=Math.sqrt(v),z=inv(1-alpha),bound=(z*s/(a-mu))**2,n=Math.floor(bound)+1;document.getElementById('out').textContent=`X̄ ≈ N(${f(mu)}, ${f(v)}/n); critical z = ${f(z)}`;document.getElementById('ans').textContent=`n > ${f(bound)} so minimum n = ${n}`;document.getElementById('msg').textContent='Round up to the smallest integer satisfying the strict inequality.';}solve();</script></body></html>
