<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FA22CentralLimitTheoremWidget-001</title><style>body{margin:0;background:#FAF9F6;color:#2C2C2E;font-family:Inter,Aptos,Arial,sans-serif}main{max-width:1050px;margin:24px auto;padding:24px}.shell{background:#FFFFF0;border:1px solid #E5E5EA;border-radius:28px;padding:28px}.grid{display:grid;grid-template-columns:340px 1fr;gap:22px}.card{background:white;border:1px solid #E5E5EA;border-radius:20px;padding:18px}label{display:block;margin-top:12px;font-weight:700}input,select{width:100%;padding:10px;border:1px solid #E5E5EA;border-radius:12px}button{margin-top:16px;width:100%;padding:12px;background:#C5A059;border:0;border-radius:14px;font-weight:800}.box{background:#FAF9F6;border:1px solid #E5E5EA;border-radius:14px;padding:12px;margin-top:10px}.warn{background:#FBEFEF;border:1px solid #C5A059;border-radius:14px;padding:12px;margin-top:10px}.ok{background:#FFFFF0;border:1px solid #C5A059;border-radius:14px;padding:12px;margin-top:10px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main><section class="shell"><p>Asset ID: FA22CentralLimitTheoremWidget-001 | Purpose: Build the sampling distribution of X-bar.</p><h1>CLT Sampling Distribution Builder</h1><div class="grid"><div class="card"><label>μ</label><input id="mu" value="2.5" type="number" step="any"><label>σ²</label><input id="v" value="3.25" type="number" step="any"><label>n</label><input id="n" value="40" type="number"><label>a</label><input id="a" value="3" type="number" step="any"><select id="tail"><option value="g">P(X̄ &gt; a)</option><option value="l">P(X̄ &lt; a)</option></select><button onclick="calc()">Build distribution</button></div><div class="card"><h2>Output</h2><div class="box" id="out"></div><div class="box" id="prob"></div><div id="msg"></div></div></div></section></main><script>function erf(x){const s=x>=0?1:-1;x=Math.abs(x);const a1=.254829592,a2=-.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=.3275911,t=1/(1+p*x);return s*(1-(((((a5*t+a4)*t+a3)*t+a2)*t+a1)*t)*Math.exp(-x*x));}function cdf(z){return .5*(1+erf(z/Math.sqrt(2)));}function f(x){return Number(x).toFixed(5).replace(/\.?0+$/,'');}function calc(){let mu=+document.getElementById('mu').value,v=+document.getElementById('v').value,n=+document.getElementById('n').value,a=+document.getElementById('a').value;let vx=v/n,sd=Math.sqrt(vx),z=(a-mu)/sd,p=document.getElementById('tail').value==='g'?1-cdf(z):cdf(z);document.getElementById('out').textContent=`X̄ ≈ N(${f(mu)}, ${f(vx)}); SD = ${f(sd)}`;document.getElementById('prob').textContent=`z = ${f(z)}; probability ≈ ${f(p)}`;document.getElementById('msg').className=n>=30?'ok':'warn';document.getElementById('msg').textContent=n>=30?'n ≥ 30: CCEA CLT boundary satisfied.':'n < 30: use CLT only with extra justification.';}calc();</script></body></html>
