<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">FA22GeneratingFunctionsBridgeSVG-001: Ordinary Expansion to Further Maths Coefficient Extraction</title>
  <desc id="desc">A bridge visual comparing ordinary A-Level binomial expansion with Further Maths coefficient extraction.</desc>
  <metadata>Asset ID: FA22GeneratingFunctionsBridgeSVG-001; Topic ID: FA22GeneratingFunctions; Related lesson: FA22_generating_functions_lesson.md</metadata>
  <defs><marker id="arrowGold" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 14 7 L 0 14 z" fill="#C5A059"/></marker><style>.canvas{fill:#FAF9F6}.card{fill:#FFFFF0;stroke:#E5E5EA;stroke-width:2}.soft-card{fill:#FBEFEF;stroke:#E5E5EA;stroke-width:2}.line{stroke:#E5E5EA;stroke-width:2}.gold-line{stroke:#C5A059;stroke-width:4;fill:none;marker-end:url(#arrowGold)}.title{font-family:Arial,Helvetica,sans-serif;font-size:34px;font-weight:700;fill:#2C2C2E}.subtitle{font-family:Arial,Helvetica,sans-serif;font-size:20px;fill:#2C2C2E}.label{font-family:Arial,Helvetica,sans-serif;font-size:23px;font-weight:700;fill:#2C2C2E}.small{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#2C2C2E}.math{font-family:Times New Roman,Times,serif;font-size:30px;fill:#2C2C2E}.math-small{font-family:Times New Roman,Times,serif;font-size:23px;fill:#2C2C2E}.badge{font-family:Arial,Helvetica,sans-serif;font-size:17px;font-weight:700;fill:#2C2C2E}</style></defs>
  <rect class="canvas" x="0" y="0" width="1200" height="760"/>
  <text class="title" x="60" y="70">A-Level Maths bridge: expansion becomes extraction</text>
  <text class="subtitle" x="60" y="106">Ordinary Maths teaches expansion. Further Maths often asks for the one coefficient that matters.</text>
  <rect class="soft-card" x="110" y="145" width="980" height="85" rx="18"/><text class="label" x="145" y="181">Example target</text><text class="math" x="145" y="215">Find [t⁴](2 + 3t)⁶</text>
  <rect class="card" x="85" y="285" width="455" height="300" rx="22"/><text class="label" x="120" y="330">Ordinary A-Level habit</text><text class="small" x="120" y="365">Expand the whole expression:</text><text class="math-small" x="120" y="410">(2 + 3t)⁶ = 64 + 576t + 2160t²</text><text class="math-small" x="120" y="448">+ 4320t³ + 4860t⁴ + 2916t⁵ + 729t⁶</text><line class="line" x1="120" y1="475" x2="500" y2="475"/><text class="small" x="120" y="515">Works, but it is slow and crowded.</text><text class="small" x="120" y="545">More places for arithmetic slips to hide.</text>
  <rect class="card" x="660" y="285" width="455" height="300" rx="22"/><text class="label" x="695" y="330">Further Maths upgrade</text><text class="small" x="695" y="365">Target only the required coefficient:</text><text class="math-small" x="695" y="410">[t⁴](2 + 3t)⁶</text><text class="math-small" x="695" y="448">= ⁶C₄ · 2² · 3⁴</text><text class="math-small" x="695" y="486">= 15 · 4 · 81</text><text class="math-small" x="695" y="524">= 4860</text>
  <path class="gold-line" d="M 550 435 C 585 435, 615 435, 650 435"/>
  <rect class="soft-card" x="110" y="635" width="440" height="70" rx="18"/><text class="badge" x="145" y="664">Old habit</text><text class="small" x="145" y="692">Full expansion when practising algebra.</text>
  <rect class="soft-card" x="650" y="635" width="440" height="70" rx="18"/><text class="badge" x="685" y="664">New habit</text><text class="small" x="685" y="692">Coefficient extraction when the target is [tʳ].</text>
</svg>
