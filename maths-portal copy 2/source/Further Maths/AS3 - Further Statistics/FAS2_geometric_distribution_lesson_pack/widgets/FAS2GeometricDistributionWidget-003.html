<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FAS2GeometricDistributionWidget-003</title><style>body{font-family:Arial,sans-serif;background:#FAF9F6;color:#2C2C2E;padding:24px}.w{max-width:900px;margin:auto;background:#FFFFF0;border:1px solid #E5E5EA;border-radius:20px;padding:22px}button{margin:6px;padding:10px;border-radius:10px;border:1px solid #E5E5EA;background:#fffef8;font-weight:700}.main{background:#FFF8DC;border-color:#D4AF37}.out,.scenario{background:#FAF9F6;border:1px solid #E5E5EA;border-radius:14px;padding:14px;margin-top:12px}.sel{outline:3px solid #C5A059}</style></head><body><main class="w"><h1>Distribution model selector</h1><div id="s" class="scenario"></div><button onclick="pick('binomial')">Binomial</button><button onclick="pick('geometric')">Geometric</button><button onclick="pick('poisson')">Poisson boundary-link</button><button onclick="pick('notcore')">Not core here</button><br><button class="main" onclick="check()">Check</button><button class="main" onclick="next()">Next</button><div id="out" class="out"></div></main><script>const data=[['I roll a die 20 times and count sixes.','binomial','Fixed trials; counts successes. X~Bin(20,1/6).'],['I roll a die until the first six appears.','geometric','Trials until first success. X~Geo(1/6).'],['A call centre counts calls in one hour.','poisson','Events in a fixed interval; Poisson boundary-link.'],['I roll a die until the third six appears.','notcore','Not geometric; negative-binomial style and excluded here.'],['Inspect components until the first defective one.','geometric','Trials until first success.']];let i=0,sel='';function render(){sel='';document.getElementById('s').textContent=data[i][0];document.getElementById('out').textContent='Choose a model.'}function pick(x){sel=x}function check(){let d=data[i];document.getElementById('out').innerHTML=(sel===d[1]?'Correct.':'Not quite.')+`<br><b>Answer:</b> ${d[1]}<br>${d[2]}`}function next(){i=(i+1)%data.length;render()}render()</script></body></html>
