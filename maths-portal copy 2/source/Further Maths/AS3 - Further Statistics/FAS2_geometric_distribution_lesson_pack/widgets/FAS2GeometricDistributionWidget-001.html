<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FAS2GeometricDistributionWidget-001</title><style>body{font-family:Arial,sans-serif;background:#FAF9F6;color:#2C2C2E;padding:24px}.w{max-width:900px;margin:auto;background:#FFFFF0;border:1px solid #E5E5EA;border-radius:20px;padding:22px}input,select,button{font-size:1rem;padding:10px;border-radius:10px;border:1px solid #E5E5EA;margin:6px}button{background:#FFF8DC;border-color:#D4AF37;font-weight:700}.out{margin-top:16px;background:#FAF9F6;border:1px solid #E5E5EA;border-radius:14px;padding:14px}.box{display:inline-flex;width:42px;height:42px;border-radius:10px;background:#FBEFEF;border:1px solid #E5E5EA;align-items:center;justify-content:center;margin:4px;font-weight:bold}.s{background:#FFF8DC;border-color:#D4AF37;color:#C5A059}</style></head><body><main class="w"><h1>Geometric probability calculator</h1><p>For <b>X ~ Geo(p)</b>, where X is the number of trials until the first success.</p><label>p <input id="p" type="number" step="0.0001" value="0.2"></label><label>x <input id="x" type="number" step="1" value="7"></label><select id="t"><option value="eq">P(X=x)</option><option value="le">P(X≤x)</option><option value="gt">P(X&gt;x)</option><option value="ge" selected>P(X≥x)</option></select><button onclick="calc()">Calculate</button><div id="out" class="out"></div></main><script>function f(n){return Number(n.toFixed(10)).toString()}function calc(){let p=+document.getElementById('p').value,x=+document.getElementById('x').value,t=document.getElementById('t').value,o=document.getElementById('out');if(!(p>0&&p<=1)||!Number.isInteger(x)||x<1){o.innerHTML='Check: 0 < p ≤ 1 and x is a positive integer.';return}let q=1-p,v,form,strip='';if(t==='eq'){v=p*Math.pow(q,x-1);form=`P(X=${x})=${f(p)}(${f(q)})<sup>${x-1}</sup>`;for(let i=0;i<x-1&&i<8;i++)strip+='<span class="box">F</span>';if(x>9)strip+='<span class="box">...</span>';strip+='<span class="box s">S</span>'}if(t==='le'){v=1-Math.pow(q,x);form=`P(X≤${x})=1-(${f(q)})<sup>${x}</sup>`;strip='Use complement: not all first x trials fail.'}if(t==='gt'){v=Math.pow(q,x);form=`P(X>${x})=(${f(q)})<sup>${x}</sup>`;for(let i=0;i<x&&i<9;i++)strip+='<span class="box">F</span>';if(x>9)strip+='<span class="box">...</span>'}if(t==='ge'){v=Math.pow(q,x-1);form=`P(X≥${x})=(${f(q)})<sup>${x-1}</sup>`;for(let i=0;i<x-1&&i<8;i++)strip+='<span class="box">F</span>';if(x>9)strip+='<span class="box">...</span>'}o.innerHTML=`<b>Model:</b> X ~ Geo(${f(p)})<br><b>Formula:</b> ${form}<br><b>Answer:</b> ${f(v)}<div>${strip}</div><p>Trap watch: P(X&gt;x) uses x failures; P(X≥x) uses x−1 failures.</p>`}calc()</script></body></html>
