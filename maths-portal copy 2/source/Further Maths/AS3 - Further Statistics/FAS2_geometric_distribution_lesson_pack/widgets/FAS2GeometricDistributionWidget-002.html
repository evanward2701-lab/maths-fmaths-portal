<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FAS2GeometricDistributionWidget-002</title><style>body{font-family:Arial,sans-serif;background:#FAF9F6;color:#2C2C2E;padding:24px}.w{max-width:900px;margin:auto;background:#FFFFF0;border:1px solid #E5E5EA;border-radius:20px;padding:22px}button{display:block;margin:8px 0;padding:10px;border-radius:10px;border:1px solid #E5E5EA;background:#fffef8;font-weight:700}.main{background:#FFF8DC;border-color:#D4AF37;display:inline-block}.out{background:#FAF9F6;border:1px solid #E5E5EA;border-radius:14px;padding:14px;margin-top:12px}.sel{outline:3px solid #C5A059}</style></head><body><main class="w"><h1>Geometric wording classifier</h1><p id="prompt"></p><div id="choices"></div><button class="main" onclick="check()">Check</button><button class="main" onclick="next()">Next</button><div id="out" class="out"></div></main><script>const cards=[['Exactly 4 times','P(X = 4)','p(1-p)^3'],['Less than 8 times','P(X < 8) = P(X ≤ 7)','1-(1-p)^7'],['More than 5 times','P(X > 5)','(1-p)^5'],['At least 10 attempts','P(X ≥ 10)','(1-p)^9'],['Five or fewer attempts','P(X ≤ 5)','1-(1-p)^5'],['On the fifth attempt','P(X = 5)','p(1-p)^4']];let i=0,sel='';const opts=['P(X = 4)','P(X = 5)','P(X ≤ 5)','P(X ≤ 8)','P(X < 8) = P(X ≤ 7)','P(X > 5)','P(X ≥ 5)','P(X ≥ 10)'];function render(){sel='';document.getElementById('prompt').innerHTML='<b>Translate:</b> '+cards[i][0];document.getElementById('choices').innerHTML=opts.map(o=>`<button onclick="sel='${o}';document.querySelectorAll('#choices button').forEach(b=>b.classList.remove('sel'));this.classList.add('sel')">${o}</button>`).join('');document.getElementById('out').innerHTML='Choose the notation first.'}function check(){let c=cards[i],ok=sel===c[1];document.getElementById('out').innerHTML=(ok?'Correct.':'Not quite.')+`<br><b>Notation:</b> ${c[1]}<br><b>Formula:</b> ${c[2]}`}function next(){i=(i+1)%cards.length;render()}render()</script></body></html>
