<svg width="1400" height="900" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">FA22ChiSquaredTestsBridgeSVG-001: Ordinary A-Level to Chi-Squared Testing</title><desc id="desc">Bridge diagram comparing ordinary hypothesis testing with chi-squared tests.</desc><metadata>Asset ID: FA22ChiSquaredTestsBridgeSVG-001; Topic ID: FA22ChiSquaredTests.</metadata><rect width="1400" height="900" fill="#FAF9F6"/><text x="70" y="72" font-family="Arial" font-size="36" font-weight="700" fill="#2C2C2E">A-Level Maths Bridge: From One Statistic to a Whole Table</text><rect x="80" y="165" width="520" height="590" rx="24" fill="#FFF" stroke="#E5E5EA"/><rect x="800" y="165" width="520" height="590" rx="24" fill="#FFF" stroke="#E5E5EA"/><text x="340" y="220" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700">Ordinary A-Level Maths</text><text x="1060" y="220" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700">Further Maths χ²</text><g font-family="Arial" font-size="22" fill="#2C2C2E"><text x="125" y="310">• Tests one parameter or statistic</text><text x="125" y="370">• Binomial, normal or known model</text><text x="125" y="430">• Critical region may vary</text><text x="125" y="490">• Conclusion about parameter/context</text><text x="845" y="310">• Tests a whole frequency table</text><text x="845" y="370">• Compares observed and expected</text><text x="845" y="430">• Critical region is upper-tail</text><text x="845" y="490">• Conclusion about fit or association</text></g><rect x="625" y="285" width="150" height="320" rx="22" fill="#FBEFEF" stroke="#C5A059"/><text x="700" y="335" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700">Upgrade</text><text x="700" y="395" text-anchor="middle" font-family="Arial" font-size="18">single value</text><text x="700" y="425" text-anchor="middle" font-family="Arial" font-size="18">→ many cells</text><text x="700" y="485" text-anchor="middle" font-family="Arial" font-size="18">probability</text><text x="700" y="515" text-anchor="middle" font-family="Arial" font-size="18">→ expected frequency</text><text x="700" y="575" text-anchor="middle" font-family="Arial" font-size="18">parameter</text><text x="700" y="605" text-anchor="middle" font-family="Arial" font-size="18">→ model/table</text><rect x="185" y="800" width="1030" height="62" rx="18" fill="#FFFFF0" stroke="#C5A059"/><text x="700" y="839" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Old structure stays: H₀, H₁, significance level, critical value, conclusion. The tested object changes.</text></svg>