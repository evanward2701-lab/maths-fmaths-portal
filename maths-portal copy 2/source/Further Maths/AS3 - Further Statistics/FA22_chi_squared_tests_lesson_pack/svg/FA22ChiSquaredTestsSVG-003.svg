<svg width="1400" height="850" viewBox="0 0 1400 850" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">FA22ChiSquaredTestsSVG-003: Data to Model Pipeline</title><desc id="desc">Pipeline from data to simplifying assumptions to model to expected frequencies and conclusion.</desc><metadata>Asset ID: FA22ChiSquaredTestsSVG-003; Topic ID: FA22ChiSquaredTests.</metadata><rect width="1400" height="850" fill="#FAF9F6"/><text x="70" y="75" font-family="Arial" font-size="38" font-weight="700" fill="#2C2C2E">Testing a Model</text><rect x="80" y="160" width="1240" height="300" rx="26" fill="#FFFFF0" stroke="#E5E5EA"/><rect x="145" y="250" width="240" height="120" rx="18" fill="#FFF" stroke="#C5A059" stroke-width="3"/><text x="265" y="322" font-family="Arial" font-size="36" font-weight="700" text-anchor="middle">Data</text><rect x="540" y="250" width="300" height="120" rx="18" fill="#FBEFEF" stroke="#C5A059" stroke-width="3"/><text x="690" y="305" font-family="Arial" font-size="28" font-weight="700" text-anchor="middle">Simplifying</text><text x="690" y="340" font-family="Arial" font-size="28" font-weight="700" text-anchor="middle">assumptions</text><rect x="1010" y="250" width="240" height="120" rx="18" fill="#FFF" stroke="#C5A059" stroke-width="3"/><text x="1130" y="322" font-family="Arial" font-size="36" font-weight="700" text-anchor="middle">Model</text><path d="M405 310 L515 310" stroke="#C5A059" stroke-width="7"/><path d="M860 310 L985 310" stroke="#C5A059" stroke-width="7"/><g font-family="Arial" font-size="20" fill="#2C2C2E"><rect x="120" y="540" width="250" height="150" rx="18" fill="#FFF" stroke="#E5E5EA"/><text x="145" y="580" font-weight="700">Observed frequencies</text><text x="145" y="620">O₁, O₂, …, Oₖ</text><rect x="430" y="540" width="250" height="150" rx="18" fill="#FFF" stroke="#E5E5EA"/><text x="455" y="580" font-weight="700">Expected frequencies</text><text x="455" y="620">Eᵢ = Npᵢ</text><rect x="740" y="540" width="250" height="150" rx="18" fill="#FBEFEF" stroke="#C5A059"/><text x="765" y="580" font-weight="700">χ² test</text><text x="765" y="620">Σ((O−E)²/E)</text><rect x="1050" y="540" width="250" height="150" rx="18" fill="#FFF" stroke="#E5E5EA"/><text x="1075" y="580" font-weight="700">Conclusion</text><text x="1075" y="620">Reject or do not reject H₀</text></g><text x="700" y="780" font-family="Arial" font-size="24" font-weight="700" text-anchor="middle" fill="#2C2C2E">Are the observed counts close enough to the expected counts?</text></svg>