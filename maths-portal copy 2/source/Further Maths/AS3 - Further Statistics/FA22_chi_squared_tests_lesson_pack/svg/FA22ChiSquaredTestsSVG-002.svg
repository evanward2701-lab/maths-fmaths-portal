<svg width="1400" height="850" viewBox="0 0 1400 850" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">FA22ChiSquaredTestsSVG-002: Chi-Squared Upper-Tail Critical Region</title><desc id="desc">Right-skewed chi-squared distribution with upper-tail critical region.</desc><metadata>Asset ID: FA22ChiSquaredTestsSVG-002; Topic ID: FA22ChiSquaredTests.</metadata><rect width="1400" height="850" fill="#FAF9F6"/><text x="75" y="75" font-family="Arial" font-size="38" font-weight="700" fill="#2C2C2E">χ² Tests Reject in the Upper Tail</text><rect x="90" y="150" width="1220" height="550" rx="24" fill="#FFFFF0" stroke="#E5E5EA"/><line x1="170" y1="590" x2="1180" y2="590" stroke="#2C2C2E" stroke-width="3"/><line x1="170" y1="590" x2="170" y2="230" stroke="#2C2C2E" stroke-width="3"/><path d="M170 590 C190 420 270 265 390 300 C520 338 610 475 760 535 C890 590 1030 590 1180 590" fill="none" stroke="#2C2C2E" stroke-width="5"/><path d="M840 590 C900 570 1010 590 1180 590 L1180 590 L840 590 Z" fill="#FBEFEF"/><path d="M840 590 C900 570 1010 590 1180 590" fill="none" stroke="#C5A059" stroke-width="5"/><line x1="840" y1="590" x2="840" y2="310" stroke="#C5A059" stroke-width="4" stroke-dasharray="10 8"/><text x="840" y="630" font-family="Arial" font-size="24" font-weight="700" text-anchor="middle" fill="#2C2C2E">11.070</text><line x1="410" y1="590" x2="410" y2="350" stroke="#C5A059" stroke-width="3"/><text x="410" y="630" font-family="Arial" font-size="24" font-weight="700" text-anchor="middle" fill="#2C2C2E">3.4</text><text x="1010" y="370" font-family="Arial" font-size="30" font-weight="700" text-anchor="middle" fill="#C5A059">critical region</text><text x="1010" y="410" font-family="Arial" font-size="22" text-anchor="middle" fill="#2C2C2E">upper tail, area 5%</text><text x="710" y="770" font-family="Arial" font-size="24" font-weight="700" text-anchor="middle" fill="#2C2C2E">If X²calc &gt; X²crit, reject H₀. Too large means poor fit.</text></svg