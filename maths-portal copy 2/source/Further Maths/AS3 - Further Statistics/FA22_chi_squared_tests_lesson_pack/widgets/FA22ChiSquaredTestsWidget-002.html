<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FA22ChiSquaredTestsWidget-002</title><style>body{font-family:Inter,system-ui,sans-serif;background:#FAF9F6;color:#2C2C2E;margin:0}.wrap{max-width:900px;margin:auto;padding:28px}.card{background:white;border:1px solid #E5E5EA;border-radius:20px;padding:20px;margin:16px 0}.hero{background:#FFFFF0}input,select,button{font:inherit;border-radius:12px;padding:10px;border:1px solid #E5E5EA}button{background:#C5A059;font-weight:800}.result{font-size:3rem;font-weight:900}.pill{display:inline-block;background:#FFFFF0;border:1px solid #E5E5EA;border-radius:999px;padding:6px 10px;margin:4px}</style></head><body><main class="wrap"><section class="card hero"><h1>Degrees-of-Freedom Checker</h1><p>Checks ν for goodness-of-fit and contingency-table tests.</p></section><section class="card"><label>Test type <select id="type"><option value="gof">Goodness of fit</option><option value="ct">Contingency table</option></select></label><div id="gof"><label>Classes after combining <input id="k" type="number" value="6"></label><label>Estimated parameters <input id="p" type="number" value="0"></label></div><div id="ct" style="display:none"><label>Rows <input id="r" type="number" value="2"></label><label>Columns <input id="c" type="number" value="3"></label></div><button id="calc">Check</button><div class="result" id="res"></div><div id="explain"></div></section><p>Asset ID: FA22ChiSquaredTestsWidget-002</p></main><script>function calc(){if(type.value==='gof'){let k=+document.getElementById('k').value,p=+document.getElementById('p').value,df=k-1-p;res.textContent='ν = '+df;explain.innerHTML=`<span class=pill>ν = k − 1 − parameters = ${k} − 1 − ${p}</span><p>Subtract one for the fixed total and one more for each parameter estimated from the data.</p>`}else{let r=+document.getElementById('r').value,c=+document.getElementById('c').value,df=(r-1)*(c-1);res.textContent='ν = '+df;explain.innerHTML=`<span class=pill>ν = (${r}−1)(${c}−1)</span>`+(r===2&&c===2?'<p>2×2 table: use Yates correction.</p>':'<p>No Yates correction unless the table is 2×2.</p>')}}type.onchange=()=>{gof.style.display=type.value==='gof'?'block':'none';ct.style.display=type.value==='ct'?'block':'none';calc()};document.getElementById('calc').onclick=calc;calc()</script></body></html>
