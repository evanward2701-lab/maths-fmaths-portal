<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FA22ChiSquaredTestsWidget-003</title><style>body{font-family:Inter,system-ui,sans-serif;background:#FAF9F6;color:#2C2C2E;margin:0}.wrap{max-width:1100px;margin:auto;padding:28px}.card{background:white;border:1px solid #E5E5EA;border-radius:20px;padding:20px;margin:16px 0}.hero{background:#FFFFF0}input,button{font:inherit;border-radius:10px;padding:8px;border:1px solid #E5E5EA}button{background:#C5A059;font-weight:800}table{border-collapse:collapse;width:100%;background:white}th,td{border:1px solid #E5E5EA;padding:8px;text-align:right}th{background:#FFFFF0}.warn{color:#9B2C2C}.ok{color:#2F6F4E}</style></head><body><main class="wrap"><section class="card hero"><h1>Contingency Table Calculator</h1><p>Calculates expected frequencies, degrees of freedom and X², using Yates correction for 2×2.</p></section><section class="card"><label>Rows <input id="rows" type="number" min="2" max="5" value="2"></label><label>Columns <input id="cols" type="number" min="2" max="5" value="2"></label><button id="build">Build</button><button id="example">Load training example</button><div style="overflow:auto"><table id="input"></table></div><button id="calc">Calculate</button></section><section class="card"><h2 id="summary"></h2><div id="feedback"></div><h3>Expected frequencies</h3><table id="expected"></table><h3>Contributions</h3><table id="contrib"></table></section><p>Asset ID: FA22ChiSquaredTestsWidget-003</p></main><script>function f(x){return Number(x.toFixed(3)).toString()}function build(vals){let r=+rows.value,c=+cols.value,html='<tbody>';for(let i=0;i<r;i++){html+='<tr><th>Row '+(i+1)+'</th>';for(let j=0;j<c;j++){html+=`<td><input data-i="${i}" data-j="${j}" type="number" value="${vals?.[i]?.[j]??0}"></td>`}html+='</tr>'}input.innerHTML=html+'</tbody>'}function get(){let r=+rows.value,c=+cols.value,m=Array.from({length:r},()=>Array(c).fill(0));input.querySelectorAll('input').forEach(x=>m[+x.dataset.i][+x.dataset.j]=+x.value||0);return m}function sum(a){return a.reduce((s,x)=>s+x,0)}function calc(){let o=get(),r=o.length,c=o[0].length,rt=o.map(sum),ct=Array.from({length:c},(_,j)=>sum(o.map(row=>row[j]))),N=sum(rt);if(!N)return;let e=o.map((row,i)=>row.map((_,j)=>rt[i]*ct[j]/N)),y=r===2&&c===2,chi=0;let eh='<tbody>';for(let i=0;i<r;i++){eh+='<tr>';for(let j=0;j<c;j++)eh+=`<td>${f(e[i][j])}</td>`;eh+='</tr>'}expected.innerHTML=eh+'</tbody>';let ch='<thead><tr><th>Cell</th><th>O</th><th>E</th><th>Contribution</th></tr></thead><tbody>';for(let i=0;i<r;i++)for(let j=0;j<c;j++){let d=Math.abs(o[i][j]-e[i][j]),v=(y?Math.pow(d-.5,2):Math.pow(d,2))/e[i][j];chi+=v;ch+=`<tr><td>R${i+1}C${j+1}</td><td>${o[i][j]}</td><td>${f(e[i][j])}</td><td>${f(v)}</td></tr>`}contrib.innerHTML=ch+`<tr><th>Total</th><th></th><th></th><th>${f(chi)}</th></tr></tbody>`;summary.textContent=`N = ${N}, ν = ${(r-1)*(c-1)}, X² = ${f(chi)} (${y?'Yates':'ordinary'})`;feedback.innerHTML=(e.flat().some(x=>x<5)?'<p class=warn>At least one expected frequency is below 5. Combine rows or columns if appropriate.</p>':'<p class=ok>All expected frequencies are at least 5.</p>')+(y?'<p>2×2 table: Yates correction applied.</p>':'<p>Not 2×2: ordinary statistic used.</p>')}build.onclick=()=>build();example.onclick=()=>{rows.value=2;cols.value=2;build([[28,12],[18,22]]);calc()};calc.onclick=calc;build([[28,12],[18,22]]);calc()</script></body></html>
