<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FA22ChiSquaredTestsWidget-001</title><style>body{font-family:Inter,system-ui,sans-serif;background:#FAF9F6;color:#2C2C2E;margin:0}.wrap{max-width:1100px;margin:auto;padding:28px}.card{background:white;border:1px solid #E5E5EA;border-radius:20px;padding:20px;margin:16px 0}.hero{background:#FFFFF0}textarea,input,select,button{font:inherit;border-radius:12px;padding:10px;border:1px solid #E5E5EA}textarea{width:100%;min-height:120px}button{background:#C5A059;font-weight:800;cursor:pointer}table{border-collapse:collapse;width:100%;background:white}th,td{border:1px solid #E5E5EA;padding:8px;text-align:right}th{background:#FFFFF0}.warn{color:#9B2C2C}.ok{color:#2F6F4E}</style></head><body><main class="wrap"><section class="card hero"><h1>Goodness-of-Fit Calculator</h1><p>Enter one observed, expected pair per line. Calculates Σ((O−E)²/E).</p></section><section class="card"><textarea id="data">26,20
27,20
28,20
21,20
10,20
8,20</textarea><p><button id="calc">Calculate</button></p><h2 id="stat"></h2><div id="feedback"></div><table id="table"></table></section><p>Asset ID: FA22ChiSquaredTestsWidget-001</p></main><script>function parse(){return document.getElementById('data').value.trim().split(/\n+/).filter(Boolean).map((l,i)=>{let p=l.split(/[ ,\t]+/).map(Number);if(p.length!==2||p.some(x=>!Number.isFinite(x)))throw Error('Line '+(i+1)+' needs observed and expected');if(p[1]<=0)throw Error('Expected frequencies must be positive');return{o:p[0],e:p[1]}})}function f(x){return Number(x.toFixed(4)).toString()}function calc(){let rows;try{rows=parse()}catch(e){feedback.innerHTML='<b class=warn>'+e.message+'</b>';return}let chi=0,so=0,se=0;let body='';rows.forEach((r,i)=>{let d=r.o-r.e,s=d*d,c=s/r.e;chi+=c;so+=r.o;se+=r.e;body+=`<tr><td>${i+1}</td><td>${f(r.o)}</td><td>${f(r.e)}</td><td>${f(d)}</td><td>${f(s)}</td><td>${f(c)}</td></tr>`});stat.textContent='X² = '+f(chi);let small=rows.some(r=>r.e<5);feedback.innerHTML=(Math.abs(so-se)<1e-9?'<p class=ok>ΣO = ΣE.</p>':'<p class=warn>ΣO and ΣE do not match.</p>')+(small?'<p class=warn>At least one expected frequency is below 5. Combine classes before final test.</p>':'<p class=ok>All expected frequencies are at least 5.</p>');table.innerHTML='<thead><tr><th>Cat</th><th>O</th><th>E</th><th>O−E</th><th>(O−E)²</th><th>Contribution</th></tr></thead><tbody>'+body+`<tr><th>Total</th><th>${f(so)}</th><th>${f(se)}</th><th></th><th></th><th>${f(chi)}</th></tr></tbody>`}document.getElementById('calc').onclick=calc;calc()</script></body></html>
