<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
<title id="title">Binomial and Poisson Comparison Table</title><desc id="desc">Comparison table showing binomial counts successes out of fixed trials while Poisson counts events in an interval given average rate lambda.</desc><metadata>Asset ID: FAS2PoissonDistributionSVG-003; Source: FS1-Chp2-PoissonDistribution.pdf comparison table.</metadata>
<style>.bg{fill:#FAF9F6}.panel{fill:#FFFFF0;stroke:#E5E5EA;stroke-width:3}.headbg{fill:#FBEFEF;stroke:#E5E5EA;stroke-width:2}.ink{fill:#2C2C2E}.muted{fill:#5B5B60}.gold{fill:#D4AF37}.grid{stroke:#E5E5EA;stroke-width:2}.title{font:800 42px Arial}.sub{font:500 21px Arial}.head{font:800 22px Arial}.body{font:500 21px Arial}.small{font:500 18px Arial}.formula{font:italic 30px Georgia}</style>
<rect class="bg" width="1500" height="900"/><text class="title ink" x="80" y="85">Binomial versus Poisson</text><text class="sub muted" x="80" y="125">The bridge from ordinary A-Level probability to Further Maths rate-based count models.</text>
<rect class="panel" x="80" y="175" width="1340" height="595" rx="28"/><rect class="headbg" x="110" y="215" width="1280" height="80" rx="18"/><line class="grid" x1="370" y1="215" x2="370" y2="705"/><line class="grid" x1="720" y1="215" x2="720" y2="705"/><line class="grid" x1="1080" y1="215" x2="1080" y2="705"/><line class="grid" x1="110" y1="295" x2="1390" y2="295"/><line class="grid" x1="110" y1="500" x2="1390" y2="500"/><line class="grid" x1="110" y1="705" x2="1390" y2="705"/>
<text class="head ink" x="145" y="265">Distribution</text><text class="head ink" x="405" y="265">What it counts</text><text class="head ink" x="755" y="265">Parameters</text><text class="head ink" x="1115" y="265">Outcomes</text>
<circle class="gold" cx="180" cy="365" r="40"/><text class="head ink" x="165" y="373">B</text><text class="formula ink" x="230" y="370">B(n,p)</text><text class="body ink" x="145" y="430">Binomial</text><text class="body ink" x="405" y="350">Number of successes</text><text class="body ink" x="405" y="385">out of a fixed number</text><text class="body ink" x="405" y="420">of trials.</text><text class="formula ink" x="755" y="355">n = trials</text><text class="formula ink" x="755" y="410">p = P(success)</text><text class="formula ink" x="1115" y="365">{0,1,2,...,n}</text><text class="small muted" x="1115" y="415">There is a fixed maximum.</text>
<circle class="gold" cx="180" cy="570" r="40"/><text class="head ink" x="158" y="578">Po</text><text class="formula ink" x="230" y="575">Po(λ)</text><text class="body ink" x="145" y="635">Poisson</text><text class="body ink" x="405" y="548">How many events occur</text><text class="body ink" x="405" y="583">within a fixed interval,</text><text class="body ink" x="405" y="618">given an average rate.</text><text class="formula ink" x="755" y="560">λ = average rate</text><text class="small muted" x="755" y="610">Mean number of events</text><text class="small muted" x="755" y="635">in the chosen interval.</text><text class="formula ink" x="1115" y="570">{0,1,2,...}</text><text class="small muted" x="1115" y="620">No fixed upper limit.</text>
<rect x="200" y="805" width="1100" height="58" rx="22" fill="#FBEFEF" stroke="#E5E5EA" stroke-width="3"/><text class="body ink" x="245" y="842">Exam doorway: fixed trials suggest Binomial; average rate in an interval suggests Poisson.</text>
</svg>
