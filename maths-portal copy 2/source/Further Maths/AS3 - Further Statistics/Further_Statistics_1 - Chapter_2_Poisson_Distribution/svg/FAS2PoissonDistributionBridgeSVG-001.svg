<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
<title id="title">A-Level Maths Bridge: Binomial to Poisson</title><desc id="desc">Bridge diagram comparing ordinary A-Level binomial fixed-trial thinking with Further Maths Poisson rate-over-interval thinking.</desc><metadata>Asset ID: FAS2PoissonDistributionBridgeSVG-001; Source: Ordinary A-Level Maths bridge plus Further Maths specification.</metadata>
<style>.bg{fill:#FAF9F6}.panel{fill:#FFFFF0;stroke:#E5E5EA;stroke-width:3}.pink{fill:#FBEFEF;stroke:#E5E5EA;stroke-width:3}.gold{fill:#D4AF37}.green{fill:#DDEBC8}.ink{fill:#2C2C2E}.muted{fill:#5B5B60}.arr{stroke:#C5A059;stroke-width:5;fill:none;marker-end:url(#arr)}.title{font:800 42px Arial}.sub{font:500 21px Arial}.head{font:800 28px Arial}.body{font:500 22px Arial}.small{font:500 18px Arial}.formula{font:italic 30px Georgia}.tick{font:800 24px Arial;fill:#2C2C2E}</style>
<defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#C5A059"/></marker></defs>
<rect class="bg" width="1500" height="900"/><text class="title ink" x="80" y="85">A-Level Maths Bridge: what changes?</text><text class="sub muted" x="80" y="125">Ordinary Maths gave you fixed trials. Further Maths gives you rate-based counts.</text>
<rect class="panel" x="90" y="190" width="560" height="580" rx="32"/><rect class="pink" x="130" y="235" width="480" height="70" rx="22"/><text class="head ink" x="160" y="280">Ordinary A-Level Maths</text><text class="formula ink" x="160" y="360">X ~ B(n,p)</text><text class="body ink" x="160" y="415">Fixed number of trials:</text><rect x="160" y="455" width="390" height="58" fill="#FFFFF0" stroke="#2C2C2E" stroke-width="3"/><g stroke="#2C2C2E" stroke-width="2"><path d="M199 455v58M238 455v58M277 455v58M316 455v58M355 455v58M394 455v58M433 455v58M472 455v58M511 455v58"/></g><rect class="green" x="160" y="455" width="39" height="58"/><rect class="green" x="277" y="455" width="39" height="58"/><rect class="green" x="394" y="455" width="39" height="58"/><text class="tick" x="170" y="493">✓</text><text class="tick" x="287" y="493">✓</text><text class="tick" x="404" y="493">✓</text><text class="body ink" x="160" y="565">Counts successes.</text><text class="body ink" x="160" y="605">Maximum possible value is n.</text><text class="small muted" x="160" y="660">Good for: repeated trials, fixed p,</text><text class="small muted" x="160" y="687">success/failure outcomes.</text>
<path class="arr" d="M680 480 C740 480 760 480 820 480"/><rect x="680" y="400" width="140" height="62" rx="18" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/><text class="small ink" x="704" y="425">Extend by</text><text class="small ink" x="704" y="449">using rates</text>
<rect class="panel" x="850" y="190" width="560" height="580" rx="32"/><rect class="pink" x="890" y="235" width="480" height="70" rx="22"/><text class="head ink" x="920" y="280">Further Maths</text><text class="formula ink" x="920" y="360">Y ~ Po(λ)</text><text class="body ink" x="920" y="415">Fixed interval with average rate:</text><line x1="920" y1="490" x2="1310" y2="490" stroke="#2C2C2E" stroke-width="4" stroke-linecap="round"/><circle class="gold" cx="950" cy="490" r="10"/><circle class="gold" cx="1025" cy="490" r="10"/><circle class="gold" cx="1075" cy="490" r="10"/><circle class="gold" cx="1165" cy="490" r="10"/><circle class="gold" cx="1260" cy="490" r="10"/><text class="body ink" x="920" y="565">Counts events.</text><text class="body ink" x="920" y="605">No fixed upper limit.</text><text class="small muted" x="920" y="660">Good for: arrivals, defects, hits,</text><text class="small muted" x="920" y="687">emissions, calls, particles.</text>
<rect x="220" y="810" width="1060" height="62" rx="24" fill="#FBEFEF" stroke="#E5E5EA" stroke-width="3"/><text class="body ink" x="265" y="849">Key exam question: what is being counted now, successes out of trials or events in an interval?</text>
</svg>
