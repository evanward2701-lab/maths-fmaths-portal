<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
<title id="title">Poisson Model Suitability Checklist</title><desc id="desc">Checklist for deciding whether a Poisson distribution is reasonable: count variable, fixed interval, average rate, singly, independently and constant rate.</desc><metadata>Asset ID: FAS2PoissonDistributionSVG-005; Source: AI-proposed teaching enhancement based on lesson evidence.</metadata>
<style>.bg{fill:#FAF9F6}.panel{fill:#FFFFF0;stroke:#E5E5EA;stroke-width:3}.gate{fill:#FBEFEF;stroke:#E5E5EA;stroke-width:3}.pass{fill:#DDEBC8;stroke:#E5E5EA;stroke-width:3}.warn{fill:#FFFCF2;stroke:#D4AF37;stroke-width:4}.gold{fill:#D4AF37}.ink{fill:#2C2C2E}.muted{fill:#5B5B60}.arr{stroke:#C5A059;stroke-width:5;fill:none;marker-end:url(#arr)}.title{font:800 42px Arial}.sub{font:500 21px Arial}.head{font:800 27px Arial}.body{font:500 22px Arial}.small{font:500 18px Arial}.formula{font:italic 30px Georgia}.num{font:900 34px Arial}</style>
<defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#C5A059"/></marker></defs>
<rect class="bg" width="1500" height="900"/><text class="title ink" x="80" y="85">Is Poisson suitable?</text><text class="sub muted" x="80" y="125">Pass through every gate before trusting the model.</text><rect class="panel" x="80" y="180" width="1340" height="620" rx="36"/>
<rect class="warn" x="130" y="235" width="340" height="470" rx="28"/><text class="head ink" x="170" y="290">First check</text><text class="body ink" x="170" y="350">Are we counting</text><text class="body ink" x="170" y="382">whole-number events?</text><text class="formula ink" x="170" y="450">X = 0,1,2,...</text><line x1="170" y1="495" x2="430" y2="495" stroke="#E5E5EA" stroke-width="3"/><text class="body ink" x="170" y="545">Is there a fixed</text><text class="body ink" x="170" y="577">time, length, area</text><text class="body ink" x="170" y="609">or volume interval?</text><text class="body ink" x="170" y="665">Is an average rate</text><text class="body ink" x="170" y="697">given or implied?</text><path class="arr" d="M495 470 C545 470 555 470 600 470"/>
<rect class="gate" x="620" y="235" width="240" height="470" rx="28"/><circle class="gold" cx="740" cy="315" r="44"/><text class="num ink" x="728" y="328">1</text><text class="head ink" x="665" y="390">Singly</text><text class="small ink" x="650" y="445">Events should not</text><text class="small ink" x="650" y="475">occur at exactly</text><text class="small ink" x="650" y="505">the same instant.</text><path class="arr" d="M880 470 C925 470 935 470 980 470"/>
<rect class="gate" x="1000" y="235" width="240" height="470" rx="28"/><circle class="gold" cx="1120" cy="315" r="44"/><text class="num ink" x="1108" y="328">2</text><text class="head ink" x="1040" y="390">Independent</text><text class="small ink" x="1030" y="445">One event should</text><text class="small ink" x="1030" y="475">not change the</text><text class="small ink" x="1030" y="505">chance of another.</text><path class="arr" d="M1245 470 C1260 470 1265 470 1275 470"/>
<rect class="pass" x="1280" y="330" width="110" height="280" rx="28"/><text class="num ink" x="1320" y="405">✓</text><text class="small ink" x="1305" y="465">Then</text><text class="formula ink" x="1300" y="515">X~Po(λ)</text><text class="small ink" x="1305" y="565">is reasonable.</text>
<rect class="gate" x="620" y="735" width="620" height="95" rx="28"/><circle class="gold" cx="675" cy="782" r="34"/><text class="num ink" x="664" y="794">3</text><text class="head ink" x="730" y="776">Constant rate</text><text class="small ink" x="730" y="806">The mean number of events is proportional to the interval size.</text><rect x="180" y="815" width="1140" height="54" rx="22" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/><text class="body ink" x="220" y="850">A rate alone is not enough: scheduled or dependent events can break the Poisson model.</text>
</svg>
