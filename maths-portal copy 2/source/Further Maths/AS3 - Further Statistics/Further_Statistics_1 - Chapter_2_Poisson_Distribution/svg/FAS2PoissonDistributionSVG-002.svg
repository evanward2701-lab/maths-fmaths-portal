<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">From Binomial Time Slices to Poisson Distribution</title>
<desc id="desc">Three-stage visual showing 10 intervals, 20 intervals, and infinitely many tiny slivers leading to the Poisson model.</desc>
<metadata>Asset ID: FAS2PoissonDistributionSVG-002; Source: FS1-Chp2-PoissonDistribution.pdf and transcript time-slicing explanation.</metadata>
<style>.bg{fill:#FAF9F6}.panel{fill:#FFFFF0;stroke:#E5E5EA;stroke-width:3}.pink{fill:#FBEFEF;stroke:#E5E5EA;stroke-width:2}.green{fill:#DDEBC8}.ink{fill:#2C2C2E}.muted{fill:#5B5B60}.gold{stroke:#C5A059;stroke-width:5;fill:none;marker-end:url(#arr)}.title{font:800 42px Arial}.sub{font:500 22px Arial}.head{font:800 26px Arial}.body{font:500 20px Arial}.small{font:500 17px Arial}.formula{font:italic 27px Georgia}.tick{font:800 30px Arial;fill:#2C2C2E}</style>
<defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#C5A059"/></marker></defs>
<rect class="bg" width="1600" height="1000"/><text class="title ink" x="70" y="80">From binomial slices to the Poisson model</text><text class="sub muted" x="70" y="120">Example: on average 5 cars pass in one hour. What is P(8 cars in the hour)?</text><line x1="70" y1="155" x2="1530" y2="155" stroke="#C5A059" stroke-width="4"/>
<g transform="translate(70,210)"><rect class="panel" width="430" height="650" rx="28"/><text class="head ink" x="35" y="55">1. Ten time slots</text><text class="body muted" x="35" y="95">Hour split into 10 intervals</text><text class="small ink" x="35" y="175">2pm</text><text class="small ink" x="345" y="175">3pm</text><rect x="35" y="195" width="320" height="60" fill="#FFFFF0" stroke="#2C2C2E" stroke-width="3"/><g stroke="#2C2C2E" stroke-width="2"><line x1="67" y1="195" x2="67" y2="255"/><line x1="99" y1="195" x2="99" y2="255"/><line x1="131" y1="195" x2="131" y2="255"/><line x1="163" y1="195" x2="163" y2="255"/><line x1="195" y1="195" x2="195" y2="255"/><line x1="227" y1="195" x2="227" y2="255"/><line x1="259" y1="195" x2="259" y2="255"/><line x1="291" y1="195" x2="291" y2="255"/><line x1="323" y1="195" x2="323" y2="255"/></g><text class="tick" x="42" y="235">✓</text><text class="tick" x="138" y="235">✓</text><text class="tick" x="234" y="235">✓</text><text class="formula ink" x="35" y="335">p = 5 / 10 = λ / n = 0.5</text><text class="formula ink" x="35" y="390">X ~ B(10, 0.5)</text><text class="formula ink" x="35" y="445">P(X=8)=0.0439</text><rect class="pink" x="35" y="520" width="330" height="70" rx="18"/><text class="small ink" x="58" y="550">Problem: more than one car</text><text class="small ink" x="58" y="575">could pass in one slot.</text></g>
<path class="gold" d="M525 535 C580 535 590 535 640 535"/>
<g transform="translate(665,210)"><rect class="panel" width="430" height="650" rx="28"/><text class="head ink" x="35" y="55">2. Twenty time slots</text><text class="body muted" x="35" y="95">Shorter intervals reduce the flaw</text><rect x="35" y="195" width="320" height="60" fill="#FFFFF0" stroke="#2C2C2E" stroke-width="3"/><g stroke="#2C2C2E" stroke-width="1.5"><path d="M51 195v60M67 195v60M83 195v60M99 195v60M115 195v60M131 195v60M147 195v60M163 195v60M179 195v60M195 195v60M211 195v60M227 195v60M243 195v60M259 195v60M275 195v60M291 195v60M307 195v60M323 195v60M339 195v60"/></g><text class="tick" x="40" y="235">✓</text><text class="tick" x="120" y="235">✓</text><text class="tick" x="232" y="235">✓</text><text class="formula ink" x="35" y="335">p = 5 / 20 = λ / n = 0.25</text><text class="formula ink" x="35" y="390">X ~ B(20, 0.25)</text><text class="formula ink" x="35" y="445">P(X=8)=0.0609</text><rect class="pink" x="35" y="520" width="330" height="70" rx="18"/><text class="small ink" x="58" y="550">Better, but still only an</text><text class="small ink" x="58" y="575">approximation.</text></g>
<path class="gold" d="M1120 535 C1175 535 1185 535 1235 535"/>
<g transform="translate(1260,210)"><rect class="panel" width="270" height="650" rx="28"/><text class="head ink" x="30" y="55">3. Tiny slivers</text><text class="small muted" x="30" y="95">Let n become very large.</text><rect x="30" y="150" width="205" height="60" fill="#FFFFF0" stroke="#2C2C2E" stroke-width="3"/><g stroke="#2C2C2E" stroke-width="1"><path d="M40 150v60M50 150v60M60 150v60M70 150v60M80 150v60M90 150v60M100 150v60M110 150v60M120 150v60M130 150v60M140 150v60M150 150v60M160 150v60M170 150v60M180 150v60M190 150v60M200 150v60M210 150v60M220 150v60"/></g><text class="formula ink" x="30" y="285">p = λ / n</text><text class="formula ink" x="30" y="335">n → ∞</text><text class="small ink" x="30" y="380">Only one event can occur</text><text class="small ink" x="30" y="405">in a tiny enough sliver.</text><rect class="pink" x="30" y="470" width="205" height="135" rx="18"/><text class="formula ink" x="50" y="515">X ~ Po(λ)</text><text class="formula ink" x="50" y="565">P(X=x)</text><text class="formula ink" x="50" y="600">= e^(-λ)λ^x / x!</text></g>
<rect class="panel" x="210" y="895" width="1180" height="60" rx="22"/><text class="body ink" x="250" y="934">The Poisson model appears when a count process is modelled over infinitely small intervals.</text>
</svg>
