<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
<title id="title">Lambda Rate Scaling Machine</title><desc id="desc">Teaching visual showing how to scale the Poisson parameter lambda when the interval changes.</desc><metadata>Asset ID: FAS2PoissonDistributionSVG-004; Source: AI-proposed teaching enhancement based on lesson evidence.</metadata>
<style>.bg{fill:#FAF9F6}.panel{fill:#FFFFF0;stroke:#E5E5EA;stroke-width:3}.input{fill:#FBEFEF;stroke:#E5E5EA;stroke-width:3}.out{fill:#FFFCF2;stroke:#D4AF37;stroke-width:4}.ink{fill:#2C2C2E}.muted{fill:#5B5B60}.arr{stroke:#C5A059;stroke-width:5;fill:none;marker-end:url(#arr)}.title{font:800 42px Arial}.sub{font:500 21px Arial}.head{font:800 27px Arial}.body{font:500 22px Arial}.small{font:500 18px Arial}.formula{font:italic 34px Georgia}.formulas{font:italic 27px Georgia}</style>
<defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#C5A059"/></marker></defs>
<rect class="bg" width="1500" height="900"/><text class="title ink" x="80" y="85">The λ scaling machine</text><text class="sub muted" x="80" y="125">In Poisson questions, lambda must match the interval you are actually asked about.</text>
<rect class="panel" x="130" y="210" width="1240" height="470" rx="36"/><rect class="input" x="180" y="285" width="300" height="220" rx="28"/><text class="head ink" x="220" y="335">Original rate</text><text class="formula ink" x="220" y="400">λ_old</text><text class="body ink" x="220" y="455">events per</text><text class="body ink" x="220" y="485">original interval</text><path class="arr" d="M500 395 C545 395 555 395 600 395"/><rect class="input" x="620" y="285" width="300" height="220" rx="28"/><text class="head ink" x="660" y="335">Interval multiplier</text><text class="formula ink" x="660" y="400">k</text><text class="body ink" x="660" y="455">new interval</text><text class="body ink" x="660" y="485">÷ old interval</text><path class="arr" d="M940 395 C985 395 995 395 1040 395"/><rect class="out" x="1060" y="285" width="260" height="220" rx="28"/><text class="head ink" x="1100" y="335">New parameter</text><text class="formula ink" x="1100" y="400">λ_new</text><text class="body ink" x="1100" y="455">events in the</text><text class="body ink" x="1100" y="485">question interval</text><rect x="250" y="560" width="1000" height="80" rx="26" fill="#FBEFEF" stroke="#E5E5EA" stroke-width="3"/><text class="formula ink" x="430" y="612">λ_new = λ_old × k</text>
<text class="head ink" x="140" y="735">Examples</text><rect x="140" y="770" width="360" height="80" rx="20" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/><text class="small ink" x="164" y="802">5 per hour, 2 hours</text><text class="formulas ink" x="164" y="833">λ = 5 × 2 = 10</text><rect x="570" y="770" width="360" height="80" rx="20" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/><text class="small ink" x="594" y="802">12 per hour, 15 minutes</text><text class="formulas ink" x="594" y="833">λ = 12 × 1/4 = 3</text><rect x="1000" y="770" width="360" height="80" rx="20" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/><text class="small ink" x="1024" y="802">0.8 per metre, 5 metres</text><text class="formulas ink" x="1024" y="833">λ = 0.8 × 5 = 4</text>
</svg>
