<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FAS2PoissonDistributionWidget-001 | Poisson Probability Calculator</title>
<!-- Asset ID: FAS2PoissonDistributionWidget-001; Purpose: Poisson probability calculator with inequality conversion and formula substitution. -->
<style>
:root{--canvas:#FAF9F6;--panel:#FFFFF0;--line:#E5E5EA;--gold:#D4AF37;--deep:#C5A059;--pink:#FBEFEF;--ink:#2C2C2E;--muted:#5B5B60;--green:#DDEBC8;--bad:#F8D7DA}*{box-sizing:border-box}body{margin:0;padding:32px;background:var(--canvas);color:var(--ink);font-family:Inter,Arial,sans-serif;line-height:1.5}.widget{max-width:1080px;margin:0 auto;background:var(--panel);border:2px solid var(--line);border-radius:30px;padding:30px;box-shadow:0 18px 45px rgba(44,44,46,.08)}h1{margin:0 0 8px;font-size:clamp(1.8rem,3vw,2.6rem)}.subtitle{color:var(--muted);margin:0 0 24px}.grid{display:grid;grid-template-columns:1fr 1.25fr;gap:24px}@media(max-width:850px){.grid{grid-template-columns:1fr}}.card,.result{background:rgba(255,255,255,.42);border:2px solid var(--line);border-radius:22px;padding:20px}label{display:block;font-weight:750;margin:14px 0 6px}input,select{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;background:white;color:var(--ink)}button{width:100%;margin-top:18px;border:0;border-radius:16px;padding:14px 18px;font-weight:850;font-size:1rem;color:var(--ink);background:linear-gradient(135deg,var(--gold),#F7E7A2);cursor:pointer}.math-line{font-family:Georgia,serif;font-size:1.25rem;margin:10px 0}.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 10px;margin:4px 6px 4px 0;background:white;font-weight:750}.good{background:var(--green)}.warning{background:#FFF4D6;border:2px solid var(--line);border-radius:16px;padding:14px;margin-top:16px}.error{background:var(--bad);border:2px solid var(--line);border-radius:16px;padding:14px;margin-top:16px;font-weight:700}.mini-table{width:100%;border-collapse:collapse;margin-top:14px}.mini-table th,.mini-table td{border-bottom:1px solid var(--line);text-align:left;padding:8px}
</style>
</head>
<body>
<main class="widget"><h1>Poisson probability calculator</h1><p class="subtitle">Enter λ, choose the probability type, and see the method before the decimal answer.</p><section class="grid"><div class="card"><label for="lambda">Mean rate λ</label><input id="lambda" type="number" min="0.0001" step="0.1" value="5"/><label for="xvalue">Integer value x</label><input id="xvalue" type="number" min="0" step="1" value="8"/><label for="mode">Probability required</label><select id="mode"><option value="eq">P(X = x)</option><option value="le">P(X ≤ x)</option><option value="lt">P(X &lt; x)</option><option value="ge">P(X ≥ x)</option><option value="gt">P(X &gt; x)</option></select><button type="button" id="calculate">Calculate probability</button><div class="warning"><strong>Discrete warning:</strong> P(X&lt;5) means P(X≤4), not P(X≤5).</div></div><div class="result" id="output" aria-live="polite">Results will appear here.</div></section></main>
<script>
const lambdaInput=document.getElementById('lambda'),xInput=document.getElementById('xvalue'),modeInput=document.getElementById('mode'),output=document.getElementById('output');
function factorial(n){let v=1;for(let i=2;i<=n;i++)v*=i;return v}function pmf(l,x){return x<0?0:Math.exp(-l)*Math.pow(l,x)/factorial(x)}function cdf(l,k){let t=0;for(let i=0;i<=k;i++)t+=pmf(l,i);return t}function f(v){return v.toFixed(6).replace(/0+$/,'').replace(/\.$/,'')}function f4(v){return v.toFixed(4)}
function calculate(){const l=Number(lambdaInput.value),x=Number(xInput.value),m=modeInput.value;if(!Number.isFinite(l)||l<=0){output.innerHTML='<div class="error">λ must be positive.</div>';return}if(!Number.isInteger(x)||x<0){output.innerHTML='<div class="error">x must be a non-negative integer.</div>';return}let p,st,conv='',method='';if(m==='eq'){p=pmf(l,x);st=`P(X = ${x})`;method=`<div class="math-line">P(X=${x}) = e<sup>-${f(l)}</sup> × ${f(l)}<sup>${x}</sup> / ${x}!</div><div class="math-line">${x}! = ${factorial(x)}</div>`}if(m==='le'){p=cdf(l,x);st=`P(X ≤ ${x})`;conv=`<span class="tag good">CDF up to ${x}</span>`;method=`<div class="math-line">P(X≤${x}) = P(X=0)+...+P(X=${x})</div>`}if(m==='lt'){p=cdf(l,x-1);st=`P(X < ${x})`;conv=`<span class="tag good">Convert: X&lt;${x} means X≤${x-1}</span>`;method=`<div class="math-line">P(X&lt;${x}) = P(X≤${x-1})</div>`}if(m==='ge'){p=1-cdf(l,x-1);st=`P(X ≥ ${x})`;conv=`<span class="tag good">Complement: 1 - P(X≤${x-1})</span>`;method=`<div class="math-line">P(X≥${x}) = 1 - P(X≤${x-1})</div>`}if(m==='gt'){p=1-cdf(l,x);st=`P(X > ${x})`;conv=`<span class="tag good">Convert: X&gt;${x} means X≥${x+1}</span>`;method=`<div class="math-line">P(X&gt;${x}) = 1 - P(X≤${x})</div>`}let rows='';for(let i=0;i<=Math.min(Math.max(x+2,6),14);i++){rows+=`<tr><td>${i}</td><td>${f4(pmf(l,i))}</td><td>${f4(cdf(l,i))}</td></tr>`}output.innerHTML=`<span class="tag">X ~ Po(${f(l)})</span>${conv}<h2>${st}</h2><div class="math-line">P(X=x)=e<sup>-λ</sup>λ<sup>x</sup>/x!</div>${method}<div class="math-line"><strong>${st} = ${f(p)}</strong></div><div class="math-line"><strong>To 4 d.p.: ${f4(p)}</strong></div><table class="mini-table"><thead><tr><th>x</th><th>P(X=x)</th><th>P(X≤x)</th></tr></thead><tbody>${rows}</tbody></table>`}
document.getElementById('calculate').addEventListener('click',calculate);calculate();
</script>
</body>
</html>
