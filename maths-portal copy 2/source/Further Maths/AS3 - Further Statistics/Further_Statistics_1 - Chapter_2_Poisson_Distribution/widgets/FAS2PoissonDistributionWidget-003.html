<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>FAS2PoissonDistributionWidget-003 | Poisson Suitability Checklist</title><!-- Asset ID: FAS2PoissonDistributionWidget-003; Purpose: Poisson model suitability checklist. -->
<style>:root{--canvas:#FAF9F6;--panel:#FFFFF0;--line:#E5E5EA;--gold:#D4AF37;--pink:#FBEFEF;--ink:#2C2C2E;--muted:#5B5B60;--green:#DDEBC8;--warn:#FFF4D6;--bad:#F8D7DA}*{box-sizing:border-box}body{margin:0;padding:32px;background:var(--canvas);color:var(--ink);font-family:Inter,Arial,sans-serif;line-height:1.5}.widget{max-width:1120px;margin:0 auto;background:var(--panel);border:2px solid var(--line);border-radius:30px;padding:30px;box-shadow:0 18px 45px rgba(44,44,46,.08)}h1{margin:0 0 8px}.subtitle{color:var(--muted)}.layout{display:grid;grid-template-columns:1.15fr 1fr;gap:24px}@media(max-width:900px){.layout{grid-template-columns:1fr}}.card,.result{background:rgba(255,255,255,.42);border:2px solid var(--line);border-radius:22px;padding:20px}.question{border-bottom:1px solid var(--line);padding:14px 0}.question p{margin:0 0 10px;font-weight:750}.choices{display:flex;gap:10px;flex-wrap:wrap}.choices label{border:2px solid var(--line);background:white;padding:8px 12px;border-radius:999px;cursor:pointer;font-weight:700}button{width:100%;margin-top:18px;border:0;border-radius:16px;padding:14px 18px;font-weight:850;background:linear-gradient(135deg,var(--gold),#F7E7A2);cursor:pointer}.verdict{border-radius:20px;padding:18px;border:2px solid var(--line);margin-bottom:16px}.likely{background:var(--green)}.questionable{background:var(--warn)}.unlikely{background:var(--bad)}.pill{display:inline-block;border:1px solid var(--line);background:white;border-radius:999px;padding:5px 10px;margin:4px 6px 4px 0;font-size:.9rem;font-weight:750}.scenario-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}@media(max-width:900px){.scenario-row{grid-template-columns:1fr}}.scenario{border:2px solid var(--line);background:white;border-radius:18px;padding:14px;cursor:pointer;text-align:left}.small{color:var(--muted);font-size:.92rem}.math{font-family:Georgia,serif;font-size:1.2rem}</style></head>
<body><main class="widget"><h1>Poisson model suitability checklist</h1><p class="subtitle">A rate is not enough. Check the count, the interval, and the three modelling gates: singly, independently, constant rate.</p><section class="layout"><div class="card" id="questions"></div><div class="result" id="result" aria-live="polite"></div></section><section class="scenario-row"><button class="scenario" data-scenario="calls"><strong>Call centre calls</strong><br/><span class="small">Random calls at a steady average rate</span></button><button class="scenario" data-scenario="buses"><strong>Scheduled buses</strong><br/><span class="small">Average 10 per hour, but timetable-driven</span></button><button class="scenario" data-scenario="volcano"><strong>Volcano eruptions</strong><br/><span class="small">One eruption changes future likelihood</span></button></section></main>
<script>
const qs=[['q1','Are we counting whole-number events?','whole-number event count','Poisson models counts such as 0, 1, 2, 3, ... .'],['q2','Is there a fixed interval of time, length, area, volume or space?','fixed interval','The interval must be clear.'],['q3','Is an average rate or mean number of events given?','average rate or mean','The parameter λ is the mean number of events in the chosen interval.'],['q4','Do events occur singly?','events occur singly','Events should occur one at a time.'],['q5','Are events independent?','events are independent','One event should not change the chance of another.'],['q6','Is the average rate constant across the interval?','constant rate','The mean count should be proportional to interval size.']];
const container=document.getElementById('questions');container.innerHTML=qs.map(([id,q])=>`<div class="question"><p>${q}</p><div class="choices"><label><input type="radio" name="${id}" value="yes" checked/>Yes</label><label><input type="radio" name="${id}" value="no"/>No</label><label><input type="radio" name="${id}" value="uncertain"/>Uncertain</label></div></div>`).join('')+'<button type="button" id="check">Check suitability</button>';
function val(n){return document.querySelector(`input[name="${n}"]:checked`).value}function setVal(n,v){document.querySelector(`input[name="${n}"][value="${v}"]`).checked=true}
function check(){const answers=qs.map(([id,,label,detail])=>({id,label,detail,value:val(id)})),nos=answers.filter(a=>a.value==='no'),uns=answers.filter(a=>a.value==='uncertain');let cls='likely',title='Poisson likely',txt='All gates are satisfied. A Poisson model is reasonable once λ has been matched to the interval.';if(nos.length){cls='unlikely';title='Poisson not suitable, or not without changing the model';txt='At least one essential condition has failed. Do not use Poisson just because a rate appears.'}else if(uns.length){cls='questionable';title='Poisson questionable';txt='No condition has definitely failed, but at least one is uncertain. State the assumption clearly if the model is still used.'}document.getElementById('result').innerHTML=`<div class="verdict ${cls}"><h2>${title}</h2><p>${txt}</p><p class="math">If suitable: X ~ Po(λ)</p></div>${answers.map(a=>`<span class="pill">${a.label}: ${a.value}</span>`).join('')}<ul>${answers.map(a=>`<li><strong>${a.label}:</strong> ${a.detail}</li>`).join('')}</ul>`}
document.getElementById('check').addEventListener('click',check);document.querySelectorAll('.scenario').forEach(b=>b.addEventListener('click',()=>{const s=b.dataset.scenario;if(s==='calls'){['q1','q2','q3','q4','q5','q6'].forEach(q=>setVal(q,'yes'))}if(s==='buses'){setVal('q1','yes');setVal('q2','yes');setVal('q3','yes');setVal('q4','yes');setVal('q5','uncertain');setVal('q6','no')}if(s==='volcano'){setVal('q1','yes');setVal('q2','yes');setVal('q3','yes');setVal('q4','yes');setVal('q5','no');setVal('q6','uncertain')}check()}));check();
</script>
</body></html>
