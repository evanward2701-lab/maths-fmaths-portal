<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>FAS2PoissonDistributionWidget-002 | Rate Scaling Trainer</title><!-- Asset ID: FAS2PoissonDistributionWidget-002; Purpose: rate-scaling trainer. -->
<style>:root{--canvas:#FAF9F6;--panel:#FFFFF0;--line:#E5E5EA;--gold:#D4AF37;--pink:#FBEFEF;--ink:#2C2C2E;--muted:#5B5B60;--green:#DDEBC8;--bad:#F8D7DA}*{box-sizing:border-box}body{margin:0;padding:32px;background:var(--canvas);color:var(--ink);font-family:Inter,Arial,sans-serif;line-height:1.5}.widget{max-width:1120px;margin:0 auto;background:var(--panel);border:2px solid var(--line);border-radius:30px;padding:30px;box-shadow:0 18px 45px rgba(44,44,46,.08)}h1{margin:0 0 8px}.subtitle{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1.15fr;gap:24px}@media(max-width:850px){.grid{grid-template-columns:1fr}}.card,.output{background:rgba(255,255,255,.42);border:2px solid var(--line);border-radius:22px;padding:20px}label{display:block;font-weight:750;margin:14px 0 6px}input,select{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;background:white}button{width:100%;margin-top:18px;border:0;border-radius:16px;padding:14px 18px;font-weight:850;background:linear-gradient(135deg,var(--gold),#F7E7A2);cursor:pointer}.math-line{font-family:Georgia,serif;font-size:1.25rem;margin:10px 0}.step{border-left:6px solid var(--gold);padding:10px 12px;margin:12px 0;background:white;border-radius:14px}.answer{background:var(--green);border:2px solid var(--line);border-radius:18px;padding:16px;margin-top:14px;font-weight:800}.error{background:var(--bad);border:2px solid var(--line);border-radius:16px;padding:14px;margin-top:16px;font-weight:700}.examples{margin-top:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:850px){.examples{grid-template-columns:1fr}}.example{border:2px solid var(--line);background:white;border-radius:18px;padding:14px;cursor:pointer}.small{font-size:.92rem;color:var(--muted)}</style></head>
<body><main class="widget"><h1>Poisson rate-scaling trainer</h1><p class="subtitle">The parameter λ must match the exact interval in the question.</p><section class="grid"><div class="card"><label>Event context</label><input id="context" value="support tickets"/><label>Original average rate</label><input id="rate" type="number" min="0.0001" step="0.1" value="3.5"/><label>Original interval size</label><input id="oldAmount" type="number" min="0.0001" step="0.1" value="1"/><label>Original interval unit</label><select id="oldUnit"><option value="minute">minute(s)</option><option value="hour" selected>hour(s)</option><option value="day">day(s)</option><option value="week">week(s)</option><option value="cm">centimetre(s)</option><option value="m">metre(s)</option></select><label>Question interval size</label><input id="newAmount" type="number" min="0.0001" step="0.1" value="2"/><label>Question interval unit</label><select id="newUnit"><option value="minute">minute(s)</option><option value="hour" selected>hour(s)</option><option value="day">day(s)</option><option value="week">week(s)</option><option value="cm">centimetre(s)</option><option value="m">metre(s)</option></select><button id="scale" type="button">Scale λ</button></div><div class="output" id="output"></div></section><section class="examples"><button class="example" data-example="calls"><strong>Calls</strong><br/><span class="small">12 per hour, find 15 minutes</span></button><button class="example" data-example="wire"><strong>Wire flaws</strong><br/><span class="small">0.8 per metre, find 5 metres</span></button><button class="example" data-example="radios"><strong>Radios</strong><br/><span class="small">2.5 per week, find 4 weeks</span></button></section></main>
<script>const units={minute:{family:'time',factor:1},hour:{family:'time',factor:60},day:{family:'time',factor:1440},week:{family:'time',factor:10080},cm:{family:'length',factor:1},m:{family:'length',factor:100}};function g(id){return document.getElementById(id)}function fmt(v){return Number(v.toFixed(8)).toString()}function scale(){const context=g('context').value||'events',rate=Number(g('rate').value),oa=Number(g('oldAmount').value),na=Number(g('newAmount').value),ou=g('oldUnit').value,nu=g('newUnit').value;if(![rate,oa,na].every(Number.isFinite)||rate<=0||oa<=0||na<=0){g('output').innerHTML='<div class="error">All numerical values must be positive.</div>';return}if(units[ou].family!==units[nu].family){g('output').innerHTML='<div class="error">The original and question intervals use incompatible units.</div>';return}const oldBase=oa*units[ou].factor,newBase=na*units[nu].factor,k=newBase/oldBase,lambda=rate*k;g('output').innerHTML=`<h2>Scaled Poisson parameter</h2><div class="step"><strong>1. Original rate</strong><div class="math-line">λ_old = ${fmt(rate)}</div></div><div class="step"><strong>2. Interval multiplier</strong><div class="math-line">k = ${fmt(newBase)} ÷ ${fmt(oldBase)} = ${fmt(k)}</div></div><div class="step"><strong>3. New parameter</strong><div class="math-line">λ_new = ${fmt(rate)} × ${fmt(k)} = ${fmt(lambda)}</div></div><div class="answer">Distribution: X ~ Po(${fmt(lambda)})</div><p>Let X be the number of ${context} in the question interval. Then X has mean ${fmt(lambda)}.</p>`}document.getElementById('scale').addEventListener('click',scale);document.querySelectorAll('.example').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.example==='calls'){g('context').value='calls';g('rate').value=12;g('oldAmount').value=1;g('oldUnit').value='hour';g('newAmount').value=15;g('newUnit').value='minute'}if(b.dataset.example==='wire'){g('context').value='flaws';g('rate').value=.8;g('oldAmount').value=1;g('oldUnit').value='m';g('newAmount').value=5;g('newUnit').value='m'}if(b.dataset.example==='radios'){g('context').value='radios sold';g('rate').value=2.5;g('oldAmount').value=1;g('oldUnit').value='week';g('newAmount').value=4;g('newUnit').value='week'}scale()}));scale();</script>
</body></html>
