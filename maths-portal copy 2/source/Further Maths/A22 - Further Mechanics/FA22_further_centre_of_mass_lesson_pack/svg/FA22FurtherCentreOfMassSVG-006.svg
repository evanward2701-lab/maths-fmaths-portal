<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sliding and toppling comparison</title>
  <desc id="desc">Three panels compare stable, limiting toppling and limiting sliding.</desc>
  <!-- Asset ID: FA22FurtherCentreOfMassSVG-006 -->
  <!-- Source: CCEA FA22-FCOM-LO004 + transcript -->
  <!-- Related lesson section: #9 Visual Asset Integration; #8.15; #8.16 -->
  <!-- Purpose: Compare sliding and toppling thresholds. -->
  <defs>
    <style>
      .bg{fill:#FAF9F6} .panel{fill:#FFFFF0;stroke:#E5E5EA;stroke-width:2} .soft{fill:#FBEFEF;stroke:#2C2C2E;stroke-width:3}
      .gold{stroke:#C5A059;stroke-width:4;fill:none} .line{stroke:#2C2C2E;stroke-width:3;fill:none} .dash{stroke:#2C2C2E;stroke-width:2;stroke-dasharray:8 8;fill:none}
      .txt{font-family:Inter,Arial,sans-serif;fill:#2C2C2E;font-size:30px} .small{font-family:Inter,Arial,sans-serif;fill:#2C2C2E;font-size:22px} .math{font-family:Georgia,'Times New Roman',serif;fill:#2C2C2E;font-size:26px}
      .box{fill:#FFFFF0;stroke:#E5E5EA;stroke-width:2;rx:18} .warn{fill:#FBEFEF;stroke:#C5A059;stroke-width:2;rx:18}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#2C2C2E"/></marker>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <rect class="panel" x="40" y="36" width="1120" height="688" rx="28"/>
  <text class="txt" x="80" y="90">Sliding and toppling</text>
  
  <rect class="box" x="80" y="150" width="310" height="380"/><text class="small" x="110" y="200">A. Stable</text><line class="line" x1="125" y1="430" x2="350" y2="430"/><rect class="soft" x="200" y="250" width="90" height="180"/><circle cx="245" cy="340" r="8" fill="#C5A059"/><line class="dash" x1="245" y1="340" x2="245" y2="460"/><text class="small" x="130" y="500">Weight line inside base.</text>
  <rect class="box" x="445" y="150" width="310" height="380"/><text class="small" x="475" y="200">B. Limiting toppling</text><line class="line" x1="490" y1="430" x2="715" y2="430"/><rect class="soft" x="565" y="250" width="90" height="180"/><circle cx="610" cy="340" r="8" fill="#C5A059"/><line class="dash" x1="610" y1="340" x2="565" y2="430"/><text class="small" x="475" y="500">Weight line through edge.</text>
  <rect class="box" x="810" y="150" width="310" height="380"/><text class="small" x="840" y="200">C. Limiting sliding</text><line class="line" x1="855" y1="430" x2="1080" y2="430"/><rect class="soft" x="930" y="250" width="90" height="180"/><line class="line" x1="965" y1="430" x2="965" y2="350" marker-end="url(#arrow)"/><text class="math" x="980" y="390">R</text><line class="line" x1="940" y1="440" x2="870" y2="440" marker-end="url(#arrow)"/><text class="math" x="885" y="420">F</text><text class="small" x="840" y="500">F = μR only at limiting sliding.</text>
  <rect class="warn" x="210" y="610" width="780" height="80"/><text class="math" x="270" y="660">Sliding: F ≤ μR; Toppling: weight line through edge.</text>

</svg>
