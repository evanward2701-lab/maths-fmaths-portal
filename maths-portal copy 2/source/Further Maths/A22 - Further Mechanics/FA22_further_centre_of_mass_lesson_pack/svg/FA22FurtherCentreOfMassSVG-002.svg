<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Lamina between two curves</title>
  <desc id="desc">Uniform lamina between upper curve y1 and lower curve y2. The strip height is y1-y2 and the vertical centre is half of y1+y2.</desc>
  <!-- Asset ID: FA22FurtherCentreOfMassSVG-002 -->
  <!-- Source: Teacher transcript between-curves example -->
  <!-- Related lesson section: #9 Visual Asset Integration; #8.3 Core Theory -->
  <!-- Purpose: Teach why mass strip is y1-y2 and vertical centre is half(y1+y2). -->
  <defs>
    <style>
      .bg{fill:#FAF9F6} .panel{fill:#FFFFF0;stroke:#E5E5EA;stroke-width:2} .soft{fill:#FBEFEF;stroke:#2C2C2E;stroke-width:3}
      .gold{stroke:#C5A059;stroke-width:4;fill:none} .line{stroke:#2C2C2E;stroke-width:3;fill:none} .dash{stroke:#2C2C2E;stroke-width:2;stroke-dasharray:8 8;fill:none}
      .txt{font-family:Inter,Arial,sans-serif;fill:#2C2C2E;font-size:30px} .small{font-family:Inter,Arial,sans-serif;fill:#2C2C2E;font-size:22px} .math{font-family:Georgia,'Times New Roman',serif;fill:#2C2C2E;font-size:26px}
      .box{fill:#FFFFF0;stroke:#E5E5EA;stroke-width:2;rx:18} .warn{fill:#FBEFEF;stroke:#C5A059;stroke-width:2;rx:18}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#2C2C2E"/></marker>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <rect class="panel" x="40" y="36" width="1120" height="688" rx="28"/>
  <text class="txt" x="80" y="90">Lamina between two curves</text>
  
  <line class="line" x1="120" y1="610" x2="770" y2="610" marker-end="url(#arrow)"/><line class="line" x1="120" y1="610" x2="120" y2="150" marker-end="url(#arrow)"/>
  <path d="M180 560 C300 330 550 210 730 380 C620 470 390 500 180 560 Z" fill="#FBEFEF" opacity="0.8"/>
  <path class="gold" d="M180 560 C300 330 550 210 730 380"/><path class="line" d="M180 560 C390 500 620 470 730 380" opacity="0.7"/>
  <rect x="430" y="305" width="50" height="175" fill="#D4AF37" opacity="0.38" stroke="#C5A059" stroke-width="3"/>
  <text class="small" x="575" y="235">upper curve y₁</text><text class="small" x="585" y="505">lower curve y₂</text>
  <circle cx="455" cy="392" r="8" fill="#2C2C2E"/><text class="math" x="505" y="400">vertical centre = 1/2(y₁ + y₂)</text>
  <rect class="box" x="805" y="170" width="330" height="365"/><text class="math" x="830" y="230">M = ∫(y₁-y₂) dx</text><text class="math" x="830" y="290">M x̄ = ∫x(y₁-y₂) dx</text><text class="math" x="830" y="350">M ȳ = 1/2∫(y₁+y₂)(y₁-y₂) dx</text><text class="small" x="830" y="430">Not 1/2(y₁-y₂)</text>

</svg>
