<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Moment of force versus moment of mass</title>
  <desc id="desc">Bridge from ordinary moments of force to Further Mechanics moments of mass.</desc>
  <!-- Asset ID: FA22FurtherCentreOfMassBridgeSVG-001 -->
  <!-- Source: Ordinary A-Level Maths bridge + Further Maths specification -->
  <!-- Related lesson section: #5 Bridge; #9 Visual Asset Integration -->
  <!-- Purpose: Compare ordinary Maths method with Further Maths extension. -->
  <defs>
    <style>
      .bg{fill:#FAF9F6} .panel{fill:#FFFFF0;stroke:#E5E5EA;stroke-width:2} .soft{fill:#FBEFEF;stroke:#2C2C2E;stroke-width:3}
      .gold{stroke:#C5A059;stroke-width:4;fill:none} .line{stroke:#2C2C2E;stroke-width:3;fill:none} .dash{stroke:#2C2C2E;stroke-width:2;stroke-dasharray:8 8;fill:none}
      .txt{font-family:Inter,Arial,sans-serif;fill:#2C2C2E;font-size:30px} .small{font-family:Inter,Arial,sans-serif;fill:#2C2C2E;font-size:22px} .math{font-family:Georgia,'Times New Roman',serif;fill:#2C2C2E;font-size:26px}
      .box{fill:#FFFFF0;stroke:#E5E5EA;stroke-width:2;rx:18} .warn{fill:#FBEFEF;stroke:#C5A059;stroke-width:2;rx:18}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#2C2C2E"/></marker>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <rect class="panel" x="40" y="36" width="1120" height="688" rx="28"/>
  <text class="txt" x="80" y="90">Bridge: moment of force → moment of mass</text>
  
  <rect class="box" x="90" y="180" width="470" height="310"/><text class="small" x="130" y="230">Ordinary A-Level Mechanics</text><text class="math" x="130" y="295">moment of force = F × d</text><line class="line" x1="150" y1="390" x2="500" y2="390"/><line class="line" x1="420" y1="320" x2="420" y2="390" marker-end="url(#arrow)"/><text class="math" x="440" y="350">F=mg</text><text class="math" x="210" y="455">moment = mgd</text>
  <rect class="box" x="640" y="180" width="470" height="310"/><text class="small" x="680" y="230">Further Centre of Mass</text><text class="math" x="680" y="295">moment of mass = m × d</text><line class="line" x1="700" y1="390" x2="1050" y2="390"/><rect x="935" y="330" width="55" height="55" rx="10" fill="#C5A059" stroke="#2C2C2E"/><text class="math" x="955" y="365">m</text><text class="math" x="760" y="455">mass moment = md</text>
  <rect class="warn" x="260" y="570" width="680" height="80"/><text class="math" x="445" y="620">mgd = (md)g</text><text class="small" x="350" y="650">The common factor g cancels in centre-of-mass ratios.</text>

</svg>
