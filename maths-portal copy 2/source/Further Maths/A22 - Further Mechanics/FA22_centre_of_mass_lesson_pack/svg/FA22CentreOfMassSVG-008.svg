<?xml version="1.0" encoding="UTF-8"?>
<svg width="1100" height="620" viewBox="0 0 1100 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">FA22CentreOfMassSVG-008: Sector and arc comparison</title>
  <desc id="desc">Sector and arc comparison</desc>
  <style>
    .bg { fill:#FAF9F6; } .card { fill:#FFFFF0; stroke:#E5E5EA; stroke-width:2; rx:22; }
    .ink { fill:#2C2C2E; font-family: Georgia, 'Times New Roman', serif; }
    .line { stroke:#2C2C2E; stroke-width:3; fill:none; } .gold { stroke:#C5A059; stroke-width:4; fill:none; }
    .fill { fill:#FBEFEF; stroke:#C5A059; stroke-width:3; } .dot { fill:#D4AF37; stroke:#2C2C2E; stroke-width:1.5; }
    .dash { stroke:#C5A059; stroke-width:3; stroke-dasharray:8 6; fill:none; } .small { font-size:18px; } .title { font-size:28px; font-weight:700; } .label { font-size:21px; font-weight:700; }
  </style>
  <rect class="bg" width="100%" height="100%"/>
  <rect class="card" x="35" y="35" width="1030" height="550"/>
  <text class="ink title" x="550.0" y="80" text-anchor="middle">Sector and arc comparison</text>
  
  <path class="fill" d="M300 420 L205 220 A190 190 0 0 1 395 220 Z"/><line class="dash" x1="300" y1="420" x2="300" y2="190"/><circle fill="#2C2C2E" stroke="#D4AF37" stroke-width="4" cx="300" cy="300" r="8"/><text class="ink label" x="300" y="140" text-anchor="middle">Sector lamina</text><text class="ink small" x="300" y="520" text-anchor="middle">d = 2r sin α / 3α</text>
  <path class="gold" d="M755 220 A190 190 0 0 1 945 220"/><line class="line" x1="850" y1="420" x2="755" y2="220"/><line class="line" x1="850" y1="420" x2="945" y2="220"/><line class="dash" x1="850" y1="420" x2="850" y2="190"/><circle fill="#2C2C2E" stroke="#D4AF37" stroke-width="4" cx="850" cy="260" r="8"/><text class="ink label" x="850" y="140" text-anchor="middle">Circular arc wire</text><text class="ink small" x="850" y="520" text-anchor="middle">d = r sin α / α</text>
  <text class="ink label" x="575" y="590" text-anchor="middle">α must be in radians. Do not confuse sectors and arcs.</text>

</svg>
