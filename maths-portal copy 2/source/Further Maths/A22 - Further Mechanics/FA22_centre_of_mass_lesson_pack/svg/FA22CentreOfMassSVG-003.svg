<?xml version="1.0" encoding="UTF-8"?>
<svg width="1100" height="620" viewBox="0 0 1100 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">FA22CentreOfMassSVG-003: Particles on a line</title>
  <desc id="desc">Particles on a line</desc>
  <style>
    .bg { fill:#FAF9F6; } .card { fill:#FFFFF0; stroke:#E5E5EA; stroke-width:2; rx:22; }
    .ink { fill:#2C2C2E; font-family: Georgia, 'Times New Roman', serif; }
    .line { stroke:#2C2C2E; stroke-width:3; fill:none; } .gold { stroke:#C5A059; stroke-width:4; fill:none; }
    .fill { fill:#FBEFEF; stroke:#C5A059; stroke-width:3; } .dot { fill:#D4AF37; stroke:#2C2C2E; stroke-width:1.5; }
    .dash { stroke:#C5A059; stroke-width:3; stroke-dasharray:8 6; fill:none; } .small { font-size:18px; } .title { font-size:28px; font-weight:700; } .label { font-size:21px; font-weight:700; }
  </style>
  <rect class="bg" width="100%" height="100%"/>
  <rect class="card" x="35" y="35" width="1030" height="550"/>
  <text class="ink title" x="550.0" y="80" text-anchor="middle">Particles on a line</text>
  
  <line class="line" x1="130" y1="330" x2="970" y2="330"/><text class="ink small" x="980" y="336">x</text>
  <g class="ink small"><line class="line" x1="130" y1="320" x2="130" y2="340"/><text x="130" y="370" text-anchor="middle">0</text><line class="line" x1="240" y1="320" x2="240" y2="340"/><text x="240" y="370" text-anchor="middle">1</text><line class="line" x1="350" y1="320" x2="350" y2="340"/><text x="350" y="370" text-anchor="middle">2</text><line class="line" x1="460" y1="320" x2="460" y2="340"/><text x="460" y="370" text-anchor="middle">3</text><line class="line" x1="570" y1="320" x2="570" y2="340"/><text x="570" y="370" text-anchor="middle">4</text><line class="line" x1="680" y1="320" x2="680" y2="340"/><text x="680" y="370" text-anchor="middle">5</text><line class="line" x1="790" y1="320" x2="790" y2="340"/><text x="790" y="370" text-anchor="middle">6</text><line class="line" x1="900" y1="320" x2="900" y2="340"/><text x="900" y="370" text-anchor="middle">7</text></g>
  <circle class="dot" cx="460" cy="260" r="16"/><text class="ink label" x="460" y="225" text-anchor="middle">2 kg</text>
  <circle class="dot" cx="570" cy="260" r="24"/><text class="ink label" x="570" y="218" text-anchor="middle">5 kg</text>
  <circle class="dot" cx="790" cy="260" r="19"/><text class="ink label" x="790" y="225" text-anchor="middle">3 kg</text>
  <line class="dash" x1="614" y1="190" x2="614" y2="350"/><circle fill="#2C2C2E" cx="614" cy="330" r="7"/><text class="ink label" x="614" y="175" text-anchor="middle">G, x̄ = 4.4</text>
  <text class="ink label" x="550" y="490" text-anchor="middle">2(3)+5(4)+3(6)=10x̄, so x̄=4.4</text>

</svg>
