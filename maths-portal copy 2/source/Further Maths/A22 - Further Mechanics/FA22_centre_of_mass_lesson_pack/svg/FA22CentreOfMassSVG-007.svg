  <title id="title">FA22CentreOfMassSVG-007: Triangle centre of mass methods</title>
  <desc id="desc">Triangle centre of mass methods</desc>
  <style>
    .bg { fill:#FAF9F6; } .card { fill:#FFFFF0; stroke:#E5E5EA; stroke-width:2; rx:22; }
    .ink { fill:#2C2C2E; font-family: Georgia, 'Times New Roman', serif; }
    .line { stroke:#2C2C2E; stroke-width:3; fill:none; } .gold { stroke:#C5A059; stroke-width:4; fill:none; }
    .fill { fill:#FBEFEF; stroke:#C5A059; stroke-width:3; } .dot { fill:#D4AF37; stroke:#2C2C2E; stroke-width:1.5; }
    .dash { stroke:#C5A059; stroke-width:3; stroke-dasharray:8 6; fill:none; } .small { font-size:18px; } .title { font-size:28px; font-weight:700; } .label { font-size:21px; font-weight:700; }
  </style>
  <rect class="bg" width="100%" height="100%"/>
  <rect class="card" x="35" y="35" width="1030" height="550"/>
  <text class="ink title" x="550.0" y="80" text-anchor="middle">Triangle centre of mass methods</text>
  
  <polygon class="fill" points="120,470 370,470 220,170"/><line class="dash" x1="220" y1="170" x2="245" y2="470"/><circle class="dot" cx="237" cy="370" r="8"/><text class="ink label" x="250" y="365">G</text><text class="ink small" x="245" y="515" text-anchor="middle">AG:GM = 2:1</text>
  <polygon class="fill" points="440,470 690,470 570,170"/><line class="dash" x1="570" y1="170" x2="565" y2="470"/><line class="dash" x1="440" y1="470" x2="630" y2="320"/><circle class="dot" cx="567" cy="370" r="8"/><text class="ink small" x="565" y="515" text-anchor="middle">intersection of medians</text>
