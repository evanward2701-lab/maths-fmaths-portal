  <text x="80" y="105" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#2C2C2E">Vertical circles: radial plus tangential thinking</text>
  
  <text x="80" y="150" font-family="Arial" font-size="22" fill="#2C2C2E">Speed usually changes: fastest at the bottom, slowest at the top.</text>
  <circle cx="410" cy="410" r="220" fill="none" stroke="#2C2C2E" stroke-width="5"/>
  <circle cx="410" cy="410" r="7" fill="#2C2C2E"/>
  <circle cx="410" cy="190" r="12" fill="#2C2C2E"/><circle cx="630" cy="410" r="12" fill="#2C2C2E"/><circle cx="410" cy="630" r="12" fill="#2C2C2E"/><circle cx="190" cy="410" r="12" fill="#2C2C2E"/>
