  <text x="265" y="336" font-family="Arial" font-size="24" fill="#2C2C2E">mg</text>
  <rect x="730" y="235" width="360" height="265" rx="18" fill="#FAF9F6" stroke="#E5E5EA" stroke-width="3"/>
  <text x="760" y="350" font-family="Arial" font-size="28" fill="#C5A059">a_radial = v²/r</text>
  <text x="760" y="410" font-family="Arial" font-size="28" fill="#C5A059">|a_tangential| = g sin θ</text>

