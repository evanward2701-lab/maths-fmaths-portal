  <title id="title">Vertical circles: radial plus tangential thinking</title>
  <desc id="desc">Show radial and tangential acceleration in a vertical circle.</desc>
  <metadata>
    Asset ID: FAS2CircularMotionSVG-007
    Topic ID: FAS2CircularMotion
    Related lesson section: # 9. Visual Asset Integration
    Source: Phase 1 visual placeholder and circular motion evidence
    Purpose: Show radial and tangential acceleration in a vertical circle.
  </metadata>
  <defs>
