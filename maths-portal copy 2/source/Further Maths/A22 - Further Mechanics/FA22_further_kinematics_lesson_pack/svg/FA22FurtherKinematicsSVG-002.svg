<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="780" viewBox="0 0 1200 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Distance versus displacement from a velocity-time graph</title>
  <desc id="desc">A velocity-time graph for v equals t squared minus 7t plus 10, with roots at t equals 2 and t equals 5, showing positive and negative areas and the distance integral split.</desc>
  <metadata>Asset ID: FA22FurtherKinematicsSVG-002; Source: Screenshot PDF velocity-time graph and transcript warning about negative areas; Related lesson section: Core Theory; Visual Asset Integration; Common Mistakes; Purpose: Show why distance travelled requires splitting intervals when the velocity-time graph crosses the axis.</metadata>
  <defs>
    <marker id="arrowDark" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 12 6 L 0 12 z" fill="#2C2C2E"/></marker>
    <pattern id="positiveHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" stroke="#C5A059" stroke-width="4" opacity="0.55"/></pattern>
    <pattern id="negativeHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" stroke="#D48C8C" stroke-width="4" opacity="0.55"/></pattern>
    <style>
      .bg{fill:#FAF9F6}.panel{fill:#FFFFF0;stroke:#E5E5EA;stroke-width:3;rx:28}.title{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:36px;font-weight:700;fill:#2C2C2E}.subtitle{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:20px;fill:#3A3A3C}.axis{stroke:#2C2C2E;stroke-width:4;stroke-linecap:round}.grid{stroke:#E5E5EA;stroke-width:1.5}.curve{fill:none;stroke:#2C2C2E;stroke-width:5;stroke-linecap:round}.label{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:20px;fill:#2C2C2E}.small{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:17px;fill:#3A3A3C}.math{font-family:"Times New Roman",serif;font-size:26px;font-style:italic;fill:#2C2C2E}.formula{font-family:"Times New Roman",serif;font-size:27px;fill:#2C2C2E}.goldText{fill:#9A7A30}.roseText{fill:#A75C5C}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="780"/><rect class="panel" x="55" y="45" width="1090" height="690"/>
  <text class="title" x="95" y="102">Distance travelled is not automatically displacement</text><text class="subtitle" x="95" y="140">Example graph: v = t² − 7t + 10. Split at the roots before adding distance.</text>
  <rect x="90" y="190" width="620" height="360" rx="14" fill="#FAF9F6" stroke="#E5E5EA" stroke-width="2"/>
  <line class="grid" x1="90" y1="100" x2="90" y2="550"/><line class="grid" x1="180" y1="100" x2="180" y2="550"/><line class="grid" x1="270" y1="100" x2="270" y2="550"/><line class="grid" x1="360" y1="100" x2="360" y2="550"/><line class="grid" x1="450" y1="100" x2="450" y2="550"/><line class="grid" x1="540" y1="100" x2="540" y2="550"/><line class="grid" x1="630" y1="100" x2="630" y2="550"/>
  <line class="axis" x1="90" y1="560" x2="90" y2="95" marker-end="url(#arrowDark)"/><line class="axis" x1="80" y1="400" x2="690" y2="400" marker-end="url(#arrowDark)"/>
  <text class="math" x="64" y="118">v</text><text class="math" x="672" y="430">t</text>
  <text class="small" x="83" y="424">0</text><text class="small" x="174" y="424">1</text><text class="small" x="264" y="424">2</text><text class="small" x="354" y="424">3</text><text class="small" x="444" y="424">4</text><text class="small" x="534" y="424">5</text><text class="small" x="624" y="424">6</text><text class="small" x="55" y="204">10</text><text class="small" x="62" y="304">5</text><text class="small" x="55" y="464">−3</text>
  <path d="M 90 400 L 90 200 C 145 250 210 340 270 400 Z" fill="url(#positiveHatch)" stroke="#C5A059" stroke-width="2" opacity="0.9"/>
  <path d="M 270 400 C 330 455 455 455 540 400 L 270 400 Z" fill="url(#negativeHatch)" stroke="#D48C8C" stroke-width="2" opacity="0.9"/>
  <path d="M 540 400 C 575 360 605 315 630 320 L 630 400 Z" fill="url(#positiveHatch)" stroke="#C5A059" stroke-width="2" opacity="0.9"/>
  <path class="curve" d="M 90 200 C 145 250 210 340 270 400 C 335 455 455 455 540 400 C 575 360 605 315 630 320"/>
  <circle cx="270" cy="400" r="7" fill="#D4AF37"/><circle cx="540" cy="400" r="7" fill="#D4AF37"/>
  <text class="label" x="242" y="382">root</text><text class="label" x="512" y="382">root</text><text class="formula" x="305" y="175">v = t² − 7t + 10</text><text class="label goldText" x="125" y="275">positive area</text><text class="label roseText" x="355" y="475">negative area</text><text class="label goldText" x="555" y="290">positive area</text>
  <rect x="760" y="190" width="340" height="360" rx="22" fill="#FFFFF0" stroke="#C5A059" stroke-width="3"/><text class="label" x="790" y="232">Displacement:</text><text class="formula" x="790" y="275">Δx = ∫₀⁶ v dt</text><line x1="790" y1="304" x2="1070" y2="304" stroke="#E5E5EA" stroke-width="3"/><text class="label" x="790" y="345">Distance travelled:</text><text class="formula" x="790" y="390">∫₀² v dt − ∫₂⁵ v dt + ∫₅⁶ v dt</text><text class="small" x="790" y="445">The middle signed area is negative.</text><text class="small" x="790" y="474">Subtract it to add its magnitude.</text><rect x="790" y="505" width="280" height="32" rx="12" fill="#FBEFEF" stroke="#E5E5EA" stroke-width="1"/><text class="small" x="805" y="527">Exam trigger: “distance travelled”</text>
  <rect x="95" y="600" width="1005" height="82" rx="22" fill="#FBEFEF" stroke="#E5E5EA" stroke-width="2"/><text class="label" x="125" y="637">Rule:</text><text class="small" x="190" y="637">If v crosses zero, split the interval. Displacement uses signed area. Distance uses magnitudes.</text><text class="small" x="190" y="668">Instantaneous rest is a warning light: the particle may have changed direction.</text>
</svg>
