<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FA22ElasticCollisionsInOneDimensionWidget-002</title><!-- Asset ID: FA22ElasticCollisionsInOneDimensionWidget-002. Purpose: speed of approach/separation trainer. --><style>body{margin:0;background:#FAF9F6;color:#2C2C2E;font-family:Inter,system-ui,sans-serif;line-height:1.5}.wrap{max-width:1000px;margin:auto;padding:28px}.card{background:#FFFFF0;border:1px solid #E5E5EA;border-radius:22px;padding:20px;margin:16px 0}input,select,button{width:100%;padding:12px;border-radius:14px;border:1px solid #E5E5EA;font-size:1rem}button{background:#D4AF37;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.math{background:white;border:1px solid #E5E5EA;border-radius:14px;padding:14px;white-space:pre-wrap;font-family:ui-monospace,monospace}.ok{background:#F4FFF8;border:1px solid #245C3B55;color:#245C3B;border-radius:14px;padding:12px;font-weight:800}.warn{background:#FFF7F7;border:1px solid #8A2D2D55;color:#8A2D2D;border-radius:14px;padding:12px;font-weight:800}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>Speed of Approach and Separation Trainer</h1><section class="card"><div class="grid"><label>A before direction<select id="abd"><option value="1">Right</option><option value="-1">Left</option></select></label><label>A before speed<input id="abs" type="number" value="4" step="any"></label><label>B before direction<select id="bbd"><option value="1">Right</option><option value="-1">Left</option></select></label><label>B before speed<input id="bbs" type="number" value="2" step="any"></label><label>A after direction<select id="aad"><option value="1">Right</option><option value="-1">Left</option></select></label><label>A after speed<input id="aas" type="number" value="1" step="any"></label><label>B after direction<select id="bad"><option value="1">Right</option><option value="-1">Left</option></select></label><label>B after speed<input id="bas" type="number" value="3" step="any"></label></div><button onclick="calc()">Check relative speeds</button></section><section class="card"><div id="msg"></div><div class="math" id="out"></div></section></main><script>function n(id){return Number(document.getElementById(id).value)}function r(x){return Math.round(x*1e6)/1e6}function calc(){let uA=n('abd')*n('abs'),uB=n('bbd')*n('bbs'),vA=n('aad')*n('aas'),vB=n('bad')*n('bas');let app=uA-uB,sep=vB-vA;let html='';if(app<=0)html+='<div class="warn">A is not closing in on B, so this before-diagram does not show a direct collision.</div>';if(sep<0)html+='<div class="warn">After impact, the particles are not separating under this diagram.</div>';if(app>0&&sep>=0)html+='<div class="ok">Relative-speed setup is valid. e = '+r(sep/app)+'</div>';msg.innerHTML=html;out.textContent=`Signed velocities:
uA=${r(uA)}, uB=${r(uB)}, vA=${r(vA)}, vB=${r(vB)}

Speed of approach = uA-uB = ${r(app)}
Speed of separation = vB-vA = ${r(sep)}
${app>0?'e = '+r(sep/app):'e not available because approach speed is not positive.'}`}calc()</script></body></html>
