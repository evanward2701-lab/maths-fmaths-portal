<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FA22ElasticCollisionsInOneDimensionWidget-001</title><!-- Asset ID: FA22ElasticCollisionsInOneDimensionWidget-001. Purpose: PCLM + NLR solver. --><style>body{margin:0;background:#FAF9F6;color:#2C2C2E;font-family:Inter,system-ui,sans-serif;line-height:1.5}.wrap{max-width:1000px;margin:auto;padding:28px}.card{background:#FFFFF0;border:1px solid #E5E5EA;border-radius:22px;padding:20px;margin:16px 0}input,select,button{width:100%;padding:12px;border-radius:14px;border:1px solid #E5E5EA;font-size:1rem}button{background:#D4AF37;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.math{background:white;border:1px solid #E5E5EA;border-radius:14px;padding:14px;white-space:pre-wrap;font-family:ui-monospace,monospace}.ok{background:#F4FFF8;border:1px solid #245C3B55;color:#245C3B;border-radius:14px;padding:12px;font-weight:800}.warn{background:#FFF7F7;border:1px solid #8A2D2D55;color:#8A2D2D;border-radius:14px;padding:12px;font-weight:800}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>PCLM + NLR Collision Solver</h1><p>This widget assumes particle 1 starts to the left of particle 2 and right is positive, so a direct collision needs u₁ &gt; u₂.</p><section class="card"><div class="grid"><label>m₁<input id="m1" type="number" step="any" value="2"></label><label>m₂<input id="m2" type="number" step="any" value="3"></label><label>u₁<input id="u1" type="number" step="any" value="4"></label><label>u₂<input id="u2" type="number" step="any" value="2"></label><label>e<input id="e" type="number" step="any" value="0.25"></label></div><button onclick="solve()">Solve collision</button></section><section class="card"><div id="msg"></div><h2>PCLM and NLR</h2><div class="math" id="out"></div><h2>Interpretation</h2><div class="math" id="interp"></div></section></main><script>function n(id){return Number(document.getElementById(id).value)}function r(x){return Math.round(x*1e6)/1e6}function solve(){let m1=n('m1'),m2=n('m2'),u1=n('u1'),u2=n('u2'),e=n('e'),msg=document.getElementById('msg');let warnings=[];if(!(m1>0&&m2>0))warnings.push('Masses must be positive.');if(!(e>=0&&e<=1))warnings.push('The coefficient of restitution must satisfy 0 ≤ e ≤ 1.');let app=u1-u2;if(!(app>0))warnings.push('For this layout, direct collision requires u₁ > u₂.');if(warnings.length){msg.innerHTML=warnings.map(w=>'<div class="warn">'+w+'</div>').join('');out.textContent='Fix input before solving.';interp.textContent='';return}let total=m1*u1+m2*u2;let rel=e*app;let v1=(total-m2*rel)/(m1+m2);let v2=v1+rel;msg.innerHTML='<div class="ok">Valid direct-collision setup.</div>';out.textContent=`PCLM: ${r(m1)}(${r(u1)})+${r(m2)}(${r(u2)})=${r(m1)}v₁+${r(m2)}v₂
NLR: v₂-v₁=e(u₁-u₂)=${r(e)}(${r(app)})=${r(rel)}

Solving gives v₁=${r(v1)}, v₂=${r(v2)}`;interp.textContent=`Particle 1 moves ${v1>=0?'right':'left'} with speed ${r(Math.abs(v1))}.
Particle 2 moves ${v2>=0?'right':'left'} with speed ${r(Math.abs(v2))}.
Negative velocity means opposite direction, not negative speed.`}solve()</script></body></html>
