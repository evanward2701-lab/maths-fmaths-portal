<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FA22ElasticCollisionsInOneDimensionWidget-003</title><!-- Asset ID: FA22ElasticCollisionsInOneDimensionWidget-003. Purpose: inequality source checker. --><style>body{margin:0;background:#FAF9F6;color:#2C2C2E;font-family:Inter,system-ui,sans-serif;line-height:1.5}.wrap{max-width:1000px;margin:auto;padding:28px}.card{background:#FFFFF0;border:1px solid #E5E5EA;border-radius:22px;padding:20px;margin:16px 0}input,select,button{width:100%;padding:12px;border-radius:14px;border:1px solid #E5E5EA;font-size:1rem}button{background:#D4AF37;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.math{background:white;border:1px solid #E5E5EA;border-radius:14px;padding:14px;white-space:pre-wrap;font-family:ui-monospace,monospace}.ok{background:#F4FFF8;border:1px solid #245C3B55;color:#245C3B;border-radius:14px;padding:12px;font-weight:800}.warn{background:#FFF7F7;border:1px solid #8A2D2D55;color:#8A2D2D;border-radius:14px;padding:12px;font-weight:800}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>Inequality Source Checker</h1><p>Choose the phrase or physical situation in the question.</p><section class="card"><select id="condition" onchange="render()"><option value="unchanged">Direction of a particle is unchanged</option><option value="range">Find a range involving e</option><option value="collisionLogic">Collision logic / particle catches another</option><option value="collideAgain">Particles collide again after a rebound</option><option value="reversed">Direction of a particle is reversed</option><option value="impossibleE">Calculated e seems impossible</option></select></section><section class="card"><h2 id="title"></h2><div class="math" id="out"></div><h2>Common wrong move</h2><div class="warn" id="wrong"></div></section></main><script>const data={unchanged:['Direction unchanged','If the final velocity x is drawn in the unchanged direction, start with x > 0. Substitute your expression for x, then combine with 0 ≤ e ≤ 1.','Do not start with e > 0. Start with the relevant velocity.'],range:['Restitution range','Always use 0 ≤ e ≤ 1. Intersect this with any inequality derived from the question.','Do not give only a one-sided inequality if a range is requested.'],collisionLogic:['Collision logic','If a behind particle must catch an ahead particle, use speed behind > speed ahead. For no immediate re-collision, use the opposite inequality as required by the diagram.','Do not begin with random algebra. Begin with the physical sentence.'],collideAgain:['Particles collide again','After a rebound, the particle behind must have speed greater than the particle ahead. Translate that into an inequality and combine with 0 ≤ e ≤ 1.','Do not use distance first unless timing is needed.'],reversed:['Direction reversed','Compare the original direction with your drawn final velocity arrow. If x is drawn right and real motion is left, then x < 0.','Do not always use x < 0; it depends on how x was drawn.'],impossibleE:['Impossible e','If e < 0 or e > 1, check NLR speeds, PCLM signs, whether particles approach, and model consistency.','Do not accept e > 1 as just very bouncy.']};function render(){let v=document.getElementById('condition').value;title.textContent=data[v][0];out.textContent=data[v][1];wrong.textContent=data[v][2]}render()</script></body></html>
