<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Speed of approach and speed of separation</title>
  <desc id="desc">Two panels showing before and after direct collision with relative speeds labelled.</desc>
  <rect width="1200" height="760" fill="#FAF9F6"/>
  <text x="60" y="70" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="700" fill="#2C2C2E">Speed of approach and speed of separation</text>
  <rect x="60" y="110" width="1080" height="90" rx="20" fill="#FBEFEF" stroke="#E5E5EA" stroke-width="2"/>
  <text x="600" y="162" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700" fill="#2C2C2E">e = speed of separation ÷ speed of approach</text>
  
  <rect x="80" y="245" width="500" height="360" rx="24" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/>
  <rect x="620" y="245" width="500" height="360" rx="24" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/>
  <text x="330" y="295" text-anchor="middle" font-family="Inter, Arial" font-size="30" font-weight="700" fill="#2C2C2E">Before collision</text>
  <text x="870" y="295" text-anchor="middle" font-family="Inter, Arial" font-size="30" font-weight="700" fill="#2C2C2E">After collision</text>
  <line x1="130" y1="450" x2="530" y2="450" stroke="#E5E5EA" stroke-width="4"/>
  <circle cx="230" cy="425" r="50" fill="#FAF9F6" stroke="#C5A059" stroke-width="5"/><text x="230" y="434" text-anchor="middle" font-family="Inter, Arial" font-size="28" font-weight="700" fill="#2C2C2E">A</text>
  <circle cx="430" cy="425" r="50" fill="#FAF9F6" stroke="#C5A059" stroke-width="5"/><text x="430" y="434" text-anchor="middle" font-family="Inter, Arial" font-size="28" font-weight="700" fill="#2C2C2E">B</text>
  <line x1="170" y1="340" x2="300" y2="340" stroke="#2C2C2E" stroke-width="6" stroke-linecap="round"/><polygon points="300,340 278,327 278,353" fill="#2C2C2E"/>
  <line x1="390" y1="340" x2="470" y2="340" stroke="#2C2C2E" stroke-width="6" stroke-linecap="round"/><polygon points="470,340 448,327 448,353" fill="#2C2C2E"/>
  <text x="330" y="570" text-anchor="middle" font-family="Inter, Arial" font-size="26" font-weight="700" fill="#2C2C2E">speed of approach = |u₁ - u₂|</text>
  <line x1="670" y1="450" x2="1070" y2="450" stroke="#E5E5EA" stroke-width="4"/>
  <circle cx="770" cy="425" r="50" fill="#FAF9F6" stroke="#C5A059" stroke-width="5"/><text x="770" y="434" text-anchor="middle" font-family="Inter, Arial" font-size="28" font-weight="700" fill="#2C2C2E">A</text>
  <circle cx="970" cy="425" r="50" fill="#FAF9F6" stroke="#C5A059" stroke-width="5"/><text x="970" y="434" text-anchor="middle" font-family="Inter, Arial" font-size="28" font-weight="700" fill="#2C2C2E">B</text>
  <line x1="810" y1="340" x2="710" y2="340" stroke="#2C2C2E" stroke-width="6" stroke-linecap="round"/><polygon points="710,340 732,327 732,353" fill="#2C2C2E"/>
  <line x1="930" y1="340" x2="1060" y2="340" stroke="#2C2C2E" stroke-width="6" stroke-linecap="round"/><polygon points="1060,340 1038,327 1038,353" fill="#2C2C2E"/>
  <text x="870" y="570" text-anchor="middle" font-family="Inter, Arial" font-size="26" font-weight="700" fill="#2C2C2E">speed of separation = |v₂ - v₁|</text>
  <text x="600" y="690" text-anchor="middle" font-family="Inter, Arial" font-size="24" font-weight="700" fill="#2C2C2E">PCLM uses signed velocities. NLR uses scalar speeds.</text>

</svg>
