<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Bridge: ordinary momentum to Further Mechanics restitution</title>
  <desc id="desc">Comparison between PCLM only and PCLM plus NLR.</desc>
  <rect width="1200" height="760" fill="#FAF9F6"/>
  <text x="60" y="70" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="700" fill="#2C2C2E">Bridge: ordinary momentum to Further Mechanics restitution</text>
  <rect x="60" y="110" width="1080" height="90" rx="20" fill="#FBEFEF" stroke="#E5E5EA" stroke-width="2"/>
  <text x="600" y="162" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700" fill="#2C2C2E">Ordinary: one equation. Further: PCLM + NLR gives two equations.</text>
  
  <rect x="80" y="260" width="470" height="330" rx="24" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/><text x="315" y="315" text-anchor="middle" font-family="Inter, Arial" font-size="30" font-weight="700" fill="#2C2C2E">Ordinary A-Level Mechanics</text><text x="315" y="365" text-anchor="middle" font-size="26" font-weight="700" fill="#2C2C2E">Momentum only</text><text x="315" y="420" text-anchor="middle" font-size="24" fill="#2C2C2E">m₁u₁ + m₂u₂ = m₁v₁ + m₂v₂</text><text x="315" y="485" text-anchor="middle" font-size="22" fill="#2C2C2E">One equation; often underdetermined</text>
  <line x1="560" y1="425" x2="640" y2="425" stroke="#D4AF37" stroke-width="8"/><polygon points="640,425 610,407 610,443" fill="#D4AF37"/>
  <rect x="650" y="260" width="470" height="330" rx="24" fill="#FBEFEF" stroke="#E5E5EA" stroke-width="3"/><text x="885" y="315" text-anchor="middle" font-family="Inter, Arial" font-size="30" font-weight="700" fill="#2C2C2E">Further Mechanics</text><text x="885" y="365" text-anchor="middle" font-size="26" font-weight="700" fill="#2C2C2E">Momentum + restitution</text><text x="885" y="420" text-anchor="middle" font-size="24" fill="#2C2C2E">Add e = separation ÷ approach</text><text x="885" y="485" text-anchor="middle" font-size="22" fill="#2C2C2E">Two equations; solve and interpret signs</text>
  <text x="600" y="675" text-anchor="middle" font-family="Inter, Arial" font-size="25" font-weight="700" fill="#2C2C2E">Ordinary Maths content is bridge context only and does not override FA22-REST.</text>

