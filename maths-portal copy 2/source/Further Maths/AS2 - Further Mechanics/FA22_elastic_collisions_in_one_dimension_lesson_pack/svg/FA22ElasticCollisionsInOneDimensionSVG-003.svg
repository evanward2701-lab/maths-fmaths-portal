<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Sign convention: draw first, interpret after</title>
  <desc id="desc">Unknown final velocities drawn to the right and interpreted after solving.</desc>
  <rect width="1200" height="760" fill="#FAF9F6"/>
  <text x="60" y="70" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="700" fill="#2C2C2E">Sign convention: draw first, interpret after</text>
  <rect x="60" y="110" width="1080" height="90" rx="20" fill="#FBEFEF" stroke="#E5E5EA" stroke-width="2"/>
  <text x="600" y="162" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700" fill="#2C2C2E">Negative velocity means opposite direction, not negative speed.</text>
  
  <line x1="420" y1="250" x2="780" y2="250" stroke="#D4AF37" stroke-width="6"/><polygon points="780,250 756,236 756,264" fill="#D4AF37"/><text x="600" y="232" text-anchor="middle" font-family="Inter, Arial" font-size="26" font-weight="700" fill="#2C2C2E">positive direction</text>
  <rect x="80" y="310" width="480" height="260" rx="24" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/><text x="320" y="355" text-anchor="middle" font-family="Inter, Arial" font-size="30" font-weight="700" fill="#2C2C2E">Before</text>
  <circle cx="220" cy="460" r="45" fill="#FAF9F6" stroke="#C5A059" stroke-width="5"/><text x="220" y="468" text-anchor="middle" font-size="24" font-weight="700">1</text><circle cx="420" cy="460" r="45" fill="#FAF9F6" stroke="#C5A059" stroke-width="5"/><text x="420" y="468" text-anchor="middle" font-size="24" font-weight="700">2</text>
  <rect x="640" y="310" width="480" height="260" rx="24" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/><text x="880" y="355" text-anchor="middle" font-family="Inter, Arial" font-size="30" font-weight="700" fill="#2C2C2E">After</text>
  <circle cx="780" cy="460" r="45" fill="#FAF9F6" stroke="#C5A059" stroke-width="5"/><text x="780" y="468" text-anchor="middle" font-size="24" font-weight="700">1</text><circle cx="980" cy="460" r="45" fill="#FAF9F6" stroke="#C5A059" stroke-width="5"/><text x="980" y="468" text-anchor="middle" font-size="24" font-weight="700">2</text>
  <line x1="730" y1="395" x2="850" y2="395" stroke="#2C2C2E" stroke-width="6"/><polygon points="850,395 828,382 828,408" fill="#2C2C2E"/><text x="790" y="380" text-anchor="middle" font-size="24" font-weight="700">v₁</text>
  <line x1="930" y1="395" x2="1050" y2="395" stroke="#2C2C2E" stroke-width="6"/><polygon points="1050,395 1028,382 1028,408" fill="#2C2C2E"/><text x="990" y="380" text-anchor="middle" font-size="24" font-weight="700">v₂</text>
  <text x="600" y="660" text-anchor="middle" font-family="Inter, Arial" font-size="25" font-weight="700" fill="#2C2C2E">If v₁ &lt; 0 or v₂ &lt; 0, the corresponding particle actually moves left.</text>

</svg>
