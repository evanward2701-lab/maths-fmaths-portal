<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="780" viewBox="0 0 1200 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Momentum and impulse unit map</title>
  <desc id="desc">A teaching diagram showing P equals mv, I equals Ft, N equals kg m s to the minus 2, and the unit equivalence Ns equals kg m s to the minus 1.</desc>
  <defs><marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#C5A059"/></marker></defs>
  <rect width="1200" height="780" fill="#FAF9F6"/><rect x="40" y="32" width="1120" height="710" rx="28" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/>
  <text x="80" y="88" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700" fill="#2C2C2E">Momentum and Impulse Units</text>
  <text x="80" y="126" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6B6B70">Momentum and impulse have the same units: newton seconds or kilogram metres per second.</text>
  <line x1="80" y1="158" x2="1120" y2="158" stroke="#E5E5EA" stroke-width="2"/>
  <rect x="95" y="200" width="300" height="165" rx="22" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="2"/><text x="128" y="242" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#2C2C2E">Momentum</text><text x="128" y="300" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700" fill="#2C2C2E">P = mv</text><text x="128" y="338" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6B6B70">mass × velocity</text>
  <rect x="450" y="200" width="300" height="165" rx="22" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="2"/><text x="483" y="242" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#2C2C2E">Impulse</text><text x="483" y="300" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700" fill="#2C2C2E">I = Ft</text><text x="483" y="338" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6B6B70">force × time</text>
  <rect x="805" y="200" width="300" height="165" rx="22" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="2"/><text x="838" y="242" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#2C2C2E">Impulse-momentum</text><text x="838" y="300" font-family="Inter, Arial, sans-serif" font-size="35" font-weight="700" fill="#2C2C2E">I = m(v-u)</text><text x="838" y="338" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6B6B70">change in momentum</text>
  <rect x="130" y="430" width="940" height="190" rx="26" fill="#FAF9F6" stroke="#C5A059" stroke-width="3"/><text x="180" y="480" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#2C2C2E">Unit link</text><text x="180" y="535" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#2C2C2E">N = kg m s⁻²</text><line x1="470" y1="525" x2="575" y2="525" stroke="#C5A059" stroke-width="5" marker-end="url(#arrowGold)"/><text x="610" y="535" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#2C2C2E">Ns = (kg m s⁻²)s</text><line x1="470" y1="575" x2="575" y2="575" stroke="#C5A059" stroke-width="5" marker-end="url(#arrowGold)"/><text x="610" y="586" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#2C2C2E">Ns = kg m s⁻¹</text>
  <rect x="150" y="650" width="900" height="54" rx="18" fill="#FBEFEF" stroke="#E5E5EA" stroke-width="2"/><text x="185" y="684" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#2C2C2E">Standard unit warning:</text><text x="407" y="684" font-family="Inter, Arial, sans-serif" font-size="20" fill="#2C2C2E">convert grams to kg and km/h to m s⁻¹ before using formulae.</text>
  <text x="80" y="728" font-family="Inter, Arial, sans-serif" font-size="14" fill="#6B6B70">Asset ID: FA22MomentumImpulseFoundationsForRestitutionSVG-002 | AI-rendered teaching diagram</text>
</svg>
