<?xml version="1.0" encoding="UTF-8"?>
<svg width="1300" height="800" viewBox="0 0 1300 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Bridge from A-Level impulse and momentum to FA22 restitution</title>
  <desc id="desc">A bridge diagram comparing ordinary A22 impulse and momentum with FA22 restitution. The left panel shows PCLM, impulse and momentum foundations. The right panel shows FA22 restitution adding Newton's law of restitution and direct elastic collision modelling.</desc>
  <defs><marker id="arrowGold" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M2,2 L12,7 L2,12 Z" fill="#C5A059"/></marker></defs>
  <rect width="1300" height="800" fill="#FAF9F6"/><rect x="42" y="34" width="1216" height="724" rx="30" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/>
  <text x="82" y="90" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700" fill="#2C2C2E">From Momentum Foundations to FA22 Restitution</text>
  <text x="82" y="128" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6B6B70">Ordinary A-Level Maths gives the collision engine. Further Maths Restitution adds the extra law needed for elastic direct collisions.</text>
  <line x1="82" y1="160" x2="1218" y2="160" stroke="#E5E5EA" stroke-width="2"/>
  <rect x="95" y="210" width="455" height="390" rx="26" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="2"/><rect x="95" y="210" width="455" height="78" rx="26" fill="#FAF9F6" stroke="#E5E5EA" stroke-width="2"/><text x="130" y="258" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#2C2C2E">Ordinary A22 Bridge</text><text x="130" y="323" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#2C2C2E">Momentum</text><text x="165" y="358" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700" fill="#2C2C2E">P = mv</text><text x="130" y="405" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#2C2C2E">Impulse</text><text x="165" y="440" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700" fill="#2C2C2E">I = m(v-u) = Ft</text><text x="130" y="488" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#2C2C2E">Conservation of linear momentum</text><text x="165" y="525" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#2C2C2E">m₁u₁ + m₂u₂ = m₁v₁ + m₂v₂</text><text x="130" y="566" font-family="Inter, Arial, sans-serif" font-size="17" fill="#6B6B70">Bridge context only: this prepares the collision model.</text>
  <line x1="585" y1="405" x2="715" y2="405" stroke="#C5A059" stroke-width="7" marker-end="url(#arrowGold)"/><rect x="555" y="315" width="200" height="64" rx="18" fill="#FBEFEF" stroke="#E5E5EA" stroke-width="2"/><text x="580" y="342" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#2C2C2E">Same collision</text><text x="580" y="365" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#2C2C2E">diagram</text><rect x="555" y="432" width="200" height="82" rx="18" fill="#FAF9F6" stroke="#C5A059" stroke-width="2"/><text x="580" y="461" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#2C2C2E">Further Maths</text><text x="580" y="484" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#2C2C2E">needs another</text><text x="580" y="507" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#2C2C2E">equation</text>
  <rect x="750" y="210" width="455" height="390" rx="26" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="2"/><rect x="750" y="210" width="455" height="78" rx="26" fill="#FBEFEF" stroke="#E5E5EA" stroke-width="2"/><text x="785" y="258" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#2C2C2E">FA22 Restitution Upgrade</text><text x="785" y="323" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#2C2C2E">Keep PCLM</text><text x="820" y="358" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#2C2C2E">momentum before = momentum after</text><text x="785" y="405" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#2C2C2E">Add restitution law</text><text x="820" y="440" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#2C2C2E">Newton's law of restitution</text><text x="785" y="488" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#2C2C2E">Solve direct elastic collisions</text><text x="820" y="523" font-family="Inter, Arial, sans-serif" font-size="18" fill="#2C2C2E">smooth spheres or sphere with fixed plane</text><text x="785" y="566" font-family="Inter, Arial, sans-serif" font-size="17" fill="#6B6B70">Current evidence supplies the bridge, not the restitution law.</text>
  <rect x="125" y="642" width="1050" height="76" rx="22" fill="#FFF7E6" stroke="#C5A059" stroke-width="2"/><text x="160" y="675" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#2C2C2E">Boundary checkpoint:</text><text x="370" y="675" font-family="Inter, Arial, sans-serif" font-size="20" fill="#2C2C2E">momentum and impulse are bridge foundations here.</text><text x="160" y="704" font-family="Inter, Arial, sans-serif" font-size="18" fill="#2C2C2E">Full FA22 Restitution requires Newton's law of restitution, which was not supplied in the current evidence.</text>
  <text x="82" y="742" font-family="Inter, Arial, sans-serif" font-size="14" fill="#6B6B70">Asset ID: FA22MomentumImpulseFoundationsForRestitutionBridgeSVG-001 | AI-rendered bridge diagram</text>
</svg>
