<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">String versus spring under stretching and compression</title><desc id="desc">Four panel comparison: stretched string and spring produce tension, compressed spring produces thrust, compressed string goes slack.</desc>
<rect width="1200" height="820" fill="#FAF9F6"/><rect x="42" y="40" width="1116" height="740" rx="24" fill="#FFFFF0" stroke="#E5E5EA"/>
<text x="80" y="98" fill="#2C2C2E" font-family="Inter, Arial" font-size="34" font-weight="700">Elastic strings and springs: tension, thrust and slackness</text>
<g font-family="Inter, Arial" fill="#2C2C2E"><rect x="80" y="140" width="500" height="270" rx="20" fill="#FFFFF0" stroke="#E5E5EA"/><text x="110" y="184" font-size="27" font-weight="700">1. Stretched elastic string</text><line x1="130" y1="290" x2="455" y2="290" stroke="#2C2C2E" stroke-width="5"/><circle cx="475" cy="290" r="18" fill="#C5A059" stroke="#2C2C2E" stroke-width="3"/><text x="180" y="365" font-size="22">Tension: T = λx / l</text>
<rect x="620" y="140" width="500" height="270" rx="20" fill="#FFFFF0" stroke="#E5E5EA"/><text x="650" y="184" font-size="27" font-weight="700">2. Stretched elastic spring</text><path d="M670 290 C685 250,705 330,725 290 C745 250,765 330,785 290 C805 250,825 330,845 290 C865 250,885 330,905 290 C925 250,945 330,965 290" stroke="#2C2C2E" stroke-width="5" fill="none"/><text x="715" y="365" font-size="22">Tension: T = λx / l</text>
<rect x="80" y="445" width="500" height="270" rx="20" fill="#FFFFF0" stroke="#E5E5EA"/><text x="110" y="489" font-size="27" font-weight="700">3. Compressed elastic spring</text><path d="M130 595 C142 565,154 625,166 595 C178 565,190 625,202 595 C214 565,226 625,238 595 C250 565,262 625,274 595 C286 565,298 625,310 595" stroke="#2C2C2E" stroke-width="5" fill="none"/><text x="170" y="675" font-size="22">Thrust = λx / l</text>
<rect x="620" y="445" width="500" height="270" rx="20" fill="#FFFFF0" stroke="#E5E5EA"/><text x="650" y="489" font-size="27" font-weight="700">4. Compressed string</text><path d="M675 590 C715 630,755 550,795 590 C835 630,875 550,915 590" stroke="#2C2C2E" stroke-width="5" stroke-dasharray="10 8" fill="none"/><text x="740" y="660" font-size="22" font-weight="700" fill="#C5A059">String goes slack, T = 0</text></g>
</svg>