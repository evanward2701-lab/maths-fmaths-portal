<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">Bridge from ordinary Mechanics tension to Further Mechanics elastic tension</title><desc id="desc">Comparison between ordinary Mechanics tension from force balance and Further Mechanics elastic tension satisfying Hooke's Law.</desc>
<rect width="1200" height="780" fill="#FAF9F6"/><rect x="42" y="38" width="1116" height="700" rx="24" fill="#FFFFF0" stroke="#E5E5EA"/>
<text x="82" y="92" fill="#2C2C2E" font-family="Inter, Arial" font-size="32" font-weight="700">A-Level Maths Bridge: ordinary tension becomes elastic tension</text>
<line x1="600" y1="120" x2="600" y2="700" stroke="#E5E5EA" stroke-width="3"/>
<g font-family="Inter, Arial" fill="#2C2C2E"><text x="112" y="178" font-size="28" font-weight="700">Ordinary Mechanics</text><text x="112" y="212" font-size="19">Inextensible string: tension comes from force balance.</text><line x1="378" y1="250" x2="378" y2="430" stroke="#2C2C2E" stroke-width="5"/><rect x="338" y="430" width="80" height="64" rx="10" fill="#FBEFEF" stroke="#2C2C2E"/><text x="146" y="622" font-size="22">At rest: T = mg</text><text x="676" y="178" font-size="28" font-weight="700">Further Mechanics</text><text x="676" y="212" font-size="19">Elastic string: tension also depends on extension.</text><path d="M942 250 C910 270,974 290,942 310 C910 330,974 350,942 370 C910 390,974 410,942 430" stroke="#2C2C2E" stroke-width="5" fill="none"/><rect x="902" y="430" width="80" height="64" rx="10" fill="#FBEFEF" stroke="#2C2C2E"/><text x="706" y="622" font-size="22">At rest: T = mg and T = λx / l</text><text x="398" y="346" fill="#C5A059" font-size="22" font-weight="700">Key upgrade</text><text x="398" y="376" font-size="22">Force balance + elastic law + geometry</text></g>
</svg>