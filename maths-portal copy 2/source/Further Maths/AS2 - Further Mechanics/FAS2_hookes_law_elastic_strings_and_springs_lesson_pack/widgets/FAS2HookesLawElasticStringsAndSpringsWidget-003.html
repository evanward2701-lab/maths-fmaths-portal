<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Elastic Energy Equation Builder</title><style>body{font-family:Inter,Arial,sans-serif;background:#FAF9F6;color:#2C2C2E;margin:0;padding:28px}.card{max-width:1080px;margin:auto;background:#FFFFF0;border:1px solid #E5E5EA;border-radius:24px;padding:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel,.out{border:1px solid #E5E5EA;border-radius:18px;padding:18px}.panel{background:white}.out{background:#FBEFEF}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-weight:800}input,button{width:100%;padding:10px;border-radius:12px;border:1px solid #E5E5EA}button{background:#C5A059;color:white;font-weight:900;margin-top:16px}.formula{white-space:pre-wrap;background:#FFFFF0;border:1px solid #E5E5EA;border-radius:14px;padding:12px}@media(max-width:850px){.grid,.inputs{grid-template-columns:1fr}}</style></head><body><main class="card"><h1>Elastic Energy Equation Builder</h1><p>Build the ledger: Work in + KE + GPE + EPE = KE + GPE + EPE + Work out.</p><div class="grid"><section class="panel"><div class="inputs"><label>m<input id="m" type="number" step="any" value="0.5"></label><label>g<input id="g" type="number" step="any" value="9.8"></label><label>u<input id="u" type="number" step="any" value="0"></label><label>v<input id="v" type="number" step="any" value="0"></label><label>h1<input id="h1" type="number" step="any" value="4"></label><label>h2<input id="h2" type="number" step="any" value="0"></label><label>λ<input id="lam" type="number" step="any" value="19.6"></label><label>l<input id="l" type="number" step="any" value="2"></label><label>x1<input id="x1" type="number" step="any" value="0"></label><label>x2<input id="x2" type="number" step="any" value="2"></label><label>Work in<input id="wi" type="number" step="any" value="0"></label><label>Work out<input id="wo" type="number" step="any" value="0"></label></div><button onclick="build()">Build equation</button></section><section class="out" id="out">Enter values and build.</section></div></main><script>function v(id){return +document.getElementById(id).value}function f(n){return Number(n.toFixed(5)).toString()}function epe(lam,x,l){return lam*x*x/(2*l)}function build(){const m=v('m'),g=v('g'),u=v('u'),vv=v('v'),h1=v('h1'),h2=v('h2'),lam=v('lam'),l=v('l'),x1=v('x1'),x2=v('x2'),wi=v('wi'),wo=v('wo');const KE1=.5*m*u*u,KE2=.5*m*vv*vv,GPE1=m*g*h1,GPE2=m*g*h2,EPE1=epe(lam,x1,l),EPE2=epe(lam,x2,l),left=wi+KE1+GPE1+EPE1,right=KE2+GPE2+EPE2+wo;out.innerHTML=`<h2>Energy ledger</h2><div class="formula">${f(wi)} + ${f(KE1)} + ${f(GPE1)} + ${f(EPE1)}
=
${f(KE2)} + ${f(GPE2)} + ${f(EPE2)} + ${f(wo)}

Left = ${f(left)} J
Right = ${f(right)} J
Difference = ${f(left-right)} J</div><p>Greatest distance: set v = 0. Maximum speed: use a = 0 in a force equation first.</p>`}</script></body></html>
