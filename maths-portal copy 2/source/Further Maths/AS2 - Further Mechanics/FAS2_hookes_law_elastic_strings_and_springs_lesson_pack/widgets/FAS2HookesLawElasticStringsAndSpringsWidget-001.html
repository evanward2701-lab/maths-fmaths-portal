<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Hooke's Law Calculator</title><style>body{font-family:Inter,Arial,sans-serif;background:#FAF9F6;color:#2C2C2E;margin:0;padding:28px}.card{max-width:980px;margin:auto;background:#FFFFF0;border:1px solid #E5E5EA;border-radius:24px;padding:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:white;border:1px solid #E5E5EA;border-radius:18px;padding:18px}label{display:block;font-weight:800;margin-top:12px}input,select,button{width:100%;padding:11px;border-radius:12px;border:1px solid #E5E5EA}button{background:#C5A059;color:white;font-weight:900;margin-top:16px}.out{background:#FBEFEF;border-radius:18px;padding:18px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main class="card"><h1>Hooke's Law Calculator</h1><p>Practise <strong>T = λx/l</strong>, units, tension, thrust and slack strings.</p><div class="grid"><section class="panel"><label>Object</label><select id="type"><option value="string">Elastic string</option><option value="spring">Elastic spring</option></select><label>Mode</label><select id="mode"><option value="current">Current length L</option><option value="extension">Extension x</option><option value="compression">Compression x</option></select><label>Natural length l / m</label><input id="l" type="number" step="any" value="2"><label>Modulus λ / N</label><input id="lam" type="number" step="any" value="29.4"><label>Given value / m</label><input id="val" type="number" step="any" value="4.6667"><button onclick="calc()">Calculate</button></section><section class="out" id="out">Enter values and calculate.</section></div></main><script>function f(n){return Number(n.toFixed(5)).toString()}function calc(){const type=document.getElementById('type').value,mode=document.getElementById('mode').value,l=+document.getElementById('l').value,lam=+document.getElementById('lam').value,val=+document.getElementById('val').value;let L,x,state;if(l<=0||lam<0||val<0){out.innerHTML='Check inputs.';return}if(mode==='current'){L=val;if(L>l){x=L-l;state='stretched'}else if(L<l){x=l-L;state='compressed'}else{x=0;state='natural length'}}if(mode==='extension'){x=val;L=l+x;state=x?'stretched':'natural length'}if(mode==='compression'){x=val;L=l-x;state=x?'compressed':'natural length'}let force=lam*x/l,kind='elastic force',warn='';if(state==='stretched')kind='tension';else if(state==='compressed'&&type==='spring')kind='thrust';else if(state==='compressed'&&type==='string'){force=0;kind='zero tension';warn='<p><strong>Warning:</strong> a string cannot resist compression, so it goes slack.</p>'}else force=0;out.innerHTML=`<h2>Result</h2><p>State: <strong>${state}</strong></p><p>L = ${f(L)} m, x = ${f(x)} m</p><p><strong>${kind}: ${f(force)} N</strong></p>${warn}<p>Working: T = λx/l = ${f(lam)} × ${f(x)} / ${f(l)}</p>`}</script></body></html>
