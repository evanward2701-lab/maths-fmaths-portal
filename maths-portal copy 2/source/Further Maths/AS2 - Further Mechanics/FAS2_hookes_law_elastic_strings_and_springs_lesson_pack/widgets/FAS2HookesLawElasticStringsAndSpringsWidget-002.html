<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Extension versus Total Length Trap Checker</title><style>body{font-family:Inter,Arial,sans-serif;background:#FAF9F6;color:#2C2C2E;margin:0;padding:28px}.card{max-width:980px;margin:auto;background:#FFFFF0;border:1px solid #E5E5EA;border-radius:24px;padding:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel,.out{border:1px solid #E5E5EA;border-radius:18px;padding:18px}.panel{background:white}.out{background:#FBEFEF}label{display:block;font-weight:800;margin-top:12px}input,select,button{width:100%;padding:11px;border-radius:12px;border:1px solid #E5E5EA}button{background:#C5A059;color:white;font-weight:900;margin-top:16px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main class="card"><h1>Extension versus Total Length Trap Checker</h1><p>The words <strong>to</strong> and <strong>by</strong> decide whether the value is total length or change in length.</p><div class="grid"><section class="panel"><label>Natural length l</label><input id="l" type="number" step="any" value="1"><label>Modulus λ / N</label><input id="lam" type="number" step="any" value="60"><label>Wording</label><select id="phrase"><option value="stretchedTo">stretched to a length</option><option value="extendedBy">extended by a distance</option><option value="compressedTo">compressed to a length</option><option value="compressedBy">compressed by a distance</option></select><label>Given multiple of l</label><input id="k" type="number" step="any" value="4"><button onclick="check()">Check</button></section><section class="out" id="out">Choose wording and check.</section></div></main><script>function f(n){return Number(n.toFixed(5)).toString()}function check(){const l=+document.getElementById('l').value,lam=+document.getElementById('lam').value,k=+document.getElementById('k').value,p=document.getElementById('phrase').value;let L,x,msg;if(p==='stretchedTo'){L=k*l;x=L-l;msg=`${k}l is total length, so x=${k}l-l.`}if(p==='extendedBy'){x=k*l;L=l+x;msg=`${k}l is already the extension.`}if(p==='compressedTo'){L=k*l;x=l-L;msg=`${k}l is compressed length, so x=l-${k}l.`}if(p==='compressedBy'){x=k*l;L=l-x;msg=`${k}l is already the compression.`}const force=lam*Math.max(x,0)/l;out.innerHTML=`<h2>Interpretation</h2><p>${msg}</p><p>Current length L = ${f(L)}</p><p>Elastic change x = ${f(x)}</p><p>Force magnitude from Hooke's Law = ${f(force)} N</p>`}</script></body></html>
