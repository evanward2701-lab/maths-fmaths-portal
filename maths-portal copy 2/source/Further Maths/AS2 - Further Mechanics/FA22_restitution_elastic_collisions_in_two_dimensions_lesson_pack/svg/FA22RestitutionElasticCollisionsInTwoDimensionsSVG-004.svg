<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Oblique impact of two smooth spheres</title><desc id="desc">Two smooth spheres collide. The impulse acts along the line of centres. Common tangent components are unchanged.</desc><metadata>Asset ID: FA22RestitutionElasticCollisionsInTwoDimensionsSVG-004</metadata>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#2C2C2E"/></marker></defs>
<rect width="1280" height="800" fill="#FAF9F6"/><rect x="40" y="38" width="1200" height="724" rx="28" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="2"/>
<text x="78" y="94" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#2C2C2E">Oblique impact of two smooth spheres</text>
<circle cx="425" cy="450" r="92" fill="#FAF9F6" stroke="#2C2C2E" stroke-width="4"/><circle cx="605" cy="450" r="92" fill="#FAF9F6" stroke="#2C2C2E" stroke-width="4"/>
<circle cx="425" cy="450" r="7" fill="#C5A059"/><circle cx="605" cy="450" r="7" fill="#C5A059"/>
<text x="385" y="455" font-family="Georgia, serif" font-size="28">A</text><text x="630" y="455" font-family="Georgia, serif" font-size="28">B</text>
<line x1="300" y1="450" x2="730" y2="450" stroke="#9F3A45" stroke-width="5"/><text x="430" y="425" font-family="Arial" font-size="22">line of centres</text>
<line x1="515" y1="250" x2="515" y2="650" stroke="#C5A059" stroke-width="4" stroke-dasharray="10 8"/><text x="530" y="275" font-family="Arial" font-size="22">common tangent</text>
<line x1="250" y1="320" x2="360" y2="400" stroke="#2C2C2E" stroke-width="4" marker-end="url(#arrow)"/><text x="225" y="305" font-family="Georgia, serif" font-size="24">u<tspan baseline-shift="sub" font-size="14">A</tspan></text>
<line x1="790" y1="560" x2="690" y2="505" stroke="#2C2C2E" stroke-width="4" marker-end="url(#arrow)"/><text x="800" y="575" font-family="Georgia, serif" font-size="24">u<tspan baseline-shift="sub" font-size="14">B</tspan></text>
<rect x="805" y="220" width="385" height="132" rx="18" fill="#FBEFEF" stroke="#C5A059" stroke-width="2"/><text x="831" y="265" font-family="Georgia, serif" font-size="28">Common tangent</text><text x="831" y="303" font-family="Arial" font-size="18">components are unchanged</text>
<rect x="805" y="392" width="385" height="172" rx="18" fill="#FFFFF0" stroke="#D4AF37" stroke-width="2"/><text x="831" y="437" font-family="Georgia, serif" font-size="28">Line of centres</text><text x="831" y="475" font-family="Arial" font-size="18">use momentum and restitution</text><text x="831" y="520" font-family="Georgia, serif" font-size="24">vB - vA = e(uA - uB)</text>
</svg>
