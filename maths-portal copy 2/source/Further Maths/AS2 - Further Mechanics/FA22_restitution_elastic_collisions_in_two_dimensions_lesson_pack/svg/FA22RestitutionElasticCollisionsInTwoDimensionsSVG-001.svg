<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Consequence of smoothness in a fixed plane impact</title>
  <desc id="desc">A smooth horizontal surface exerts no frictional force. The reaction and impulse are normal to the surface, so the parallel component of velocity is unchanged.</desc>
  <metadata>Asset ID: FA22RestitutionElasticCollisionsInTwoDimensionsSVG-001; Source: FM1-Chp5-ObliqueCollisions.pdf page 3; Purpose: show consequence of smoothness.</metadata>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#2C2C2E"/></marker></defs>
  <rect width="1200" height="760" fill="#FAF9F6"/>
  <rect x="40" y="38" width="1120" height="684" rx="28" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="2"/>
  <text x="80" y="96" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#2C2C2E">The consequence of smoothness</text>
  <text x="80" y="132" font-family="Arial" font-size="21" fill="#2C2C2E">Smooth contact means no frictional impulse: only the normal component changes.</text>
  <line x1="170" y1="540" x2="600" y2="540" stroke="#2C2C2E" stroke-width="5"/>
  <g stroke="#8E8E93" stroke-width="2"><line x1="220" y1="540" x2="190" y2="590"/><line x1="285" y1="540" x2="255" y2="590"/><line x1="350" y1="540" x2="320" y2="590"/><line x1="415" y1="540" x2="385" y2="590"/><line x1="480" y1="540" x2="450" y2="590"/><line x1="545" y1="540" x2="515" y2="590"/></g>
  <circle cx="385" cy="485" r="55" fill="#FAF9F6" stroke="#2C2C2E" stroke-width="4"/>
  <line x1="385" y1="485" x2="385" y2="310" stroke="#C5A059" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="400" y="355" font-family="Georgia, serif" font-size="28" fill="#2C2C2E">R</text>
  <line x1="385" y1="485" x2="545" y2="485" stroke="#9F3A45" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="560" y="493" font-family="Georgia, serif" font-size="28" fill="#2C2C2E">F<tspan baseline-shift="sub" font-size="16">r</tspan> = 0</text>
  <rect x="700" y="220" width="390" height="110" rx="18" fill="#FBEFEF" stroke="#C5A059" stroke-width="2"/>
  <text x="728" y="265" font-family="Georgia, serif" font-size="28" fill="#2C2C2E">Smooth surface</text><text x="728" y="300" font-family="Arial" font-size="19" fill="#2C2C2E">cannot apply friction</text>
  <rect x="700" y="365" width="390" height="120" rx="18" fill="#FFFFF0" stroke="#D4AF37" stroke-width="2"/>
  <text x="728" y="410" font-family="Georgia, serif" font-size="28" fill="#2C2C2E">Impulse is normal</text><text x="728" y="448" font-family="Arial" font-size="19" fill="#2C2C2E">change in momentum is normal</text>
  <rect x="700" y="520" width="390" height="120" rx="18" fill="#FBEFEF" stroke="#C5A059" stroke-width="2"/>
  <text x="728" y="565" font-family="Georgia, serif" font-size="28" fill="#2C2C2E">Parallel unchanged</text><text x="728" y="604" font-family="Arial" font-size="19" fill="#2C2C2E">v∥ = u∥, v⊥ = e u⊥</text>
</svg>
