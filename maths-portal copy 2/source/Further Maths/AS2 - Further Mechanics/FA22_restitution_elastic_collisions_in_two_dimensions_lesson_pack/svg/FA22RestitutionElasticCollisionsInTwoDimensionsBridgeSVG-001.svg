<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="760" viewBox="0 0 1280 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Bridge from ordinary one-dimensional restitution to Further Maths component restitution</title><desc id="desc">Comparison of ordinary A-Level one-dimensional collision methods and FA22 two-dimensional component methods.</desc><metadata>Asset ID: FA22RestitutionElasticCollisionsInTwoDimensionsBridgeSVG-001</metadata>
<rect width="1280" height="760" fill="#FAF9F6"/><rect x="40" y="38" width="1200" height="684" rx="28" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="2"/>
<text x="78" y="94" font-family="Georgia, serif" font-size="36" font-weight="700" fill="#2C2C2E">A-Level Maths Bridge: from one line to chosen directions</text>
<rect x="82" y="145" width="350" height="500" rx="24" fill="#FAF9F6" stroke="#E5E5EA" stroke-width="2"/><text x="110" y="195" font-family="Georgia, serif" font-size="28" font-weight="700">Ordinary A-Level</text><text x="110" y="232" font-family="Arial" font-size="20">One-dimensional collision</text><text x="110" y="310" font-family="Georgia, serif" font-size="22">m₁u₁ + m₂u₂ = m₁v₁ + m₂v₂</text><text x="110" y="360" font-family="Georgia, serif" font-size="22">e = separation / approach</text><text x="110" y="420" font-family="Arial" font-size="18">Old habit: one axis.</text>
<rect x="465" y="230" width="350" height="260" rx="24" fill="#FFFFF0" stroke="#D4AF37" stroke-width="2"/><text x="505" y="288" font-family="Georgia, serif" font-size="28" font-weight="700">Same law</text><text x="505" y="328" font-family="Arial" font-size="20">sharper direction choice</text><line x1="520" y1="375" x2="760" y2="375" stroke="#C5A059" stroke-width="4"/>
<rect x="850" y="145" width="350" height="500" rx="24" fill="#FBEFEF" stroke="#C5A059" stroke-width="2"/><text x="878" y="195" font-family="Georgia, serif" font-size="28" font-weight="700">Further Maths FA22</text><text x="878" y="232" font-family="Arial" font-size="20">Two-dimensional collision</text><text x="878" y="312" font-family="Arial" font-size="18">Parallel component unchanged</text><text x="878" y="355" font-family="Georgia, serif" font-size="24">v∥ = u∥</text><text x="878" y="420" font-family="Arial" font-size="18">Normal component uses restitution</text><text x="878" y="464" font-family="Georgia, serif" font-size="24">v⊥ = e u⊥</text>
<text x="78" y="690" font-family="Arial" font-size="18" fill="#2C2C2E">Bridge warning: do not multiply the whole velocity by e. Only the normal or line-of-centres component belongs in Newton's law of restitution.</text>
</svg>
