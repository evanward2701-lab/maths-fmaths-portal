<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FAS2WorkEnergyAndPowerWidget-001</title><style>:root{--canvas:#FAF9F6;--paper:#FFFFF0;--line:#E5E5EA;--accent:#C5A059;--soft:#FBEFEF;--text:#2C2C2E}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--canvas);color:var(--text)}main{max-width:1050px;margin:24px auto;padding:24px;background:var(--paper);border:1px solid var(--line);border-radius:28px}.card{background:var(--canvas);border:1px solid var(--line);border-radius:20px;padding:16px;margin:14px 0}input,select{width:100%;padding:10px;margin:5px 0 10px;border:1px solid var(--line);border-radius:12px}button{background:var(--accent);color:white;border:0;border-radius:14px;padding:11px 16px;font-weight:800}.math{font-family:"Cambria Math",Georgia,serif;font-size:1.15rem}.result{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}</style></head><body><main><h1>Work and Scalar Product Calculator</h1><div class="card"><strong>Asset ID:</strong> FAS2WorkEnergyAndPowerWidget-001<br><strong>Purpose:</strong> Reinforce W = Fs cos θ and W = F · s.</div><div class="card"><h2>Magnitude-angle mode</h2><label>F (N)<input id="F" type="number" value="40"></label><label>s (m)<input id="s" type="number" value="5"></label><label>θ (degrees)<input id="th" type="number" value="60"></label><button onclick="calc()">Calculate</button><div id="out" class="result"></div></div><div class="card"><h2>Vector mode</h2><p>F=(F1,F2,F3), s=(s1,s2,s3)</p><input id="f1" value="2"><input id="f2" value="5"><input id="f3" value="-3"><input id="s1" value="4"><input id="s2" value="-1"><input id="s3" value="2"><button onclick="dot()">Dot product</button><div id="dotout" class="result"></div></div><script>function fmt(x){return Number.isFinite(x)?Number.parseFloat(x.toFixed(6)):"not defined"}function calc(){let F=+document.getElementById('F').value,s=+document.getElementById('s').value,t=+document.getElementById('th').value*Math.PI/180,W=F*s*Math.cos(t);document.getElementById('out').innerHTML=`<p class="math">W = Fs cos θ = ${fmt(W)} J</p><p>${Math.abs(Math.cos(t))<1e-10?'Force is perpendicular, so work is zero.':W<0?'Negative work: force acts against displacement.':'Use the force component in the displacement direction.'}</p>`}function dot(){let f1=+document.getElementById('f1').value,f2=+document.getElementById('f2').value,f3=+document.getElementById('f3').value,s1=+document.getElementById('s1').value,s2=+document.getElementById('s2').value,s3=+document.getElementById('s3').value,W=f1*s1+f2*s2+f3*s3;document.getElementById('dotout').innerHTML=`<p class="math">W = ${f1}(${s1}) + ${f2}(${s2}) + ${f3}(${s3}) = ${fmt(W)} J</p>`}calc();dot();</script></main></body></html>
