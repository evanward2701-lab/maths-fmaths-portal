<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FAS2WorkEnergyAndPowerWidget-004</title><style>:root{--canvas:#FAF9F6;--paper:#FFFFF0;--line:#E5E5EA;--accent:#C5A059;--soft:#FBEFEF;--text:#2C2C2E}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--canvas);color:var(--text)}main{max-width:1050px;margin:24px auto;padding:24px;background:var(--paper);border:1px solid var(--line);border-radius:28px}.card{background:var(--canvas);border:1px solid var(--line);border-radius:20px;padding:16px;margin:14px 0}input,select{width:100%;padding:10px;margin:5px 0 10px;border:1px solid var(--line);border-radius:12px}button{background:var(--accent);color:white;border:0;border-radius:14px;padding:11px 16px;font-weight:800}.math{font-family:"Cambria Math",Georgia,serif;font-size:1.15rem}.result{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}</style></head><body><main><h1>Vehicle Power Model Checker</h1><div class="card"><strong>Asset ID:</strong> FAS2WorkEnergyAndPowerWidget-004<br><strong>Purpose:</strong> Model P=Fv, resistance, slopes, acceleration and maximum speed.</div><div class="card"><label>m kg<input id="m" value="1200"></label><label>Power<input id="P" value="48"></label><select id="unit"><option>kW</option><option>W</option></select><label>v m/s<input id="v" value="16"></label><label>Resistance N<input id="R" value="900"></label><label>θ degrees<input id="th" value="0"></label><select id="dir"><option value="horizontal">Horizontal</option><option value="uphill">Uphill</option><option value="downhill">Downhill</option></select><button onclick="calc()">Calculate acceleration</button><button onclick="maxs()">Horizontal maximum speed</button><div id="out" class="result"></div></div><script>function fmt(x){return Number.parseFloat(x.toFixed(6))}function data(){let P=+document.getElementById('P').value,u=document.getElementById('unit').value;if(u==='kW')P*=1000;return{m:+document.getElementById('m').value,P,v:+document.getElementById('v').value,R:+document.getElementById('R').value,th:+document.getElementById('th').value*Math.PI/180,dir:document.getElementById('dir').value}}function calc(){let d=data(),drive=d.P/d.v,wt=d.m*9.8*Math.sin(d.th),res=d.dir==='uphill'?drive-d.R-wt:d.dir==='downhill'?drive+wt-d.R:drive-d.R,a=res/d.m;document.getElementById('out').innerHTML=`<p class="math">Driving force = P/v = ${fmt(drive)} N</p><p class="math">Resultant force = ${fmt(res)} N</p><p class="math">a = ${fmt(a)} m s⁻²</p>`}function maxs(){let d=data();document.getElementById('out').innerHTML=`<p class="math">At maximum speed a=0, so P/v = R.</p><p class="math">v = P/R = ${fmt(d.P/d.R)} m s⁻¹</p>`}calc();</script></main></body></html>
