<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FAS2WorkEnergyAndPowerWidget-002</title><style>:root{--canvas:#FAF9F6;--paper:#FFFFF0;--line:#E5E5EA;--accent:#C5A059;--soft:#FBEFEF;--text:#2C2C2E}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--canvas);color:var(--text)}main{max-width:1050px;margin:24px auto;padding:24px;background:var(--paper);border:1px solid var(--line);border-radius:28px}.card{background:var(--canvas);border:1px solid var(--line);border-radius:20px;padding:16px;margin:14px 0}input,select{width:100%;padding:10px;margin:5px 0 10px;border:1px solid var(--line);border-radius:12px}button{background:var(--accent);color:white;border:0;border-radius:14px;padding:11px 16px;font-weight:800}.math{font-family:"Cambria Math",Georgia,serif;font-size:1.15rem}.result{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}</style></head><body><main><h1>Rough Slope Work-Energy Builder</h1><div class="card"><strong>Asset ID:</strong> FAS2WorkEnergyAndPowerWidget-002<br><strong>Purpose:</strong> Build rough-slope work-energy terms.</div><div class="card"><label>m kg<input id="m" type="number" value="2"></label><label>θ degrees<input id="th" type="number" value="30"></label><label>s metres<input id="s" type="number" value="12"></label><label>μ<input id="mu" type="number" value="0.35"></label><label>u m/s<input id="u" type="number" value="0"></label><label>v m/s<input id="v" type="number" value="0"></label><select id="dir"><option value="up">Up slope</option><option value="down">Down slope</option></select><button onclick="calc()">Build model</button><div id="out" class="result"></div></div><script>function fmt(x){return Number.parseFloat(x.toFixed(5))}function calc(){let m=+document.getElementById('m').value,th=+document.getElementById('th').value*Math.PI/180,s=+document.getElementById('s').value,mu=+document.getElementById('mu').value,u=+document.getElementById('u').value,v=+document.getElementById('v').value,g=9.8,h=s*Math.sin(th),R=m*g*Math.cos(th),fr=mu*R,wf=fr*s,gpe=m*g*h,ke1=.5*m*u*u,ke2=.5*m*v*v,dir=document.getElementById('dir').value;document.getElementById('out').innerHTML=`<p class="math">h = s sin θ = ${fmt(h)} m</p><p class="math">R = mg cos θ = ${fmt(R)} N</p><p class="math">Fᵣ = μR = ${fmt(fr)} N</p><p class="math">Work against friction = ${fmt(wf)} J</p><p class="math">|ΔGPE| = ${fmt(gpe)} J</p><p class="math">Initial KE = ${fmt(ke1)} J, Final KE = ${fmt(ke2)} J</p><p>${dir==='up'?'Use work in + initial KE = final KE + GPE gain + work against friction.':'Use work in + initial KE + GPE lost = final KE + work against friction.'}</p>`}calc();</script></main></body></html>
