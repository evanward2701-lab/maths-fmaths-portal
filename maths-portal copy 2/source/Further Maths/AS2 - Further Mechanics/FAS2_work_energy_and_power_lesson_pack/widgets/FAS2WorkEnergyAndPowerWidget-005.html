<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FAS2WorkEnergyAndPowerWidget-005</title><style>:root{--canvas:#FAF9F6;--paper:#FFFFF0;--line:#E5E5EA;--accent:#C5A059;--soft:#FBEFEF;--text:#2C2C2E}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--canvas);color:var(--text)}main{max-width:1050px;margin:24px auto;padding:24px;background:var(--paper);border:1px solid var(--line);border-radius:28px}.card{background:var(--canvas);border:1px solid var(--line);border-radius:20px;padding:16px;margin:14px 0}input,select{width:100%;padding:10px;margin:5px 0 10px;border:1px solid var(--line);border-radius:12px}button{background:var(--accent);color:white;border:0;border-radius:14px;padding:11px 16px;font-weight:800}.math{font-family:"Cambria Math",Georgia,serif;font-size:1.15rem}.result{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}</style></head><body><main><h1>Pump Power Widget</h1><div class="card"><strong>Asset ID:</strong> FAS2WorkEnergyAndPowerWidget-005<br><strong>Purpose:</strong> Cover pump raising and ejecting water, a CCEA power requirement.</div><div class="card"><label>Mass flow rate r kg/s<input id="r" value="15"></label><label>Height h m<input id="h" value="9"></label><label>Ejection speed v m/s<input id="v" value="4"></label><label>Efficiency %<input id="e" value="100"></label><button onclick="calc()">Calculate</button><div id="out" class="result"></div></div><script>function fmt(x){return Number.parseFloat(x.toFixed(6))}function calc(){let r=+document.getElementById('r').value,h=+document.getElementById('h').value,v=+document.getElementById('v').value,e=+document.getElementById('e').value/100,raise=r*9.8*h,kin=.5*r*v*v,useful=raise+kin,input=useful/e;document.getElementById('out').innerHTML=`<p class="math">P_raise = rgh = ${fmt(raise)} W</p><p class="math">P_kinetic = 1/2rv² = ${fmt(kin)} W</p><p class="math">P_useful = ${fmt(useful)} W = ${fmt(useful/1000)} kW</p><p class="math">Input power = useful/e = ${fmt(input)} W</p>`}calc();</script></main></body></html>
