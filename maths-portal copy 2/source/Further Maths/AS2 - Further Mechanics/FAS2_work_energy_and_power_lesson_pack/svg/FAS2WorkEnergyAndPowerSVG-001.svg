  <title id="title">FAS2WorkEnergyAndPowerSVG-001: Constant force work diagram</title>
  <desc id="desc">A horizontal 8 N force moves a box 5 m, giving work 40 J.</desc>
  <metadata>asset_id: FAS2WorkEnergyAndPowerSVG-001; unit_code: FAS2; topic_code: FAS2-WENG + FAS2-POW; topic_id: FAS2WorkEnergyAndPower; status: Generated in Phase 3</metadata>
  <defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 Z" fill="#C5A059"/></marker></defs>
  <rect width="1200" height="760" fill="#FAF9F6"/>
