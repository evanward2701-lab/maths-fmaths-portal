  <text x="90" y="105" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#2C2C2E">Constant force work diagram</text>
  
  <line x1="120" y1="480" x2="1080" y2="480" stroke="#2C2C2E" stroke-width="4"/>
  <rect x="430" y="330" width="220" height="150" rx="18" fill="#FAF9F6" stroke="#2C2C2E" stroke-width="4"/>
