  <text x="925" y="500" text-anchor="middle" font-size="34" font-family="Cambria Math" fill="#C5A059">W = 40 J</text>
  <text x="600" y="680" text-anchor="middle" font-size="18" font-family="Inter, Arial" fill="#2C2C2E">Units: 1 J = 1 N m. Force and displacement are aligned.</text>

