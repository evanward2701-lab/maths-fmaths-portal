<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">From Unit Circle to Standard Ellipse</title><desc id="desc">Unit circle stretched to standard ellipse.</desc>
<rect width="1200" height="760" fill="#FAF9F6"/><rect x="40" y="40" width="1120" height="680" rx="28" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/>
<text x="600" y="95" text-anchor="middle" font-family="Georgia,serif" font-size="34" fill="#2C2C2E" font-weight="700">From Unit Circle to Standard Ellipse</text>
<g font-family="Arial,sans-serif" fill="#2C2C2E"><line x1="120" y1="390" x2="500" y2="390" stroke="#2C2C2E" stroke-width="3"/><line x1="310" y1="580" x2="310" y2="200" stroke="#2C2C2E" stroke-width="3"/><circle cx="310" cy="390" r="120" fill="none" stroke="#C5A059" stroke-width="5"/><text x="260" y="640" font-size="22">x² + y² = 1</text><line x1="535" y1="390" x2="660" y2="390" stroke="#C5A059" stroke-width="4"/><text x="575" y="360" font-size="20">stretch</text><line x1="700" y1="390" x2="1080" y2="390" stroke="#2C2C2E" stroke-width="3"/><line x1="890" y1="580" x2="890" y2="200" stroke="#2C2C2E" stroke-width="3"/><ellipse cx="890" cy="390" rx="160" ry="95" fill="none" stroke="#C5A059" stroke-width="5"/><text x="780" y="640" font-size="22">x²/a² + y²/b² = 1</text><text x="770" y="670" font-size="20">x = a cosθ, y = b sinθ</text></g>
<rect x="180" y="690" width="840" height="36" rx="18" fill="#FBEFEF" stroke="#E5E5EA"/><text x="600" y="714" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#2C2C2E">Off-spec enrichment visual unless official CCEA conics evidence is supplied.</text>
</svg>