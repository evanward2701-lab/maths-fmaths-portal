<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Conic Sections from a Double Cone</title><desc id="desc">Double cone with ellipse and hyperbola slicing planes.</desc>
<rect width="1200" height="760" fill="#FAF9F6"/><rect x="40" y="40" width="1120" height="680" rx="28" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/>
<text x="600" y="95" text-anchor="middle" font-family="Georgia,serif" font-size="34" fill="#2C2C2E" font-weight="700">Conic Sections from a Double Cone</text>
<g transform="translate(170,150)" stroke="#2C2C2E" fill="none"><path d="M300 280 L120 40 M300 280 L480 40 M300 280 L120 520 M300 280 L480 520" stroke-width="4"/><ellipse cx="300" cy="40" rx="180" ry="38" stroke-width="3"/><ellipse cx="300" cy="520" rx="180" ry="38" stroke-width="3"/><polygon points="190,110 370,90 420,170 240,195" fill="#FBEFEF" stroke="#C5A059" stroke-width="3" opacity="0.9"/><ellipse cx="305" cy="145" rx="70" ry="22" stroke="#D4AF37" stroke-width="5"/><polygon points="160,360 260,320 420,520 330,550" fill="#FBEFEF" stroke="#C5A059" stroke-width="3" opacity="0.75"/><path d="M260 340 C310 390 345 465 380 535" stroke="#D4AF37" stroke-width="5"/></g><g font-family="Arial,sans-serif" fill="#2C2C2E"><text x="760" y="260" font-size="28" font-weight="700">Ellipse</text><text x="760" y="300" font-size="18">Plane less steep than cone surface.</text><text x="760" y="470" font-size="28" font-weight="700">Hyperbola</text><text x="760" y="510" font-size="18">Plane steeper, intersects both cones.</text></g>
<rect x="180" y="690" width="840" height="36" rx="18" fill="#FBEFEF" stroke="#E5E5EA"/><text x="600" y="714" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#2C2C2E">Off-spec enrichment visual unless official CCEA conics evidence is supplied.</text>
</svg>