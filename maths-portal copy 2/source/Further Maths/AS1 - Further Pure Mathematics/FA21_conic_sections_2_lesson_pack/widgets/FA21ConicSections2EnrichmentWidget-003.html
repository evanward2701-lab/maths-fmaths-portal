<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Tangent and Normal Trainer</title><style>:root{--canvas:#FAF9F6;--panel:#FFFFF0;--line:#E5E5EA;--accent:#C5A059;--gold:#D4AF37;--blush:#FBEFEF;--ink:#2C2C2E;--muted:#636366}*{box-sizing:border-box}body{margin:0;padding:28px;background:var(--canvas);color:var(--ink);font-family:Inter,Arial,sans-serif;line-height:1.5}main{max-width:1050px;margin:0 auto;background:var(--panel);border:2px solid var(--line);border-radius:28px;padding:28px}h1{font-family:Georgia,serif;text-align:center;font-size:clamp(2rem,4vw,3rem);margin:0 0 8px}.boundary{background:var(--blush);border:1px solid var(--line);border-radius:16px;padding:14px;margin:18px 0}.grid{display:grid;grid-template-columns:360px 1fr;gap:18px}@media(max-width:820px){.grid{grid-template-columns:1fr}}.card{background:var(--canvas);border:1px solid var(--line);border-radius:20px;padding:18px}label{font-weight:700;display:block;margin-top:10px}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px}button{margin-top:16px;width:100%;padding:12px;border:0;border-radius:14px;background:var(--accent);font-weight:800;color:var(--ink);cursor:pointer}.math{font-family:Georgia,serif;background:white;border:1px solid var(--line);border-radius:12px;padding:10px;margin:9px 0;overflow-x:auto}svg{width:100%;background:white;border:1px solid var(--line);border-radius:16px;margin-top:12px}</style></head><body><main><h1>Tangent & Normal Trainer</h1><p style="text-align:center;color:var(--muted)">Choose parametric or implicit style working for conic tangents.</p><section class="boundary"><strong>Boundary note:</strong> Off-spec conics enrichment unless official CCEA conics evidence is supplied.</section><section class="grid"><div class="card"><h2>Input</h2><label>Mode</label><select id="mode"><option value="ellipse">Ellipse parametric</option><option value="hyp">Hyperbola hyperbolic</option></select><label>a</label><input id="a" type="number" value="5"><label>b</label><input id="b" type="number" value="3"><label>parameter value</label><input id="t" type="number" value="1.0471975512"><button onclick="go()">Generate</button></div><div class="card"><h2>Working</h2><div id="out"></div></div></section></main><script>function fmt(x){return Math.abs(x-Math.round(x))<1e-9?String(Math.round(x)):Number(x.toFixed(5)).toString()}function go(){let mode=document.getElementById('mode').value,a=+document.getElementById('a').value,b=+document.getElementById('b').value,t=+document.getElementById('t').value;if(mode==='ellipse'){let x=a*Math.cos(t),y=b*Math.sin(t),m=(b*Math.cos(t))/(-a*Math.sin(t));document.getElementById('out').innerHTML=`<div class=math>P=(${fmt(x)},${fmt(y)})</div><div class=math>dy/dx=(b cosθ)/(−a sinθ)=${fmt(m)}</div><p>Check both x and y when choosing θ.</p>`}else{let x=a*Math.cosh(t),y=b*Math.sinh(t),m=(b*Math.cosh(t))/(a*Math.sinh(t));document.getElementById('out').innerHTML=`<div class=math>P=(${fmt(x)},${fmt(y)})</div><div class=math>dy/dx=(b cosh t)/(a sinh t)=${fmt(m)}</div><p>d(cosh t)/dt = sinh t, not −sinh t.</p>`}}go();</script></body></html>
