<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Locus Eliminator</title><style>:root{--canvas:#FAF9F6;--panel:#FFFFF0;--line:#E5E5EA;--accent:#C5A059;--gold:#D4AF37;--blush:#FBEFEF;--ink:#2C2C2E;--muted:#636366}*{box-sizing:border-box}body{margin:0;padding:28px;background:var(--canvas);color:var(--ink);font-family:Inter,Arial,sans-serif;line-height:1.5}main{max-width:1050px;margin:0 auto;background:var(--panel);border:2px solid var(--line);border-radius:28px;padding:28px}h1{font-family:Georgia,serif;text-align:center;font-size:clamp(2rem,4vw,3rem);margin:0 0 8px}.boundary{background:var(--blush);border:1px solid var(--line);border-radius:16px;padding:14px;margin:18px 0}.grid{display:grid;grid-template-columns:360px 1fr;gap:18px}@media(max-width:820px){.grid{grid-template-columns:1fr}}.card{background:var(--canvas);border:1px solid var(--line);border-radius:20px;padding:18px}label{font-weight:700;display:block;margin-top:10px}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px}button{margin-top:16px;width:100%;padding:12px;border:0;border-radius:14px;background:var(--accent);font-weight:800;color:var(--ink);cursor:pointer}.math{font-family:Georgia,serif;background:white;border:1px solid var(--line);border-radius:12px;padding:10px;margin:9px 0;overflow-x:auto}svg{width:100%;background:white;border:1px solid var(--line);border-radius:16px;margin-top:12px}</style></head><body><main><h1>Locus Eliminator</h1><p style="text-align:center;color:var(--muted)">Eliminate parameters using the correct conic identity.</p><section class="boundary"><strong>Boundary note:</strong> Off-spec conics enrichment unless official CCEA conics evidence is supplied.</section><section class="grid"><div class="card"><h2>Pattern</h2><label>Example</label><select id="pat"><option value="ell">Ellipse tangent midpoint</option><option value="hyp">Hyperbola tangent midpoint</option></select><label>a or A</label><input id="A" type="number" value="4"><label>b or B</label><input id="B" type="number" value="3"><button onclick="go()">Build locus</button></div><div class="card"><h2>Working</h2><div id="out"></div></div></section></main><script>function fmt(x){return Math.abs(x-Math.round(x))<1e-9?String(Math.round(x)):Number(x.toFixed(4)).toString()}function go(){let pat=document.getElementById('pat').value,A=+document.getElementById('A').value,B=+document.getElementById('B').value;if(pat==='ell'){document.getElementById('out').innerHTML=`<div class=math>M=(X,Y)=(${fmt(A/2)}sec t, ${fmt(B/2)}cosec t)</div><div class=math>cos t=${fmt(A)}/(2X), sin t=${fmt(B)}/(2Y)</div><div class=math>${fmt(A*A)}/(4X²)+${fmt(B*B)}/(4Y²)=1</div>`}else{document.getElementById('out').innerHTML=`<div class=math>M=(X,Y)=(${fmt(A)}/(2coshθ), −${fmt(B)}/(2sinhθ))</div><div class=math>${fmt(A*A)}/(4X²)−${fmt(B*B)}/(4Y²)=1</div><div class=math>Y²=(${fmt(B*B)}X²)/(${fmt(A*A)}−4X²)</div><p>Squaring can hide branch restrictions.</p>`}}go();</script></body></html>
