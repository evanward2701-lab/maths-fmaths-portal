<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Standard Form Classifier</title><style>:root{--canvas:#FAF9F6;--panel:#FFFFF0;--line:#E5E5EA;--accent:#C5A059;--gold:#D4AF37;--blush:#FBEFEF;--ink:#2C2C2E;--muted:#636366}*{box-sizing:border-box}body{margin:0;padding:28px;background:var(--canvas);color:var(--ink);font-family:Inter,Arial,sans-serif;line-height:1.5}main{max-width:1050px;margin:0 auto;background:var(--panel);border:2px solid var(--line);border-radius:28px;padding:28px}h1{font-family:Georgia,serif;text-align:center;font-size:clamp(2rem,4vw,3rem);margin:0 0 8px}.boundary{background:var(--blush);border:1px solid var(--line);border-radius:16px;padding:14px;margin:18px 0}.grid{display:grid;grid-template-columns:360px 1fr;gap:18px}@media(max-width:820px){.grid{grid-template-columns:1fr}}.card{background:var(--canvas);border:1px solid var(--line);border-radius:20px;padding:18px}label{font-weight:700;display:block;margin-top:10px}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px}button{margin-top:16px;width:100%;padding:12px;border:0;border-radius:14px;background:var(--accent);font-weight:800;color:var(--ink);cursor:pointer}.math{font-family:Georgia,serif;background:white;border:1px solid var(--line);border-radius:12px;padding:10px;margin:9px 0;overflow-x:auto}svg{width:100%;background:white;border:1px solid var(--line);border-radius:16px;margin-top:12px}</style></head><body><main><h1>Standard Form Classifier</h1><p style="text-align:center;color:var(--muted)">Convert Ax² + By² = C into a recognised conic form.</p><section class="boundary"><strong>Boundary note:</strong> Off-spec conics enrichment unless official CCEA conics evidence is supplied.</section><section class="grid"><div class="card"><h2>Input</h2><label>A in Ax² + By² = C</label><input id="A" type="number" value="4"><label>B</label><input id="B" type="number" value="9"><label>C</label><input id="C" type="number" value="36"><button onclick="go()">Classify</button></div><div class="card"><h2>Output</h2><div id="out"></div><svg viewBox="0 0 500 300"><g id="draw"></g></svg></div></section></main><script>function fmt(x){return Math.abs(x-Math.round(x))<1e-9?String(Math.round(x)):Number(x.toFixed(4)).toString()}function go(){let A=+document.getElementById('A').value,B=+document.getElementById('B').value,C=+document.getElementById('C').value;let dx=C/A,dy=C/B;let out=document.getElementById('out'),draw=document.getElementById('draw');let html=`<div class=math>${fmt(A)}x² ${B>=0?'+':'−'} ${fmt(Math.abs(B))}y² = ${fmt(C)}</div><div class=math>x²/${fmt(dx)} ${dy>=0?'+':'−'} y²/${fmt(Math.abs(dy))} = 1</div>`;draw.innerHTML='<rect width=500 height=300 fill="#FFFFF0"/><line x1=40 y1=150 x2=460 y2=150 stroke="#2C2C2E"/><line x1=250 y1=270 x2=250 y2=30 stroke="#2C2C2E"/>';if(dx>0&&dy>0){html+=dx==dy?'<p><b>Circle</b></p>':'<p><b>Ellipse</b>: a='+fmt(Math.sqrt(dx))+', b='+fmt(Math.sqrt(dy))+'</p>';draw.innerHTML+='<ellipse cx=250 cy=150 rx=135 ry=85 fill=none stroke="#C5A059" stroke-width=5/>'}else if(dx>0&&dy<0){html+='<p><b>Horizontal hyperbola</b>: vertices (±'+fmt(Math.sqrt(dx))+',0), asymptotes y=±('+fmt(Math.sqrt(Math.abs(dy)))+'/'+fmt(Math.sqrt(dx))+')x</p>';draw.innerHTML+='<path d="M310 150 C350 120 410 60 460 30 M310 150 C350 180 410 240 460 270 M190 150 C150 120 90 60 40 30 M190 150 C150 180 90 240 40 270" fill=none stroke="#C5A059" stroke-width=5/>'}else{html+='<p><b>Vertical or unsupported sign pattern.</b></p>'}html+='<p>Error check: standardise to RHS 1 before reading a and b.</p>';out.innerHTML=html}go();</script></body></html>
