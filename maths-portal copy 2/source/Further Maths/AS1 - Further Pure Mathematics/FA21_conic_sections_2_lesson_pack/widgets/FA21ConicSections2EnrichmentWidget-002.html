<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Foci, Directrices and Eccentricity</title><style>:root{--canvas:#FAF9F6;--panel:#FFFFF0;--line:#E5E5EA;--accent:#C5A059;--gold:#D4AF37;--blush:#FBEFEF;--ink:#2C2C2E;--muted:#636366}*{box-sizing:border-box}body{margin:0;padding:28px;background:var(--canvas);color:var(--ink);font-family:Inter,Arial,sans-serif;line-height:1.5}main{max-width:1050px;margin:0 auto;background:var(--panel);border:2px solid var(--line);border-radius:28px;padding:28px}h1{font-family:Georgia,serif;text-align:center;font-size:clamp(2rem,4vw,3rem);margin:0 0 8px}.boundary{background:var(--blush);border:1px solid var(--line);border-radius:16px;padding:14px;margin:18px 0}.grid{display:grid;grid-template-columns:360px 1fr;gap:18px}@media(max-width:820px){.grid{grid-template-columns:1fr}}.card{background:var(--canvas);border:1px solid var(--line);border-radius:20px;padding:18px}label{font-weight:700;display:block;margin-top:10px}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px}button{margin-top:16px;width:100%;padding:12px;border:0;border-radius:14px;background:var(--accent);font-weight:800;color:var(--ink);cursor:pointer}.math{font-family:Georgia,serif;background:white;border:1px solid var(--line);border-radius:12px;padding:10px;margin:9px 0;overflow-x:auto}svg{width:100%;background:white;border:1px solid var(--line);border-radius:16px;margin-top:12px}</style></head><body><main><h1>Foci, Directrices & Eccentricity</h1><p style="text-align:center;color:var(--muted)">Find foci, directrices, eccentricity and asymptotes.</p><section class="boundary"><strong>Boundary note:</strong> Off-spec conics enrichment unless official CCEA conics evidence is supplied.</section><section class="grid"><div class="card"><h2>Input</h2><label>Type</label><select id="type"><option value="ellipse">Ellipse</option><option value="hyperbola">Horizontal hyperbola</option></select><label>a</label><input id="a" type="number" value="3"><label>b</label><input id="b" type="number" value="2"><button onclick="go()">Calculate</button></div><div class="card"><h2>Output</h2><div id="out"></div></div></section></main><script>function fmt(x){return Math.abs(x-Math.round(x))<1e-9?String(Math.round(x)):Number(x.toFixed(4)).toString()}function go(){let type=document.getElementById('type').value,a=+document.getElementById('a').value,b=+document.getElementById('b').value;if(type==='ellipse'){if(a>b){let e=Math.sqrt(a*a-b*b)/a;document.getElementById('out').innerHTML=`<div class=math>b²=a²(1−e²)</div><p>Horizontal ellipse, e=${fmt(e)}, foci (±${fmt(a*e)},0), directrices x=±${fmt(a/e)}</p>`}else{let e=Math.sqrt(b*b-a*a)/b;document.getElementById('out').innerHTML=`<div class=math>a²=b²(1−e²)</div><p>Vertical ellipse, e=${fmt(e)}, foci (0,±${fmt(b*e)}), directrices y=±${fmt(b/e)}</p>`}}else{let e=Math.sqrt(a*a+b*b)/a;document.getElementById('out').innerHTML=`<div class=math>b²=a²(e²−1)</div><p>Hyperbola, e=${fmt(e)}, foci (±${fmt(a*e)},0), directrices x=±${fmt(a/e)}, asymptotes y=±(${fmt(b)}/${fmt(a)})x</p>`}}go();</script></body></html>
