<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Alternative proof triangle with angle θ/2</title>
  <desc id="desc">FA21TFormulaeBoundaryEnrichmentSVG-002: Alternative proof triangle with angle θ/2</desc>
  <rect x="0" y="0" width="1200" height="760" fill="#FAF9F6"/>
  <rect x="32" y="32" width="1136" height="696" rx="28" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="2"/>
  <text x="72" y="88" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#2C2C2E">Alternative proof triangle with angle θ/2</text>
  <path d="M150 420 L520 420 L520 190 Z" fill="#FFFFFF" stroke="#2C2C2E" stroke-width="4"/>
  <path d="M482 420 L482 382 L520 382" fill="none" stroke="#2C2C2E" stroke-width="3"/>
  <path d="M200 420 A 55 55 0 0 1 235 382" fill="none" stroke="#C5A059" stroke-width="4"/>
  <text x="235" y="405" font-family="Arial" font-size="26" fill="#2C2C2E">θ/2</text>
  <text x="324" y="466" font-family="Arial" font-size="32" fill="#2C2C2E">1</text>
  <text x="545" y="318" font-family="Arial" font-size="32" fill="#2C2C2E">t</text>
  <text x="242" y="282" transform="rotate(-31 242 282)" font-family="Arial" font-size="30" fill="#2C2C2E">√(1+t²)</text>
  <rect x="660" y="180" width="420" height="250" rx="18" fill="#FFFFFF" stroke="#C5A059" stroke-width="2"/>
  <text x="690" y="240" font-family="Arial" font-size="24" fill="#2C2C2E">sin(θ/2) = t / √(1+t²)</text>
  <text x="690" y="300" font-family="Arial" font-size="24" fill="#2C2C2E">cos(θ/2) = 1 / √(1+t²)</text>
  <text x="690" y="360" font-family="Arial" font-size="24" fill="#2C2C2E">Use double-angle formulae</text>
  <rect x="110" y="560" width="980" height="70" rx="16" fill="#FAF9F6" stroke="#D4AF37" stroke-width="2"/>
  <text x="140" y="604" font-family="Arial" font-size="24" fill="#2C2C2E">sin θ = 2t/(1+t²),  cos θ = (1−t²)/(1+t²),  tan θ = 2t/(1−t²)</text>
</svg>
