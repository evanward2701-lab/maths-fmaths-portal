<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Bridge from double-angle formulae to t-formulae</title>
  <desc id="desc">FA21TFormulaeBoundaryEnrichmentBridgeSVG-001: Bridge from double-angle formulae to t-formulae</desc>
  <rect x="0" y="0" width="1200" height="760" fill="#FAF9F6"/>
  <rect x="32" y="32" width="1136" height="696" rx="28" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="2"/>
  <text x="72" y="88" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#2C2C2E">Bridge from double-angle formulae to t-formulae</text>
  <rect x="70" y="170" width="420" height="420" rx="22" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="2"/>
  <text x="100" y="225" font-family="Arial" font-size="26" font-weight="700" fill="#2C2C2E">Ordinary A-Level Maths</text>
  <text x="100" y="300" font-family="Arial" font-size="24" fill="#2C2C2E">tan 2A = 2 tan A / (1 − tan² A)</text>
  <text x="100" y="360" font-family="Arial" font-size="24" fill="#2C2C2E">sin 2A = 2 sin A cos A</text>
  <text x="100" y="420" font-family="Arial" font-size="24" fill="#2C2C2E">cos 2A = cos² A − sin² A</text>
  <line x1="520" y1="380" x2="700" y2="380" stroke="#C5A059" stroke-width="6"/>
  <polygon points="700,380 682,368 682,392" fill="#C5A059"/>
  <text x="540" y="340" font-family="Arial" font-size="24" fill="#2C2C2E">Rename tan A as t</text>
  <rect x="730" y="170" width="400" height="420" rx="22" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="2"/>
  <text x="760" y="225" font-family="Arial" font-size="26" font-weight="700" fill="#2C2C2E">Further Pure enrichment</text>
  <text x="760" y="300" font-family="Arial" font-size="24" fill="#2C2C2E">Let t = tan A</text>
  <text x="760" y="360" font-family="Arial" font-size="24" fill="#2C2C2E">sin 2A = 2t / (1 + t²)</text>
  <text x="760" y="420" font-family="Arial" font-size="24" fill="#2C2C2E">cos 2A = (1 − t²) / (1 + t²)</text>
  <text x="760" y="480" font-family="Arial" font-size="24" fill="#2C2C2E">tan 2A = 2t / (1 − t²)</text>
</svg>
