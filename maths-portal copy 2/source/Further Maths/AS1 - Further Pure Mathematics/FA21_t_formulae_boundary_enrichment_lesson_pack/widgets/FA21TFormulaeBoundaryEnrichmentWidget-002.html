<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FA21TFormulaeBoundaryEnrichmentWidget-002</title><style>body{margin:0;font-family:Arial,sans-serif;background:#FAF9F6;color:#2C2C2E}main{max-width:1100px;margin:24px auto;padding:20px}.card{background:#FFFFF0;border:1px solid #E5E5EA;border-radius:24px;padding:24px}.notice{background:#FBEFEF;border:1px solid #C5A059;border-radius:14px;padding:12px;margin:14px 0}.formula,.out{font-family:"Courier New",monospace;background:white;border:1px solid #E5E5EA;border-radius:10px;padding:10px;margin:8px 0}button,input,select{font-size:16px;padding:10px;border-radius:10px;border:1px solid #E5E5EA;margin:6px 0}button{background:#C5A059;color:white;font-weight:700;cursor:pointer}</style></head><body><main><section class="card"><h1>Half-angle range mapper</h1><p>Asset ID: FA21TFormulaeBoundaryEnrichmentWidget-002</p><div class="notice">If 0 ≤ θ ≤ 2π, then 0 ≤ θ/2 ≤ π. Solve tan(θ/2)=t first, then double.</div><label>t = <input id="t" value="-2.732050807568877"></label><button onclick="solve()">Solve for 0 ≤ θ ≤ 2π</button><div id="out"></div></section></main><script>function fmt(x){return x.toFixed(4)}function solve(){const t=Number(document.getElementById('t').value);const base=Math.atan(t);let sols=[];for(let n=-4;n<=4;n++){let u=base+n*Math.PI;if(u>=-1e-10 && u<=Math.PI+1e-10) sols.push(u);}sols=[...new Set(sols.map(x=>x.toFixed(10)))].map(Number).sort((a,b)=>a-b);let h='<div class="formula">Half-angle range: 0 ≤ θ/2 ≤ π</div>';for(const u of sols)h+='<div class="out">θ/2 = '+fmt(u)+' so θ = '+fmt(2*u)+'</div>';h+='<div class="notice">Do not report θ/2 as θ. Double and check original range.</div>';document.getElementById('out').innerHTML=h}solve();</script></body></html>
