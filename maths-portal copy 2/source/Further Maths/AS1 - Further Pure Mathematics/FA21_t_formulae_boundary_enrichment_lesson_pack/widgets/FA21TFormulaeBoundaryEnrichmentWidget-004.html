<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FA21TFormulaeBoundaryEnrichmentWidget-004</title><style>body{margin:0;font-family:Arial,sans-serif;background:#FAF9F6;color:#2C2C2E}main{max-width:1100px;margin:24px auto;padding:20px}.card{background:#FFFFF0;border:1px solid #E5E5EA;border-radius:24px;padding:24px}.notice{background:#FBEFEF;border:1px solid #C5A059;border-radius:14px;padding:12px;margin:14px 0}.formula,.out{font-family:"Courier New",monospace;background:white;border:1px solid #E5E5EA;border-radius:10px;padding:10px;margin:8px 0}button,input,select{font-size:16px;padding:10px;border-radius:10px;border:1px solid #E5E5EA;margin:6px 0}button{background:#C5A059;color:white;font-weight:700;cursor:pointer}</style></head><body><main><section class="card"><h1>Modelling helper: differentiate first, substitute second</h1><p>Asset ID: FA21TFormulaeBoundaryEnrichmentWidget-004</p><button onclick="route()">Recommended route</button><button onclick="stationary()">Stationary points</button><div id="out"></div></section></main><script>function route(){document.getElementById('out').innerHTML='<div class="out">s = sin 4x + 2 sin 2x + 2</div><div class="out">Differentiate first: v = ds/dx = 4 cos 4x + 4 cos 2x</div><div class="out">Then use t = tan x, so sin 2x = 2t/(1+t²), cos 2x = (1-t²)/(1+t²)</div><div class="out">Use cos 4x = cos²2x − sin²2x</div><div class="out">Final form: v = 8(1−3t²)/(1+t²)²</div>'}function stationary(){document.getElementById('out').innerHTML='<div class="out">Set v=0: 8(1−3t²)/(1+t²)² = 0</div><div class="out">Since (1+t²)² > 0, solve 1−3t²=0</div><div class="out">t=±1/√3, so tan x=±1/√3</div><div class="out">For 0≤x≤π, x=π/6, 5π/6</div><div class="notice">Use a second derivative or comparison to identify the maximum.</div>'}route();</script></body></html>
