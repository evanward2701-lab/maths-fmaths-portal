<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FA21TFormulaeBoundaryEnrichmentWidget-003</title><style>body{margin:0;font-family:Arial,sans-serif;background:#FAF9F6;color:#2C2C2E}main{max-width:1100px;margin:24px auto;padding:20px}.card{background:#FFFFF0;border:1px solid #E5E5EA;border-radius:24px;padding:24px}.notice{background:#FBEFEF;border:1px solid #C5A059;border-radius:14px;padding:12px;margin:14px 0}.formula,.out{font-family:"Courier New",monospace;background:white;border:1px solid #E5E5EA;border-radius:10px;padding:10px;margin:8px 0}button,input,select{font-size:16px;padding:10px;border-radius:10px;border:1px solid #E5E5EA;margin:6px 0}button{background:#C5A059;color:white;font-weight:700;cursor:pointer}</style></head><body><main><section class="card"><h1>Identity proof builder</h1><p>Asset ID: FA21TFormulaeBoundaryEnrichmentWidget-003</p><select id="id" onchange="reset()"><option value="0">(1+cosec θ)/cot θ</option><option value="1">tan 2θ cot θ</option></select><button onclick="next()">Reveal next line</button><button onclick="allLines()">Reveal all</button><div id="out"></div></section></main><script>const proofs=[["Let t=tan(θ/2).","cosec θ=(1+t²)/2t and cot θ=(1-t²)/2t.","RHS=(1+t)/(1-t).","LHS=[1+(1+t²)/2t]/[(1-t²)/2t].","LHS=(t²+2t+1)/(1-t²).","LHS=(1+t)²/[(1+t)(1-t)] = (1+t)/(1-t).","Since LHS≡RHS, proven."],["Because the angles are θ and 2θ, let t=tan θ.","tan 2θ=2t/(1-t²), cot θ=1/t.","LHS=2t/(1-t²) × 1/t = 2/(1-t²).","sec 2θ=(1+t²)/(1-t²).","RHS=1+sec 2θ=(1-t²)/(1-t²)+(1+t²)/(1-t²)=2/(1-t²).","Since LHS≡RHS, proven."]];let k=0;function reset(){k=0;render()}function next(){k=Math.min(k+1,proofs[Number(document.getElementById('id').value)].length);render()}function allLines(){k=proofs[Number(document.getElementById('id').value)].length;render()}function render(){const p=proofs[Number(document.getElementById('id').value)];document.getElementById('out').innerHTML=p.slice(0,k).map((x,i)=>'<div class="out">Line '+(i+1)+': '+x+'</div>').join('')}render();</script></body></html>
