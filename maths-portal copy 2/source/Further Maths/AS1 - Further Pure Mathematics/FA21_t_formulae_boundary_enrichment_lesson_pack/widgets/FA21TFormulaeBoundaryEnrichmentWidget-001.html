<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FA21TFormulaeBoundaryEnrichmentWidget-001</title><style>body{margin:0;font-family:Arial,sans-serif;background:#FAF9F6;color:#2C2C2E}main{max-width:1100px;margin:24px auto;padding:20px}.card{background:#FFFFF0;border:1px solid #E5E5EA;border-radius:24px;padding:24px}.notice{background:#FBEFEF;border:1px solid #C5A059;border-radius:14px;padding:12px;margin:14px 0}.formula,.out{font-family:"Courier New",monospace;background:white;border:1px solid #E5E5EA;border-radius:10px;padding:10px;margin:8px 0}button,input,select{font-size:16px;padding:10px;border-radius:10px;border:1px solid #E5E5EA;margin:6px 0}button{background:#C5A059;color:white;font-weight:700;cursor:pointer}</style></head><body><main><section class="card"><h1>t-formula substitution checker</h1><p>Asset ID: FA21TFormulaeBoundaryEnrichmentWidget-001</p><div class="notice">Enter a numeric value of t. This widget checks denominators and computes the three main formulae and reciprocals.</div><label>t = <input id="t" value="0.75"></label><button onclick="calc()">Calculate</button><div id="out"></div></section></main><script>function calc(){const t=Number(document.getElementById('t').value);const op=1+t*t, om=1-t*t, tt=2*t;let h='<div class="formula">1+t²='+op.toFixed(6)+', 1-t²='+om.toFixed(6)+', 2t='+tt.toFixed(6)+'</div>';function v(num,den){return Math.abs(den)<1e-12?'undefined':(num/den).toFixed(6)}h+='<div class="out">sin θ = '+v(tt,op)+'</div>';h+='<div class="out">cos θ = '+v(om,op)+'</div>';h+='<div class="out">tan θ = '+v(tt,om)+'</div>';h+='<div class="out">sec θ = '+v(op,om)+'</div>';h+='<div class="out">cosec θ = '+v(op,tt)+'</div>';h+='<div class="out">cot θ = '+v(om,tt)+'</div>';if(Math.abs(om)<1e-12)h+='<div class="notice">Warning: t=±1 makes tan θ and sec θ undefined.</div>';if(Math.abs(tt)<1e-12)h+='<div class="notice">Warning: t=0 makes cosec θ and cot θ undefined.</div>';document.getElementById('out').innerHTML=h}calc();</script></body></html>
