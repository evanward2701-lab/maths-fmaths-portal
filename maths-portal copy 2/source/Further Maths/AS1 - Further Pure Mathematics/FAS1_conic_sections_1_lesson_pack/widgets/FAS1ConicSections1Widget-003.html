<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>FAS1ConicSections1Widget-003 | Rectangular Hyperbola Parameter Explorer</title><style>
:root{--canvas:#FAF9F6;--ivory:#FFFFF0;--line:#E5E5EA;--gold:#C5A059;--deep:#D4AF37;--rose:#FBEFEF;--ink:#2C2C2E;--muted:#5F5F66;--teal:#6B9FA3;--purple:#8F6C9F}
*{box-sizing:border-box} body{margin:0;background:var(--canvas);color:var(--ink);font-family:Inter,Aptos,'Segoe UI',Arial,sans-serif;line-height:1.5}.widget{max-width:1180px;margin:0 auto;padding:24px}header,.panel,.card{background:var(--ivory);border:1px solid var(--line);border-radius:20px}header{padding:22px 24px;margin-bottom:18px}h1{margin:0 0 6px;font-size:clamp(1.7rem,3vw,2.5rem);letter-spacing:-.03em}.subtitle{margin:0;color:var(--muted)}.layout{display:grid;grid-template-columns:350px 1fr;gap:18px;align-items:start}.panel{padding:18px}h2{margin:0 0 12px;font-size:1.15rem}label{display:block;font-weight:700;margin:14px 0 6px}input[type=range],select,input[type=number]{width:100%}input[type=range]{accent-color:var(--gold)}select,input[type=number]{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:white;color:var(--ink);font:inherit}.readout{margin-top:12px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--canvas);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:1.03rem}.feedback{margin-top:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--gold);background:var(--rose);font-weight:700}canvas{width:100%;height:auto;background:var(--ivory);border:1px solid var(--line);border-radius:20px;display:block}.below{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}.card{padding:14px}.card strong{display:block;margin-bottom:5px}.formula{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:1.03rem}.asset-note{margin-top:18px;color:var(--muted);font-size:.88rem}button{margin-top:14px;width:100%;border:1px solid var(--gold);background:var(--ivory);color:var(--ink);border-radius:12px;padding:10px 12px;font-weight:800;cursor:pointer}button:hover{background:var(--rose)}@media(max-width:900px){.layout,.below{grid-template-columns:1fr}}
</style></head>
<body>
<!-- Asset ID: FAS1ConicSections1Widget-003; Source: AI-proposed teaching enhancement based on rectangular hyperbola evidence; Purpose: Explore x=ct, y=c/t and xy=c^2. -->
<main class="widget"><header><h1>Rectangular Hyperbola Parameter Explorer</h1><p class="subtitle">Move \(c\) and \(t\) to see \(P(ct,c/t)\) travel on \(xy=c^2\). The parameter \(t=0\) is forbidden.</p></header>
<section class="layout"><aside class="panel"><h2>Controls</h2><label for="cv">Constant \(c\): <span id="cval"></span></label><input id="cv" type="range" min="1" max="8" step="0.5" value="4"/><label for="tv">Parameter \(t\): <span id="tval"></span></label><input id="tv" type="range" min="-4" max="4" step="0.25" value="1.5"/><div class="readout" id="pt"></div><div class="readout" id="chk"></div><div class="feedback" id="fb"></div></aside><section><canvas id="plot" width="780" height="520"></canvas><div class="below"><div class="card"><strong>Cartesian</strong><span class="formula">xy=c²</span></div><div class="card"><strong>Parametric</strong><span class="formula">x=ct, y=c/t</span></div></div></section></section></main>
<script>
const can=document.getElementById('plot'),ctx=can.getContext('2d'),cs=document.getElementById('cv'),ts=document.getElementById('tv');
function n(x){return Math.abs(x)<1e-8?'0':(Math.round(x*1000)/1000).toString()}
function S(x,y,v){let p=42;return{x:p+(x-v.x0)*(can.width-2*p)/(v.x1-v.x0),y:can.height-p-(y-v.y0)*(can.height-2*p)/(v.y1-v.y0)}}
function line(x1,y1,x2,y2,v,col,w=1,d=false){let A=S(x1,y1,v),B=S(x2,y2,v);ctx.strokeStyle=col;ctx.lineWidth=w;ctx.setLineDash(d?[8,6]:[]);ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke();ctx.setLineDash([])}
function upd(){let C=+cs.value,T=+ts.value;document.getElementById('cval').textContent=n(C);document.getElementById('tval').textContent=n(T);let bad=Math.abs(T)<1e-9,X=C*T,Y=bad?NaN:C/T;document.getElementById('pt').innerHTML=bad?'P undefined because t=0':'P(ct,c/t)=P('+n(X)+','+n(Y)+')';document.getElementById('chk').innerHTML=bad?'Division by zero':'xy='+n(X*Y)+' and c²='+n(C*C);document.getElementById('fb').textContent=bad?'t=0 is not allowed.':'The sign of t chooses the branch.';let M=Math.max(10,Math.abs(X)+3,Math.abs(Y||0)+3);let v={x0:-M,x1:M,y0:-M,y1:M};ctx.clearRect(0,0,can.width,can.height);ctx.fillStyle='#FFFFF0';ctx.fillRect(0,0,can.width,can.height);line(v.x0,0,v.x1,0,v,'#2C2C2E',2);line(0,v.y0,0,v.y1,v,'#2C2C2E',2);line(0,v.y0,0,v.y1,v,'#8F6C9F',2,true);line(v.x0,0,v.x1,0,v,'#8F6C9F',2,true);ctx.strokeStyle='#C5A059';ctx.lineWidth=4;function branch(a,b){ctx.beginPath();let st=false;for(let i=0;i<=250;i++){let x=a+(b-a)*i/250;if(Math.abs(x)<1e-6)continue;let y=C*C/x;if(y<v.y0||y>v.y1)continue;let p=S(x,y,v);if(!st){ctx.moveTo(p.x,p.y);st=true}else ctx.lineTo(p.x,p.y)}ctx.stroke()}branch(v.x0,-0.05);branch(0.05,v.x1);if(!bad){let p=S(X,Y,v);ctx.fillStyle='#2C2C2E';ctx.beginPath();ctx.arc(p.x,p.y,7,0,7);ctx.fill();ctx.fillText('P',p.x+10,p.y-10)}}
cs.oninput=ts.oninput=upd;upd();
</script></body></html>
