<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>FAS1ConicSections1Widget-001 | Parametric Parabola Explorer</title><style>
:root{--canvas:#FAF9F6;--ivory:#FFFFF0;--line:#E5E5EA;--gold:#C5A059;--deep:#D4AF37;--rose:#FBEFEF;--ink:#2C2C2E;--muted:#5F5F66;--teal:#6B9FA3;--purple:#8F6C9F}
*{box-sizing:border-box} body{margin:0;background:var(--canvas);color:var(--ink);font-family:Inter,Aptos,'Segoe UI',Arial,sans-serif;line-height:1.5}.widget{max-width:1180px;margin:0 auto;padding:24px}header,.panel,.card{background:var(--ivory);border:1px solid var(--line);border-radius:20px}header{padding:22px 24px;margin-bottom:18px}h1{margin:0 0 6px;font-size:clamp(1.7rem,3vw,2.5rem);letter-spacing:-.03em}.subtitle{margin:0;color:var(--muted)}.layout{display:grid;grid-template-columns:350px 1fr;gap:18px;align-items:start}.panel{padding:18px}h2{margin:0 0 12px;font-size:1.15rem}label{display:block;font-weight:700;margin:14px 0 6px}input[type=range],select,input[type=number]{width:100%}input[type=range]{accent-color:var(--gold)}select,input[type=number]{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:white;color:var(--ink);font:inherit}.readout{margin-top:12px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--canvas);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:1.03rem}.feedback{margin-top:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--gold);background:var(--rose);font-weight:700}canvas{width:100%;height:auto;background:var(--ivory);border:1px solid var(--line);border-radius:20px;display:block}.below{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}.card{padding:14px}.card strong{display:block;margin-bottom:5px}.formula{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:1.03rem}.asset-note{margin-top:18px;color:var(--muted);font-size:.88rem}button{margin-top:14px;width:100%;border:1px solid var(--gold);background:var(--ivory);color:var(--ink);border-radius:12px;padding:10px 12px;font-weight:800;cursor:pointer}button:hover{background:var(--rose)}@media(max-width:900px){.layout,.below{grid-template-columns:1fr}}
</style></head>
<body>
<!--
Asset ID: FAS1ConicSections1Widget-001
Source: AI-proposed teaching enhancement based on FP1-Chp2-ConicSections1.pdf and transcripts.md
Related lesson section: Section 10 Interactive Learning Widgets
Purpose: Explore how x=at^2 and y=2at generate the parabola y^2=4ax.
-->
<main class="widget">
<header><h1>Parametric Parabola Explorer</h1><p class="subtitle">Move \(a\) and \(t\) to see \(P(at^2,2at)\) travel on \(y^2=4ax\).</p></header>
<section class="layout"><aside class="panel"><h2>Controls</h2>
<label for="a">Constant \(a\): <span id="av"></span></label><input id="a" type="range" min="0.5" max="5" step="0.5" value="2"/>
<label for="t">Parameter \(t\): <span id="tv"></span></label><input id="t" type="range" min="-4" max="4" step="0.25" value="1.5"/>
<div class="readout" id="pt"></div><div class="readout" id="chk"></div><div class="feedback" id="fb"></div><p class="asset-note">\(a\) fixes the curve; \(t\) selects the point.</p></aside>
<section><canvas id="plot" width="780" height="520"></canvas><div class="below"><div class="card"><strong>Cartesian</strong><span class="formula">y²=4ax</span></div><div class="card"><strong>Parametric</strong><span class="formula">x=at², y=2at</span></div></div></section></section></main>
<script>
const c=document.getElementById('plot'),ctx=c.getContext('2d'),a=document.getElementById('a'),t=document.getElementById('t');
function n(x){return Math.abs(x)<1e-9?'0':(Math.round(x*1000)/1000).toString()}
function S(x,y,v){let p=42;return{x:p+(x-v.x0)*(c.width-2*p)/(v.x1-v.x0),y:c.height-p-(y-v.y0)*(c.height-2*p)/(v.y1-v.y0)}}
function line(x1,y1,x2,y2,v,col,w=1){let A=S(x1,y1,v),B=S(x2,y2,v);ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke()}
function upd(){let A=+a.value,T=+t.value,X=A*T*T,Y=2*A*T;document.getElementById('av').textContent=n(A);document.getElementById('tv').textContent=n(T);document.getElementById('pt').innerHTML='P(at²,2at)=P('+n(X)+','+n(Y)+')';document.getElementById('chk').innerHTML='Check: y²='+n(Y*Y)+' and 4ax='+n(4*A*X);document.getElementById('fb').textContent=T>0?'Positive t gives the upper branch.':T<0?'Negative t gives the lower branch.':'t=0 gives the vertex.';let M=Math.max(6,Math.abs(Y)+3),v={x0:-2*A-1,x1:Math.max(8,X+2,M*M/(4*A)+1),y0:-M,y1:M};ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#FFFFF0';ctx.fillRect(0,0,c.width,c.height);for(let x=Math.ceil(v.x0);x<=v.x1;x++)line(x,v.y0,x,v.y1,v,'#E5E5EA');for(let y=Math.ceil(v.y0);y<=v.y1;y++)line(v.x0,y,v.x1,y,v,'#E5E5EA');line(v.x0,0,v.x1,0,v,'#2C2C2E',2);line(0,v.y0,0,v.y1,v,'#2C2C2E',2);ctx.strokeStyle='#C5A059';ctx.lineWidth=4;ctx.beginPath();let started=false;for(let i=0;i<=300;i++){let y=v.y0+(v.y1-v.y0)*i/300,x=y*y/(4*A),p=S(x,y,v);if(!started){ctx.moveTo(p.x,p.y);started=true}else ctx.lineTo(p.x,p.y)}ctx.stroke();let p=S(X,Y,v);ctx.fillStyle='#2C2C2E';ctx.beginPath();ctx.arc(p.x,p.y,7,0,7);ctx.fill();ctx.fillText('P',p.x+10,p.y-10)}
a.oninput=t.oninput=upd;upd();
</script></body></html>
