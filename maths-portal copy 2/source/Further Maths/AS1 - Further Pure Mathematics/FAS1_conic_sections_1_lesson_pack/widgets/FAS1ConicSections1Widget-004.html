<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>FAS1ConicSections1Widget-004 | Tangent and Normal Builder</title><style>
:root{--canvas:#FAF9F6;--ivory:#FFFFF0;--line:#E5E5EA;--gold:#C5A059;--deep:#D4AF37;--rose:#FBEFEF;--ink:#2C2C2E;--muted:#5F5F66;--teal:#6B9FA3;--purple:#8F6C9F}
*{box-sizing:border-box} body{margin:0;background:var(--canvas);color:var(--ink);font-family:Inter,Aptos,'Segoe UI',Arial,sans-serif;line-height:1.5}.widget{max-width:1180px;margin:0 auto;padding:24px}header,.panel,.card{background:var(--ivory);border:1px solid var(--line);border-radius:20px}header{padding:22px 24px;margin-bottom:18px}h1{margin:0 0 6px;font-size:clamp(1.7rem,3vw,2.5rem);letter-spacing:-.03em}.subtitle{margin:0;color:var(--muted)}.layout{display:grid;grid-template-columns:350px 1fr;gap:18px;align-items:start}.panel{padding:18px}h2{margin:0 0 12px;font-size:1.15rem}label{display:block;font-weight:700;margin:14px 0 6px}input[type=range],select,input[type=number]{width:100%}input[type=range]{accent-color:var(--gold)}select,input[type=number]{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:white;color:var(--ink);font:inherit}.readout{margin-top:12px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--canvas);font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:1.03rem}.feedback{margin-top:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--gold);background:var(--rose);font-weight:700}canvas{width:100%;height:auto;background:var(--ivory);border:1px solid var(--line);border-radius:20px;display:block}.below{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}.card{padding:14px}.card strong{display:block;margin-bottom:5px}.formula{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:1.03rem}.asset-note{margin-top:18px;color:var(--muted);font-size:.88rem}button{margin-top:14px;width:100%;border:1px solid var(--gold);background:var(--ivory);color:var(--ink);border-radius:12px;padding:10px 12px;font-weight:800;cursor:pointer}button:hover{background:var(--rose)}@media(max-width:900px){.layout,.below{grid-template-columns:1fr}}
</style></head>
<body>
<!-- Asset ID: FAS1ConicSections1Widget-004; Source: AI-proposed teaching enhancement based on tangent/normal evidence; Purpose: Build tangent and normal equations for y^2=4ax. -->
<main class="widget"><header><h1>Parabola Tangent and Normal Builder</h1><p class="subtitle">Use parametric differentiation to build the tangent and normal at \(P(at^2,2at)\).</p></header>
<section class="layout"><aside class="panel"><h2>Controls</h2><label for="a">Constant \(a\): <span id="av"></span></label><input id="a" type="range" min="0.5" max="5" step="0.5" value="2"/><label for="t">Parameter \(t\): <span id="tv"></span></label><input id="t" type="range" min="-3" max="3" step="0.25" value="1.5"/><label for="mode">Show</label><select id="mode"><option value="both">Tangent and normal</option><option value="tan">Tangent only</option><option value="norm">Normal only</option></select><div class="readout" id="pt"></div><div class="readout" id="grad"></div><div class="readout">Tangent: \(ty=x+at^2\)<br/>Normal: \(y+tx=2at+at^3\)</div><div class="feedback" id="fb"></div></aside><section><canvas id="plot" width="780" height="520"></canvas><div class="below"><div class="card"><strong>Derivative</strong><span class="formula">dy/dx = (2a)/(2at)=1/t</span></div><div class="card"><strong>Normal gradient</strong><span class="formula">−t</span></div></div></section></section></main>
<script>
const can=document.getElementById('plot'),ctx=can.getContext('2d'),a=document.getElementById('a'),t=document.getElementById('t'),mode=document.getElementById('mode');
function n(x){return Math.abs(x)<1e-8?'0':(Math.round(x*1000)/1000).toString()}
function S(x,y,v){let p=42;return{x:p+(x-v.x0)*(can.width-2*p)/(v.x1-v.x0),y:can.height-p-(y-v.y0)*(can.height-2*p)/(v.y1-v.y0)}}
function line(x1,y1,x2,y2,v,col,w=1){let A=S(x1,y1,v),B=S(x2,y2,v);ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke()}
function upd(){let A=+a.value,T=+t.value,X=A*T*T,Y=2*A*T;document.getElementById('av').textContent=n(A);document.getElementById('tv').textContent=n(T);document.getElementById('pt').innerHTML='P=('+n(X)+','+n(Y)+')';document.getElementById('grad').innerHTML=Math.abs(T)<1e-9?'At t=0 the tangent is x=0.':'dy/dx=1/t='+n(1/T)+'; normal gradient=-t='+n(-T);document.getElementById('fb').textContent='Derive with parametric differentiation, then use point-gradient form.';let M=Math.max(6,Math.abs(Y)+4),v={x0:-4,x1:Math.max(8,X+5,M*M/(4*A)+1),y0:-M,y1:M};ctx.clearRect(0,0,can.width,can.height);ctx.fillStyle='#FFFFF0';ctx.fillRect(0,0,can.width,can.height);line(v.x0,0,v.x1,0,v,'#2C2C2E',2);line(0,v.y0,0,v.y1,v,'#2C2C2E',2);ctx.strokeStyle='#C5A059';ctx.lineWidth=4;ctx.beginPath();let st=false;for(let i=0;i<=300;i++){let y=v.y0+(v.y1-v.y0)*i/300,x=y*y/(4*A),p=S(x,y,v);if(!st){ctx.moveTo(p.x,p.y);st=true}else ctx.lineTo(p.x,p.y)}ctx.stroke();if(mode.value!=='norm'){if(Math.abs(T)<1e-9)line(0,v.y0,0,v.y1,v,'#6B9FA3',3);else line(v.x0,(v.x0+A*T*T)/T,v.x1,(v.x1+A*T*T)/T,v,'#6B9FA3',3)}if(mode.value!=='tan'){line(v.x0,-T*v.x0+2*A*T+A*T*T*T,v.x1,-T*v.x1+2*A*T+A*T*T*T,v,'#8F6C9F',3)}let p=S(X,Y,v);ctx.fillStyle='#2C2C2E';ctx.beginPath();ctx.arc(p.x,p.y,7,0,7);ctx.fill();ctx.fillText('P',p.x+10,p.y-10)}
[a,t,mode].forEach(e=>e.oninput=upd);upd();
</script></body></html>
