<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 640" width="1200" height="640">
<title id="title">Bridge from ordinary A-Level graphs to Further Maths conics</title>
<desc id="desc">Three-panel bridge diagram comparing the ordinary vertical parabola y equals ax squared, the Further Maths horizontal parabola y squared equals 4ax, and the reciprocal graph y equals k over x renamed as the rectangular hyperbola xy equals c squared.</desc>
<!-- Asset ID: FAS1ConicSections1BridgeSVG-001; Source: Ordinary A-Level Maths bridge + Conics 1 evidence; Purpose: Compare prior ordinary Maths graph knowledge with the Further Maths conic extension. -->
<defs><marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#C5A059"/></marker><pattern id="miniGrid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0L0 0 0 32" fill="none" stroke="#E5E5EA" stroke-width="0.7"/></pattern></defs>
<style>.bg{fill:#FAF9F6}.panel{fill:#FFFFF0;stroke:#E5E5EA;stroke-width:1.5;rx:18}.grid{fill:url(#miniGrid)}.title{font:700 30px Inter,Arial,sans-serif;fill:#2C2C2E}.subtitle{font:500 15px Inter,Arial,sans-serif;fill:#55555A}.panelTitle{font:700 18px Inter,Arial,sans-serif;fill:#2C2C2E}.body{font:500 13.5px Inter,Arial,sans-serif;fill:#2C2C2E}.small{font:500 12px Inter,Arial,sans-serif;fill:#55555A}.math{font:600 18px "Cambria Math",serif;fill:#2C2C2E}.axis{stroke:#2C2C2E;stroke-width:2;marker-end:url(#arrowGold)}.curve{fill:none;stroke:#C5A059;stroke-width:4;stroke-linecap:round}.curve2{fill:none;stroke:#D4AF37;stroke-width:4;stroke-linecap:round}.curve3{fill:none;stroke:#8F6C9F;stroke-width:4;stroke-linecap:round}.arrow{stroke:#C5A059;stroke-width:2;fill:none;marker-end:url(#arrowGold)}.note{fill:#FBEFEF;stroke:#C5A059;stroke-width:1.2;rx:14}.focus{fill:#D4AF37;stroke:#2C2C2E;stroke-width:1.3}.directrix{stroke:#8F6C9F;stroke-width:2;stroke-dasharray:7 6}</style>
<rect class="bg" width="1200" height="640"/>
<text class="title" x="55" y="58">A-Level Maths Bridge: ordinary graphs to conics</text>
<text class="subtitle" x="55" y="84">Same algebraic toolkit, upgraded geometry: focus, directrix, asymptote, parameter and locus.</text>
<rect class="panel" x="55" y="125" width="310" height="360"/><text class="panelTitle" x="80" y="160">Ordinary quadratic graph</text><text class="math" x="80" y="192">y = ax²</text><rect class="grid" x="85" y="220" width="240" height="190"/><line class="axis" x1="105" y1="380" x2="310" y2="380"/><line class="axis" x1="205" y1="400" x2="205" y2="235"/><path class="curve" d="M115 245C155 310 180 365 205 380C230 365 255 310 295 245"/><text class="small" x="112" y="455">Usually y is a function of x.</text>
<rect class="panel" x="445" y="125" width="310" height="360"/><text class="panelTitle" x="470" y="160">Further Maths parabola</text><text class="math" x="470" y="192">y² = 4ax</text><rect class="grid" x="475" y="220" width="240" height="190"/><line class="axis" x1="495" y1="315" x2="700" y2="315"/><line class="axis" x1="540" y1="400" x2="540" y2="235"/><line class="directrix" x1="505" y1="235" x2="505" y2="400"/><path class="curve2" d="M690 240C615 260 555 290 540 315C555 340 615 370 690 390"/><circle class="focus" cx="575" cy="315" r="6"/><text class="small" x="490" y="455">Use P(at²,2at), focus and directrix.</text>
<rect class="panel" x="835" y="125" width="310" height="360"/><text class="panelTitle" x="860" y="160">Reciprocal graph upgraded</text><text class="math" x="860" y="192">y = k/x → xy = c²</text><rect class="grid" x="865" y="220" width="240" height="190"/><line class="axis" x1="885" y1="315" x2="1090" y2="315"/><line class="axis" x1="985" y1="400" x2="985" y2="235"/><path class="curve3" d="M1007 238C1035 260 1048 290 1068 308C1082 318 1095 320 1105 321"/><path class="curve3" d="M963 392C935 370 922 340 902 322C888 312 875 310 865 309"/><text class="small" x="875" y="455">Asymptotes: x = 0 and y = 0.</text>
<path class="arrow" d="M365 305C400 305 415 305 444 305"/><path class="arrow" d="M755 305C790 305 805 305 834 305"/>
<rect class="note" x="145" y="526" width="910" height="68"/><text class="panelTitle" x="172" y="557">Key warning</text><text class="body" x="172" y="582">x,y are variables; t,p,q are parameters; a,c are constants fixing the curve.</text>
</svg>