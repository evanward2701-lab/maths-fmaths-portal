<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1000 720" width="1000" height="720">
<title id="title">Coordinate geometry example on y squared equals 8 x</title>
<desc id="desc">A coordinate geometry diagram showing the parabola C: y squared equals 8x, focus S at (2,0), point P at (8,-8), line 4x plus 3y minus 8 equals 0, second intersection Q at (1/2,2), and midpoint M at (17/4,-3).</desc>
<!-- Asset ID: FAS1ConicSections1SVG-004; Source: FP1-Chp2-ConicSections1.pdf coordinate geometry example; Purpose: Preserve the worked coordinate geometry example on a parabola. -->
<defs><marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#C5A059"/></marker><pattern id="unitGrid" width="59.0909" height="40" patternUnits="userSpaceOnUse"><path d="M59.0909 0L0 0 0 40" fill="none" stroke="#E5E5EA" stroke-width="0.8"/></pattern></defs>
<style>.bg{fill:#FAF9F6}.plot{fill:#FFFFF0;stroke:#E5E5EA;stroke-width:1.5;rx:18}.grid{fill:url(#unitGrid)}.title{font:700 28px Inter,Arial,sans-serif;fill:#2C2C2E}.subtitle{font:500 14.5px Inter,Arial,sans-serif;fill:#55555A}.label{font:700 16px Inter,Arial,sans-serif;fill:#2C2C2E}.small{font:500 12px Inter,Arial,sans-serif;fill:#55555A}.math{font:600 17px "Cambria Math",serif;fill:#2C2C2E}.axis{stroke:#2C2C2E;stroke-width:2.2;marker-end:url(#arrowGold)}.curve{fill:none;stroke:#C5A059;stroke-width:4;stroke-linecap:round}.lineL{fill:none;stroke:#6B9FA3;stroke-width:3.3;stroke-linecap:round}.chord{fill:none;stroke:#D4AF37;stroke-width:1.7;stroke-dasharray:6 6}.point{fill:#2C2C2E;stroke:#FFFFF0;stroke-width:3}.focus{fill:#D4AF37;stroke:#2C2C2E;stroke-width:1.5}.mid{fill:#FBEFEF;stroke:#C5A059;stroke-width:2}.box{fill:#FFFFF0;stroke:#E5E5EA;stroke-width:1.3;rx:16}</style>
<rect class="bg" width="1000" height="720"/>
<text class="title" x="55" y="54">Coordinate geometry on a parabola</text><text class="subtitle" x="55" y="80">Example: C: y² = 8x, focus S(2,0), line through S and P(8,−8).</text>
<rect class="plot" x="100" y="80" width="650" height="520"/><rect class="grid" x="100" y="80" width="650" height="520"/>
<line class="axis" x1="100" y1="240" x2="735" y2="240"/><line class="axis" x1="159.1" y1="600" x2="159.1" y2="90"/><text class="small" x="738" y="232">x</text><text class="small" x="171" y="98">y</text>
<path class="curve" d="M277.3 80C210 122 173 176 159.1 240C173 304 210 358 277.3 400C425 480 585 538 676 592"/>
<text class="math" x="310" y="120">C: y² = 8x</text>
<path class="lineL" d="M100 80L675.9 600"/><text class="math" x="475" y="516">l: 4x + 3y − 8 = 0</text>
<line class="chord" x1="631.8" y1="560" x2="188.6" y2="160"/>
<circle class="focus" cx="277.3" cy="240" r="7"/><text class="label" x="286" y="231">S(2,0)</text>
<circle class="point" cx="631.8" cy="560" r="6.5"/><text class="label" x="642" y="557">P(8,−8)</text>
<circle class="point" cx="188.6" cy="160" r="6.5"/><text class="label" x="199" y="154">Q(1/2,2)</text>
<circle class="mid" cx="410.2" cy="360" r="6.5"/><text class="label" x="421" y="356">M(17/4,−3)</text>
<rect class="box" x="780" y="100" width="175" height="180"/><text class="label" x="802" y="133">Focus</text><text class="math" x="802" y="164">y² = 8x</text><text class="math" x="802" y="196">4a = 8</text><text class="math" x="802" y="228">a = 2</text><text class="math" x="802" y="260">S = (2,0)</text>
<rect class="box" x="780" y="306" width="175" height="162"/><text class="label" x="802" y="339">Intersections</text><text class="math" x="802" y="369">P = (8,−8)</text><text class="math" x="802" y="400">Q = (1/2,2)</text><text class="small" x="802" y="430">Use simultaneous equations.</text>
<rect class="box" x="780" y="494" width="175" height="106"/><text class="label" x="802" y="527">Midpoint</text><text class="math" x="802" y="558">M = (17/4,−3)</text>
</svg>