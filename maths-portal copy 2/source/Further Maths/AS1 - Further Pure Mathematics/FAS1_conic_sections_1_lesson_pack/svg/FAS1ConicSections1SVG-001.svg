<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1100 760" width="1100" height="760">
<title id="title">Conic sections from a non-solid double cone</title>
<desc id="desc">A diagram of a non-solid double cone with cutting planes producing circle, ellipse, parabola and hyperbola. It preserves the warning that conics are lines and the shaded plane areas are not included.</desc>
<!--
Asset ID: FAS1ConicSections1SVG-001
Source: FP1-Chp2-ConicSections1.pdf conic-section overview + lesson screenshots visual evidence
Related lesson section: Section 9 Visual Asset Integration
Purpose: Show the four conic families obtained by slicing a non-solid double cone.
-->
<defs>
  <marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#C5A059"/>
  </marker>
  <linearGradient id="planeGold" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#FBEFEF" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#C5A059" stop-opacity="0.35"/>
  </linearGradient>
</defs>
<style>
.bg{fill:#FAF9F6}.card{fill:#FFFFF0;stroke:#E5E5EA;stroke-width:1.5;rx:18}.title{font:700 30px Inter,Arial,sans-serif;fill:#2C2C2E}.subtitle{font:500 15px Inter,Arial,sans-serif;fill:#55555A}.label{font:700 22px Inter,Arial,sans-serif;fill:#2C2C2E}.body{font:500 15px Inter,Arial,sans-serif;fill:#2C2C2E}.small{font:500 12.5px Inter,Arial,sans-serif;fill:#55555A}.math{font:600 17px "Cambria Math",serif;fill:#2C2C2E}.cone{fill:none;stroke:#2C2C2E;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.coneDash{fill:none;stroke:#2C2C2E;stroke-width:1.7;stroke-dasharray:7 7}.plane{fill:url(#planeGold);stroke:#C5A059;stroke-width:1.7}.cut{fill:none;stroke:#C5A059;stroke-width:4;stroke-linecap:round}.warn{fill:#FBEFEF;stroke:#C5A059;stroke-width:1.4;rx:12}.connector{stroke:#C5A059;stroke-width:1.7;fill:none;marker-end:url(#arrowGold)}
</style>
