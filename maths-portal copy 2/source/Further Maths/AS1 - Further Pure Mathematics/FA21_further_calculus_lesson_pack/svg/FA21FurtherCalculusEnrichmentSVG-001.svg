<?xml version="1.0" encoding="UTF-8"?>
<svg width="1500" height="980" viewBox="0 0 1500 980" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">FA21FurtherCalculusEnrichmentSVG-001: Optional Enrichment Islands</title>
  <desc id="desc">A visual map showing Leibnitz's theorem, L'Hospital's rule, and Weierstrass substitution as evidence-backed enrichment islands outside confirmed CCEA-core content.</desc>
  <rect width="1500" height="980" fill="#FAF9F6"/>
  <rect x="70" y="52" width="1360" height="112" rx="30" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/>
  <text x="750" y="100" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#2C2C2E" font-weight="700">Methods in Calculus: Enrichment Islands</text>
  <text x="750" y="140" text-anchor="middle" font-family="Arial" font-size="18" fill="#2C2C2E">Evidence-backed FP1 content, not confirmed as CCEA-core from supplied FA21-FCALC LOs</text>
  <rect x="80" y="205" width="1340" height="680" rx="36" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/>
  <g font-family="Arial" fill="#2C2C2E">
    <g><ellipse cx="360" cy="525" rx="250" ry="210" fill="#FAF9F6" stroke="#D4AF37" stroke-width="4"/><rect x="210" y="350" width="300" height="42" rx="21" fill="#C5A059"/><text x="360" y="378" text-anchor="middle" font-size="20" fill="#FFFFF0" font-weight="700">Leibnitz’s theorem</text><text x="360" y="435" text-anchor="middle" font-size="18" font-weight="700">Product derivatives</text><text x="360" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="24">y⁽ⁿ⁾ = Σ C(n,k)u⁽ᵏ⁾v⁽ⁿ⁻ᵏ⁾</text><text x="360" y="520" text-anchor="middle" font-size="17">“Binomial coefficients</text><text x="360" y="546" text-anchor="middle" font-size="17">of derivatives”</text><rect x="190" y="620" width="340" height="54" rx="20" fill="#FBEFEF" stroke="#E5E5EA" stroke-width="2"/><text x="360" y="643" text-anchor="middle" font-size="14" font-weight="700">Boundary note</text><text x="360" y="664" text-anchor="middle" font-size="13">not confirmed as CCEA-core here</text></g>
    <g><ellipse cx="750" cy="525" rx="250" ry="210" fill="#FAF9F6" stroke="#D4AF37" stroke-width="4"/><rect x="600" y="350" width="300" height="42" rx="21" fill="#C5A059"/><text x="750" y="378" text-anchor="middle" font-size="20" fill="#FFFFF0" font-weight="700">L’Hospital’s rule</text><text x="750" y="435" text-anchor="middle" font-size="18" font-weight="700">Indeterminate limits</text><text x="750" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="24">lim f/g = lim f′/g′</text><text x="750" y="520" text-anchor="middle" font-size="17">Check form first:</text><text x="750" y="548" text-anchor="middle" font-family="Georgia, serif" font-size="22">0/0 or ±∞/±∞</text><rect x="580" y="620" width="340" height="54" rx="20" fill="#FBEFEF" stroke="#E5E5EA" stroke-width="2"/><text x="750" y="643" text-anchor="middle" font-size="14" font-weight="700">Boundary note</text><text x="750" y="664" text-anchor="middle" font-size="13">not confirmed as CCEA-core here</text></g>
    <g><ellipse cx="1140" cy="525" rx="250" ry="210" fill="#FAF9F6" stroke="#D4AF37" stroke-width="4"/><rect x="990" y="350" width="300" height="42" rx="21" fill="#C5A059"/><text x="1140" y="378" text-anchor="middle" font-size="20" fill="#FFFFF0" font-weight="700">Weierstrass substitution</text><text x="1140" y="435" text-anchor="middle" font-size="18" font-weight="700">Trig integration</text><text x="1140" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="24">t = tan(x/2)</text><text x="1140" y="512" text-anchor="middle" font-family="Georgia, serif" font-size="21">dx = 2/(1+t²) dt</text><text x="1140" y="548" text-anchor="middle" font-size="16">turns trig expressions into rational functions</text><rect x="970" y="620" width="340" height="54" rx="20" fill="#FBEFEF" stroke="#E5E5EA" stroke-width="2"/><text x="1140" y="643" text-anchor="middle" font-size="14" font-weight="700">Boundary note</text><text x="1140" y="664" text-anchor="middle" font-size="13">boundary-risk unless confirmed</text></g>
  </g>
  <rect x="215" y="800" width="1070" height="58" rx="29" fill="#FBEFEF" stroke="#D4AF37" stroke-width="3"/>
  <text x="750" y="835" text-anchor="middle" font-family="Arial" font-size="18" fill="#2C2C2E" font-weight="700">Use these for enrichment and fluency. Do not mark them as CCEA-core without official confirmation.</text>
</svg>
