<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="980" viewBox="0 0 1400 980" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">FA21FurtherCalculusSVG-001: CCEA FA21-FCALC Learning Outcome Map</title>
  <desc id="desc">A six-node map showing the official FA21-FCALC Further calculus learning outcomes as the CCEA-core lesson spine.</desc>
  <rect width="1400" height="980" fill="#FAF9F6"/>
  <rect x="70" y="55" width="1260" height="110" rx="28" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/>
  <text x="700" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="36" fill="#2C2C2E" font-weight="700">FA21-FCALC Further Calculus</text>
  <text x="700" y="145" text-anchor="middle" font-family="Arial" font-size="19" fill="#2C2C2E">CCEA-core learning outcome spine: use this map as the boundary guardrail</text>
  <rect x="455" y="215" width="490" height="88" rx="24" fill="#FBEFEF" stroke="#D4AF37" stroke-width="3"/>
  <text x="700" y="253" text-anchor="middle" font-family="Arial" font-size="24" fill="#2C2C2E" font-weight="700">Official topic boundary</text>
  <text x="700" y="283" text-anchor="middle" font-family="Arial" font-size="17" fill="#2C2C2E">Teach as CCEA-core only when supported by the FA21-FCALC LOs</text>
  <g font-family="Arial" fill="#2C2C2E">
    <g><rect x="85" y="370" width="300" height="190" rx="26" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/><rect x="105" y="390" width="110" height="36" rx="18" fill="#C5A059"/><text x="160" y="414" text-anchor="middle" font-size="16" fill="#FFFFF0" font-weight="700">LO001</text><text x="235" y="455" text-anchor="middle" font-size="23" font-weight="700">Improper integrals</text><text x="235" y="495" text-anchor="middle" font-size="16">Undefined integrand</text><text x="235" y="520" text-anchor="middle" font-size="16">or infinite range</text></g>
    <g><rect x="550" y="370" width="300" height="190" rx="26" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/><rect x="570" y="390" width="110" height="36" rx="18" fill="#C5A059"/><text x="625" y="414" text-anchor="middle" font-size="16" fill="#FFFFF0" font-weight="700">LO002</text><text x="700" y="455" text-anchor="middle" font-size="23" font-weight="700">Partial fractions</text><text x="700" y="495" text-anchor="middle" font-size="16">Extended to include</text><text x="700" y="520" text-anchor="middle" font-size="16">quadratic factors</text></g>
    <g><rect x="1015" y="370" width="300" height="190" rx="26" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/><rect x="1035" y="390" width="110" height="36" rx="18" fill="#C5A059"/><text x="1090" y="414" text-anchor="middle" font-size="16" fill="#FFFFF0" font-weight="700">LO003</text><text x="1165" y="455" text-anchor="middle" font-size="23" font-weight="700">Inverse trig</text><text x="1165" y="495" text-anchor="middle" font-size="16">Differentiate inverse</text><text x="1165" y="520" text-anchor="middle" font-size="16">trig functions</text></g>
    <g><rect x="85" y="645" width="300" height="210" rx="26" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/><rect x="105" y="665" width="110" height="36" rx="18" fill="#C5A059"/><text x="160" y="689" text-anchor="middle" font-size="16" fill="#FFFFF0" font-weight="700">LO004</text><text x="235" y="730" text-anchor="middle" font-size="23" font-weight="700">Trig substitutions</text><text x="235" y="770" text-anchor="middle" font-size="16">Integrate forms linked to</text><text x="235" y="800" text-anchor="middle" font-size="17">(a² − x²)⁻¹ᐟ²</text><text x="235" y="830" text-anchor="middle" font-size="17">(a² + x²)⁻¹</text></g>
    <g><rect x="550" y="645" width="300" height="210" rx="26" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/><rect x="570" y="665" width="110" height="36" rx="18" fill="#C5A059"/><text x="625" y="689" text-anchor="middle" font-size="16" fill="#FFFFF0" font-weight="700">LO005</text><text x="700" y="730" text-anchor="middle" font-size="23" font-weight="700">Repeated parts</text><text x="700" y="770" text-anchor="middle" font-size="16">Use repeated</text><text x="700" y="798" text-anchor="middle" font-size="16">integration by parts</text></g>
    <g><rect x="1015" y="645" width="300" height="210" rx="26" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/><rect x="1035" y="665" width="110" height="36" rx="18" fill="#C5A059"/><text x="1090" y="689" text-anchor="middle" font-size="16" fill="#FFFFF0" font-weight="700">LO006</text><text x="1165" y="730" text-anchor="middle" font-size="23" font-weight="700">Reduction formulae</text><text x="1165" y="770" text-anchor="middle" font-size="16">Understand and use</text><text x="1165" y="798" text-anchor="middle" font-size="16">simple reduction formulae</text></g>
  </g>
  <rect x="230" y="910" width="940" height="42" rx="21" fill="#FBEFEF" stroke="#E5E5EA" stroke-width="2"/>
  <text x="700" y="937" text-anchor="middle" font-family="Arial" font-size="17" fill="#2C2C2E">Boundary reminder: uploaded FP1 named methods are enrichment unless CCEA confirmation is supplied.</text>
