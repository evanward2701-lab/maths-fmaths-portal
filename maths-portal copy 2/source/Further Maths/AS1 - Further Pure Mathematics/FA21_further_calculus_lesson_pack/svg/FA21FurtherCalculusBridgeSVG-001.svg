<?xml version="1.0" encoding="UTF-8"?>
<svg width="1500" height="980" viewBox="0 0 1500 980" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">FA21FurtherCalculusBridgeSVG-001: Ordinary A-Level Maths to Further Calculus Bridge</title>
  <desc id="desc">A bridge diagram comparing ordinary A-Level Maths calculus foundations with Further Maths extensions in FA21-FCALC.</desc>
  <rect width="1500" height="980" fill="#FAF9F6"/>
  <rect x="70" y="55" width="1360" height="105" rx="28" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/>
  <text x="750" y="102" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#2C2C2E" font-weight="700">A-Level Maths Bridge: What Further Calculus Changes</text>
  <text x="750" y="140" text-anchor="middle" font-family="Arial" font-size="18" fill="#2C2C2E">Ordinary calculus methods become longer, more strategic, and more specification-sensitive</text>
  <rect x="95" y="205" width="500" height="70" rx="22" fill="#FBEFEF" stroke="#D4AF37" stroke-width="3"/>
  <text x="345" y="249" text-anchor="middle" font-family="Arial" font-size="25" fill="#2C2C2E" font-weight="700">Ordinary A-Level Maths</text>
  <rect x="905" y="205" width="500" height="70" rx="22" fill="#FBEFEF" stroke="#D4AF37" stroke-width="3"/>
  <text x="1155" y="249" text-anchor="middle" font-family="Arial" font-size="25" fill="#2C2C2E" font-weight="700">Further Maths Extension</text>
  <defs><marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#C5A059"/></marker></defs>
  <g font-family="Arial" fill="#2C2C2E">
    <g><rect x="120" y="315" width="450" height="82" rx="20" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/><text x="145" y="350" font-size="19" font-weight="700">Product rule</text><text x="145" y="378" font-size="16">Differentiate y = uv once</text><line x1="570" y1="356" x2="930" y2="356" stroke="#C5A059" stroke-width="3" marker-end="url(#arrowGold)"/><rect x="930" y="315" width="450" height="82" rx="20" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/><text x="955" y="350" font-size="19" font-weight="700">Repeated product structures</text><text x="955" y="378" font-size="16">Enrichment: Leibnitz rows and binomial coefficients</text></g>
    <g><rect x="120" y="425" width="450" height="82" rx="20" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/><text x="145" y="460" font-size="19" font-weight="700">Substitution</text><text x="145" y="488" font-size="16">Change variable to simplify an integral</text><line x1="570" y1="466" x2="930" y2="466" stroke="#C5A059" stroke-width="3" marker-end="url(#arrowGold)"/><rect x="930" y="425" width="450" height="82" rx="20" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/><text x="955" y="460" font-size="19" font-weight="700">Trigonometric substitution</text><text x="955" y="488" font-size="16">CCEA-core: choose substitutions for special forms</text></g>
    <g><rect x="120" y="535" width="450" height="82" rx="20" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/><text x="145" y="570" font-size="19" font-weight="700">Integration by parts</text><text x="145" y="598" font-size="16">Use one product split inside an integral</text><line x1="570" y1="576" x2="930" y2="576" stroke="#C5A059" stroke-width="3" marker-end="url(#arrowGold)"/><rect x="930" y="535" width="450" height="82" rx="20" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/><text x="955" y="570" font-size="19" font-weight="700">Repeated integration by parts</text><text x="955" y="598" font-size="16">CCEA-core: longer chained integration strategy</text></g>
    <g><rect x="120" y="645" width="450" height="82" rx="20" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/><text x="145" y="680" font-size="19" font-weight="700">Partial fractions</text><text x="145" y="708" font-size="16">Split rational functions into simpler terms</text><line x1="570" y1="686" x2="930" y2="686" stroke="#C5A059" stroke-width="3" marker-end="url(#arrowGold)"/><rect x="930" y="645" width="450" height="82" rx="20" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/><text x="955" y="680" font-size="19" font-weight="700">Quadratic factors</text><text x="955" y="708" font-size="16">CCEA-core: partial fractions extended</text></g>
    <g><rect x="120" y="755" width="450" height="82" rx="20" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/><text x="145" y="790" font-size="19" font-weight="700">Trig identities and exact values</text><text x="145" y="818" font-size="16">Use radians, identities, and exact angles</text><line x1="570" y1="796" x2="930" y2="796" stroke="#C5A059" stroke-width="3" marker-end="url(#arrowGold)"/><rect x="930" y="755" width="450" height="82" rx="20" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/><text x="955" y="790" font-size="19" font-weight="700">Reduction formulae</text><text x="955" y="818" font-size="16">CCEA-core: general recurrence-style integral results</text></g>
  </g>
  <rect x="305" y="890" width="890" height="48" rx="24" fill="#FBEFEF" stroke="#E5E5EA" stroke-width="2"/>
  <text x="750" y="920" text-anchor="middle" font-family="Arial" font-size="17" fill="#2C2C2E">Bridge content explains what changes. It does not override the CCEA Further Maths specification.</text>
</svg>
