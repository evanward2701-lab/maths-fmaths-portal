<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FAS1VectorsWidget-004</title><style>body{font-family:Arial;background:#FAF9F6;color:#2C2C2E;margin:0}main{max-width:960px;margin:auto;padding:28px}.card{background:#FFFFF0;border:2px solid #E5E5EA;border-radius:20px;padding:20px;margin:14px 0}input{width:70px;padding:8px;border:1px solid #E5E5EA;border-radius:10px}button{background:#C5A059;border:0;border-radius:999px;padding:10px 16px;font-weight:700}.math{font-family:Georgia}.warn{background:#FBEFEF;border:1px solid #C5A059;border-radius:12px;padding:10px}</style></head><body><main><div class="card"><h1>Direction-Cosines Checker</h1><p>a = (<input id="x" value="-2">, <input id="y" value="3">, <input id="z" value="6">)</p><button onclick="calc()">Check</button></div><div class="card" id="out"></div></main><script>function n(id){return Number(document.getElementById(id).value)}function calc(){let x=n('x'),y=n('y'),z=n('z'),m=Math.sqrt(x*x+y*y+z*z);if(m===0){out.innerHTML='<div class="warn">Zero vector: direction cosines undefined.</div>';return}let ca=x/m,cb=y/m,cg=z/m;out.innerHTML='<p class="math">|a| = '+m.toFixed(5)+'</p><p class="math">cosα = '+ca.toFixed(5)+'</p><p class="math">cosβ = '+cb.toFixed(5)+'</p><p class="math">cosγ = '+cg.toFixed(5)+'</p><p class="math">cos²α + cos²β + cos²γ = '+(ca*ca+cb*cb+cg*cg).toFixed(5)+'</p><div class="warn">Sign warning: a negative component gives a negative direction cosine.</div>'}calc()</script></body></html>
