<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FAS1VectorsWidget-002</title><style>body{font-family:Arial;background:#FAF9F6;color:#2C2C2E;margin:0}main{max-width:960px;margin:auto;padding:28px}.card{background:#FFFFF0;border:2px solid #E5E5EA;border-radius:20px;padding:20px;margin:14px 0}input{width:65px;padding:8px;border:1px solid #E5E5EA;border-radius:10px}button,select{padding:10px 14px;border-radius:12px}button{background:#C5A059;border:0;font-weight:700}.math{font-family:Georgia}</style></head><body><main><div class="card"><h1>Area and Volume Explorer</h1><select id="mode"><option value="tri">Triangle</option><option value="para">Parallelogram</option><option value="pp">Parallelepiped</option><option value="tet">Tetrahedron</option></select><p>a: <input id="a1" value="1"><input id="a2" value="-1"><input id="a3" value="0"></p><p>b: <input id="b1" value="3"><input id="b2" value="4"><input id="b3" value="-6"></p><p>c: <input id="c1" value="-2"><input id="c2" value="1"><input id="c3" value="7"></p><button onclick="calc()">Calculate</button></div><div class="card" id="out"></div></main><script>function n(id){return Number(document.getElementById(id).value)}function v(p){return [n(p+'1'),n(p+'2'),n(p+'3')]}function cross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]}function mag(a){return Math.sqrt(dot(a,a))}function fmt(x){return Number.isInteger(x)?x:x.toFixed(5)}function calc(){let a=v('a'),b=v('b'),c=v('c'),m=document.getElementById('mode').value,axb=cross(a,b),bxc=cross(b,c),out='';if(m==='tri')out='Area = 1/2 |a×b| = '+fmt(0.5*mag(axb));if(m==='para')out='Area = |a×b| = '+fmt(mag(axb));if(m==='pp')out='Volume = |a·(b×c)| = '+Math.abs(dot(a,bxc));if(m==='tet')out='Volume = 1/6 |a·(b×c)| = '+fmt(Math.abs(dot(a,bxc))/6)+'<br>Check same vertex.';document.getElementById('out').innerHTML='<h2 class="math">'+out+'</h2>'}calc()</script></body></html>
