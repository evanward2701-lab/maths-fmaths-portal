<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FAS1VectorsWidget-001</title><style>body{font-family:Arial;background:#FAF9F6;color:#2C2C2E;margin:0}main{max-width:960px;margin:auto;padding:28px}.card{background:#FFFFF0;border:2px solid #E5E5EA;border-radius:20px;padding:20px;margin:14px 0}input{width:70px;padding:8px;border:1px solid #E5E5EA;border-radius:10px}button{background:#C5A059;border:0;border-radius:999px;padding:10px 16px;font-weight:700}.math{font-family:Georgia}.out{background:white;border:1px solid #E5E5EA;border-radius:14px;padding:16px}</style></head><body><main><div class="card"><h1>Cross Product Calculator and Checker</h1><p>Enter vectors <span class="math">a</span> and <span class="math">b</span>. The widget calculates <span class="math">a×b</span> and checks perpendicularity.</p><p>a: <input id="a1" value="2"><input id="a2" value="-3"><input id="a3" value="0"></p><p>b: <input id="b1" value="4"><input id="b2" value="1"><input id="b3" value="-1"></p><button onclick="calc()">Calculate</button></div><div class="card out" id="out"></div></main><script>function n(id){return Number(document.getElementById(id).value)}function cross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]}function fmt(v){return '('+v.join(', ')+')'}function calc(){let a=[n('a1'),n('a2'),n('a3')],b=[n('b1'),n('b2'),n('b3')],c=cross(a,b);document.getElementById('out').innerHTML='<h2 class="math">a × b = '+fmt(c)+'</h2><p class="math">b × a = '+fmt(cross(b,a))+'</p><p>i-component: a₂b₃ − a₃b₂</p><p>j-component: a₃b₁ − a₁b₃</p><p>k-component: a₁b₂ − a₂b₁</p><p class="math">a · (a × b) = '+dot(a,c)+'</p><p class="math">b · (a × b) = '+dot(b,c)+'</p><p><strong>'+(dot(a,c)===0&&dot(b,c)===0?'Check passed':'Check failed')+'</strong></p>'}calc()</script></body></html>
