<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FAS1VectorsWidget-003</title><style>body{font-family:Arial;background:#FAF9F6;color:#2C2C2E;margin:0}main{max-width:960px;margin:auto;padding:28px}.card{background:#FFFFF0;border:2px solid #E5E5EA;border-radius:20px;padding:20px;margin:14px 0}select{width:100%;padding:12px;border-radius:12px}.formula{background:white;border:1px solid #D4AF37;border-radius:14px;padding:14px}.math{font-family:Georgia}</style></head><body><main><div class="card"><h1>Vector Method Selector</h1><select id="sel" onchange="show()"></select></div><div id="out" class="card"></div></main><script>const data={perp:['Vector perpendicular to two vectors','Cross product','n = a × b','Order matters: b×a = −a×b.'],tri:['Triangle area','Cross-product magnitude','A = 1/2 |a × b|','Use side vectors from the same vertex.'],para:['Parallelogram area','Cross-product magnitude','A = |a × b|','Do not halve.'],pp:['Parallelepiped volume','Scalar triple product','V = |a · (b × c)|','Use three vectors from one vertex.'],tet:['Tetrahedron volume','Scalar triple product','V = 1/6 |a · (b × c)|','Do not forget 1/6.'],plane:['Plane from two vectors','Cross product for normal','n = b × c, then r · n = a · n','The vectors must lie in the plane.'],planes:['Line of intersection of planes','Cross normals','direction = n₁ × n₂','If n₁×n₂=0, no unique line.'],skew:['Skew-line distance','Projection onto b×d','d = |(a−c)·(b×d)| / |b×d|','Use for skew lines, not parallel lines.'],angle:['Line-plane angle','Dot product','sinφ = |b·n|/(|b||n|)','This is angle with plane, not with normal.']};let sel=document.getElementById('sel');Object.keys(data).forEach(k=>{let o=document.createElement('option');o.value=k;o.textContent=data[k][0];sel.appendChild(o)});function show(){let d=data[sel.value];document.getElementById('out').innerHTML='<h2>'+d[0]+'</h2><p><strong>Tool:</strong> '+d[1]+'</p><div class="formula math">'+d[2]+'</div><p><strong>Warning:</strong> '+d[3]+'</p>'}show()</script></body></html>
