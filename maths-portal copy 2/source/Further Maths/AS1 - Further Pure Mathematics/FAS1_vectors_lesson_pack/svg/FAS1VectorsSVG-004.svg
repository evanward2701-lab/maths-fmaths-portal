<svg id="FAS1VectorsSVG-004" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Cross-product equation of a line</title><desc id="desc">Shows why r minus a parallel to b gives the cross-product line equation.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#2C2C2E"/></marker><marker id="gold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#C5A059"/></marker></defs><rect width="1200" height="760" fill="#FAF9F6"/><text x="600" y="58" text-anchor="middle" font-family="Georgia" font-size="34" font-weight="700">Why (r − a) × b = 0 Describes a Line</text><path d="M170,500 L710,230" stroke="#C5A059" stroke-width="5"/><circle cx="320" cy="425" r="7" fill="#2C2C2E"/><circle cx="560" cy="305" r="7" fill="#2C2C2E"/><text x="294" y="414" font-family="Georgia" font-size="28">A</text><text x="565" y="294" font-family="Georgia" font-size="28">R</text><path d="M180,555 L320,425" stroke="#2C2C2E" stroke-width="4" marker-end="url(#arr)"/><path d="M180,555 L560,305" stroke="#2C2C2E" stroke-width="4" marker-end="url(#arr)"/><path d="M320,425 L560,305" stroke="#C5A059" stroke-width="4" marker-end="url(#gold)"/><text x="235" y="480" font-family="Georgia" font-size="28">a</text><text x="390" y="410" font-family="Georgia" font-size="28">r</text><text x="430" y="345" font-family="Georgia" font-size="28">r − a</text><rect x="815" y="130" width="315" height="105" rx="18" fill="#FFF8E7" stroke="#D4AF37"/><text x="972" y="195" text-anchor="middle" font-family="Georgia" font-size="28">r = a + λb</text><rect x="815" y="285" width="315" height="125" rx="18" fill="#FFF8E7" stroke="#D4AF37"/><text x="972" y="360" text-anchor="middle" font-family="Georgia" font-size="28">r − a = λb</text><rect x="815" y="460" width="315" height="125" rx="18" fill="#FFF8E7" stroke="#D4AF37"/><text x="972" y="535" text-anchor="middle" font-family="Georgia" font-size="28">(r − a) × b = 0</text></svg>