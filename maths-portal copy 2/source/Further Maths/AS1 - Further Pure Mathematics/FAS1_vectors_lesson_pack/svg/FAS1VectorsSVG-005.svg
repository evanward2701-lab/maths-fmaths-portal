<?xml version="1.0" encoding="UTF-8"?>
<svg id="FAS1VectorsSVG-005" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Direction cosines of a 3D vector</title><desc id="desc">Shows direction cosines as components of a unit vector.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#2C2C2E"/></marker><marker id="gold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#C5A059"/></marker></defs><rect width="1200" height="760" fill="#FAF9F6"/><text x="600" y="58" text-anchor="middle" font-family="Georgia" font-size="34" font-weight="700">Direction Cosines: A Unit Vector in Disguise</text><line x1="330" y1="455" x2="585" y2="455" stroke="#2C2C2E" stroke-width="3" marker-end="url(#arr)"/><line x1="330" y1="455" x2="330" y2="205" stroke="#2C2C2E" stroke-width="3" marker-end="url(#arr)"/><line x1="330" y1="455" x2="185" y2="565" stroke="#2C2C2E" stroke-width="3" marker-end="url(#arr)"/><path d="M330,455 L520,260" stroke="#C5A059" stroke-width="5" marker-end="url(#gold)"/><text x="596" y="461" font-family="Georgia" font-size="27">x</text><text x="318" y="195" font-family="Georgia" font-size="27">z</text><text x="170" y="582" font-family="Georgia" font-size="27">y</text><text x="530" y="255" font-family="Georgia" font-size="27">a</text><rect x="745" y="120" width="370" height="120" rx="18" fill="#FFF8E7" stroke="#D4AF37"/><text x="930" y="195" text-anchor="middle" font-family="Georgia" font-size="27">|a| = √(x² + y² + z²)</text><rect x="745" y="280" width="370" height="160" rx="18" fill="#FFF8E7" stroke="#D4AF37"/><text x="930" y="335" text-anchor="middle" font-family="Georgia" font-size="27">cosα = x / |a|</text><text x="930" y="380" text-anchor="middle" font-family="Georgia" font-size="27">cosβ = y / |a|</text><text x="930" y="425" text-anchor="middle" font-family="Georgia" font-size="27">cosγ = z / |a|</text><rect x="170" y="670" width="860" height="55" rx="18" fill="#FBEFEF" stroke="#C5A059"/><text x="600" y="705" text-anchor="middle" font-family="Georgia" font-size="27">cos²α + cos²β + cos²γ = 1</text></svg>