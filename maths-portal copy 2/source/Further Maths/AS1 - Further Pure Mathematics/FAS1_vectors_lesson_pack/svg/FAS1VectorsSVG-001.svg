<?xml version="1.0" encoding="UTF-8"?>
<svg id="FAS1VectorsSVG-001" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Right-hand rule and non-commutativity</title><desc id="desc">Shows that a cross b points in the opposite direction to b cross a.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#2C2C2E"/></marker><marker id="gold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#C5A059"/></marker></defs><rect width="1200" height="760" fill="#FAF9F6"/><text x="600" y="58" text-anchor="middle" font-family="Georgia" font-size="34" font-weight="700" fill="#2C2C2E">Right-Hand Rule: Order Controls Direction</text><rect x="70" y="105" width="485" height="430" rx="24" fill="#FFFFF0" stroke="#E5E5EA"/><rect x="645" y="105" width="485" height="430" rx="24" fill="#FFFFF0" stroke="#E5E5EA"/><text x="312" y="150" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700">a × b</text><text x="887" y="150" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700">b × a</text><circle cx="300" cy="330" r="5" fill="#2C2C2E"/><path d="M300,330 L455,260" stroke="#2C2C2E" stroke-width="4" marker-end="url(#arr)"/><path d="M300,330 L460,405" stroke="#2C2C2E" stroke-width="4" marker-end="url(#arr)"/><path d="M300,330 L300,180" stroke="#C5A059" stroke-width="5" marker-end="url(#gold)"/><text x="463" y="258" font-family="Georgia" font-size="26">b</text><text x="468" y="412" font-family="Georgia" font-size="26">a</text><text x="318" y="190" font-family="Georgia" font-size="24">a × b</text><circle cx="875" cy="330" r="5" fill="#2C2C2E"/><path d="M875,330 L1035,405" stroke="#2C2C2E" stroke-width="4" marker-end="url(#arr)"/><path d="M875,330 L1030,260" stroke="#2C2C2E" stroke-width="4" marker-end="url(#arr)"/><path d="M875,330 L875,480" stroke="#C5A059" stroke-width="5" marker-end="url(#gold)"/><text x="1044" y="412" font-family="Georgia" font-size="26">b</text><text x="1038" y="258" font-family="Georgia" font-size="26">a</text><text x="886" y="475" font-family="Georgia" font-size="24">b × a = −a × b</text><rect x="160" y="585" width="880" height="105" rx="18" fill="#FFF8E7" stroke="#D4AF37"/><text x="600" y="625" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700">Screw analogy</text><text x="600" y="665" text-anchor="middle" font-family="Arial" font-size="18">turn a → b: up; turn b → a: down</text></svg>