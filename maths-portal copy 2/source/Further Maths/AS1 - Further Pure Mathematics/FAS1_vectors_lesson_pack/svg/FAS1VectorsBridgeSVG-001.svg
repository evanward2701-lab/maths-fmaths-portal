<?xml version="1.0" encoding="UTF-8"?>
<svg id="FAS1VectorsBridgeSVG-001" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">A-Level Maths Bridge to FAS1 Vectors</title><desc id="desc">A two-column bridge diagram comparing ordinary A-Level 2D vector skills with Further Maths 3D vector-product extensions.</desc>
<rect width="1200" height="760" fill="#FAF9F6"/><text x="600" y="58" text-anchor="middle" font-family="Georgia" font-size="34" font-weight="700" fill="#2C2C2E">A-Level Maths Bridge: Vectors Grow Up into 3D</text>
<rect x="70" y="130" width="440" height="500" rx="24" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="2"/><rect x="690" y="130" width="440" height="500" rx="24" fill="#FFF8E7" stroke="#D4AF37" stroke-width="2"/>
<text x="290" y="178" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#2C2C2E">Ordinary A-Level Maths</text><text x="910" y="178" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#2C2C2E">FAS1 Further Maths Upgrade</text>
<text x="120" y="250" font-family="Arial" font-size="19" fill="#2C2C2E">• 2D vectors using i and j</text><text x="120" y="295" font-family="Arial" font-size="19" fill="#2C2C2E">• Magnitude and direction</text><text x="120" y="340" font-family="Arial" font-size="19" fill="#2C2C2E">• Position vectors</text><text x="120" y="385" font-family="Arial" font-size="19" fill="#2C2C2E">• Coordinate geometry lines</text><text x="120" y="430" font-family="Arial" font-size="19" fill="#2C2C2E">• Dot product for angles</text>
<text x="740" y="250" font-family="Arial" font-size="19" fill="#2C2C2E">• 3D vectors using i, j and k</text><text x="740" y="295" font-family="Arial" font-size="19" fill="#2C2C2E">• Cross product creates a normal</text><text x="740" y="340" font-family="Arial" font-size="19" fill="#2C2C2E">• Scalar triple product gives volume</text><text x="740" y="385" font-family="Arial" font-size="19" fill="#2C2C2E">• Vector equations for lines and planes</text><text x="740" y="430" font-family="Arial" font-size="19" fill="#2C2C2E">• Skew lines and shortest distances</text>
<path d="M520,380 C570,335 630,335 680,380" stroke="#C5A059" stroke-width="4" fill="none"/><text x="600" y="350" text-anchor="middle" font-family="Georgia" font-size="26" fill="#2C2C2E">2D geometry → 3D machinery</text>
<rect x="110" y="660" width="980" height="58" rx="16" fill="#FBEFEF" stroke="#C5A059"/><text x="600" y="696" text-anchor="middle" font-family="Arial" font-size="18" fill="#2C2C2E">New risk: old 2D gradient habits do not describe a 3D plane. Use normal vectors.</text></svg>