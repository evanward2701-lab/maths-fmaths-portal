<?xml version="1.0" encoding="UTF-8"?>
<svg id="FAS1VectorsSVG-002" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Cross product determinant expansion</title><desc id="desc">Determinant expansion for a cross b highlighting the negative j component.</desc><rect width="1200" height="760" fill="#FAF9F6"/><text x="600" y="56" text-anchor="middle" font-family="Georgia" font-size="34" font-weight="700" fill="#2C2C2E">Cross Product from a 3 × 3 Determinant</text><rect x="70" y="95" width="1060" height="145" rx="22" fill="#FFFFF0" stroke="#E5E5EA"/><text x="120" y="168" font-family="Georgia" font-size="36" fill="#2C2C2E">a × b = | i  j  k ; a₁ a₂ a₃ ; b₁ b₂ b₃ |</text><text x="120" y="320" font-family="Arial" font-size="24" font-weight="700" fill="#2C2C2E">Expanded components</text><text x="155" y="380" font-family="Georgia" font-size="28">i: a₂b₃ − a₃b₂</text><text x="155" y="440" font-family="Georgia" font-size="28">j: a₃b₁ − a₁b₃</text><text x="155" y="500" font-family="Georgia" font-size="28">k: a₁b₂ − a₂b₁</text><rect x="640" y="285" width="440" height="255" rx="22" fill="#FFFFF0" stroke="#E5E5EA"/><text x="860" y="325" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700">Final column-vector formula</text><text x="790" y="405" font-family="Georgia" font-size="27">(a₂b₃ − a₃b₂,</text><text x="790" y="450" font-family="Georgia" font-size="27"> a₃b₁ − a₁b₃,</text><text x="790" y="495" font-family="Georgia" font-size="27"> a₁b₂ − a₂b₁)</text><rect x="210" y="590" width="780" height="95" rx="18" fill="#FBEFEF" stroke="#C5A059"/><text x="600" y="625" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700">Middle-sign trap</text><text x="600" y="660" text-anchor="middle" font-family="Georgia" font-size="28">−j(a₁b₃ − a₃b₁) = j(a₃b₁ − a₁b₃)</text></svg>