<svg id="FAS1VectorsSVG-003" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Area from cross product magnitude</title><desc id="desc">Parallelogram generated by vectors a and b with area formulas.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#2C2C2E"/></marker><marker id="gold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#C5A059"/></marker></defs><rect width="1200" height="760" fill="#FAF9F6"/><text x="600" y="58" text-anchor="middle" font-family="Georgia" font-size="34" font-weight="700">Area Lives Inside |a × b|</text><polygon points="220,520 560,520 715,265 375,265" fill="#FFF8E7" stroke="#C5A059" stroke-width="3"/><polygon points="220,520 560,520 375,265" fill="#FBEFEF" stroke="#D4AF37" opacity="0.72"/><path d="M220,520 L560,520" stroke="#2C2C2E" stroke-width="4" marker-end="url(#arr)"/><path d="M220,520 L375,265" stroke="#2C2C2E" stroke-width="4" marker-end="url(#arr)"/><path d="M460,392 L460,210" stroke="#C5A059" stroke-width="5" marker-end="url(#gold)"/><text x="385" y="550" font-family="Georgia" font-size="28">a</text><text x="295" y="380" font-family="Georgia" font-size="28">b</text><text x="475" y="220" font-family="Georgia" font-size="28">a × b</text><rect x="780" y="140" width="350" height="130" rx="16" fill="#FFFFFF" stroke="#E5E5EA"/><text x="955" y="210" text-anchor="middle" font-family="Georgia" font-size="28">|a × b| = |a||b|sinθ</text><rect x="780" y="315" width="350" height="130" rx="16" fill="#FFFFFF" stroke="#E5E5EA"/><text x="955" y="390" text-anchor="middle" font-family="Georgia" font-size="28">Triangle = 1/2 |a × b|</text><rect x="780" y="490" width="350" height="130" rx="16" fill="#FFFFFF" stroke="#E5E5EA"/><text x="955" y="565" text-anchor="middle" font-family="Georgia" font-size="28">Parallelogram = |a × b|</text></svg>