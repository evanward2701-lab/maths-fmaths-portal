<?xml version="1.0" encoding="UTF-8"?>
<svg id="FA21InequalitiesSVG-003" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Quartic sign sketch with excluded values</title>
  <desc id="desc">Mathematical visual asset for the FA21 inequalities enrichment lesson.</desc>
  <style>
    .bg{fill:#FAF9F6} .card{fill:#FFFFFF;stroke:#E5E5EA;stroke-width:3} .title{font-family:Arial,sans-serif;font-size:30px;font-weight:700;fill:#2C2C2E} .txt{font-family:Arial,sans-serif;font-size:20px;fill:#2C2C2E} .small{font-family:Arial,sans-serif;font-size:16px;fill:#2C2C2E} .math{font-family:Georgia,serif;font-size:22px;fill:#2C2C2E} .axis{stroke:#2C2C2E;stroke-width:3} .curve{stroke:#2C2C2E;stroke-width:5;fill:none} .gold{stroke:#C5A059;stroke-width:5;fill:none} .dash{stroke:#C5A059;stroke-width:3;stroke-dasharray:10 8;fill:none} .shade{fill:#FBEFEF;stroke:#C5A059;stroke-width:2;opacity:.85} .dot{fill:#C5A059;stroke:#2C2C2E;stroke-width:2} .open{fill:#FFFFFF;stroke:#C5A059;stroke-width:5} .hl{stroke:#C5A059;stroke-width:12;stroke-linecap:round}
  </style>
  <rect class="bg" width="1200" height="720"/>
  <rect class="card" x="50" y="55" width="1100" height="610" rx="24"/>
  <text class="title" x="85" y="105">Quartic sign sketch with excluded values</text>
  
  <text class="math" x="100" y="155">(x+1)(x+3)(x+2)(x-1) ≤ 0</text>
  <line class="axis" x1="100" y1="390" x2="1050" y2="390"/><line class="axis" x1="600" y1="530" x2="600" y2="210"/>
  <path class="curve" d="M130 230 C230 535 305 515 385 390 C470 260 530 260 600 390 C680 530 780 515 860 390 C940 250 1005 230 1040 220"/>
  <line class="hl" x1="250" y1="390" x2="385" y2="390"/><line class="hl" x1="600" y1="390" x2="860" y2="390"/>
  <circle class="open" cx="250" cy="390" r="10"/><circle class="dot" cx="385" cy="390" r="8"/><circle class="open" cx="600" cy="390" r="10"/><circle class="dot" cx="860" cy="390" r="8"/>
  <text class="txt" x="235" y="425">-3</text><text class="txt" x="370" y="425">-2</text><text class="txt" x="585" y="425">-1</text><text class="txt" x="855" y="425">1</text>
  <text class="math" x="100" y="570">Solution: -3 &lt; x ≤ -2 or -1 &lt; x ≤ 1</text>

</svg>
