<?xml version="1.0" encoding="UTF-8"?>
<svg id="FA21InequalitiesSVG-009" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">f(x)=x/(|x|-2) compared with y=2x-5</title>
  <desc id="desc">Mathematical visual asset for the FA21 inequalities enrichment lesson.</desc>
  <style>
    .bg{fill:#FAF9F6} .card{fill:#FFFFFF;stroke:#E5E5EA;stroke-width:3} .title{font-family:Arial,sans-serif;font-size:30px;font-weight:700;fill:#2C2C2E} .txt{font-family:Arial,sans-serif;font-size:20px;fill:#2C2C2E} .small{font-family:Arial,sans-serif;font-size:16px;fill:#2C2C2E} .math{font-family:Georgia,serif;font-size:22px;fill:#2C2C2E} .axis{stroke:#2C2C2E;stroke-width:3} .curve{stroke:#2C2C2E;stroke-width:5;fill:none} .gold{stroke:#C5A059;stroke-width:5;fill:none} .dash{stroke:#C5A059;stroke-width:3;stroke-dasharray:10 8;fill:none} .shade{fill:#FBEFEF;stroke:#C5A059;stroke-width:2;opacity:.85} .dot{fill:#C5A059;stroke:#2C2C2E;stroke-width:2} .open{fill:#FFFFFF;stroke:#C5A059;stroke-width:5} .hl{stroke:#C5A059;stroke-width:12;stroke-linecap:round}
  </style>
  <rect class="bg" width="1200" height="720"/>
  <rect class="card" x="50" y="55" width="1100" height="610" rx="24"/>
  <text class="title" x="85" y="105">f(x)=x/(|x|-2) compared with y=2x-5</text>
  
  <line class="axis" x1="110" y1="430" x2="1080" y2="430"/><line class="axis" x1="600" y1="560" x2="600" y2="130"/>
  <line class="dash" x1="400" y1="560" x2="400" y2="130"/><line class="dash" x1="800" y1="560" x2="800" y2="130"/>
  <path class="curve" d="M150 390 C250 370 340 300 390 150"/><path class="curve" d="M410 560 C480 480 540 445 600 430"/><path class="curve" d="M600 430 C680 405 750 330 790 150"/><path class="curve" d="M815 560 C870 480 950 440 1060 435"/>
  <path class="gold" d="M150 560 L1050 120"/>
  <line class="hl" x1="360" y1="430" x2="400" y2="430"/><line class="hl" x1="715" y1="430" x2="800" y2="430"/><line class="hl" x1="910" y1="430" x2="1080" y2="430"/>
  <text class="txt" x="355" y="465">-√5</text><text class="txt" x="383" y="590">-2</text><text class="txt" x="690" y="465">(5-√5)/2</text><text class="txt" x="787" y="590">2</text><text class="txt" x="875" y="465">(5+√5)/2</text>
  <text class="math" x="110" y="625">Solution: -√5&lt;x&lt;-2 or (5-√5)/2&lt;x&lt;2 or x&gt;(5+√5)/2</text>

</svg>
