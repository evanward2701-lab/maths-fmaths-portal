  <text class="txt" x="112" y="510">0</text><text class="txt" x="315" y="510">5-2√3</text><text class="txt" x="770" y="510">23/3</text><text class="txt" x="920" y="510">5+2√3</text>
  <text class="txt" x="760" y="180">d_A=|5t-31|</text><text class="txt" x="470" y="155">d_B=|3t²-25t+8|</text>
  <text class="math" x="110" y="620">d_A &gt; d_B for 0 ≤ t &lt; 5-2√3 or 23/3 &lt; t &lt; 5+2√3</text>

