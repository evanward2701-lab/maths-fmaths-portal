<svg id="FA21InequalitiesSVG-010" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">(x²-x)/|x-6| &gt; 2x+10</title>
