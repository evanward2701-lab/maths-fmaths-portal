<?xml version="1.0" encoding="UTF-8"?>
<svg id="FA21InequalitiesBridgeSVG-001" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Bridge: ordinary inequalities to rational inequalities</title>
  <desc id="desc">Mathematical visual asset for the FA21 inequalities enrichment lesson.</desc>
  <style>
    .bg{fill:#FAF9F6} .card{fill:#FFFFFF;stroke:#E5E5EA;stroke-width:3} .title{font-family:Arial,sans-serif;font-size:30px;font-weight:700;fill:#2C2C2E} .txt{font-family:Arial,sans-serif;font-size:20px;fill:#2C2C2E} .small{font-family:Arial,sans-serif;font-size:16px;fill:#2C2C2E} .math{font-family:Georgia,serif;font-size:22px;fill:#2C2C2E} .axis{stroke:#2C2C2E;stroke-width:3} .curve{stroke:#2C2C2E;stroke-width:5;fill:none} .gold{stroke:#C5A059;stroke-width:5;fill:none} .dash{stroke:#C5A059;stroke-width:3;stroke-dasharray:10 8;fill:none} .shade{fill:#FBEFEF;stroke:#C5A059;stroke-width:2;opacity:.85} .dot{fill:#C5A059;stroke:#2C2C2E;stroke-width:2} .open{fill:#FFFFFF;stroke:#C5A059;stroke-width:5} .hl{stroke:#C5A059;stroke-width:12;stroke-linecap:round}
  </style>
  <rect class="bg" width="1200" height="720"/>
  <rect class="card" x="50" y="55" width="1100" height="610" rx="24"/>
  <text class="title" x="85" y="105">Bridge: ordinary inequalities to rational inequalities</text>
  
  <text class="txt" x="100" y="155">Ordinary A-Level Maths</text>
  <text class="math" x="100" y="195">2x² &lt; x + 3 → (2x - 3)(x + 1) &lt; 0</text>
  <line class="axis" x1="100" y1="360" x2="500" y2="360"/><line class="axis" x1="300" y1="460" x2="300" y2="250"/>
  <path class="curve" d="M130 285 Q300 485 470 285"/>
  <line class="hl" x1="210" y1="360" x2="395" y2="360"/>
  <text class="small" x="200" y="390">-1</text><text class="small" x="380" y="390">3/2</text>
  <text class="math" x="150" y="520">-1 &lt; x &lt; 3/2</text>
  <text class="txt" x="650" y="155">Further Pure enrichment</text>
  <text class="math" x="650" y="195">rational inequality + excluded values</text>
  <text class="txt" x="650" y="245">1. Write denominator restrictions</text>
  <text class="txt" x="650" y="285">2. Multiply by denominator², not unknown-sign factors</text>
  <text class="txt" x="650" y="325">3. Factorise, sketch, then remove excluded values</text>
  <rect class="shade" x="650" y="380" width="420" height="100" rx="16"/>
  <text class="txt" x="675" y="420">New warning: x - 2 might be positive or negative.</text>
  <text class="txt" x="675" y="455">Use (x - 2)², then check x ≠ 2.</text>

</svg>
