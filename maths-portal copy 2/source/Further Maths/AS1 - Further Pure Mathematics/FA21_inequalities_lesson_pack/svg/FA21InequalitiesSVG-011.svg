<svg id="FA21InequalitiesSVG-011" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Negative quartic sign sketch</title>
  <desc id="desc">Mathematical visual asset for the FA21 inequalities enrichment lesson.</desc>
  <style>
    .bg{fill:#FAF9F6} .card{fill:#FFFFFF;stroke:#E5E5EA;stroke-width:3} .title{font-family:Arial,sans-serif;font-size:30px;font-weight:700;fill:#2C2C2E} .txt{font-family:Arial,sans-serif;font-size:20px;fill:#2C2C2E} .small{font-family:Arial,sans-serif;font-size:16px;fill:#2C2C2E} .math{font-family:Georgia,serif;font-size:22px;fill:#2C2C2E} .axis{stroke:#2C2C2E;stroke-width:3} .curve{stroke:#2C2C2E;stroke-width:5;fill:none} .gold{stroke:#C5A059;stroke-width:5;fill:none} .dash{stroke:#C5A059;stroke-width:3;stroke-dasharray:10 8;fill:none} .shade{fill:#FBEFEF;stroke:#C5A059;stroke-width:2;opacity:.85} .dot{fill:#C5A059;stroke:#2C2C2E;stroke-width:2} .open{fill:#FFFFFF;stroke:#C5A059;stroke-width:5} .hl{stroke:#C5A059;stroke-width:12;stroke-linecap:round}
  </style>
  <rect class="bg" width="1200" height="720"/>
  <rect class="card" x="50" y="55" width="1100" height="610" rx="24"/>
  <text class="title" x="85" y="105">Negative quartic sign sketch</text>
  
  <text class="math" x="100" y="155">(x+1)(x-4)(-x²+3x+3) ≥ 0</text>
  <line class="axis" x1="110" y1="390" x2="1050" y2="390"/><line class="axis" x1="600" y1="530" x2="600" y2="210"/>
  <path class="curve" d="M140 540 C250 250 310 260 365 390 C430 510 495 510 555 390 C630 190 730 210 800 390 C865 520 960 510 1040 540"/>
  <line class="hl" x1="365" y1="390" x2="555" y2="390"/><line class="hl" x1="800" y1="390" x2="960" y2="390"/>
  <circle class="open" cx="365" cy="390" r="10"/><circle class="dot" cx="555" cy="390" r="8"/><circle class="dot" cx="800" cy="390" r="8"/><circle class="open" cx="960" cy="390" r="10"/>
  <text class="txt" x="357" y="425">-1</text><text class="txt" x="490" y="455">(3-√21)/2</text><text class="txt" x="735" y="455">(3+√21)/2</text><text class="txt" x="955" y="425">4</text>
  <text class="math" x="100" y="620">Solution: -1&lt;x≤(3-√21)/2 or (3+√21)/2≤x&lt;4</text>

