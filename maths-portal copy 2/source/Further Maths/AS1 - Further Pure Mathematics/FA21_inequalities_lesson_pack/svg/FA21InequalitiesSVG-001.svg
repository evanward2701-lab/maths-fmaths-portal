<?xml version="1.0" encoding="UTF-8"?>
<svg id="FA21InequalitiesSVG-001" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Unsafe multiplication: 1/x &gt; x</title>
  <desc id="desc">Mathematical visual asset for the FA21 inequalities enrichment lesson.</desc>
  <style>
    .bg{fill:#FAF9F6} .card{fill:#FFFFFF;stroke:#E5E5EA;stroke-width:3} .title{font-family:Arial,sans-serif;font-size:30px;font-weight:700;fill:#2C2C2E} .txt{font-family:Arial,sans-serif;font-size:20px;fill:#2C2C2E} .small{font-family:Arial,sans-serif;font-size:16px;fill:#2C2C2E} .math{font-family:Georgia,serif;font-size:22px;fill:#2C2C2E} .axis{stroke:#2C2C2E;stroke-width:3} .curve{stroke:#2C2C2E;stroke-width:5;fill:none} .gold{stroke:#C5A059;stroke-width:5;fill:none} .dash{stroke:#C5A059;stroke-width:3;stroke-dasharray:10 8;fill:none} .shade{fill:#FBEFEF;stroke:#C5A059;stroke-width:2;opacity:.85} .dot{fill:#C5A059;stroke:#2C2C2E;stroke-width:2} .open{fill:#FFFFFF;stroke:#C5A059;stroke-width:5} .hl{stroke:#C5A059;stroke-width:12;stroke-linecap:round}
  </style>
  <rect class="bg" width="1200" height="720"/>
  <rect class="card" x="50" y="55" width="1100" height="610" rx="24"/>
  <text class="title" x="85" y="105">Unsafe multiplication: 1/x &gt; x</text>
  
  <text class="math" x="110" y="160">Unsafe: multiply by x → 1 &gt; x² → -1 &lt; x &lt; 1</text>
  <text class="txt" x="110" y="205">Wrong because the sign of x is unknown.</text>
  <line class="axis" x1="110" y1="390" x2="520" y2="390"/><line class="axis" x1="315" y1="490" x2="315" y2="270"/>
  <path class="curve" d="M145 305 Q315 520 485 305"/>
  <line class="hl" x1="225" y1="390" x2="405" y2="390"/>
  <text class="small" x="218" y="420">-1</text><text class="small" x="402" y="420">1</text>
  <text class="math" x="650" y="160">Safe: multiply by x² &gt; 0</text>
  <text class="math" x="650" y="205">x &gt; x³ → x³ - x &lt; 0</text>
  <line class="axis" x1="650" y1="390" x2="1070" y2="390"/><line class="axis" x1="860" y1="490" x2="860" y2="270"/>
  <path class="curve" d="M670 480 C760 470 760 315 860 390 C960 465 960 315 1050 300"/>
  <line class="hl" x1="665" y1="390" x2="775" y2="390"/><line class="hl" x1="865" y1="390" x2="965" y2="390"/>
  <text class="small" x="765" y="420">-1</text><text class="small" x="855" y="420">0</text><text class="small" x="960" y="420">1</text>
  <text class="math" x="660" y="555">Correct: x &lt; -1 or 0 &lt; x &lt; 1</text>

</svg>
