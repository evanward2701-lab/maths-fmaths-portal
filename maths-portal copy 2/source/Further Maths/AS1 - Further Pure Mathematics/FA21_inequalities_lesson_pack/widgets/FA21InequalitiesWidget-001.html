<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FA21InequalitiesWidget-001</title><style>body{font-family:Arial,sans-serif;background:#FAF9F6;color:#2C2C2E;margin:0}.wrap{max-width:1000px;margin:auto;padding:28px}.card{background:white;border:1px solid #E5E5EA;border-radius:22px;padding:24px}input,select,button{width:100%;box-sizing:border-box;border:1px solid #E5E5EA;border-radius:14px;padding:12px;margin:6px 0 14px}button{background:#C5A059;color:white;font-weight:bold}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.box{border:1px solid #E5E5EA;border-radius:18px;padding:16px;margin-top:16px}.soft{background:#FBEFEF;border-color:#C5A059}table{width:100%;border-collapse:collapse}td,th{border:1px solid #E5E5EA;padding:8px;text-align:center}.ok{color:#2c6b3f;font-weight:bold}.bad{color:#8a3a3a;font-weight:bold}</style></head><body><div class="wrap"><div class="card"><h1>Rational Inequality Sign-Chart Builder</h1><p>Enter critical roots and excluded denominator values. The widget builds a sign chart and reminds you which endpoints are open or closed.</p><div class="grid"><div><label>Critical roots</label><input id="roots" value="-3,-2,-1,1"></div><div><label>Excluded values</label><input id="excluded" value="-3,-1"></div><div><label>Inequality</label><select id="ineq"><option value="<">&lt; 0</option><option selected value="<=">≤ 0</option><option value=">">&gt; 0</option><option value=">=">≥ 0</option></select></div><div><label>Leading sign</label><select id="lead"><option value="positive">positive</option><option value="negative">negative</option></select></div></div><button onclick="build()">Build sign chart</button><div id="out"></div></div></div><script>function list(id){return document.getElementById(id).value.split(',').map(s=>Number(s.trim())).filter(Number.isFinite).sort((a,b)=>a-b)}function signAt(x,roots,lead){let p=lead==='positive'?1:-1;for(const r of roots)p*=x-r;return p>0?'+':'-'}function sat(s,ineq){return ineq.includes('<')?s==='-':s==='+'}function mid(a,b){if(a===-Infinity)return b-1;if(b===Infinity)return a+1;return(a+b)/2}function build(){const roots=[...new Set(list('roots'))];const ex=list('excluded');const ineq=document.getElementById('ineq').value;const lead=document.getElementById('lead').value;const pts=[-Infinity,...roots,Infinity];let rows='',sol=[];for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],m=mid(a,b),s=signAt(m,roots,lead),yes=sat(s,ineq);if(yes)sol.push((a===-Infinity?'x < '+b:b===Infinity?'x > '+a:a+' < x < '+b));rows+=`<tr><td>${a===-Infinity?'-∞':a}</td><td>${b===Infinity?'∞':b}</td><td>${m.toFixed(2)}</td><td>${s}</td><td class="${yes?'ok':'bad'}">${yes?'select':'reject'}</td></tr>`}let erows=roots.map(r=>`<tr><td>${r}</td><td>${ex.includes(r)?'yes':'no'}</td><td>${(ineq.includes('=')&&!ex.includes(r))?'closed':'open'}</td></tr>`).join('');document.getElementById('out').innerHTML=`<div class="box"><h2>Sign chart</h2><table><tr><th>left</th><th>right</th><th>test</th><th>sign</th><th>interval</th></tr>${rows}</table></div><div class="box"><h2>Endpoint check</h2><table><tr><th>root</th><th>excluded?</th><th>marker</th></tr>${erows}</table></div><div class="box soft"><b>Interval skeleton:</b> ${sol.join(' or ')}</div>`}build()</script></body></html>
