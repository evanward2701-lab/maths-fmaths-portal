<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FA21InequalitiesWidget-003</title><style>body{font-family:Arial,sans-serif;background:#FAF9F6;color:#2C2C2E;margin:0}.wrap{max-width:1000px;margin:auto;padding:28px}.card{background:white;border:1px solid #E5E5EA;border-radius:22px;padding:24px}canvas{width:100%;border:1px solid #E5E5EA;border-radius:18px;background:white}.box{border:1px solid #E5E5EA;border-radius:18px;padding:16px;margin-top:16px}.soft{background:#FBEFEF;border-color:#C5A059}select,button{width:100%;box-sizing:border-box;border:1px solid #E5E5EA;border-radius:14px;padding:12px;margin:6px 0 14px}button{background:#C5A059;color:white;font-weight:bold}.math{font-family:Georgia,serif;font-size:20px}</style></head><body><div class="wrap"><div class="card"><h1>Graphical Inequality Comparator</h1><p>Compare y = 7x/(3x+1) with y = 4-x. Intersections are not the whole story: the asymptote also splits the solution.</p><select id="ineq"><option value="<">7x/(3x+1) &lt; 4-x</option><option value=">">7x/(3x+1) &gt; 4-x</option></select><button onclick="draw()">Draw and solve</button><canvas id="c" width="900" height="500"></canvas><div class="box soft" id="ans"></div></div></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d');let xmin=-3.5,xmax=5.2,ymin=-2.5,ymax=7,m=45;function sx(x){return m+(x-xmin)/(xmax-xmin)*(c.width-2*m)}function sy(y){return m+(ymax-y)/(ymax-ymin)*(c.height-2*m)}function f(x){return 7*x/(3*x+1)}function g(x){return 4-x}function plot(fn,a,b,col){ctx.strokeStyle=col;ctx.lineWidth=4;ctx.beginPath();let started=false;for(let i=0;i<=700;i++){let x=a+(b-a)*i/700,y=fn(x);if(!isFinite(y)||y<ymin-5||y>ymax+5){started=false;continue}let X=sx(x),Y=sy(y);if(!started){ctx.moveTo(X,Y);started=true}else ctx.lineTo(X,Y)}ctx.stroke()}function shade(a,b){ctx.fillStyle='#FBEFEF';ctx.fillRect(sx(a),sy(0)-8,sx(b)-sx(a),16)}function draw(){ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.strokeStyle='#2C2C2E';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(sx(xmin),sy(0));ctx.lineTo(sx(xmax),sy(0));ctx.stroke();ctx.beginPath();ctx.moveTo(sx(0),sy(ymin));ctx.lineTo(sx(0),sy(ymax));ctx.stroke();let v=document.getElementById('ineq').value;if(v==='<'){shade(xmin,-2/3);shade(-1/3,2);document.getElementById('ans').innerHTML='<div class="math">Solution: x &lt; -2/3 or -1/3 &lt; x &lt; 2</div>'}else{shade(-2/3,-1/3);shade(2,xmax);document.getElementById('ans').innerHTML='<div class="math">Solution: -2/3 &lt; x &lt; -1/3 or x &gt; 2</div>'}ctx.setLineDash([8,6]);ctx.strokeStyle='#C5A059';ctx.beginPath();ctx.moveTo(sx(-1/3),m);ctx.lineTo(sx(-1/3),c.height-m);ctx.stroke();ctx.beginPath();ctx.moveTo(m,sy(7/3));ctx.lineTo(c.width-m,sy(7/3));ctx.stroke();ctx.setLineDash([]);plot(f,xmin,-0.345,'#2C2C2E');plot(f,-0.321,xmax,'#2C2C2E');plot(g,xmin,xmax,'#C5A059');ctx.fillStyle='#2C2C2E';ctx.font='16px Arial';ctx.fillText('x=-1/3 asymptote',sx(-1/3)+8,460);ctx.fillText('intersections: x=-2/3, 2',55,30)}draw()</script></body></html>
