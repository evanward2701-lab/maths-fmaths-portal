<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FA21InequalitiesWidget-002</title><style>body{font-family:Arial,sans-serif;background:#FAF9F6;color:#2C2C2E;margin:0}.wrap{max-width:1000px;margin:auto;padding:28px}.card{background:#fff;border:1px solid #E5E5EA;border-radius:22px;padding:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.box{border:1px solid #E5E5EA;border-radius:18px;padding:16px}.soft{background:#FBEFEF;border-color:#C5A059}select,input,button{width:100%;box-sizing:border-box;border:1px solid #E5E5EA;border-radius:14px;padding:12px;margin:6px 0 14px}button{background:#C5A059;color:white;font-weight:bold}.math{font-family:Georgia,serif;font-size:19px;line-height:1.6}.bad{color:#8a3a3a}.ok{color:#2c6b3f}</style></head><body><div class="wrap"><div class="card"><h1>Denominator-Squared Safety Check</h1><p>Do not multiply by an unknown-sign expression. Use a squared denominator instead.</p><div class="grid"><div><select id="ex"><option value="one">1/x &gt; x</option><option value="two">x²/(x-2) &lt; x+1</option></select><label>Test x</label><input id="x" type="number" value="-0.5" step="0.1"><button onclick="render()">Check</button></div><div class="box soft" id="msg"></div></div><div class="grid" style="margin-top:18px"><div class="box"><h2>Unsafe shortcut</h2><div class="math" id="bad"></div></div><div class="box"><h2>Safe method</h2><div class="math" id="good"></div></div></div></div></div><script>function actual(name,x){if(name==='one'){if(x===0)return null;return 1/x>x}if(x===2)return null;return x*x/(x-2)<x+1}function shortcut(name,x){if(name==='one')return x>-1&&x<1;return x>-2&&x<2}function render(){let name=document.getElementById('ex').value,x=Number(document.getElementById('x').value);document.getElementById('bad').innerHTML=name==='one'?'1/x &gt; x → multiply by x → 1 &gt; x² → -1 &lt; x &lt; 1<br><span class="bad">Unsafe because x may be negative.</span>':'Multiplying by x-2 is unsafe because x-2 changes sign.';document.getElementById('good').innerHTML=name==='one'?'x² &gt; 0, so x &gt; x³ → x³-x &lt; 0 → <span class="ok">x&lt;-1 or 0&lt;x&lt;1</span>':'(x-2)² &gt; 0, so (x-2)(x+2)&lt;0 → <span class="ok">-2&lt;x&lt;2</span>';let a=actual(name,x),s=shortcut(name,x);document.getElementById('msg').innerHTML=a===null?`x=${x} is undefined in the original.`:`Original: <b>${a}</b><br>Unsafe shortcut predicts: <b>${s}</b><br>${a===s?'They agree here, but the method is still invalid.':'They disagree: the shortcut trap has snapped shut.'}`}render()</script></body></html>
