<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FA21InequalitiesWidget-004</title><style>body{font-family:Arial,sans-serif;background:#FAF9F6;color:#2C2C2E;margin:0}.wrap{max-width:1000px;margin:auto;padding:28px}.card{background:white;border:1px solid #E5E5EA;border-radius:22px;padding:24px}select,button{width:100%;box-sizing:border-box;border:1px solid #E5E5EA;border-radius:14px;padding:12px;margin:6px 0 14px}button{background:#C5A059;color:white;font-weight:bold}.box{border:1px solid #E5E5EA;border-radius:18px;padding:16px;margin-top:16px}.soft{background:#FBEFEF;border-color:#C5A059}.keep{color:#2c6b3f;font-weight:bold}.reject{color:#8a3a3a;font-weight:bold}.math{font-family:Georgia,serif;font-size:20px;line-height:1.6}</style></head><body><div class="wrap"><div class="card"><h1>Modulus Branch Validator</h1><p>Branch equations can produce real-looking roots that are phantom. Select a problem and check which boundaries survive the graph.</p><select id="p"><option value="a">|x²-4x| &lt; 3</option><option value="b" selected>|x²-19| ≤ 5(x-1)</option><option value="c">|x²+2x-8| ≤ 2-x</option></select><button onclick="render()">Render branch check</button><div class="box" id="branches"></div><div class="box soft" id="answer"></div></div></div><script>const data={a:{b1:'x²-4x=3 gives x=2±√7',b2:'-(x²-4x)=3 gives x=1 or 3',c:[['2-√7','keep'],['1','keep'],['3','keep'],['2+√7','keep']],s:'2-√7 < x < 1 or 3 < x < 2+√7'},b:{b1:'x²-19=5(x-1) gives x=-2 or 7',b2:'-(x²-19)=5(x-1) gives x=-8 or 3',c:[['-8','reject'],['-2','reject'],['3','keep'],['7','keep']],s:'3 ≤ x ≤ 7'},c:{b1:'x²+2x-8=2-x gives x=-5 or 2',b2:'-(x²+2x-8)=2-x gives x=-3 or 2',c:[['-5','keep'],['-3','keep'],['2','keep isolated']],s:'-5 ≤ x ≤ -3 or x = 2'}};function render(){let d=data[document.getElementById('p').value];document.getElementById('branches').innerHTML=`<div class="math">${d.b1}<br>${d.b2}</div>`+d.c.map(r=>`<p><b>${r[0]}</b>: <span class="${r[1].startsWith('keep')?'keep':'reject'}">${r[1]}</span></p>`).join('');document.getElementById('answer').innerHTML=`<h2>Final solution</h2><div class="math">${d.s}</div><p>The graph is the referee: keep true boundaries and reject phantom roots.</p>`}render()</script></body></html>
