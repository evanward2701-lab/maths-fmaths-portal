<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="820" viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">Vector Field for dy/dx equals 2x</title><desc id="desc">Tangent field showing local gradient marks and parabolic solution curves y equals x squared plus c.</desc><rect width="1200" height="820" fill="#FAF9F6"/><rect x="60" y="45" width="1080" height="80" rx="20" fill="#FFFFF0" stroke="#E5E5EA"/><text x="600" y="86" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#2C2C2E">Vector Field / Tangent Field</text><text x="600" y="113" text-anchor="middle" font-family="Arial" font-size="18" fill="#2C2C2E">For dy/dx = 2x, visible solution curves are y = x² + c</text><rect x="90" y="155" width="650" height="560" rx="18" fill="white" stroke="#E5E5EA"/><line x1="170" y1="435" x2="660" y2="435" stroke="#2C2C2E" stroke-width="3" marker-end="url(#ad)"/><line x1="415" y1="650" x2="415" y2="220" stroke="#2C2C2E" stroke-width="3" marker-end="url(#ad)"/><text x="675" y="444" font-family="Arial" font-size="20" fill="#2C2C2E">x</text><text x="402" y="215" font-family="Arial" font-size="20" fill="#2C2C2E">y</text><g stroke="#3D5A80" stroke-width="3" stroke-linecap="round" opacity=".82"><line x1="187" y1="271" x2="203" y2="239"/><line x1="187" y1="451" x2="203" y2="419"/><line x1="187" y1="631" x2="203" y2="599"/><line x1="294" y1="266" x2="316" y2="244"/><line x1="294" y1="446" x2="316" y2="424"/><line x1="294" y1="626" x2="316" y2="604"/><line x1="397" y1="255" x2="433" y2="255"/><line x1="397" y1="435" x2="433" y2="435"/><line x1="397" y1="615" x2="433" y2="615"/><line x1="514" y1="244" x2="536" y2="266"/><line x1="514" y1="424" x2="536" y2="446"/><line x1="514" y1="604" x2="536" y2="626"/><line x1="627" y1="239" x2="643" y2="271"/><line x1="627" y1="419" x2="643" y2="451"/><line x1="627" y1="599" x2="643" y2="631"/></g><path d="M195 435 C260 390 335 370 415 368 C500 370 575 390 635 435" fill="none" stroke="#C5A059" stroke-width="4"/><path d="M195 555 C260 510 335 490 415 488 C500 490 575 510 635 555" fill="none" stroke="#D4AF37" stroke-width="4"/><path d="M195 315 C260 270 335 250 415 248 C500 250 575 270 635 315" fill="none" stroke="#C5A059" stroke-width="4" opacity=".75"/><circle cx="485" cy="370" r="7" fill="#2C2C2E"/><rect x="785" y="175" width="320" height="405" rx="20" fill="white" stroke="#E5E5EA"/><text x="945" y="220" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#2C2C2E">What the field means</text><text x="815" y="275" font-family="Arial" font-size="18" fill="#2C2C2E">Each blue mark shows</text><text x="815" y="303" font-family="Arial" font-size="18" fill="#2C2C2E">the local gradient.</text><text x="815" y="360" font-family="Arial" font-size="18" fill="#2C2C2E">Following the marks</text><text x="815" y="388" font-family="Arial" font-size="18" fill="#2C2C2E">traces a solution curve.</text><rect x="805" y="610" width="280" height="62" rx="16" fill="#FBEFEF" stroke="#D4AF37"/><text x="945" y="647" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#2C2C2E">Off-spec enrichment visual</text><defs><marker id="ad" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2C2C2E"/></marker></defs></svg>