<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="780" viewBox="0 0 1200 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">Euler's Method Step and Error</title><desc id="desc">One Euler step showing h, vertical rise, predicted point, actual curve point and error.</desc><rect width="1200" height="780" fill="#FAF9F6"/><rect x="60" y="38" width="1080" height="82" rx="20" fill="#FFFFF0" stroke="#E5E5EA"/><text x="600" y="77" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#2C2C2E">Euler's Method: One Tangent Step</text><text x="600" y="105" text-anchor="middle" font-family="Arial" font-size="18" fill="#2C2C2E">Predicted point follows the tangent, not the curve itself</text><rect x="80" y="150" width="690" height="500" rx="18" fill="white" stroke="#E5E5EA"/><line x1="140" y1="580" x2="705" y2="580" stroke="#2C2C2E" stroke-width="3" marker-end="url(#a)"/><line x1="180" y1="620" x2="180" y2="190" stroke="#2C2C2E" stroke-width="3" marker-end="url(#a)"/><path d="M150 560 C250 520 335 470 405 405 C475 340 535 250 610 170" fill="none" stroke="#2C2C2E" stroke-width="4"/><line x1="230" y1="520" x2="655" y2="285" stroke="#2C2C2E" stroke-width="3" stroke-dasharray="10 8"/><circle cx="315" cy="473" r="9" fill="#3D5A80"/><circle cx="535" cy="351" r="9" fill="#D94F70"/><circle cx="535" cy="275" r="9" fill="#7FB069"/><line x1="315" y1="473" x2="535" y2="473" stroke="#8E8E93" stroke-dasharray="7 7"/><line x1="535" y1="473" x2="535" y2="351" stroke="#8E8E93" stroke-dasharray="7 7"/><line x1="535" y1="351" x2="535" y2="275" stroke="#D94F70" stroke-width="4" stroke-dasharray="8 8"/><line x1="315" y1="610" x2="535" y2="610" stroke="#C5A059" stroke-width="4"/><text x="425" y="640" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#2C2C2E">h</text><line x1="565" y1="473" x2="565" y2="351" stroke="#C5A059" stroke-width="4"/><text x="582" y="415" font-family="Arial" font-size="18" fill="#2C2C2E">h(dy/dx)₀</text><text x="285" y="452" font-family="Arial" font-size="22" fill="#2C2C2E">P₀</text><text x="550" y="347" font-family="Arial" font-size="18" font-weight="700" fill="#D94F70">predicted P₁</text><text x="550" y="275" font-family="Arial" font-size="18" font-weight="700" fill="#7FB069">actual curve point</text><rect x="815" y="150" width="315" height="500" rx="18" fill="white" stroke="#E5E5EA"/><text x="972" y="198" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#2C2C2E">Euler update</text><rect x="850" y="235" width="245" height="82" rx="14" fill="#FFFFF0" stroke="#C5A059"/><text x="972" y="270" text-anchor="middle" font-family="Arial" font-size="23" fill="#2C2C2E">y₁ = y₀ + h(dy/dx)₀</text><rect x="160" y="685" width="880" height="48" rx="16" fill="#FBEFEF" stroke="#D4AF37"/><text x="600" y="715" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#2C2C2E">Off-spec enrichment visual</text><defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2C2C2E"/></marker></defs></svg>