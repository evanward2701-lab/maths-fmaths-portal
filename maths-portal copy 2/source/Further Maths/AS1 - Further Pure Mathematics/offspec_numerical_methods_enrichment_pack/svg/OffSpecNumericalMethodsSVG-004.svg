<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">Second-Order Central Difference Stencil</title><desc id="desc">Three equally spaced values and central second derivative formula.</desc><rect width="1200" height="760" fill="#FAF9F6"/><rect x="60" y="40" width="1080" height="82" rx="20" fill="#FFFFF0" stroke="#E5E5EA"/><text x="600" y="78" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#2C2C2E">Second-Order Numerical Method</text><rect x="70" y="160" width="720" height="455" rx="18" fill="white" stroke="#E5E5EA"/><line x1="140" y1="520" x2="725" y2="520" stroke="#2C2C2E" stroke-width="3" marker-end="url(#a)"/><path d="M145 475 C240 425 335 330 430 300 C525 270 590 210 700 175" fill="none" stroke="#2C2C2E" stroke-width="4"/><circle cx="220" cy="415" r="11" fill="#3D5A80"/><circle cx="430" cy="300" r="11" fill="#3D5A80"/><circle cx="640" cy="190" r="11" fill="#3D5A80"/><text x="174" y="407" font-family="Arial" font-size="23" fill="#2C2C2E">yₙ₋₁</text><text x="399" y="285" font-family="Arial" font-size="23" fill="#2C2C2E">yₙ</text><text x="655" y="190" font-family="Arial" font-size="23" fill="#2C2C2E">yₙ₊₁</text><line x1="220" y1="415" x2="430" y2="300" stroke="#C5A059" stroke-width="4"/><line x1="430" y1="300" x2="640" y2="190" stroke="#D4AF37" stroke-width="4"/><line x1="220" y1="565" x2="430" y2="565" stroke="#C5A059" stroke-width="4"/><line x1="430" y1="565" x2="640" y2="565" stroke="#C5A059" stroke-width="4"/><text x="325" y="595" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#2C2C2E">h</text><text x="535" y="595" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#2C2C2E">h</text><rect x="830" y="160" width="320" height="455" rx="18" fill="white" stroke="#E5E5EA"/><text x="990" y="206" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#2C2C2E">Second derivative</text><text x="990" y="372" text-anchor="middle" font-family="Arial" font-size="20" fill="#2C2C2E">(d²y/dx²)ₙ ≈</text><text x="990" y="402" text-anchor="middle" font-family="Arial" font-size="20" fill="#2C2C2E">(yₙ₊₁ - 2yₙ + yₙ₋₁)/h²</text><text x="990" y="505" text-anchor="middle" font-family="Arial" font-size="20" fill="#2C2C2E">yₙ₊₁ ≈ 2yₙ - yₙ₋₁</text><text x="990" y="534" text-anchor="middle" font-family="Arial" font-size="20" fill="#2C2C2E">+ h²(d²y/dx²)ₙ</text><rect x="155" y="660" width="890" height="48" rx="16" fill="#FBEFEF" stroke="#D4AF37"/><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#2C2C2E">Off-spec enrichment visual</text><defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2C2C2E"/></marker></defs></svg>