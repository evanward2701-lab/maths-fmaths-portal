<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">A-Level Maths Bridge to Numerical Methods Enrichment</title><desc id="desc">Bridge from ordinary gradient, integration, numerical area and modelling to Euler, midpoint, Simpson and context iterations.</desc>
<rect width="1200" height="760" fill="#FAF9F6"/><rect x="60" y="45" width="1080" height="90" rx="22" fill="#FFFFF0" stroke="#E5E5EA"/>
<text x="600" y="85" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#2C2C2E">A-Level Maths Bridge</text><text x="600" y="115" text-anchor="middle" font-family="Arial" font-size="18" fill="#2C2C2E">Ordinary skills growing into off-spec numerical methods enrichment</text>
<g font-family="Arial" fill="#2C2C2E"><rect x="70" y="170" width="245" height="420" rx="20" fill="white" stroke="#E5E5EA"/><rect x="345" y="170" width="245" height="420" rx="20" fill="white" stroke="#E5E5EA"/><rect x="620" y="170" width="245" height="420" rx="20" fill="white" stroke="#E5E5EA"/><rect x="895" y="170" width="245" height="420" rx="20" fill="white" stroke="#E5E5EA"/>
<text x="192" y="220" text-anchor="middle" font-size="22" font-weight="700">Gradient</text><text x="467" y="220" text-anchor="middle" font-size="22" font-weight="700">Integration</text><text x="742" y="220" text-anchor="middle" font-size="22" font-weight="700">Numerical Area</text><text x="1017" y="220" text-anchor="middle" font-size="22" font-weight="700">Modelling</text>
<text x="192" y="290" text-anchor="middle" font-size="18">dy/dx is local slope</text><text x="467" y="290" text-anchor="middle" font-size="18">dy/dx = 2x → y=x²+c</text><text x="742" y="290" text-anchor="middle" font-size="18">trapezium rule</text><text x="1017" y="290" text-anchor="middle" font-size="18">rates and units</text>
<path d="M192 330 L192 430" stroke="#D4AF37" stroke-width="4" marker-end="url(#a)"/><path d="M467 330 L467 430" stroke="#D4AF37" stroke-width="4" marker-end="url(#a)"/><path d="M742 330 L742 430" stroke="#D4AF37" stroke-width="4" marker-end="url(#a)"/><path d="M1017 330 L1017 430" stroke="#D4AF37" stroke-width="4" marker-end="url(#a)"/>
<text x="192" y="480" text-anchor="middle" font-size="19" font-weight="700">Euler step</text><text x="192" y="512" text-anchor="middle" font-size="17">follow local gradient</text><text x="467" y="480" text-anchor="middle" font-size="19" font-weight="700">Numerical DEs</text><text x="467" y="512" text-anchor="middle" font-size="17">when algebra fails</text><text x="742" y="480" text-anchor="middle" font-size="19" font-weight="700">Simpson's rule</text><text x="742" y="512" text-anchor="middle" font-size="17">parabolic arcs</text><text x="1017" y="480" text-anchor="middle" font-size="19" font-weight="700">Context iterations</text><text x="1017" y="512" text-anchor="middle" font-size="17">rewrite variables</text></g>
<rect x="155" y="640" width="890" height="58" rx="18" fill="#FBEFEF" stroke="#D4AF37"/><text x="600" y="676" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#2C2C2E">Off-spec enrichment, not CCEA Further Mathematics core</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#D4AF37"/></marker></defs>
</svg>