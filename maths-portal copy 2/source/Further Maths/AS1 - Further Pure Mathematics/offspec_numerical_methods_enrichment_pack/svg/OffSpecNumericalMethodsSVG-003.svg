<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="780" viewBox="0 0 1200 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">Midpoint Method Geometry</title><desc id="desc">Midpoint method with three points, h and h, total 2h and middle gradient.</desc><rect width="1200" height="780" fill="#FAF9F6"/><rect x="60" y="40" width="1080" height="82" rx="20" fill="#FFFFF0" stroke="#E5E5EA"/><text x="600" y="78" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#2C2C2E">Midpoint Method</text><rect x="85" y="150" width="700" height="500" rx="18" fill="white" stroke="#E5E5EA"/><line x1="135" y1="580" x2="725" y2="580" stroke="#2C2C2E" stroke-width="3" marker-end="url(#a)"/><line x1="160" y1="620" x2="160" y2="190" stroke="#2C2C2E" stroke-width="3" marker-end="url(#a)"/><path d="M135 555 C255 520 330 480 410 405 C495 326 575 250 720 210" fill="none" stroke="#2C2C2E" stroke-width="4"/><circle cx="265" cy="515" r="10" fill="#3D5A80"/><circle cx="425" cy="392" r="10" fill="#3D5A80"/><circle cx="585" cy="270" r="10" fill="#7FB069"/><circle cx="585" cy="300" r="10" fill="#D94F70"/><line x1="315" y1="480" x2="670" y2="210" stroke="#2C2C2E" stroke-width="3" stroke-dasharray="10 8"/><line x1="265" y1="515" x2="585" y2="300" stroke="#C5A059" stroke-width="3"/><line x1="265" y1="620" x2="425" y2="620" stroke="#C5A059" stroke-width="4"/><line x1="425" y1="620" x2="585" y2="620" stroke="#C5A059" stroke-width="4"/><line x1="265" y1="668" x2="585" y2="668" stroke="#D4AF37" stroke-width="4"/><text x="345" y="650" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#2C2C2E">h</text><text x="505" y="650" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#2C2C2E">h</text><text x="425" y="704" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#2C2C2E">2h</text><text x="220" y="510" font-family="Arial" font-size="22" fill="#2C2C2E">Pₙ₋₁</text><text x="392" y="375" font-family="Arial" font-size="22" fill="#2C2C2E">Pₙ</text><text x="600" y="270" font-family="Arial" font-size="20" fill="#7FB069">actual Pₙ₊₁</text><text x="600" y="304" font-family="Arial" font-size="20" fill="#D94F70">predicted Pₙ₊₁</text><rect x="830" y="150" width="315" height="500" rx="18" fill="white" stroke="#E5E5EA"/><text x="987" y="198" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#2C2C2E">Core formula</text><text x="987" y="275" text-anchor="middle" font-family="Arial" font-size="20" fill="#2C2C2E">(dy/dx)ₙ ≈ (yₙ₊₁-yₙ₋₁)/(2h)</text><text x="987" y="405" text-anchor="middle" font-family="Arial" font-size="20" fill="#2C2C2E">yₙ₊₁ ≈ yₙ₋₁ + 2h(dy/dx)ₙ</text><rect x="175" y="724" width="850" height="38" rx="14" fill="#FBEFEF" stroke="#D4AF37"/><text x="600" y="749" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#2C2C2E">Off-spec enrichment visual</text><defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2C2C2E"/></marker></defs></svg>