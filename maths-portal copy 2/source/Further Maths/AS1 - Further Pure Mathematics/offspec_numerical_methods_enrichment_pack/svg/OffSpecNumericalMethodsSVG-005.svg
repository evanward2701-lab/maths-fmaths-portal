<svg width="1200" height="820" viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">Simpson's Rule Grouping and Trapezium Comparison</title><desc id="desc">Compare straight trapezia with Simpson parabolic arcs and show grouping of endpoints, odd values and internal even values.</desc><rect width="1200" height="820" fill="#FAF9F6"/><rect x="60" y="38" width="1080" height="82" rx="20" fill="#FFFFF0" stroke="#E5E5EA"/><text x="600" y="77" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#2C2C2E">Simpson's Rule</text><rect x="70" y="150" width="505" height="335" rx="18" fill="white" stroke="#E5E5EA"/><text x="322" y="192" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#2C2C2E">Trapezium rule idea</text><path d="M145 385 C210 345 260 320 325 300 C405 276 455 245 520 210" fill="none" stroke="#2C2C2E" stroke-width="4"/><polygon points="145,420 145,385 240,337 240,420" fill="#FBEFEF" stroke="#C5A059"/><polygon points="240,420 240,337 335,297 335,420" fill="#FBEFEF" stroke="#C5A059"/><polygon points="335,420 335,297 430,260 430,420" fill="#FBEFEF" stroke="#C5A059"/><rect x="625" y="150" width="505" height="335" rx="18" fill="white" stroke="#E5E5EA"/><text x="878" y="192" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#2C2C2E">Simpson's rule idea</text><path d="M700 385 C765 345 815 320 880 300 C960 276 1010 245 1075 210" fill="none" stroke="#2C2C2E" stroke-width="4"/><path d="M700 385 Q795 315 890 300 L890 420 L700 420 Z" fill="#FFFFF0" stroke="#D4AF37"/><path d="M890 300 Q980 260 1075 210 L1075 420 L890 420 Z" fill="#FFFFF0" stroke="#D4AF37"/><rect x="70" y="520" width="1060" height="210" rx="18" fill="white" stroke="#E5E5EA"/><text x="600" y="560" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#2C2C2E">Grouping values for Simpson's rule</text><line x1="180" y1="660" x2="1020" y2="660" stroke="#2C2C2E" stroke-width="3"/><g font-family="Arial" font-size="20" text-anchor="middle" fill="#2C2C2E"><text x="180" y="710">y₀</text><text x="320" y="710">y₁</text><text x="460" y="710">y₂</text><text x="600" y="710">y₃</text><text x="740" y="710">y₄</text><text x="880" y="710">y₅</text><text x="1020" y="710">y₆</text></g><text x="600" y="765" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#2C2C2E">h/3 [ endpoints + 4(odd values) + 2(internal even values) ]</text><text x="600" y="792" text-anchor="middle" font-family="Arial" font-size="16" fill="#2C2C2E">Off-spec enrichment visual, Simpson's rule requires an even number of intervals</text></svg>