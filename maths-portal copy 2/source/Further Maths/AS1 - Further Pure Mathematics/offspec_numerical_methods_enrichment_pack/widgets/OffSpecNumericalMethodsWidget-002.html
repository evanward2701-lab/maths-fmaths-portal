<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Midpoint Method Builder</title><style>:root{--canvas:#FAF9F6;--ivory:#FFFFF0;--line:#E5E5EA;--gold:#C5A059;--gold2:#D4AF37;--pink:#FBEFEF;--text:#2C2C2E}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--canvas);color:var(--text);line-height:1.5}main{max-width:1050px;margin:28px auto;padding:20px}.hero,.panel{background:white;border:1px solid var(--line);border-radius:22px;padding:22px;margin-bottom:18px}.hero{background:var(--ivory);text-align:center}.badge{display:inline-block;background:var(--pink);border:1px solid var(--gold2);border-radius:999px;padding:6px 12px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}label{display:block;font-weight:700;margin-bottom:5px}input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:12px;font-size:1rem}button{border:none;background:var(--gold);color:white;border-radius:14px;padding:11px 18px;font-weight:800;cursor:pointer;margin-top:14px}.work{background:var(--canvas);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow-x:auto}.warning{background:var(--pink);border:1px solid var(--gold2);border-radius:14px;padding:12px;margin-top:12px;font-weight:700}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style></head><body><main><section class="hero"><h1>Midpoint Method Builder</h1><p>Uses Euler first, then midpoint.</p><span class="badge">Off-spec enrichment, not CCEA Further Maths core</span></section><section class="panel"><div class="grid"><div><label>F(x,y)</label><input id="expr" value="(x+y)/y"></div><div><label>x₀</label><input id="x0" type="number" step="any" value="0"></div><div><label>y₀</label><input id="y0" type="number" step="any" value="2"></div><div><label>h</label><input id="h" type="number" step="any" value="0.25"></div></div><button id="run">Use Euler, then midpoint</button><div id="messages"></div></section><section class="panel"><h2>Output</h2><div id="working" class="work">Press the button to begin.</div></section></main><script>
function tokenize(expr){const tokens=[];let i=0;const s=expr.toLowerCase().replace(/π/g,"pi").replace(/\s+/g,"");while(i<s.length){const c=s[i];if(/[0-9.]/.test(c)){let j=i+1;while(j<s.length&&/[0-9.]/.test(s[j]))j++;tokens.push({type:"num",value:Number(s.slice(i,j))});i=j;}else if(/[a-z]/.test(c)){let j=i+1;while(j<s.length&&/[a-z]/.test(s[j]))j++;tokens.push({type:"id",value:s.slice(i,j)});i=j;}else if("+-*/^()".includes(c)){tokens.push({type:"op",value:c});i++;}else throw new Error("Unsupported character: "+c);}return tokens;}
function toRPN(tokens){const output=[],stack=[],funcs=new Set(["sin","cos","tan","sqrt","abs","exp","ln","log"]);const prec={"+":1,"-":1,"*":2,"/":2,"^":3,"u-":4};const right={"^":true,"u-":true};let prev=null;for(const tok of tokens){if(tok.type==="num")output.push(tok);else if(tok.type==="id"){if(funcs.has(tok.value))stack.push(tok);else output.push(tok);}else if(tok.type==="op"&&tok.value==="(")stack.push(tok);else if(tok.type==="op"&&tok.value===")"){while(stack.length&&stack[stack.length-1].value!=="(")output.push(stack.pop());if(!stack.length)throw new Error("Mismatched brackets");stack.pop();if(stack.length&&funcs.has(stack[stack.length-1].value))output.push(stack.pop());}else if(tok.type==="op"){let op=tok.value;if(op==="-"&&(!prev||(prev.type==="op"&&prev.value!==")")))op="u-";while(stack.length){const top=stack[stack.length-1].value;if(!(top in prec))break;if((right[op]&&prec[op]<prec[top])||(!right[op]&&prec[op]<=prec[top]))output.push(stack.pop());else break;}stack.push({type:"op",value:op});}prev=tok;}while(stack.length){const top=stack.pop();if(top.value==="(")throw new Error("Mismatched brackets");output.push(top);}return output;}
function evalRPN(rpn,vars){const st=[];const fn={sin:Math.sin,cos:Math.cos,tan:Math.tan,sqrt:Math.sqrt,abs:Math.abs,exp:Math.exp,ln:Math.log,log:Math.log10};for(const tok of rpn){if(tok.type==="num")st.push(tok.value);else if(tok.type==="id"){if(tok.value==="pi")st.push(Math.PI);else if(tok.value==="e")st.push(Math.E);else if(tok.value in vars)st.push(vars[tok.value]);else if(tok.value in fn){const a=st.pop();st.push(fn[tok.value](a));}else throw new Error("Unknown identifier: "+tok.value);}else if(tok.type==="op"){if(tok.value==="u-")st.push(-st.pop());else{const b=st.pop(),a=st.pop();if(tok.value==="+")st.push(a+b);if(tok.value==="-")st.push(a-b);if(tok.value==="*")st.push(a*b);if(tok.value==="/")st.push(a/b);if(tok.value==="^")st.push(Math.pow(a,b));}}}if(st.length!==1||!Number.isFinite(st[0]))throw new Error("Expression did not evaluate to a finite number");return st[0];}
function safeEval(expr,vars){return evalRPN(toRPN(tokenize(expr)),vars);} function fmt(x){return Math.abs(x)<1e-12?"0":Number(x.toPrecision(10)).toString();}

document.getElementById("run").onclick=()=>{const out=document.getElementById("working"),msg=document.getElementById("messages");msg.innerHTML="";try{const expr=document.getElementById("expr").value;const x0v=Number(x0.value),y0v=Number(y0.value),H=Number(h.value);const g0=safeEval(expr,{x:x0v,y:y0v});const x1=x0v+H,y1=y0v+H*g0;const g1=safeEval(expr,{x:x1,y:y1});const y2=y0v+2*H*g1;out.textContent=`Euler first:
F(${fmt(x0v)},${fmt(y0v)})=${fmt(g0)}
y1=${fmt(y0v)}+${fmt(H)}(${fmt(g0)})=${fmt(y1)}

Midpoint:
F(${fmt(x1)},${fmt(y1)})=${fmt(g1)}
y2=${fmt(y0v)}+2(${fmt(H)})(${fmt(g1)})=${fmt(y2)}

Estimate: y≈${fmt(y2)} at x=${fmt(x0v+2*H)}`;}catch(e){msg.innerHTML=`<div class="warning">${e.message}</div>`;out.textContent="No calculation generated."}};</script></body></html>
