<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Numerical Methods Exam Trap Checker</title><style>:root{--canvas:#FAF9F6;--ivory:#FFFFF0;--line:#E5E5EA;--gold:#C5A059;--gold2:#D4AF37;--pink:#FBEFEF;--text:#2C2C2E}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--canvas);color:var(--text);line-height:1.5}main{max-width:1050px;margin:28px auto;padding:20px}.hero,.panel{background:white;border:1px solid var(--line);border-radius:22px;padding:22px;margin-bottom:18px}.hero{background:var(--ivory);text-align:center}.badge{display:inline-block;background:var(--pink);border:1px solid var(--gold2);border-radius:999px;padding:6px 12px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}label{display:block;font-weight:700;margin-bottom:5px}input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:12px;font-size:1rem}button{border:none;background:var(--gold);color:white;border-radius:14px;padding:11px 18px;font-weight:800;cursor:pointer;margin-top:14px}.work{background:var(--canvas);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow-x:auto}.warning{background:var(--pink);border:1px solid var(--gold2);border-radius:14px;padding:12px;margin-top:12px;font-weight:700}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style></head><body><main><section class="hero"><h1>Numerical Methods Exam Trap Checker</h1><p>Checks setup issues before calculation: units, step size, variables, radians and Simpson interval count.</p><span class="badge">Off-spec enrichment, not CCEA Further Maths core</span></section><section class="panel"><div class="grid"><div><label>Method</label><select id="method"><option value="euler">Euler</option><option value="midpoint">Midpoint</option><option value="secondA">Second-order Type A</option><option value="secondB">Second-order Type B</option><option value="simpson">Simpson</option></select></div><div><label>Start</label><input id="start" type="number" step="any" value="0"></div><div><label>Target</label><input id="target" type="number" step="any" value="0.3333333333"></div><div><label>Iterations / intervals</label><input id="steps" type="number" value="2"></div><div><label>Trig?</label><select id="trig"><option value="no">No</option><option value="yes">Yes</option></select></div><div><label>Variables</label><input id="vars" value="x,y"></div></div><button id="run">Check setup</button></section><section class="panel"><h2>Checklist</h2><div id="working" class="work">Press the button to begin.</div></section></main><script>
function tokenize(expr){const tokens=[];let i=0;const s=expr.toLowerCase().replace(/π/g,"pi").replace(/\s+/g,"");while(i<s.length){const c=s[i];if(/[0-9.]/.test(c)){let j=i+1;while(j<s.length&&/[0-9.]/.test(s[j]))j++;tokens.push({type:"num",value:Number(s.slice(i,j))});i=j;}else if(/[a-z]/.test(c)){let j=i+1;while(j<s.length&&/[a-z]/.test(s[j]))j++;tokens.push({type:"id",value:s.slice(i,j)});i=j;}else if("+-*/^()".includes(c)){tokens.push({type:"op",value:c});i++;}else throw new Error("Unsupported character: "+c);}return tokens;}
function toRPN(tokens){const output=[],stack=[],funcs=new Set(["sin","cos","tan","sqrt","abs","exp","ln","log"]);const prec={"+":1,"-":1,"*":2,"/":2,"^":3,"u-":4};const right={"^":true,"u-":true};let prev=null;for(const tok of tokens){if(tok.type==="num")output.push(tok);else if(tok.type==="id"){if(funcs.has(tok.value))stack.push(tok);else output.push(tok);}else if(tok.type==="op"&&tok.value==="(")stack.push(tok);else if(tok.type==="op"&&tok.value===")"){while(stack.length&&stack[stack.length-1].value!=="(")output.push(stack.pop());if(!stack.length)throw new Error("Mismatched brackets");stack.pop();if(stack.length&&funcs.has(stack[stack.length-1].value))output.push(stack.pop());}else if(tok.type==="op"){let op=tok.value;if(op==="-"&&(!prev||(prev.type==="op"&&prev.value!==")")))op="u-";while(stack.length){const top=stack[stack.length-1].value;if(!(top in prec))break;if((right[op]&&prec[op]<prec[top])||(!right[op]&&prec[op]<=prec[top]))output.push(stack.pop());else break;}stack.push({type:"op",value:op});}prev=tok;}while(stack.length){const top=stack.pop();if(top.value==="(")throw new Error("Mismatched brackets");output.push(top);}return output;}
function evalRPN(rpn,vars){const st=[];const fn={sin:Math.sin,cos:Math.cos,tan:Math.tan,sqrt:Math.sqrt,abs:Math.abs,exp:Math.exp,ln:Math.log,log:Math.log10};for(const tok of rpn){if(tok.type==="num")st.push(tok.value);else if(tok.type==="id"){if(tok.value==="pi")st.push(Math.PI);else if(tok.value==="e")st.push(Math.E);else if(tok.value in vars)st.push(vars[tok.value]);else if(tok.value in fn){const a=st.pop();st.push(fn[tok.value](a));}else throw new Error("Unknown identifier: "+tok.value);}else if(tok.type==="op"){if(tok.value==="u-")st.push(-st.pop());else{const b=st.pop(),a=st.pop();if(tok.value==="+")st.push(a+b);if(tok.value==="-")st.push(a-b);if(tok.value==="*")st.push(a*b);if(tok.value==="/")st.push(a/b);if(tok.value==="^")st.push(Math.pow(a,b));}}}if(st.length!==1||!Number.isFinite(st[0]))throw new Error("Expression did not evaluate to a finite number");return st[0];}
function safeEval(expr,vars){return evalRPN(toRPN(tokenize(expr)),vars);} function fmt(x){return Math.abs(x)<1e-12?"0":Number(x.toPrecision(10)).toString();}

document.getElementById("run").onclick=()=>{const m=method.value,s=Number(start.value),t=Number(target.value),N=Number(steps.value);let notes=[];if(Number.isFinite(s)&&Number.isFinite(t)&&Number.isInteger(N)&&N>0){notes.push(`h = (${fmt(t)} - ${fmt(s)}) / ${N} = ${fmt((t-s)/N)}`);}if(m==="simpson"&&N%2!==0)notes.push("Warning: Simpson's rule needs an even number of intervals.");if(trig.value==="yes")notes.push("Warning: use radians for calculus with trigonometry unless told otherwise.");if(vars.value.trim()!=="x,y")notes.push(`Rewrite formulae using the question variables: ${vars.value}.`);if(m==="midpoint")notes.push("Midpoint usually needs Euler first and uses 2h.");if(m==="secondB")notes.push("Type B uses midpoint + second-order formula + simultaneous equations.");notes.push("Show method lines and avoid premature rounding.");working.textContent=notes.join("
");};</script></body></html>
