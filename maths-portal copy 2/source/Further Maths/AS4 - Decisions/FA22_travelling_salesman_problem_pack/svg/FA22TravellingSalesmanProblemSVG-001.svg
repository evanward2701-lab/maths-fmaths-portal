  <defs>
    <style><![CDATA[
      .bg{fill:#FAF9F6} .card{fill:#FFFFF0;stroke:#E5E5EA;stroke-width:2;rx:22}
      .title{font-family:Arial,sans-serif;font-size:32px;font-weight:700;fill:#2C2C2E}
      .text{font-family:Arial,sans-serif;font-size:20px;fill:#2C2C2E}
      .small{font-family:Arial,sans-serif;font-size:16px;fill:#2C2C2E}
      .edge{stroke:#8E8E93;stroke-width:3;fill:none} .route{stroke:#C5A059;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}
