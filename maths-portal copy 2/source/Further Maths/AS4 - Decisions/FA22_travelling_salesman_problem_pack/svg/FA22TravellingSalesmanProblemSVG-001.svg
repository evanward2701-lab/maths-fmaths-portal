  <rect class="bg" width="1200" height="760"/>
  
  <text class="title" x="60" y="60">Walk, Tour and Hamiltonian Cycle</text>
  <rect class="card" x="60" y="110" width="330" height="540"/>
  <rect class="card" x="435" y="110" width="330" height="540"/>
  <rect class="card" x="810" y="110" width="330" height="540"/>
  <text class="text" x="90" y="155">Walk</text><text class="small" x="90" y="185">Connected edge sequence.</text>
  <text class="text" x="465" y="155">Tour</text><text class="small" x="465" y="185">Visits every vertex and returns.</text>
  <text class="text" x="840" y="155">Hamiltonian cycle</text><text class="small" x="840" y="185">Visits every vertex exactly once.</text>
  <g transform="translate(0,0)"><line class="edge" x1="160" y1="300" x2="270" y2="300"/><line class="edge" x1="270" y1="300" x2="310" y2="410"/><line class="edge" x1="310" y1="410" x2="215" y2="500"/><line class="edge" x1="215" y1="500" x2="120" y2="410"/><line class="edge" x1="120" y1="410" x2="160" y2="300"/><polyline class="route" points="160,300 270,300 310,410"/><circle class="gold" cx="160" cy="300" r="17"/><circle class="node" cx="270" cy="300" r="17"/><circle class="node" cx="310" cy="410" r="17"/><circle class="node" cx="215" cy="500" r="17"/><circle class="node" cx="120" cy="410" r="17"/><text class="small" x="95" y="585">A → B → C; may miss vertices.</text></g>
  <g transform="translate(375,0)"><line class="edge" x1="160" y1="300" x2="270" y2="300"/><line class="edge" x1="270" y1="300" x2="310" y2="410"/><line class="edge" x1="310" y1="410" x2="215" y2="500"/><line class="edge" x1="215" y1="500" x2="120" y2="410"/><line class="edge" x1="120" y1="410" x2="160" y2="300"/><polyline class="route" points="160,300 270,300 310,410 270,300 215,500 120,410 160,300"/><circle class="gold" cx="160" cy="300" r="17"/><circle class="node" cx="270" cy="300" r="17"/><circle class="node" cx="310" cy="410" r="17"/><circle class="node" cx="215" cy="500" r="17"/><circle class="node" cx="120" cy="410" r="17"/><text class="small" x="90" y="585">A → B → C → B → D → E → A.</text></g>
  <g transform="translate(750,0)"><line class="edge" x1="160" y1="300" x2="270" y2="300"/><line class="edge" x1="270" y1="300" x2="310" y2="410"/><line class="edge" x1="310" y1="410" x2="215" y2="500"/><line class="edge" x1="215" y1="500" x2="120" y2="410"/><line class="edge" x1="120" y1="410" x2="160" y2="300"/><polyline class="route" points="160,300 270,300 215,500 120,410 310,410 160,300"/><circle class="gold" cx="160" cy="300" r="17"/><circle class="node" cx="270" cy="300" r="17"/><circle class="node" cx="310" cy="410" r="17"/><circle class="node" cx="215" cy="500" r="17"/><circle class="node" cx="120" cy="410" r="17"/><text class="small" x="88" y="585">A → B → D → E → C → A.</text></g>

