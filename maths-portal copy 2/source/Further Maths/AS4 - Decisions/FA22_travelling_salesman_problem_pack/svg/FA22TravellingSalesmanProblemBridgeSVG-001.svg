  <text class="text" x="125" y="175">Ordinary A-Level Maths habit</text><text class="text" x="690" y="175">Further Maths upgrade</text>
  <text class="small" x="125" y="250">Read a table entry</text><text class="small" x="690" y="250">Use a distance matrix</text>
  <text class="small" x="125" y="340">Compare numbers</text><text class="small" x="690" y="340">Choose nearest unvisited vertex</text>
  <text class="small" x="125" y="430">Optimisation language</text><text class="small" x="690" y="430">Construct an upper bound</text>
