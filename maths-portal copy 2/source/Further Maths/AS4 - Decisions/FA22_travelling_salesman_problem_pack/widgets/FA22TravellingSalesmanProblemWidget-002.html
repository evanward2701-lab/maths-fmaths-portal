<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Hamiltonian Cycle Validator</title><!-- asset_id: FA22TravellingSalesmanProblemWidget-002 --><style>:root{--canvas:#FAF9F6;--ivory:#FFFFF0;--line:#E5E5EA;--gold:#C5A059;--pink:#FBEFEF;--text:#2C2C2E}body{margin:0;background:var(--canvas);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.card,.hero{background:var(--ivory);border:1px solid var(--line);border-radius:22px;padding:20px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:800px){.grid{grid-template-columns:1fr}}textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:16px;padding:12px;font:inherit;background:var(--canvas)}button{font:inherit;border:1px solid var(--gold);border-radius:999px;padding:9px 13px;background:var(--pink);cursor:pointer;margin:4px}table{width:100%;border-collapse:collapse}th,td{border:1px solid var(--line);padding:8px;text-align:center}th{background:var(--pink)}.result,.check{padding:12px;border:1px solid var(--line);border-radius:16px;margin-top:10px}.pass,.good{background:var(--pink);border-color:var(--gold)}.fail,.bad{background:#fff6f6;border-color:#c9a3a3}.pill{display:inline-block;margin:5px;padding:8px 12px;border:1px solid var(--gold);border-radius:999px;background:var(--pink);font-weight:800}.sum{font-family:monospace;background:var(--canvas);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}</style></head><body><main class="wrap"><section class="hero"><h1>Hamiltonian Cycle Validator</h1><p>Type a route and check whether it is a valid Hamiltonian cycle. Example: A,D,C,B,E,A.</p></section><section class="grid"><div class="card"><h2>Route input</h2><textarea id="routeInput">A,D,C,B,E,A</textarea><button id="validateBtn">Validate route</button><button data-route="A,D,C,B,E,A">Good example</button><button data-route="A,D,C,D,B,E,A">Repeated vertex</button><button data-route="A,D,C,B,E">No return</button><div id="routePills"></div></div><div class="card"><h2>Distance table</h2><div id="tableHost"></div></div></section><section class="card"><h2>Validation report</h2><div id="result" class="result">Press validate.</div><div id="checks"></div><div id="sumHost"></div></section></main><script>const V=['A','B','C','D','E'];const D={A:{A:null,B:9,C:7,D:5,E:8},B:{A:9,B:null,C:6,D:4,E:3},C:{A:7,B:6,C:null,D:2,E:10},D:{A:5,B:4,C:2,D:null,E:11},E:{A:8,B:3,C:10,D:11,E:null}};const $=id=>document.getElementById(id);function table(){let h='<table><tr><th></th>'+V.map(v=>'<th>'+v+'</th>').join('')+'</tr>';for(const r of V){h+='<tr><th>'+r+'</th>'+V.map(c=>'<td>'+(D[r][c]??'−')+'</td>').join('')+'</tr>'}h+='</table>';$('tableHost').innerHTML=h}function parse(s){return s.toUpperCase().replace(/→|->/g,',').replace(/\s+/g,',').split(',').map(x=>x.trim()).filter(Boolean)}function chk(label,ok,detail){$('checks').innerHTML+=`<div class="check ${ok?'pass':'fail'}"><b>${ok?'✓':'✗'} ${label}</b><br>${detail}</div>`}function validate(){let r=parse($('routeInput').value);$('checks').innerHTML='';$('sumHost').innerHTML='';$('routePills').innerHTML=r.map(x=>`<span class="pill">${x}</span>`).join(' → ');if(!r.length){$('result').className='result bad';$('result').textContent='No route entered.';return}let start=r[0],end=r.at(-1),internal=r.slice(0,-1);let unknown=r.filter(v=>!V.includes(v));let miss=V.filter(v=>!internal.includes(v));let rep=internal.filter((v,i)=>internal.indexOf(v)!==i);let ok1=start===end,ok2=!unknown.length,ok3=!miss.length,ok4=!rep.length,ok5=r.length===V.length+1;chk('Starts and ends at same vertex',ok1,ok1?`Starts and ends at ${start}.`:`Starts at ${start}, ends at ${end}.`);chk('Known vertices only',ok2,ok2?'All vertices are in the table.':'Unknown: '+[...new Set(unknown)].join(', '));chk('Includes every vertex',ok3,ok3?'Every vertex is included.':'Missing: '+miss.join(', '));chk('No repeated internal vertex',ok4,ok4?'No internal repeats.':'Repeated: '+[...new Set(rep)].join(', '));chk('Correct number of entries',ok5,`Expected ${V.length+1}, found ${r.length}.`);let total=0,edges=[],vals=[],edgeok=ok2; if(ok2){for(let i=0;i<r.length-1;i++){let d=D[r[i]]?.[r[i+1]];edges.push(r[i]+r[i+1]); if(typeof d==='number'){total+=d;vals.push(d)}else edgeok=false}}chk('All edges readable',edgeok,edgeok?'Edges: '+edges.join(', '):'At least one edge cannot be read.');let valid=ok1&&ok2&&ok3&&ok4&&ok5&&edgeok;$('result').className='result '+(valid?'good':'bad');$('result').innerHTML=valid?`<b>Valid Hamiltonian cycle.</b> Upper bound ${total}.`:'<b>Not yet a valid Hamiltonian cycle.</b>';$('sumHost').innerHTML=`<div class="sum">Route: ${r.join(' → ')}<br>Values: ${vals.join(' + ')} = ${total}</div>`}document.querySelectorAll('button[data-route]').forEach(b=>b.onclick=()=>{$('routeInput').value=b.dataset.route;validate()});$('validateBtn').onclick=validate;table();validate();</script></body></html>
