<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Nearest Neighbour Stepper</title><!-- asset_id: FA22TravellingSalesmanProblemWidget-001 --><style>:root{--canvas:#FAF9F6;--ivory:#FFFFF0;--line:#E5E5EA;--gold:#C5A059;--pink:#FBEFEF;--text:#2C2C2E}body{margin:0;background:var(--canvas);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.card,.hero{background:var(--ivory);border:1px solid var(--line);border-radius:22px;padding:20px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:800px){.grid{grid-template-columns:1fr}}button,select{font:inherit;border:1px solid var(--line);border-radius:999px;padding:9px 13px;background:var(--canvas)}button{cursor:pointer}button:hover,.primary{border-color:var(--gold);background:var(--pink)}table{width:100%;border-collapse:collapse}th,td{border:1px solid var(--line);padding:8px;text-align:center}th{background:var(--pink)}.hi{background:var(--pink);outline:3px solid var(--gold);outline-offset:-3px}.bad{background:#fff6f6;border-color:#c9a3a3}.good{background:var(--pink);border-color:var(--gold)}.feedback{padding:12px;border:1px solid var(--line);border-radius:16px}.pill{display:inline-block;margin:5px;padding:8px 12px;border:1px solid var(--gold);border-radius:999px;background:var(--pink);font-weight:800}</style></head><body><main class="wrap"><section class="hero"><h1>Nearest Neighbour Stepper</h1><p>Choose a starting vertex, then build the Hamiltonian cycle one nearest unvisited vertex at a time.</p><select id="start"></select> <button class="primary" id="begin">Begin</button> <button id="reset">Reset</button></section><section class="grid"><div class="card"><h2>Distance table</h2><div id="table"></div></div><div class="card"><h2>Trace</h2><p>Current: <b id="cur">Not started</b></p><p>Visited: <b id="vis">None</b></p><p>Total: <b id="tot">0</b></p><div id="route"></div><div id="choices"></div><div id="fb" class="feedback">Press Begin.</div></div></section></main><script>const V=['A','B','C','D','E'];const D={A:{A:null,B:9,C:7,D:5,E:8},B:{A:9,B:null,C:6,D:4,E:3},C:{A:7,B:6,C:null,D:2,E:10},D:{A:5,B:4,C:2,D:null,E:11},E:{A:8,B:3,C:10,D:11,E:null}};let start='A',cur=null,visited=[],route=[],total=0,finished=false;const $=id=>document.getElementById(id);V.forEach(v=>{let o=document.createElement('option');o.value=o.textContent=v;$('start').appendChild(o)});function unv(){return V.filter(v=>!visited.includes(v))}function nearest(){if(!cur||finished)return[];let u=unv();if(!u.length)return[start];let m=Math.min(...u.map(v=>D[cur][v]));return u.filter(v=>D[cur][v]===m)}function render(){let n=nearest();let h='<table><tr><th></th>'+V.map(v=>'<th>'+v+'</th>').join('')+'</tr>';for(const r of V){h+='<tr><th>'+r+'</th>';for(const c of V){h+=`<td class="${r===cur&&n.includes(c)?'hi':''}">${D[r][c]??'−'}</td>`}h+='</tr>'}h+='</table>';$('table').innerHTML=h;$('cur').textContent=cur||'Not started';$('vis').textContent=visited.join(', ')||'None';$('tot').textContent=total;$('route').innerHTML=route.map(x=>`<span class="pill">${x}</span>`).join(' → ');$('choices').innerHTML='';if(cur&&!finished){if(unv().length===0){btn('Return to '+start,start)}else V.filter(v=>v!==cur&&!visited.includes(v)).forEach(v=>btn(`${v} (${D[cur][v]})`,v))}}function btn(t,v){let b=document.createElement('button');b.textContent=t;b.onclick=()=>choose(v);$('choices').appendChild(b)}function begin(){start=$('start').value;cur=start;visited=[start];route=[start];total=0;finished=false;$('fb').className='feedback good';$('fb').innerHTML='Started at <b>'+start+'</b>.';render()}function reset(){cur=null;visited=[];route=[];total=0;finished=false;$('fb').className='feedback';$('fb').textContent='Press Begin.';render()}function choose(v){if(!cur||finished)return;let u=unv();if(!u.length){total+=D[cur][start];route.push(start);finished=true;$('fb').className='feedback good';$('fb').innerHTML='Complete: '+route.join(' → ')+'; upper bound '+total;cur=start;render();return}let n=nearest();if(!n.includes(v)){$('fb').className='feedback bad';$('fb').innerHTML='Not quite. Nearest valid choice is '+n.join(' or ')+'.';return}total+=D[cur][v];route.push(v);visited.push(v);cur=v;$('fb').className='feedback good';$('fb').innerHTML='Correct. Continue from <b>'+cur+'</b>.';render()}$('begin').onclick=begin;$('reset').onclick=reset;render();</script></body></html>
