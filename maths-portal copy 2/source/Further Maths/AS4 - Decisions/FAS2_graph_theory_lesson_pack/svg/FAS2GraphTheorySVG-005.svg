  <text x="100" y="355" font-family="Inter, Arial" font-size="15" fill="#2C2C2E">Connected, no cycles</text><text x="430" y="355" font-family="Inter, Arial" font-size="15" fill="#2C2C2E">Rejected: contains a cycle</text><text x="760" y="355" font-family="Inter, Arial" font-size="15" fill="#2C2C2E">Rejected: not connected</text>
