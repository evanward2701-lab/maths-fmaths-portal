  <title id="title">FAS2GraphTheorySVG-005: Trees, rooted trees, binary trees and spanning trees</title>
  <desc id="desc">Diagram showing a tree, non-trees, rooted binary tree and spanning tree.</desc>
  <!-- asset_id: FAS2GraphTheorySVG-005 | unit_code: FAS2 | topic_code: FAS2-GRAPH | topic_id: FAS2GraphTheory -->
  <rect width="1100" height="720" fill="#FAF9F6"/>
  <rect x="40" y="34" width="1020" height="650" rx="28" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="2"/>
  
  <text x="80" y="86" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#2C2C2E">Trees and spanning trees</text>
  <text x="80" y="124" font-family="Inter, Arial, sans-serif" font-size="17" fill="#2C2C2E">A tree is connected and has no cycles. A spanning tree is a tree subgraph containing all original vertices.</text>
