<svg width="1100" height="720" viewBox="0 0 1100 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">FAS2GraphTheoryBridgeSVG-001: Ordinary graph versus graph theory graph</title>
  <desc id="desc">Bridge diagram comparing coordinate graphs with graph-theory connection structures.</desc>
  <!-- asset_id: FAS2GraphTheoryBridgeSVG-001 | unit_code: FAS2 | topic_code: FAS2-GRAPH | topic_id: FAS2GraphTheory -->
  <rect width="1100" height="720" fill="#FAF9F6"/>
  <rect x="40" y="34" width="1020" height="650" rx="28" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="2"/>
  
  <text x="80" y="86" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#2C2C2E">A-Level Maths Bridge: what changes?</text>
  <text x="80" y="124" font-family="Inter, Arial, sans-serif" font-size="17" fill="#2C2C2E">Same word, new object. In this topic, a graph is a network of connections, not a curve on axes.</text>
  <rect x="80" y="170" width="430" height="380" rx="22" fill="#FAF9F6" stroke="#E5E5EA"/><rect x="590" y="170" width="430" height="380" rx="22" fill="#FAF9F6" stroke="#E5E5EA"/>
  <text x="115" y="215" font-family="Inter, Arial" font-size="25" font-weight="700" fill="#2C2C2E">Ordinary A-Level Maths</text><text x="625" y="215" font-family="Inter, Arial" font-size="25" font-weight="700" fill="#2C2C2E">Further Maths Graph Theory</text>
  <g transform="translate(125,280)"><line x1="0" y1="180" x2="330" y2="180" stroke="#2C2C2E" stroke-width="3"/><line x1="40" y1="220" x2="40" y2="0" stroke="#2C2C2E" stroke-width="3"/><path d="M0 180 C75 180,95 55,165 55 C235 55,250 180,330 180" fill="none" stroke="#C5A059" stroke-width="5"/><text x="300" y="205" font-family="Inter, Arial" font-size="18" fill="#2C2C2E">x</text><text x="20" y="20" font-family="Inter, Arial" font-size="18" fill="#2C2C2E">y</text><text x="180" y="42" font-family="Inter, Arial" font-size="18" fill="#2C2C2E">y = f(x)</text></g>
  <g transform="translate(620,285)" stroke-linecap="round"><g stroke="#2C2C2E" stroke-width="4"><line x1="80" y1="130" x2="180" y2="55"/><line x1="80" y1="130" x2="180" y2="210"/><line x1="180" y1="55" x2="315" y2="130"/><line x1="180" y1="210" x2="315" y2="130"/><line x1="80" y1="130" x2="315" y2="130"/></g><circle cx="192" cy="130" r="12" fill="#FAF9F6" stroke="#C5A059" stroke-dasharray="5 5"/><g fill="#D4AF37" stroke="#2C2C2E" stroke-width="3"><circle cx="80" cy="130" r="16"/><circle cx="180" cy="55" r="16"/><circle cx="180" cy="210" r="16"/><circle cx="315" cy="130" r="16"/></g><g font-family="Inter, Arial" font-size="24" font-weight="700" fill="#2C2C2E"><text x="43" y="137">A</text><text x="170" y="25">B</text><text x="170" y="250">C</text><text x="338" y="137">D</text></g></g>
