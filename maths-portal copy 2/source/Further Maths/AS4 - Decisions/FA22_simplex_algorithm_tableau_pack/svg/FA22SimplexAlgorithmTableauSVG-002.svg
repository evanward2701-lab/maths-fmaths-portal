<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Annotated simplex tableau showing pivot column, theta values, pivot row and pivot</title>
  <desc id="desc">Initial simplex tableau. The x column is highlighted as pivot column, theta values are shown, the s row is the pivot row, and the pivot is 10.</desc>
  <metadata>Asset ID: FA22SimplexAlgorithmTableauSVG-002; Used placeholder: [VISUAL PLACEHOLDER: FA22SimplexAlgorithmTableauSVG-002 | Source: Uploaded tableau evidence | Insert from svg/FA22SimplexAlgorithmTableauSVG-002.svg | Purpose: Explain pivot column, theta values, pivot row and pivot in one annotated tableau.]</metadata>
  <defs>
    <marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L10,6 L2,10 Z" fill="#C5A059"/></marker>
    <style>.bg{fill:#FAF9F6}.panel{fill:#FFFFF0;stroke:#E5E5EA;stroke-width:2}.text{fill:#2C2C2E;font-family:Inter,Aptos,'Segoe UI',Arial,sans-serif}.title{font-size:31px;font-weight:700}.subtitle{font-size:18px}.head{fill:#FBEFEF}.pivotCol{fill:#FBEFEF;opacity:.86}.pivotRow{fill:#FFF7D6;opacity:.92}.pivotCell{fill:#D4AF37;opacity:.72;stroke:#2C2C2E;stroke-width:2}.line{stroke:#E5E5EA;stroke-width:2}.border{stroke:#2C2C2E;stroke-width:2;fill:none}.cell{font-size:23px;text-anchor:middle;dominant-baseline:middle}.headText{font-size:18px;font-weight:700;text-anchor:middle;dominant-baseline:middle}.box{fill:#FFFFF0;stroke:#C5A059;stroke-width:2;rx:16}.small{font-size:15px}.math{font-size:21px;font-family:'Cambria Math','STIX Two Math',Georgia,serif}.arrow{stroke:#C5A059;stroke-width:3;fill:none;marker-end:url(#arrowGold)}</style>
  </defs>
  <rect class="bg" width="1200" height="760"/><rect class="panel" x="34" y="34" width="1132" height="692" rx="26"/>
  <text class="text title" x="70" y="88">Reading a simplex tableau</text><text class="text subtitle" x="70" y="120">Pivot column, theta values, pivot row and pivot element.</text>
  <g id="table">
    <rect class="pivotCol" x="260" y="190" width="110" height="304"/><rect class="pivotRow" x="90" y="338" width="870" height="78"/><rect class="head" x="90" y="190" width="870" height="70"/><rect class="pivotCell" x="260" y="338" width="110" height="78"/><rect class="border" x="90" y="190" width="870" height="304"/>
    <line class="line" x1="260" y1="190" x2="260" y2="494"/><line class="line" x1="370" y1="190" x2="370" y2="494"/><line class="line" x1="480" y1="190" x2="480" y2="494"/><line class="line" x1="590" y1="190" x2="590" y2="494"/><line class="line" x1="700" y1="190" x2="700" y2="494"/><line class="line" x1="830" y1="190" x2="830" y2="494"/>
    <line class="line" x1="90" y1="260" x2="960" y2="260"/><line class="line" x1="90" y1="338" x2="960" y2="338"/><line class="line" x1="90" y1="416" x2="960" y2="416"/>
    <text class="text headText" x="175" y="225">Basic variable</text><text class="text headText" x="315" y="225">x</text><text class="text headText" x="425" y="225">y</text><text class="text headText" x="535" y="225">r</text><text class="text headText" x="645" y="225">s</text><text class="text headText" x="765" y="225">Value</text><text class="text headText" x="895" y="225">θ</text>
    <text class="text cell" x="175" y="299">r</text><text class="text cell" x="315" y="299">5</text><text class="text cell" x="425" y="299">7</text><text class="text cell" x="535" y="299">1</text><text class="text cell" x="645" y="299">0</text><text class="text cell" x="765" y="299">70</text><text class="text cell" x="895" y="299">14</text>
    <text class="text cell" x="175" y="377">s</text><text class="text cell" x="315" y="377">10</text><text class="text cell" x="425" y="377">3</text><text class="text cell" x="535" y="377">0</text><text class="text cell" x="645" y="377">1</text><text class="text cell" x="765" y="377">60</text><text class="text cell" x="895" y="377">6</text>
    <text class="text cell" x="175" y="455">P</text><text class="text cell" x="315" y="455">-3</text><text class="text cell" x="425" y="455">-2</text><text class="text cell" x="535" y="455">0</text><text class="text cell" x="645" y="455">0</text><text class="text cell" x="765" y="455">0</text>
  </g>
  <rect class="box" x="1000" y="186" width="142" height="108"/><text class="text small" x="1020" y="218" font-weight="700">Pivot column</text><text class="text math" x="1020" y="250">x-column</text><text class="text small" x="1020" y="276">-3 is most negative</text><path class="arrow" d="M1000 238 C940 230, 850 220, 320 225"/>
  <rect class="box" x="1000" y="330" width="142" height="114"/><text class="text small" x="1020" y="360" font-weight="700">Pivot row</text><text class="text math" x="1020" y="392">s-row</text><text class="text small" x="1020" y="418">θ = 6 smallest</text><path class="arrow" d="M1000 385 C930 382, 820 378, 220 377"/>
  <rect class="box" x="96" y="540" width="310" height="124"/><text class="text small" x="118" y="572" font-weight="700">Theta test</text><text class="text math" x="118" y="606">θ = value ÷ pivot-column entry</text><text class="text math" x="118" y="636">70 ÷ 5 = 14</text><text class="text math" x="118" y="662">60 ÷ 10 = 6</text>
  <rect class="box" x="448" y="540" width="310" height="124"/><text class="text small" x="470" y="572" font-weight="700">Pivot element</text><text class="text math" x="470" y="606">pivot = 10</text><text class="text small" x="470" y="637">Divide the whole pivot row by 10.</text>
</svg>
