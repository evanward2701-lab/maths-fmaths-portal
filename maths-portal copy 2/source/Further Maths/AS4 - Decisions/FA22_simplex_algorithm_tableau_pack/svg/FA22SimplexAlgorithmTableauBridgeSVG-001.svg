<svg width="1200" height="780" viewBox="0 0 1200 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Bridge from ordinary graphical linear programming to Further Maths simplex tableau</title>
  <desc id="desc">A two-column comparison showing ordinary A-Level Maths graphical linear programming on the left and CCEA Further Maths simplex tableau on the right. The central message says same vertices, different machinery.</desc>
  <metadata>Asset ID: FA22SimplexAlgorithmTableauBridgeSVG-001; Used placeholder: [VISUAL PLACEHOLDER: FA22SimplexAlgorithmTableauBridgeSVG-001 | Source: Ordinary A-Level Maths bridge + Further Maths specification | Insert from svg/FA22SimplexAlgorithmTableauBridgeSVG-001.svg | Purpose: Compare prior ordinary Maths method with Further Maths extension.]</metadata>
  <defs><marker id="arrowGold" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L11,6.5 L2,11 Z" fill="#C5A059"/></marker><style>.bg{fill:#FAF9F6}.panel,.card{fill:#FFFFF0;stroke:#E5E5EA;stroke-width:2}.card{rx:24}.accent{fill:#FBEFEF;stroke:#C5A059;stroke-width:2;rx:20}.text{fill:#2C2C2E;font-family:Inter,Aptos,'Segoe UI',Arial,sans-serif}.title{font-size:31px;font-weight:700}.subtitle{font-size:18px}.heading{font-size:24px;font-weight:700}.body{font-size:17px}.math{font-size:19px;font-family:'Cambria Math','STIX Two Math',Georgia,serif}.axis{stroke:#2C2C2E;stroke-width:2}.lineA{stroke:#8E8E93;stroke-width:2.8}.lineB{stroke:#6E6E73;stroke-width:2.8}.feasible{fill:#FBEFEF;stroke:#C5A059;stroke-width:2;opacity:.8}.point{fill:#D4AF37;stroke:#2C2C2E;stroke-width:1.7}.route,.arrow{stroke:#C5A059;stroke-width:4;fill:none;marker-end:url(#arrowGold)}.badge{fill:#FAF9F6;stroke:#C5A059;stroke-width:2;rx:16}</style></defs>
