<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Vertex Testing Widget</title><style>
:root{--canvas:#FAF9F6;--panel:#FFFFF0;--line:#E5E5EA;--accent:#C5A059;--gold:#D4AF37;--soft:#FBEFEF;--text:#2C2C2E}body{margin:0;background:var(--canvas);color:var(--text);font-family:Arial,sans-serif}main{max-width:1000px;margin:24px auto;padding:18px}.shell{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:22px}h1{text-align:center;font-family:Georgia,serif}input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:10px;background:#fff;margin:4px 0 10px}button{padding:10px 14px;border:0;border-radius:12px;background:var(--accent);color:white;font-weight:bold;cursor:pointer}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}.out{background:var(--soft);border-left:4px solid var(--gold);padding:12px;border-radius:12px;margin-top:12px}.math{font-family:Times New Roman,serif;font-size:22px}table{border-collapse:collapse;width:100%;margin-top:12px}td,th{border:1px solid var(--line);padding:8px;text-align:center}.best{background:var(--soft);font-weight:bold}
</style></head><body><main><section class="shell"><h1>Vertex Testing Table</h1><div class="card"><label>Goal</label><select id="goal"><option value="min">Minimise</option><option value="max">Maximise</option></select><label>a in P = ax + by</label><input id="a" type="number" value="140"><label>b in P = ax + by</label><input id="b" type="number" value="170"><label>Vertices, one per line as x,y</label><textarea id="v">0,25
6,7
11,2
13,1</textarea><button onclick="calc()">Calculate</button><div id="out"></div></div></section></main><script>function calc(){let A=+a.value,B=+b.value,rows=v.value.trim().split(/
+/).map(r=>r.split(',').map(Number)).filter(r=>r.length==2&&!isNaN(r[0])&&!isNaN(r[1]));let vals=rows.map(r=>A*r[0]+B*r[1]);let best=goal.value==='max'?Math.max(...vals):Math.min(...vals);let h='<table><tr><th>Vertex</th><th>Coordinates</th><th>Value</th></tr>';rows.forEach((r,i)=>h+=`<tr class="${Math.abs(vals[i]-best)<1e-9?'best':''}"><td>${String.fromCharCode(65+i)}</td><td>(${r[0]},${r[1]})</td><td>${vals[i]}</td></tr>`);h+='</table><div class=out>Best value: <b>'+best+'</b>. Interpret the vertex in context.</div>';out.innerHTML=h}calc()</script></body></html>
