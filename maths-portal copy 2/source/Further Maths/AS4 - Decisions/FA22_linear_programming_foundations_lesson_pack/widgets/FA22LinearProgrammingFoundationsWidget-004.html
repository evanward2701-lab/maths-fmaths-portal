<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Integer Candidate Checker</title><style>
:root{--canvas:#FAF9F6;--panel:#FFFFF0;--line:#E5E5EA;--accent:#C5A059;--gold:#D4AF37;--soft:#FBEFEF;--text:#2C2C2E}body{margin:0;background:var(--canvas);color:var(--text);font-family:Arial,sans-serif}main{max-width:1000px;margin:24px auto;padding:18px}.shell{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:22px}h1{text-align:center;font-family:Georgia,serif}input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:10px;background:#fff;margin:4px 0 10px}button{padding:10px 14px;border:0;border-radius:12px;background:var(--accent);color:white;font-weight:bold;cursor:pointer}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}.out{background:var(--soft);border-left:4px solid var(--gold);padding:12px;border-radius:12px;margin-top:12px}.math{font-family:Times New Roman,serif;font-size:22px}table{border-collapse:collapse;width:100%;margin-top:12px}td,th{border:1px solid var(--line);padding:8px;text-align:center}.best{background:var(--soft);font-weight:bold}
</style></head><body><main><section class="shell"><h1>Integer Candidate Checker</h1><div class="card"><label>Goal</label><select id="goal"><option value="max">Maximise</option><option value="min">Minimise</option></select><label>a in P = ax + by</label><input id="a" type="number" value="18"><label>b in P = ax + by</label><input id="b" type="number" value="25"><label>Candidates, one per line as x,y</label><textarea id="pts">3,6
3,7
4,6
4,7
2,8
3,8
1,8</textarea><button onclick="check()">Check with constraints x≤6, y≤8, 5x+3y≤38</button><div id="out"></div></div></section></main><script>function feas(x,y){return x>=0&&y>=0&&x<=6&&y<=8&&5*x+3*y<=38}function check(){let A=+a.value,B=+b.value,rows=pts.value.trim().split(/
+/).map(r=>r.split(',').map(Number));let data=rows.map(r=>{let f=feas(r[0],r[1]),val=A*r[0]+B*r[1];return{x:r[0],y:r[1],f,val}});let ok=data.filter(d=>d.f);let best=goal.value==='max'?Math.max(...ok.map(d=>d.val)):Math.min(...ok.map(d=>d.val));let h='<table><tr><th>Point</th><th>Feasible?</th><th>Value</th></tr>';data.forEach(d=>h+=`<tr class="${d.f&&Math.abs(d.val-best)<1e-9?'best':''}"><td>(${d.x},${d.y})</td><td>${d.f?'yes':'no'}</td><td>${d.f?d.val:'rejected'}</td></tr>`);h+='</table><div class=out>Never round blindly. Feasibility comes first.</div>';out.innerHTML=h}check()</script></body></html>
