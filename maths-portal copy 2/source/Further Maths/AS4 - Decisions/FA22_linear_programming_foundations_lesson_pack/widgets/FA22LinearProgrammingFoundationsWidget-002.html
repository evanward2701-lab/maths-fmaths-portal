<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Feasible Region Builder</title><style>
:root{--canvas:#FAF9F6;--panel:#FFFFF0;--line:#E5E5EA;--accent:#C5A059;--gold:#D4AF37;--soft:#FBEFEF;--text:#2C2C2E}body{margin:0;background:var(--canvas);color:var(--text);font-family:Arial,sans-serif}main{max-width:1000px;margin:24px auto;padding:18px}.shell{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:22px}h1{text-align:center;font-family:Georgia,serif}input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:10px;background:#fff;margin:4px 0 10px}button{padding:10px 14px;border:0;border-radius:12px;background:var(--accent);color:white;font-weight:bold;cursor:pointer}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}.out{background:var(--soft);border-left:4px solid var(--gold);padding:12px;border-radius:12px;margin-top:12px}.math{font-family:Times New Roman,serif;font-size:22px}table{border-collapse:collapse;width:100%;margin-top:12px}td,th{border:1px solid var(--line);padding:8px;text-align:center}.best{background:var(--soft);font-weight:bold}
canvas{width:100%;max-width:650px;aspect-ratio:1;background:#FFFFF0;border:1px solid var(--line);border-radius:16px}</style></head><body><main><section class="shell"><h1>Feasible Region Builder</h1><div class="card"><p>Default constraints: x,y ≥ 0, x+y ≤ 10, 2x+y ≤ 14, x+3y ≤ 18.</p><button onclick="draw()">Plot sample feasible points</button><div class="out">Gold points satisfy every constraint. This reinforces the feasible-region overlap idea.</div></div><canvas id="g" width="650" height="650"></canvas></section></main><script>function draw(){let c=g.getContext('2d'),p=45,s=36;c.fillStyle='#FFFFF0';c.fillRect(0,0,650,650);c.strokeStyle='#E5E5EA';for(let i=0;i<=15;i++){c.beginPath();c.moveTo(p+i*s,p);c.lineTo(p+i*s,p+15*s);c.stroke();c.beginPath();c.moveTo(p,p+i*s);c.lineTo(p+15*s,p+i*s);c.stroke()}function X(x){return p+x*s}function Y(y){return p+(15-y)*s}c.strokeStyle='#2C2C2E';c.lineWidth=2;c.beginPath();c.moveTo(X(0),Y(0));c.lineTo(X(15),Y(0));c.moveTo(X(0),Y(0));c.lineTo(X(0),Y(15));c.stroke();c.fillStyle='rgba(212,175,55,.45)';for(let x=0;x<=15;x+=.25)for(let y=0;y<=15;y+=.25)if(x+y<=10&&2*x+y<=14&&x+3*y<=18) c.fillRect(X(x)-2,Y(y)-2,4,4);c.strokeStyle='#C5A059';c.lineWidth=3;function line(x1,y1,x2,y2){c.beginPath();c.moveTo(X(x1),Y(y1));c.lineTo(X(x2),Y(y2));c.stroke()}line(0,10,10,0);line(0,14,7,0);line(0,6,15,1)}draw()</script></body></html>
