<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Constraint Translator</title><style>
:root{--canvas:#FAF9F6;--panel:#FFFFF0;--line:#E5E5EA;--accent:#C5A059;--gold:#D4AF37;--soft:#FBEFEF;--text:#2C2C2E}body{margin:0;background:var(--canvas);color:var(--text);font-family:Arial,sans-serif}main{max-width:1000px;margin:24px auto;padding:18px}.shell{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:22px}h1{text-align:center;font-family:Georgia,serif}input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:10px;background:#fff;margin:4px 0 10px}button{padding:10px 14px;border:0;border-radius:12px;background:var(--accent);color:white;font-weight:bold;cursor:pointer}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}.out{background:var(--soft);border-left:4px solid var(--gold);padding:12px;border-radius:12px;margin-top:12px}.math{font-family:Times New Roman,serif;font-size:22px}table{border-collapse:collapse;width:100%;margin-top:12px}td,th{border:1px solid var(--line);padding:8px;text-align:center}.best{background:var(--soft);font-weight:bold}
</style></head><body><main><section class="shell"><h1>Constraint Translator</h1><div class="card"><label>Phrase type</label><select id="t"><option value="least">At least A</option><option value="most">No more than A</option><option value="twice">At least twice as many A as B</option><option value="between">Between percentages of total</option><option value="ratio">For every m of A, at least n of B</option></select><label>Variable A</label><input id="a" value="x"><label>Variable B</label><input id="b" value="y"><label>Variable C</label><input id="c" value="z"><label>Number 1</label><input id="n1" type="number" value="40"><label>Number 2</label><input id="n2" type="number" value="60"><button onclick="go()">Translate</button><div class="out" id="o"></div></div></section></main><script>function go(){let t=document.getElementById('t').value,A=a.value,B=b.value,C=c.value,n1=+document.getElementById('n1').value,n2=+document.getElementById('n2').value,s='';if(t==='least')s=`<div class=math>${A} ≥ ${n1}</div><p>“At least” means greater than or equal to.</p>`;if(t==='most')s=`<div class=math>${A} ≤ ${n1}</div><p>“No more than” means less than or equal to.</p>`;if(t==='twice')s=`<div class=math>${A} ≥ 2${B}</div><p>Trap: do not automatically write 2${A} ≥ ${B}. Test with numbers.</p>`;if(t==='between')s=`<div class=math>${A} ≥ ${n1/100}(${A}+${B}+${C})</div><div class=math>${A} ≤ ${n2/100}(${A}+${B}+${C})</div><p>Split “between” into two constraints.</p>`;if(t==='ratio')s=`<p>For every ${n1} of ${A}, at least ${n2} of ${B}:</p><div class=math>${n1}${B} ≥ ${n2}${A}</div>`;o.innerHTML=s}go()</script></body></html>
