<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Feasible Region Convention</title>
  <desc id="desc">Shaded rejected regions and unshaded feasible region R.</desc>
  <metadata>asset_id: FA22LinearProgrammingFoundationsSVG-002; source: Chapter 6 PDF graphical methods page; purpose: Show feasible region convention.</metadata>
  <rect width="1200" height="760" fill="#FAF9F6"/>
  <rect x="50" y="40" width="1100" height="680" rx="28" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="2"/>
  <text x="600" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#2C2C2E">Feasible Region Convention</text>
  
  <text x="600" y="130" text-anchor="middle" font-family="Arial" font-size="17" fill="#2C2C2E">Evidence convention: shade rejected regions; leave R unshaded.</text>
  <g transform="translate(170,620)">
    <line x1="0" y1="0" x2="580" y2="0" stroke="#2C2C2E" stroke-width="3"/>
    <line x1="0" y1="0" x2="0" y2="-460" stroke="#2C2C2E" stroke-width="3"/>
    <polygon points="0,-130 280,-130 430,-280 120,-360" fill="#FFFFF0" stroke="#D4AF37" stroke-width="4"/>
    <polygon points="0,-460 580,-460 580,-280 430,-280 120,-360 0,-130" fill="#FBEFEF" opacity="0.65"/>
    <line x1="0" y1="-130" x2="560" y2="-410" stroke="#C5A059" stroke-width="4"/>
    <line x1="120" y1="0" x2="500" y2="-430" stroke="#2C2C2E" stroke-width="3"/>
    <text x="230" y="-230" font-family="Georgia" font-size="48" fill="#2C2C2E">R</text>
    <text x="425" y="-365" font-family="Arial" font-size="18" fill="#2C2C2E">rejected</text>
  </g>
  <rect x="840" y="200" width="270" height="260" rx="20" fill="#FBEFEF" stroke="#C5A059"/>
  <text x="975" y="250" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#2C2C2E">Warning</text>
  <text x="975" y="305" text-anchor="middle" font-family="Arial" font-size="16" fill="#2C2C2E">Graphing software may shade</text>
  <text x="975" y="330" text-anchor="middle" font-family="Arial" font-size="16" fill="#2C2C2E">the satisfying side.</text>
</svg>
