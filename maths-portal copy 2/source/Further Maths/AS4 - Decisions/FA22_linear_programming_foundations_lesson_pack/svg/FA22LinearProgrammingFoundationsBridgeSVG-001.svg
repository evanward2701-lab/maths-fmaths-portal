<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">A-Level Maths Bridge to Further Maths Linear Programming</title>
  <desc id="desc">Comparison of ordinary A-Level Maths skills and Further Maths LP use.</desc>
  <metadata>asset_id: FA22LinearProgrammingFoundationsBridgeSVG-001; source: Ordinary A-Level bridge plus Further Maths specification; purpose: Compare prior methods with LP extension.</metadata>
  <rect width="1200" height="760" fill="#FAF9F6"/>
  <rect x="50" y="40" width="1100" height="680" rx="28" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="2"/>
  <text x="600" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#2C2C2E">A-Level Maths Bridge to Further Maths Linear Programming</text>
  
  <text x="600" y="130" text-anchor="middle" font-family="Arial" font-size="17" fill="#2C2C2E">The algebra is familiar. The purpose changes.</text>
  <rect x="90" y="180" width="450" height="410" rx="22" fill="#FFFFFF" stroke="#E5E5EA"/>
  <rect x="660" y="180" width="450" height="410" rx="22" fill="#FFFFFF" stroke="#E5E5EA"/>
  <text x="315" y="225" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700">Ordinary A-Level Maths</text>
  <text x="885" y="225" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700">Further Maths LP</text>
  <text x="315" y="300" text-anchor="middle" font-family="Arial" font-size="20">Draw y = mx + c</text>
  <text x="315" y="370" text-anchor="middle" font-family="Arial" font-size="20">Shade an inequality</text>
  <text x="315" y="440" text-anchor="middle" font-family="Arial" font-size="20">Solve simultaneous equations</text>
  <text x="315" y="510" text-anchor="middle" font-family="Arial" font-size="20">Substitute into a formula</text>
  <text x="885" y="300" text-anchor="middle" font-family="Arial" font-size="20">Draw a constraint boundary</text>
  <text x="885" y="370" text-anchor="middle" font-family="Arial" font-size="20">Build the feasible region</text>
  <text x="885" y="440" text-anchor="middle" font-family="Arial" font-size="20">Find vertices</text>
  <text x="885" y="510" text-anchor="middle" font-family="Arial" font-size="20">Evaluate the objective function</text>
  <line x1="540" y1="300" x2="660" y2="300" stroke="#C5A059" stroke-width="4"/>
  <line x1="540" y1="370" x2="660" y2="370" stroke="#C5A059" stroke-width="4"/>
  <line x1="540" y1="440" x2="660" y2="440" stroke="#C5A059" stroke-width="4"/>
  <line x1="540" y1="510" x2="660" y2="510" stroke="#C5A059" stroke-width="4"/>
  <text x="600" y="665" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Key upgrade: the graph becomes a map of possible decisions.</text>
</svg>
