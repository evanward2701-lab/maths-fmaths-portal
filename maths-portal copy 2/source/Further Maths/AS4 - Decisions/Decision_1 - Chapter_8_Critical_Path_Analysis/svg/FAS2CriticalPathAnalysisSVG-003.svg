<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="620" viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">FAS2CriticalPathAnalysisSVG-003: Dummy Activities and Unique Representation</title>
<desc id="desc">Invalid double edge compared with valid dummy activity.</desc>
<defs>
<marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#2C2C2E"/></marker>
<style>
.bg{fill:#FAF9F6} .panel{fill:#FFFFF0;stroke:#E5E5EA;stroke-width:2} .node{fill:#FFFFF0;stroke:#2C2C2E;stroke-width:3} .arc{stroke:#2C2C2E;stroke-width:4;fill:none;marker-end:url(#arrow)} .dummy{stroke:#2C2C2E;stroke-width:4;stroke-dasharray:10 8;fill:none;marker-end:url(#arrow)} .accent{fill:#FBEFEF;stroke:#C5A059;stroke-width:2} .text{fill:#2C2C2E;font-family:Arial,Helvetica,sans-serif} .title{font-size:30px;font-weight:700} .label{font-size:20px;font-weight:700} .small{font-size:16px}
</style>
</defs>
<rect class="bg" width="1000" height="620"/><rect class="panel" x="30" y="30" width="940" height="560" rx="24"/>

<text class="text title" x="70" y="85">Dummy Activities and Unique Representation</text>
<text class="text label" x="100" y="150">Invalid: double edge</text>
<circle class="node" cx="160" cy="290" r="28"/><circle class="node" cx="360" cy="290" r="28"/><circle class="node" cx="500" cy="290" r="28"/>
<path class="arc" d="M185 275 C240 220 300 220 335 275"/><path class="arc" d="M185 305 C240 360 300 360 335 305"/><path class="arc" d="M390 290 L470 290"/>
<text class="text label" x="260" y="230">A</text><text class="text label" x="260" y="365">B</text><text class="text label" x="430" y="270">C</text>
<line x1="210" y1="210" x2="350" y2="370" stroke="#C5A059" stroke-width="16" stroke-linecap="round"/><line x1="350" y1="210" x2="210" y2="370" stroke="#C5A059" stroke-width="16" stroke-linecap="round"/>
<text class="text label" x="610" y="150">Valid: use a dummy</text>
<circle class="node" cx="650" cy="320" r="28"/><circle class="node" cx="805" cy="240" r="28"/><circle class="node" cx="805" cy="400" r="28"/><circle class="node" cx="910" cy="320" r="28"/>
<path class="arc" d="M676 306 L780 254"/><path class="arc" d="M676 334 L780 386"/><path class="dummy" d="M805 268 L805 372"/><path class="arc" d="M833 400 L886 340"/>
<text class="text label" x="720" y="260">A</text><text class="text label" x="720" y="405">B</text><text class="text label" x="825" y="330">Dummy</text><text class="text label" x="870" y="410">C</text>
<rect class="accent" x="160" y="480" width="680" height="70" rx="14"/><text class="text label" x="185" y="520">Rule: at most one activity between any two events.</text>

</svg>
