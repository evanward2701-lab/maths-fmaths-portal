<rect class="node" x="330" y="160" width="70" height="90" rx="6"/><line x1="330" y1="205" x2="400" y2="205" stroke="#2C2C2E" stroke-width="2"/><text class="text label" x="356" y="192">4</text><text class="text label" x="356" y="237">4</text>
<rect class="node" x="330" y="360" width="70" height="90" rx="6"/><line x1="330" y1="405" x2="400" y2="405" stroke="#2C2C2E" stroke-width="2"/><text class="text label" x="356" y="392">6</text><text class="text label" x="356" y="437">6</text>
<rect class="node" x="560" y="260" width="70" height="90" rx="6"/><line x1="560" y1="305" x2="630" y2="305" stroke="#2C2C2E" stroke-width="2"/><text class="text label" x="586" y="292">9</text><text class="text label" x="586" y="337">9</text>
<rect class="node" x="790" y="260" width="80" height="90" rx="6"/><line x1="790" y1="305" x2="870" y2="305" stroke="#2C2C2E" stroke-width="2"/><text class="text label" x="812" y="292">16</text><text class="text label" x="812" y="337">16</text>
<path class="arc" d="M180 270 L330 205"/><path class="arc" d="M180 340 L330 405"/><path class="arc" d="M400 205 L560 285"/><path class="arc" d="M400 405 L560 325"/><path class="arc" d="M630 305 L790 305"/>
<text class="text label" x="235" y="220">A(4)</text><text class="text label" x="235" y="395">B(6)</text><text class="text label" x="460" y="240">C(5)</text><text class="text label" x="460" y="410">D(3)</text><text class="text label" x="690" y="285">E(7)</text>
