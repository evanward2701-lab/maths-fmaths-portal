<text class="text title" x="70" y="85">A-Level Maths Bridge: From Tables to Project Networks</text>
<rect class="accent" x="80" y="150" width="350" height="300" rx="18"/><text class="text label" x="110" y="195">Ordinary Maths habits</text><text class="text small" x="110" y="235">• Read tables</text><text class="text small" x="110" y="270">• Follow graph direction</text><text class="text small" x="110" y="305">• Choose max/min values</text><text class="text small" x="110" y="340">• Interpret model outputs</text>
<path d="M450 300 L550 300" stroke="#D4AF37" stroke-width="5" marker-end="url(#arrow)"/>
<rect class="accent" x="570" y="150" width="350" height="300" rx="18"/><text class="text label" x="600" y="195">Further Maths upgrade</text><text class="text small" x="600" y="235">• Precedence table</text><text class="text small" x="600" y="270">• Activity-on-arc network</text><text class="text small" x="600" y="305">• Forward/backward pass</text><text class="text small" x="600" y="340">• Float and critical path</text>
