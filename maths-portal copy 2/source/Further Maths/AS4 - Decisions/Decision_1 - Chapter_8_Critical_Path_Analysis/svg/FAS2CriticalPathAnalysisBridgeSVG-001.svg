<svg width="1000" height="620" viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">FAS2CriticalPathAnalysisBridgeSVG-001: A-Level Maths Bridge</title>
<desc id="desc">Bridge from ordinary table and graph skills to Further Maths CPA.</desc>
<defs>
