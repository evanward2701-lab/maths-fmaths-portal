<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FAS2CriticalPathAnalysisWidget-002</title><style>body{font-family:Arial;background:#FAF9F6;color:#2C2C2E}.shell{max-width:950px;margin:24px auto;background:#FFFFF0;border:1px solid #E5E5EA;border-radius:20px;padding:20px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #E5E5EA;padding:8px}th{background:#FBEFEF}input,button{padding:8px;border-radius:10px;border:1px solid #C5A059}button{background:#D4AF37;font-weight:bold}.good{border-left:6px solid #2F6F4E}.bad{border-left:6px solid #8A3A3A}.fb{margin:8px 0;padding:8px;background:white;border-radius:10px}</style></head><body><main class="shell"><h1>Forward and Backward Pass Checker</h1><p>Network: A(4), B(6), C(5), D(3), E(7), F(8). Forward: add and choose largest. Backward: subtract and choose smallest.</p><table><thead><tr><th>Event</th><th>Early</th><th>Late</th></tr></thead><tbody id="rows"></tbody></table><p><button id="check">Check</button> <button id="show">Show answers</button> <button id="reset">Reset</button></p><div id="feedback"></div></main><script>
const ans={0:[0,0],1:[4,4],2:[6,6],3:[9,9],4:[16,16]},exp={0:"Source: 0,0",1:"0+4=4; 9-5=4",2:"0+6=6; min(9-3,16-8)=6",3:"max(4+5,6+3)=9; 16-7=9",4:"max(9+7,6+8)=16; sink late equals early"};
const rows=document.getElementById('rows'),fb=document.getElementById('feedback');function load(){rows.innerHTML=Object.keys(ans).map(k=>`<tr><td><b>${k}</b></td><td><input id="e-${k}" type="number"></td><td><input id="l-${k}" type="number"></td></tr>`).join('');fb.innerHTML=''}function val(id){const x=document.getElementById(id).value;return x===''?null:Number(x)}function check(){fb.innerHTML='';let c=0,t=0;for(const [k,[e,l]] of Object.entries(ans)){const eo=val('e-'+k)===e,lo=val('l-'+k)===l;c+=eo+lo;t+=2;fb.innerHTML+=`<div class="fb ${eo&&lo?'good':'bad'}"><b>Event ${k}</b>: early ${e}, late ${l}. ${exp[k]}</div>`}fb.innerHTML='<h3>Score '+c+'/'+t+'</h3>'+fb.innerHTML}function show(){for(const [k,[e,l]] of Object.entries(ans)){document.getElementById('e-'+k).value=e;document.getElementById('l-'+k).value=l}check()}document.getElementById('check').onclick=check;document.getElementById('show').onclick=show;document.getElementById('reset').onclick=load;load();
</script></body></html>
