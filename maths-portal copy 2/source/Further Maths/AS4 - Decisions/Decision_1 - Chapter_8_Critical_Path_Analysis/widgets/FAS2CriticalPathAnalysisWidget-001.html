<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FAS2CriticalPathAnalysisWidget-001</title><style>body{font-family:Arial;background:#FAF9F6;color:#2C2C2E}.shell{max-width:1000px;margin:24px auto;background:#FFFFF0;border:1px solid #E5E5EA;border-radius:20px;padding:20px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #E5E5EA;padding:8px}th{background:#FBEFEF}input,select,button{padding:8px;border-radius:10px;border:1px solid #C5A059}button{background:#D4AF37;font-weight:bold}.ok{border-left:6px solid #2F6F4E}.bad{border-left:6px solid #8A3A3A}.fb{margin:8px 0;padding:8px;background:white;border-radius:10px}</style></head><body><main class="shell"><h1>Precedence Table Builder</h1><p>Practise immediate predecessors only.</p><select id="scenario"></select><div id="activityList"></div><table><thead><tr><th>Activity</th><th>Immediately preceding activities</th></tr></thead><tbody id="rows"></tbody></table><p><button id="check">Check</button> <button id="show">Show answers</button> <button id="reset">Reset</button></p><div id="feedback"></div></main><script>
const scenarios={sofa:{title:"Manufacturing a sofa",activities:{A:"Build wooden frame",B:"Cut fabric",C:"Stitch cushions",D:"Attach springs",E:"Cover frame",F:"Complete assembly",G:"Inspect",H:"Wrap"},answers:{A:[],B:[],C:["B"],D:["A"],E:["D"],F:["C","E"],G:["F"],H:["G"]}},final:{title:"Final activity shortcut",activities:{A:"Initial",B:"After A",C:"After B",D:"After B",E:"Final"},answers:{A:[],B:["A"],C:["B"],D:["B"],E:["C","D"]}}};
const sel=document.getElementById('scenario'),list=document.getElementById('activityList'),rows=document.getElementById('rows'),fb=document.getElementById('feedback');
function fmt(a){return a.length?a.join(','):'-'} function norm(s){s=s.trim().toUpperCase();return !s||s==='-'?[]:[...new Set(s.split(/[, ]+/).filter(Boolean))].sort()} function same(a,b){a=[...a].sort();b=[...b].sort();return a.length===b.length&&a.every((x,i)=>x===b[i])}
function load(){const sc=scenarios[sel.value];list.innerHTML='<h2>'+sc.title+'</h2>'+Object.entries(sc.activities).map(([k,v])=>`<p><b>${k}</b>: ${v}</p>`).join('');rows.innerHTML=Object.keys(sc.activities).map(k=>`<tr><td><b>${k}</b></td><td><input id="i-${k}" placeholder="-"></td></tr>`).join('');fb.innerHTML=''}
function check(){const sc=scenarios[sel.value];fb.innerHTML='';let c=0,t=0;for(const [k,a] of Object.entries(sc.answers)){const st=norm(document.getElementById('i-'+k).value),ok=same(st,a);c+=ok;t++;fb.innerHTML+=`<div class="fb ${ok?'ok':'bad'}"><b>${k}</b>: yours ${fmt(st)}, answer ${fmt(a)}</div>`}fb.innerHTML='<h3>Score '+c+'/'+t+'</h3>'+fb.innerHTML}
function show(){const sc=scenarios[sel.value];for(const [k,a] of Object.entries(sc.answers))document.getElementById('i-'+k).value=fmt(a);check()}function reset(){load()}
Object.entries(scenarios).forEach(([k,v])=>{const o=document.createElement('option');o.value=k;o.textContent=v.title;sel.appendChild(o)});sel.onchange=load;document.getElementById('check').onclick=check;document.getElementById('show').onclick=show;document.getElementById('reset').onclick=reset;load();
</script></body></html>
