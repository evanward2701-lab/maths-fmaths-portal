<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FAS2CriticalPathAnalysisWidget-003</title><style>body{font-family:Arial;background:#FAF9F6;color:#2C2C2E}.shell{max-width:950px;margin:24px auto;background:#FFFFF0;border:1px solid #E5E5EA;border-radius:20px;padding:20px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #E5E5EA;padding:8px}th{background:#FBEFEF}input,select,button{padding:8px;border-radius:10px;border:1px solid #C5A059}button{background:#D4AF37;font-weight:bold}.good{border-left:6px solid #2F6F4E}.bad{border-left:6px solid #8A3A3A}.fb{margin:8px 0;padding:8px;background:white;border-radius:10px}</style></head><body><main class="shell"><h1>Float and Critical Path Checker</h1><p>Formula: float = L_j - d - E_i. Zero float means critical.</p><select id="act"></select><p id="data"></p><label>Your float <input id="float" type="number"></label> <label>Critical? <select id="crit"><option value="">Choose</option><option value="yes">Yes</option><option value="no">No</option></select></label><p><button id="check">Check</button> <button id="show">Show answer</button> <button id="reset">Reset</button></p><div id="feedback" class="fb" hidden></div><table><thead><tr><th>Act</th><th>E_i</th><th>d</th><th>L_j</th><th>Float</th></tr></thead><tbody id="rows"></tbody></table></main><script>
const acts={A:[0,4,4],B:[0,6,6],C:[4,5,9],D:[6,3,9],E:[9,7,16],F:[6,8,16],X:[10,6,18]};const sel=document.getElementById('act'),data=document.getElementById('data'),fl=document.getElementById('float'),crit=document.getElementById('crit'),fb=document.getElementById('feedback');function f(a){return a[2]-a[1]-a[0]}function load(){const a=acts[sel.value];data.innerHTML=`E_i=${a[0]}, d=${a[1]}, L_j=${a[2]}`;fl.value='';crit.value='';fb.hidden=true}Object.keys(acts).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k==='X'?'Trap example X':'Activity '+k;sel.appendChild(o)});document.getElementById('rows').innerHTML=Object.entries(acts).map(([k,a])=>`<tr><td>${k}</td><td>${a[0]}</td><td>${a[1]}</td><td>${a[2]}</td><td>${f(a)}</td></tr>`).join('');function check(){const a=acts[sel.value],ans=f(a),isCrit=ans===0,fo=Number(fl.value)===ans,co=(crit.value==='yes')===isCrit&&crit.value!=='';fb.hidden=false;fb.className='fb '+(fo&&co?'good':'bad');fb.innerHTML=`float = ${a[2]} - ${a[1]} - ${a[0]} = ${ans}. ${isCrit?'Critical':'Not critical'}. ${sel.value==='X'?'Trap: critical endpoints alone are not enough.':''}`}function show(){const a=acts[sel.value];fl.value=f(a);crit.value=f(a)===0?'yes':'no';check()}sel.onchange=load;document.getElementById('check').onclick=check;document.getElementById('show').onclick=show;document.getElementById('reset').onclick=load;load();
</script></body></html>
