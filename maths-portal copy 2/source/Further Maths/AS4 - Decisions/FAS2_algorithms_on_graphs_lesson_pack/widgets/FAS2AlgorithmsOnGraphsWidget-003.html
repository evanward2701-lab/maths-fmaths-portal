<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FAS2AlgorithmsOnGraphsWidget-003</title><style>body{font-family:Arial,sans-serif;background:#FAF9F6;color:#2C2C2E;margin:0;padding:24px}.card{max-width:900px;margin:auto;background:#FFFFF0;border:1px solid #E5E5EA;border-radius:20px;padding:20px}button,input{border:1px solid #E5E5EA;border-radius:12px;padding:10px;margin:4px}button{background:#FBEFEF;font-weight:700}.choice{font-size:1.4rem;background:white}.used{opacity:.35}</style></head><body><main class="card"><h1>Greedy Choice Mini-Simulator</h1><p>Rule: choose the smallest available permitted value at each stage.</p><input id="nums" value="4, 7, 2, 9, 5"><button onclick="load()">Load/reset</button><div id="choices"></div><p id="feedback"></p><div id="hist"></div></main><script>let vals=[],chosen=[];function load(){vals=document.getElementById('nums').value.split(',').map(x=>Number(x.trim())).filter(Number.isFinite);chosen=[];document.getElementById('hist').innerHTML='';render('Choose the smallest remaining value.')}function greedy(){return Math.min(...vals.filter(v=>!chosen.includes(v)))}function pick(v){const g=greedy();if(v===g){chosen.push(v);document.getElementById('hist').innerHTML='<p>Chose '+v+' correctly.</p>'+document.getElementById('hist').innerHTML;render(chosen.length===vals.length?'Complete: '+chosen.join(', '):'Correct. Continue.')}else render('Not greedy now. The locally best permitted choice is '+g+'.')}function render(msg){document.getElementById('feedback').textContent=msg;document.getElementById('choices').innerHTML=vals.map(v=>`<button class="choice ${chosen.includes(v)?'used':''}" ${chosen.includes(v)?'disabled':''} onclick="pick(${v})">${v}</button>`).join('')}load();</script></body></html>
