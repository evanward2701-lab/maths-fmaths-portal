<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FAS2AlgorithmsOnGraphsWidget-001</title><style>body{font-family:Arial,sans-serif;background:#FAF9F6;color:#2C2C2E;margin:0;padding:24px}.card{max-width:900px;margin:auto;background:#FFFFF0;border:1px solid #E5E5EA;border-radius:20px;padding:20px}button,input{border:1px solid #E5E5EA;border-radius:12px;padding:10px;margin:4px}button{background:#FBEFEF;font-weight:700}table{border-collapse:collapse;width:100%;margin-top:16px;background:white}td,th{border:1px solid #E5E5EA;padding:8px;text-align:center}th{background:#FBEFEF}</style></head><body><main class="card"><h1>Trace Table Stepper</h1><p>Enter five values. The algorithm stores A = u₁ and updates A only when T &lt; A.</p><div id="inputs"></div><button onclick="reset()">Reset</button><button onclick="step()">Next step</button><button onclick="run()">Run to end</button><p id="state"></p><table><thead><tr><th>n</th><th>A</th><th>T</th><th>Decision</th><th>Action</th></tr></thead><tbody id="body"></tbody></table></main><script>const defaults=[10,15,9,7,11];let vals,n,A,T,done,rows;document.getElementById('inputs').innerHTML=defaults.map((v,i)=>`u${i+1}<input id="u${i}" type="number" value="${v}">`).join(' ');function read(){return defaults.map((_,i)=>Number(document.getElementById('u'+i).value||0))}function reset(){vals=read();n=1;A=vals[0];T='';done=false;rows=[{n,A,T:'',d:'',a:'Initial A = u1'}];render('Initialised.')}function step(){if(done){render('Already stopped. Output = '+A);return}if(n>=vals.length){done=true;rows.push({n,A,T:'',d:'n < '+vals.length+' false',a:'Stop. Output '+A});render('Stopped. Output = '+A);return}n++;T=vals[n-1];const old=A;if(T<A){A=T;rows.push({n,A,T,d:T+' < '+old+' true',a:'Replace A by T'});}else{rows.push({n,A,T,d:T+' < '+old+' false',a:'Keep A'});}if(n===vals.length){done=true;render('Final output = '+A+'. Purpose: finds smallest value.')}else render('Inspected u'+n+'.')}function run(){while(!done)step()}function render(msg){document.getElementById('state').innerHTML=msg+' Current: n='+n+', A='+A+', T='+(T||'-');document.getElementById('body').innerHTML=rows.map(r=>`<tr><td>${r.n}</td><td>${r.A}</td><td>${r.T}</td><td>${r.d}</td><td>${r.a}</td></tr>`).join('')}reset();</script></body></html>
