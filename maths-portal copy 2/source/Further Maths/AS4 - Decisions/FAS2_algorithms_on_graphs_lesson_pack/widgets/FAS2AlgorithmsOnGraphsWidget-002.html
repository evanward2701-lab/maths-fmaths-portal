<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FAS2AlgorithmsOnGraphsWidget-002</title><style>body{font-family:Arial,sans-serif;background:#FAF9F6;color:#2C2C2E;margin:0;padding:24px}.card{max-width:900px;margin:auto;background:#FFFFF0;border:1px solid #E5E5EA;border-radius:20px;padding:20px}select,button{border:1px solid #E5E5EA;border-radius:12px;padding:10px;margin:4px}button{background:#FBEFEF;font-weight:700}.q{background:white;border:1px solid #E5E5EA;border-radius:14px;padding:10px;margin:8px 0}</style></head><body><main class="card"><h1>Algorithm Component Classifier</h1><div id="qs"></div><button onclick="check()">Check answers</button><p id="score"></p></main><script>const data=[['Input A, B and N','input'],['Let H = (B - A) / N','instruction'],['If n < 5 go to Step 3','loop'],['Print C','output'],['Stop','termination'],['Is T < A?','decision']];const cats=['','input','instruction','decision','loop','output','termination'];document.getElementById('qs').innerHTML=data.map((d,i)=>`<div class="q"><strong>${d[0]}</strong><select id="s${i}">${cats.map(c=>`<option>${c}</option>`).join('')}</select><span id="f${i}"></span></div>`).join('');function check(){let n=0;data.forEach((d,i)=>{const ok=document.getElementById('s'+i).value===d[1];if(ok)n++;document.getElementById('f'+i).textContent=ok?' Correct':' Correct answer: '+d[1];});document.getElementById('score').textContent='Score: '+n+' / '+data.length}</script></body></html>
