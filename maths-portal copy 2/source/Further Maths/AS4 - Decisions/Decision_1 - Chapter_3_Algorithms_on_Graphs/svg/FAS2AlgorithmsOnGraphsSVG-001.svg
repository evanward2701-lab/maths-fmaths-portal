<title id="title">Minimal Spanning Tree Concept</title><desc id="desc">A weighted graph with vertices A, B, C, D and E reduced to a minimal spanning tree with total weight 20.</desc><metadata>Asset ID: FAS2AlgorithmsOnGraphsSVG-001; Source: Supplied PDF minimum spanning tree and Prim's algorithm evidence.</metadata>
