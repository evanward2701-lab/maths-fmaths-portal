<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="720" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Dijkstra Traceback</title><desc id="desc">Dijkstra traceback for route S to B to C to D to F to T with final labels 0, 3, 7, 10, 15 and 18.</desc><metadata>Asset ID: FAS2AlgorithmsOnGraphsSVG-003; Source: Supplied PDF Dijkstra traceback instruction.</metadata>
<rect width="1200" height="720" fill="#FAF9F6"/><rect x="52" y="40" width="1096" height="640" rx="28" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/>
<text x="600" y="86" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#2C2C2E">Dijkstra’s Algorithm: Trace Back the Shortest Path</text>
<text x="600" y="124" text-anchor="middle" font-family="Arial" font-size="18" fill="#5B5B60">Include an arc when the difference between final labels equals the arc weight.</text>
<defs><marker id="arrowTrace" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M2,2 L12,7 L2,12 Z" fill="#C5A059"/></marker></defs>
<g font-family="Arial" fill="#2C2C2E"><g stroke="#C5A059" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowTrace)"><line x1="168" y1="318" x2="318" y2="318"/><line x1="368" y1="318" x2="518" y2="318"/><line x1="568" y1="318" x2="718" y2="318"/><line x1="768" y1="318" x2="918" y2="318"/><line x1="968" y1="318" x2="1072" y2="318"/></g>
<g fill="#FAF9F6" stroke="#2C2C2E" stroke-width="3"><circle cx="140" cy="318" r="34"/><circle cx="340" cy="318" r="34"/><circle cx="540" cy="318" r="34"/><circle cx="740" cy="318" r="34"/><circle cx="940" cy="318" r="34"/><circle cx="1100" cy="318" r="34"/></g>
<g text-anchor="middle" dominant-baseline="middle" font-size="24" font-weight="700"><text x="140" y="318">S</text><text x="340" y="318">B</text><text x="540" y="318">C</text><text x="740" y="318">D</text><text x="940" y="318">F</text><text x="1100" y="318">T</text></g>
<g text-anchor="middle" font-size="18" fill="#5B5B60"><text x="140" y="384">d(S)=0</text><text x="340" y="384">d(B)=3</text><text x="540" y="384">d(C)=7</text><text x="740" y="384">d(D)=10</text><text x="940" y="384">d(F)=15</text><text x="1100" y="384">d(T)=18</text></g>
<g text-anchor="middle" font-size="20" font-weight="700"><text x="240" y="290">3</text><text x="440" y="290">4</text><text x="640" y="290">3</text><text x="840" y="290">5</text><text x="1020" y="290">3</text></g>
<rect x="178" y="462" width="844" height="138" rx="22" fill="#FAF9F6" stroke="#E5E5EA" stroke-width="2"/><text x="600" y="500" text-anchor="middle" font-size="24" font-weight="700">Traceback checks</text><text x="236" y="545" font-size="22">18 − 3 = 15</text><text x="396" y="545" font-size="22">15 − 5 = 10</text><text x="556" y="545" font-size="22">10 − 3 = 7</text><text x="710" y="545" font-size="22">7 − 4 = 3</text><text x="860" y="545" font-size="22">3 − 3 = 0</text><text x="600" y="637" text-anchor="middle" font-size="20" fill="#5B5B60">Reverse the backward chain T ← F ← D ← C ← B ← S to state the route S → B → C → D → F → T.</text></g>
</svg>
