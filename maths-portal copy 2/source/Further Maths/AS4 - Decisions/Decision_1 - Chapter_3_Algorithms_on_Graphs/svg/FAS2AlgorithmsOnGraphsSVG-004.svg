<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="780" viewBox="0 0 1200 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">FAS2 Algorithms on Graphs Boundary Map</title><desc id="desc">A syllabus boundary map separating core content, official FAS2 content with missing evidence, and supplied evidence excluded from required core.</desc><metadata>Asset ID: FAS2AlgorithmsOnGraphsSVG-004; Source: CCEA FAS2 specification boundary + supplied lesson evidence.</metadata>
<rect width="1200" height="780" fill="#FAF9F6"/><rect x="44" y="42" width="1112" height="688" rx="30" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/>
<text x="600" y="88" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#2C2C2E">Algorithms on Graphs: Evidence Boundary Map</text><text x="600" y="126" text-anchor="middle" font-family="Arial" font-size="18" fill="#5B5B60">Core lesson content stays inside the supplied CCEA FAS2 boundary.</text>
<g font-family="Arial" fill="#2C2C2E"><rect x="84" y="176" width="320" height="360" rx="24" fill="#FBEFEF" stroke="#C5A059" stroke-width="3"/><text x="244" y="222" text-anchor="middle" font-size="24" font-weight="700">Core in this lesson</text><text x="120" y="280" font-size="20">✓ algorithm definition</text><text x="120" y="326" font-size="20">✓ greedy algorithm</text><text x="120" y="372" font-size="20">✓ Prim’s algorithm</text><text x="120" y="418" font-size="20">✓ Dijkstra’s algorithm</text><text x="120" y="480" font-size="17" fill="#5B5B60">Taught fully with examples,</text><text x="120" y="505" font-size="17" fill="#5B5B60">practice and exam traps.</text>
<rect x="440" y="176" width="320" height="360" rx="24" fill="#FAF9F6" stroke="#E5E5EA" stroke-width="2"/><text x="600" y="222" text-anchor="middle" font-size="24" font-weight="700">Official FAS2, but</text><text x="600" y="252" text-anchor="middle" font-size="24" font-weight="700">missing evidence here</text><text x="476" y="318" font-size="20">○ critical path analysis</text><text x="476" y="364" font-size="20">○ binary trees</text><text x="476" y="410" font-size="20">○ breadth first search</text><text x="476" y="456" font-size="20">○ depth first search</text><text x="476" y="506" font-size="17" fill="#5B5B60">Needs separate evidence-backed</text><text x="476" y="531" font-size="17" fill="#5B5B60">lesson pack sections.</text>
<rect x="796" y="176" width="320" height="360" rx="24" fill="#FAF9F6" stroke="#E5E5EA" stroke-width="2"/><text x="956" y="222" text-anchor="middle" font-size="24" font-weight="700">Supplied evidence,</text><text x="956" y="252" text-anchor="middle" font-size="24" font-weight="700">excluded from core</text><text x="832" y="318" font-size="20">◇ Kruskal’s algorithm</text><text x="832" y="364" font-size="20">◇ Floyd’s algorithm</text><text x="832" y="410" font-size="20">◇ Prim complexity/order</text><text x="832" y="472" font-size="17" fill="#5B5B60">Useful enrichment only unless</text><text x="832" y="497" font-size="17" fill="#5B5B60">future CCEA evidence confirms.</text>
<rect x="180" y="600" width="840" height="72" rx="18" fill="#FBEFEF" stroke="#E5E5EA"/><text x="600" y="630" text-anchor="middle" font-size="21" font-weight="700">Boundary rule</text><text x="600" y="660" text-anchor="middle" font-size="18">Evidence can inspire enrichment, but the CCEA specification controls the required lesson core.</text></g>
</svg>
