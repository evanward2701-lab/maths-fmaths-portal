<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eulerian Classifier</title><style>body{margin:0;padding:24px;background:#FAF9F6;color:#2C2C2E;font-family:Arial,Helvetica,sans-serif}.widget{max-width:980px;margin:0 auto;background:#FFFFF0;border:2px solid #E5E5EA;border-radius:24px;padding:26px}h1{font-family:Georgia,serif}.card{background:#FAF9F6;border:1px solid #E5E5EA;border-radius:18px;padding:18px;margin:12px 0}input,select{width:100%;padding:10px;border:1px solid #E5E5EA;border-radius:10px;margin:8px 0}button{padding:12px 18px;border:0;border-radius:12px;background:#C5A059;font-weight:700}.out{padding:16px;background:#FBEFEF;border:2px solid #C5A059;border-radius:16px;margin-top:12px;line-height:1.6}</style></head><body><main class="widget"><h1>Eulerian Classifier</h1><p>Enter connectedness and vertex degrees.</p><div class="card"><label>Connected?</label><select id="conn"><option value="yes">Yes</option><option value="no">No</option></select><label>Degrees</label><input id="deg" value="2,4,4,2,6"><button onclick="go()">Classify</button></div><div id="out" class="out"></div></main><script>function go(){const c=document.getElementById('conn').value;const ds=document.getElementById('deg').value.split(/[,\s]+/).filter(Boolean).map(Number);const odd=ds.filter(x=>x%2).length;const sum=ds.reduce((a,b)=>a+b,0);let ans;if(c==='no') ans='Neither: the graph is disconnected.'; else if(odd===0) ans='Eulerian: connected and all vertices have even degree.'; else if(odd===2) ans='Semi-Eulerian: connected and exactly two vertices have odd degree.'; else ans='Neither: connected but has '+odd+' odd-degree vertices.';document.getElementById('out').innerHTML='<b>'+ans+'</b><br>Total degree: '+sum+'<br>Odd-degree vertices: '+odd+(sum%2?' <br>Warning: total degree is odd, so this cannot be a graph degree sequence.':'');}go();</script></body></html>
