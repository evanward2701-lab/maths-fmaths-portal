<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Route Inspection Calculator</title><style>body{margin:0;padding:24px;background:#FAF9F6;color:#2C2C2E;font-family:Arial,Helvetica,sans-serif}.widget{max-width:980px;margin:0 auto;background:#FFFFF0;border:2px solid #E5E5EA;border-radius:24px;padding:26px}h1{font-family:Georgia,serif}.card{background:#FAF9F6;border:1px solid #E5E5EA;border-radius:18px;padding:18px;margin:12px 0}input,select{width:100%;padding:10px;border:1px solid #E5E5EA;border-radius:10px;margin:8px 0}button{padding:12px 18px;border:0;border-radius:12px;background:#C5A059;font-weight:700}.out{padding:16px;background:#FBEFEF;border:2px solid #C5A059;border-radius:16px;margin-top:12px;line-height:1.6}</style></head><body><main class="widget"><h1>Route Inspection Length Calculator</h1><p><b>Boundary note:</b> route inspection is evidence-backed enrichment/application, not confirmed CCEA core from the supplied LO map.</p><div class="card"><label>Total weight W</label><input id="W" type="number" value="120"><label>Odd vertices</label><select id="odd" onchange="show()"><option>0</option><option>2</option><option selected>4</option></select><div id="two"><label>d(A,B)</label><input id="d" type="number" value="11"></div><div id="four"><label>AB</label><input id="ab" type="number" value="9"><label>CD</label><input id="cd" type="number" value="14"><label>AC</label><input id="ac" type="number" value="11"><label>BD</label><input id="bd" type="number" value="10"><label>AD</label><input id="ad" type="number" value="8"><label>BC</label><input id="bc" type="number" value="16"></div><button onclick="calc()">Calculate</button></div><div id="out" class="out"></div></main><script>function show(){let o=document.getElementById('odd').value;document.getElementById('two').style.display=o==='2'?'block':'none';document.getElementById('four').style.display=o==='4'?'block':'none';}function v(id){return +document.getElementById(id).value}function calc(){let W=v('W'),o=document.getElementById('odd').value,out='';if(o==='0')out='Length = W = '+W;else if(o==='2')out='Length = W+d(A,B) = '+W+'+'+v('d')+' = '+(W+v('d'));else{let p1=v('ab')+v('cd'),p2=v('ac')+v('bd'),p3=v('ad')+v('bc'),m=Math.min(p1,p2,p3);out='Pairings: AB+CD='+p1+', AC+BD='+p2+', AD+BC='+p3+'.<br>Least extra = '+m+'.<br>Length = '+(W+m);}document.getElementById('out').innerHTML=out}show();calc();</script></body></html>
