<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Complete Graph Classifier</title><style>body{margin:0;padding:24px;background:#FAF9F6;color:#2C2C2E;font-family:Arial,Helvetica,sans-serif}.widget{max-width:980px;margin:0 auto;background:#FFFFF0;border:2px solid #E5E5EA;border-radius:24px;padding:26px}h1{font-family:Georgia,serif}.card{background:#FAF9F6;border:1px solid #E5E5EA;border-radius:18px;padding:18px;margin:12px 0}input,select{width:100%;padding:10px;border:1px solid #E5E5EA;border-radius:10px;margin:8px 0}button{padding:12px 18px;border:0;border-radius:12px;background:#C5A059;font-weight:700}.out{padding:16px;background:#FBEFEF;border:2px solid #C5A059;border-radius:16px;margin-top:12px;line-height:1.6}</style></head><body><main class="widget"><h1>Complete Graph Kₙ Classifier</h1><p>For Kₙ, every vertex has degree n−1.</p><div class="card"><input id="n" type="number" value="5" min="1"><button onclick="go()">Classify</button></div><div id="out" class="out"></div></main><script>function go(){const n=+document.getElementById('n').value;let d=n-1,ans;if(n===1)ans='Eulerian';else if(n===2)ans='Semi-Eulerian';else if(d%2===0)ans='Eulerian';else ans='Neither';document.getElementById('out').innerHTML='K<sub>'+n+'</sub>: degree '+d+'. Classification: <b>'+ans+'</b>.';}go();</script></body></html>
