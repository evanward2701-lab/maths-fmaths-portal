<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enter/Leave Pair Builder</title><style>body{margin:0;padding:24px;background:#FAF9F6;color:#2C2C2E;font-family:Arial,Helvetica,sans-serif}.widget{max-width:980px;margin:0 auto;background:#FFFFF0;border:2px solid #E5E5EA;border-radius:24px;padding:26px}h1{font-family:Georgia,serif}.card{background:#FAF9F6;border:1px solid #E5E5EA;border-radius:18px;padding:18px;margin:12px 0}input,select{width:100%;padding:10px;border:1px solid #E5E5EA;border-radius:10px;margin:8px 0}button{padding:12px 18px;border:0;border-radius:12px;background:#C5A059;font-weight:700}.out{padding:16px;background:#FBEFEF;border:2px solid #C5A059;border-radius:16px;margin-top:12px;line-height:1.6}.pill{display:inline-block;padding:6px 10px;border-radius:99px;border:2px solid #E5E5EA;margin:4px}.enter{border-color:#7CB342}.leave{border-color:#C75B5B}</style></head><body><main class="widget"><h1>Enter/Leave Pair Builder</h1><div class="card"><label>Route type</label><select id="type" onchange="go()"><option value="closed">Closed circuit</option><option value="open">Open trail</option></select><label>Role</label><select id="role" onchange="go()"><option value="internal">Internal</option><option value="start">Start</option><option value="end">End</option></select><label>Enter/leave pairs</label><input id="pairs" type="number" value="2" min="0"><button onclick="go()">Build</button></div><div id="vis" class="card"></div><div id="out" class="out"></div></main><script>function go(){let t=document.getElementById('type').value,r=document.getElementById('role').value,p=+document.getElementById('pairs').value,deg=2*p,arr=[];if(t==='open'&&r==='start'){deg++;arr.push('<span class="pill leave">first leave</span>')}for(let i=0;i<p;i++){arr.push('<span class="pill enter">enter</span>','<span class="pill leave">leave</span>')}if(t==='open'&&r==='end'){deg++;arr.push('<span class="pill enter">final enter</span>')}document.getElementById('vis').innerHTML=arr.join(' ');document.getElementById('out').innerHTML='Degree at vertex = '+deg+', which is '+(deg%2?'odd':'even')+'.';}go();</script></body></html>
