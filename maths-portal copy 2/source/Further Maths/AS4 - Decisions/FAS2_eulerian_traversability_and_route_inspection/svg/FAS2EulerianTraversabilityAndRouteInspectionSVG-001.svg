<title id="title">Map-to-Graph Abstraction for the Seven Bridges Problem</title><desc id="desc">Land masses become vertices and bridges become edges.</desc>
<rect width="1200" height="760" fill="#FAF9F6"/>
<rect x="36" y="36" width="1128" height="688" rx="28" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/>
<text x="70" y="95" font-family="Georgia,serif" font-size="34" font-weight="700" fill="#2C2C2E">Map-to-Graph Abstraction for the Seven Bridges Problem</text>
<text x="70" y="140" font-family="Arial" font-size="20" fill="#2C2C2E">land mass → vertex, bridge → edge</text><circle cx="300" cy="250" r="32" fill="#FBEFEF" stroke="#C5A059"/><circle cx="300" cy="500" r="32" fill="#FBEFEF" stroke="#C5A059"/><circle cx="500" cy="375" r="32" fill="#FBEFEF" stroke="#C5A059"/><circle cx="720" cy="375" r="32" fill="#FBEFEF" stroke="#C5A059"/><g stroke="#2C2C2E" stroke-width="5" fill="none"><path d="M300 250 C390 280 420 330 500 375"/><path d="M300 250 C430 230 600 290 720 375"/><path d="M300 500 C390 470 420 420 500 375"/><path d="M300 500 C430 520 600 460 720 375"/><path d="M500 375 L720 375"/><path d="M300 250 C230 340 230 410 300 500"/><path d="M300 250 C365 355 360 405 300 500"/></g><text x="260" y="235" font-family="Arial" font-size="20">odd</text><text x="260" y="550" font-family="Arial" font-size="20">odd</text><text x="470" y="430" font-family="Arial" font-size="20">odd</text><text x="750" y="380" font-family="Arial" font-size="20">odd</text><rect x="180" y="620" width="840" height="55" rx="18" fill="#FBEFEF" stroke="#C5A059"/><text x="225" y="655" font-family="Arial" font-size="24" fill="#2C2C2E">Four odd vertices ⇒ no Eulerian circuit.</text>
