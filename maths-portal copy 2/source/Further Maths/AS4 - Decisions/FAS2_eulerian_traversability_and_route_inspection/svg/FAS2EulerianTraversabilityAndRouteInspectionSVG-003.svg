<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Eulerian, Semi-Eulerian and Neither</title><desc id="desc">Parity comparison for connected graphs.</desc>
<rect width="1200" height="760" fill="#FAF9F6"/>
<rect x="36" y="36" width="1128" height="688" rx="28" fill="#FFFFF0" stroke="#E5E5EA" stroke-width="3"/>
<text x="70" y="95" font-family="Georgia,serif" font-size="34" font-weight="700" fill="#2C2C2E">Eulerian, Semi-Eulerian and Neither</text>
<text x="70" y="140" font-family="Arial" font-size="20" fill="#2C2C2E">Connected graphs: count odd-degree vertices.</text><g font-family="Arial" font-size="22" fill="#2C2C2E"><rect x="80" y="190" width="300" height="410" rx="18" fill="#FAF9F6" stroke="#E5E5EA"/><text x="170" y="235">Eulerian</text><text x="155" y="545">0 odd vertices</text><rect x="450" y="190" width="300" height="410" rx="18" fill="#FAF9F6" stroke="#E5E5EA"/><text x="515" y="235">Semi-Eulerian</text><text x="525" y="545">2 odd vertices</text><rect x="820" y="190" width="300" height="410" rx="18" fill="#FAF9F6" stroke="#E5E5EA"/><text x="930" y="235">Neither</text><text x="895" y="545">more than 2 odd</text></g><g stroke="#2C2C2E" stroke-width="5" fill="none"><circle cx="230" cy="360" r="90"/><path d="M510 360 L600 280 L690 360 L600 440 Z M510 360 L690 360"/><path d="M900 280 L1040 280 L1040 430 L900 430 Z M900 280 L1040 430 M1040 280 L900 430"/></g><g fill="#C5A059" stroke="#2C2C2E"><circle cx="230" cy="270" r="12"/><circle cx="320" cy="360" r="12"/><circle cx="230" cy="450" r="12"/><circle cx="140" cy="360" r="12"/></g><g fill="#FBEFEF" stroke="#C75B5B" stroke-width="3"><circle cx="510" cy="360" r="13"/><circle cx="690" cy="360" r="13"/><circle cx="900" cy="280" r="13"/><circle cx="1040" cy="280" r="13"/><circle cx="1040" cy="430" r="13"/><circle cx="900" cy="430" r="13"/></g>
</svg>
