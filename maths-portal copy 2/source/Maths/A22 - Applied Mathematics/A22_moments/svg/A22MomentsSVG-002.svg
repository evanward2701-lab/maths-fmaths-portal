<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="Moment method flow">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#111827"/>
    </marker>
    <style>
      .title{font-family:Arial,sans-serif;font-size:28px;font-weight:700;fill:#111827}
      .label{font-family:Arial,sans-serif;font-size:18px;fill:#111827}
      .small{font-family:Arial,sans-serif;font-size:15px;fill:#374151}
      .rod{stroke:#111827;stroke-width:10;stroke-linecap:round}
      .beam{fill:#F3F4F6;stroke:#111827;stroke-width:3}
