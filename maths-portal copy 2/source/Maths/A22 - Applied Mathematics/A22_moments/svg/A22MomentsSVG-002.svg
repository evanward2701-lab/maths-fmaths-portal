  <rect width="900" height="520" fill="#fff"/>
  <text x="40" y="55" class="title">Moment definition: force and perpendicular distance</text>
  <line x1="160" y1="360" x2="690" y2="170" class="rod"/><circle cx="230" cy="335" r="10" fill="#111827"/><text x="180" y="325" class="label">Point P</text><line x1="560" y1="217" x2="560" y2="85" class="down"/><text x="580" y="126" class="label">Force F</text><line x1="560" y1="80" x2="560" y2="420" class="dash"/><text x="580" y="395" class="small">line of action</text><line x1="230" y1="335" x2="560" y2="335" class="up"/><text x="365" y="324" class="label">perpendicular distance d</text><path d="M540,335 L540,315 L560,315" fill="none" stroke="#2563EB" stroke-width="3"/><rect x="95" y="95" width="330" height="120" class="note"/><text x="125" y="145" class="label">M = Fd</text><text x="125" y="180" class="small">Distance must be perpendicular.</text>
