<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560"><rect width="980" height="560" fill="white"/><text x="490" y="50" font-family="Arial" font-size="36" font-weight="bold" text-anchor="middle">The 68-95-99.7 rule</text><line x1="110" y1="430" x2="870" y2="430" stroke="black" stroke-width="4"/><path d="M110 425 C210 420,300 390,370 300 C420 235,430 145,490 135 C550 145,560 235,610 300 C680 390,770 420,870 425" fill="none" stroke="#2f6fa3" stroke-width="5"/><g stroke="#555" stroke-width="2" stroke-dasharray="6 6"><line x1="220" y1="430" x2="220" y2="397"/><line x1="310" y1="430" x2="310" y2="370"/><line x1="400" y1="430" x2="400" y2="245"/><line x1="490" y1="430" x2="490" y2="135"/><line x1="580" y1="430" x2="580" y2="245"/><line x1="670" y1="430" x2="670" y2="370"/><line x1="760" y1="430" x2="760" y2="397"/></g><g font-family="Arial" font-size="22" text-anchor="middle"><text x="220" y="465">μ−3σ</text><text x="310" y="465">μ−2σ</text><text x="400" y="465">μ−σ</text><text x="490" y="465">μ</text><text x="580" y="465">μ+σ</text><text x="670" y="465">μ+2σ</text><text x="760" y="465">μ+3σ</text></g><text x="490" y="95" font-family="Arial" font-size="26" text-anchor="middle" fill="#2d7d46">≈ 68%</text><text x="490" y="36" font-family="Arial" font-size="26" text-anchor="middle" fill="#8a6500">≈ 95%</text><text x="790" y="120" font-family="Arial" font-size="26" fill="#b23a48">≈ 99.7%</text></svg>