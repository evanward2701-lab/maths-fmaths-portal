<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620"><rect width="980" height="620" fill="white"/><text x="490" y="48" font-family="Arial" font-size="34" font-weight="bold" text-anchor="middle">Hypothesis test decision</text><g font-family="Arial" font-size="22"><rect x="320" y="90" width="340" height="70" rx="12" fill="#e8f1fa" stroke="#2f6fa3" stroke-width="3"/><text x="490" y="132" text-anchor="middle" font-weight="bold">Calculate p-value</text><polygon points="490,210 680,300 490,390 300,300" fill="#fff4dd" stroke="#b38300" stroke-width="3"/><text x="490" y="292" text-anchor="middle" font-weight="bold">Is p ≤ α?</text><text x="490" y="322" text-anchor="middle">α = significance level</text><rect x="40" y="250" width="220" height="100" rx="12" fill="#f4e6e8" stroke="#b23a48" stroke-width="3"/><text x="150" y="292" text-anchor="middle" font-weight="bold">Reject H₀</text><text x="150" y="325" text-anchor="middle">evidence for H₁</text><rect x="720" y="250" width="220" height="100" rx="12" fill="#e8f1fa" stroke="#2f6fa3" stroke-width="3"/><text x="830" y="292" text-anchor="middle" font-weight="bold">Do not reject H₀</text><text x="830" y="325" text-anchor="middle">insufficient evidence</text><text x="490" y="528" text-anchor="middle">Final line must be in context.</text></g></svg>