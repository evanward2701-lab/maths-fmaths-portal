<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Normal distribution bell curve for height</title><desc id="desc">A bell-shaped normal curve centred at 180 cm.</desc><rect width="900" height="520" fill="white"/><line x1="120" y1="420" x2="780" y2="420" stroke="black" stroke-width="4"/><line x1="120" y1="420" x2="120" y2="80" stroke="black" stroke-width="4"/><path d="M120 410 C190 405,245 390,295 365 C345 340,375 290,400 220 C425 145,475 145,500 220 C525 290,555 340,605 365 C655 390,710 405,780 410" fill="none" stroke="#2f6fa3" stroke-width="5"/><line x1="450" y1="420" x2="450" y2="395" stroke="black" stroke-width="4"/><text x="450" y="462" font-family="Arial" font-size="30" text-anchor="middle">180 cm</text><text x="785" y="470" font-family="Arial" font-size="28" text-anchor="end">Height in cm, x</text><text x="84" y="255" font-family="Arial" font-size="32" font-style="italic" text-anchor="middle">f(x)</text><text x="450" y="50" font-family="Arial" font-size="34" text-anchor="middle" font-weight="bold">Normal distribution: bell curve</text></svg>