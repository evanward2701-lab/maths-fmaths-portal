<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620"><rect width="980" height="620" fill="white"/><text x="490" y="48" font-family="Arial" font-size="34" font-weight="bold" text-anchor="middle">Normal calculator workflow</text><g font-family="Arial" font-size="22"><rect x="70" y="90" width="840" height="62" rx="12" fill="#e8f1fa" stroke="#2f6fa3" stroke-width="3"/><text x="490" y="130" text-anchor="middle" font-weight="bold">1. Write X ~ N(μ, σ²). Calculator usually needs σ, not σ².</text><rect x="70" y="180" width="390" height="90" rx="12" fill="#f7f7f7" stroke="#333" stroke-width="2"/><text x="265" y="215" text-anchor="middle" font-weight="bold">Left tail: P(X &lt; a)</text><text x="265" y="250" text-anchor="middle">lower = very small, upper = a</text><rect x="520" y="180" width="390" height="90" rx="12" fill="#f7f7f7" stroke="#333" stroke-width="2"/><text x="715" y="215" text-anchor="middle" font-weight="bold">Right tail: P(X &gt; a)</text><text x="715" y="250" text-anchor="middle">lower = a, upper = very large</text><rect x="70" y="310" width="390" height="90" rx="12" fill="#f7f7f7" stroke="#333" stroke-width="2"/><text x="265" y="345" text-anchor="middle" font-weight="bold">Interval: P(a &lt; X &lt; b)</text><text x="265" y="380" text-anchor="middle">lower = a, upper = b</text><rect x="520" y="310" width="390" height="90" rx="12" fill="#f7f7f7" stroke="#333" stroke-width="2"/><text x="715" y="345" text-anchor="middle" font-weight="bold">Outside: P(X&lt;a or X&gt;b)</text><text x="715" y="380" text-anchor="middle">1 − P(a &lt; X &lt; b)</text><rect x="190" y="455" width="600" height="90" rx="12" fill="#fff4dd" stroke="#b38300" stroke-width="3"/><text x="490" y="490" text-anchor="middle" font-weight="bold">Inverse normal</text><text x="490" y="525" text-anchor="middle">Convert the shaded region into a left-tail area first.</text></g></svg>