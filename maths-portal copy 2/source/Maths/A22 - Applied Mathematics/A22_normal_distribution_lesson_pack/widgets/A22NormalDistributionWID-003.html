<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>A22NormalDistributionWID-003 | Normal Probability Concept Demo</title><style>body{font-family:Arial,sans-serif;margin:0;background:white;color:#172033}.widget{max-width:980px;margin:0 auto;padding:24px}.card{border:2px solid #d9e1ec;border-radius:18px;padding:20px;background:#f7f9fc;box-shadow:0 8px 24px rgba(20,35,60,.08)}h1{margin:0 0 8px;font-size:28px}.meta{color:#5d687a;line-height:1.5}button,input,select{font-size:16px;padding:8px;border:1px solid #d9e1ec;border-radius:8px}svg{width:100%;height:auto;background:white;border:1px solid #d9e1ec;border-radius:14px}.answer{background:#dcecf8;border-left:5px solid #2f6fa3;padding:12px;border-radius:10px;margin-top:12px;line-height:1.7}label{display:block;font-weight:bold;margin-top:12px}</style></head><body><!-- Asset ID: A22NormalDistributionWID-003 --><main class="widget"><section class="card"><h1>Normal Probability Concept Demo</h1><p class="meta">Visualise left-tail, right-tail, interval and outside-region probabilities before using Normal CD.</p><label>μ</label><input id="mu" type="number" value="100"><label>σ</label><input id="sig" type="number" value="15"><label>Region</label><select id="r"><option value="left">P(X&lt;a)</option><option value="right">P(X&gt;a)</option><option value="between">P(a&lt;X&lt;b)</option><option value="outside">P(X&lt;a or X&gt;b)</option></select><label>a</label><input id="a" type="number" value="109"><label>b</label><input id="b" type="number" value="120"><svg id="plot" viewBox="0 0 700 430"></svg><div class="answer" id="out"></div></section></main><script>function erf(x){let s=Math.sign(x);x=Math.abs(x);let a1=.254829592,a2=-.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=.3275911,t=1/(1+p*x);return s*(1-(((((a5*t+a4)*t+a3)*t+a2)*t+a1)*t*Math.exp(-x*x)))}function cdf(x,m,s){return .5*(1+erf((x-m)/(s*Math.sqrt(2))))}function pdf(x,m,s){return Math.exp(-.5*((x-m)/s)**2)/(s*Math.sqrt(2*Math.PI))}const E=id=>document.getElementById(id),plot=E('plot'),out=E('out');function upd(){let m=+E('mu').value,s=+E('sig').value,A=+E('a').value,B=+E('b').value;if(B<A)[A,B]=[B,A];let min=m-4*s,max=m+4*s,px=x=>60+(x-min)/(max-min)*580,py=y=>350-y/pdf(m,m,s)*260,pts=[];for(let i=0;i<=260;i++){let x=min+(max-min)*i/260;pts.push((i?'L':'M')+px(x).toFixed(1)+' '+py(pdf(x,m,s)).toFixed(1))}let prob=0,txt='',bounds='';let kind=E('r').value;if(kind==='left'){prob=cdf(A,m,s);txt=`P(X < ${A})`;bounds=`lower very small, upper ${A}`}if(kind==='right'){prob=1-cdf(A,m,s);txt=`P(X > ${A})`;bounds=`lower ${A}, upper very large`}if(kind==='between'){prob=cdf(B,m,s)-cdf(A,m,s);txt=`P(${A} < X < ${B})`;bounds=`lower ${A}, upper ${B}`}if(kind==='outside'){prob=cdf(A,m,s)+1-cdf(B,m,s);txt=`P(X < ${A} or X > ${B})`;bounds=`1 - P(${A} < X < ${B})`}plot.innerHTML=`<rect width="700" height="430" fill="white"/><line x1="45" y1="350" x2="660" y2="350" stroke="black" stroke-width="3"/><path d="${pts.join(' ')}" fill="none" stroke="#2f6fa3" stroke-width="4"/><line x1="${px(A)}" y1="350" x2="${px(A)}" y2="95" stroke="#b23a48" stroke-width="3"/><line x1="${px(m)}" y1="350" x2="${px(m)}" y2="90" stroke="#172033" stroke-dasharray="7 7"/><text x="350" y="35" font-size="24" text-anchor="middle" font-weight="bold">${txt}</text>`;out.innerHTML=`<b>${txt}</b><br>Approx probability: ${prob.toFixed(4)}<br>Bounds idea: ${bounds}`}['mu','sig','r','a','b'].forEach(id=>E(id).oninput=upd);upd();</script></body></html>
