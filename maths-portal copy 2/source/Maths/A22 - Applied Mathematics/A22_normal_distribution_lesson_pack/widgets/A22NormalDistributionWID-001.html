<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>A22NormalDistributionWID-001 | Normal Curve μ and σ Slider</title><style>body{font-family:Arial,sans-serif;margin:0;background:white;color:#172033}.widget{max-width:980px;margin:0 auto;padding:24px}.card{border:2px solid #d9e1ec;border-radius:18px;padding:20px;background:#f7f9fc;box-shadow:0 8px 24px rgba(20,35,60,.08)}h1{margin:0 0 8px;font-size:28px}.meta{color:#5d687a;line-height:1.5}button,input,select{font-size:16px;padding:8px;border:1px solid #d9e1ec;border-radius:8px}svg{width:100%;height:auto;background:white;border:1px solid #d9e1ec;border-radius:14px}.answer{background:#dcecf8;border-left:5px solid #2f6fa3;padding:12px;border-radius:10px;margin-top:12px;line-height:1.7}label{display:block;font-weight:bold;margin-top:12px}</style></head><body><!-- Asset ID: A22NormalDistributionWID-001 --><main class="widget"><section class="card"><h1>Normal Curve Explorer: μ and σ</h1><p class="meta">Move the sliders to see how μ shifts the centre and σ changes the spread.</p><label>Mean μ: <span id="muv">0</span></label><input id="mu" type="range" min="-5" max="5" step="0.1" value="0"><label>Standard deviation σ: <span id="sigv">1.0</span></label><input id="sig" type="range" min="0.5" max="3" step="0.1" value="1"><svg id="plot" viewBox="0 0 700 420"></svg><div class="answer" id="out"></div></section></main><script>const svg=document.getElementById('plot'),mu=document.getElementById('mu'),sig=document.getElementById('sig'),out=document.getElementById('out'),muv=document.getElementById('muv'),sigv=document.getElementById('sigv');function pdf(x,m,s){return Math.exp(-.5*((x-m)/s)**2)/(s*Math.sqrt(2*Math.PI))}function draw(){let m=+mu.value,s=+sig.value;muv.textContent=m.toFixed(1);sigv.textContent=s.toFixed(1);let min=-8,max=8,px=x=>60+(x-min)/(max-min)*580,py=y=>350-y/0.85*270,pts=[];for(let i=0;i<=240;i++){let x=min+(max-min)*i/240;pts.push((i?'L':'M')+px(x).toFixed(1)+' '+py(pdf(x,m,s)).toFixed(1))}svg.innerHTML=`<rect width="700" height="420" fill="white"/><line x1="45" y1="350" x2="660" y2="350" stroke="black" stroke-width="3"/><line x1="60" y1="370" x2="60" y2="45" stroke="black" stroke-width="3"/><path d="${pts.join(' ')}" fill="none" stroke="#2f6fa3" stroke-width="4"/><line x1="${px(m)}" y1="350" x2="${px(m)}" y2="70" stroke="#172033" stroke-dasharray="7 7"/><text x="${px(m)}" y="385" font-size="22" text-anchor="middle">μ</text><text x="350" y="35" font-size="24" text-anchor="middle" font-weight="bold">X ~ N(${m.toFixed(1)}, ${s.toFixed(1)}²)</text>`;out.innerHTML=`Variance σ² = ${(s*s).toFixed(2)}<br>Inflection points: ${(m-s).toFixed(2)} and ${(m+s).toFixed(2)}`;}mu.oninput=draw;sig.oninput=draw;draw();</script></body></html>
