<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>A22NormalDistributionWID-002 | Continuity Correction Converter</title><style>body{font-family:Arial,sans-serif;margin:0;background:white;color:#172033}.widget{max-width:980px;margin:0 auto;padding:24px}.card{border:2px solid #d9e1ec;border-radius:18px;padding:20px;background:#f7f9fc;box-shadow:0 8px 24px rgba(20,35,60,.08)}h1{margin:0 0 8px;font-size:28px}.meta{color:#5d687a;line-height:1.5}button,input,select{font-size:16px;padding:8px;border:1px solid #d9e1ec;border-radius:8px}svg{width:100%;height:auto;background:white;border:1px solid #d9e1ec;border-radius:14px}.answer{background:#dcecf8;border-left:5px solid #2f6fa3;padding:12px;border-radius:10px;margin-top:12px;line-height:1.7}label{display:block;font-weight:bold;margin-top:12px}</style></head><body><!-- Asset ID: A22NormalDistributionWID-002 --><main class="widget"><section class="card"><h1>Continuity Correction Converter</h1><p class="meta">Convert discrete binomial inequalities into continuous normal intervals.</p><label>Type</label><select id="type"><option value="le">P(X ≤ a)</option><option value="lt">P(X &lt; a)</option><option value="ge">P(X ≥ a)</option><option value="gt">P(X &gt; a)</option><option value="eq">P(X = a)</option><option value="between">P(a ≤ X ≤ b)</option></select><label>a</label><input id="a" type="number" value="6"><label>b</label><input id="b" type="number" value="10"><div class="answer" id="out"></div></section></main><script>const type=document.getElementById('type'),a=document.getElementById('a'),b=document.getElementById('b'),out=document.getElementById('out');function f(n){return Number(n).toFixed(1).replace('.0','')}function upd(){let A=parseInt(a.value||0),B=parseInt(b.value||0),d,c;if(type.value==='le'){d=`P(X ≤ ${A})`;c=`P(Y ≤ ${f(A+.5)})`}if(type.value==='lt'){d=`P(X < ${A}) = P(X ≤ ${A-1})`;c=`P(Y ≤ ${f(A-.5)})`}if(type.value==='ge'){d=`P(X ≥ ${A})`;c=`P(Y ≥ ${f(A-.5)})`}if(type.value==='gt'){d=`P(X > ${A}) = P(X ≥ ${A+1})`;c=`P(Y ≥ ${f(A+.5)})`}if(type.value==='eq'){d=`P(X = ${A})`;c=`P(${f(A-.5)} ≤ Y ≤ ${f(A+.5)})`}if(type.value==='between'){if(B<A)[A,B]=[B,A];d=`P(${A} ≤ X ≤ ${B})`;c=`P(${f(A-.5)} ≤ Y ≤ ${f(B+.5)})`}out.innerHTML=`<b>Discrete:</b> ${d}<br><b>Continuous:</b> ${c}<br><b>Rule:</b> included endpoints gain half a unit.`}type.oninput=upd;a.oninput=upd;b.oninput=upd;upd();</script></body></html>
