<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>A22NormalDistributionWID-004 | Normal Mean Hypothesis Test Trainer</title><style>body{font-family:Arial,sans-serif;margin:0;background:white;color:#172033}.widget{max-width:980px;margin:0 auto;padding:24px}.card{border:2px solid #d9e1ec;border-radius:18px;padding:20px;background:#f7f9fc;box-shadow:0 8px 24px rgba(20,35,60,.08)}h1{margin:0 0 8px;font-size:28px}.meta{color:#5d687a;line-height:1.5}button,input,select{font-size:16px;padding:8px;border:1px solid #d9e1ec;border-radius:8px}svg{width:100%;height:auto;background:white;border:1px solid #d9e1ec;border-radius:14px}.answer{background:#dcecf8;border-left:5px solid #2f6fa3;padding:12px;border-radius:10px;margin-top:12px;line-height:1.7}label{display:block;font-weight:bold;margin-top:12px}</style></head><body><!-- Asset ID: A22NormalDistributionWID-004 --><main class="widget"><section class="card"><h1>Normal Mean Hypothesis Test Trainer</h1><p class="meta">Practise p-value decisions for tests on a normal mean with known σ.</p><label>Claimed mean μ₀</label><input id="mu0" type="number" value="80"><label>Population σ</label><input id="sig" type="number" value="6"><label>Sample size n</label><input id="n" type="number" value="25"><label>Observed x̄</label><input id="xb" type="number" value="77.2"><label>H₁</label><select id="alt"><option value="less">μ &lt; μ₀</option><option value="greater">μ &gt; μ₀</option><option value="two">μ ≠ μ₀</option></select><label>α</label><select id="alpha"><option value="0.10">10%</option><option value="0.05" selected>5%</option><option value="0.01">1%</option></select><div class="answer" id="out"></div></section></main><script>function erf(x){let s=Math.sign(x);x=Math.abs(x);let a1=.254829592,a2=-.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=.3275911,t=1/(1+p*x);return s*(1-(((((a5*t+a4)*t+a3)*t+a2)*t+a1)*t*Math.exp(-x*x)))}function phi(z){return .5*(1+erf(z/Math.sqrt(2)))}const E=id=>document.getElementById(id),out=E('out');function upd(){let mu0=+E('mu0').value,s=+E('sig').value,n=+E('n').value,xb=+E('xb').value,a=+E('alpha').value,se=s/Math.sqrt(n),z=(xb-mu0)/se,alt=E('alt').value,p,h1;if(alt==='less'){p=phi(z);h1=`μ < ${mu0}`}else if(alt==='greater'){p=1-phi(z);h1=`μ > ${mu0}`}else{p=2*Math.min(phi(z),1-phi(z));h1=`μ ≠ ${mu0}`}out.innerHTML=`<b>H₀:</b> μ = ${mu0}<br><b>H₁:</b> ${h1}<br><b>Distribution:</b> X̄ ~ N(${mu0}, ${s*s}/${n})<br><b>Standard error:</b> ${se.toFixed(4)}<br><b>z:</b> ${z.toFixed(4)}<br><b>p-value:</b> ${p.toFixed(4)}<br><b>Decision:</b> ${p<=a?'Reject H₀. Sufficient evidence for H₁.':'Do not reject H₀. Insufficient evidence for H₁.'}`}['mu0','sig','n','xb','alt','alpha'].forEach(id=>E(id).oninput=upd);upd();</script></body></html>
