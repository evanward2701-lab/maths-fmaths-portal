<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Restricted sample space diagram for conditional probability</title><desc id="desc">B is highlighted as the restricted sample space and A intersection B is the favourable part.</desc><defs><clipPath id="clipA"><circle cx="350" cy="290" r="145"/></clipPath><clipPath id="clipB"><circle cx="505" cy="290" r="145"/></clipPath></defs><rect width="960" height="560" fill="white"/><text x="40" y="55" font-family="Arial" font-size="30" font-weight="700">Conditional probability as a restricted sample space</text><text x="40" y="84" font-family="Arial" font-size="17">For P(A|B), the condition B becomes the new denominator.</text><rect x="95" y="135" width="610" height="345" rx="8" fill="white" stroke="#111" stroke-width="4"/><text x="112" y="127" font-family="Arial" font-size="26" font-weight="700">S</text><circle cx="350" cy="290" r="145" fill="#d9e8ff" fill-opacity="0.55" stroke="#111" stroke-width="4"/><circle cx="505" cy="290" r="145" fill="#fff3bf" fill-opacity="0.75" stroke="#111" stroke-width="4"/><circle cx="505" cy="290" r="145" fill="#ffc9c9" fill-opacity="0.9" clip-path="url(#clipA)"/><text x="260" y="185" font-family="Arial" font-size="26" font-weight="700">A</text><text x="590" y="185" font-family="Arial" font-size="26" font-weight="700">B</text><text x="415" y="298" font-family="Arial" font-size="24" font-weight="700">A ∩ B</text><rect x="160" y="500" width="620" height="42" rx="8" fill="#f1f3f5" stroke="#333" stroke-width="2"/><text x="190" y="528" font-family="Arial" font-size="24" font-weight="700">P(A|B) = P(A ∩ B) / P(B)</text></svg>
