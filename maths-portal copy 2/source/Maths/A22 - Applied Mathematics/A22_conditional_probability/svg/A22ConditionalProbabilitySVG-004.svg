<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc"><title id="title">Completed three-event probability Venn diagram</title><desc id="desc">A and C do not overlap. B overlaps both. Region probabilities are 0.05, 0.25, 0.07, 0.08, 0.12 and 0.43.</desc><rect width="1000" height="610" fill="white"/><text x="40" y="55" font-family="Arial" font-size="30" font-weight="700">Three-event Venn diagram with conditions</text><text x="40" y="84" font-family="Arial" font-size="17">A and C are mutually exclusive. B and C are independent.</text><rect x="80" y="130" width="680" height="390" rx="8" fill="white" stroke="#111" stroke-width="4"/><text x="100" y="122" font-family="Arial" font-size="28" font-weight="700">S</text><circle cx="285" cy="315" r="145" fill="#e7f5ff" fill-opacity="0.58" stroke="#111" stroke-width="4"/><circle cx="430" cy="315" r="165" fill="#fff3bf" fill-opacity="0.58" stroke="#111" stroke-width="4"/><circle cx="585" cy="315" r="145" fill="#ebfbee" fill-opacity="0.62" stroke="#111" stroke-width="4"/><text x="185" y="185" font-family="Arial" font-size="28" font-weight="700">A</text><text x="410" y="170" font-family="Arial" font-size="28" font-weight="700">B</text><text x="660" y="185" font-family="Arial" font-size="28" font-weight="700">C</text><text x="205" y="330" font-family="Arial" font-size="25" font-weight="700">0.05</text><text x="330" y="330" font-family="Arial" font-size="25" font-weight="700">0.25</text><text x="435" y="420" font-family="Arial" font-size="25" font-weight="700">0.07</text><text x="520" y="330" font-family="Arial" font-size="25" font-weight="700">0.08</text><text x="625" y="330" font-family="Arial" font-size="25" font-weight="700">0.12</text><text x="655" y="470" font-family="Arial" font-size="25" font-weight="700">0.43</text><text x="155" y="572" font-family="Arial" font-size="18" font-weight="700">Outside region = 1 - (0.05 + 0.25 + 0.07 + 0.08 + 0.12) = 0.43</text></svg>
