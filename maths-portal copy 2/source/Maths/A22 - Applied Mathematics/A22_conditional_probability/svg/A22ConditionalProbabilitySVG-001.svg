<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Die outcomes Venn diagram for even and prime outcomes</title><desc id="desc">A Venn diagram showing die sample space. A is even, B is prime, overlap contains 2.</desc><rect width="900" height="540" fill="white"/><text x="40" y="55" font-family="Arial" font-size="30" font-weight="700">Sample space and events</text><text x="40" y="84" font-family="Arial" font-size="17">Die throw: S = {1, 2, 3, 4, 5, 6}</text><rect x="80" y="125" width="560" height="330" rx="6" fill="white" stroke="#111" stroke-width="4"/><text x="95" y="115" font-family="Arial" font-size="26" font-weight="700">S</text><circle cx="285" cy="290" r="145" fill="#e7f5ff" fill-opacity="0.55" stroke="#111" stroke-width="4"/><circle cx="440" cy="290" r="145" fill="#fff3bf" fill-opacity="0.55" stroke="#111" stroke-width="4"/><text x="180" y="185" font-family="Arial" font-size="26" font-weight="700">A</text><text x="520" y="185" font-family="Arial" font-size="26" font-weight="700">B</text><text x="205" y="280" font-family="Arial" font-size="34" font-weight="700">6</text><text x="245" y="370" font-family="Arial" font-size="34" font-weight="700">4</text><text x="350" y="318" font-family="Arial" font-size="34" font-weight="700">2</text><text x="490" y="270" font-family="Arial" font-size="34" font-weight="700">3</text><text x="455" y="370" font-family="Arial" font-size="34" font-weight="700">5</text><text x="585" y="410" font-family="Arial" font-size="34" font-weight="700">1</text><text x="145" y="490" font-family="Arial" font-size="18" font-weight="600">A = rolling an even number = {2, 4, 6}</text><text x="145" y="518" font-family="Arial" font-size="18" font-weight="600">B = rolling a prime number = {2, 3, 5}</text></svg>
