<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" role="img" aria-labelledby="title desc"><title id="title">Card pack Venn diagram for aces and diamonds</title><desc id="desc">A Venn diagram for a 52-card deck. A is ace and D is diamond. Regions are 3, 1, 12 and 36.</desc><rect width="920" height="560" fill="white"/><text x="40" y="55" font-family="Arial" font-size="30" font-weight="700">Aces and diamonds in a 52-card deck</text><text x="40" y="84" font-family="Arial" font-size="17">A = ace, D = diamond. The Venn diagram contains frequencies.</text><rect x="95" y="125" width="585" height="355" rx="8" fill="white" stroke="#111" stroke-width="4"/><text x="112" y="118" font-family="Arial" font-size="28" font-weight="700">S</text><circle cx="310" cy="305" r="150" fill="#eef6ff" fill-opacity="0.55" stroke="#111" stroke-width="4"/><circle cx="475" cy="305" r="150" fill="#fff4d6" fill-opacity="0.65" stroke="#111" stroke-width="4"/><text x="210" y="190" font-family="Arial" font-size="28" font-weight="700">A</text><text x="570" y="190" font-family="Arial" font-size="28" font-weight="700">D</text><text x="235" y="318" font-family="Arial" font-size="38" font-weight="700">3</text><text x="385" y="318" font-family="Arial" font-size="38" font-weight="700">1</text><text x="515" y="318" font-family="Arial" font-size="38" font-weight="700">12</text><text x="575" y="430" font-family="Arial" font-size="38" font-weight="700">36</text><text x="135" y="532" font-family="Arial" font-size="20" font-weight="700">Check: 3 + 1 + 12 + 36 = 52</text></svg>
