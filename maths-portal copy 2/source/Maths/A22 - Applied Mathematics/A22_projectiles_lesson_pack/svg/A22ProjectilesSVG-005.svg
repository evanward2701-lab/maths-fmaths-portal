<!-- Asset ID: A22ProjectilesSVG-005 | Source: trajectory derivation | Purpose: eliminate t to get path equation. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-label="Projectile trajectory equation derivation map">
  <rect width="1100" height="650" fill="white"/><text x="550" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700">Deriving the Trajectory Equation</text>
  <rect x="70" y="105" width="420" height="115" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="280" y="145" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1d4ed8">Horizontal motion</text><text x="280" y="185" text-anchor="middle" font-family="Arial" font-size="26">x = U cosθ · t</text>
  <rect x="610" y="105" width="420" height="115" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/><text x="820" y="145" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#b91c1c">Vertical motion</text><text x="820" y="185" text-anchor="middle" font-family="Arial" font-size="26">y = U sinθ · t − ½gt²</text>
  <rect x="315" y="285" width="470" height="95" rx="16" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/><text x="550" y="322" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700">Make t the subject</text><text x="550" y="357" text-anchor="middle" font-family="Arial" font-size="26">t = x / (U cosθ)</text>
  <rect x="230" y="445" width="640" height="120" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="3"/><text x="550" y="485" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#047857">Substitute into vertical motion</text><text x="550" y="525" text-anchor="middle" font-family="Arial" font-size="25">y = x tanθ − gx² / (2U² cos²θ)</text><text x="550" y="555" text-anchor="middle" font-family="Arial" font-size="23">or y = x tanθ − (gx² / 2U²)(1 + tan²θ)</text>
</svg>
