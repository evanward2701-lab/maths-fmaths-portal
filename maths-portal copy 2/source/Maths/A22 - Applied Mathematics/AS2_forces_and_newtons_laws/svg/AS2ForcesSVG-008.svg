  <text x="450" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold">Worked Example 1 Force Diagram</text>
  <circle cx="450" cy="260" r="7" fill="#111"/><line x1="450" y1="260" x2="600" y2="175" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/><text x="525.0" y="207.5" font-family="Arial" font-size="20" text-anchor="middle">P</text><line x1="450" y1="260" x2="320" y2="145" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/><text x="385.0" y="192.5" font-family="Arial" font-size="20" text-anchor="middle">4 N</text><line x1="450" y1="260" x2="450" y2="430" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/><text x="450.0" y="335.0" font-family="Arial" font-size="20" text-anchor="middle">Q</text><text x="450" y="480" text-anchor="middle" font-family="Arial" font-size="22">P cos30° = 4 cos45°, Q = P sin30° + 4 sin45°</text>
