Asset ID: AS2ForcesWidget-002
Source: Chapter 5/7 Forces Transcript + MechYr2 Chapter 5 Friction PDF
Related lesson section: Core Theory: Inclined planes and rough surfaces
Purpose: Interactive inclined plane model showing mg sin(theta), mg cos(theta), reaction, friction and acceleration.
-->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AS2 Forces Widget 002: Inclined Plane Explorer</title><style>
body{font-family:Arial,sans-serif;margin:0;padding:24px;color:#111}.widget{max-width:980px;margin:auto;border:2px solid #111;border-radius:18px;padding:24px;background:#f7f7f7}.layout{display:grid;grid-template-columns:1fr 1fr;gap:24px}.controls,.output,.diagram{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px}.control{margin-bottom:18px}label{display:flex;justify-content:space-between;font-weight:bold;margin-bottom:8px}input{width:100%}.value,.equation{font-family:"Courier New",monospace}.equation{background:#f7f7f7;border-left:4px solid #111;padding:12px;white-space:pre-wrap;line-height:1.6}.status{font-weight:bold;font-size:20px;border:2px solid #111;border-radius:12px;padding:12px;margin-top:12px}@media(max-width:780px){.layout{grid-template-columns:1fr}}</style></head><body>
<main class="widget"><h1>Inclined Plane Explorer</h1><p>Resolve the weight into mg sin θ and mg cos θ, then compare down-slope weight with friction.</p><section class="layout"><div class="controls">
<div class="control"><label>Mass, m / kg <span class="value" id="massValue"></span></label><input id="mass" type="range" min="1" max="30" step="1" value="5"></div>
<div class="control"><label>Slope angle, θ / degrees <span class="value" id="angleValue"></span></label><input id="angle" type="range" min="0" max="60" step="1" value="25"></div>
<div class="control"><label>Coefficient of friction, μ <span class="value" id="muValue"></span></label><input id="mu" type="range" min="0" max="1" step="0.01" value="0.20"></div>
<div class="control"><label>Gravitational acceleration, g <span class="value" id="gValue"></span></label><input id="g" type="range" min="9.7" max="10" step="0.1" value="9.8"></div>
</div><div class="output"><h2>Calculation</h2><div class="equation" id="calculation"></div><div class="status" id="status"></div><p>This widget assumes the particle tends to move down the slope, so friction acts up the slope.</p></div></section>
<section class="diagram"><svg viewBox="0 0 820 430"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#111"></path></marker></defs><line x1="110" y1="335" x2="710" y2="335" stroke="#111" stroke-width="3"></line><line id="slopeLine" x1="110" y1="335" x2="680" y2="190" stroke="#111" stroke-width="4"></line><g id="blockGroup" transform="translate(390 265) rotate(-14)"><rect x="-55" y="-30" width="110" height="60" fill="#f7f7f7" stroke="#111" stroke-width="2"></rect><text x="0" y="7" text-anchor="middle" font-family="Arial" font-size="20">m</text></g><line x1="390" y1="265" x2="390" y2="375" stroke="#111" stroke-width="3" marker-end="url(#arrow)"></line><text x="405" y="355" font-family="Arial" font-size="18">mg</text><line x1="390" y1="265" x2="425" y2="155" stroke="#111" stroke-width="3" marker-end="url(#arrow)"></line><text x="438" y="180" font-family="Arial" font-size="18">R</text><line x1="390" y1="265" x2="510" y2="235" stroke="#111" stroke-width="3" marker-end="url(#arrow)"></line><text x="500" y="220" font-family="Arial" font-size="18">friction</text><line x1="390" y1="265" x2="285" y2="292" stroke="#111" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"></line><text x="210" y="296" font-family="Arial" font-size="18">mg sin θ</text><line x1="390" y1="265" x2="355" y2="375" stroke="#111" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"></line><text x="235" y="385" font-family="Arial" font-size="18">mg cos θ</text></svg></section></main>
<script>
const mass=document.getElementById('mass'),angle=document.getElementById('angle'),mu=document.getElementById('mu'),gInput=document.getElementById('g');
function round(v,p=2){return Number(v).toFixed(p)} function rad(d){return d*Math.PI/180}
function update(){const m=+mass.value,theta=+angle.value,coef=+mu.value,g=+gInput.value;const W=m*g,down=W*Math.sin(rad(theta)),R=W*Math.cos(rad(theta)),max=coef*R,result=down-max,a=result>0?result/m:0;massValue.textContent=m;angleValue.textContent=theta;muValue.textContent=round(coef);gValue.textContent=round(g,1);status.textContent=result>0?'The particle accelerates down the plane.':Math.abs(result)<0.0001?'The particle is in limiting equilibrium.':'Friction can hold the particle at rest.';calculation.textContent=`Weight:\nmg = ${m} × ${round(g,1)} = ${round(W)} N\n\nDown-slope component:\nmg sin θ = ${round(W)} × sin(${theta}°) = ${round(down)} N\n\nPerpendicular component:\nR = mg cos θ = ${round(R)} N\n\nMaximum friction:\nμR = ${round(coef)} × ${round(R)} = ${round(max)} N\n\nResultant down slope:\n${round(down)} − ${round(max)} = ${round(result)} N\n\nAcceleration:\n${result>0?`a = ${round(result)} ÷ ${m} = ${round(a)} m s⁻²`:'a = 0 m s⁻²'}`;}
[mass,angle,mu,gInput].forEach(x=>x.addEventListener('input',update));update();
</script></body></html>
