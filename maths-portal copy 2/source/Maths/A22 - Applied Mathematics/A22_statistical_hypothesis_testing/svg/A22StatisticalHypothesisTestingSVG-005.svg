Topic name: Statistical hypothesis testing
Related lesson section: Exam Technique, one-tailed and two-tailed critical regions
Source: CCEA specification map; lesson transcript; Stats Yr2 Chapter 1 PDF
Purpose: Show how critical regions differ for positive, negative and two-tailed correlation tests.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="650" viewBox="0 0 980 650" role="img" aria-labelledby="title desc">
  <title id="title">Critical regions for correlation coefficient tests</title>
  <desc id="desc">Three number-line style diagrams showing positive one-tailed, negative one-tailed and two-tailed critical regions for testing a correlation coefficient.</desc>
  <rect width="980" height="650" fill="#ffffff"/>
  <text x="490" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700">Critical regions for PMCC tests</text>
  <defs><marker id="arrowRight" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#111111"/></marker><marker id="arrowLeft" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M9,0 L9,6 L0,3 z" fill="#111111"/></marker></defs>
  <text x="95" y="110" font-family="Arial, sans-serif" font-size="20" font-weight="700">1. Positive one-tailed test</text>
  <text x="95" y="140" font-family="Arial, sans-serif" font-size="17">H₁: ρ &gt; 0, reject H₀ if r is greater than the positive critical value.</text>
  <line x1="125" y1="190" x2="855" y2="190" stroke="#111111" stroke-width="4"/><line x1="490" y1="170" x2="490" y2="210" stroke="#111111" stroke-width="3"/><line x1="695" y1="160" x2="695" y2="220" stroke="#111111" stroke-width="3"/><line x1="695" y1="190" x2="855" y2="190" stroke="#111111" stroke-width="10" marker-end="url(#arrowRight)"/>
  <text x="490" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">0</text><text x="695" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">+c</text><text x="775" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="15">critical region</text>
  <text x="95" y="300" font-family="Arial, sans-serif" font-size="20" font-weight="700">2. Negative one-tailed test</text>
  <text x="95" y="330" font-family="Arial, sans-serif" font-size="17">H₁: ρ &lt; 0, reject H₀ if r is less than the negative critical value.</text>
  <line x1="125" y1="380" x2="855" y2="380" stroke="#111111" stroke-width="4"/><line x1="490" y1="360" x2="490" y2="400" stroke="#111111" stroke-width="3"/><line x1="285" y1="350" x2="285" y2="410" stroke="#111111" stroke-width="3"/><line x1="125" y1="380" x2="285" y2="380" stroke="#111111" stroke-width="10" marker-start="url(#arrowLeft)"/>
  <text x="490" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">0</text><text x="285" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">-c</text><text x="205" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="15">critical region</text>
  <text x="95" y="490" font-family="Arial, sans-serif" font-size="20" font-weight="700">3. Two-tailed test</text>
  <text x="95" y="520" font-family="Arial, sans-serif" font-size="17">H₁: ρ ≠ 0, split the significance level across both tails.</text>
  <line x1="125" y1="570" x2="855" y2="570" stroke="#111111" stroke-width="4"/><line x1="490" y1="550" x2="490" y2="590" stroke="#111111" stroke-width="3"/><line x1="285" y1="540" x2="285" y2="600" stroke="#111111" stroke-width="3"/><line x1="695" y1="540" x2="695" y2="600" stroke="#111111" stroke-width="3"/><line x1="125" y1="570" x2="285" y2="570" stroke="#111111" stroke-width="10" marker-start="url(#arrowLeft)"/><line x1="695" y1="570" x2="855" y2="570" stroke="#111111" stroke-width="10" marker-end="url(#arrowRight)"/>
  <text x="490" y="622" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">0</text><text x="285" y="622" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">-c</text><text x="695" y="622" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">+c</text><text x="205" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="15">critical region</text><text x="775" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="15">critical region</text>
</svg>