<text x="40" y="55" class="title">SUVAT, but with vectors</text><text x="40" y="88" class="text">For constant acceleration in 2D, use vector-compatible equations.</text>
<rect x="70" y="145" width="260" height="250" class="box" fill="#eff6ff"/><text x="105" y="190" class="label">Vector quantities</text><text x="105" y="245" class="text">r, u, v, a</text><text x="105" y="290" class="text">Each has components.</text>
<rect x="390" y="145" width="220" height="250" class="box" fill="#fff7ed"/><text x="425" y="190" class="label">Scalar</text><text x="425" y="245" class="text">t = time</text>
<rect x="665" y="145" width="290" height="250" class="box"/><text x="695" y="190" class="label">Valid forms</text><text x="695" y="240" class="text">v = u + at</text><text x="695" y="285" class="text">r = r₀ + ut + ½at²</text>
<rect x="130" y="455" width="740" height="105" class="box" fill="#fef2f2"/><text x="165" y="500" class="label">Do not use v² = u² + 2as as a vector equation.</text>

</svg>
