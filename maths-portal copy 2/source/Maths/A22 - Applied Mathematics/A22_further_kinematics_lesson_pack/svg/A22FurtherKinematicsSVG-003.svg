<text x="40" y="55" class="title">Speed and bearing from velocity</text><text x="40" y="88" class="text">Velocity gives direction. Speed is magnitude.</text>
<g transform="translate(280,520)"><line x1="0" y1="0" x2="0" y2="-390" class="axis"/><line x1="0" y1="0" x2="260" y2="0" class="axis"/><text x="-20" y="-405" class="label">North</text><text x="270" y="8" class="label">East</text><line x1="0" y1="0" x2="90" y2="-300" class="line"/><line x1="90" y1="0" x2="90" y2="-300" class="dash"/><line x1="0" y1="-300" x2="90" y2="-300" class="dash"/><path d="M0 -75 A75 75 0 0 1 22 -72" stroke="#dc2626" stroke-width="4" fill="none"/><text x="30" y="-75" class="label">θ</text><text x="100" y="-150" class="label">v=(3,10)</text></g>
<rect x="620" y="160" width="320" height="330" class="box"/><text x="650" y="210" class="label">|v|=√(3²+10²)</text><text x="650" y="250" class="text">=√109=10.4 ms⁻¹</text><text x="650" y="335" class="label">tanθ=3/10</text><text x="650" y="375" class="text">θ=16.7°</text><text x="650" y="430" class="label">Bearing = 017°</text>

