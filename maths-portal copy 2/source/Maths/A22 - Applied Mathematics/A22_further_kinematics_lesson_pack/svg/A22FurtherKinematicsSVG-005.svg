<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-label="A22FurtherKinematicsSVG-005">
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="redarr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
<style>
.title{font:700 32px Arial,sans-serif;fill:#111827}.text{font:400 20px Arial,sans-serif;fill:#374151}.label{font:700 22px Arial,sans-serif;fill:#111827}.axis{stroke:#374151;stroke-width:3;marker-end:url(#arr)}.line{stroke:#2563eb;stroke-width:5;fill:none;marker-end:url(#arr)}.red{stroke:#dc2626;stroke-width:5;fill:none;marker-end:url(#redarr)}.box{fill:#fff;stroke:#9ca3af;stroke-width:2;rx:14}.dash{stroke:#9ca3af;stroke-width:3;stroke-dasharray:8 8}
</style></defs>
<rect width="1000" height="620" fill="#f9fafb"/>

<text x="40" y="55" class="title">The kinematics calculus chain</text><text x="40" y="88" class="text">Differentiate from position to velocity to acceleration. Integrate back.</text>
<rect x="90" y="200" width="210" height="110" class="box" fill="#eff6ff"/><text x="140" y="245" class="label">Position</text><text x="165" y="285" class="text">r or s</text>
<rect x="395" y="200" width="210" height="110" class="box" fill="#ecfdf5"/><text x="450" y="245" class="label">Velocity</text><text x="485" y="285" class="text">v</text>
<rect x="700" y="200" width="210" height="110" class="box" fill="#fef2f2"/><text x="742" y="245" class="label">Acceleration</text><text x="795" y="285" class="text">a</text>
<line x1="300" y1="240" x2="395" y2="240" class="line"/><line x1="605" y1="240" x2="700" y2="240" class="line"/><line x1="700" y1="285" x2="605" y2="285" stroke="#7c3aed" stroke-width="5" marker-end="url(#arr)"/><line x1="395" y1="285" x2="300" y2="285" stroke="#7c3aed" stroke-width="5" marker-end="url(#arr)"/>
<rect x="145" y="405" width="710" height="120" class="box"/><text x="180" y="450" class="label">v = dr/dt,      a = dv/dt = d²r/dt²</text><text x="180" y="495" class="label">r = ∫v dt,      v = ∫a dt</text>

</svg>
