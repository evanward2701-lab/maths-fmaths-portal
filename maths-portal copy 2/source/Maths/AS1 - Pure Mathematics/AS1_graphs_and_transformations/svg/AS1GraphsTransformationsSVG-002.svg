<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">Root multiplicity behaviour on the x-axis</title><desc id="desc">Three panels compare a simple root, repeated root and triple repeated root.</desc><defs><style>.title{font:700 28px Arial,sans-serif;fill:#111}.subtitle{font:16px Arial,sans-serif;fill:#333}.panel{fill:#fff;stroke:#bfbfbf;stroke-width:2}.panelTitle{font:700 19px Arial,sans-serif;fill:#111}.text{font:15px Arial,sans-serif;fill:#111}.small{font:13px Arial,sans-serif;fill:#333}.math{font:italic 16px Georgia,serif;fill:#111}.axis{stroke:#111;stroke-width:2}.curve1{fill:none;stroke:#1f77b4;stroke-width:4;stroke-linecap:round}.curve2{fill:none;stroke:#2ca02c;stroke-width:4;stroke-linecap:round}.curve3{fill:none;stroke:#d62728;stroke-width:4;stroke-linecap:round}.root{fill:#111}.note{fill:#fff7df;stroke:#c99a00;stroke-width:1.5}</style></defs><rect width="1000" height="500" fill="#fff"/><text x="40" y="46" class="title">What happens at a root?</text><text x="40" y="74" class="subtitle">The power on the factor decides whether the curve crosses, touches, or crosses while momentarily flat.</text><g transform="translate(40,110)"><rect width="285" height="300" rx="18" class="panel"/><text x="20" y="35" class="panelTitle">Simple root</text><text x="20" y="65" class="math">factor: x − a</text><line x1="45" y1="170" x2="245" y2="170" class="axis"/><line x1="145" y1="95" x2="145" y2="235" class="axis"/><path d="M60 225 C95 210 115 190 145 170 C175 150 198 130 235 112" class="curve1"/><circle cx="145" cy="170" r="5" class="root"/><text x="136" y="192" class="small">a</text><rect x="20" y="250" width="245" height="35" rx="10" class="note"/><text x="33" y="273" class="text">The curve crosses the x-axis.</text></g><g transform="translate(357,110)"><rect width="285" height="300" rx="18" class="panel"/><text x="20" y="35" class="panelTitle">Repeated root</text><text x="20" y="65" class="math">factor: (x − b)²</text><line x1="45" y1="170" x2="245" y2="170" class="axis"/><line x1="145" y1="95" x2="145" y2="235" class="axis"/><path d="M60 105 C95 130 120 160 145 170 C170 160 195 130 235 105" class="curve2"/><circle cx="145" cy="170" r="5" class="root"/><text x="136" y="192" class="small">b</text><rect x="20" y="250" width="245" height="35" rx="10" class="note"/><text x="33" y="273" class="text">The curve touches and turns back.</text></g><g transform="translate(674,110)"><rect width="285" height="300" rx="18" class="panel"/><text x="20" y="35" class="panelTitle">Triple repeated root</text><text x="20" y="65" class="math">factor: (x − c)³</text><line x1="45" y1="170" x2="245" y2="170" class="axis"/><line x1="145" y1="95" x2="145" y2="235" class="axis"/><path d="M60 225 C95 220 120 175 145 170 C170 165 195 120 235 112" class="curve3"/><line x1="118" y1="170" x2="172" y2="170" stroke="#d62728" stroke-width="3"/><circle cx="145" cy="170" r="5" class="root"/><text x="136" y="192" class="small">c</text><rect x="20" y="250" width="245" height="35" rx="10" class="note"/><text x="31" y="273" class="text">Crosses and is momentarily flat.</text></g><text x="40" y="455" class="small">Safe wording: describe the local shape. Do not make “point of inflection” a required CCEA AS1 keyword.</text></svg>