<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc"><title id="title">Reciprocal graph families and asymptotes</title><desc id="desc">Four panels show reciprocal graph shapes for y=a/x and y=a/x squared.</desc><defs><style>.title{font:700 28px Arial,sans-serif;fill:#111}.subtitle{font:16px Arial,sans-serif;fill:#333}.panel{fill:#fff;stroke:#c7c7c7;stroke-width:2}.panelTitle{font:700 18px Arial,sans-serif;fill:#111}.small{font:12px Arial,sans-serif;fill:#333}.axis{stroke:#111;stroke-width:2}.asym{stroke:#888;stroke-width:2;stroke-dasharray:7 6}.curve{fill:none;stroke:#7030a0;stroke-width:4;stroke-linecap:round}.curve2{fill:none;stroke:#008a5b;stroke-width:4;stroke-linecap:round}.badge{fill:#eef4ff;stroke:#2f5597;stroke-width:1.5}</style></defs><rect width="1000" height="680" fill="#fff"/><text x="40" y="48" class="title">Reciprocal graphs: shape first, asymptotes always</text><text x="40" y="76" class="subtitle">The axes are asymptotes unless the graph has been translated.</text><g transform="translate(45,115)"><rect width="430" height="230" rx="16" class="panel"/><text x="20" y="30" class="panelTitle">1. y = a/x, a &gt; 0</text><line x1="45" y1="115" x2="385" y2="115" class="asym"/><line x1="215" y1="45" x2="215" y2="195" class="asym"/><line x1="45" y1="115" x2="385" y2="115" class="axis"/><line x1="215" y1="45" x2="215" y2="195" class="axis"/><path d="M230 80 C255 72 285 65 360 58" class="curve"/><path d="M70 175 C125 165 175 153 200 138" class="curve"/><rect x="20" y="195" width="220" height="25" rx="8" class="badge"/><text x="30" y="213" class="small">Asymptotes: x = 0, y = 0</text></g><g transform="translate(525,115)"><rect width="430" height="230" rx="16" class="panel"/><text x="20" y="30" class="panelTitle">2. y = a/x, a &lt; 0</text><line x1="45" y1="115" x2="385" y2="115" class="asym"/><line x1="215" y1="45" x2="215" y2="195" class="asym"/><line x1="45" y1="115" x2="385" y2="115" class="axis"/><line x1="215" y1="45" x2="215" y2="195" class="axis"/><path d="M70 55 C125 65 175 78 200 95" class="curve"/><path d="M230 140 C260 155 310 168 360 177" class="curve"/><rect x="20" y="195" width="220" height="25" rx="8" class="badge"/><text x="30" y="213" class="small">Asymptotes: x = 0, y = 0</text></g><g transform="translate(45,390)"><rect width="430" height="230" rx="16" class="panel"/><text x="20" y="30" class="panelTitle">3. y = a/x², a &gt; 0</text><line x1="45" y1="115" x2="385" y2="115" class="asym"/><line x1="215" y1="45" x2="215" y2="195" class="asym"/><line x1="45" y1="115" x2="385" y2="115" class="axis"/><line x1="215" y1="45" x2="215" y2="195" class="axis"/><path d="M70 100 C120 93 170 75 202 48" class="curve2"/><path d="M228 48 C260 75 310 93 360 100" class="curve2"/><rect x="20" y="195" width="220" height="25" rx="8" class="badge"/><text x="30" y="213" class="small">Asymptotes: x = 0, y = 0</text></g><g transform="translate(525,390)"><rect width="430" height="230" rx="16" class="panel"/><text x="20" y="30" class="panelTitle">4. y = a/x², a &lt; 0</text><line x1="45" y1="115" x2="385" y2="115" class="asym"/><line x1="215" y1="45" x2="215" y2="195" class="asym"/><line x1="45" y1="115" x2="385" y2="115" class="axis"/><line x1="215" y1="45" x2="215" y2="195" class="axis"/><path d="M70 130 C120 137 170 155 202 188" class="curve2"/><path d="M228 188 C260 155 310 137 360 130" class="curve2"/><rect x="20" y="195" width="220" height="25" rx="8" class="badge"/><text x="30" y="213" class="small">Asymptotes: x = 0, y = 0</text></g><text x="45" y="655" class="small">For y = 2/(x + 1), the vertical asymptote moves to x = −1 while y = 0 remains the horizontal asymptote.</text></svg>