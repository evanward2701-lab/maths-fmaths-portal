<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">Simple graph transformations of y=f(x)</title><desc id="desc">A transformation map showing outside transformations affect y-coordinates and inside transformations affect x-coordinates.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#222"/></marker><style>.title{font:700 28px Arial,sans-serif;fill:#111}.subtitle{font:16px Arial,sans-serif;fill:#333}.hub{fill:#111;stroke:#111;stroke-width:2}.hubText{font:700 22px Arial,sans-serif;fill:#fff}.outside{fill:#eef4ff;stroke:#2f5597;stroke-width:2}.inside{fill:#fff5e6;stroke:#b36b00;stroke-width:2}.reflection{fill:#f2f2f2;stroke:#555;stroke-width:2}.text{font:15px Arial,sans-serif;fill:#111}.small{font:13px Arial,sans-serif;fill:#333}.math{font:italic 17px Georgia,serif;fill:#111}.whiteMath{font:italic 20px Georgia,serif;fill:#fff}.arrow{stroke:#222;stroke-width:2;fill:none;marker-end:url(#arrow)}.note{fill:#effaf2;stroke:#3c8d40;stroke-width:2}</style></defs><rect width="1000" height="640" fill="#fff"/><text x="40" y="48" class="title">Transformations of y = f(x)</text><text x="40" y="76" class="subtitle">Outside changes move y-coordinates. Inside changes move x-coordinates.</text><rect x="390" y="105" width="220" height="78" rx="18" class="hub"/><text x="438" y="138" class="hubText">Start with</text><text x="448" y="166" class="whiteMath">y = f(x)</text><path d="M390 145 C300 145 250 145 190 145" class="arrow"/><rect x="40" y="105" width="190" height="80" rx="14" class="outside"/><text x="62" y="134" class="text">Outside f</text><text x="62" y="160" class="small">affects y-coordinates</text><path d="M135 185 L135 230" class="arrow"/><rect x="40" y="230" width="260" height="80" rx="14" class="outside"/><text x="62" y="258" class="math">y = f(x) + a</text><text x="62" y="284" class="small">translation by vector (0, a)</text><path d="M135 310 L135 355" class="arrow"/><rect x="40" y="355" width="260" height="80" rx="14" class="outside"/><text x="62" y="383" class="math">y = a f(x)</text><text x="62" y="409" class="small">stretch in y-direction by factor a</text><path d="M135 435 L135 480" class="arrow"/><rect x="40" y="480" width="260" height="80" rx="14" class="reflection"/><text x="62" y="508" class="math">y = −f(x)</text><text x="62" y="534" class="small">reflection in the x-axis</text><path d="M610 145 C700 145 750 145 810 145" class="arrow"/><rect x="770" y="105" width="190" height="80" rx="14" class="inside"/><text x="792" y="134" class="text">Inside f</text><text x="792" y="160" class="small">affects x-coordinates</text><path d="M865 185 L865 230" class="arrow"/><rect x="700" y="230" width="260" height="80" rx="14" class="inside"/><text x="722" y="258" class="math">y = f(x + a)</text><text x="722" y="284" class="small">translation by vector (−a, 0)</text><path d="M865 310 L865 355" class="arrow"/><rect x="700" y="355" width="260" height="80" rx="14" class="inside"/><text x="722" y="383" class="math">y = f(ax)</text><text x="722" y="409" class="small">x-direction scale factor 1/a</text><path d="M865 435 L865 480" class="arrow"/><rect x="700" y="480" width="260" height="80" rx="14" class="reflection"/><text x="722" y="508" class="math">y = f(−x)</text><text x="722" y="534" class="small">reflection in the y-axis</text><rect x="340" y="250" width="320" height="185" rx="14" class="note"/><text x="365" y="282" class="text">Coordinate mini-rules</text><text x="365" y="316" class="math">(x, y) → (x, y + a)</text><text x="365" y="344" class="small">for y = f(x) + a</text><text x="365" y="378" class="math">(x, y) → (x − a, y)</text><text x="365" y="406" class="small">for y = f(x + a)</text><text x="40" y="605" class="small">Memory hook: outside behaves normally; inside needs careful x-coordinate tracking.</text></svg>