<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Using graph intersections to solve equations</title><desc id="desc">A visual showing two curves intersecting and the algebraic instruction f(x)=g(x).</desc><defs><style>.title{font:700 28px Arial,sans-serif;fill:#111}.subtitle{font:16px Arial,sans-serif;fill:#333}.axis{stroke:#111;stroke-width:2}.grid{stroke:#e1e1e1;stroke-width:1}.curveA{fill:none;stroke:#1f77b4;stroke-width:4;stroke-linecap:round}.curveB{fill:none;stroke:#d62728;stroke-width:4;stroke-linecap:round}.dot{fill:#111;stroke:#fff;stroke-width:2}.label{font:14px Arial,sans-serif;fill:#111}.text{font:16px Arial,sans-serif;fill:#111}.small{font:13px Arial,sans-serif;fill:#333}.math{font:italic 18px Georgia,serif;fill:#111}.panel{fill:#f8fbff;stroke:#2f5597;stroke-width:2}.warn{fill:#fff0f0;stroke:#c00000;stroke-width:2}</style></defs><rect width="1000" height="560" fill="#fff"/><text x="40" y="48" class="title">Intersections: where two equations agree</text><text x="40" y="76" class="subtitle">If y = f(x) and y = g(x), intersection x-values solve f(x) = g(x).</text><g transform="translate(60,125)"><rect x="0" y="0" width="520" height="360" fill="#fff" stroke="#ccc" rx="16"/><line x1="50" y1="70" x2="470" y2="70" class="grid"/><line x1="50" y1="130" x2="470" y2="130" class="grid"/><line x1="50" y1="190" x2="470" y2="190" class="grid"/><line x1="50" y1="250" x2="470" y2="250" class="grid"/><line x1="120" y1="40" x2="120" y2="310" class="grid"/><line x1="190" y1="40" x2="190" y2="310" class="grid"/><line x1="260" y1="40" x2="260" y2="310" class="grid"/><line x1="330" y1="40" x2="330" y2="310" class="grid"/><line x1="400" y1="40" x2="400" y2="310" class="grid"/><line x1="50" y1="190" x2="470" y2="190" class="axis"/><line x1="260" y1="40" x2="260" y2="310" class="axis"/><path d="M65 85 C115 105 165 150 210 190 C255 230 310 250 370 230 C425 212 455 165 470 105" class="curveA"/><path d="M75 280 C130 235 180 185 230 190 C275 195 310 130 350 95 C395 55 440 60 470 100" class="curveB"/><circle cx="150" cy="160" r="7" class="dot"/><circle cx="230" cy="190" r="7" class="dot"/><circle cx="388" cy="221" r="7" class="dot"/><text x="75" y="335" class="label">blue: y = f(x)</text><text x="275" y="335" class="label">red: y = g(x)</text></g><g transform="translate(625,130)"><rect width="320" height="145" rx="14" class="panel"/><text x="22" y="35" class="text">Algebra route</text><text x="22" y="70" class="math">1. Set f(x) = g(x)</text><text x="22" y="100" class="math">2. Rearrange to 0</text><text x="22" y="130" class="math">3. Factorise and solve</text></g><g transform="translate(625,305)"><rect width="320" height="120" rx="14" class="warn"/><text x="22" y="35" class="text">Exam trap</text><text x="22" y="66" class="small">Do not divide by x unless you are certain</text><text x="22" y="88" class="small">x = 0 is not a solution.</text><text x="22" y="110" class="small">Factorise instead.</text></g><text x="625" y="470" class="math">Graph check: intersections = real solutions.</text></svg>