<!-- Asset ID: AS1EquationsInequalitiesSVG-006 | Source: sketching inequalities evidence | Purpose: Optional enrichment diagram for two-variable inequality region. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800" role="img" aria-labelledby="title desc"><title id="title">Optional two-variable inequality region</title><desc id="desc">A coordinate diagram showing the region below the line y equals 7 minus x over 2 and above the parabola y equals x squared minus 3x minus 4.</desc><rect width="1100" height="800" fill="#fff"/><text x="550" y="60" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700">Optional enrichment: shading a two-variable inequality region</text><text x="550" y="100" text-anchor="middle" font-family="Arial" font-size="22" fill="#333">Core CCEA lesson focus remains single-variable inequalities.</text><g transform="translate(120,145)"><rect width="680" height="560" fill="#fbfbfb" stroke="#111" stroke-width="3"/><line x1="0" y1="350" x2="680" y2="350" stroke="#111" stroke-width="3"/><line x1="250" y1="560" x2="250" y2="0" stroke="#111" stroke-width="3"/><path d="M167 350 C230 455 340 455 463 350 L680 135 L250 175 L167 350" fill="#8ecae6" opacity="0.35"/><path d="M60 40 C125 250 165 340 167 350 C255 480 365 475 463 350 C540 230 610 80 660 15" fill="none" stroke="#c2272d" stroke-width="6"/><line x1="250" y1="105" x2="680" y2="320" stroke="#0b65c2" stroke-width="6" stroke-dasharray="14 10"/><text x="440" y="95" font-family="Arial" font-size="22" fill="#0b65c2" font-weight="700">y &lt; 7 - x/2</text><text x="470" y="505" font-family="Arial" font-size="22" fill="#c2272d" font-weight="700">y ≥ x² - 3x - 4</text><circle cx="250" cy="350" r="7" fill="#111"/><text x="265" y="342" font-family="Arial" font-size="20">(0,0) satisfies both</text></g><g transform="translate(835,180)" font-family="Arial"><rect width="230" height="410" rx="18" fill="#f7f7f7" stroke="#111" stroke-width="2"/><text x="115" y="45" text-anchor="middle" font-size="26" font-weight="700">Region rules</text><text x="20" y="100" font-size="21">2y + x &lt; 14</text><text x="20" y="130" font-size="21">⇒ y &lt; 7 - x/2</text><text x="20" y="165" font-size="20">Shade below line.</text><line x1="20" y1="195" x2="210" y2="195" stroke="#111" stroke-width="2"/><text x="20" y="240" font-size="21">y ≥ x² - 3x - 4</text><text x="20" y="275" font-size="20">Shade above curve.</text><line x1="20" y1="305" x2="210" y2="305" stroke="#111" stroke-width="2"/><text x="20" y="350" font-size="20">Keep overlap only.</text><text x="20" y="380" font-size="20" font-weight="700">This is enrichment.</text></g></svg>
