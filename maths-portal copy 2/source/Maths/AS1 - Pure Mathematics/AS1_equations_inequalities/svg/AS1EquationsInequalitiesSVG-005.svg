<!-- Asset ID: AS1EquationsInequalitiesSVG-005 | Source: fractional inequality example | Purpose: Safe method for 6/x > 2. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc"><title id="title">Safe method for fractional inequality</title><desc id="desc">A diagram explaining that multiplying directly by x is unsafe, while multiplying by x squared is positive when x is non-zero.</desc><rect width="1200" height="740" fill="#fff"/><text x="600" y="60" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700">Fractional inequality: avoid the sign trap</text><g font-family="Arial"><rect x="60" y="110" width="500" height="245" rx="18" fill="#fff4f4" stroke="#c2272d" stroke-width="3"/><text x="310" y="155" text-anchor="middle" font-size="28" font-weight="700">Unsafe thought</text><text x="100" y="205" font-size="30">6/x &gt; 2</text><text x="100" y="255" font-size="24">Multiplying directly by x is risky.</text><text x="100" y="288" font-size="24">If x is negative, the inequality reverses.</text><text x="100" y="322" font-size="24" font-weight="700" fill="#c2272d">So do not do this blindly.</text></g><g font-family="Arial"><rect x="640" y="110" width="500" height="245" rx="18" fill="#eef8ff" stroke="#0b65c2" stroke-width="3"/><text x="890" y="155" text-anchor="middle" font-size="28" font-weight="700">Safe route</text><text x="680" y="205" font-size="27">Restriction: x ≠ 0</text><text x="680" y="250" font-size="27">Then x² &gt; 0</text><text x="680" y="295" font-size="24">Multiplying by x² keeps the</text><text x="680" y="328" font-size="24">inequality direction unchanged.</text></g><g font-family="Arial" transform="translate(90,405)"><rect width="1020" height="245" rx="18" fill="#fbfbfb" stroke="#111" stroke-width="3"/><text x="510" y="45" text-anchor="middle" font-size="30" font-weight="700">6/x &gt; 2 ⇒ 6x &gt; 2x² ⇒ x² - 3x &lt; 0 ⇒ x(x - 3) &lt; 0</text><line x1="110" y1="145" x2="910" y2="145" stroke="#111" stroke-width="4"/><circle cx="410" cy="145" r="12" fill="#fff" stroke="#111" stroke-width="4"/><circle cx="690" cy="145" r="12" fill="#fff" stroke="#111" stroke-width="4"/><text x="410" y="185" text-anchor="middle" font-size="25">0</text><text x="690" y="185" text-anchor="middle" font-size="25">3</text><text x="245" y="115" text-anchor="middle" font-size="24" fill="#c2272d" font-weight="700">positive</text><text x="550" y="115" text-anchor="middle" font-size="24" fill="#0b65c2" font-weight="700">negative</text><text x="815" y="115" text-anchor="middle" font-size="24" fill="#c2272d" font-weight="700">positive</text><rect x="420" y="132" width="260" height="26" fill="#0b65c2" opacity="0.25"/><text x="550" y="225" text-anchor="middle" font-size="28" font-weight="700">Solution: 0 &lt; x &lt; 3</text></g><text x="600" y="700" text-anchor="middle" font-family="Arial" font-size="23">The value x = 0 is excluded because the original expression 6/x is undefined.</text></svg>
