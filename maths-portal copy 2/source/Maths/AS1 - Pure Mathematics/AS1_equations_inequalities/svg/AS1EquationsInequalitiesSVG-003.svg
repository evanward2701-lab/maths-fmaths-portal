<!-- Asset ID: AS1EquationsInequalitiesSVG-003 | Source: CCEA AS1-AF-LO004 and lesson discriminant examples | Section: Graph Intersections and the Discriminant | Purpose: Compare two intersections, one tangent intersection and no intersections. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="720" viewBox="0 0 1250 720" role="img" aria-labelledby="title desc"><title id="title">Discriminant cases and intersections</title><desc id="desc">Three panels showing a line intersecting a parabola twice, touching once, and not meeting.</desc><rect width="1250" height="720" fill="#fff"/><text x="625" y="60" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700">Discriminant tells you how many intersections</text><g font-family="Arial"><g transform="translate(45,115)"><rect width="360" height="470" rx="18" fill="#fbfbfb" stroke="#111" stroke-width="3"/><text x="180" y="40" text-anchor="middle" font-size="27" font-weight="700">Δ = b² - 4ac &gt; 0</text><text x="180" y="72" text-anchor="middle" font-size="21">Two distinct intersections</text><g transform="translate(35,105)"><line x1="0" y1="250" x2="290" y2="250" stroke="#111" stroke-width="2"/><line x1="145" y1="300" x2="145" y2="0" stroke="#111" stroke-width="2"/><path d="M30 40 Q145 340 260 40" fill="none" stroke="#c2272d" stroke-width="5"/><line x1="15" y1="265" x2="275" y2="85" stroke="#0b65c2" stroke-width="5"/><circle cx="82" cy="219" r="10"/><circle cx="214" cy="128" r="10"/></g><text x="180" y="430" text-anchor="middle" font-size="22" font-weight="700">two real roots</text></g><g transform="translate(445,115)"><rect width="360" height="470" rx="18" fill="#fbfbfb" stroke="#111" stroke-width="3"/><text x="180" y="40" text-anchor="middle" font-size="27" font-weight="700">Δ = b² - 4ac = 0</text><text x="180" y="72" text-anchor="middle" font-size="21">Exactly one intersection</text><g transform="translate(35,105)"><line x1="0" y1="250" x2="290" y2="250" stroke="#111" stroke-width="2"/><line x1="145" y1="300" x2="145" y2="0" stroke="#111" stroke-width="2"/><path d="M30 60 Q145 300 260 60" fill="none" stroke="#c2272d" stroke-width="5"/><line x1="20" y1="300" x2="270" y2="300" stroke="#0b65c2" stroke-width="5"/><circle cx="145" cy="300" r="11"/><circle cx="145" cy="300" r="19" fill="none" stroke="#ffcc00" stroke-width="5"/></g><text x="180" y="430" text-anchor="middle" font-size="22" font-weight="700">one repeated root</text></g><g transform="translate(845,115)"><rect width="360" height="470" rx="18" fill="#fbfbfb" stroke="#111" stroke-width="3"/><text x="180" y="40" text-anchor="middle" font-size="27" font-weight="700">Δ = b² - 4ac &lt; 0</text><text x="180" y="72" text-anchor="middle" font-size="21">No real intersection</text><g transform="translate(35,105)"><line x1="0" y1="250" x2="290" y2="250" stroke="#111" stroke-width="2"/><line x1="145" y1="300" x2="145" y2="0" stroke="#111" stroke-width="2"/><path d="M30 25 Q145 210 260 25" fill="none" stroke="#c2272d" stroke-width="5"/><line x1="15" y1="270" x2="275" y2="305" stroke="#0b65c2" stroke-width="5"/><text x="145" y="235" text-anchor="middle" font-size="24" font-weight="700">no crossing</text></g><text x="180" y="430" text-anchor="middle" font-size="22" font-weight="700">no real roots</text></g></g><text x="625" y="665" text-anchor="middle" font-family="Arial" font-size="24">Apply the discriminant to the quadratic produced after substitution.</text></svg>
