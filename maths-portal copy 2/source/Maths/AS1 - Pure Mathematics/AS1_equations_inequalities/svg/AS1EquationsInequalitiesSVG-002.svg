<!--
Asset ID: AS1EquationsInequalitiesSVG-002
Source: P1 Chapter 3 PDF simultaneous equations graph section; transcript explanation of graph intersections.
Related lesson section: Core Theory: Simultaneous Equations and Graphs.
Purpose: Show that the solution of two simultaneous equations is the point of intersection of their graphs.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
  <title id="title">Simultaneous equations as graph intersections</title>
  <desc id="desc">A coordinate diagram showing two straight lines intersecting. The intersection point is labelled as the simultaneous solution.</desc>
  <rect x="0" y="0" width="1000" height="760" fill="#ffffff"/>
  <text x="500" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#111111">Simultaneous equations meet at the intersection</text>
  <g transform="translate(120,120)">
    <rect x="0" y="0" width="620" height="520" fill="#fbfbfb" stroke="#222222" stroke-width="3"/>
    <g stroke="#d0d0d0" stroke-width="1">
      <line x1="0" y1="52" x2="620" y2="52"/><line x1="0" y1="104" x2="620" y2="104"/><line x1="0" y1="156" x2="620" y2="156"/><line x1="0" y1="208" x2="620" y2="208"/><line x1="0" y1="260" x2="620" y2="260"/><line x1="0" y1="312" x2="620" y2="312"/><line x1="0" y1="364" x2="620" y2="364"/><line x1="0" y1="416" x2="620" y2="416"/><line x1="0" y1="468" x2="620" y2="468"/>
      <line x1="62" y1="0" x2="62" y2="520"/><line x1="124" y1="0" x2="124" y2="520"/><line x1="186" y1="0" x2="186" y2="520"/><line x1="248" y1="0" x2="248" y2="520"/><line x1="310" y1="0" x2="310" y2="520"/><line x1="372" y1="0" x2="372" y2="520"/><line x1="434" y1="0" x2="434" y2="520"/><line x1="496" y1="0" x2="496" y2="520"/><line x1="558" y1="0" x2="558" y2="520"/>
    </g>
    <line x1="0" y1="260" x2="620" y2="260" stroke="#111111" stroke-width="3"/>
    <line x1="310" y1="520" x2="310" y2="0" stroke="#111111" stroke-width="3"/>
    <line x1="165" y1="520" x2="425" y2="0" stroke="#0b65c2" stroke-width="5"/>
    <line x1="0" y1="78" x2="620" y2="388" stroke="#c2272d" stroke-width="5"/>
    <circle cx="393" cy="69" r="14" fill="#111111"/>
    <circle cx="393" cy="69" r="22" fill="none" stroke="#ffcc00" stroke-width="5"/>
    <text x="420" y="55" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111111">intersection</text>
    <text x="420" y="86" font-family="Arial, sans-serif" font-size="20" fill="#111111">simultaneous solution</text>
    <text x="75" y="485" font-family="Arial, sans-serif" font-size="22" fill="#0b65c2" font-weight="700">y = 2x + 1</text>
    <text x="410" y="390" font-family="Arial, sans-serif" font-size="22" fill="#c2272d" font-weight="700">x + y = 5</text>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="770" y="180" width="190" height="310" rx="18" fill="#f7f7f7" stroke="#222222" stroke-width="2"/>
    <text x="865" y="225" text-anchor="middle" font-size="24" font-weight="700" fill="#111111">Meaning</text>
    <text x="790" y="275" font-size="20" fill="#111111">Each line is a</text><text x="790" y="302" font-size="20" fill="#111111">set of points.</text><text x="790" y="352" font-size="20" fill="#111111">The crossing point</text><text x="790" y="379" font-size="20" fill="#111111">satisfies both</text><text x="790" y="406" font-size="20" fill="#111111">equations at</text><text x="790" y="433" font-size="20" fill="#111111">the same time.</text>
  </g>
  <text x="500" y="710" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#111111">Algebra finds the same point by elimination or substitution.</text>
</svg>
