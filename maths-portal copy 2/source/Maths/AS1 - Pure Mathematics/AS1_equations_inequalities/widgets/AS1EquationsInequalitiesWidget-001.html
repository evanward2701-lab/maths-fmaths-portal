<!--
Asset ID: AS1EquationsInequalitiesWidget-001
Source: CCEA AS1-AF-LO004 plus lesson discriminant examples.
Related lesson section: Core Theory: Graph Intersections and the Discriminant.
Purpose: Let the student vary a, b and c in ax^2 + bx + c = 0 and observe whether the discriminant gives two, one or no real roots.
-->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Discriminant Explorer</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f7f7f7;color:#111}.widget{max-width:980px;margin:24px auto;background:#fff;border:2px solid #111;border-radius:18px;padding:24px;box-shadow:0 8px 22px rgba(0,0,0,.08)}h1{text-align:center;margin-top:0}.subtitle{text-align:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.panel{border:1px solid #ccc;border-radius:14px;padding:18px;background:#fbfbfb}label{display:block;font-weight:bold;margin:12px 0 6px}input[type=range]{width:100%}.value{font-weight:bold;display:inline-block;min-width:42px}.formula{font-size:1.3rem;text-align:center;padding:14px;background:#f0f0f0;border-radius:12px;margin-bottom:14px}.result{font-size:1.15rem;line-height:1.55}.badge{display:inline-block;padding:6px 10px;border-radius:999px;border:1px solid #111;font-weight:bold;margin-top:8px;background:#fff}canvas{width:100%;height:320px;border:1px solid #aaa;border-radius:12px;background:#fff}.warning{margin-top:18px;padding:14px;border-left:5px solid #111;background:#f5f5f5;line-height:1.5}@media(max-width:780px){.grid{grid-template-columns:1fr}}</style></head><body><main class="widget"><h1>Discriminant Explorer</h1><p class="subtitle">Adjust a, b, and c in ax² + bx + c = 0. Watch how b² - 4ac controls the roots.</p><div class="grid"><section class="panel"><div class="formula" id="equationText">x² + 0x + 0 = 0</div><label for="aSlider">a = <span class="value" id="aValue">1</span></label><input id="aSlider" type="range" min="-5" max="5" step="1" value="1"/><label for="bSlider">b = <span class="value" id="bValue">0</span></label><input id="bSlider" type="range" min="-10" max="10" step="1" value="0"/><label for="cSlider">c = <span class="value" id="cValue">0</span></label><input id="cSlider" type="range" min="-10" max="10" step="1" value="0"/><div class="result" id="resultText"></div></section><section class="panel"><canvas id="graphCanvas" width="460" height="320" aria-label="Quadratic graph canvas"></canvas></section></div><div class="warning"><strong>Exam note:</strong> In a graph-intersection question, first combine the equations into a quadratic. Then use the discriminant on that produced quadratic.</div></main><script>const aSlider=document.getElementById('aSlider'),bSlider=document.getElementById('bSlider'),cSlider=document.getElementById('cSlider'),aValue=document.getElementById('aValue'),bValue=document.getElementById('bValue'),cValue=document.getElementById('cValue'),equationText=document.getElementById('equationText'),resultText=document.getElementById('resultText'),canvas=document.getElementById('graphCanvas'),ctx=canvas.getContext('2d');function formatTerm(coef,variable,first=false){if(coef===0)return'';const sign=coef>0?(first?'':' + '):' - ';const abs=Math.abs(coef);const number=abs===1&&variable?'':abs;return`${sign}${number}${variable}`}function update(){let a=Number(aSlider.value);const b=Number(bSlider.value),c=Number(cSlider.value);if(a===0){a=1;aSlider.value=1}aValue.textContent=a;bValue.textContent=b;cValue.textContent=c;equationText.textContent=formatTerm(a,'x²',true)+formatTerm(b,'x')+formatTerm(c,'')+' = 0';const d=b*b-4*a*c;let m=`<p><strong>Discriminant:</strong> b² - 4ac = ${d}</p>`;if(d>0){let r1=(-b+Math.sqrt(d))/(2*a),r2=(-b-Math.sqrt(d))/(2*a);m+=`<span class="badge">Two distinct real roots</span><p>The graph crosses the x-axis twice.</p><p>Approximate roots: x ≈ ${r1.toFixed(2)} and x ≈ ${r2.toFixed(2)}.</p>`}else if(d===0){let r=-b/(2*a);m+=`<span class="badge">One repeated real root</span><p>The graph touches the x-axis once.</p><p>Repeated root: x = ${r.toFixed(2)}.</p>`}else{m+=`<span class="badge">No real roots</span><p>The graph does not cross the x-axis.</p>`}resultText.innerHTML=m;drawGraph(a,b,c)}function drawGraph(a,b,c){ctx.clearRect(0,0,canvas.width,canvas.height);const w=canvas.width,h=canvas.height,xMin=-10,xMax=10,yMin=-10,yMax=10;function X(x){return((x-xMin)/(xMax-xMin))*w}function Y(y){return h-((y-yMin)/(yMax-yMin))*h}ctx.strokeStyle='#ddd';ctx.lineWidth=1;for(let x=xMin;x<=xMax;x++){ctx.beginPath();ctx.moveTo(X(x),0);ctx.lineTo(X(x),h);ctx.stroke()}for(let y=yMin;y<=yMax;y++){ctx.beginPath();ctx.moveTo(0,Y(y));ctx.lineTo(w,Y(y));ctx.stroke()}ctx.strokeStyle='#111';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,Y(0));ctx.lineTo(w,Y(0));ctx.stroke();ctx.beginPath();ctx.moveTo(X(0),0);ctx.lineTo(X(0),h);ctx.stroke();ctx.lineWidth=3;ctx.beginPath();let started=false;for(let px=0;px<=w;px++){const x=xMin+(px/w)*(xMax-xMin),y=a*x*x+b*x+c,py=Y(y);if(py>=-1000&&py<=h+1000){if(!started){ctx.moveTo(px,py);started=true}else ctx.lineTo(px,py)}}ctx.stroke()}[aSlider,bSlider,cSlider].forEach(s=>s.addEventListener('input',update));update();</script></body></html>
