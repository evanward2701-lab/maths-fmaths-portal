<!-- Asset ID: AS1EquationsInequalitiesWidget-002 | Source: quadratic inequalities section | Purpose: Toggle >, ≥, <, ≤ and see the matching interval. -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Quadratic Inequality Interval Explorer</title><style>body{margin:0;background:#f7f7f7;font-family:Arial,sans-serif;color:#111}.widget{max-width:980px;margin:24px auto;background:#fff;border:2px solid #111;border-radius:18px;padding:24px;box-shadow:0 8px 22px rgba(0,0,0,.08)}h1{text-align:center;margin-top:0}.subtitle{text-align:center;line-height:1.5}.controls{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:24px 0}button{font-size:1.15rem;padding:10px 16px;border:2px solid #111;border-radius:999px;background:#fff;cursor:pointer}button.active{background:#111;color:#fff}.equation{text-align:center;font-size:1.4rem;font-weight:bold;background:#f0f0f0;padding:14px;border-radius:12px;margin-bottom:22px}.number-line-wrap{border:1px solid #ccc;border-radius:14px;background:#fbfbfb;padding:24px}svg{width:100%;height:auto}.result{margin-top:18px;font-size:1.2rem;line-height:1.55;background:#f5f5f5;border-left:5px solid #111;padding:14px}.method{margin-top:18px;line-height:1.6}</style></head><body><main class="widget"><h1>Quadratic Inequality Interval Explorer</h1><p class="subtitle">Use the roots of x²+2x-15=(x+5)(x-3), then choose the correct sign region.</p><div class="equation" id="equationText">x² + 2x - 15 &gt; 0</div><div class="controls"><button data-symbol=">" class="active">&gt; 0</button><button data-symbol=">=">≥ 0</button><button data-symbol="<">&lt; 0</button><button data-symbol="<=">≤ 0</button></div><section class="number-line-wrap"><svg viewBox="0 0 900 260" role="img" aria-label="Number line showing solution interval"><line x1="80" y1="130" x2="820" y2="130" stroke="#111" stroke-width="5"/><polygon points="820,130 800,120 800,140" fill="#111"/><polygon points="80,130 100,120 100,140" fill="#111"/><line id="leftRegion" x1="80" y1="130" x2="300" y2="130" stroke="#111" stroke-width="14" stroke-linecap="round"/><line id="middleRegion" x1="300" y1="130" x2="600" y2="130" stroke="#111" stroke-width="14" stroke-linecap="round" opacity="0"/><line id="rightRegion" x1="600" y1="130" x2="820" y2="130" stroke="#111" stroke-width="14" stroke-linecap="round"/><circle id="leftPoint" cx="300" cy="130" r="15" fill="#fff" stroke="#111" stroke-width="5"/><circle id="rightPoint" cx="600" cy="130" r="15" fill="#fff" stroke="#111" stroke-width="5"/><text x="300" y="180" text-anchor="middle" font-size="28" font-family="Arial">-5</text><text x="600" y="180" text-anchor="middle" font-size="28" font-family="Arial">3</text><text x="185" y="85" text-anchor="middle" font-size="24" font-family="Arial" font-weight="700">positive</text><text x="450" y="85" text-anchor="middle" font-size="24" font-family="Arial" font-weight="700">negative</text><text x="710" y="85" text-anchor="middle" font-size="24" font-family="Arial" font-weight="700">positive</text><text x="450" y="235" text-anchor="middle" font-size="24" font-family="Arial" id="intervalLabel"></text></svg></section><div class="result" id="resultText"></div><div class="method"><strong>Method spine:</strong> x²+2x-15=(x+5)(x-3), so the roots are x=-5 and x=3. The parabola is positive outside the roots and negative between the roots.</div></main><script>const buttons=document.querySelectorAll('button[data-symbol]'),equationText=document.getElementById('equationText'),resultText=document.getElementById('resultText'),intervalLabel=document.getElementById('intervalLabel'),leftRegion=document.getElementById('leftRegion'),middleRegion=document.getElementById('middleRegion'),rightRegion=document.getElementById('rightRegion'),leftPoint=document.getElementById('leftPoint'),rightPoint=document.getElementById('rightPoint');function setEndpointStyle(closed){leftPoint.setAttribute('fill',closed?'#111':'#fff');rightPoint.setAttribute('fill',closed?'#111':'#fff')}function setRegion(l,m,r){leftRegion.setAttribute('opacity',l?'1':'0');middleRegion.setAttribute('opacity',m?'1':'0');rightRegion.setAttribute('opacity',r?'1':'0')}function update(symbol){buttons.forEach(b=>b.classList.toggle('active',b.dataset.symbol===symbol));const display=symbol==='>='?'≥':symbol==='<='?'≤':symbol;equationText.textContent=`x² + 2x - 15 ${display} 0`;if(symbol==='>'){setRegion(true,false,true);setEndpointStyle(false);intervalLabel.textContent='x < -5 or x > 3';resultText.innerHTML='<strong>Solution:</strong> {x:x&lt;-5} ∪ {x:x&gt;3}. Strict inequality, so endpoints are excluded.'}if(symbol==='>='){setRegion(true,false,true);setEndpointStyle(true);intervalLabel.textContent='x ≤ -5 or x ≥ 3';resultText.innerHTML='<strong>Solution:</strong> {x:x≤-5} ∪ {x:x≥3}. Equality is allowed.'}if(symbol==='<'){setRegion(false,true,false);setEndpointStyle(false);intervalLabel.textContent='-5 < x < 3';resultText.innerHTML='<strong>Solution:</strong> {x:-5&lt;x&lt;3}. Strict inequality, so endpoints are excluded.'}if(symbol==='<='){setRegion(false,true,false);setEndpointStyle(true);intervalLabel.textContent='-5 ≤ x ≤ 3';resultText.innerHTML='<strong>Solution:</strong> {x:-5≤x≤3}. Equality is allowed.'}}buttons.forEach(b=>b.addEventListener('click',()=>update(b.dataset.symbol)));update('>');</script></body></html>
