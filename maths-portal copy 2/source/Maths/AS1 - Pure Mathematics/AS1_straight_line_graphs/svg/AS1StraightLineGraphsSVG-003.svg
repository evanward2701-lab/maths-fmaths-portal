<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">Parallel and perpendicular gradient conditions</title>
<desc id="desc">Two panels comparing parallel lines with equal gradients and perpendicular lines with negative reciprocal gradients.</desc>
<!-- Asset ID: AS1StraightLineGraphsSVG-003. Purpose: parallel and perpendicular gradient conditions. -->
<rect width="1000" height="560" fill="#fff"/>
<text x="40" y="45" font-family="Arial" font-size="26" font-weight="700">Parallel and perpendicular gradients</text>
<text x="40" y="78" font-family="Arial" font-size="16" fill="#374151">Parallel lines share a gradient. Perpendicular lines have gradients whose product is -1.</text>
<g transform="translate(60,120)"><rect width="410" height="360" rx="16" fill="#f9fafb" stroke="#9ca3af"/><text x="24" y="38" font-family="Arial" font-size="22" font-weight="700">Parallel lines</text><text x="24" y="66" font-family="Arial" font-size="15" fill="#374151">Same steepness, same gradient.</text><line x1="60" y1="270" x2="330" y2="135" stroke="#2563eb" stroke-width="5"/><line x1="80" y1="315" x2="350" y2="180" stroke="#60a5fa" stroke-width="5"/><polyline points="110,245 170,245 170,215" fill="none" stroke="#111827" stroke-width="2"/><text x="48" y="330" font-family="Arial" font-size="17" font-weight="700" fill="#1d4ed8">m₁ = m₂</text><text x="155" y="330" font-family="Arial" font-size="15" fill="#374151">parallel</text></g>
<g transform="translate(530,120)"><rect width="410" height="360" rx="16" fill="#f9fafb" stroke="#9ca3af"/><text x="24" y="38" font-family="Arial" font-size="22" font-weight="700">Perpendicular lines</text><text x="24" y="66" font-family="Arial" font-size="15" fill="#374151">Negative reciprocal gradients.</text><line x1="60" y1="265" x2="350" y2="120" stroke="#059669" stroke-width="5"/><line x1="155" y1="100" x2="280" y2="350" stroke="#dc2626" stroke-width="5"/><path d="M214 186 L226 192 L220 204 L208 198 Z" fill="#fff" stroke="#111827" stroke-width="2"/><text x="55" y="320" font-family="Arial" font-size="15" font-weight="700" fill="#047857">m₁ = 1/2</text><text x="250" y="320" font-family="Arial" font-size="15" font-weight="700" fill="#991b1b">m₂ = -2</text><text x="92" y="345" font-family="Arial" font-size="17" font-weight="700">m₁m₂ = -1</text><text x="205" y="345" font-family="Arial" font-size="15" fill="#374151">perpendicular</text></g>
</svg>
