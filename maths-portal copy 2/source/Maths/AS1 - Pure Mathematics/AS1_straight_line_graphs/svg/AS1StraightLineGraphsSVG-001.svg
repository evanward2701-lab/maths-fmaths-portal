<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">Vertical and horizontal line comparison</title>
<desc id="desc">Coordinate grid showing x equals 2 as a vertical line and y equals 2 as a horizontal line.</desc>
<!-- Asset ID: AS1StraightLineGraphsSVG-001. Purpose: compare x=2 and y=2. -->
<rect width="900" height="560" fill="#fff"/>
<text x="40" y="45" font-family="Arial" font-size="26" font-weight="700">Vertical and horizontal lines</text>
<text x="40" y="78" font-family="Arial" font-size="16" fill="#374151">x = 2 fixes x, so the line is vertical. y = 2 fixes y, so the line is horizontal.</text>
<g transform="translate(80,110)">
<rect width="680" height="390" fill="#f9fafb" stroke="#111827"/>
<g stroke="#d1d5db" stroke-width="1">
<line x1="0.000" y1="0" x2="0.000" y2="390"/>
<line x1="61.818" y1="0" x2="61.818" y2="390"/>
<line x1="123.636" y1="0" x2="123.636" y2="390"/>
<line x1="185.454" y1="0" x2="185.454" y2="390"/>
<line x1="247.272" y1="0" x2="247.272" y2="390"/>
<line x1="309.090" y1="0" x2="309.090" y2="390"/>
<line x1="370.908" y1="0" x2="370.908" y2="390"/>
<line x1="432.726" y1="0" x2="432.726" y2="390"/>
<line x1="494.544" y1="0" x2="494.544" y2="390"/>
<line x1="556.362" y1="0" x2="556.362" y2="390"/>
<line x1="618.180" y1="0" x2="618.180" y2="390"/>
<line x1="679.998" y1="0" x2="679.998" y2="390"/>
<line x1="0" y1="0.000" x2="680" y2="0.000"/>
<line x1="0" y1="48.750" x2="680" y2="48.750"/>
<line x1="0" y1="97.500" x2="680" y2="97.500"/>
<line x1="0" y1="146.250" x2="680" y2="146.250"/>
<line x1="0" y1="195.000" x2="680" y2="195.000"/>
<line x1="0" y1="243.750" x2="680" y2="243.750"/>
<line x1="0" y1="292.500" x2="680" y2="292.500"/>
<line x1="0" y1="341.250" x2="680" y2="341.250"/>
<line x1="0" y1="390.000" x2="680" y2="390.000"/>
</g>
<line x1="309.09" y1="0" x2="309.09" y2="390" stroke="#111827" stroke-width="2"/>
<line x1="0" y1="195" x2="680" y2="195" stroke="#111827" stroke-width="2"/>
<line x1="432.73" y1="0" x2="432.73" y2="390" stroke="#7c3aed" stroke-width="6"/>
<line x1="0" y1="97.5" x2="680" y2="97.5" stroke="#059669" stroke-width="4" stroke-dasharray="10 8"/>
<text x="448" y="30" font-family="Arial" font-size="22" font-weight="700" fill="#5b21b6">x = 2</text>
<text x="18" y="88" font-family="Arial" font-size="22" font-weight="700" fill="#047857">y = 2</text>
<circle cx="432.73" cy="48.75" r="6" fill="#7c3aed"/><text x="448" y="52" font-family="Arial" font-size="14">(2, 3)</text>
<circle cx="432.73" cy="195" r="6" fill="#7c3aed"/><text x="448" y="199" font-family="Arial" font-size="14">(2, 0)</text>
<circle cx="432.73" cy="341.25" r="6" fill="#7c3aed"/><text x="448" y="345" font-family="Arial" font-size="14">(2, -3)</text>
<text x="666" y="218" font-family="Arial" font-size="18">x</text><text x="322" y="18" font-family="Arial" font-size="18">y</text>
</g>
<g transform="translate(770,160)"><rect width="105" height="190" rx="12" fill="#f3f4f6" stroke="#9ca3af"/><text x="14" y="32" font-family="Arial" font-size="15" font-weight="700">Key idea</text><text x="14" y="64" font-family="Arial" font-size="13">On x = 2,</text><text x="14" y="84" font-family="Arial" font-size="13">x is always 2.</text><text x="14" y="120" font-family="Arial" font-size="13">On y = 2,</text><text x="14" y="140" font-family="Arial" font-size="13">y is always 2.</text></g>
</svg>
