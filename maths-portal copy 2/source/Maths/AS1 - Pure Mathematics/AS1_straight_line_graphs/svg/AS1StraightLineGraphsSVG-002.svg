<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">Intersection of y = 3x and x + 2y = 4</title>
<desc id="desc">Coordinate diagram showing the intersection point P and triangle OPQ.</desc>
<!-- Asset ID: AS1StraightLineGraphsSVG-002. Purpose: intersection and area. -->
<rect width="900" height="560" fill="#fff"/>
<text x="40" y="45" font-family="Arial" font-size="26" font-weight="700">Intersection and area: lines meeting at P</text>
<text x="40" y="78" font-family="Arial" font-size="16" fill="#374151">Solve simultaneously to find P, then use base and height for the triangle.</text>
<rect x="80" y="110" width="520" height="380" fill="#f9fafb" stroke="#111827"/>
<g stroke="#d1d5db"><line x1="100" y1="480" x2="100" y2="120"/>
<line x1="180" y1="480" x2="180" y2="120"/>
<line x1="260" y1="480" x2="260" y2="120"/>
<line x1="340" y1="480" x2="340" y2="120"/>
<line x1="420" y1="480" x2="420" y2="120"/>
<line x1="500" y1="480" x2="500" y2="120"/>
<line x1="580" y1="480" x2="580" y2="120"/>
<line x1="100" y1="480" x2="590" y2="480"/>
<line x1="100" y1="400" x2="590" y2="400"/>
<line x1="100" y1="320" x2="590" y2="320"/>
<line x1="100" y1="240" x2="590" y2="240"/>
<line x1="100" y1="160" x2="590" y2="160"/></g>
<line x1="100" y1="480" x2="590" y2="480" stroke="#111827" stroke-width="2"/><line x1="100" y1="480" x2="100" y2="120" stroke="#111827" stroke-width="2"/>
<polygon points="100,480 145.71,342.86 420,480" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" opacity="0.85"/>
<line x1="100" y1="480" x2="224" y2="108" stroke="#2563eb" stroke-width="4"/><text x="225" y="140" font-family="Arial" font-size="18" fill="#1d4ed8" font-weight="700">y = 3x</text>
<line x1="100" y1="320" x2="420" y2="480" stroke="#dc2626" stroke-width="4"/><text x="300" y="368" font-family="Arial" font-size="18" fill="#991b1b" font-weight="700">x + 2y = 4</text>
<circle cx="100" cy="480" r="6" fill="#111827"/><circle cx="145.71" cy="342.86" r="7" fill="#7c3aed"/><circle cx="420" cy="480" r="7" fill="#dc2626"/>
<text x="78" y="502" font-family="Arial" font-size="16" font-weight="700">O</text><text x="154" y="333" font-family="Arial" font-size="16" font-weight="700" fill="#5b21b6">P</text><text x="430" y="502" font-family="Arial" font-size="16" font-weight="700" fill="#991b1b">Q</text>
<text x="154" y="354" font-family="Arial" font-size="13">P = (4/7, 12/7)</text><text x="430" y="480" font-family="Arial" font-size="13">Q = (4, 0)</text>
<line x1="145.71" y1="342.86" x2="145.71" y2="480" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 6"/><text x="153" y="416" font-family="Arial" font-size="13">height = 12/7</text>
<line x1="100" y1="506" x2="420" y2="506" stroke="#111827" stroke-width="2"/><text x="243" y="530" font-family="Arial" font-size="15">base OQ = 4</text>
<g transform="translate(640,130)"><rect width="220" height="250" rx="14" fill="#f3f4f6" stroke="#9ca3af"/><text x="18" y="34" font-family="Arial" font-size="18" font-weight="700">Area calculation</text><text x="18" y="72" font-family="Arial" font-size="15">P = (4/7, 12/7)</text><text x="18" y="100" font-family="Arial" font-size="15">Q = (4, 0)</text><text x="18" y="138" font-family="Arial" font-size="15">Area = 1/2 × base × height</text><text x="18" y="166" font-family="Arial" font-size="15">Area = 1/2 × 4 × 12/7</text><text x="18" y="194" font-family="Arial" font-size="15" font-weight="700">Area = 24/7 units²</text></g>
</svg>
