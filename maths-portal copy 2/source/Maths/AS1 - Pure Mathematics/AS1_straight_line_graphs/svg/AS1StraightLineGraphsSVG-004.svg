<svg xmlns="http://www.w3.org/2000/svg" width="950" height="620" viewBox="0 0 950 620" role="img" aria-labelledby="title desc">
<title id="title">Triangle PQR formed by two straight lines</title>
<desc id="desc">A coordinate diagram showing P at 4,4, Q at 0,2 and R at 0,8. The vertical base QR and horizontal height from P are labelled.</desc>
<!-- Asset ID: AS1StraightLineGraphsSVG-004. Purpose: triangle area with vertical base and horizontal height. -->
<rect width="950" height="620" fill="#fff"/>
<text x="40" y="45" font-family="Arial" font-size="26" font-weight="700">Lengths and areas from straight-line graphs</text>
<text x="40" y="78" font-family="Arial" font-size="16" fill="#374151">Use a perpendicular base and height. Here QR is vertical and the height from P is horizontal.</text>
<rect x="90" y="100" width="430" height="460" fill="#f9fafb" stroke="#111827"/>
<g stroke="#d1d5db"><line x1="120" y1="540" x2="120" y2="110"/>
<line x1="170" y1="540" x2="170" y2="110"/>
<line x1="220" y1="540" x2="220" y2="110"/>
<line x1="270" y1="540" x2="270" y2="110"/>
<line x1="320" y1="540" x2="320" y2="110"/>
<line x1="370" y1="540" x2="370" y2="110"/>
<line x1="420" y1="540" x2="420" y2="110"/>
<line x1="470" y1="540" x2="470" y2="110"/>
<line x1="520" y1="540" x2="520" y2="110"/>
<line x1="120" y1="540" x2="520" y2="540"/>
<line x1="120" y1="490" x2="520" y2="490"/>
<line x1="120" y1="440" x2="520" y2="440"/>
<line x1="120" y1="390" x2="520" y2="390"/>
<line x1="120" y1="340" x2="520" y2="340"/>
<line x1="120" y1="290" x2="520" y2="290"/>
<line x1="120" y1="240" x2="520" y2="240"/>
<line x1="120" y1="190" x2="520" y2="190"/>
<line x1="120" y1="140" x2="520" y2="140"/></g>
<line x1="120" y1="540" x2="520" y2="540" stroke="#111827" stroke-width="2"/><line x1="120" y1="540" x2="120" y2="110" stroke="#111827" stroke-width="2"/>
<line x1="120" y1="440" x2="520" y2="240" stroke="#2563eb" stroke-width="4"/><text x="330" y="278" font-family="Arial" font-size="16" fill="#1d4ed8" font-weight="700">2y = x + 4</text>
<line x1="120" y1="140" x2="520" y2="540" stroke="#dc2626" stroke-width="4"/><text x="285" y="185" font-family="Arial" font-size="16" fill="#991b1b" font-weight="700">x + y = 8</text>
<polygon points="120,440 120,140 320,340" fill="#ecfdf5" stroke="#059669" stroke-width="2" opacity="0.85"/>
<line x1="120" y1="440" x2="120" y2="140" stroke="#059669" stroke-width="6"/><line x1="120" y1="340" x2="320" y2="340" stroke="#7c3aed" stroke-width="4" stroke-dasharray="8 6"/>
<text x="185" y="328" font-family="Arial" font-size="15" font-weight="700" fill="#5b21b6">height = 4</text><text x="35" y="294" font-family="Arial" font-size="15" font-weight="700" fill="#047857">QR = 6</text>
<circle cx="320" cy="340" r="7" fill="#111827"/><circle cx="120" cy="440" r="7" fill="#2563eb"/><circle cx="120" cy="140" r="7" fill="#dc2626"/>
<text x="330" y="335" font-family="Arial" font-size="16" font-weight="700">P(4, 4)</text><text x="42" y="445" font-family="Arial" font-size="16" font-weight="700" fill="#1d4ed8">Q(0, 2)</text><text x="42" y="145" font-family="Arial" font-size="16" font-weight="700" fill="#991b1b">R(0, 8)</text>
<path d="M120 340 L138 340 L138 358 L120 358 Z" fill="#fff" stroke="#111827" stroke-width="2"/>
<g transform="translate(570,145)"><rect width="330" height="250" rx="16" fill="#f3f4f6" stroke="#9ca3af"/><text x="20" y="36" font-family="Arial" font-size="20" font-weight="700">Area of triangle PQR</text><text x="20" y="78" font-family="Arial" font-size="16">Q = (0, 2), R = (0, 8)</text><text x="20" y="106" font-family="Arial" font-size="16">QR = 8 - 2 = 6</text><text x="20" y="144" font-family="Arial" font-size="16">P = (4, 4)</text><text x="20" y="172" font-family="Arial" font-size="16">height from P to y-axis = 4</text><text x="20" y="212" font-family="Arial" font-size="16" font-weight="700">Area = 1/2 × 6 × 4 = 12 units²</text></g>
</svg>
