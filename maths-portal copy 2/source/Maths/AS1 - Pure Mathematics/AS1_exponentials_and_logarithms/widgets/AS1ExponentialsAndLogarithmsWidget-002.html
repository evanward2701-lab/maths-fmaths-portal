<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AS1 Log Converter</title><!-- Asset ID: AS1ExponentialsAndLogarithmsWidget-002 | Source: CCEA AS1-EXPLOG and Chapter 14 PDF/transcript | Purpose: Convert between log and exponential form. -->
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#eef2f7;color:#18202a;margin:0}.widget{max-width:960px;margin:24px auto;padding:20px;background:white;border:1px solid #d8dee8;border-radius:18px;box-shadow:0 10px 30px rgba(24,32,42,.08)}h1{margin-top:0}.panel{background:#f6f8fb;border:1px solid #d8dee8;border-radius:14px;padding:16px;margin:12px 0}label{font-weight:700;display:block;margin:8px 0 4px}input,select{padding:8px;border:1px solid #d8dee8;border-radius:10px;width:100%;max-width:320px}button{padding:10px 13px;background:#1f6feb;color:white;border:0;border-radius:10px;font-weight:700;cursor:pointer}.out{background:white;border:1px solid #d8dee8;border-radius:12px;padding:12px;margin-top:12px;line-height:1.5}svg{width:100%;max-width:720px;height:auto;border:1px solid #d8dee8;border-radius:14px;background:white}.muted{color:#5d6775}.grid{display:grid;grid-template-columns:1fr 280px;gap:18px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style>
</head><body><main class="widget"><h1>Logarithmic and exponential form converter</h1><p class="muted">A logarithm answers: the power of a that gives n is x.</p><div class="panel"><label>Base a</label><input id="base" type="number" value="2" step="any"><label>Input/result n</label><input id="n" type="number" value="8" step="any"><label>Power/output x</label><input id="x" type="number" value="3" step="any"><p><button onclick="go()">Convert</button></p><div class="out" id="out"></div></div><div class="panel"><b>Domain reminder:</b> log_a n needs a&gt;0, a≠1 and n&gt;0. Logs can output negative numbers, but log inputs cannot be zero or negative.</div></main><script>
function fmt(z){return Math.abs(z-Math.round(z))<1e-10?String(Math.round(z)):Number(z).toFixed(6).replace(/0+$/,'').replace(/\.$/,'')}
function go(){let a=+base.value,nv=+n.value,xv=+x.value;if(!(a>0)||Math.abs(a-1)<1e-12){out.innerHTML='Base must satisfy a>0 and a≠1.';return}if(!(nv>0)){out.innerHTML='Log input n must be positive.';return}out.innerHTML=`log base ${fmt(a)} of ${fmt(nv)} = ${fmt(xv)} means ${fmt(a)}^${fmt(xv)} = ${fmt(nv)}.<br>Check: ${fmt(a)}^${fmt(xv)} = ${fmt(Math.pow(a,xv))}.`}
go();
</script></body></html>
