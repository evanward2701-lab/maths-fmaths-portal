<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AS1 Exponentials Widget 001</title><!-- Asset ID: AS1ExponentialsAndLogarithmsWidget-001 | Source: CCEA AS1-EXPLOG and Chapter 14 PDF/transcript | Purpose: Explore y=a^x. -->
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#eef2f7;color:#18202a;margin:0}.widget{max-width:960px;margin:24px auto;padding:20px;background:white;border:1px solid #d8dee8;border-radius:18px;box-shadow:0 10px 30px rgba(24,32,42,.08)}h1{margin-top:0}.panel{background:#f6f8fb;border:1px solid #d8dee8;border-radius:14px;padding:16px;margin:12px 0}label{font-weight:700;display:block;margin:8px 0 4px}input,select{padding:8px;border:1px solid #d8dee8;border-radius:10px;width:100%;max-width:320px}button{padding:10px 13px;background:#1f6feb;color:white;border:0;border-radius:10px;font-weight:700;cursor:pointer}.out{background:white;border:1px solid #d8dee8;border-radius:12px;padding:12px;margin-top:12px;line-height:1.5}svg{width:100%;max-width:720px;height:auto;border:1px solid #d8dee8;border-radius:14px;background:white}.muted{color:#5d6775}.grid{display:grid;grid-template-columns:1fr 280px;gap:18px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style>
</head><body><main class="widget"><h1>Explore y = a^x</h1><p class="muted">Move the slider to change the base a. Watch the graph switch between growth, flat and decay.</p><div class="grid"><section><svg id="svg" viewBox="0 0 620 420"></svg></section><aside class="panel"><label>Base a: <span id="aval">2.00</span></label><input id="a" type="range" min="0.2" max="4" value="2" step="0.05"><div id="info" class="out"></div></aside></div></main><script>
const svg=document.getElementById('svg'),a=document.getElementById('a'),aval=document.getElementById('aval'),info=document.getElementById('info');
const L=60,R=590,T=35,B=360,xmin=-4,xmax=4,ymin=-1,ymax=10;
function xp(x){return L+(x-xmin)/(xmax-xmin)*(R-L)}function yp(y){return B-(y-ymin)/(ymax-ymin)*(B-T)}
function el(t,o){let e=document.createElementNS('http://www.w3.org/2000/svg',t);for(let k in o)e.setAttribute(k,o[k]);return e}
function draw(){let v=+a.value; aval.textContent=v.toFixed(2); svg.innerHTML='<rect width="620" height="420" fill="white"/>'; for(let i=0;i<=10;i++){let y=B-i*(B-T)/10; svg.appendChild(el('line',{x1:L,y1:y,x2:R,y2:y,stroke:'#e5e7eb'}));} for(let i=0;i<=8;i++){let x=L+i*(R-L)/8; svg.appendChild(el('line',{x1:x,y1:T,x2:x,y2:B,stroke:'#e5e7eb'}));} svg.appendChild(el('line',{x1:L,y1:yp(0),x2:R,y2:yp(0),stroke:'#111','stroke-width':2})); svg.appendChild(el('line',{x1:xp(0),y1:T,x2:xp(0),y2:B,stroke:'#111','stroke-width':2})); svg.appendChild(el('line',{x1:L,y1:yp(0),x2:R,y2:yp(0),stroke:'#777','stroke-dasharray':'7 5'})); let d=''; for(let i=0;i<=240;i++){let x=xmin+i/240*(xmax-xmin), y=Math.pow(v,x); if(y>=ymin&&y<=ymax)d+=(d?'L':'M')+xp(x).toFixed(1)+' '+yp(y).toFixed(1)+' ';} svg.appendChild(el('path',{d,fill:'none',stroke:'#1f6feb','stroke-width':4})); svg.appendChild(el('circle',{cx:xp(0),cy:yp(1),r:5,fill:'#111'})); let txt=el('text',{x:xp(0)+8,y:yp(1)-8,'font-family':'Arial','font-size':13}); txt.textContent='(0,1)'; svg.appendChild(txt); info.innerHTML=(v>1?'Growth: graph increases left to right.':v<1?'Decay: graph decreases left to right.':'Flat: 1^x=1.')+'<br>y-intercept: (0,1), because a^0=1.<br>Asymptote: y=0.'}
a.addEventListener('input',draw);draw();
</script></body></html>
