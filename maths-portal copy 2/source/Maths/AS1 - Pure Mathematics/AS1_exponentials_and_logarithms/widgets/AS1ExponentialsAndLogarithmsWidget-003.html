<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AS1 Growth and Decay Calculator</title><!-- Asset ID: AS1ExponentialsAndLogarithmsWidget-003 | Source: CCEA AS1-EXPLOG and Chapter 14 modelling examples | Purpose: Calculate and interpret exponential models. -->
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#eef2f7;color:#18202a;margin:0}.widget{max-width:960px;margin:24px auto;padding:20px;background:white;border:1px solid #d8dee8;border-radius:18px;box-shadow:0 10px 30px rgba(24,32,42,.08)}h1{margin-top:0}.panel{background:#f6f8fb;border:1px solid #d8dee8;border-radius:14px;padding:16px;margin:12px 0}label{font-weight:700;display:block;margin:8px 0 4px}input,select{padding:8px;border:1px solid #d8dee8;border-radius:10px;width:100%;max-width:320px}button{padding:10px 13px;background:#1f6feb;color:white;border:0;border-radius:10px;font-weight:700;cursor:pointer}.out{background:white;border:1px solid #d8dee8;border-radius:12px;padding:12px;margin-top:12px;line-height:1.5}svg{width:100%;max-width:720px;height:auto;border:1px solid #d8dee8;border-radius:14px;background:white}.muted{color:#5d6775}.grid{display:grid;grid-template-columns:1fr 280px;gap:18px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style>
</head><body><main class="widget"><h1>Growth and decay model calculator</h1><p class="muted">Explore models of the form A a^t and A e^(kt). The initial value is A.</p><div class="grid"><section class="panel"><label>Model type</label><select id="type" onchange="fields();calc()"><option value="m">A a^t</option><option value="e">A e^(kt)</option></select><label>Initial value A</label><input id="A" type="number" value="1200" step="any"><div id="af"><label>Multiplier a</label><input id="a" type="number" value="1.04" step="any"></div><div id="kf" style="display:none"><label>Constant k</label><input id="k" type="number" value="-0.12" step="any"></div><label>Time t</label><input id="t" type="number" value="8" step="any"><p><button onclick="calc()">Calculate</button></p><div class="out" id="out"></div></section><section><svg id="svg" viewBox="0 0 620 420"></svg></section></div></main><script>
const L=60,R=590,T=35,B=360;function E(t,o){let e=document.createElementNS('http://www.w3.org/2000/svg',t);for(let k in o)e.setAttribute(k,o[k]);return e}function f(z){return Number(z).toFixed(Math.abs(z)>=100?1:3).replace(/0+$/,'').replace(/\.$/,'')}function fields(){af.style.display=type.value==='m'?'':'none';kf.style.display=type.value==='e'?'':'none'}function val(tt){let AA=+A.value;return type.value==='m'?AA*Math.pow(+a.value,tt):AA*Math.exp(+k.value*tt)}function calc(){let AA=+A.value,tt=+t.value;if(AA<0||tt<0){out.innerHTML='Use non-negative A and t.';return}let y=val(tt),kind=type.value==='m'?(+a.value>1?'growth':+a.value<1?'decay':'constant'):(+k.value>0?'growth':+k.value<0?'decay':'constant');out.innerHTML=`Initial value: A = ${f(AA)}.<br>At t = ${f(tt)}, model value = ${f(y)}.<br>Interpretation: ${kind} model.<br>Long-term check: ask whether the prediction remains sensible for large t.`;draw(tt)}function draw(tt){svg.innerHTML='<rect width="620" height="420" fill="white"/>';let ymax=Math.max(+A.value,val(tt),1)*1.25,tmax=Math.max(10,tt*1.25);function xp(x){return L+x/tmax*(R-L)}function yp(y){return B-y/ymax*(B-T)}for(let i=0;i<=10;i++){svg.appendChild(E('line',{x1:L,y1:B-i*(B-T)/10,x2:R,y2:B-i*(B-T)/10,stroke:'#e5e7eb'}));svg.appendChild(E('line',{x1:L+i*(R-L)/10,y1:T,x2:L+i*(R-L)/10,y2:B,stroke:'#e5e7eb'}));}svg.appendChild(E('line',{x1:L,y1:B,x2:R,y2:B,stroke:'#111','stroke-width':2}));svg.appendChild(E('line',{x1:L,y1:T,x2:L,y2:B,stroke:'#111','stroke-width':2}));let d='';for(let i=0;i<=200;i++){let x=i/200*tmax,y=val(x);d+=(d?'L':'M')+xp(x).toFixed(1)+' '+yp(y).toFixed(1)+' '}svg.appendChild(E('path',{d,fill:'none',stroke:'#1f6feb','stroke-width':4}));svg.appendChild(E('circle',{cx:xp(tt),cy:yp(val(tt)),r:6,fill:'#b42318',stroke:'#fff','stroke-width':2}));}fields();calc();
</script></body></html>
