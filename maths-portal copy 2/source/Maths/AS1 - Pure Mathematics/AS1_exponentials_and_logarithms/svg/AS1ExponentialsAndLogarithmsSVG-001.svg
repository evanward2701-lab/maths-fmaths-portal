<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420" role="img" aria-labelledby="title desc">
  <title id="title">AS1ExponentialsAndLogarithmsSVG-001: Plot of y equals 2 to the power x</title>
  <desc id="desc">Graph of y = 2^x using table values x = -2, -1, 0, 1, 2, 3, 4.</desc>
  <!-- Asset ID: AS1ExponentialsAndLogarithmsSVG-001 | Source: Chapter 14 PDF and screenshot evidence | Related lesson section: Worked Example 1; Core Theory 1 | Purpose: Plot y=2^x from a table. -->
  <rect width="600" height="420" fill="#fff"/>
  <text x="30" y="38" font-family="Arial" font-size="22" font-weight="700">Plotting y = 2^x</text>
  <line x1="70" y1="330" x2="540" y2="330" stroke="#111" stroke-width="2"/>
  <line x1="227" y1="350" x2="227" y2="60" stroke="#111" stroke-width="2"/>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="70" y1="270" x2="540" y2="270"/><line x1="70" y1="210" x2="540" y2="210"/><line x1="70" y1="150" x2="540" y2="150"/><line x1="70" y1="90" x2="540" y2="90"/>
