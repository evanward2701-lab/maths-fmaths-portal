  </g>
  <line x1="70" y1="330" x2="540" y2="330" stroke="#777" stroke-dasharray="7 5"/>
  <path d="M80 326 C145 324 190 319 227 314 C285 305 335 285 373 265 C420 240 470 170 520 70" fill="none" stroke="#20639b" stroke-width="4"/>
  <g fill="#20639b" stroke="#fff" stroke-width="2"><circle cx="80" cy="326" r="5"/><circle cx="153" cy="322" r="5"/><circle cx="227" cy="314" r="5"/><circle cx="300" cy="298" r="5"/><circle cx="373" cy="265" r="5"/><circle cx="447" cy="200" r="5"/><circle cx="520" cy="70" r="5"/></g>
  <text x="235" y="312" font-family="Arial" font-size="13">(0,1)</text><text x="305" y="292" font-family="Arial" font-size="13">(1,2)</text><text x="382" y="260" font-family="Arial" font-size="13">(2,4)</text><text x="450" y="194" font-family="Arial" font-size="13">(3,8)</text><text x="460" y="88" font-family="Arial" font-size="13">(4,16)</text>
  <text x="390" y="350" font-family="Arial" font-size="13">asymptote y = 0</text>
  <text x="34" y="382" font-family="Arial" font-size="14">The graph grows by multiplying by 2 each time x increases by 1.</text>
