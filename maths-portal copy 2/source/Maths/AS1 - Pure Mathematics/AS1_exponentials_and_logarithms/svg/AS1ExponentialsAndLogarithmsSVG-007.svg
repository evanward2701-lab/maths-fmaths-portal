<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420" role="img" aria-labelledby="title desc"><title id="title">AS1ExponentialsAndLogarithmsSVG-007: e^x and ln x as inverse functions</title><desc id="desc">Shows y=e^x and y=ln x as inverse functions reflected in the line y=x.</desc><!-- Asset ID: AS1ExponentialsAndLogarithmsSVG-007 | Source: CCEA AS1-EXPLOG inverse function boundary | Purpose: Show inverse functions reflected in y=x. --><rect width="600" height="420" fill="#fff"/><text x="30" y="38" font-family="Arial" font-size="22" font-weight="700">Inverse functions: e^x and ln x</text><line x1="80" y1="240" x2="545" y2="240" stroke="#111" stroke-width="2"/><line x1="230" y1="345" x2="230" y2="60" stroke="#111" stroke-width="2"/><line x1="80" y1="330" x2="530" y2="60" stroke="#777" stroke-dasharray="7 5"/><path d="M80 235 C130 232 180 226 230 195 C285 160 330 110 355 66" fill="none" stroke="#20639b" stroke-width="4"/><path d="M235 330 C252 300 278 272 305 240 C350 195 405 164 530 128" fill="none" stroke="#c0392b" stroke-width="4"/><circle cx="230" cy="195" r="5" fill="#20639b"/><circle cx="305" cy="240" r="5" fill="#c0392b"/><text x="238" y="190" font-family="Arial" font-size="13">(0,1)</text><text x="315" y="254" font-family="Arial" font-size="13">(1,0)</text><line x1="230" y1="240" x2="230" y2="60" stroke="#999" stroke-dasharray="7 5"/><text x="238" y="78" font-family="Arial" font-size="13">asymptote x=0 for y=ln x</text><text x="334" y="86" font-family="Arial" font-size="15" fill="#20639b">y=e^x</text><text x="434" y="154" font-family="Arial" font-size="15" fill="#c0392b">y=ln x</text><text x="440" y="108" font-family="Arial" font-size="13">y=x</text></svg>