  <title id="title">AS1ExponentialsAndLogarithmsSVG-002: Comparing exponential bases</title>
  <desc id="desc">Comparison of y = 3^x, y = 2^x and y = 1.5^x, all passing through (0,1).</desc>
  <!-- Asset ID: AS1ExponentialsAndLogarithmsSVG-002 | Source: Chapter 14 PDF | Purpose: Compare bases in y=a^x. -->
  <rect width="600" height="420" fill="#fff"/>
  <text x="30" y="38" font-family="Arial" font-size="22" font-weight="700">Comparing y = a^x</text>
  <line x1="70" y1="330" x2="545" y2="330" stroke="#111" stroke-width="2"/><line x1="310" y1="345" x2="310" y2="70" stroke="#111" stroke-width="2"/>
  <g stroke="#e8e8e8"><line x1="70" y1="270" x2="540" y2="270"/><line x1="70" y1="210" x2="540" y2="210"/><line x1="70" y1="150" x2="540" y2="150"/><line x1="70" y1="90" x2="540" y2="90"/></g>
  <path d="M70 322 C150 321 235 316 310 300 C360 285 410 240 450 165 C470 130 490 95 505 80" fill="none" stroke="#c0392b" stroke-width="4"/>
  <path d="M70 318 C150 316 235 310 310 300 C365 288 420 258 470 205 C500 170 522 125 535 92" fill="none" stroke="#20639b" stroke-width="4"/>
  <path d="M70 306 C150 304 235 301 310 300 C365 294 430 280 500 245 C520 235 535 225 548 215" fill="none" stroke="#2e8b57" stroke-width="4"/>
  <circle cx="310" cy="300" r="5" fill="#111"/><text x="318" y="294" font-family="Arial" font-size="13">(0,1)</text>
  <text x="435" y="110" font-family="Arial" font-size="14" fill="#c0392b">y=3^x</text><text x="435" y="137" font-family="Arial" font-size="14" fill="#20639b">y=2^x</text><text x="435" y="164" font-family="Arial" font-size="14" fill="#2e8b57">y=1.5^x</text>
  <text x="52" y="382" font-family="Arial" font-size="14">All three have y-intercept 1 because a^0 = 1.</text>
