<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420" role="img" aria-labelledby="title desc"><title id="title">AS1ExponentialsAndLogarithmsSVG-003: Growth versus decay</title><desc id="desc">Shows y=2^x and y=2^{-x}, illustrating growth and decay.</desc><!-- Asset ID: AS1ExponentialsAndLogarithmsSVG-003 | Source: Chapter 14 PDF and transcript | Purpose: Show growth, decay and reflection. --><rect width="600" height="420" fill="#fff"/><text x="30" y="38" font-family="Arial" font-size="22" font-weight="700">Growth and decay</text><line x1="70" y1="330" x2="545" y2="330" stroke="#111" stroke-width="2"/><line x1="310" y1="345" x2="310" y2="70" stroke="#111" stroke-width="2"/><line x1="70" y1="330" x2="545" y2="330" stroke="#777" stroke-dasharray="8 5"/><path d="M70 321 C165 318 245 309 310 300 C365 288 420 258 470 205 C500 170 522 125 535 92" fill="none" stroke="#20639b" stroke-width="4"/><path d="M85 92 C105 125 130 170 160 205 C210 258 260 288 310 300 C375 309 455 318 540 321" fill="none" stroke="#c0392b" stroke-width="4"/><circle cx="310" cy="300" r="5" fill="#111"/><text x="318" y="294" font-family="Arial" font-size="13">(0,1)</text><text x="460" y="165" font-family="Arial" font-size="15" fill="#20639b">y=2^x</text><text x="98" y="165" font-family="Arial" font-size="15" fill="#c0392b">y=2^{-x}</text><text x="408" y="351" font-family="Arial" font-size="13">asymptote y=0</text><text x="54" y="382" font-family="Arial" font-size="14">Growth doubles each step. Decay halves each step.</text></svg>