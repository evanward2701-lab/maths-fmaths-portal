<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420" role="img" aria-labelledby="title desc"><title id="title">AS1ExponentialsAndLogarithmsSVG-004: Transformation y=2^(x+3)</title><desc id="desc">Sketch of y=2^{x+3}, showing left translation by 3 and y-intercept 8.</desc><!-- Asset ID: AS1ExponentialsAndLogarithmsSVG-004 | Source: Chapter 14 PDF | Purpose: Show horizontal translation and intercept. --><rect width="600" height="420" fill="#fff"/><text x="30" y="38" font-family="Arial" font-size="22" font-weight="700">Sketching y = 2^(x+3)</text><line x1="70" y1="330" x2="545" y2="330" stroke="#111" stroke-width="2"/><line x1="390" y1="345" x2="390" y2="70" stroke="#111" stroke-width="2"/><line x1="70" y1="330" x2="545" y2="330" stroke="#777" stroke-dasharray="8 5"/><path d="M70 321 C135 319 190 312 230 300 C280 284 335 240 390 150 C420 105 455 80 500 62" fill="none" stroke="#20639b" stroke-width="4"/><circle cx="390" cy="150" r="6" fill="#20639b" stroke="#fff" stroke-width="2"/><text x="400" y="145" font-family="Arial" font-size="14">y-intercept = 8</text><text x="82" y="118" font-family="Arial" font-size="14">At x=0:</text><text x="82" y="142" font-family="Arial" font-size="14">y = 2^(0+3) = 2^3 = 8</text><text x="404" y="352" font-family="Arial" font-size="13">asymptote y=0</text></svg>