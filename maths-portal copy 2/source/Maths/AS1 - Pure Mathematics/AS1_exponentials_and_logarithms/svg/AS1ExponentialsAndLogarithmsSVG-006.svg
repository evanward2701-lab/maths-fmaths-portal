<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420" role="img" aria-labelledby="title desc"><title id="title">AS1ExponentialsAndLogarithmsSVG-006: Graph of log base 2 of x</title><desc id="desc">Graph of y=log_2 x, including vertical asymptote x=0 and points (1,0), (2,1), (4,2), (8,3).</desc><!-- Asset ID: AS1ExponentialsAndLogarithmsSVG-006 | Source: Chapter 14 transcript | Purpose: Sketch y=log_2 x. --><rect width="600" height="420" fill="#fff"/><text x="30" y="38" font-family="Arial" font-size="22" font-weight="700">Graph of y = log_2 x</text><line x1="80" y1="195" x2="545" y2="195" stroke="#111" stroke-width="2"/><line x1="80" y1="335" x2="80" y2="80" stroke="#111" stroke-width="2"/><line x1="80" y1="335" x2="80" y2="80" stroke="#777" stroke-dasharray="8 5"/><path d="M86 326 C95 292 112 250 138 240 C165 224 181 207 196 195 C235 165 275 143 312 150 C380 120 470 105 544 90" fill="none" stroke="#20639b" stroke-width="4"/><g fill="#20639b" stroke="#fff" stroke-width="2"><circle cx="138" cy="240" r="5"/><circle cx="196" cy="195" r="5"/><circle cx="312" cy="150" r="5"/><circle cx="544" cy="105" r="5"/></g><text x="132" y="259" font-family="Arial" font-size="13">(1,0)</text><text x="200" y="190" font-family="Arial" font-size="13">(2,1)</text><text x="318" y="145" font-family="Arial" font-size="13">(4,2)</text><text x="480" y="99" font-family="Arial" font-size="13">(8,3)</text><text x="92" y="101" font-family="Arial" font-size="13">asymptote x=0</text><text x="50" y="382" font-family="Arial" font-size="14">No part of the graph lies at x ≤ 0. Log inputs must be positive.</text></svg>