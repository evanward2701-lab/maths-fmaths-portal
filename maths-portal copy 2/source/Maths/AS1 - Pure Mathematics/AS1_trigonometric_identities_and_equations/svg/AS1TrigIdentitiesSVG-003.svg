<!-- asset_id: AS1TrigIdentitiesSVG-003 | source: Chapter 10 PDF pages 8-10 + transcript videos 6-7 | purpose: graph symmetry and periodicity -->
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="820" viewBox="0 0 1120 820" role="img" aria-labelledby="title desc"><title id="title">Trigonometric graph symmetries and periodicity</title><desc id="desc">Three graph panels show sine symmetry, cosine symmetry and tangent's 180 degree period.</desc><style>.title{font:700 30px Arial;fill:#111827}.subtitle{font:700 19px Arial;fill:#111827}.label{font:15px Arial;fill:#111827}.small{font:13px Arial;fill:#374151}.math{font:18px 'Times New Roman';fill:#111827}.panel{fill:#fff;stroke:#d1d5db;stroke-width:2}.axis{stroke:#111827;stroke-width:2}.curve1{stroke:#2563eb;stroke-width:4;fill:none}.curve2{stroke:#059669;stroke-width:4;fill:none}.curve3{stroke:#7c3aed;stroke-width:4;fill:none}.marker{fill:#dc2626;stroke:#fff;stroke-width:2}.dash{stroke:#dc2626;stroke-width:2;stroke-dasharray:6 6}.note{fill:#f9fafb;stroke:#e5e7eb;stroke-width:2}</style><rect width="1120" height="820" fill="#fff"/><text x="560" y="45" text-anchor="middle" class="title">Angle Laws from Graph Symmetry</text><text x="560" y="76" text-anchor="middle" class="small">Use the graph as the map. The angle laws are just shortcuts.</text><rect x="60" y="110" width="1000" height="190" class="panel" rx="18"/><text x="90" y="145" class="subtitle">1. Sine symmetry</text><line x1="120" y1="235" x2="980" y2="235" class="axis"/><path d="M120 235 C210 115 335 115 420 235 C505 355 635 355 720 235 C805 115 895 115 980 235" class="curve1"/><text x="120" y="260" class="small">0°</text><text x="420" y="260" class="small">180°</text><text x="720" y="260" class="small">360°</text><circle cx="170" cy="175" r="7" class="marker"/><circle cx="370" cy="175" r="7" class="marker"/><line x1="170" y1="175" x2="170" y2="235" class="dash"/><line x1="370" y1="175" x2="370" y2="235" class="dash"/><rect x="745" y="150" width="250" height="85" class="note" rx="12"/><text x="765" y="180" class="math">sin x = sin(180° − x)</text><text x="765" y="210" class="small">Example: sin 150° = sin 30°</text><rect x="60" y="325" width="1000" height="190" class="panel" rx="18"/><text x="90" y="360" class="subtitle">2. Cosine symmetry</text><line x1="120" y1="450" x2="980" y2="450" class="axis"/><path d="M120 365 C205 365 335 450 420 535 C505 620 635 620 720 535 C805 450 895 365 980 365" class="curve2"/><circle cx="170" cy="365" r="7" class="marker"/><circle cx="670" cy="365" r="7" class="marker"/><rect x="745" y="365" width="250" height="85" class="note" rx="12"/><text x="765" y="395" class="math">cos x = cos(360° − x)</text><text x="765" y="425" class="small">Example: cos 330° = cos 30°</text><rect x="60" y="540" width="1000" height="220" class="panel" rx="18"/><text x="90" y="575" class="subtitle">3. Tangent periodicity</text><line x1="120" y1="655" x2="980" y2="655" class="axis"/><line x1="270" y1="585" x2="270" y2="730" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 5"/><line x1="570" y1="585" x2="570" y2="730" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 5"/><line x1="870" y1="585" x2="870" y2="730" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 5"/><path d="M125 710 C175 690 220 650 260 590" class="curve3"/><path d="M280 720 C360 700 470 610 560 590" class="curve3"/><path d="M580 720 C660 700 770 610 860 590" class="curve3"/><rect x="745" y="575" width="250" height="65" class="note" rx="12"/><text x="765" y="605" class="math">tan(x + 180°) = tan x</text><text x="765" y="630" class="small">Tangent repeats every 180°.</text></svg>
