<?xml version="1.0" encoding="UTF-8"?>
<!-- asset_id: AS1TrigIdentitiesSVG-001 | source: Chapter 10 PDF page 4 + transcript video 5 | purpose: exact values from special triangles -->
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
<title id="title">Exact trigonometric values from special triangles</title>
<desc id="desc">A half-unit-square triangle derives the 45 degree exact values. A half-equilateral triangle derives the 30 and 60 degree exact values.</desc>
<style>.title{font:700 30px Arial;fill:#111827}.subtitle{font:700 20px Arial;fill:#111827}.label{font:18px Arial;fill:#111827}.small{font:15px Arial;fill:#374151}.math{font:18px 'Times New Roman';fill:#111827}.panel{fill:#f9fafb;stroke:#d1d5db;stroke-width:2}.tri{fill:#eef2ff;stroke:#1f2937;stroke-width:3}.box{fill:#fff;stroke:#d1d5db;stroke-width:2}</style>
<rect width="1100" height="720" fill="#fff"/><text x="550" y="48" text-anchor="middle" class="title">Exact Values from Two Special Triangles</text><text x="550" y="80" text-anchor="middle" class="small">Derive first, then memorise.</text>
<rect x="50" y="120" width="480" height="530" class="panel" rx="18"/><text x="290" y="160" text-anchor="middle" class="subtitle">Half a unit square</text><polygon points="145,500 405,500 405,240" class="tri"/><path d="M380 500 L380 475 L405 475" stroke="#1f2937" stroke-width="3" fill="none"/><path d="M190 500 A45 45 0 0 1 221 469" stroke="#dc2626" stroke-width="3" fill="none"/><text x="215" y="488" class="label">45°</text><text x="268" y="525" text-anchor="middle" class="label">1</text><text x="425" y="376" class="label">1</text><text x="250" y="350" transform="rotate(-45 250 350)" class="label">√2</text><rect x="105" y="545" width="370" height="75" class="box" rx="12"/><text x="125" y="570" class="math">sin 45° = 1 / √2 = √2 / 2</text><text x="125" y="595" class="math">cos 45° = 1 / √2 = √2 / 2</text><text x="125" y="620" class="math">tan 45° = 1</text>
<rect x="570" y="120" width="480" height="530" class="panel" rx="18"/><text x="810" y="160" text-anchor="middle" class="subtitle">Half an equilateral triangle</text><polygon points="660,500 940,500 660,220" fill="#ecfdf5" stroke="#1f2937" stroke-width="3"/><path d="M660 475 L685 475 L685 500" stroke="#1f2937" stroke-width="3" fill="none"/><path d="M690 500 A50 50 0 0 1 704 466" stroke="#dc2626" stroke-width="3" fill="none"/><path d="M660 272 A55 55 0 0 1 713 284" stroke="#dc2626" stroke-width="3" fill="none"/><text x="710" y="487" class="label">60°</text><text x="675" y="292" class="label">30°</text><text x="800" y="525" text-anchor="middle" class="label">1</text><text x="635" y="360" class="label">√3</text><text x="815" y="340" transform="rotate(-45 815 340)" class="label">2</text><rect x="625" y="545" width="370" height="75" class="box" rx="12"/><text x="645" y="570" class="math">sin 30° = 1/2, cos 30° = √3/2</text><text x="645" y="595" class="math">sin 60° = √3/2, cos 60° = 1/2</text><text x="645" y="620" class="math">tan 30° = 1/√3, tan 60° = √3</text>
</svg>
