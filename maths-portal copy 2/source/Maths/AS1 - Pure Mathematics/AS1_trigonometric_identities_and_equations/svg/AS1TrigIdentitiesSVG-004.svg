<!-- asset_id: AS1TrigIdentitiesSVG-004 | source: Chapter 10 PDF page 12 + transcript video 8 | purpose: derive tangent and Pythagorean identities -->
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"><title id="title">Deriving the two core trigonometric identities</title><desc id="desc">A unit hypotenuse triangle shows adjacent as cosine theta and opposite as sine theta.</desc><style>.title{font:700 30px Arial;fill:#111827}.subtitle{font:700 21px Arial;fill:#111827}.label{font:18px Arial;fill:#111827}.small{font:15px Arial;fill:#374151}.math{font:20px 'Times New Roman';fill:#111827}.panel{fill:#f9fafb;stroke:#d1d5db;stroke-width:2}.tri{fill:#eef2ff;stroke:#1f2937;stroke-width:3}.sin{stroke:#dc2626;stroke-width:5}.cos{stroke:#059669;stroke-width:5}.hyp{stroke:#2563eb;stroke-width:5}.box{fill:#fff;stroke:#d1d5db;stroke-width:2}.step{font:17px Arial;fill:#111827}</style><rect width="1100" height="720" fill="#fff"/><text x="550" y="48" text-anchor="middle" class="title">The Two Core Trigonometric Identities</text><text x="550" y="80" text-anchor="middle" class="small">A unit hypotenuse turns triangle ratios into lengths.</text><rect x="55" y="120" width="500" height="540" class="panel" rx="18"/><text x="305" y="160" text-anchor="middle" class="subtitle">Unit hypotenuse triangle</text><polygon points="140,520 470,520 470,260" class="tri"/><line x1="140" y1="520" x2="470" y2="520" class="cos"/><line x1="470" y1="520" x2="470" y2="260" class="sin"/><line x1="140" y1="520" x2="470" y2="260" class="hyp"/><text x="200" y="498" class="label">θ</text><text x="300" y="548" text-anchor="middle" class="label">cos θ</text><text x="490" y="395" class="label">sin θ</text><text x="285" y="355" transform="rotate(-38 285 355)" class="label">1</text><rect x="595" y="120" width="450" height="540" class="panel" rx="18"/><text x="820" y="160" text-anchor="middle" class="subtitle">Identity derivations</text><rect x="630" y="195" width="380" height="160" class="box" rx="14"/><text x="650" y="230" class="step">1. Tangent is opposite ÷ adjacent:</text><text x="675" y="270" class="math">tan θ = opposite / adjacent</text><text x="675" y="310" class="math">tan θ = sin θ / cos θ</text><rect x="630" y="395" width="380" height="190" class="box" rx="14"/><text x="650" y="430" class="step">2. Pythagoras gives:</text><text x="675" y="470" class="math">(opposite)² + (adjacent)² = 1²</text><text x="675" y="510" class="math">(sin θ)² + (cos θ)² = 1</text><text x="675" y="550" class="math">sin² θ + cos² θ = 1</text></svg>
