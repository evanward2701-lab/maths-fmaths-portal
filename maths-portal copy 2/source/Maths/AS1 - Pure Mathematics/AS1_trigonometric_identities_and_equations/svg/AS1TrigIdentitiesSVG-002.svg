<!-- asset_id: AS1TrigIdentitiesSVG-002 | source: Chapter 10 PDF pages 5-7 + transcript videos 2-4 | purpose: unit circle signs -->
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc"><title id="title">Unit circle signs for sine, cosine and tangent</title><desc id="desc">A unit circle diagram with coordinates cos theta and sin theta plus quadrant sign table.</desc><style>.title{font:700 30px Arial;fill:#111827}.subtitle{font:700 20px Arial;fill:#111827}.label{font:17px Arial;fill:#111827}.small{font:14px Arial;fill:#374151}.math{font:18px 'Times New Roman';fill:#111827}.axis{stroke:#111827;stroke-width:3}.circle{fill:#f8fafc;stroke:#1f2937;stroke-width:3}.radius{stroke:#2563eb;stroke-width:4}.sin{stroke:#dc2626;stroke-width:4}.cos{stroke:#059669;stroke-width:4}.panel{fill:#fff;stroke:#d1d5db;stroke-width:2}.header{fill:#111827}.headtext{font:700 15px Arial;fill:#fff}.celltext{font:15px Arial;fill:#111827}</style><rect width="1100" height="760" fill="#fff"/><text x="550" y="46" text-anchor="middle" class="title">Unit Circle: Signs and Meaning</text><text x="550" y="76" text-anchor="middle" class="small">On the unit circle, the point is (cos θ, sin θ), and tan θ is the gradient.</text><rect x="40" y="110" width="620" height="600" class="panel" rx="18"/><circle cx="350" cy="410" r="220" class="circle"/><line x1="95" y1="410" x2="605" y2="410" class="axis"/><line x1="350" y1="155" x2="350" y2="665" class="axis"/><text x="610" y="405" class="label">x</text><text x="360" y="165" class="label">y</text><line x1="350" y1="410" x2="530" y2="284" class="radius"/><line x1="350" y1="410" x2="530" y2="410" class="cos"/><line x1="530" y1="410" x2="530" y2="284" class="sin"/><circle cx="530" cy="284" r="6" fill="#111827"/><text x="500" y="260" class="math">(cos θ, sin θ)</text><text x="438" y="432" class="label">cos θ</text><text x="540" y="350" class="label">sin θ</text><text x="585" y="435" class="label">0° / 360°</text><text x="365" y="185" class="label">90°</text><text x="100" y="435" class="label">180°</text><text x="365" y="660" class="label">270°</text><text x="455" y="250" class="small">QI: all positive</text><text x="165" y="250" class="small">QII: sin positive</text><text x="155" y="590" class="small">QIII: tan positive</text><text x="455" y="590" class="small">QIV: cos positive</text><rect x="700" y="110" width="360" height="600" class="panel" rx="18"/><text x="880" y="150" text-anchor="middle" class="subtitle">Quadrant sign table</text><rect x="735" y="185" width="290" height="42" class="header" rx="8"/><text x="760" y="212" class="headtext">Range</text><text x="860" y="212" class="headtext">cos</text><text x="920" y="212" class="headtext">sin</text><text x="980" y="212" class="headtext">tan</text><text x="750" y="260" class="celltext">0° &lt; θ &lt; 90°</text><text x="865" y="260" class="celltext">+</text><text x="925" y="260" class="celltext">+</text><text x="985" y="260" class="celltext">+</text><text x="750" y="315" class="celltext">90° &lt; θ &lt; 180°</text><text x="865" y="315" class="celltext">−</text><text x="925" y="315" class="celltext">+</text><text x="985" y="315" class="celltext">−</text><text x="750" y="370" class="celltext">180° &lt; θ &lt; 270°</text><text x="865" y="370" class="celltext">−</text><text x="925" y="370" class="celltext">−</text><text x="985" y="370" class="celltext">+</text><text x="750" y="425" class="celltext">270° &lt; θ &lt; 360°</text><text x="865" y="425" class="celltext">+</text><text x="925" y="425" class="celltext">−</text><text x="985" y="425" class="celltext">−</text><rect x="735" y="490" width="290" height="150" fill="#fef2f2" stroke="#fecaca" stroke-width="2" rx="12"/><text x="755" y="525" class="label">Axis-angle warnings</text><text x="755" y="560" class="small">At 90° and 270°:</text><text x="755" y="588" class="math">cos θ = 0</text><text x="755" y="616" class="math">tan θ = sin θ / cos θ</text><text x="755" y="644" class="math">so tan θ is undefined.</text></svg>
