<!-- asset_id: AS1TrigIdentitiesSVG-005 | source: Chapter 10 PDF pages 21-23 + transcript video 13 | purpose: interval transformation for linear arguments -->
<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="760" viewBox="0 0 1150 760" role="img" aria-labelledby="title desc"><title id="title">Solving trigonometric equations with linear arguments</title><desc id="desc">A flow diagram showing how to solve cos of 3x equals negative one half by transforming the interval first.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#111827"/></marker></defs><style>.title{font:700 30px Arial;fill:#111827}.subtitle{font:700 19px Arial;fill:#111827}.small{font:14px Arial;fill:#374151}.math{font:19px 'Times New Roman';fill:#111827}.panel{fill:#f9fafb;stroke:#d1d5db;stroke-width:2}.box{fill:#fff;stroke:#d1d5db;stroke-width:2}.dark{fill:#111827}.darktext{font:700 15px Arial;fill:#fff}.arrow{stroke:#111827;stroke-width:3;fill:none;marker-end:url(#arrow)}.warn{fill:#fff7ed;stroke:#fed7aa;stroke-width:2}.good{fill:#ecfdf5;stroke:#bbf7d0;stroke-width:2}</style><rect width="1150" height="760" fill="#fff"/><text x="575" y="46" text-anchor="middle" class="title">Linear Arguments: Transform the Interval First</text><text x="575" y="76" text-anchor="middle" class="small">For equations such as cos(3x) = −1/2, solve for the whole argument before dividing.</text><rect x="45" y="115" width="1060" height="575" class="panel" rx="18"/><rect x="80" y="145" width="990" height="48" class="dark" rx="12"/><text x="575" y="176" text-anchor="middle" class="darktext">Example method: cos(3x) = −1/2, for 0° ≤ x ≤ 360°</text><rect x="85" y="235" width="190" height="105" class="box" rx="14"/><text x="180" y="265" text-anchor="middle" class="subtitle">Step 1</text><text x="105" y="300" class="math">0° ≤ x ≤ 360°</text><path d="M280 287 L365 287" class="arrow"/><rect x="370" y="235" width="220" height="105" class="box" rx="14"/><text x="480" y="265" text-anchor="middle" class="subtitle">Step 2</text><text x="395" y="300" class="math">0° ≤ 3x ≤ 1080°</text><path d="M595 287 L680 287" class="arrow"/><rect x="685" y="235" width="380" height="105" class="box" rx="14"/><text x="875" y="265" text-anchor="middle" class="subtitle">Step 3</text><text x="710" y="300" class="math">Solve cos(3x) = −1/2 over 0° ≤ 3x ≤ 1080°</text><rect x="120" y="390" width="455" height="135" class="good" rx="14"/><text x="145" y="425" class="subtitle">Argument values</text><text x="145" y="465" class="math">3x = 120°, 240°, 480°, 600°, 840°, 960°</text><path d="M580 455 L670 455" class="arrow"/><rect x="675" y="390" width="360" height="135" class="good" rx="14"/><text x="700" y="425" class="subtitle">Divide at the end</text><text x="700" y="465" class="math">x = 40°, 80°, 160°, 200°, 280°, 320°</text><rect x="120" y="555" width="915" height="95" class="warn" rx="14"/><text x="145" y="590" class="subtitle">Exam warning</text><text x="145" y="620" class="small">Do not solve one calculator value, divide by 3, and stop. The argument 3x travels through three full cycles.</text></svg>
