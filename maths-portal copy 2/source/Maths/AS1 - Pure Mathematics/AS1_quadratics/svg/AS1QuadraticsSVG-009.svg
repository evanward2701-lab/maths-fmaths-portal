<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Spear Height-Time Model</title>
<desc id="desc">Height-time parabola showing starting height, maximum and ground hit time.</desc>
<!-- asset_id: AS1QuadraticsSVG-009
source: CCEA AS1-AF specification map + lesson evidence
related_section: Core Theory Part I
purpose: Show h(t)=23.275-4.9(t-1.5)^2 with maximum labelled. -->
<rect width="1200" height="720" fill="#f8fafc"/>
<rect x="60" y="40" width="1080" height="90" rx="20" fill="#111827"/>
<text x="600" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#fff">Spear Height-Time Model</text>

<rect x="90" y="135" width="1020" height="510" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
<line x1="160" y1="580" x2="1040" y2="580" stroke="#0f172a" stroke-width="3"/><line x1="160" y1="580" x2="160" y2="170" stroke="#0f172a" stroke-width="3"/>
<path d="M160 390 C310 130 500 130 650 390 C760 575 910 650 1030 580" fill="none" stroke="#2563eb" stroke-width="6"/>
<circle cx="160" cy="390" r="9" fill="#059669"/><text x="185" y="390" font-family="Arial" font-size="20" fill="#064e3b">h(0)=12.25</text>
<circle cx="405" cy="170" r="10" fill="#7c3aed"/><line x1="405" y1="170" x2="405" y2="580" stroke="#7c3aed" stroke-width="3" stroke-dasharray="9 8"/><text x="430" y="170" font-family="Arial" font-size="20" fill="#4c1d95">max 23.275 m at t=1.5 s</text>
<circle cx="880" cy="580" r="9" fill="#dc2626"/><text x="735" y="625" font-family="Arial" font-size="20" fill="#7f1d1d">hits ground at t≈3.68 s</text>

</svg>
