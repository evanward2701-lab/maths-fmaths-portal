<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Solving Quadratics: Method Map</title>
<desc id="desc">Comparison of factorisation, formula and completing the square.</desc>
<!-- asset_id: AS1QuadraticsSVG-002
source: CCEA AS1-AF specification map + lesson evidence
related_section: Core Theory Part A
purpose: Compare the three algebraic solving routes. -->
<rect width="1200" height="720" fill="#f8fafc"/>
<rect x="60" y="40" width="1080" height="90" rx="20" fill="#111827"/>
<text x="600" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#fff">Solving Quadratics: Method Map</text>

<g font-family="Arial, sans-serif">
 <rect x="80" y="170" width="320" height="410" rx="20" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/><text x="240" y="220" text-anchor="middle" font-size="28" font-weight="700">Factorisation</text><text x="120" y="300" font-size="24">x²+5x=6</text><text x="120" y="340" font-size="24">x²+5x−6=0</text><text x="120" y="380" font-size="24">(x+6)(x−1)=0</text><text x="120" y="420" font-size="24">x=−6 or x=1</text>
 <rect x="440" y="170" width="320" height="410" rx="20" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="600" y="220" text-anchor="middle" font-size="28" font-weight="700">Formula</text><text x="470" y="315" font-size="22">x = (-b ± √(b²−4ac)) / 2a</text><text x="470" y="365" font-size="22">a=1, b=5, c=-6</text><text x="470" y="405" font-size="22">x=(-5±7)/2</text>
 <rect x="800" y="170" width="320" height="410" rx="20" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><text x="960" y="220" text-anchor="middle" font-size="28" font-weight="700">Complete square</text><text x="840" y="300" font-size="24">x²+4x−5=0</text><text x="840" y="340" font-size="24">(x+2)²−9=0</text><text x="840" y="380" font-size="24">(x+2)²=9</text><text x="840" y="420" font-size="24">x+2=±3</text>
</g>

</svg>
