<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Completing the Square</title>
<desc id="desc">Algebraic transformation from x squared plus 12x to completed square form.</desc>
<!-- asset_id: AS1QuadraticsSVG-003
source: CCEA AS1-AF specification map + lesson evidence
related_section: Core Theory Part B
purpose: Show the algebraic complete-the-square transformation. -->
<rect width="1200" height="720" fill="#f8fafc"/>
<rect x="60" y="40" width="1080" height="90" rx="20" fill="#111827"/>
<text x="600" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#fff">Completing the Square</text>

<g font-family="Arial, sans-serif" font-size="24" fill="#0f172a">
 <rect x="100" y="190" width="300" height="360" rx="22" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/><text x="250" y="250" text-anchor="middle" font-size="30" font-weight="700">Start</text><text x="250" y="340" text-anchor="middle" font-size="38">x² + 12x</text><text x="250" y="420" text-anchor="middle">half 12 to get 6</text>
 <rect x="450" y="190" width="300" height="360" rx="22" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="600" y="250" text-anchor="middle" font-size="30" font-weight="700">Build square</text><text x="600" y="340" text-anchor="middle" font-size="38">(x + 6)²</text><text x="600" y="420" text-anchor="middle">creates extra +36</text>
 <rect x="800" y="190" width="300" height="360" rx="22" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><text x="950" y="250" text-anchor="middle" font-size="30" font-weight="700">Correct it</text><text x="950" y="330" text-anchor="middle" font-size="34">(x + 6)² − 36</text><text x="950" y="390" text-anchor="middle">= x² + 12x</text>
</g>
<text x="600" y="650" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#334155">Subtract the square of the half-coefficient to keep the expression unchanged.</text>

</svg>
