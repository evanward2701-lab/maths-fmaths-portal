<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Completed Square Form and Turning Point</title>
<desc id="desc">Diagram of f(x) equals (x minus 3) squared minus 7.</desc>
<!-- asset_id: AS1QuadraticsSVG-004
source: CCEA AS1-AF specification map + lesson evidence
related_section: Core Theory Part E
purpose: Show how completed square form reveals a minimum. -->
<rect width="1200" height="720" fill="#f8fafc"/>
<rect x="60" y="40" width="1080" height="90" rx="20" fill="#111827"/>
<text x="600" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#fff">Completed Square Form and Turning Point</text>

<rect x="90" y="150" width="430" height="470" rx="20" fill="#eef2ff" stroke="#4f46e5" stroke-width="3"/>
<text x="305" y="220" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">Algebra</text><text x="305" y="300" text-anchor="middle" font-family="Arial" font-size="32">f(x)=x²−6x+2</text><text x="305" y="360" text-anchor="middle" font-family="Arial" font-size="32">f(x)=(x−3)²−7</text><text x="305" y="450" text-anchor="middle" font-family="Arial" font-size="24">minimum = −7</text><text x="305" y="495" text-anchor="middle" font-family="Arial" font-size="24">when x=3</text>
<rect x="570" y="150" width="540" height="470" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><line x1="630" y1="500" x2="1060" y2="500" stroke="#0f172a" stroke-width="3"/><line x1="845" y1="580" x2="845" y2="210" stroke="#0f172a" stroke-width="3"/><path d="M650 250 C740 560 950 560 1040 250" fill="none" stroke="#2563eb" stroke-width="5"/><circle cx="845" cy="540" r="9" fill="#dc2626"/><line x1="845" y1="540" x2="845" y2="500" stroke="#dc2626" stroke-dasharray="6 6"/><text x="865" y="562" font-family="Arial" font-size="22" fill="#dc2626">(3, -7)</text>

</svg>
