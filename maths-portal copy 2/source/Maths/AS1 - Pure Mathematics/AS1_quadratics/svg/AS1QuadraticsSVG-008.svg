<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Discriminant Sign Table</title>
<desc id="desc">Table linking discriminant sign to roots and graph behaviour.</desc>
<!-- asset_id: AS1QuadraticsSVG-008
source: CCEA AS1-AF specification map + lesson evidence
related_section: Core Theory Part H
purpose: Display discriminant sign table with graph interpretation. -->
<rect width="1200" height="720" fill="#f8fafc"/>
<rect x="60" y="40" width="1080" height="90" rx="20" fill="#111827"/>
<text x="600" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#fff">Discriminant Sign Table</text>

<g font-family="Arial, sans-serif">
<rect x="120" y="170" width="960" height="410" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><rect x="120" y="170" width="960" height="80" fill="#111827"/>
<text x="260" y="220" text-anchor="middle" font-size="24" fill="#fff" font-weight="700">Condition</text><text x="590" y="220" text-anchor="middle" font-size="24" fill="#fff" font-weight="700">Roots</text><text x="925" y="220" text-anchor="middle" font-size="24" fill="#fff" font-weight="700">Graph</text>
<line x1="400" y1="170" x2="400" y2="580" stroke="#cbd5e1" stroke-width="3"/><line x1="760" y1="170" x2="760" y2="580" stroke="#cbd5e1" stroke-width="3"/><line x1="120" y1="250" x2="1080" y2="250" stroke="#cbd5e1" stroke-width="3"/><line x1="120" y1="360" x2="1080" y2="360" stroke="#cbd5e1" stroke-width="2"/><line x1="120" y1="470" x2="1080" y2="470" stroke="#cbd5e1" stroke-width="2"/>
<text x="260" y="320" text-anchor="middle" font-size="32" fill="#15803d" font-weight="700">D &gt; 0</text><text x="590" y="320" text-anchor="middle" font-size="24">two distinct real roots</text><text x="925" y="320" text-anchor="middle" font-size="24">crosses twice</text>
<text x="260" y="430" text-anchor="middle" font-size="32" fill="#b45309" font-weight="700">D = 0</text><text x="590" y="430" text-anchor="middle" font-size="24">one repeated root</text><text x="925" y="430" text-anchor="middle" font-size="24">touches axis</text>
<text x="260" y="540" text-anchor="middle" font-size="32" fill="#7c3aed" font-weight="700">D &lt; 0</text><text x="590" y="540" text-anchor="middle" font-size="24">no real roots</text><text x="925" y="540" text-anchor="middle" font-size="24">does not meet axis</text>
</g>

</svg>
