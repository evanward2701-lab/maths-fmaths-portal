<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AS1 Quadratics Discriminant Explorer</title>
<style>body{font-family:Arial,sans-serif;margin:0;background:#f8fafc;color:#0f172a}.wrap{max-width:1000px;margin:24px auto;padding:20px}.head{background:#111827;color:white;border-radius:18px;padding:22px;margin-bottom:18px}.card{background:white;border:2px solid #cbd5e1;border-radius:18px;padding:18px;box-shadow:0 8px 20px rgba(15,23,42,.08)}button,select,input{font-size:1rem;padding:10px;border-radius:10px;border:2px solid #cbd5e1;margin:6px 0}button{background:#2563eb;color:white;font-weight:700;cursor:pointer}canvas{width:100%;height:460px;border:2px solid #cbd5e1;border-radius:16px;background:white}.grid{display:grid;grid-template-columns:340px 1fr;gap:18px}.result{background:#f1f5f9;border-radius:12px;padding:12px;margin-top:10px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body>
<main class="wrap"><section class="head"><h1>Discriminant Explorer</h1><p>Change a, b and c in y = ax² + bx + c. Watch D = b² − 4ac decide the root story.</p></section><section class="grid"><div class="card"><p><b id="eq"></b></p><label>a <span id="av"></span></label><input id="a" type="range" min="-5" max="5" step="1" value="1"><label>b <span id="bv"></span></label><input id="b" type="range" min="-10" max="10" step="1" value="4"><label>c <span id="cv"></span></label><input id="c" type="range" min="-10" max="10" step="1" value="-5"><div id="out" class="result"></div></div><div class="card"><canvas id="can" width="720" height="460"></canvas></div></section></main><script>
const can=document.getElementById('can'),ctx=can.getContext('2d'),a=document.getElementById('a'),b=document.getElementById('b'),c=document.getElementById('c');function sx(x){return (x+10)/20*can.width}function sy(y){return can.height-(y+20)/40*can.height}function f(x,A,B,C){return A*x*x+B*x+C}function fmt(x){return Math.round(x*1000)/1000}function draw(){if(+a.value===0)a.value=1;let A=+a.value,B=+b.value,C=+c.value,D=B*B-4*A*C;av.textContent=A;bv.textContent=B;cv.textContent=C;eq.textContent=`y = ${A}x² ${B>=0?'+':'−'} ${Math.abs(B)}x ${C>=0?'+':'−'} ${Math.abs(C)}`;out.innerHTML=D>0?`D=${D} > 0: two distinct real roots`:(D===0?`D=0: one repeated real root`:`D=${D} < 0: no real roots`);ctx.clearRect(0,0,can.width,can.height);ctx.strokeStyle='#e2e8f0';for(let i=-10;i<=10;i++){ctx.beginPath();ctx.moveTo(sx(i),0);ctx.lineTo(sx(i),can.height);ctx.stroke()}for(let j=-20;j<=20;j+=5){ctx.beginPath();ctx.moveTo(0,sy(j));ctx.lineTo(can.width,sy(j));ctx.stroke()}ctx.strokeStyle='#111827';ctx.beginPath();ctx.moveTo(0,sy(0));ctx.lineTo(can.width,sy(0));ctx.stroke();ctx.beginPath();ctx.moveTo(sx(0),0);ctx.lineTo(sx(0),can.height);ctx.stroke();ctx.strokeStyle='#2563eb';ctx.lineWidth=3;ctx.beginPath();for(let px=0;px<=can.width;px++){let x=-10+px/can.width*20,y=f(x,A,B,C);if(px==0)ctx.moveTo(px,sy(y));else ctx.lineTo(px,sy(y))}ctx.stroke();if(D>=0){ctx.fillStyle='#dc2626';[(-B-Math.sqrt(D))/(2*A),(-B+Math.sqrt(D))/(2*A)].forEach(r=>{ctx.beginPath();ctx.arc(sx(r),sy(0),6,0,7);ctx.fill()})}}[a,b,c].forEach(e=>e.oninput=draw);draw();</script>
</body></html>
