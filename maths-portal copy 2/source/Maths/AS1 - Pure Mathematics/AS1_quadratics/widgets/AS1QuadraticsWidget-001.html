<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AS1 Quadratics Method Classifier</title>
<style>body{font-family:Arial,sans-serif;margin:0;background:#f8fafc;color:#0f172a}.wrap{max-width:1000px;margin:24px auto;padding:20px}.head{background:#111827;color:white;border-radius:18px;padding:22px;margin-bottom:18px}.card{background:white;border:2px solid #cbd5e1;border-radius:18px;padding:18px;box-shadow:0 8px 20px rgba(15,23,42,.08)}button,select,input{font-size:1rem;padding:10px;border-radius:10px;border:2px solid #cbd5e1;margin:6px 0}button{background:#2563eb;color:white;font-weight:700;cursor:pointer}canvas{width:100%;height:460px;border:2px solid #cbd5e1;border-radius:16px;background:white}.grid{display:grid;grid-template-columns:340px 1fr;gap:18px}.result{background:#f1f5f9;border-radius:12px;padding:12px;margin-top:10px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body>
<main class="wrap"><section class="head"><h1>AS1 Quadratics Method Classifier</h1><p>Choose the best first method for each quadratic.</p></section><section class="card"><h2 id="eq"></h2><select id="q"></select><select id="m"><option value="">Choose method</option><option value="factorise">Factorise</option><option value="sqrt">Square root both sides</option><option value="substitution">Substitution / disguised quadratic</option><option value="formula">Quadratic formula</option><option value="complete">Complete the square</option><option value="check">Check after squaring</option></select><button onclick="check()">Check</button><button onclick="nextQ()">Next</button><div id="out" class="result">Select a method.</div></section></main><script>
const qs=[['x²+5x=6','factorise','Move all terms to one side: x²+5x−6=0, then factorise.'],['(x−1)²=5','sqrt','The unknown appears once, so square root both sides and use ±.'],['x−6√x+8=0','substitution','Let y=√x, giving y²−6y+8=0.'],['3x²−18x+4=0, solve by completing the square','complete','The question demands completing the square.'],['2x²+7x−11=0','formula','This is not a neat factorisation, so use the quadratic formula.'],['√(x+3)=x−3','check','Squaring both sides can introduce false solutions, so check.']];
const q=document.getElementById('q'),eq=document.getElementById('eq'),m=document.getElementById('m'),out=document.getElementById('out');qs.forEach((x,i)=>q.add(new Option(x[0],i)));function show(){eq.textContent=qs[q.value][0];out.textContent='Choose the best method.';m.value=''}function check(){let a=qs[q.value];out.innerHTML=m.value===a[1]?'<b>Correct.</b> '+a[2]:'<b>Try again.</b> Best method: '+a[1]+'. '+a[2]}function nextQ(){q.value=(+q.value+1)%qs.length;show()}q.onchange=show;show();</script>
</body></html>
