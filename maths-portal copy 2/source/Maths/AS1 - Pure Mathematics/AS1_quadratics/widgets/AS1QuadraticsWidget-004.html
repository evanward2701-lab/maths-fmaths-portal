<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AS1 Quadratics Projectile Model Explorer</title>
<style>body{font-family:Arial,sans-serif;margin:0;background:#f8fafc;color:#0f172a}.wrap{max-width:1000px;margin:24px auto;padding:20px}.head{background:#111827;color:white;border-radius:18px;padding:22px;margin-bottom:18px}.card{background:white;border:2px solid #cbd5e1;border-radius:18px;padding:18px;box-shadow:0 8px 20px rgba(15,23,42,.08)}button,select,input{font-size:1rem;padding:10px;border-radius:10px;border:2px solid #cbd5e1;margin:6px 0}button{background:#2563eb;color:white;font-weight:700;cursor:pointer}canvas{width:100%;height:460px;border:2px solid #cbd5e1;border-radius:16px;background:white}.grid{display:grid;grid-template-columns:340px 1fr;gap:18px}.result{background:#f1f5f9;border-radius:12px;padding:12px;margin-top:10px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body>
<main class="wrap"><section class="head"><h1>Projectile Quadratic Model Explorer</h1><p>Model: h(t) = h₀ + ut − gt², with t ≥ 0.</p></section><section class="grid"><div class="card"><p><b id="eq"></b></p><label>h₀ <span id="hv"></span></label><input id="h" type="range" min="0" max="25" step="0.25" value="12.25"><label>u <span id="uv"></span></label><input id="u" type="range" min="0" max="30" step="0.1" value="14.7"><label>g <span id="gv"></span></label><input id="g" type="range" min="1" max="9.8" step="0.1" value="4.9"><div id="out" class="result"></div></div><div class="card"><canvas id="can" width="720" height="460"></canvas></div></section></main><script>
const can=document.getElementById('can'),ctx=can.getContext('2d'),h=document.getElementById('h'),u=document.getElementById('u'),g=document.getElementById('g');function fmt(x){return Math.round(x*1000)/1000}function height(t,H,U,G){return H+U*t-G*t*t}function draw(){let H=+h.value,U=+u.value,G=+g.value;hv.textContent=fmt(H);uv.textContent=fmt(U);gv.textContent=fmt(G);eq.textContent=`h(t)=${fmt(H)}+${fmt(U)}t−${fmt(G)}t²`;let tm=U/(2*G),hm=height(tm,H,U,G),D=U*U+4*G*H,tg=(U+Math.sqrt(D))/(2*G);out.innerHTML=`Initial height: <b>${fmt(H)} m</b><br>Maximum: <b>${fmt(hm)} m</b> at <b>${fmt(tm)} s</b><br>Hits ground at <b>${fmt(tg)} s</b><br>Completed square: h(t)=${fmt(hm)}−${fmt(G)}(t−${fmt(tm)})²`;let xmax=Math.max(6,tg+1),ymax=Math.max(10,hm+5);function sx(x){return x/xmax*can.width}function sy(y){return can.height-y/ymax*can.height}ctx.clearRect(0,0,can.width,can.height);ctx.strokeStyle='#e2e8f0';for(let i=0;i<=xmax;i++){ctx.beginPath();ctx.moveTo(sx(i),0);ctx.lineTo(sx(i),can.height);ctx.stroke()}for(let j=0;j<=ymax;j+=5){ctx.beginPath();ctx.moveTo(0,sy(j));ctx.lineTo(can.width,sy(j));ctx.stroke()}ctx.strokeStyle='#111827';ctx.beginPath();ctx.moveTo(0,sy(0));ctx.lineTo(can.width,sy(0));ctx.stroke();ctx.beginPath();ctx.moveTo(sx(0),sy(0));ctx.lineTo(sx(0),0);ctx.stroke();ctx.strokeStyle='#2563eb';ctx.lineWidth=3;ctx.beginPath();for(let px=0;px<=can.width;px++){let t=px/can.width*xmax,y=height(t,H,U,G);if(px==0)ctx.moveTo(px,sy(y));else ctx.lineTo(px,sy(y))}ctx.stroke();function dot(x,y,col){ctx.fillStyle=col;ctx.beginPath();ctx.arc(sx(x),sy(y),6,0,7);ctx.fill()}dot(0,H,'#15803d');dot(tm,hm,'#7c3aed');dot(tg,0,'#dc2626')}[h,u,g].forEach(e=>e.oninput=draw);draw();</script>
</body></html>
