<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Integer Forms for Proof</title><desc id="desc">A reference diagram showing forms for even integers, odd integers, consecutive integers, consecutive odd integers, factors, and modulo 3 cases.</desc>
  <defs><filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.16"/></filter></defs>
  <style>.title{font:700 32px Arial,sans-serif;fill:#111}.subtitle{font:400 16px Arial,sans-serif;fill:#444}.card{fill:#fff;stroke:#222;stroke-width:2;rx:18;filter:url(#softShadow)}.head{fill:#111;rx:18}.headText{font:700 19px Arial,sans-serif;fill:#fff}.formula{font:700 24px Arial,sans-serif;fill:#111}.text{font:400 16px Arial,sans-serif;fill:#222}.note{font:400 14px Arial,sans-serif;fill:#444}.chip{fill:#f2f2f2;stroke:#333;stroke-width:1.5;rx:12}</style>
  <text x="60" y="55" class="title">Integer Forms for Proof</text><text x="60" y="84" class="subtitle">These are the little algebra costumes integers wear when they enter a proof.</text>
  <rect x="60" y="125" width="320" height="170" class="card"/><rect x="60" y="125" width="320" height="48" class="head"/><text x="220" y="156" text-anchor="middle" class="headText">Even integer</text><text x="220" y="220" text-anchor="middle" class="formula">2k</text><text x="220" y="254" text-anchor="middle" class="text">where k is an integer</text>
  <rect x="440" y="125" width="320" height="170" class="card"/><rect x="440" y="125" width="320" height="48" class="head"/><text x="600" y="156" text-anchor="middle" class="headText">Odd integer</text><text x="600" y="214" text-anchor="middle" class="formula">2k + 1</text><text x="600" y="246" text-anchor="middle" class="formula">or 2k - 1</text><text x="600" y="274" text-anchor="middle" class="text">where k is an integer</text>
  <rect x="820" y="125" width="320" height="170" class="card"/><rect x="820" y="125" width="320" height="48" class="head"/><text x="980" y="156" text-anchor="middle" class="headText">Factor statement</text><text x="980" y="214" text-anchor="middle" class="text">a is a factor of b</text><text x="980" y="250" text-anchor="middle" class="formula">b = na</text><text x="980" y="278" text-anchor="middle" class="text">where n is an integer</text>
  <rect x="60" y="345" width="510" height="180" class="card"/><rect x="60" y="345" width="510" height="48" class="head"/><text x="315" y="376" text-anchor="middle" class="headText">Consecutive integers</text><text x="315" y="435" text-anchor="middle" class="formula">n, n + 1</text><text x="315" y="482" text-anchor="middle" class="formula">x, x + 1, x + 2</text>
  <rect x="630" y="345" width="510" height="180" class="card"/><rect x="630" y="345" width="510" height="48" class="head"/><text x="885" y="376" text-anchor="middle" class="headText">Consecutive odd integers</text><text x="885" y="435" text-anchor="middle" class="formula">2n - 1, 2n + 1</text><text x="885" y="482" text-anchor="middle" class="formula">2n + 1, 2n + 3</text>
  <rect x="60" y="575" width="1080" height="165" class="card"/><rect x="60" y="575" width="1080" height="48" class="head"/><text x="600" y="606" text-anchor="middle" class="headText">Useful exhaustion split for multiples of 3</text><rect x="170" y="650" width="230" height="55" class="chip"/><text x="285" y="685" text-anchor="middle" class="formula">3n</text><rect x="485" y="650" width="230" height="55" class="chip"/><text x="600" y="685" text-anchor="middle" class="formula">3n + 1</text><rect x="800" y="650" width="230" height="55" class="chip"/><text x="915" y="685" text-anchor="middle" class="formula">3n - 1</text><text x="600" y="770" text-anchor="middle" class="note">Together these cover every integer: multiple of 3, one more than a multiple of 3, or one less than a multiple of 3.</text>
</svg>
