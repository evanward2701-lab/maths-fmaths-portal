<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Proof Method Decision Tree</title>
  <desc id="desc">A decision tree for choosing proof by deduction, proof by exhaustion, or disproof by counterexample. Proof by contradiction is labelled as A2 future context.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#222"/></marker><filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.18"/></filter></defs>
  <style>.title{font:700 32px Arial,sans-serif;fill:#111}.subtitle{font:400 16px Arial,sans-serif;fill:#444}.box{fill:#fff;stroke:#222;stroke-width:2;rx:18;filter:url(#softShadow)}.decision{fill:#f7f7f7;stroke:#222;stroke-width:2;rx:18;filter:url(#softShadow)}.future{fill:#eee;stroke:#777;stroke-width:2;stroke-dasharray:8 6;rx:18}.label{font:600 18px Arial,sans-serif;fill:#111}.small{font:400 15px Arial,sans-serif;fill:#222}.tiny{font:400 13px Arial,sans-serif;fill:#444}.arrow{stroke:#222;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.yesno{font:700 14px Arial,sans-serif;fill:#111}</style>
  <text x="60" y="55" class="title">Choosing a Proof Method</text><text x="60" y="84" class="subtitle">Read the command word first. Then choose the proof route that covers the logic without assuming the conclusion.</text>
  <rect x="460" y="120" width="280" height="76" class="box"/><text x="600" y="150" text-anchor="middle" class="label">Question wording</text><text x="600" y="176" text-anchor="middle" class="small">What is it asking you to do?</text>
  <rect x="405" y="250" width="390" height="90" class="decision"/><text x="600" y="282" text-anchor="middle" class="label">Prove a statement is true?</text><text x="600" y="309" text-anchor="middle" class="small">Example: “Prove that...”</text><path d="M600 196 L600 250" class="arrow"/>
  <rect x="70" y="410" width="300" height="125" class="box"/><text x="220" y="445" text-anchor="middle" class="label">Proof by deduction</text><text x="220" y="474" text-anchor="middle" class="small">Start from known facts.</text><text x="220" y="499" text-anchor="middle" class="small">Use algebra step by step.</text><text x="220" y="524" text-anchor="middle" class="small">End at the required conclusion.</text>
  <rect x="450" y="410" width="300" height="125" class="box"/><text x="600" y="445" text-anchor="middle" class="label">Proof by exhaustion</text><text x="600" y="474" text-anchor="middle" class="small">Split into all possible cases.</text><text x="600" y="499" text-anchor="middle" class="small">Prove each case.</text><text x="600" y="524" text-anchor="middle" class="small">Then conclude for all values.</text>
  <rect x="830" y="410" width="300" height="125" class="box"/><text x="980" y="445" text-anchor="middle" class="label">Counterexample</text><text x="980" y="474" text-anchor="middle" class="small">Used for “disprove”.</text><text x="980" y="499" text-anchor="middle" class="small">Find one legal value</text><text x="980" y="524" text-anchor="middle" class="small">that breaks the claim.</text>
  <path d="M455 340 C370 365, 295 380, 220 410" class="arrow"/><path d="M600 340 L600 410" class="arrow"/><path d="M745 340 C835 365, 920 380, 980 410" class="arrow"/><text x="347" y="377" class="yesno">direct algebra?</text><text x="621" y="381" class="yesno">all cases?</text><text x="828" y="377" class="yesno">disprove?</text>
  <rect x="390" y="610" width="420" height="82" class="future"/><text x="600" y="642" text-anchor="middle" class="label">Proof by contradiction</text><text x="600" y="668" text-anchor="middle" class="small">A2 / future context only in this AS1 lesson</text><path d="M600 535 L600 610" class="arrow"/>
  <text x="60" y="720" class="tiny">Exam warning: do not begin by assuming the thing you are trying to prove.</text>
</svg>
