<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Consecutive Integer Right-Triangle Proof</title><desc id="desc">A right-angled triangle with side lengths x, x plus 1 and x plus 2, followed by the Pythagoras proof that x equals 3.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#222"/></marker><filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.16"/></filter></defs><style>.title{font:700 32px Arial,sans-serif;fill:#111}.subtitle{font:400 16px Arial,sans-serif;fill:#444}.tri{fill:#f9f9f9;stroke:#111;stroke-width:4}.right{fill:none;stroke:#111;stroke-width:3}.label{font:700 24px Arial,sans-serif;fill:#111}.small{font:400 16px Arial,sans-serif;fill:#222}.box{fill:#fff;stroke:#222;stroke-width:2;rx:18;filter:url(#softShadow)}.warn{fill:#f1f1f1;stroke:#777;stroke-width:2;stroke-dasharray:8 6;rx:18}.stepTitle{font:700 18px Arial,sans-serif;fill:#111}.math{font:600 17px Arial,sans-serif;fill:#111}.arrow{stroke:#222;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><text x="60" y="55" class="title">Consecutive Integer Sides of a Right-Angled Triangle</text><text x="60" y="84" class="subtitle">Correct proof route: start with general consecutive sides, not with 3, 4 and 5.</text><rect x="60" y="120" width="430" height="90" class="warn"/><text x="275" y="152" text-anchor="middle" class="stepTitle">Do not start here</text><text x="275" y="181" text-anchor="middle" class="small">Checking 3² + 4² = 5² only verifies one case.</text><polygon points="120,570 120,300 430,570" class="tri"/><path d="M120 540 L150 540 L150 570" class="right"/><text x="84" y="445" class="label">x</text><text x="255" y="610" text-anchor="middle" class="label">x + 1</text><text x="300" y="420" transform="rotate(41 300 420)" class="label">x + 2</text><text x="118" y="285" class="small">right angle</text><text x="300" y="355" class="small">hypotenuse is longest</text><rect x="550" y="120" width="570" height="105" class="box"/><text x="835" y="151" text-anchor="middle" class="stepTitle">1. Let the side lengths be general</text><text x="835" y="183" text-anchor="middle" class="math">x, x + 1, x + 2</text><text x="835" y="207" text-anchor="middle" class="small">The longest side, x + 2, is the hypotenuse.</text><rect x="550" y="270" width="570" height="105" class="box"/><text x="835" y="301" text-anchor="middle" class="stepTitle">2. Use Pythagoras</text><text x="835" y="334" text-anchor="middle" class="math">x² + (x + 1)² = (x + 2)²</text><rect x="550" y="420" width="570" height="105" class="box"/><text x="835" y="451" text-anchor="middle" class="stepTitle">3. Expand and rearrange</text><text x="835" y="484" text-anchor="middle" class="math">2x² + 2x + 1 = x² + 4x + 4</text><text x="835" y="510" text-anchor="middle" class="math">x² - 2x - 3 = 0</text><rect x="550" y="570" width="570" height="105" class="box"/><text x="835" y="601" text-anchor="middle" class="stepTitle">4. Factorise and reject negative length</text><text x="835" y="634" text-anchor="middle" class="math">(x - 3)(x + 1) = 0</text><text x="835" y="660" text-anchor="middle" class="math">x = 3 or x = -1, so x = 3</text><path d="M835 225 L835 270" class="arrow"/><path d="M835 375 L835 420" class="arrow"/><path d="M835 525 L835 570" class="arrow"/><text x="600" y="725" class="small">Therefore the side lengths are 3, 4 and 5.</text></svg>
