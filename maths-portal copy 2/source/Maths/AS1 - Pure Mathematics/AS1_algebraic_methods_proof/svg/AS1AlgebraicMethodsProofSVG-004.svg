<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Chapter 7b Proof Type Overview Cards</title><desc id="desc">Four proof type cards: proof by deduction, proof by exhaustion, disproof by counterexample, and proof by contradiction labelled as A2 future context.</desc><defs><filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.18"/></filter></defs><style>.title{font:700 34px Georgia,serif;fill:#111;text-decoration:underline}.card{fill:#fff;stroke:#222;stroke-width:2;rx:6;filter:url(#softShadow)}.head{fill:#111;rx:6}.headGrey{fill:#777;rx:6}.headText{font:700 20px Arial,sans-serif;fill:#fff}.bodyText{font:400 20px Arial,sans-serif;fill:#111}.small{font:400 15px Arial,sans-serif;fill:#444}.tag{fill:#f1f1f1;stroke:#777;stroke-width:1.5;stroke-dasharray:6 5;rx:12}.tagText{font:700 14px Arial,sans-serif;fill:#333}</style><text x="80" y="80" class="title">Chapter 7b: Algebraic Methods, Proof</text><rect x="105" y="160" width="430" height="160" class="card"/><rect x="105" y="160" width="430" height="50" class="head"/><text x="130" y="192" class="headText">a) Proof by deduction</text><text x="130" y="250" class="bodyText">Prove that the product of two</text><text x="130" y="280" class="bodyText">odd numbers is odd.</text><rect x="665" y="160" width="430" height="160" class="card"/><rect x="665" y="160" width="430" height="50" class="head"/><text x="690" y="192" class="headText">b) Proof by exhaustion</text><text x="690" y="250" class="bodyText">Prove that n² + n is even for</text><text x="690" y="280" class="bodyText">all integers n.</text><rect x="105" y="430" width="430" height="170" class="card"/><rect x="105" y="430" width="430" height="50" class="head"/><text x="130" y="462" class="headText">c) Disproof by counterexample</text><text x="130" y="520" class="bodyText">Disprove the statement:</text><text x="130" y="550" class="bodyText">“n² - n + 41 is prime for all</text><text x="130" y="580" class="bodyText">integers n.”</text><rect x="665" y="430" width="430" height="170" class="card"/><rect x="665" y="430" width="430" height="50" class="headGrey"/><text x="690" y="462" class="headText">d) Proof by contradiction</text><text x="690" y="520" class="bodyText">Prove that the square root of 2</text><text x="690" y="550" class="bodyText">is irrational.</text><rect x="875" y="575" width="180" height="36" class="tag"/><text x="965" y="599" text-anchor="middle" class="tagText">A2 / future context</text><text x="80" y="700" class="small">AS1 core for this lesson: deduction, exhaustion and counterexample. Proof by contradiction is shown only as future context.</text></svg>
