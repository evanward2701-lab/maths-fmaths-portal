Source: P1-Chp9-TrigonometricRatios.pdf pp.17-18; transcript ambiguous case explanation
Related section: The Ambiguous Case
Purpose: Explore why the sine rule can give two possible angles. -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ambiguous Sine Rule Explorer</title>
<style>body{font-family:Arial,sans-serif;margin:0;padding:24px;background:#fff7ed;color:#172033}.wrap{max-width:900px;margin:auto;background:white;border-radius:20px;box-shadow:0 16px 40px #0002;overflow:hidden}header{background:#172033;color:white;padding:24px}.content{padding:24px}canvas{width:100%;max-width:760px;height:330px;border:1px solid #d8deea;border-radius:16px}input{width:100%;accent-color:#2563eb}.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{border:1px solid #d8deea;border-radius:14px;padding:16px;background:#f8fafc}.angle{font-size:2rem;color:#1d4ed8;font-weight:800}@media(max-width:700px){.cards{grid-template-columns:1fr}}</style></head>
<body><div class="wrap"><header><h1>Ambiguous Sine Rule Explorer</h1><p>Move the sine value to see the calculator angle and the second possible angle.</p></header><div class="content"><label><strong>sin θ value</strong><input id="s" type="range" min="0.05" max="0.99" step="0.0001" value="0.9262"></label><p id="read"></p><canvas id="c" width="760" height="330"></canvas><div class="cards"><div class="card"><h2>Calculator angle</h2><div class="angle" id="a1"></div></div><div class="card"><h2>Second possible angle</h2><div class="angle" id="a2"></div></div></div><p><strong>Key fact:</strong> sin θ = sin(180° − θ).</p></div></div>
<script>const s=document.getElementById('s'),read=document.getElementById('read'),a1=document.getElementById('a1'),a2=document.getElementById('a2'),cv=document.getElementById('c'),ctx=cv.getContext('2d');function upd(){let val=+s.value,t1=Math.asin(val)*180/Math.PI,t2=180-t1;read.textContent='sin θ = '+val.toFixed(4);a1.textContent=t1.toFixed(1)+'°';a2.textContent=t2.toFixed(1)+'°';draw(val,t1,t2)}function draw(v,t1,t2){let w=cv.width,h=cv.height,L=55,R=w-30,T=30,B=h-55,M=(T+B)/2,A=(B-T)/2;ctx.clearRect(0,0,w,h);ctx.fillStyle='white';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#d8deea';ctx.lineWidth=1;for(let d=0;d<=180;d+=30){let x=L+d/180*(R-L);ctx.beginPath();ctx.moveTo(x,T);ctx.lineTo(x,B);ctx.stroke()}ctx.strokeStyle='#172033';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(L,M);ctx.lineTo(R,M);ctx.stroke();ctx.beginPath();ctx.moveTo(L,T);ctx.lineTo(L,B);ctx.stroke();ctx.strokeStyle='#2563eb';ctx.lineWidth=4;ctx.beginPath();for(let d=0;d<=180;d++){let x=L+d/180*(R-L),y=M-Math.sin(d*Math.PI/180)*A;if(d===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke();let y=M-v*A;ctx.setLineDash([7,5]);ctx.strokeStyle='#b45309';ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(R,y);ctx.stroke();ctx.setLineDash([]);[t1,t2].forEach((t,i)=>{let x=L+t/180*(R-L);ctx.strokeStyle=i?'#b91c1c':'#0f766e';ctx.beginPath();ctx.moveTo(x,M);ctx.lineTo(x,y);ctx.stroke();ctx.fillStyle=ctx.strokeStyle;ctx.beginPath();ctx.arc(x,y,6,0,7);ctx.fill();ctx.fillText(t.toFixed(1)+'°',x-18,M+28+i*20)});ctx.fillStyle='#172033';[0,30,60,90,120,150,180].forEach(d=>{let x=L+d/180*(R-L);ctx.fillText(d+'°',x-12,B+24)})}s.oninput=upd;upd();</script></body></html>
