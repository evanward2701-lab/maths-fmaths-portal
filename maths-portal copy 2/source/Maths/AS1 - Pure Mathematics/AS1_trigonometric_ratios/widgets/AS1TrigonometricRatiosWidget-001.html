Source: P1-Chp9-TrigonometricRatios.pdf p.6; transcript method-selection discussion

Purpose: Interactive method selector for trigonometric triangle problems. -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Triangle Method Selector</title>
<style>body{font-family:Arial,sans-serif;margin:0;padding:24px;background:#eef4ff;color:#172033}.wrap{max-width:900px;margin:auto;background:white;border-radius:20px;box-shadow:0 16px 40px #0002;overflow:hidden}header{background:#172033;color:white;padding:24px}main{display:grid;grid-template-columns:1fr 1fr}.panel{padding:22px}.controls{background:#f6f8fc;border-right:1px solid #d8deea}.q{background:white;border:1px solid #d8deea;border-radius:14px;padding:14px;margin-bottom:12px}label{display:block;margin:8px 0}.result{border:2px solid #2563eb;background:#eff6ff;border-radius:16px;padding:18px}.method{font-size:2rem;font-weight:800;color:#1d4ed8}.formula{font-size:1.15rem;background:white;border-radius:12px;padding:12px;margin-top:12px}@media(max-width:760px){main{grid-template-columns:1fr}.controls{border-right:0;border-bottom:1px solid #d8deea}}</style></head>
<body><div class="wrap"><header><h1>Triangle Method Selector</h1><p>Choose the information in the triangle and the widget suggests the likely method.</p></header><main><section class="panel controls">
<div class="q"><strong>Right angle?</strong><label><input name="right" type="radio" value="yes"> yes</label><label><input name="right" type="radio" value="no" checked> no</label></div>
<div class="q"><strong>Finding area?</strong><label><input name="area" type="radio" value="yes"> yes</label><label><input name="area" type="radio" value="no" checked> no</label></div>
<div class="q"><strong>Two opposite angle-side pairs?</strong><label><input name="pairs" type="radio" value="yes"> yes</label><label><input name="pairs" type="radio" value="no" checked> no</label></div>
<div class="q"><strong>Three sides involved?</strong><label><input name="three" type="radio" value="yes" checked> yes</label><label><input name="three" type="radio" value="no"> no</label></div>
<div class="q"><strong>Two sides and included angle?</strong><label><input name="included" type="radio" value="yes"> yes</label><label><input name="included" type="radio" value="no" checked> no</label></div>
</section><section class="panel"><div class="result"><div>Suggested method</div><div id="method" class="method"></div><div id="formula" class="formula"></div><p id="why"></p></div></section></main></div>
<script>const $=s=>document.querySelector(s);function v(n){return document.querySelector('input[name="'+n+'"]:checked').value}function update(){let m,f,w;if(v('right')==='yes'){m='Right-angled trigonometry';f='sin θ=opp/hyp, cos θ=adj/hyp, tan θ=opp/adj';w='Use only when a right angle is present.'}else if(v('area')==='yes'&&v('included')==='yes'){m='Area formula';f='Area = 1/2 ab sin C';w='C must be the included angle.'}else if(v('pairs')==='yes'){m='Sine Rule';f='a/sin A = b/sin B';w='For missing angles, check the ambiguous case.'}else if(v('three')==='yes'||v('included')==='yes'){m='Cosine Rule';f='a² = b² + c² − 2bc cos A';w='Remember to square root when finding a side.'}else{m='Redraw and label';f='Mark opposite pairs and included angles';w='A clean diagram usually reveals the method.'}$('#method').textContent=m;$('#formula').textContent=f;$('#why').textContent=w}document.querySelectorAll('input').forEach(i=>i.onchange=update);update();</script></body></html>
