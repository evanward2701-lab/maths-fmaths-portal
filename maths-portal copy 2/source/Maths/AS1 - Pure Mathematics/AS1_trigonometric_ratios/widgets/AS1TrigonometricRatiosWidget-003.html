<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trig Graph Transformer</title>
<style>body{font-family:Arial,sans-serif;margin:0;padding:24px;background:#eef4ff;color:#172033}.wrap{max-width:1000px;margin:auto;background:white;border-radius:20px;box-shadow:0 16px 40px #0002;overflow:hidden}header{background:#172033;color:white;padding:24px}main{display:grid;grid-template-columns:320px 1fr}.controls{padding:20px;background:#f6f8fc;border-right:1px solid #d8deea}.visual{padding:20px}.ctrl{background:white;border:1px solid #d8deea;border-radius:14px;padding:14px;margin-bottom:12px}label{font-weight:700;display:block;margin-bottom:8px}input,select{width:100%;accent-color:#2563eb}canvas{width:100%;height:420px;border:1px solid #d8deea;border-radius:16px}.card{border:1px solid #d8deea;background:#f8fafc;border-radius:14px;padding:14px;margin-top:12px}.formula{font-size:1.4rem;font-weight:800;color:#1d4ed8}@media(max-width:820px){main{grid-template-columns:1fr}.controls{border-right:0;border-bottom:1px solid #d8deea}}</style></head>
<body><div class="wrap"><header><h1>Trig Graph Transformer</h1><p>Explore sine, cosine, tangent and simple transformations.</p></header><main><section class="controls"><div class="ctrl"><label>Function</label><select id="fn"><option value="sin">sin</option><option value="cos">cos</option><option value="tan">tan</option></select></div><div class="ctrl"><label>a: vertical multiplier</label><input id="a" type="range" min="-4" max="4" step="0.5" value="1"><span id="ao"></span></div><div class="ctrl"><label>b: inside multiplier</label><input id="b" type="range" min="0.25" max="4" step="0.25" value="1"><span id="bo"></span></div><div class="ctrl"><label>c: inside shift</label><input id="csh" type="range" min="-180" max="180" step="15" value="0"><span id="co"></span></div><div class="ctrl"><label>d: vertical shift</label><input id="d" type="range" min="-4" max="4" step="0.5" value="0"><span id="do"></span></div></section><section class="visual"><canvas id="cv" width="700" height="420"></canvas><div class="card"><div class="formula" id="formula"></div><p id="features"></p></div></section></main></div>
<script>const el=id=>document.getElementById(id),cv=el('cv'),ctx=cv.getContext('2d');function tidy(n){return (+n).toFixed(2).replace(/\.00$/,'').replace(/\.50$/,'.5')}function deg(d){return d*Math.PI/180}function val(fn,x){if(fn==='sin')return Math.sin(deg(x));if(fn==='cos')return Math.cos(deg(x));return Math.tan(deg(x))}function draw(){let fn=el('fn').value,a=+el('a').value,b=+el('b').value,c=+el('csh').value,d=+el('d').value;el('ao').textContent='a='+tidy(a);el('bo').textContent='b='+tidy(b);el('co').textContent='c='+tidy(c)+'°';el('do').textContent='d='+tidy(d);let W=cv.width,H=cv.height,L=55,R=W-25,T=25,B=H-55,M=(T+B)/2,S=32;ctx.clearRect(0,0,W,H);ctx.fillStyle='white';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#d8deea';ctx.lineWidth=1;for(let x=0;x<=360;x+=30){let X=L+x/360*(R-L);ctx.beginPath();ctx.moveTo(X,T);ctx.lineTo(X,B);ctx.stroke()}for(let y=-5;y<=5;y++){let Y=M-y*S;ctx.beginPath();ctx.moveTo(L,Y);ctx.lineTo(R,Y);ctx.stroke()}ctx.strokeStyle='#172033';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(L,M);ctx.lineTo(R,M);ctx.stroke();ctx.beginPath();ctx.moveTo(L,T);ctx.lineTo(L,B);ctx.stroke();ctx.strokeStyle='#2563eb';ctx.lineWidth=4;ctx.beginPath();let down=false;for(let x=0;x<=360;x+=0.5){let raw=val(fn,b*x+c),y=a*raw+d,X=L+x/360*(R-L),Y=M-y*S;if(Math.abs(raw)>20||Y<T-40||Y>B+40){down=false;continue}if(!down){ctx.moveTo(X,Y);down=true}else ctx.lineTo(X,Y)}ctx.stroke();ctx.fillStyle='#172033';[0,90,180,270,360].forEach(x=>{let X=L+x/360*(R-L);ctx.fillText(x+'°',X-15,B+25)});let op=c>=0?'+ '+tidy(c)+'°':'− '+tidy(-c)+'°';el('formula').textContent='y = '+tidy(a)+fn+'('+tidy(b)+'x '+op+') '+(d>=0?'+ ':'− ')+tidy(Math.abs(d));let base=fn==='tan'?180:360;el('features').textContent='Base period '+base+'°. Current period '+tidy(base/b)+'°. Outside changes affect y-values; inside changes affect x-values.'}['fn','a','b','csh','d'].forEach(id=>{el(id).oninput=draw;el(id).onchange=draw});draw();</script></body></html>
