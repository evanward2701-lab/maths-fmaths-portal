<!-- Asset generated for AS1 Trigonometric Ratios lesson pack. -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">Choosing the correct method</title>
<desc id="desc">A rule-selection flowchart for trigonometry.</desc>
<rect width="900" height="560" fill="#ffffff"/>
<text x="30" y="45" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#172033">Choosing the correct method</text>

<rect x="330" y="80" width="240" height="60" rx="12" fill="#eff6ff" stroke="#2563eb"/>
<text x="450" y="118" text-anchor="middle" font-family="Arial" font-size="19">Triangle problem</text>
<line x1="450" y1="140" x2="450" y2="185" stroke="#172033" stroke-width="2" marker-end="url(#a)"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#172033"/></marker></defs>
<rect x="300" y="185" width="300" height="65" rx="12" fill="#fff7ed" stroke="#f59e0b"/>
<text x="450" y="212" text-anchor="middle" font-family="Arial" font-size="18">Right angle?</text>
<text x="450" y="237" text-anchor="middle" font-family="Arial" font-size="16">Use SOHCAHTOA if yes</text>
<rect x="80" y="315" width="210" height="75" rx="12" fill="#ecfdf5" stroke="#0f766e"/>
<text x="185" y="345" text-anchor="middle" font-family="Arial" font-size="17">Opposite pairs?</text><text x="185" y="370" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Sine rule</text>
<rect x="345" y="315" width="210" height="75" rx="12" fill="#fef2f2" stroke="#b91c1c"/>
<text x="450" y="345" text-anchor="middle" font-family="Arial" font-size="17">Three sides?</text><text x="450" y="370" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Cosine rule</text>
<rect x="610" y="315" width="220" height="75" rx="12" fill="#f5f3ff" stroke="#6d28d9"/>
<text x="720" y="345" text-anchor="middle" font-family="Arial" font-size="17">Area?</text><text x="720" y="370" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">1/2 ab sin C</text>

</svg>
