<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Rate of change as a derivative</title>
  <desc id="desc">A filling container and a graph of volume against time, labelled dV over dt.</desc>
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="40" y="45" font-family="Arial" font-size="28" font-weight="700">Gradient as a Rate of Change</text>
  <g transform="translate(90,95)" font-family="Arial">
    <text x="0" y="0" font-size="21" font-weight="700">Volume increasing with time</text>
    <path d="M60 40 L190 40 L170 250 L80 250 Z" fill="#f9f9f9" stroke="#333" stroke-width="3"/>
    <path d="M80 170 L170 170 L160 250 L90 250 Z" fill="#8ecae6" stroke="#1f77b4" stroke-width="2"/>
    <line x1="125" y1="20" x2="125" y2="65" stroke="#1f77b4" stroke-width="5"/>
    <polygon points="125,70 115,55 135,55" fill="#1f77b4"/>
    <text x="35" y="285" font-size="20">V = volume</text>
    <text x="35" y="315" font-size="20">t = time</text>
  </g>
  <g transform="translate(445,95)" font-family="Arial">
    <text x="0" y="0" font-size="21" font-weight="700">Graph of V against t</text>
    <rect x="0" y="30" width="360" height="250" fill="#fafafa" stroke="#333"/>
    <line x1="45" y1="245" x2="330" y2="245" stroke="#111" stroke-width="2"/>
    <line x1="45" y1="245" x2="45" y2="55" stroke="#111" stroke-width="2"/>
    <text x="328" y="272" font-size="18">t</text>
    <text x="18" y="62" font-size="18">V</text>
    <line x1="65" y1="220" x2="300" y2="85" stroke="#1f77b4" stroke-width="4"/>
    <circle cx="190" cy="148" r="6" fill="#111"/>
    <line x1="155" y1="168" x2="230" y2="125" stroke="#222" stroke-width="3"/>
    <text x="205" y="155" font-size="18">gradient = dV/dt</text>
    <text x="88" y="315" font-size="23" font-weight="700">dV/dt = rate volume changes with time</text>
  </g>
</svg>