<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Gradient function for y equals x squared</title>
  <desc id="desc">A parabola y=x squared with tangent gradient values at x from minus 3 to 3 and the resulting gradient function 2x.</desc>
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="40" y="45" font-family="Arial, sans-serif" font-size="28" font-weight="700">Gradient Function: y = x²</text>
  <g transform="translate(90,70)">
    <rect x="0" y="0" width="520" height="360" fill="#f9f9f9" stroke="#333" stroke-width="1"/>
    <g stroke="#ddd" stroke-width="1">
      <line x1="0" y1="180" x2="520" y2="180"/>
      <line x1="260" y1="0" x2="260" y2="360"/>
      <line x1="86.7" y1="0" x2="86.7" y2="360"/>
      <line x1="173.3" y1="0" x2="173.3" y2="360"/>
      <line x1="346.7" y1="0" x2="346.7" y2="360"/>
      <line x1="433.3" y1="0" x2="433.3" y2="360"/>
      <line x1="0" y1="300" x2="520" y2="300"/>
      <line x1="0" y1="240" x2="520" y2="240"/>
      <line x1="0" y1="120" x2="520" y2="120"/>
      <line x1="0" y1="60" x2="520" y2="60"/>
    </g>
    <line x1="0" y1="300" x2="520" y2="300" stroke="#111" stroke-width="2"/>
    <line x1="260" y1="20" x2="260" y2="340" stroke="#111" stroke-width="2"/>
    <text x="500" y="325" font-family="Arial" font-size="16">x</text>
    <text x="270" y="35" font-family="Arial" font-size="16">y</text>
    <path d="M0 30 C70 105, 130 205, 173.3 260 C210 292, 236 300, 260 300 C284 300, 310 292, 346.7 260 C390 205, 450 105, 520 30"
          fill="none" stroke="#1f77b4" stroke-width="4"/>
    <g stroke="#222" stroke-width="3">
      <line x1="20" y1="95" x2="90" y2="15"/>
      <line x1="115" y1="245" x2="190" y2="175"/>
      <line x1="205" y1="295" x2="265" y2="265"/>
      <line x1="230" y1="300" x2="290" y2="300"/>
      <line x1="255" y1="265" x2="315" y2="295"/>
      <line x1="330" y1="175" x2="405" y2="245"/>
      <line x1="430" y1="15" x2="500" y2="95"/>
    </g>
    <g fill="#111">
      <circle cx="0" cy="30" r="5"/>
      <circle cx="86.7" cy="180" r="5"/>
      <circle cx="173.3" cy="260" r="5"/>
      <circle cx="260" cy="300" r="5"/>
      <circle cx="346.7" cy="260" r="5"/>
      <circle cx="433.3" cy="180" r="5"/>
      <circle cx="520" cy="30" r="5"/>
    </g>
    <text x="330" y="105" font-family="Arial" font-size="22" fill="#1f77b4">y = x²</text>
  </g>
  <g transform="translate(650,105)" font-family="Arial, sans-serif">
    <text x="0" y="0" font-size="20" font-weight="700">Tangent gradients</text>
    <rect x="0" y="25" width="190" height="235" fill="#fff" stroke="#333"/>
    <text x="20" y="55" font-size="16" font-weight="700">x</text>
    <text x="95" y="55" font-size="16" font-weight="700">Gradient</text>
    <g font-size="16">
      <text x="20" y="85">-3</text><text x="105" y="85">-6</text>
      <text x="20" y="112">-2</text><text x="105" y="112">-4</text>
      <text x="20" y="139">-1</text><text x="105" y="139">-2</text>
      <text x="20" y="166">0</text><text x="105" y="166">0</text>
      <text x="20" y="193">1</text><text x="105" y="193">2</text>
      <text x="20" y="220">2</text><text x="105" y="220">4</text>
      <text x="20" y="247">3</text><text x="105" y="247">6</text>
    </g>
    <text x="0" y="300" font-size="20">Gradient function:</text>
    <text x="0" y="333" font-size="28" font-weight="700">dy/dx = 2x</text>
  </g>
</svg>