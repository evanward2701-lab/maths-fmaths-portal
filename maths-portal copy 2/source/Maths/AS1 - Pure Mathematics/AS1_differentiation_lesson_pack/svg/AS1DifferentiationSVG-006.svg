<!--
Asset ID: AS1DifferentiationSVG-006
Source: CCEA AS1-DIFF-LO004 and AS1-DIFF-LO005
Related section: Core Theory 18
Purpose: Show the derivative chain from y to dy/dx to d^2y/dx^2.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Derivative chain</title>
  <desc id="desc">A diagram showing y, first derivative and second derivative for y equals x to the fourth minus 3x squared.</desc>
  <rect width="900" height="360" fill="#ffffff"/>
  <text x="40" y="45" font-family="Arial" font-size="28" font-weight="700">First Derivative and Second Derivative</text>
  <g font-family="Arial">
    <rect x="70" y="115" width="210" height="110" rx="14" fill="#f8f8f8" stroke="#333" stroke-width="2"/>
    <text x="95" y="155" font-size="22" font-weight="700">Original function</text>
    <text x="105" y="195" font-size="24">y = x⁴ - 3x²</text>
    <line x1="300" y1="170" x2="400" y2="170" stroke="#111" stroke-width="3"/>
    <polygon points="400,170 382,160 382,180" fill="#111"/>
    <text x="315" y="150" font-size="16">differentiate</text>
    <rect x="420" y="115" width="210" height="110" rx="14" fill="#f8f8f8" stroke="#333" stroke-width="2"/>
    <text x="448" y="155" font-size="22" font-weight="700">Gradient</text>
    <text x="447" y="195" font-size="24">dy/dx = 4x³ - 6x</text>
    <line x1="650" y1="170" x2="750" y2="170" stroke="#111" stroke-width="3"/>
    <polygon points="750,170 732,160 732,180" fill="#111"/>
    <text x="665" y="150" font-size="16">differentiate again</text>
    <rect x="555" y="260" width="300" height="60" rx="12" fill="#fff" stroke="#333"/>
    <text x="580" y="298" font-size="21">d²y/dx² = 12x² - 6</text>
    <line x1="525" y1="225" x2="655" y2="260" stroke="#111" stroke-width="2" stroke-dasharray="6,5"/>
    <text x="90" y="285" font-size="18">The second derivative measures the rate of change of the gradient.</text>
  </g>
</svg>