<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">Normal to y equals x squared at x equals 3</title>
  <desc id="desc">A curve y equals x squared with tangent and perpendicular normal at point 3,9.</desc>
  <rect width="880" height="520" fill="#ffffff"/>
  <text x="40" y="45" font-family="Arial" font-size="28" font-weight="700">Tangent and Normal at (3,9)</text>
  <g transform="translate(80,85)">
    <rect x="0" y="0" width="470" height="360" fill="#fafafa" stroke="#333"/>
    <line x1="40" y1="320" x2="440" y2="320" stroke="#111" stroke-width="2"/>
    <line x1="95" y1="20" x2="95" y2="335" stroke="#111" stroke-width="2"/>
    <path d="M95 320 C145 310, 210 260, 265 175 C305 110, 350 55, 425 15" fill="none" stroke="#1f77b4" stroke-width="4"/>
    <line x1="220" y1="255" x2="390" y2="-85" stroke="#222" stroke-width="4"/>
    <text x="245" y="260" font-family="Arial" font-size="16">tangent</text>
    <line x1="90" y1="130" x2="455" y2="190" stroke="#d62728" stroke-width="4"/>
    <text x="110" y="125" font-family="Arial" font-size="16" fill="#d62728">normal</text>
    <circle cx="305" cy="85" r="7" fill="#111"/>
    <text x="315" y="82" font-family="Arial" font-size="18">(3,9)</text>
  </g>
  <g transform="translate(590,115)" font-family="Arial">
    <rect x="0" y="0" width="250" height="260" fill="#fff" stroke="#333"/>
    <text x="18" y="35" font-size="18" font-weight="700">Gradients</text>
    <text x="18" y="75" font-size="17">Tangent gradient:</text>
    <text x="18" y="105" font-size="17">mₜ = 6</text>
    <text x="18" y="145" font-size="17">Normal gradient:</text>
    <text x="18" y="175" font-size="17">mₙ = -1/6</text>
    <text x="18" y="215" font-size="17" font-weight="700">y - 9 = -1/6(x - 3)</text>
  </g>
</svg>