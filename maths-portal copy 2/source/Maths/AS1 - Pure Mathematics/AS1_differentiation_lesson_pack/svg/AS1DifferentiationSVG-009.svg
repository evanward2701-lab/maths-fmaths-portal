Source: Chapter 12 Differentiation PDF optimisation tank evidence
Related section: Core Theory 25
Purpose: Show open-top cuboid tank with square opposite faces and dimensions x and y.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520" role="img" aria-labelledby="title desc">
  <title id="title">Open top cuboid optimisation tank</title>
  <desc id="desc">A cuboid tank with no top, square end faces of side x, length y, surface area relation and volume formula.</desc>
  <rect width="940" height="520" fill="#ffffff"/>
  <text x="40" y="45" font-family="Arial" font-size="28" font-weight="700">Optimisation: Open-Top Tank</text>
  <g transform="translate(90,100)" font-family="Arial">
    <polygon points="60,80 210,80 210,230 60,230" fill="#f6f6f6" stroke="#333" stroke-width="3"/>
    <polygon points="170,35 320,35 320,185 170,185" fill="#f0f0f0" stroke="#333" stroke-width="3"/>
    <line x1="60" y1="80" x2="170" y2="35" stroke="#333" stroke-width="3"/>
    <line x1="210" y1="80" x2="320" y2="35" stroke="#333" stroke-width="3"/>
    <line x1="210" y1="230" x2="320" y2="185" stroke="#333" stroke-width="3"/>
    <line x1="60" y1="230" x2="170" y2="185" stroke="#333" stroke-width="3"/>
    <path d="M60 80 L170 35 L320 35 L210 80 Z" fill="none" stroke="#d62728" stroke-width="3" stroke-dasharray="8,6"/>
    <text x="150" y="15" font-size="18" fill="#d62728" font-weight="700">no top</text>
    <line x1="42" y1="80" x2="42" y2="230" stroke="#111" stroke-width="2"/>
    <line x1="34" y1="80" x2="50" y2="80" stroke="#111" stroke-width="2"/>
    <line x1="34" y1="230" x2="50" y2="230" stroke="#111" stroke-width="2"/>
    <text x="18" y="160" font-size="24">x</text>
    <line x1="60" y1="250" x2="210" y2="250" stroke="#111" stroke-width="2"/>
    <line x1="60" y1="242" x2="60" y2="258" stroke="#111" stroke-width="2"/>
    <line x1="210" y1="242" x2="210" y2="258" stroke="#111" stroke-width="2"/>
    <text x="128" y="283" font-size="24">x</text>
    <line x1="225" y1="245" x2="335" y2="200" stroke="#111" stroke-width="2"/>
    <text x="292" y="250" font-size="24">y</text>
    <text x="70" y="330" font-size="19">Square opposite faces: x by x</text>
  </g>
  <g transform="translate(520,115)" font-family="Arial">
    <rect x="0" y="0" width="355" height="280" rx="14" fill="#fafafa" stroke="#333" stroke-width="2"/>
    <text x="25" y="42" font-size="22" font-weight="700">Constraint and volume</text>
    <text x="25" y="85" font-size="20">Surface area:</text>
    <text x="25" y="118" font-size="24" font-weight="700">2x² + 3xy = 54</text>
    <text x="25" y="160" font-size="20">Solve for y:</text>
    <text x="25" y="193" font-size="22">y = (54 - 2x²)/(3x)</text>
    <text x="25" y="235" font-size="20">Volume:</text>
    <text x="25" y="265" font-size="24" font-weight="700">V = 18x - (2/3)x³</text>
  </g>
</svg>