<!-- Asset ID: AS1CoordinateGeometryCirclesWidget-002 | Purpose: Line-circle discriminant explorer. -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Line-Circle Discriminant Explorer</title><style>body{margin:0;background:#f8fafc;color:#111827;font-family:Arial,Helvetica,sans-serif}.widget{max-width:1050px;margin:0 auto;padding:24px}.card{background:#fff;border:1px solid #cbd5e1;border-radius:18px;box-shadow:0 12px 30px rgba(15,23,42,.08);overflow:hidden}header{padding:22px 24px;background:linear-gradient(135deg,#fff7ed,#fff);border-bottom:1px solid #cbd5e1}h1{margin:0 0 8px;font-size:28px}header p{margin:0;color:#64748b;line-height:1.45}.grid{display:grid;grid-template-columns:350px 1fr;gap:20px;padding:22px}.controls{border:1px solid #cbd5e1;border-radius:16px;background:#f9fafb;padding:18px}.control{margin-bottom:18px}label{display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px}input[type=range]{width:100%}.result{margin-top:18px;border-radius:16px;padding:16px;border:1px solid #cbd5e1;background:#fff}.result h2{margin:0 0 8px;font-size:22px}.status{font-size:22px;font-weight:800;margin:8px 0 12px}.canvasWrap{border:1px solid #cbd5e1;border-radius:16px;background:#fff;padding:12px}canvas{width:100%;height:auto;display:block}.formula{font-family:"Courier New",monospace;background:#f1f5f9;border-radius:10px;padding:8px;overflow-wrap:anywhere}@media(max-width:860px){.grid{grid-template-columns:1fr}}</style></head><body><main class="widget"><section class="card"><header><h1>Line-Circle Discriminant Explorer</h1><p>Circle fixed as <strong>x² + y² = 25</strong>. Move the line <strong>y = mx + c</strong>.</p></header><div class="grid"><section class="controls"><div class="control"><label for="m">Gradient, m <span id="mVal">1</span></label><input id="m" type="range" min="-3" max="3" step="0.25" value="1"/></div><div class="control"><label for="c">Intercept, c <span id="cVal">0</span></label><input id="c" type="range" min="-8" max="8" step="0.25" value="0"/></div><div class="result"><h2>Classification</h2><div class="status" id="status">Secant: two intersections</div><p class="formula" id="quadratic">Substitution: x² + (mx + c)² = 25</p><p class="formula" id="discriminant">Discriminant = 100</p><p id="explanation">Since the discriminant is positive, the line cuts the circle twice.</p></div></section><section class="canvasWrap"><canvas id="canvas" width="620" height="560"></canvas></section></div></section></main><script>const mSlider=document.getElementById('m'),cSlider=document.getElementById('c'),mVal=document.getElementById('mVal'),cVal=document.getElementById('cVal'),statusBox=document.getElementById('status'),quadraticBox=document.getElementById('quadratic'),discBox=document.getElementById('discriminant'),explanation=document.getElementById('explanation'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height,originX=W/2,originY=H/2,scale=40,radius=5;function toPx(x,y){return{x:originX+x*scale,y:originY-y*scale}}function fmt(n){if(Math.abs(n)<.0001)return'0';if(Number.isInteger(n))return String(n);return n.toFixed(2).replace(/0+$/,'').replace(/\.$/,'')}function drawGrid(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#e5e7eb';ctx.lineWidth=1;for(let x=-8;x<=8;x++){const p=toPx(x,0);ctx.beginPath();ctx.moveTo(p.x,0);ctx.lineTo(p.x,H);ctx.stroke()}for(let y=-7;y<=7;y++){const p=toPx(0,y);ctx.beginPath();ctx.moveTo(0,p.y);ctx.lineTo(W,p.y);ctx.stroke()}ctx.strokeStyle='#64748b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,originY);ctx.lineTo(W,originY);ctx.stroke();ctx.beginPath();ctx.moveTo(originX,0);ctx.lineTo(originX,H);ctx.stroke()}function drawCircle(){ctx.strokeStyle='#111827';ctx.lineWidth=4;ctx.beginPath();ctx.arc(originX,originY,radius*scale,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#111827';ctx.font='bold 16px Arial';ctx.fillText('x² + y² = 25',originX-54,originY+radius*scale+28)}function drawLine(m,c){const x1=-8,y1=m*x1+c,x2=8,y2=m*x2+c,p1=toPx(x1,y1),p2=toPx(x2,y2);ctx.strokeStyle='#2563eb';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke()}function drawIntersections(m,c){const A=1+m*m,B=2*m*c,C=c*c-25,D=B*B-4*A*C;if(D<-.0001)return;const sqrtD=Math.sqrt(Math.max(0,D)),xs=Math.abs(D)<.0001?[(-B)/(2*A)]:[(-B+sqrtD)/(2*A),(-B-sqrtD)/(2*A)];xs.forEach(x=>{const y=m*x+c,p=toPx(x,y);ctx.fillStyle='#ef4444';ctx.beginPath();ctx.arc(p.x,p.y,7,0,Math.PI*2);ctx.fill()})}function update(){const m=Number(mSlider.value),c=Number(cSlider.value);mVal.textContent=fmt(m);cVal.textContent=fmt(c);const A=1+m*m,B=2*m*c,C=c*c-25,D=B*B-4*A*C;quadraticBox.textContent=`x² + (${fmt(m)}x + ${fmt(c)})² = 25 → ${fmt(A)}x² + ${fmt(B)}x + ${fmt(C)} = 0`;discBox.textContent=`Discriminant = b² - 4ac = ${fmt(D)}`;if(D>.0001){statusBox.textContent='Secant: two intersections';statusBox.style.color='#16a34a';explanation.textContent='Since the discriminant is positive, the line cuts the circle twice.'}else if(Math.abs(D)<=.0001){statusBox.textContent='Tangent: one repeated intersection';statusBox.style.color='#f97316';explanation.textContent='Since the discriminant is zero, the line touches the circle at exactly one point.'}else{statusBox.textContent='No intersection';statusBox.style.color='#ef4444';explanation.textContent='Since the discriminant is negative, there are no real intersection points.'}drawGrid();drawCircle();drawLine(m,c);drawIntersections(m,c)}[mSlider,cSlider].forEach(i=>i.addEventListener('input',update));update();</script></body></html>
