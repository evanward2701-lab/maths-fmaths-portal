<!-- Asset ID: AS1CoordinateGeometryCirclesWidget-003 | Purpose: Tangent-gradient checker. -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Tangent Gradient Checker</title><style>body{margin:0;background:#f8fafc;color:#111827;font-family:Arial,Helvetica,sans-serif}.widget{max-width:1080px;margin:0 auto;padding:24px}.card{background:#fff;border:1px solid #cbd5e1;border-radius:18px;box-shadow:0 12px 30px rgba(15,23,42,.08);overflow:hidden}header{padding:22px 24px;background:linear-gradient(135deg,#ecfdf5,#fff);border-bottom:1px solid #cbd5e1}h1{margin:0 0 8px;font-size:28px}header p{margin:0;color:#64748b;line-height:1.45}.grid{display:grid;grid-template-columns:380px 1fr;gap:20px;padding:22px}.controls{border:1px solid #cbd5e1;border-radius:16px;background:#f9fafb;padding:18px}.control{margin-bottom:15px}label{display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px}input[type=range]{width:100%}.output{margin-top:18px;background:#fff;border:1px solid #cbd5e1;border-radius:16px;padding:16px}.output h2{margin:0 0 10px;font-size:22px}.step{margin:9px 0;padding:9px;border-radius:10px;background:#f1f5f9;font-family:"Courier New",monospace;overflow-wrap:anywhere}.warning{margin-top:12px;color:#64748b;font-size:14px;line-height:1.45}.canvasWrap{border:1px solid #cbd5e1;border-radius:16px;background:#fff;padding:12px}canvas{width:100%;height:auto;display:block}@media(max-width:920px){.grid{grid-template-columns:1fr}}</style></head><body><main class="widget"><section class="card"><header><h1>Tangent Gradient Checker</h1><p>Choose a centre and a point of contact. The widget calculates the radius gradient, tangent gradient and tangent equation.</p></header><div class="grid"><section class="controls"><div class="control"><label for="cx">Centre x-coordinate <span id="cxVal">1</span></label><input id="cx" type="range" min="-4" max="4" step="1" value="1"/></div><div class="control"><label for="cy">Centre y-coordinate <span id="cyVal">1</span></label><input id="cy" type="range" min="-4" max="4" step="1" value="1"/></div><div class="control"><label for="angle">Point around circle <span id="angleVal">45°</span></label><input id="angle" type="range" min="0" max="345" step="15" value="45"/></div><div class="control"><label for="radius">Radius <span id="radiusVal">4</span></label><input id="radius" type="range" min="2" max="5" step="1" value="4"/></div><div class="output"><h2>Working</h2><div class="step" id="pointText"></div><div class="step" id="circleText"></div><div class="step" id="radiusText"></div><div class="step" id="tangentText"></div><div class="step" id="equationText"></div><p class="warning">Exam rhythm: centre to point gives radius gradient. Tangent gradient is the negative reciprocal.</p></div></section><section class="canvasWrap"><canvas id="canvas" width="640" height="560"></canvas></section></div></section></main><script>const cxSlider=document.getElementById('cx'),cySlider=document.getElementById('cy'),angleSlider=document.getElementById('angle'),radiusSlider=document.getElementById('radius'),cxVal=document.getElementById('cxVal'),cyVal=document.getElementById('cyVal'),angleVal=document.getElementById('angleVal'),radiusVal=document.getElementById('radiusVal'),pointText=document.getElementById('pointText'),circleText=document.getElementById('circleText'),radiusText=document.getElementById('radiusText'),tangentText=document.getElementById('tangentText'),equationText=document.getElementById('equationText'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height,originX=W/2,originY=H/2,scale=40;function fmt(n){if(Math.abs(n)<.0001)return'0';if(Number.isInteger(n))return String(n);return n.toFixed(2).replace(/0+$/,'').replace(/\.$/,'')}function signedBracket(v,value){if(value===0)return v;return value>0?`(${v} - ${value})`:`(${v} + ${Math.abs(value)})`}function toPx(x,y){return{x:originX+x*scale,y:originY-y*scale}}function drawGrid(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#e5e7eb';ctx.lineWidth=1;for(let x=-8;x<=8;x++){const p=toPx(x,0);ctx.beginPath();ctx.moveTo(p.x,0);ctx.lineTo(p.x,H);ctx.stroke()}for(let y=-7;y<=7;y++){const p=toPx(0,y);ctx.beginPath();ctx.moveTo(0,p.y);ctx.lineTo(W,p.y);ctx.stroke()}ctx.strokeStyle='#64748b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,originY);ctx.lineTo(W,originY);ctx.stroke();ctx.beginPath();ctx.moveTo(originX,0);ctx.lineTo(originX,H);ctx.stroke()}function draw(cx,cy,r,px,py){const C=toPx(cx,cy),P=toPx(px,py);ctx.strokeStyle='#111827';ctx.lineWidth=4;ctx.beginPath();ctx.arc(C.x,C.y,r*scale,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#ef4444';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(C.x,C.y);ctx.lineTo(P.x,P.y);ctx.stroke();const dx=px-cx,dy=py-cy,len=Math.sqrt(dx*dx+dy*dy),tx=-dy/len,ty=dx/len,t1=toPx(px+tx*4,py+ty*4),t2=toPx(px-tx*4,py-ty*4);ctx.strokeStyle='#16a34a';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(t1.x,t1.y);ctx.lineTo(t2.x,t2.y);ctx.stroke();ctx.fillStyle='#111827';ctx.beginPath();ctx.arc(C.x,C.y,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#2563eb';ctx.beginPath();ctx.arc(P.x,P.y,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111827';ctx.font='bold 15px Arial';ctx.fillText(`C(${fmt(cx)}, ${fmt(cy)})`,C.x+10,C.y-10);ctx.fillText(`P(${fmt(px)}, ${fmt(py)})`,P.x+10,P.y-10)}function update(){const cx=Number(cxSlider.value),cy=Number(cySlider.value),r=Number(radiusSlider.value),deg=Number(angleSlider.value),rad=deg*Math.PI/180,px=cx+r*Math.cos(rad),py=cy+r*Math.sin(rad);cxVal.textContent=cx;cyVal.textContent=cy;radiusVal.textContent=r;angleVal.textContent=`${deg}°`;const dx=px-cx,dy=py-cy;let radiusString,tangentString,equationString;if(Math.abs(dx)<.0001){radiusString='Radius is vertical, so its gradient is undefined';tangentString='Tangent is horizontal, so its gradient is 0';equationString=`Tangent: y = ${fmt(py)}`}else if(Math.abs(dy)<.0001){radiusString='Radius is horizontal, so its gradient is 0';tangentString='Tangent is vertical, so its equation is x = constant';equationString=`Tangent: x = ${fmt(px)}`}else{const rg=dy/dx,tg=-1/rg;radiusString=`Radius gradient = (${fmt(py)} - ${fmt(cy)}) / (${fmt(px)} - ${fmt(cx)}) = ${fmt(rg)}`;tangentString=`Tangent gradient = negative reciprocal = ${fmt(tg)}`;equationString=`Tangent: y - ${fmt(py)} = ${fmt(tg)}(x - ${fmt(px)})`}pointText.textContent=`Point P = (${fmt(px)}, ${fmt(py)})`;circleText.textContent=`Circle: ${signedBracket('x',cx)}² + ${signedBracket('y',cy)}² = ${r*r}`;radiusText.textContent=radiusString;tangentText.textContent=tangentString;equationText.textContent=equationString;drawGrid();draw(cx,cy,r,px,py)}[cxSlider,cySlider,angleSlider,radiusSlider].forEach(i=>i.addEventListener('input',update));update();</script></body></html>
