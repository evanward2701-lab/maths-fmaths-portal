<!-- Asset ID: AS1CoordinateGeometryCirclesWidget-001 | Purpose: Circle equation explorer. -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Circle Equation Explorer</title><style>body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f8fafc;color:#111827}.widget{max-width:980px;margin:0 auto;padding:24px}.card{background:#fff;border:1px solid #cbd5e1;border-radius:18px;box-shadow:0 12px 30px rgba(15,23,42,.08);overflow:hidden}header{padding:22px 24px;background:linear-gradient(135deg,#eff6ff,#fff);border-bottom:1px solid #cbd5e1}h1{margin:0 0 8px;font-size:28px}header p{margin:0;color:#64748b;line-height:1.45}.grid{display:grid;grid-template-columns:330px 1fr;gap:20px;padding:22px}.controls{border:1px solid #cbd5e1;border-radius:16px;padding:18px;background:#f9fafb}.control{margin-bottom:18px}label{display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px}input[type=range]{width:100%}.equation{border:1px solid #cbd5e1;border-radius:16px;padding:16px;background:#eff6ff;margin-top:16px}.equation .main{font-size:24px;font-weight:700;margin-bottom:10px}.equation .sub{color:#64748b;line-height:1.5}.canvasWrap{border:1px solid #cbd5e1;border-radius:16px;background:#fff;padding:12px}canvas{width:100%;height:auto;display:block}.note{margin-top:14px;color:#64748b;line-height:1.5;font-size:14px}@media(max-width:820px){.grid{grid-template-columns:1fr}}</style></head><body><main class="widget"><section class="card"><header><h1>Circle Equation Explorer</h1><p>Move the centre and radius. The equation updates as <strong>(x - a)² + (y - b)² = r²</strong>.</p></header><div class="grid"><section class="controls"><div class="control"><label for="a">Centre x-coordinate, a <span id="aVal">2</span></label><input id="a" type="range" min="-5" max="5" step="1" value="2"/></div><div class="control"><label for="b">Centre y-coordinate, b <span id="bVal">1</span></label><input id="b" type="range" min="-5" max="5" step="1" value="1"/></div><div class="control"><label for="r">Radius, r <span id="rVal">3</span></label><input id="r" type="range" min="1" max="6" step="1" value="3"/></div><div class="equation"><div class="main" id="equationText">(x - 2)² + (y - 1)² = 9</div><div class="sub" id="meaningText">Centre: (2, 1). Radius: 3.</div></div><p class="note">Sign trap: if the centre coordinate is negative, the bracket becomes a plus. For example, centre x-coordinate -3 gives (x + 3)².</p></section><section class="canvasWrap"><canvas id="canvas" width="560" height="560" aria-label="Coordinate grid showing the selected circle"></canvas></section></div></section></main><script>const aSlider=document.getElementById('a'),bSlider=document.getElementById('b'),rSlider=document.getElementById('r'),aVal=document.getElementById('aVal'),bVal=document.getElementById('bVal'),rVal=document.getElementById('rVal'),equationText=document.getElementById('equationText'),meaningText=document.getElementById('meaningText'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height,originX=W/2,originY=H/2,scale=40;function bracket(v,value){if(value===0)return v;if(value>0)return`(${v} - ${value})`;return`(${v} + ${Math.abs(value)})`}function drawGrid(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#e5e7eb';ctx.lineWidth=1;for(let x=-7;x<=7;x++){const px=originX+x*scale;ctx.beginPath();ctx.moveTo(px,0);ctx.lineTo(px,H);ctx.stroke()}for(let y=-7;y<=7;y++){const py=originY-y*scale;ctx.beginPath();ctx.moveTo(0,py);ctx.lineTo(W,py);ctx.stroke()}ctx.strokeStyle='#64748b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,originY);ctx.lineTo(W,originY);ctx.stroke();ctx.beginPath();ctx.moveTo(originX,0);ctx.lineTo(originX,H);ctx.stroke()}function drawCircle(a,b,r){const cx=originX+a*scale,cy=originY-b*scale;ctx.strokeStyle='#2563eb';ctx.lineWidth=4;ctx.beginPath();ctx.arc(cx,cy,r*scale,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#ef4444';ctx.beginPath();ctx.arc(cx,cy,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111827';ctx.font='bold 16px Arial';ctx.fillText(`C(${a}, ${b})`,cx+10,cy-10);ctx.strokeStyle='#ef4444';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+r*scale,cy);ctx.stroke();ctx.fillStyle='#ef4444';ctx.font='16px Arial';ctx.fillText(`r = ${r}`,cx+(r*scale)/2-10,cy-8)}function update(){const a=Number(aSlider.value),b=Number(bSlider.value),r=Number(rSlider.value);aVal.textContent=a;bVal.textContent=b;rVal.textContent=r;equationText.textContent=`${bracket('x',a)}² + ${bracket('y',b)}² = ${r*r}`;meaningText.textContent=`Centre: (${a}, ${b}). Radius: ${r}.`;drawGrid();drawCircle(a,b,r)}[aSlider,bSlider,rSlider].forEach(i=>i.addEventListener('input',update));update();</script></body></html>
