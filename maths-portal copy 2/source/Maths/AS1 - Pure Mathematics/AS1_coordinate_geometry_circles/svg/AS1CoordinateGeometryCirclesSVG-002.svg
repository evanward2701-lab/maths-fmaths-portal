<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <!-- Asset ID: AS1CoordinateGeometryCirclesSVG-002 | Purpose: derive x^2 + y^2 = r^2. -->
  <title id="title">Equation of a circle centred at the origin</title><desc id="desc">A circle centred at the origin with point P(x,y), radius r, and right-angled triangle.</desc>
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="45" y="55" font-family="Arial, sans-serif" font-size="30" font-weight="700">Circle Centred at the Origin</text>
  <text x="45" y="88" font-family="Arial, sans-serif" font-size="17">Use Pythagoras on the right-angled triangle inside the circle.</text>
  <line x1="110" y1="300" x2="780" y2="300" stroke="#9ca3af" stroke-width="2"/><line x1="430" y1="485" x2="430" y2="115" stroke="#9ca3af" stroke-width="2"/>
  <circle cx="430" cy="300" r="165" fill="none" stroke="#111827" stroke-width="4"/><circle cx="430" cy="300" r="7" fill="#111827"/>
  <text x="405" y="325" font-family="Arial, sans-serif" font-size="20">O(0,0)</text>
  <circle cx="560" cy="200" r="7" fill="#2563eb"/><text x="573" y="193" font-family="Arial, sans-serif" font-size="20">P(x,y)</text>
  <line x1="430" y1="300" x2="560" y2="200" stroke="#ef4444" stroke-width="5"/><text x="495" y="238" font-family="Arial, sans-serif" font-size="22" fill="#ef4444">r</text>
  <line x1="430" y1="300" x2="560" y2="300" stroke="#2563eb" stroke-width="4"/><line x1="560" y1="300" x2="560" y2="200" stroke="#16a34a" stroke-width="4"/>
  <text x="487" y="323" font-family="Arial, sans-serif" font-size="20" fill="#2563eb">x</text><text x="572" y="254" font-family="Arial, sans-serif" font-size="20" fill="#16a34a">y</text>
  <path d="M 545 300 L 545 285 L 560 285" fill="none" stroke="#111827" stroke-width="3"/>
  <rect x="60" y="405" width="780" height="90" rx="16" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="85" y="440" font-family="Arial, sans-serif" font-size="22" font-weight="700">Pythagoras:</text><text x="245" y="440" font-family="Arial, sans-serif" font-size="24">x² + y² = r²</text>
  <text x="85" y="475" font-family="Arial, sans-serif" font-size="18">Every point P(x,y) on the circle is distance r from the origin.</text>
</svg>
