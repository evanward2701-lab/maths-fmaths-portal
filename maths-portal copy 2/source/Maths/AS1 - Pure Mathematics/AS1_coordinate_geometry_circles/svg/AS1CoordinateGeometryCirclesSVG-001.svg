<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <!-- Asset ID: AS1CoordinateGeometryCirclesSVG-001 | Source: Chapter 6 Circles PDF page 3; transcript Circles 1 | Purpose: chord and perpendicular bisector through centre. -->
  <title id="title">Chord and perpendicular bisector through centre</title>
  <desc id="desc">A circle with a chord AB, midpoint M, centre C and a perpendicular bisector through M and C.</desc>
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>
  <text x="45" y="55" font-family="Arial, sans-serif" font-size="30" font-weight="700">Chord and Perpendicular Bisector</text>
  <text x="45" y="88" font-family="Arial, sans-serif" font-size="17">The perpendicular bisector of a chord passes through the centre of the circle.</text>
  <circle cx="455" cy="290" r="170" fill="none" stroke="#111827" stroke-width="4"/>
  <line x1="570" y1="165" x2="650" y2="360" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
  <text x="660" y="275" font-family="Arial, sans-serif" font-size="21" fill="#2563eb">chord AB</text>
  <circle cx="570" cy="165" r="7" fill="#2563eb"/><circle cx="650" cy="360" r="7" fill="#2563eb"/>
  <text x="580" y="155" font-family="Arial, sans-serif" font-size="20">A</text><text x="660" y="380" font-family="Arial, sans-serif" font-size="20">B</text>
  <circle cx="610" cy="262.5" r="7" fill="#ef4444"/><text x="622" y="256" font-family="Arial, sans-serif" font-size="20" fill="#ef4444">M</text>
  <line x1="410" y1="345" x2="745" y2="207" stroke="#f97316" stroke-width="5" stroke-linecap="round"/>
  <text x="617" y="200" font-family="Arial, sans-serif" font-size="20" fill="#f97316">perpendicular bisector</text>
  <circle cx="455" cy="290" r="8" fill="#111827"/><text x="430" y="283" font-family="Arial, sans-serif" font-size="22" font-weight="700">C</text>
  <line x1="455" y1="290" x2="610" y2="262.5" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 8"/>
  <path d="M 606 245 L 623 252 L 616 269 L 599 262 Z" fill="none" stroke="#111827" stroke-width="3"/>
  <rect x="45" y="405" width="330" height="105" rx="14" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="65" y="435" font-family="Arial, sans-serif" font-size="19" font-weight="700">Key facts</text>
  <text x="65" y="465" font-family="Arial, sans-serif" font-size="17">1. M is the midpoint of AB.</text>
  <text x="65" y="492" font-family="Arial, sans-serif" font-size="17">2. CM is perpendicular to AB.</text>
</svg>
