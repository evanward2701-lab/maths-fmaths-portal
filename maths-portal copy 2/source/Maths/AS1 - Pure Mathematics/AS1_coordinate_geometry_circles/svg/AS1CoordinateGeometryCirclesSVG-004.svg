<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Line-circle intersections and discriminant cases</title><desc id="desc">Secant, tangent and no-intersection cases.</desc>
  <rect width="980" height="560" fill="#ffffff"/><text x="45" y="55" font-family="Arial, sans-serif" font-size="30" font-weight="700">Line-Circle Intersections</text>
  <text x="45" y="88" font-family="Arial, sans-serif" font-size="17">Substitution gives a quadratic. The discriminant tells the geometry story.</text>
  <g transform="translate(50,125)"><text x="95" y="0" font-family="Arial, sans-serif" font-size="22" font-weight="700">Secant</text><circle cx="125" cy="130" r="90" fill="none" stroke="#111827" stroke-width="4"/><line x1="25" y1="185" x2="230" y2="65" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><circle cx="74" cy="156" r="7" fill="#ef4444"/><circle cx="184" cy="92" r="7" fill="#ef4444"/><text x="60" y="275" font-family="Arial, sans-serif" font-size="18">2 intersections</text><text x="53" y="305" font-family="Arial, sans-serif" font-size="20" font-weight="700">b² - 4ac &gt; 0</text></g>
  <g transform="translate(365,125)"><text x="95" y="0" font-family="Arial, sans-serif" font-size="22" font-weight="700">Tangent</text><circle cx="125" cy="130" r="90" fill="none" stroke="#111827" stroke-width="4"/><line x1="35" y1="40" x2="225" y2="230" stroke="#f97316" stroke-width="5" stroke-linecap="round"/><circle cx="61" cy="66" r="7" fill="#ef4444"/><text x="62" y="275" font-family="Arial, sans-serif" font-size="18">1 intersection</text><text x="53" y="305" font-family="Arial, sans-serif" font-size="20" font-weight="700">b² - 4ac = 0</text></g>
  <g transform="translate(680,125)"><text x="62" y="0" font-family="Arial, sans-serif" font-size="22" font-weight="700">No intersection</text><circle cx="125" cy="130" r="90" fill="none" stroke="#111827" stroke-width="4"/><line x1="30" y1="250" x2="225" y2="220" stroke="#6b7280" stroke-width="5" stroke-linecap="round"/><text x="62" y="275" font-family="Arial, sans-serif" font-size="18">0 intersections</text><text x="53" y="305" font-family="Arial, sans-serif" font-size="20" font-weight="700">b² - 4ac &lt; 0</text></g>
  <rect x="80" y="475" width="820" height="50" rx="14" fill="#f3f4f6" stroke="#d1d5db"/><text x="110" y="507" font-family="Arial, sans-serif" font-size="20">Method: substitute the line into the circle, simplify to ax² + bx + c = 0, then inspect b² - 4ac.</text>
</svg>
