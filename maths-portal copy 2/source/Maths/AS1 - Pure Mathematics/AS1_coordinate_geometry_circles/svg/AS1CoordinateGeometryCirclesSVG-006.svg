<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Finding centre from chord bisectors</title><desc id="desc">Two chords and perpendicular bisectors meeting at the centre.</desc>
  <rect width="900" height="560" fill="#ffffff"/><text x="45" y="55" font-family="Arial, sans-serif" font-size="30" font-weight="700">Finding the Centre from Chords</text>
  <text x="45" y="88" font-family="Arial, sans-serif" font-size="17">Two perpendicular bisectors of chords meet at the circle centre.</text>
  <circle cx="450" cy="300" r="170" fill="none" stroke="#111827" stroke-width="4"/>
  <line x1="310" y1="205" x2="610" y2="220" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/><text x="440" y="194" font-family="Arial, sans-serif" font-size="20" fill="#2563eb">chord 1</text>
  <line x1="340" y1="410" x2="600" y2="345" stroke="#7c3aed" stroke-width="6" stroke-linecap="round"/><text x="460" y="435" font-family="Arial, sans-serif" font-size="20" fill="#7c3aed">chord 2</text>
  <line x1="455" y1="90" x2="435" y2="500" stroke="#f97316" stroke-width="4" stroke-dasharray="9 7"/><line x1="300" y1="170" x2="595" y2="500" stroke="#16a34a" stroke-width="4" stroke-dasharray="9 7"/>
  <circle cx="450" cy="300" r="9" fill="#ef4444"/><text x="462" y="292" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ef4444">centre</text>
  <rect x="65" y="430" width="310" height="85" rx="14" fill="#f3f4f6" stroke="#d1d5db"/><text x="88" y="463" font-family="Arial, sans-serif" font-size="19" font-weight="700">Exam move</text><text x="88" y="492" font-family="Arial, sans-serif" font-size="17">Find two bisectors, then solve them simultaneously.</text>
</svg>
