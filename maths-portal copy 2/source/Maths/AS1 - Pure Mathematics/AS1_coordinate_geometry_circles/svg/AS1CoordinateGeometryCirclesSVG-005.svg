<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Tangent perpendicular to radius</title><desc id="desc">A circle with centre C, radius CP and tangent through P.</desc>
  <rect width="900" height="560" fill="#ffffff"/><text x="45" y="55" font-family="Arial, sans-serif" font-size="30" font-weight="700">Tangent and Radius</text>
  <text x="45" y="88" font-family="Arial, sans-serif" font-size="17">The tangent is perpendicular to the radius at the point of contact.</text>
  <circle cx="430" cy="300" r="165" fill="none" stroke="#111827" stroke-width="4"/><circle cx="430" cy="300" r="8" fill="#111827"/><text x="400" y="327" font-family="Arial, sans-serif" font-size="22" font-weight="700">C</text>
  <circle cx="560" cy="198" r="8" fill="#2563eb"/><text x="575" y="192" font-family="Arial, sans-serif" font-size="22" fill="#2563eb">P</text>
  <line x1="430" y1="300" x2="560" y2="198" stroke="#ef4444" stroke-width="5"/><text x="482" y="238" font-family="Arial, sans-serif" font-size="22" fill="#ef4444">radius</text>
  <line x1="440" y1="105" x2="680" y2="410" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/><text x="626" y="385" font-family="Arial, sans-serif" font-size="22" fill="#16a34a">tangent</text>
  <path d="M 542 213 L 559 228 L 575 211" fill="none" stroke="#111827" stroke-width="3"/>
  <rect x="65" y="410" width="775" height="95" rx="16" fill="#f3f4f6" stroke="#d1d5db"/><text x="90" y="445" font-family="Arial, sans-serif" font-size="21" font-weight="700">Gradient link</text><text x="90" y="475" font-family="Arial, sans-serif" font-size="18">Find the radius gradient first, then take the negative reciprocal for the tangent.</text>
</svg>
