<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640"><title>AS1VectorsSVG-003 Column vectors and i j notation</title><metadata>Asset ID: AS1VectorsSVG-003; Source: P1-Chp11-Vectors.pdf page 10; Purpose: column components and i,j basis vectors.</metadata><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#111827"/></marker><style>.title{font:700 34px system-ui,sans-serif;fill:#111827}.sub{font:18px system-ui,sans-serif;fill:#374151}.box{fill:#f9fafb;stroke:#111827;stroke-width:2;rx:18}.math{font:700 24px Times New Roman,serif;fill:#111827}.small{font:17px system-ui,sans-serif;fill:#374151}.vec{stroke:#2563eb;stroke-width:6;fill:none;marker-end:url(#arrow)}.green{stroke:#16a34a;stroke-width:6;fill:none;marker-end:url(#arrow)}.orange{stroke:#f97316;stroke-width:6;fill:none;marker-end:url(#arrow)}.dash{stroke:#9ca3af;stroke-width:2;stroke-dasharray:7 7}.dot{fill:#111827}</style></defs><rect width="1100" height="640" fill="#fff"/><text x="40" y="58" class="title">Representing Vectors</text><text x="40" y="92" class="sub">Top entry is x-displacement. Bottom entry is y-displacement.</text><rect x="80" y="130" width="470" height="410" fill="#fafafa" stroke="#d1d5db"/><line x1="120" y1="490" x2="520" y2="490" stroke="#111827" stroke-width="3"/><line x1="120" y1="490" x2="120" y2="170" stroke="#111827" stroke-width="3"/><line x1="120" y1="490" x2="360" y2="250" class="vec"/><line x1="360" y1="490" x2="360" y2="250" class="dash"/><line x1="120" y1="250" x2="360" y2="250" class="dash"/><text x="370" y="250" class="math">(3,3)</text><line x1="150" y1="460" x2="210" y2="460" class="green"/><text x="220" y="466" class="math">i</text><line x1="150" y1="460" x2="150" y2="400" class="green"/><text x="158" y="396" class="math">j</text><rect x="640" y="160" width="390" height="330" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="18"/><text x="675" y="220" class="math">i = (1, 0)</text><text x="675" y="275" class="math">j = (0, 1)</text><text x="675" y="345" class="math">(x,y) = xi + yj</text><text x="675" y="415" class="math">(4,3) = 4i + 3j</text></svg>