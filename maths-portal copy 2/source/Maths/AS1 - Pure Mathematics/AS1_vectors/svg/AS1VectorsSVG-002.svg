<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640"><title>AS1VectorsSVG-002 Triangle law</title><metadata>Asset ID: AS1VectorsSVG-002; Source: P1-Chp11-Vectors.pdf page 4; Purpose: illustrate AB + BC = AC.</metadata><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#111827"/></marker><style>.title{font:700 34px system-ui,sans-serif;fill:#111827}.sub{font:18px system-ui,sans-serif;fill:#374151}.box{fill:#f9fafb;stroke:#111827;stroke-width:2;rx:18}.math{font:700 24px Times New Roman,serif;fill:#111827}.small{font:17px system-ui,sans-serif;fill:#374151}.vec{stroke:#2563eb;stroke-width:6;fill:none;marker-end:url(#arrow)}.green{stroke:#16a34a;stroke-width:6;fill:none;marker-end:url(#arrow)}.orange{stroke:#f97316;stroke-width:6;fill:none;marker-end:url(#arrow)}.dash{stroke:#9ca3af;stroke-width:2;stroke-dasharray:7 7}.dot{fill:#111827}</style></defs><rect width="1100" height="640" fill="#fff"/><text x="40" y="58" class="title">Triangle Law for Vector Addition</text><text x="40" y="92" class="sub">Two connected journeys can be replaced by one resultant journey.</text><circle cx="170" cy="500" r="7" class="dot"/><circle cx="470" cy="250" r="7" class="dot"/><circle cx="850" cy="430" r="7" class="dot"/><text x="145" y="535" class="math">A</text><text x="470" y="225" class="math">B</text><text x="860" y="462" class="math">C</text><line x1="170" y1="500" x2="470" y2="250" class="vec"/><line x1="470" y1="250" x2="850" y2="430" class="vec"/><line x1="170" y1="500" x2="850" y2="430" class="green"/><text x="290" y="350" class="math">a</text><text x="655" y="315" class="math">b</text><text x="470" y="540" class="math">a + b</text><rect x="160" y="115" width="780" height="70" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="18"/><text x="210" y="160" class="math">AB + BC = AC</text></svg>