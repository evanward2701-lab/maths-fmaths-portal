<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640"><title>AS1VectorsSVG-005 Position vectors and vector difference</title><metadata>Asset ID: AS1VectorsSVG-005; Source: P1-Chp11-Vectors.pdf pages 16-18; Purpose: OA, OB and AB = OB - OA.</metadata><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#111827"/></marker><style>.title{font:700 34px system-ui,sans-serif;fill:#111827}.sub{font:18px system-ui,sans-serif;fill:#374151}.box{fill:#f9fafb;stroke:#111827;stroke-width:2;rx:18}.math{font:700 24px Times New Roman,serif;fill:#111827}.small{font:17px system-ui,sans-serif;fill:#374151}.vec{stroke:#2563eb;stroke-width:6;fill:none;marker-end:url(#arrow)}.green{stroke:#16a34a;stroke-width:6;fill:none;marker-end:url(#arrow)}.orange{stroke:#f97316;stroke-width:6;fill:none;marker-end:url(#arrow)}.dash{stroke:#9ca3af;stroke-width:2;stroke-dasharray:7 7}.dot{fill:#111827}</style></defs><rect width="1100" height="640" fill="#fff"/><text x="40" y="58" class="title">Position Vectors</text><text x="40" y="92" class="sub">A position vector tells you how to get from the origin to a point.</text><rect x="80" y="130" width="540" height="420" fill="#fafafa" stroke="#d1d5db"/><line x1="140" y1="490" x2="580" y2="490" stroke="#111827" stroke-width="3"/><line x1="140" y1="490" x2="140" y2="170" stroke="#111827" stroke-width="3"/><circle cx="140" cy="490" r="7" class="dot"/><text x="118" y="520" class="math">O</text><circle cx="380" cy="250" r="7" class="dot"/><text x="392" y="248" class="math">A</text><circle cx="540" cy="330" r="7" class="dot"/><text x="552" y="330" class="math">B</text><line x1="140" y1="490" x2="380" y2="250" class="vec"/><line x1="140" y1="490" x2="540" y2="330" class="green"/><line x1="380" y1="250" x2="540" y2="330" class="orange"/><text x="230" y="320" class="math">OA</text><text x="320" y="440" class="math">OB</text><text x="445" y="290" class="math">AB</text><rect x="670" y="180" width="380" height="300" fill="#fff7ed" stroke="#f97316" stroke-width="2" rx="18"/><text x="700" y="240" class="math">AB = OB - OA</text><text x="700" y="300" class="small">Destination minus start.</text><text x="700" y="360" class="math">AB = (x₂-x₁, y₂-y₁)</text></svg>