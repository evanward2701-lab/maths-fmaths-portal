<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640"><title>AS1VectorsSVG-004 Magnitude and unit vector</title><metadata>Asset ID: AS1VectorsSVG-004; Source: P1-Chp11-Vectors.pdf pages 13-14; Purpose: magnitude and unit-vector scaling.</metadata><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#111827"/></marker><style>.title{font:700 34px system-ui,sans-serif;fill:#111827}.sub{font:18px system-ui,sans-serif;fill:#374151}.box{fill:#f9fafb;stroke:#111827;stroke-width:2;rx:18}.math{font:700 24px Times New Roman,serif;fill:#111827}.small{font:17px system-ui,sans-serif;fill:#374151}.vec{stroke:#2563eb;stroke-width:6;fill:none;marker-end:url(#arrow)}.green{stroke:#16a34a;stroke-width:6;fill:none;marker-end:url(#arrow)}.orange{stroke:#f97316;stroke-width:6;fill:none;marker-end:url(#arrow)}.dash{stroke:#9ca3af;stroke-width:2;stroke-dasharray:7 7}.dot{fill:#111827}</style></defs><rect width="1100" height="640" fill="#fff"/><text x="40" y="58" class="title">Magnitude and Unit Vectors</text><text x="40" y="92" class="sub">Magnitude is length. A unit vector has length 1.</text><line x1="160" y1="500" x2="400" y2="260" class="vec"/><line x1="160" y1="500" x2="400" y2="500" class="dash"/><line x1="400" y1="500" x2="400" y2="260" class="dash"/><text x="265" y="535" class="math">3</text><text x="420" y="390" class="math">4</text><text x="235" y="335" class="math">a = (3,4)</text><line x1="160" y1="500" x2="208" y2="452" class="green"/><text x="215" y="452" class="math">â</text><rect x="610" y="150" width="420" height="350" class="box"/><text x="645" y="205" class="math">|a| = sqrt(x² + y²)</text><text x="645" y="275" class="math">For a=(3,4): |a|=5</text><text x="645" y="350" class="math">â = a / |a|</text><text x="645" y="420" class="math">â = (3/5, 4/5)</text></svg>