<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640"><title>AS1VectorsSVG-006 Geometric vector proof</title><metadata>Asset ID: AS1VectorsSVG-006; Source: P1-Chp11-Vectors.pdf pages 20-22; Purpose: scalar multiple proof of parallel vectors.</metadata><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#111827"/></marker><style>.title{font:700 34px system-ui,sans-serif;fill:#111827}.sub{font:18px system-ui,sans-serif;fill:#374151}.box{fill:#f9fafb;stroke:#111827;stroke-width:2;rx:18}.math{font:700 24px Times New Roman,serif;fill:#111827}.small{font:17px system-ui,sans-serif;fill:#374151}.vec{stroke:#2563eb;stroke-width:6;fill:none;marker-end:url(#arrow)}.green{stroke:#16a34a;stroke-width:6;fill:none;marker-end:url(#arrow)}.orange{stroke:#f97316;stroke-width:6;fill:none;marker-end:url(#arrow)}.dash{stroke:#9ca3af;stroke-width:2;stroke-dasharray:7 7}.dot{fill:#111827}</style></defs><rect width="1100" height="640" fill="#fff"/><text x="40" y="58" class="title">Geometric Vector Proof</text><text x="40" y="92" class="sub">Show one vector is a scalar multiple of the other.</text><path d="M150 460 L430 460 L590 290 L310 290 Z" stroke="#111827" stroke-width="3" fill="none"/><text x="130" y="495" class="math">O</text><text x="430" y="495" class="math">A</text><text x="598" y="285" class="math">C</text><text x="285" y="285" class="math">B</text><line x1="150" y1="460" x2="430" y2="460" class="vec"/><line x1="150" y1="460" x2="310" y2="290" class="green"/><line x1="150" y1="460" x2="590" y2="290" class="orange"/><text x="250" y="495" class="math">a</text><text x="195" y="360" class="math">b</text><text x="340" y="340" class="math">OC = a + b</text><line x1="390" y1="290" x2="500" y2="375" class="orange"/><text x="445" y="325" class="math">XM</text><rect x="670" y="150" width="390" height="250" class="box"/><text x="700" y="205" class="math">OC = a + b</text><text x="700" y="260" class="math">XM = 1/4(a + b)</text><text x="700" y="315" class="math">XM = 1/4 OC</text><rect x="670" y="430" width="390" height="90" fill="#ecfdf5" stroke="#16a34a" stroke-width="2" rx="18"/><text x="700" y="482" class="math">Therefore XM ∥ OC</text></svg>