<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640"><title>AS1VectorsSVG-001 Vector basics</title><metadata>Asset ID: AS1VectorsSVG-001; Source: P1-Chp11-Vectors.pdf page 4 and screenshots PDF; Related section: Key Definitions and Notation; Purpose: vector displacement, magnitude, direction, equal vectors.</metadata><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#111827"/></marker><style>.title{font:700 34px system-ui,sans-serif;fill:#111827}.sub{font:18px system-ui,sans-serif;fill:#374151}.box{fill:#f9fafb;stroke:#111827;stroke-width:2;rx:18}.math{font:700 24px Times New Roman,serif;fill:#111827}.small{font:17px system-ui,sans-serif;fill:#374151}.vec{stroke:#2563eb;stroke-width:6;fill:none;marker-end:url(#arrow)}.green{stroke:#16a34a;stroke-width:6;fill:none;marker-end:url(#arrow)}.orange{stroke:#f97316;stroke-width:6;fill:none;marker-end:url(#arrow)}.dash{stroke:#9ca3af;stroke-width:2;stroke-dasharray:7 7}.dot{fill:#111827}</style></defs><rect width="1100" height="640" fill="#fff"/><text x="40" y="58" class="title">Vector Basics</text><text x="40" y="92" class="sub">Position is where you are. Displacement is how you move.</text><rect x="60" y="140" width="430" height="150" class="box"/><text x="90" y="185" class="math">Coordinate</text><text x="90" y="225" class="small">Represents a position in space.</text><text x="90" y="260" class="math">A = (3,2)</text><rect x="610" y="140" width="430" height="150" class="box"/><text x="640" y="185" class="math">Vector</text><text x="640" y="225" class="small">Represents a displacement in space.</text><text x="640" y="260" class="small">Has magnitude and direction.</text><line x1="770" y1="250" x2="935" y2="180" class="vec"/><text x="942" y="180" class="math">PQ</text><rect x="70" y="365" width="960" height="170" fill="#fff7ed" stroke="#f97316" stroke-width="2" rx="18"/><text x="100" y="410" class="math">Same magnitude + same direction = same vector</text><line x1="150" y1="500" x2="325" y2="445" class="vec"/><line x1="560" y1="510" x2="735" y2="455" class="vec"/><text x="210" y="540" class="math">PQ</text><text x="625" y="548" class="math">RS</text></svg>