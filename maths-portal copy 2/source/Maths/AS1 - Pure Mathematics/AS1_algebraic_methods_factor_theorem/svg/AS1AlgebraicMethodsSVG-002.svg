<?xml version="1.0" encoding="UTF-8"?>
<!--
Asset ID: AS1AlgebraicMethodsSVG-002
Unit code: AS1
Topic code: AS1-AF
Topic ID: AS1AlgebraicMethodsFactorTheorem
Related LO IDs: AS1-AF-LO010, AS1-AF-LO011
Source: Dr Frost P1 Chapter 7 Algebraic Methods PDF pages 7-11; Chapter 7a teacher transcript
Related lesson section: Core Theory B-E: Polynomial Long Division by Linear Expressions
Purpose: Show a clean polynomial long division layout for dividing 6x^3 + 28x^2 - 7x + 15 by x + 5, with divide, multiply, subtract and bring down prompts.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 900" role="img" aria-labelledby="title desc">
  <title id="title">Polynomial long division layout</title>
  <desc id="desc">A structured diagram showing polynomial long division of 6x cubed plus 28x squared minus 7x plus 15 by x plus 5, producing quotient 6x squared minus 2x plus 3 and remainder zero.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M 0 0 L 12 6 L 0 12 z" fill="#222222"/></marker>
    <style>
      .heading { font: bold 34px Arial, sans-serif; fill: #111111; }
      .subheading { font: bold 22px Arial, sans-serif; fill: #111111; }
      .body { font: 20px Arial, sans-serif; fill: #111111; }
      .math { font: 30px Georgia, serif; fill: #111111; }
      .mathSmall { font: 24px Georgia, serif; fill: #111111; }
      .tiny { font: 16px Arial, sans-serif; fill: #111111; }
      .line { stroke: #111111; stroke-width: 4; fill: none; }
      .thin { stroke: #111111; stroke-width: 2; fill: none; }
      .arrowLine { stroke: #222222; stroke-width: 3; marker-end: url(#arrow); fill: none; }
      .box { fill: #ffffff; stroke: #222222; stroke-width: 2.5; rx: 16; }
      .warnBox { fill: #f7f7f7; stroke: #222222; stroke-width: 2.5; rx: 16; }
      .stage { font: bold 18px Arial, sans-serif; fill: #111111; }
    </style>
  </defs>
  <rect x="20" y="20" width="1260" height="860" rx="26" fill="#fafafa" stroke="#111111" stroke-width="3"/>
  <text x="650" y="70" text-anchor="middle" class="heading">Polynomial Long Division by a Linear Expression</text>
  <text x="650" y="108" text-anchor="middle" class="body">Example: divide 6x³ + 28x² − 7x + 15 by x + 5</text>
  <text x="245" y="230" class="math">x + 5</text>
  <path d="M 330 260 L 330 185 L 1010 185" class="line"/>
  <text x="620" y="170" text-anchor="middle" class="math">6x² − 2x + 3</text>
  <text x="380" y="245" class="math">6x³</text>
  <text x="535" y="245" class="math">+ 28x²</text>
  <text x="720" y="245" class="math">− 7x</text>
  <text x="875" y="245" class="math">+ 15</text>
  <text x="380" y="335" class="mathSmall">6x³</text>
  <text x="535" y="335" class="mathSmall">+ 30x²</text>
  <line x1="365" y1="360" x2="685" y2="360" class="thin"/>
  <text x="528" y="392" text-anchor="middle" class="mathSmall">− 2x²</text>
  <text x="720" y="392" class="mathSmall">− 7x</text>
  <text x="525" y="475" class="mathSmall">− 2x²</text>
  <text x="710" y="475" class="mathSmall">− 10x</text>
  <line x1="515" y1="500" x2="845" y2="500" class="thin"/>
  <text x="704" y="535" text-anchor="middle" class="mathSmall">3x</text>
  <text x="875" y="535" class="mathSmall">+ 15</text>
  <text x="705" y="620" class="mathSmall">3x</text>
  <text x="875" y="620" class="mathSmall">+ 15</text>
  <line x1="690" y1="645" x2="965" y2="645" class="thin"/>
  <text x="825" y="690" text-anchor="middle" class="math">0</text>
  <rect x="70" y="345" width="225" height="90" class="box"/>
  <text x="182" y="378" text-anchor="middle" class="stage">1. Divide</text>
  <text x="182" y="412" text-anchor="middle" class="mathSmall">6x³ ÷ x = 6x²</text>
  <path d="M 295 390 C 330 335, 345 300, 405 250" class="arrowLine"/>
  <rect x="1015" y="275" width="230" height="100" class="box"/>
  <text x="1130" y="308" text-anchor="middle" class="stage">2. Multiply</text>
  <text x="1130" y="342" text-anchor="middle" class="mathSmall">6x²(x + 5)</text>
  <path d="M 1015 325 C 930 320, 840 325, 665 335" class="arrowLine"/>
  <rect x="70" y="520" width="260" height="110" class="box"/>
  <text x="200" y="553" text-anchor="middle" class="stage">3. Subtract</text>
  <text x="200" y="587" text-anchor="middle" class="mathSmall">28x² − 30x²</text>
  <text x="200" y="618" text-anchor="middle" class="mathSmall">= −2x²</text>
  <path d="M 330 575 C 400 520, 450 470, 535 392" class="arrowLine"/>
  <rect x="1015" y="475" width="230" height="100" class="box"/>
  <text x="1130" y="508" text-anchor="middle" class="stage">4. Bring down</text>
  <text x="1130" y="542" text-anchor="middle" class="mathSmall">then repeat</text>
  <path d="M 1015 525 C 950 525, 900 525, 850 535" class="arrowLine"/>
  <rect x="90" y="735" width="520" height="95" class="warnBox"/>
  <text x="110" y="770" class="subheading">Sign trap</text>
  <text x="110" y="805" class="body">Be careful: −7x − (−10x) = −7x + 10x = 3x.</text>
  <rect x="690" y="735" width="520" height="95" class="warnBox"/>
  <text x="710" y="770" class="subheading">Check</text>
  <text x="710" y="805" class="body">Expand (x + 5)(6x² − 2x + 3) to recover the dividend.</text>
  <text x="650" y="855" text-anchor="middle" class="tiny">AS1-AF-LO010 and AS1-AF-LO011: simple algebraic division, quotient, remainder and factor links</text>
</svg>
