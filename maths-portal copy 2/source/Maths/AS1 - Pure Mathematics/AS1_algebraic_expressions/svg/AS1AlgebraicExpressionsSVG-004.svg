<!-- Asset ID: AS1AlgebraicExpressionsSVG-004 -->
<!-- Source: Dr Frost rationalising denominator slides and transcript -->
<!-- Related lesson section: Rationalising the Denominator, Worked Examples, Common Mistakes and Exam Traps -->
<!-- Purpose: Show how multiplying by the conjugate creates a difference of two squares. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Rationalising with a conjugate</title>
  <desc id="desc">A visual explanation of rationalising one over root two plus one by multiplying by the conjugate root two minus one.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#111"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #111; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #333; }
      .box { fill: #ffffff; stroke: #111; stroke-width: 2.5; rx: 20; }
      .soft { fill: #f6f6f6; stroke: #111; stroke-width: 2.5; rx: 20; }
      .dark { fill: #111; stroke: #111; stroke-width: 2.5; rx: 20; }
      .math { font: 700 28px Georgia, serif; fill: #111; }
      .mathBig { font: 700 38px Georgia, serif; fill: #111; }
      .text { font: 700 19px Arial, sans-serif; fill: #111; }
      .textDark { font: 700 19px Arial, sans-serif; fill: #fff; }
      .small { font: 400 16px Arial, sans-serif; fill: #222; }
      .arrow { stroke: #111; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .strike { stroke: #111; stroke-width: 3; }
      .fracLine { stroke: #111; stroke-width: 2.5; }
    </style>
  </defs>

  <rect x="20" y="20" width="1160" height="720" rx="24" fill="#ffffff" stroke="#111" stroke-width="3"/>
  <text x="60" y="70" class="title">Rationalising a denominator with a conjugate</text>
  <text x="60" y="103" class="subtitle">The conjugate is the matching expression with the middle sign reversed.</text>

  <rect x="70" y="145" width="290" height="155" class="box"/>
  <text x="105" y="180" class="text">Start with an irrational denominator</text>
  <text x="160" y="230" class="mathBig">1</text>
  <line x1="132" y1="248" x2="258" y2="248" class="fracLine"/>
  <text x="112" y="288" class="mathBig">√2 + 1</text>

  <rect x="455" y="145" width="290" height="155" class="soft"/>
  <text x="500" y="180" class="text">Multiply by the conjugate</text>
  <text x="520" y="227" class="math">√2 - 1</text>
  <line x1="505" y1="245" x2="660" y2="245" class="fracLine"/>
  <text x="520" y="286" class="math">√2 - 1</text>
  <text x="668" y="258" class="small">equals 1</text>

  <rect x="840" y="145" width="290" height="155" class="box"/>
  <text x="875" y="180" class="text">Build one fraction</text>
  <text x="890" y="227" class="math">1(√2 - 1)</text>
  <line x1="865" y1="245" x2="1095" y2="245" class="fracLine"/>
  <text x="858" y="286" class="math">(√2 + 1)(√2 - 1)</text>

  <line x1="360" y1="222" x2="455" y2="222" class="arrow"/>
  <line x1="745" y1="222" x2="840" y2="222" class="arrow"/>

  <rect x="110" y="390" width="400" height="210" class="soft"/>
  <text x="145" y="425" class="text">Denominator becomes difference of two squares</text>
  <text x="155" y="480" class="math">(√2 + 1)(√2 - 1)</text>
  <text x="235" y="525" class="math">= (√2)^2 - 1^2</text>
  <text x="288" y="570" class="math">= 2 - 1 = 1</text>

  <rect x="690" y="390" width="400" height="210" class="soft"/>
  <text x="725" y="425" class="text">Middle surd terms cancel</text>
  <text x="735" y="475" class="math">2 - √2 + √2 - 1</text>
  <line x1="818" y1="460" x2="872" y2="490" class="strike"/>
  <line x1="870" y1="460" x2="815" y2="490" class="strike"/>
  <text x="805" y="525" class="math">= 1</text>
  <text x="735" y="570" class="small">That is why using the same binomial is not enough.</text>

  <line x1="985" y1="300" x2="890" y2="390" class="arrow"/>

  <rect x="250" y="655" width="700" height="55" class="dark"/>
  <text x="395" y="690" class="textDark">Final result: 1/(√2 + 1) = √2 - 1</text>
</svg>
