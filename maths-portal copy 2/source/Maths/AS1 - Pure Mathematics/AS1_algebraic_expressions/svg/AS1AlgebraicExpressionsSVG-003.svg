<!-- Asset ID: AS1AlgebraicExpressionsSVG-003 -->
<!-- Source: Dr Frost factorising slides and transcript comments on common factors -->
<!-- Related lesson section: Factorising, Worked Examples, Guided Practice -->
<!-- Purpose: Show a factorisation decision tree: common factor, quadratic, difference of two squares. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Factorisation decision tree</title>
  <desc id="desc">A decision tree for factorising fully, starting with common factor and then checking special structures.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#111"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #111; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #333; }
      .box { fill: #fff; stroke: #111; stroke-width: 2.5; rx: 18; }
      .dark { fill: #111; stroke: #111; stroke-width: 2.5; rx: 18; }
      .light { fill: #f5f5f5; stroke: #111; stroke-width: 2.5; rx: 18; }
      .warn { fill: #eeeeee; stroke: #111; stroke-width: 2.5; rx: 18; }
      .text { font: 700 18px Arial, sans-serif; fill: #111; }
      .textDark { font: 700 18px Arial, sans-serif; fill: #fff; }
      .small { font: 400 15px Arial, sans-serif; fill: #222; }
      .arrow { stroke: #111; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .label { font: 700 14px Arial, sans-serif; fill: #111; }
    </style>
  </defs>

  <rect x="20" y="20" width="1160" height="780" rx="24" fill="#ffffff" stroke="#111" stroke-width="3"/>
  <text x="60" y="70" class="title">Factorise fully: a safe route through the algebra maze</text>
  <text x="60" y="103" class="subtitle">Always start by looking for a common factor. That tiny habit saves entire questions.</text>

  <rect x="455" y="135" width="290" height="60" class="dark"/>
  <text x="515" y="172" class="textDark">Factorise fully</text>

  <rect x="435" y="240" width="330" height="65" class="light"/>
  <text x="478" y="265" class="text">1. Look for a common factor</text>
  <text x="505" y="288" class="small">Example: x^3 - 7x^2 + 12x</text>

  <rect x="120" y="365" width="300" height="75" class="box"/>
  <text x="170" y="392" class="text">Common factor?</text>
  <text x="163" y="417" class="small">Factor it out first.</text>

  <rect x="780" y="365" width="300" height="75" class="box"/>
  <text x="815" y="392" class="text">No common factor?</text>
  <text x="835" y="417" class="small">Check the structure.</text>

  <rect x="70" y="510" width="250" height="80" class="light"/>
  <text x="115" y="540" class="text">Quadratic?</text>
  <text x="95" y="565" class="small">Find add and multiply pair.</text>

  <rect x="365" y="510" width="270" height="80" class="light"/>
  <text x="395" y="540" class="text">Coefficient of x^2 not 1?</text>
  <text x="400" y="565" class="small">Split the middle term.</text>

  <rect x="690" y="510" width="270" height="80" class="light"/>
  <text x="725" y="540" class="text">Difference of squares?</text>
  <text x="745" y="565" class="small">a^2 - b^2 = (a-b)(a+b)</text>

  <rect x="980" y="510" width="150" height="80" class="warn"/>
  <text x="1008" y="540" class="text">Other?</text>
  <text x="995" y="565" class="small">May be a later method.</text>

  <rect x="100" y="675" width="1000" height="65" class="dark"/>
  <text x="405" y="701" class="textDark">Final check: can any factor factorise further?</text>
  <text x="445" y="726" class="small" fill="#fff">For example, x^4 - 1 becomes (x^2 + 1)(x - 1)(x + 1).</text>

  <line x1="600" y1="195" x2="600" y2="240" class="arrow"/>
  <line x1="600" y1="305" x2="270" y2="365" class="arrow"/>
  <line x1="600" y1="305" x2="930" y2="365" class="arrow"/>

  <text x="365" y="345" class="label">yes</text>
  <text x="820" y="345" class="label">no</text>

  <line x1="270" y1="440" x2="195" y2="510" class="arrow"/>
  <line x1="270" y1="440" x2="500" y2="510" class="arrow"/>
  <line x1="930" y1="440" x2="825" y2="510" class="arrow"/>
  <line x1="930" y1="440" x2="1055" y2="510" class="arrow"/>

  <line x1="195" y1="590" x2="430" y2="675" class="arrow"/>
  <line x1="500" y1="590" x2="540" y2="675" class="arrow"/>
  <line x1="825" y1="590" x2="690" y2="675" class="arrow"/>
  <line x1="1055" y1="590" x2="815" y2="675" class="arrow"/>

  <rect x="60" y="755" width="1080" height="30" fill="#f7f7f7" stroke="#111" stroke-width="1.5" rx="10"/>
  <text x="80" y="776" class="small">Boundary note: factor theorem and remainder theorem are not part of this specific visual. They belong to a later AS1 algebra lesson.</text>
</svg>
