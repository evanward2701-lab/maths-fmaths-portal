<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Pascal’s triangle and binomial coefficients</title>
  <desc id="desc">A clean Pascal’s triangle diagram showing rows 0 to 5 and the corresponding binomial coefficient notation.</desc>
  <rect x="0" y="0" width="1200" height="820" fill="#ffffff"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#111111">Pascal’s Triangle: rows and entries</text>
  <text x="60" y="115" font-family="Arial, sans-serif" font-size="22" fill="#333333">Row n gives the coefficients for (a+b)ⁿ. The top row is row 0.</text>
  <rect x="60" y="140" width="1080" height="3" fill="#111111"/>
  <g font-family="Arial, sans-serif" font-size="28" text-anchor="middle" fill="#111111">
    <text x="600" y="205">1</text>
    <text x="555" y="265">1</text><text x="645" y="265">1</text>
    <text x="510" y="325">1</text><text x="600" y="325">2</text><text x="690" y="325">1</text>
    <text x="465" y="385">1</text><text x="555" y="385">3</text><text x="645" y="385">3</text><text x="735" y="385">1</text>
    <text x="420" y="445">1</text><text x="510" y="445">4</text><text x="600" y="445">6</text><text x="690" y="445">4</text><text x="780" y="445">1</text>
    <text x="375" y="505">1</text><text x="465" y="505">5</text><text x="555" y="505">10</text><text x="645" y="505">10</text><text x="735" y="505">5</text><text x="825" y="505">1</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="20" fill="#555555"><text x="140" y="205">row 0</text><text x="140" y="265">row 1</text><text x="140" y="325">row 2</text><text x="140" y="385">row 3</text><text x="140" y="445">row 4</text><text x="140" y="505">row 5</text></g>
  <rect x="150" y="570" width="900" height="175" rx="18" fill="#f5f5f5" stroke="#222222" stroke-width="2"/>
  <text x="185" y="615" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111111">Binomial coefficient notation</text>
  <text x="185" y="660" font-family="Arial, sans-serif" font-size="24" fill="#111111">Row 4:</text>
  <g font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#111111"><text x="330" y="660">C(4,0)=1</text><text x="500" y="660">C(4,1)=4</text><text x="670" y="660">C(4,2)=6</text><text x="840" y="660">C(4,3)=4</text></g>
  <text x="60" y="785" font-family="Arial, sans-serif" font-size="20" fill="#333333">Memory pebble: the entry number starts at 0, so the third visible entry in row 4 is actually “choose 2”.</text>
</svg>
