<!--
asset_id: AS1BinomialExpansionSVG-002
source: Dr Frost Maths P1 Chapter 8 Binomial Expansion slides pages 5 and 13; Chapter 8 transcript
related_lesson_section: Core Theory 8.2 and 8.6
purpose: Display Pascal’s triangle with row indexing from row 0 and entries as binomial coefficients.
linked_LOs: AS1-SS-LO001, AS1-SS-LO002
