<!--
asset_id: AS1BinomialExpansionSVG-001
source: Dr Frost Maths P1 Chapter 8 Binomial Expansion slides pages 4-6; Chapter 8 transcript
related_lesson_section: Core Theory 8.1-8.3; Worked Example 1
purpose: Show the pattern from (a+b)^0 to (a+b)^4, highlighting Pascal coefficients and the decreasing/increasing powers.
linked_LOs: AS1-SS-LO001
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Binomial expansion pattern from (a+b)^0 to (a+b)^4</title>
  <desc id="desc">A teaching diagram showing powers of a decreasing, powers of b increasing, and coefficients following Pascal's triangle.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#333333"/></marker></defs>
  <rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#111111">Looking for patterns in expanding binomials</text>
  <rect x="60" y="100" width="1080" height="3" fill="#111111"/>
  <text x="80" y="155" font-family="Arial, sans-serif" font-size="26" fill="#111111">(a+b)⁰ =</text><text x="470" y="155" font-family="Arial, sans-serif" font-size="28" fill="#111111">1</text>
  <text x="80" y="215" font-family="Arial, sans-serif" font-size="26" fill="#111111">(a+b)¹ =</text><text x="430" y="215" font-family="Arial, sans-serif" font-size="28" fill="#111111">1a</text><text x="515" y="215" font-family="Arial, sans-serif" font-size="28" fill="#111111">+</text><text x="565" y="215" font-family="Arial, sans-serif" font-size="28" fill="#111111">1b</text>
  <text x="80" y="275" font-family="Arial, sans-serif" font-size="26" fill="#111111">(a+b)² =</text><text x="360" y="275" font-family="Arial, sans-serif" font-size="28" fill="#111111">1a²</text><text x="460" y="275" font-family="Arial, sans-serif" font-size="28" fill="#111111">+</text><text x="510" y="275" font-family="Arial, sans-serif" font-size="28" fill="#111111">2ab</text><text x="625" y="275" font-family="Arial, sans-serif" font-size="28" fill="#111111">+</text><text x="675" y="275" font-family="Arial, sans-serif" font-size="28" fill="#111111">1b²</text>
  <text x="80" y="335" font-family="Arial, sans-serif" font-size="26" fill="#111111">(a+b)³ =</text><text x="290" y="335" font-family="Arial, sans-serif" font-size="28" fill="#111111">1a³</text><text x="390" y="335" font-family="Arial, sans-serif" font-size="28" fill="#111111">+</text><text x="440" y="335" font-family="Arial, sans-serif" font-size="28" fill="#111111">3a²b</text><text x="570" y="335" font-family="Arial, sans-serif" font-size="28" fill="#111111">+</text><text x="620" y="335" font-family="Arial, sans-serif" font-size="28" fill="#111111">3ab²</text><text x="750" y="335" font-family="Arial, sans-serif" font-size="28" fill="#111111">+</text><text x="800" y="335" font-family="Arial, sans-serif" font-size="28" fill="#111111">1b³</text>
  <text x="80" y="395" font-family="Arial, sans-serif" font-size="26" fill="#111111">(a+b)⁴ =</text><text x="210" y="395" font-family="Arial, sans-serif" font-size="28" fill="#111111">1a⁴</text><text x="310" y="395" font-family="Arial, sans-serif" font-size="28" fill="#111111">+</text><text x="360" y="395" font-family="Arial, sans-serif" font-size="28" fill="#111111">4a³b</text><text x="490" y="395" font-family="Arial, sans-serif" font-size="28" fill="#111111">+</text><text x="540" y="395" font-family="Arial, sans-serif" font-size="28" fill="#111111">6a²b²</text><text x="690" y="395" font-family="Arial, sans-serif" font-size="28" fill="#111111">+</text><text x="740" y="395" font-family="Arial, sans-serif" font-size="28" fill="#111111">4ab³</text><text x="870" y="395" font-family="Arial, sans-serif" font-size="28" fill="#111111">+</text><text x="920" y="395" font-family="Arial, sans-serif" font-size="28" fill="#111111">1b⁴</text>
  <rect x="110" y="465" width="430" height="170" rx="16" fill="#f5f5f5" stroke="#222222" stroke-width="2"/>
  <text x="135" y="505" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111111">Coefficients</text>
  <text x="135" y="545" font-family="Arial, sans-serif" font-size="22" fill="#111111">1   1 1   1 2 1   1 3 3 1</text>
  <text x="135" y="595" font-family="Arial, sans-serif" font-size="22" fill="#111111">They follow Pascal’s triangle.</text>
  <rect x="650" y="465" width="430" height="170" rx="16" fill="#f5f5f5" stroke="#222222" stroke-width="2"/>
  <text x="675" y="505" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111111">Powers</text>
  <text x="675" y="545" font-family="Arial, sans-serif" font-size="22" fill="#111111">Power of a decreases: 4, 3, 2, 1, 0</text>
  <text x="675" y="585" font-family="Arial, sans-serif" font-size="22" fill="#111111">Power of b increases: 0, 1, 2, 3, 4</text>
  <text x="60" y="710" font-family="Arial, sans-serif" font-size="20" fill="#333333">Exam spark: every term in (a+b)⁴ has powers adding to 4. The same idea works for any positive integer n.</text>
</svg>
