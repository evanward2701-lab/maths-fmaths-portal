<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
<title id="title">Signed areas for y equals x times x minus 1 times x minus 2</title>
<desc id="desc">A cubic curve crosses the x-axis at 0, 1 and 2, with positive and negative signed areas shaded.</desc>
<rect width="1000" height="650" fill="#ffffff"/>

<text x="60" y="60" font-family="Arial" font-size="32" font-weight="700">Signed area</text>
<line x1="110" y1="330" x2="700" y2="330" stroke="#222" stroke-width="3"/>
<line x1="110" y1="530" x2="110" y2="120" stroke="#222" stroke-width="3"/>
<path d="M170,330 C230,250 310,250 370,330 Z" fill="#90be6d" opacity="0.65"/>
<path d="M370,330 C430,410 520,410 580,330 Z" fill="#f94144" opacity="0.50"/>
<path d="M140,430 C160,360 165,340 170,330 C230,250 310,250 370,330 C430,410 520,410 580,330 C630,275 675,240 710,220" fill="none" stroke="#1d3557" stroke-width="5"/>
<circle cx="170" cy="330" r="7" fill="#222"/><circle cx="370" cy="330" r="7" fill="#222"/><circle cx="580" cy="330" r="7" fill="#222"/>
<text x="164" y="365" font-family="Arial" font-size="22">0</text><text x="364" y="365" font-family="Arial" font-size="22">1</text><text x="574" y="365" font-family="Arial" font-size="22">2</text>
<text x="230" y="235" font-family="Arial" font-size="24" fill="#386641">positive</text>
<text x="430" y="455" font-family="Arial" font-size="24" fill="#9d0208">negative</text>
<rect x="740" y="140" width="210" height="120" rx="12" fill="#f0fff1" stroke="#90be6d"/>
<text x="760" y="180" font-family="Arial" font-size="22">0 to 1:</text><text x="760" y="215" font-family="Arial" font-size="20">+ area</text>
<rect x="740" y="300" width="210" height="120" rx="12" fill="#fff1f1" stroke="#f94144"/>
<text x="760" y="340" font-family="Arial" font-size="22">1 to 2:</text><text x="760" y="375" font-family="Arial" font-size="20">− area</text>
<text x="225" y="590" font-family="Arial" font-size="23">Signed integral from 0 to 2 is 0; total area is 1/2.</text>

</svg>
