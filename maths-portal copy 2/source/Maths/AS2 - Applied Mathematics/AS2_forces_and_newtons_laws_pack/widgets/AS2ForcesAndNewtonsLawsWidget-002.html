<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{font-family:Arial,sans-serif;background:#f3f4f6;color:#111827;margin:0;padding:24px}
.card{max-width:900px;margin:auto;background:white;border:2px solid #111827;border-radius:18px;padding:24px;box-shadow:0 12px 30px rgba(0,0,0,.12)}
h1{margin-top:0} .meta{background:#eef2ff;border-left:6px solid #4f46e5;border-radius:10px;padding:12px;margin:16px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px} label{font-weight:700;display:block} input{width:100%;box-sizing:border-box;padding:10px;border:2px solid #d1d5db;border-radius:10px;margin-top:6px}
button{margin-top:16px;padding:12px 18px;border:0;border-radius:10px;background:#111827;color:white;font-weight:700;cursor:pointer}
#out{margin-top:18px;padding:16px;background:#f9fafb;border:2px solid #e5e7eb;border-radius:14px;line-height:1.7}
.warn{margin-top:16px;background:#fff7ed;border-left:6px solid #f97316;border-radius:10px;padding:12px}
</style></head><body><main class="card"><h1>F=ma and SUVAT Bridge</h1><div class="meta"><b>Asset ID:</b> AS2ForcesAndNewtonsLawsWidget-002<br><b>Purpose:</b> Find acceleration from resultant force and use it in SUVAT.</div><div class="grid"><label>Forward force / N<input id="forward" type="number" value="20" step="0.1"></label>
<label>Resistance / N<input id="res" type="number" value="4" step="0.1"></label>
<label>Mass / kg<input id="mass" type="number" value="5" step="0.1"></label>
<label>Initial speed u / m s^-1<input id="u" type="number" value="0" step="0.1"></label>
<label>Time t / s<input id="t" type="number" value="4" step="0.1"></label></div><button onclick="calc()">Calculate</button><div id="out" aria-live="polite"></div><div class="warn"><b>Mechanics reminder:</b> choose directions before using equations and keep forces attached to the body being considered.</div></main><script>function calc(){
const forward=+document.getElementById('forward').value, res=+document.getElementById('res').value, m=+document.getElementById('mass').value, u=+document.getElementById('u').value, t=+document.getElementById('t').value;
const F=forward-res, a=F/m, s=u*t+0.5*a*t*t, v=u+a*t;
document.getElementById('out').innerHTML=`F=${forward}-${res}=${F.toFixed(3)} N<br>${F.toFixed(3)}=${m}a, so a=${a.toFixed(3)} m s⁻²<br>s=ut+½at²=${s.toFixed(3)} m<br>v=u+at=${v.toFixed(3)} m s⁻¹`;} calc();</script></body></html>
