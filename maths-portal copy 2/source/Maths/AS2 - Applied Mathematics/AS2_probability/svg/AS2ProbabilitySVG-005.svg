<svg xmlns="http://www.w3.org/2000/svg" width="980" height="720" viewBox="0 0 980 720"><rect x="20" y="20" width="940" height="680" rx="18" fill="#fff" stroke="#222" stroke-width="3"/><text x="490" y="62" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700">Three-set Venn: fill from the centre outwards</text><rect x="90" y="110" width="560" height="460" rx="10" fill="#fafafa" stroke="#333" stroke-width="3"/><circle cx="300" cy="335" r="150" fill="#d9ecff" fill-opacity="0.62" stroke="#1f77b4" stroke-width="4"/><circle cx="440" cy="335" r="150" fill="#ffe1ad" fill-opacity="0.62" stroke="#d98500" stroke-width="4"/><circle cx="370" cy="445" r="150" fill="#dcf5dc" fill-opacity="0.62" stroke="#2ca02c" stroke-width="4"/><text x="185" y="235" font-family="Arial" font-size="30" font-weight="700" fill="#1f77b4">D</text><text x="520" y="235" font-family="Arial" font-size="30" font-weight="700" fill="#b35f00">C</text><text x="370" y="610" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#228b22">F</text><g font-family="Arial" font-size="30" font-weight="700" text-anchor="middle"><text x="235" y="350">6</text><text x="505" y="350">35</text><text x="370" y="520">26</text><text x="370" y="315">8</text><text x="300" y="430">4</text><text x="440" y="430">3</text><text x="370" y="392">7</text><text x="605" y="530">11</text></g><rect x="690" y="135" width="230" height="385" rx="14" fill="#f7f7f7" stroke="#ccc"/><text x="805" y="175" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700">Method</text><g font-family="Arial" font-size="19"><text x="712" y="220">1. Put all three in</text><text x="712" y="292">2. Subtract centre</text><text x="712" y="364">3. Subtract overlaps</text><text x="712" y="436">4. Outside = total minus inside</text></g></svg>