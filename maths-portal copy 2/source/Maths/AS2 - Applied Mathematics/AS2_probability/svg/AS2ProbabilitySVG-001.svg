<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">Sample space with even and prime events</title><desc id="desc">Sample-space rectangle S for die outcomes. Event E contains 2,4,6 and event P contains 2,3,5.</desc>
<rect x="20" y="20" width="860" height="520" rx="18" fill="#fff" stroke="#222" stroke-width="3"/><text x="38" y="58" font-family="Arial" font-size="30" font-weight="700">S</text><text x="450" y="58" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">Die sample space</text>
<ellipse cx="360" cy="310" rx="285" ry="135" fill="#d9ecff" fill-opacity="0.78" stroke="#1f77b4" stroke-width="4"/><ellipse cx="500" cy="255" rx="130" ry="230" fill="#ffe4b8" fill-opacity="0.78" stroke="#d98500" stroke-width="4"/>
<text x="120" y="440" font-family="Arial" font-size="28" font-weight="700" fill="#1f77b4">E = even</text><text x="590" y="145" font-family="Arial" font-size="28" font-weight="700" fill="#b35f00">P = prime</text>
<g font-family="Arial" font-size="46" text-anchor="middle"><text x="190" y="250">1</text><text x="500" y="310" font-weight="700">2</text><text x="540" y="190">3</text><text x="210" y="335">4</text><text x="425" y="190">5</text><text x="665" y="340">6</text></g>
<rect x="55" y="470" width="790" height="48" rx="10" fill="#f7f7f7" stroke="#ccc"/><text x="450" y="502" text-anchor="middle" font-family="Arial" font-size="22">E ∩ P = {2}; neither even nor prime = {1}</text></svg>