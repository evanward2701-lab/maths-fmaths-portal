<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620"><rect x="20" y="20" width="1000" height="580" rx="18" fill="#fff" stroke="#222" stroke-width="3"/><text x="520" y="62" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700">Do not mix up mutually exclusive and independent</text><rect x="70" y="115" width="420" height="360" rx="14" fill="#fafafa" stroke="#333" stroke-width="2"/><text x="280" y="155" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700">Mutually exclusive</text><rect x="120" y="190" width="320" height="170" fill="#fff" stroke="#333" stroke-width="2"/><circle cx="230" cy="275" r="55" fill="#d9ecff" stroke="#1f77b4" stroke-width="4"/><circle cx="335" cy="275" r="55" fill="#ffe1ad" stroke="#d98500" stroke-width="4"/><text x="280" y="405" text-anchor="middle" font-family="Arial" font-size="24">P(A ∩ B) = 0</text><rect x="550" y="115" width="420" height="360" rx="14" fill="#fafafa" stroke="#333" stroke-width="2"/><text x="760" y="155" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700">Independent</text><rect x="600" y="190" width="320" height="170" fill="#fff" stroke="#333" stroke-width="2"/><circle cx="720" cy="275" r="70" fill="#d9ecff" fill-opacity="0.74" stroke="#1f77b4" stroke-width="4"/><circle cx="805" cy="275" r="70" fill="#ffe1ad" fill-opacity="0.74" stroke="#d98500" stroke-width="4"/><text x="760" y="405" text-anchor="middle" font-family="Arial" font-size="24">P(A ∩ B) = P(A)P(B)</text></svg>