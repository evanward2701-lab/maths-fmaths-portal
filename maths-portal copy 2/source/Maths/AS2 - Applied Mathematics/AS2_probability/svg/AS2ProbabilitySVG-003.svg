<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560"><rect x="20" y="20" width="940" height="520" rx="18" fill="#fff" stroke="#222" stroke-width="3"/><text x="490" y="62" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700">Addition law: avoid double-counting the overlap</text><rect x="80" y="115" width="500" height="330" rx="10" fill="#fafafa" stroke="#333" stroke-width="2"/><circle cx="280" cy="285" r="120" fill="#d9ecff" fill-opacity="0.82" stroke="#1f77b4" stroke-width="4"/><circle cx="390" cy="285" r="120" fill="#ffe1ad" fill-opacity="0.82" stroke="#d98500" stroke-width="4"/><text x="225" y="210" font-family="Arial" font-size="32" font-weight="700" fill="#1f77b4">A</text><text x="440" y="210" font-family="Arial" font-size="32" font-weight="700" fill="#b35f00">B</text><text x="335" y="292" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700">A ∩ B</text><rect x="630" y="135" width="290" height="260" rx="14" fill="#f7f7f7" stroke="#ccc"/><text x="775" y="178" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700">General rule</text><text x="775" y="232" text-anchor="middle" font-family="Arial" font-size="24">P(A ∪ B)</text><text x="775" y="268" text-anchor="middle" font-family="Arial" font-size="24">= P(A) + P(B)</text><text x="775" y="304" text-anchor="middle" font-family="Arial" font-size="24">− P(A ∩ B)</text></svg>