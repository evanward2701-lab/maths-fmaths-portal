<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A22 Maxima Decision Trainer</title><style>body{font-family:Arial,sans-serif;background:#f7f7fb;margin:0;color:#111}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:white;border:1px solid #ddd;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 6px 18px #0001}button{background:#e5e7eb;border:0;border-radius:10px;padding:10px 12px;font-weight:bold;margin:5px}select{width:100%;padding:10px;border-radius:10px}.ok{color:#166534;font-weight:bold}.bad{color:#b91c1c;font-weight:bold}.formula{font-family:monospace;background:#f1f5f9;padding:10px;border-radius:10px}</style></head><body><main class="wrap"><div class="card"><h1>Maxima Decision Trainer</h1><select id="q" onchange="show()"><option value="maxS">Maximum displacement</option><option value="maxV">Maximum velocity</option><option value="speed">Greatest speed</option><option value="rest">Instantaneously at rest</option><option value="distance">Total distance travelled</option></select><p id="prompt"></p><button onclick="check('v0')">Solve v=0</button><button onclick="check('a0')">Solve a=0</button><button onclick="check('abs')">Compare |v|</button><button onclick="check('int')">Integrate and split</button><div id="out"></div></div><div class="card"><p class="formula">Maximum s: v=0. Maximum v: a=0. Greatest speed: compare |v|. Distance: split at v=0 and add magnitudes.</p></div></main><script>let data={maxS:['Maximum displacement: what first?','v0','Correct: ds/dt=0, so v=0.'],maxV:['Maximum velocity: what first?','a0','Correct: dv/dt=0, so a=0.'],speed:['Greatest speed in an interval: what first?','abs','Correct: compare |v| at endpoints and stationary points.'],rest:['Instantaneously at rest: what first?','v0','Correct: rest means v=0.'],distance:['Total distance travelled with sign changes: what first?','int','Correct: solve v=0, split, integrate, add magnitudes.']};function show(){prompt.textContent=data[q.value][0];out.innerHTML=''}function check(x){out.innerHTML=x==data[q.value][1]?'<p class=ok>'+data[q.value][2]+'</p>':'<p class=bad>Not this time. Use the s → v → a chain.</p>'}show()</script></body></html>
