<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A22 Variable Acceleration Chain Explorer</title><style>body{font-family:Arial,sans-serif;background:#f7f7fb;color:#111;margin:0}.wrap{max-width:960px;margin:auto;padding:24px}.card{background:white;border:1px solid #ddd;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 6px 18px #0001}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}input,select{padding:10px;border:1px solid #ccc;border-radius:10px;width:100%}button{background:#2563eb;color:white;border:0;border-radius:10px;padding:10px 14px;font-weight:bold;margin-top:10px}.formula{font-family:monospace;background:#f1f5f9;padding:10px;border-radius:10px;margin:8px 0}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><div class="card"><h1>A22 Variable Acceleration: Calculus Chain Explorer</h1><p>Enter coefficients for c₄t⁴ + c₃t³ + c₂t² + c₁t + c₀ and choose whether the function is s(t), v(t) or a(t).</p><p class="formula">s → differentiate → v → differentiate → a</p><p class="formula">a → integrate → v → integrate → s</p></div><div class="card"><label>Given function type</label><select id="kind"><option value="s">s(t)</option><option value="v">v(t)</option><option value="a">a(t)</option></select><div class="grid"><input id="c4" value="1"><input id="c3" value="0"><input id="c2" value="0"><input id="c1" value="-32"><input id="c0" value="14"></div><button onclick="build()">Build chain</button><button onclick="loadv()">Load velocity example</button><div id="out"></div></div></main><script>function read(){return[+c0.value,+c1.value,+c2.value,+c3.value,+c4.value]}function trim(p){while(p.length>1&&Math.abs(p[p.length-1])<1e-9)p.pop();return p}function d(p){let r=[];for(let i=1;i<p.length;i++)r.push(p[i]*i);return trim(r.length?r:[0])}function I(p){let r=[0];for(let i=0;i<p.length;i++)r.push(p[i]/(i+1));return trim(r)}function fmt(x){return Math.abs(x)<1e-9?'0':String(Math.round(x*1e5)/1e5)}function poly(p){p=trim(p.slice());let a=[];for(let i=p.length-1;i>=0;i--){let c=p[i];if(Math.abs(c)<1e-9)continue;let s=c<0?'-':'+';let ac=Math.abs(c);let term=(i==0?fmt(ac):(Math.abs(ac-1)<1e-9?'':fmt(ac))+(i==1?'t':'t^'+i));a.push([s,term])}if(!a.length)return'0';let o=(a[0][0]=='-'?'-':'')+a[0][1];for(let i=1;i<a.length;i++)o+=' '+a[i][0]+' '+a[i][1];return o}function build(){let g=trim(read()),s,v,a;if(kind.value=='s'){s=g;v=d(s);a=d(v)}if(kind.value=='v'){v=g;s=I(v);a=d(v)}if(kind.value=='a'){a=g;v=I(a);s=I(v)}out.innerHTML='<div class=formula>s(t) = '+poly(s)+'</div><div class=formula>v(t) = '+poly(v)+'</div><div class=formula>a(t) = '+poly(a)+'</div>'}function loadv(){kind.value='v';c4.value=0;c3.value=0;c2.value=2;c1.value=-16;c0.value=24;build()}build()</script></body></html>
