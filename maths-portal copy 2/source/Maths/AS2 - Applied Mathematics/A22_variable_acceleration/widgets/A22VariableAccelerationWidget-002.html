<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A22 Distance versus Displacement</title><style>body{font-family:Arial,sans-serif;background:#f7f7fb;margin:0;color:#111}.wrap{max-width:960px;margin:auto;padding:24px}.card{background:white;border:1px solid #ddd;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 6px 18px #0001}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}input{padding:10px;border:1px solid #ccc;border-radius:10px;width:100%}button{background:#2563eb;color:white;border:0;border-radius:10px;padding:10px 14px;font-weight:bold;margin-top:10px}.formula{font-family:monospace;background:#f1f5f9;padding:10px;border-radius:10px;margin:8px 0}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="card"><h1>Distance versus Displacement</h1><p>For v(t)=at²+bt+c, displacement is a signed integral. Distance travelled splits at roots of v(t)=0 and adds magnitudes.</p></div><div class="card"><div class="grid"><input id="a" value="2"><input id="b" value="-9"><input id="c" value="4"><input id="L" value="0"><input id="R" value="5"></div><button onclick="calc()">Calculate</button><div id="out"></div></div></main><script>function F(t,a,b,c){return a*t*t*t/3+b*t*t/2+c*t}function roots(a,b,c,L,R){let d=b*b-4*a*c,rs=[];if(d>=0){rs=[(-b-Math.sqrt(d))/(2*a),(-b+Math.sqrt(d))/(2*a)]}return rs.filter(x=>x>L&&x<R).sort((x,y)=>x-y)}function f(x){return Math.round(x*1e5)/1e5}function calc(){let A=+a.value,B=+b.value,C=+c.value,l=+L.value,r=+R.value,rs=roots(A,B,C,l,r),pts=[l,...rs,r],disp=F(r,A,B,C)-F(l,A,B,C),dist=0,html='<p class=formula>Roots inside interval: '+(rs.length?rs.map(f).join(', '):'none')+'</p><p class=formula>Displacement = '+f(disp)+'</p>';for(let i=0;i<pts.length-1;i++){let ar=F(pts[i+1],A,B,C)-F(pts[i],A,B,C);dist+=Math.abs(ar);html+='<p class=formula>['+f(pts[i])+', '+f(pts[i+1])+'] signed area = '+f(ar)+'</p>'}html+='<p class=formula>Total distance = '+f(dist)+'</p>';out.innerHTML=html}calc()</script></body></html>
