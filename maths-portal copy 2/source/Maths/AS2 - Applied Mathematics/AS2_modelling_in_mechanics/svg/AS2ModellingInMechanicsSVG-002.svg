<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Scalar distance and vector displacement</title><desc id="desc">Scalar versus vector quantities and a one-dimensional signed displacement example.</desc><rect width="1200" height="560" fill="#fff"/><text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700">Scalars and vectors in mechanics</text><rect x="90" y="110" width="430" height="220" rx="24" fill="#eef7ee" stroke="#222" stroke-width="3"/><text x="305" y="155" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700">Scalar</text><text x="130" y="205" font-family="Arial" font-size="23">Magnitude only</text><text x="130" y="250" font-family="Arial" font-size="23">Examples: distance, speed</text><text x="130" y="295" font-family="Arial" font-size="23">Distance is always positive</text><rect x="680" y="110" width="430" height="220" rx="24" fill="#eef3fb" stroke="#222" stroke-width="3"/><text x="895" y="155" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700">Vector</text><text x="720" y="205" font-family="Arial" font-size="23">Magnitude and direction</text><text x="720" y="250" font-family="Arial" font-size="23">Examples: displacement, velocity</text><text x="720" y="295" font-family="Arial" font-size="23">Can be positive or negative in 1D</text><text x="600" y="390" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700">One-dimensional example</text><line x1="230" y1="455" x2="970" y2="455" stroke="#222" stroke-width="4"/><polygon points="970,455 945,442 945,468" fill="#222"/><text x="600" y="430" text-anchor="middle" font-family="Arial" font-size="21">Positive direction</text><circle cx="785" cy="455" r="12" fill="#222"/><text x="785" y="498" text-anchor="middle" font-family="Arial" font-size="22">Start</text><circle cx="455" cy="455" r="12" fill="#222"/><text x="455" y="498" text-anchor="middle" font-family="Arial" font-size="22">Finish</text><line x1="785" y1="475" x2="455" y2="475" stroke="#4472c4" stroke-width="5" stroke-dasharray="10 8"/><polygon points="455,475 480,462 480,488" fill="#4472c4"/><text x="600" y="530" text-anchor="middle" font-family="Arial" font-size="24">Distance = 3 m, but displacement = -3 m</text></svg>
