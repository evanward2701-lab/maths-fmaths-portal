<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700">Common modelling assumptions</text><text x="600" y="92" text-anchor="middle" font-family="Arial" font-size="21">Meaning plus calculation consequence</text><g font-family="Arial"><rect x="55" y="125" width="335" height="155" rx="20" fill="#eef7ee" stroke="#222" stroke-width="2"/><text x="75" y="160" font-size="25" font-weight="700">Particle</text><text x="75" y="198" font-size="19">Dimensions are negligible.</text><text x="75" y="228" font-size="19">Mass at a single point.</text><text x="75" y="258" font-size="19">Ignore rotation and air resistance.</text><rect x="430" y="125" width="335" height="155" rx="20" fill="#eef3fb" stroke="#222" stroke-width="2"/><text x="450" y="160" font-size="25" font-weight="700">Smooth surface</text><text x="450" y="198" font-size="19">No friction.</text><text x="450" y="228" font-size="19">Frictional force can be ignored.</text><rect x="805" y="125" width="335" height="155" rx="20" fill="#fff2cc" stroke="#222" stroke-width="2"/><text x="825" y="160" font-size="25" font-weight="700">Rough surface</text><text x="825" y="198" font-size="19">Friction is present.</text><text x="825" y="228" font-size="19">Include a friction force.</text><rect x="55" y="320" width="335" height="170" rx="20" fill="#fff2cc" stroke="#222" stroke-width="2"/><text x="75" y="355" font-size="25" font-weight="700">Smooth/light pulley</text><text x="75" y="393" font-size="19">No friction.</text><text x="75" y="423" font-size="19">Pulley has no mass.</text><text x="75" y="453" font-size="19">Tension same on both sides.</text><rect x="430" y="320" width="335" height="170" rx="20" fill="#eef7ee" stroke="#222" stroke-width="2"/><text x="450" y="355" font-size="25" font-weight="700">Inextensible string</text><text x="450" y="393" font-size="19">String does not stretch.</text><text x="450" y="423" font-size="19">Connected objects have</text><text x="450" y="453" font-size="19">the same acceleration.</text><rect x="805" y="320" width="335" height="170" rx="20" fill="#eef3fb" stroke="#222" stroke-width="2"/><text x="825" y="355" font-size="25" font-weight="700">Rod</text><text x="825" y="393" font-size="19">One dimension negligible.</text><text x="825" y="423" font-size="19">Mass concentrated along a line.</text><text x="825" y="453" font-size="19">Rigid.</text><rect x="250" y="535" width="700" height="135" rx="20" fill="#f7f7f7" stroke="#222" stroke-width="2"/><text x="280" y="572" font-size="25" font-weight="700">Peg or support</text><text x="280" y="612" font-size="20">A dimensionless and fixed support from which a body can be suspended or rested.</text><text x="280" y="642" font-size="20">Can be rough or smooth depending on the question.</text></g><text x="600" y="720" text-anchor="middle" font-family="Arial" font-size="21">Exam note: state the consequence used in the calculation, not just the definition.</text></svg>
