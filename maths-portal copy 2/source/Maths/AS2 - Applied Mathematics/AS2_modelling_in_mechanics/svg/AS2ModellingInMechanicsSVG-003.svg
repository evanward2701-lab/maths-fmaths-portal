<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#ffffff"/><text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700">SI units used in mechanics</text><rect x="120" y="100" width="960" height="430" fill="#f7f7f7" stroke="#222" stroke-width="3"/><rect x="120" y="100" width="960" height="60" fill="#222"/><text x="250" y="140" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#fff">Quantity</text><text x="600" y="140" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#fff">Unit</text><text x="930" y="140" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#fff">Symbol</text><line x1="430" y1="100" x2="430" y2="530" stroke="#222" stroke-width="2"/><line x1="770" y1="100" x2="770" y2="530" stroke="#222" stroke-width="2"/><g font-family="Arial" font-size="22"><line x1="120" y1="220" x2="1080" y2="220" stroke="#bbb" stroke-width="2"/><line x1="120" y1="280" x2="1080" y2="280" stroke="#bbb" stroke-width="2"/><line x1="120" y1="340" x2="1080" y2="340" stroke="#bbb" stroke-width="2"/><line x1="120" y1="400" x2="1080" y2="400" stroke="#bbb" stroke-width="2"/><line x1="120" y1="460" x2="1080" y2="460" stroke="#bbb" stroke-width="2"/><text x="150" y="200">Mass</text><text x="465" y="200">kilogram</text><text x="805" y="200">kg</text><text x="150" y="260">Length or displacement</text><text x="465" y="260">metre</text><text x="805" y="260">m</text><text x="150" y="320">Time</text><text x="465" y="320">second</text><text x="805" y="320">s</text><text x="150" y="380">Speed or velocity</text><text x="465" y="380">metres per second</text><text x="805" y="380">m s^-1</text><text x="150" y="440">Acceleration</text><text x="465" y="440">metres per second per second</text><text x="805" y="440">m s^-2</text><text x="150" y="500">Force or weight</text><text x="465" y="500">newton</text><text x="805" y="500">N = kg m s^-2</text></g><text x="600" y="580" text-anchor="middle" font-family="Arial" font-size="22">Convert into these units before substituting into mechanics formulae.</text></svg>
