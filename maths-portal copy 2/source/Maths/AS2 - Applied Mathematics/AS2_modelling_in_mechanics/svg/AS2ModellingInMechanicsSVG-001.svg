<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Mechanics overview: forces, motion and F equals ma</title>
  <desc id="desc">A mechanics overview diagram showing forces on the left, motion on the right, and F equals ma as the bridge between them.</desc>
  <rect width="1200" height="520" fill="#ffffff"/>
  <text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700">Mechanics: motion, forces, and how they interrelate</text>
  <rect x="70" y="120" width="330" height="280" rx="24" fill="#f3f6fb" stroke="#222" stroke-width="3"/>
  <text x="235" y="165" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700">Forces</text>
  <text x="105" y="215" font-family="Arial" font-size="22">• Weight</text><text x="105" y="255" font-family="Arial" font-size="22">• Friction</text><text x="105" y="295" font-family="Arial" font-size="22">• Tension</text><text x="105" y="335" font-family="Arial" font-size="22">• Reaction force</text>
  <rect x="435" y="180" width="330" height="160" rx="18" fill="#fff2cc" stroke="#222" stroke-width="3"/>
  <text x="600" y="240" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700">The bridge</text><text x="600" y="295" text-anchor="middle" font-family="Arial" font-size="42" font-style="italic">F = ma</text>
  <rect x="800" y="120" width="330" height="280" rx="24" fill="#f3f6fb" stroke="#222" stroke-width="3"/>
  <text x="965" y="165" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700">Motion</text>
  <text x="835" y="215" font-family="Arial" font-size="22">• Displacement</text><text x="835" y="255" font-family="Arial" font-size="22">• Velocity</text><text x="835" y="295" font-family="Arial" font-size="22">• Acceleration</text><text x="835" y="335" font-family="Arial" font-size="22">• Time</text>
  <line x1="400" y1="260" x2="435" y2="260" stroke="#222" stroke-width="6"/><polygon points="435,260 414,248 414,272" fill="#222"/>
  <line x1="765" y1="260" x2="800" y2="260" stroke="#222" stroke-width="6"/><polygon points="800,260 779,248 779,272" fill="#222"/>
  <text x="600" y="455" text-anchor="middle" font-family="Arial" font-size="24">Resultant force acting on a mass produces acceleration.</text>
</svg>
