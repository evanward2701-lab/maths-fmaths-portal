<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">Three coin toss sample space grouped by number of heads</title><desc id="desc">All eight outcomes for three coin tosses grouped by number of heads.</desc>
  <style>.bg{fill:#fbfbfd}.title{font:700 32px Arial,sans-serif;fill:#111827}.subtitle{font:400 18px Arial,sans-serif;fill:#374151}.box{fill:#fff;stroke:#1f2937;stroke-width:2;rx:16}.group0{fill:#fee2e2;stroke:#dc2626;stroke-width:2;rx:14}.group1{fill:#ffedd5;stroke:#ea580c;stroke-width:2;rx:14}.group2{fill:#dbeafe;stroke:#2563eb;stroke-width:2;rx:14}.group3{fill:#dcfce7;stroke:#16a34a;stroke-width:2;rx:14}.label{font:700 20px Arial,sans-serif;fill:#111827}.text{font:400 18px Arial,sans-serif;fill:#111827}.outcome{font:700 22px 'Courier New',monospace;fill:#111827;text-anchor:middle}.note{font:400 16px Arial,sans-serif;fill:#4b5563}.tableText{font:700 19px Arial,sans-serif;fill:#111827;text-anchor:middle;dominant-baseline:middle}</style>
  <rect class="bg" width="1100" height="720"/><text x="60" y="58" class="title">Sample space for three coin tosses</text><text x="60" y="92" class="subtitle">Let X be the number of heads. There are 8 equally likely outcomes.</text>
  <rect x="60" y="125" width="980" height="270" class="box"/><text x="90" y="165" class="label">Underlying sample space</text>
  <rect x="95" y="200" width="110" height="70" class="group3"/><text x="150" y="242" class="outcome">HHH</text><text x="150" y="292" class="text" text-anchor="middle">X = 3</text>
  <rect x="245" y="200" width="110" height="70" class="group2"/><text x="300" y="242" class="outcome">HHT</text><rect x="375" y="200" width="110" height="70" class="group2"/><text x="430" y="242" class="outcome">HTH</text><rect x="505" y="200" width="110" height="70" class="group2"/><text x="560" y="242" class="outcome">THH</text><text x="430" y="292" class="text" text-anchor="middle">X = 2</text>
  <rect x="645" y="200" width="110" height="70" class="group1"/><text x="700" y="242" class="outcome">HTT</text><rect x="775" y="200" width="110" height="70" class="group1"/><text x="830" y="242" class="outcome">THT</text><rect x="905" y="200" width="110" height="70" class="group1"/><text x="960" y="242" class="outcome">TTH</text><text x="830" y="292" class="text" text-anchor="middle">X = 1</text>
  <rect x="95" y="310" width="110" height="55" class="group0"/><text x="150" y="345" class="outcome">TTT</text><text x="245" y="343" class="text">X = 0</text>
  <rect x="150" y="440" width="800" height="175" class="box"/><text x="180" y="480" class="label">Distribution table</text>
  <rect x="250" y="505" width="600" height="80" fill="#fff" stroke="#111827" stroke-width="2"/><line x1="250" y1="545" x2="850" y2="545" stroke="#111827" stroke-width="2"/><line x1="370" y1="505" x2="370" y2="585" stroke="#111827" stroke-width="2"/><line x1="490" y1="505" x2="490" y2="585" stroke="#111827" stroke-width="2"/><line x1="610" y1="505" x2="610" y2="585" stroke="#111827" stroke-width="2"/><line x1="730" y1="505" x2="730" y2="585" stroke="#111827" stroke-width="2"/>
  <text x="310" y="525" class="tableText">x</text><text x="430" y="525" class="tableText">0</text><text x="550" y="525" class="tableText">1</text><text x="670" y="525" class="tableText">2</text><text x="790" y="525" class="tableText">3</text>
  <text x="310" y="565" class="tableText">P(X = x)</text><text x="430" y="565" class="tableText">1/8</text><text x="550" y="565" class="tableText">3/8</text><text x="670" y="565" class="tableText">3/8</text><text x="790" y="565" class="tableText">1/8</text>
  <text x="60" y="670" class="note">Asset ID: AS2StatisticalDistributionsSVG-002 | Section: Worked Example 1 | Purpose: sample space to distribution table.</text>
</svg>
