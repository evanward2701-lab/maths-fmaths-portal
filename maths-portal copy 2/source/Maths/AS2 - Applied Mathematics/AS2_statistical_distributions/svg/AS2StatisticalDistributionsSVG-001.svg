<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
  <title id="title">Probability distribution as a table and a function</title>
  <desc id="desc">A teaching diagram showing the same discrete probability distribution represented as a table and as a piecewise function.</desc>
  <style>.bg{fill:#fbfbfd}.title{font:700 34px Arial,sans-serif;fill:#111827}.subtitle{font:400 18px Arial,sans-serif;fill:#374151}.box{fill:#fff;stroke:#1f2937;stroke-width:2;rx:18}.smallbox{fill:#f3f4f6;stroke:#6b7280;stroke-width:1.5;rx:12}.label{font:700 20px Arial,sans-serif;fill:#111827}.text{font:400 18px Arial,sans-serif;fill:#111827}.math{font:400 22px 'Times New Roman',serif;fill:#111827}.tableText{font:700 20px Arial,sans-serif;fill:#111827;text-anchor:middle;dominant-baseline:middle}.note{font:400 16px Arial,sans-serif;fill:#4b5563}.arrow{stroke:#111827;stroke-width:3;fill:none;marker-end:url(#arrowhead)}.accent{fill:#dbeafe;stroke:#2563eb;stroke-width:2;rx:12}.green{fill:#dcfce7;stroke:#16a34a;stroke-width:2;rx:12}</style>
  <defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111827"/></marker></defs>
  <rect class="bg" width="1100" height="660"/>
  <text x="60" y="58" class="title">Probability distributions</text>
  <text x="60" y="92" class="subtitle">A random variable X has possible outcomes x, each with probability P(X = x), also written p(x).</text>
  <rect x="60" y="130" width="460" height="390" class="box"/>
  <text x="90" y="172" class="label">As a table</text>
  <rect x="110" y="215" width="360" height="140" fill="#fff" stroke="#111827" stroke-width="2"/>
  <line x1="110" y1="285" x2="470" y2="285" stroke="#111827" stroke-width="2"/>
  <line x1="182" y1="215" x2="182" y2="355" stroke="#111827" stroke-width="2"/>
  <line x1="254" y1="215" x2="254" y2="355" stroke="#111827" stroke-width="2"/>
  <line x1="326" y1="215" x2="326" y2="355" stroke="#111827" stroke-width="2"/>
  <line x1="398" y1="215" x2="398" y2="355" stroke="#111827" stroke-width="2"/>
  <text x="146" y="250" class="tableText">x</text><text x="218" y="250" class="tableText">1</text><text x="290" y="250" class="tableText">2</text><text x="362" y="250" class="tableText">3</text><text x="434" y="250" class="tableText">4</text>
  <text x="146" y="320" class="tableText">p(x)</text><text x="218" y="320" class="tableText">0.1</text><text x="290" y="320" class="tableText">0.2</text><text x="362" y="320" class="tableText">0.3</text><text x="434" y="320" class="tableText">0.4</text>
  <rect x="105" y="390" width="370" height="70" class="green"/><text x="128" y="418" class="text">The probabilities must add to 1:</text><text x="128" y="447" class="math">0.1 + 0.2 + 0.3 + 0.4 = 1</text>
  <rect x="580" y="130" width="460" height="390" class="box"/><text x="610" y="172" class="label">As a function</text>
  <rect x="625" y="215" width="370" height="175" class="accent"/><text x="655" y="260" class="math">p(x) = { 0.1x,  x = 1, 2, 3, 4</text><text x="733" y="307" class="math">0,      otherwise</text><text x="655" y="355" class="note">Choose the rule depending on the input x.</text>
  <rect x="625" y="425" width="370" height="70" class="smallbox"/><text x="650" y="454" class="text">Example: if x = 2,</text><text x="650" y="482" class="math">p(2) = 0.1(2) = 0.2</text>
  <path d="M520 325 C548 325, 552 325, 580 325" class="arrow"/><text x="536" y="300" class="note">same distribution</text>
  <text x="60" y="585" class="note">Asset ID: AS2StatisticalDistributionsSVG-001 | Section: Key Definitions and Core Theory | Purpose: table/function representation.</text>
</svg>
