<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Tree paths to binomial formula</title><desc id="desc">One path probability multiplied by the number of possible orders gives the binomial formula.</desc>
  <style>.bg{fill:#fbfbfd}.title{font:700 32px Arial,sans-serif;fill:#111827}.subtitle{font:400 18px Arial,sans-serif;fill:#374151}.card{fill:#fff;stroke:#1f2937;stroke-width:2;rx:18}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2;rx:16}.orange{fill:#ffedd5;stroke:#ea580c;stroke-width:2;rx:16}.green{fill:#dcfce7;stroke:#16a34a;stroke-width:2;rx:16}.purple{fill:#ede9fe;stroke:#7c3aed;stroke-width:2;rx:16}.label{font:700 21px Arial,sans-serif;fill:#111827}.text{font:400 18px Arial,sans-serif;fill:#111827}.math{font:400 24px 'Times New Roman',serif;fill:#111827}.note{font:400 16px Arial,sans-serif;fill:#4b5563}.arrow{stroke:#111827;stroke-width:3;fill:none;marker-end:url(#arrowhead)}.branch{stroke:#374151;stroke-width:3;fill:none}.nodeS{fill:#16a34a;stroke:#065f46;stroke-width:2}.nodeF{fill:#ea580c;stroke:#9a3412;stroke-width:2}.nodeText{font:700 16px Arial,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:middle}</style>
  <defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111827"/></marker></defs>
  <rect class="bg" width="1200" height="760"/><text x="60" y="58" class="title">Why does the binomial formula work?</text><text x="60" y="92" class="subtitle">Exact probability = number of valid orders × probability of one order.</text>
  <rect x="60" y="130" width="330" height="230" class="card"/><text x="90" y="170" class="label">One example path</text><text x="90" y="205" class="text">For 5 trials and exactly 2 successes:</text>
  <circle cx="120" cy="260" r="22" class="nodeS"/><text x="120" y="260" class="nodeText">S</text><line x1="142" y1="260" x2="178" y2="260" class="branch"/><circle cx="200" cy="260" r="22" class="nodeF"/><text x="200" y="260" class="nodeText">F</text><line x1="222" y1="260" x2="258" y2="260" class="branch"/><circle cx="280" cy="260" r="22" class="nodeS"/><text x="280" y="260" class="nodeText">S</text><line x1="302" y1="260" x2="338" y2="260" class="branch"/><circle cx="360" cy="260" r="22" class="nodeF"/><text x="360" y="260" class="nodeText">F</text>
  <text x="90" y="320" class="math">S F S F F has probability p²(1-p)³</text>
  <rect x="455" y="130" width="300" height="230" class="blue"/><text x="485" y="170" class="label">Count successes</text><text x="485" y="210" class="math">r successes</text><text x="485" y="248" class="math">n - r failures</text><text x="485" y="300" class="text">For this example:</text><text x="485" y="330" class="math">r = 2,  n - r = 3</text>
  <rect x="820" y="130" width="320" height="230" class="orange"/><text x="850" y="170" class="label">One-order probability</text><text x="850" y="215" class="math">p^r(1-p)^(n-r)</text><text x="850" y="270" class="text">For 5 trials and 2 successes:</text><text x="850" y="305" class="math">p²(1-p)³</text>
  <path d="M390 245 C420 245, 425 245, 455 245" class="arrow"/><path d="M755 245 C785 245, 790 245, 820 245" class="arrow"/>
  <rect x="180" y="430" width="370" height="155" class="purple"/><text x="210" y="470" class="label">How many orders?</text><text x="210" y="512" class="math">Choose r success positions from n trials</text><text x="210" y="555" class="math">Number of orders = C(n,r)</text>
  <rect x="650" y="430" width="370" height="155" class="green"/><text x="680" y="470" class="label">Multiply</text><text x="680" y="512" class="math">orders × one-order probability</text><text x="680" y="555" class="math">P(X = r) = C(n,r)p^r(1-p)^(n-r)</text>
  <path d="M550 507 C595 507, 605 507, 650 507" class="arrow"/><rect x="250" y="630" width="700" height="70" class="card"/><text x="280" y="674" class="math">In exam notation:  P(X = r) = ( n choose r ) p^r(1-p)^(n-r)</text>
  <text x="60" y="735" class="note">Asset ID: AS2StatisticalDistributionsSVG-005 | Section: Core Theory | Purpose: connect tree paths, binomial coefficients and formula.</text>
</svg>
