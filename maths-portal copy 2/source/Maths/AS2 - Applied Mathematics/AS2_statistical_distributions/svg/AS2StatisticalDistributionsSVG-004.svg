<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc">
  <title id="title">Binomial model conditions checklist</title><desc id="desc">The four conditions needed for a binomial model.</desc>
  <style>.bg{fill:#fbfbfd}.title{font:700 32px Arial,sans-serif;fill:#111827}.subtitle{font:400 18px Arial,sans-serif;fill:#374151}.card{fill:#fff;stroke:#1f2937;stroke-width:2;rx:18}.yes{fill:#dcfce7;stroke:#16a34a;stroke-width:2;rx:18}.warn{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:18}.label{font:700 22px Arial,sans-serif;fill:#111827}.text{font:400 18px Arial,sans-serif;fill:#111827}.math{font:400 24px 'Times New Roman',serif;fill:#111827}.note{font:400 16px Arial,sans-serif;fill:#4b5563}.tick{font:700 34px Arial,sans-serif;fill:#16a34a}.arrow{stroke:#111827;stroke-width:3;fill:none;marker-end:url(#arrowhead)}</style>
  <defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111827"/></marker></defs>
  <rect class="bg" width="1100" height="700"/><text x="60" y="58" class="title">Can I use a binomial model?</text><text x="60" y="92" class="subtitle">All four conditions must survive the checklist.</text>
  <rect x="80" y="145" width="440" height="105" class="card"/><text x="110" y="188" class="tick">✓</text><text x="155" y="185" class="label">1. Fixed number of trials</text><text x="155" y="218" class="text">The number of attempts is known.</text><text x="390" y="218" class="math">n</text>
  <rect x="580" y="145" width="440" height="105" class="card"/><text x="610" y="188" class="tick">✓</text><text x="655" y="185" class="label">2. Two outcomes</text><text x="655" y="218" class="text">Each trial is success or failure.</text>
  <rect x="80" y="290" width="440" height="105" class="card"/><text x="110" y="333" class="tick">✓</text><text x="155" y="330" class="label">3. Fixed probability</text><text x="155" y="363" class="text">The success probability stays constant.</text><text x="470" y="363" class="math">p</text>
  <rect x="580" y="290" width="440" height="105" class="card"/><text x="610" y="333" class="tick">✓</text><text x="655" y="330" class="label">4. Independent trials</text><text x="655" y="363" class="text">One trial does not affect another.</text>
  <path d="M300 420 C300 455, 465 455, 465 490" class="arrow"/><path d="M800 420 C800 455, 635 455, 635 490" class="arrow"/>
  <rect x="300" y="490" width="500" height="100" class="yes"/><text x="340" y="530" class="label">If all four are true:</text><text x="340" y="568" class="math">Let X = number of successes, then X ~ B(n, p)</text>
  <rect x="80" y="610" width="940" height="50" class="warn"/><text x="105" y="642" class="text">Model critique: if independence or fixed probability is doubtful, say why in context.</text>
  <text x="60" y="685" class="note">Asset ID: AS2StatisticalDistributionsSVG-004 | Section: Core Theory | Purpose: binomial conditions checklist.</text>
</svg>
