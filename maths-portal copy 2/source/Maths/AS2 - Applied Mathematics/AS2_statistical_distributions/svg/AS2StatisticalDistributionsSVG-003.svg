<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
  <title id="title">Discrete uniform distribution for a fair die</title><desc id="desc">A bar chart showing outcomes 1 to 6 each with probability one sixth.</desc>
  <style>.bg{fill:#fbfbfd}.title{font:700 32px Arial,sans-serif;fill:#111827}.subtitle{font:400 18px Arial,sans-serif;fill:#374151}.axis{stroke:#111827;stroke-width:3}.grid{stroke:#d1d5db;stroke-width:1;stroke-dasharray:6 6}.bar{fill:#dbeafe;stroke:#2563eb;stroke-width:2;rx:8}.dot{fill:#2563eb}.label{font:700 20px Arial,sans-serif;fill:#111827}.text{font:400 18px Arial,sans-serif;fill:#111827}.math{font:400 22px 'Times New Roman',serif;fill:#111827}.note{font:400 16px Arial,sans-serif;fill:#4b5563}.callout{fill:#fff;stroke:#1f2937;stroke-width:2;rx:16}.dieFace{fill:#fff;stroke:#111827;stroke-width:2;rx:14}.pip{fill:#111827}</style>
  <rect class="bg" width="1100" height="660"/><text x="60" y="58" class="title">Discrete uniform distribution</text><text x="60" y="92" class="subtitle">A fair die is uniform because each discrete outcome has the same probability.</text>
  <line x1="130" y1="510" x2="820" y2="510" class="axis"/><line x1="130" y1="510" x2="130" y2="150" class="axis"/><line x1="130" y1="270" x2="820" y2="270" class="grid"/><text x="82" y="276" class="math">1/6</text><text x="830" y="516" class="label">x</text><text x="105" y="140" class="label">p(x)</text>
  <rect x="190" y="270" width="55" height="240" class="bar"/><rect x="285" y="270" width="55" height="240" class="bar"/><rect x="380" y="270" width="55" height="240" class="bar"/><rect x="475" y="270" width="55" height="240" class="bar"/><rect x="570" y="270" width="55" height="240" class="bar"/><rect x="665" y="270" width="55" height="240" class="bar"/>
  <circle cx="217.5" cy="270" r="7" class="dot"/><circle cx="312.5" cy="270" r="7" class="dot"/><circle cx="407.5" cy="270" r="7" class="dot"/><circle cx="502.5" cy="270" r="7" class="dot"/><circle cx="597.5" cy="270" r="7" class="dot"/><circle cx="692.5" cy="270" r="7" class="dot"/>
  <text x="217.5" y="545" class="label" text-anchor="middle">1</text><text x="312.5" y="545" class="label" text-anchor="middle">2</text><text x="407.5" y="545" class="label" text-anchor="middle">3</text><text x="502.5" y="545" class="label" text-anchor="middle">4</text><text x="597.5" y="545" class="label" text-anchor="middle">5</text><text x="692.5" y="545" class="label" text-anchor="middle">6</text>
  <rect x="850" y="180" width="180" height="180" class="dieFace"/><circle cx="895" cy="225" r="10" class="pip"/><circle cx="985" cy="225" r="10" class="pip"/><circle cx="895" cy="270" r="10" class="pip"/><circle cx="985" cy="270" r="10" class="pip"/><circle cx="895" cy="315" r="10" class="pip"/><circle cx="985" cy="315" r="10" class="pip"/>
  <rect x="805" y="405" width="250" height="105" class="callout"/><text x="828" y="440" class="label">Uniform means equal</text><text x="828" y="472" class="text">Every outcome has</text><text x="828" y="502" class="math">P(X = x) = 1/6</text>
  <text x="60" y="615" class="note">Asset ID: AS2StatisticalDistributionsSVG-003 | Section: Definitions | Purpose: fair die as a discrete uniform distribution.</text>
</svg>
