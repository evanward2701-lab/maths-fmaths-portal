<!-- Asset ID: A22StatisticalHypothesisTestingSVG-002 | Source: transcript prize-game example | Section: Core Theory | Purpose: Claim, expected wins, observed wins. --><svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700"><rect width="1100" height="700" fill="white"/><text x="55" y="65" font-family="Arial" font-size="34" font-weight="700">Prize Game: Is the 20% claim believable?</text><rect x="70" y="130" width="300" height="160" rx="16" fill="#f4f7ff" stroke="#4267b2" stroke-width="3"/><text x="100" y="180" font-family="Arial" font-size="28" font-weight="700">Claim</text><text x="100" y="230" font-family="Arial" font-size="32">p = 0.20</text><rect x="430" y="130" width="300" height="160" rx="16" fill="#f7fff4" stroke="#3a8f3a" stroke-width="3"/><text x="460" y="180" font-family="Arial" font-size="28" font-weight="700">Expected</text><text x="460" y="230" font-family="Arial" font-size="28">50 × 0.20 = 10</text><rect x="790" y="130" width="230" height="160" rx="16" fill="#fff7e6" stroke="#c77d00" stroke-width="3"/><text x="820" y="180" font-family="Arial" font-size="28" font-weight="700">Observed</text><text x="820" y="230" font-family="Arial" font-size="34" fill="#b00020">X = 5</text><line x1="550" y1="315" x2="550" y2="390" stroke="#444" stroke-width="5"/><polygon points="550,410 530,380 570,380" fill="#444"/><rect x="120" y="450" width="360" height="110" rx="18" fill="#eef8ff" stroke="#3388cc" stroke-width="3"/><text x="150" y="495" font-family="Arial" font-size="24" font-weight="700">Explanation 1</text><text x="150" y="535" font-family="Arial" font-size="20">Just unlucky: p is still 0.20.</text><rect x="620" y="450" width="360" height="110" rx="18" fill="#fff0f0" stroke="#d11f1f" stroke-width="3"/><text x="650" y="495" font-family="Arial" font-size="24" font-weight="700">Explanation 2</text><text x="650" y="535" font-family="Arial" font-size="20">Evidence that p is less than 0.20.</text></svg>