<!-- Asset ID: A22StatisticalHypothesisTestingSVG-005 | Source: transcript two-tailed section | Section: Core Theory | Purpose: Two-tailed critical regions. --><svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700"><rect width="1100" height="700" fill="white"/><text x="55" y="60" font-family="Arial" font-size="32" font-weight="700">Two-Tailed Critical Region: X ~ B(20, 0.4)</text><text x="55" y="100" font-family="Arial" font-size="20">For H₁: p ≠ 0.4, both tails matter. At 5%, compare each tail with 2.5%.</text><rect x="120" y="180" width="340" height="160" rx="16" fill="#fff0f0" stroke="#d11f1f" stroke-width="3"/><text x="150" y="230" font-family="Arial" font-size="26" font-weight="700">Lower critical region</text><text x="150" y="280" font-family="Arial" font-size="26">X ≤ 3</text><text x="150" y="315" font-family="Arial" font-size="20">P(X ≤ 3) = 0.0160</text><rect x="640" y="180" width="340" height="160" rx="16" fill="#fff0f0" stroke="#d11f1f" stroke-width="3"/><text x="670" y="230" font-family="Arial" font-size="26" font-weight="700">Upper critical region</text><text x="670" y="280" font-family="Arial" font-size="26">X ≥ 13</text><text x="670" y="315" font-family="Arial" font-size="20">P(X ≥ 13) = 0.0210</text><rect x="315" y="500" width="470" height="60" rx="12" fill="#f7fff4" stroke="#2a7f2a" stroke-width="3"/><text x="340" y="538" font-family="Arial" font-size="21" font-weight="700">Actual significance = 0.0160 + 0.0210 = 0.0370</text></svg>