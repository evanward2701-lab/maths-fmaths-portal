<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>A22 Binomial Hypothesis Testing Widget</title><style>
body{font-family:Arial,Helvetica,sans-serif;background:#f7f7fb;color:#111827;margin:0}.page{max-width:1150px;margin:auto;padding:24px}.card{background:white;border:1px solid #d1d5db;border-radius:18px;padding:18px;margin:16px 0;box-shadow:0 8px 24px rgba(17,24,39,.06)}.grid{display:grid;grid-template-columns:350px 1fr;gap:18px}label{font-weight:700;display:block;margin-top:12px}input,select,button{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:10px;font-size:1rem}button{background:#2563eb;color:white;font-weight:700;margin-top:16px}.result{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.box{border:1px solid #d1d5db;border-radius:12px;padding:12px}.decision{border-radius:12px;padding:12px;margin:12px 0}.reject{background:#fef2f2;border:2px solid #b91c1c}.keep{background:#ecfdf5;border:2px solid #047857}.math{font-family:monospace;background:#f3f4f6;border-radius:10px;padding:10px}canvas{width:100%;height:320px;border:1px solid #d1d5db;border-radius:12px;background:white}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #d1d5db;padding:6px;text-align:right}td:first-child,th:first-child{text-align:left}.flag{background:#fef2f2;font-weight:700}@media(max-width:850px){.grid,.result{grid-template-columns:1fr}}
</style></head><body><div class="page"><div class="card"><h1>A22 Binomial Hypothesis Testing Explorer</h1><p>Change the test values and watch the p-value, decision and critical region update.</p></div><main class="grid"><section class="card"><h2>Inputs</h2><label>n</label><input id="n" type="number" min="1" max="200" value="50"/><label>p₀</label><input id="p" type="number" min="0.001" max="0.999" step="0.001" value="0.2"/><label>observed x</label><input id="x" type="number" min="0" value="5"/><label>H₁</label><select id="alt"><option value="less">p &lt; p₀</option><option value="greater">p &gt; p₀</option><option value="notEqual">p ≠ p₀</option></select><label>Significance level</label><select id="alpha"><option value="0.10">10%</option><option value="0.05" selected>5%</option><option value="0.01">1%</option></select><button id="run">Run</button><p><strong>Exam wording:</strong> say “not enough evidence to reject H₀”, not “H₀ is proved true”.</p></section><section class="card"><h2>Output</h2><div class="result"><div class="box"><b>H₀</b><div id="h0"></div></div><div class="box"><b>H₁</b><div id="h1"></div></div><div class="box"><b>Distribution</b><div id="dist"></div></div><div class="box"><b>Expected</b><div id="exp"></div></div><div class="box"><b>Tail probability</b><div id="tail"></div></div><div class="box"><b>Threshold</b><div id="thr"></div></div></div><div id="dec" class="decision"></div><div id="work" class="math"></div><div id="crit" class="math"></div><canvas id="chart" width="760" height="320"></canvas><h3>Probability table</h3><div id="table"></div></section></main></div><script>
const $=id=>document.getElementById(id), ctx=$('chart').getContext('2d');
function probs(n,p){let a=Array(n+1).fill(0);a[0]=(1-p)**n;for(let k=0;k<n;k++)a[k+1]=a[k]*((n-k)/(k+1))*(p/(1-p));let s=a.reduce((u,v)=>u+v,0);return a.map(v=>v/s)}
function cum(a,x){let s=0;for(let i=0;i<=x;i++)s+=a[i];return s}function up(a,x){let s=0;for(let i=x;i<a.length;i++)s+=a[i];return s}function f(v){return Number(v).toFixed(4)}
function crit(a,alt,alpha){let n=a.length-1,t=alt==='notEqual'?alpha/2:alpha,lo=null,hi=null;for(let k=0;k<=n;k++)if(cum(a,k)<t)lo=k;for(let k=n;k>=0;k--)if(up(a,k)<t)hi=k;if(alt==='less')return lo===null?'No lower critical region':`Critical region: X ≤ ${lo}; actual significance ${f(cum(a,lo))}`;if(alt==='greater')return hi===null?'No upper critical region':`Critical region: X ≥ ${hi}; actual significance ${f(up(a,hi))}`;let parts=[];let actual=0;if(lo!==null){parts.push(`X ≤ ${lo}`);actual+=cum(a,lo)}if(hi!==null){parts.push(`X ≥ ${hi}`);actual+=up(a,hi)}return parts.length?`Critical region: ${parts.join(' or ')}; actual significance ${f(actual)}`:'No two-tailed critical region'}
function draw(a,flag){let c=$('chart'),w=c.width,h=c.height,m={l:45,r:15,t:15,b:40},pw=w-m.l-m.r,ph=h-m.t-m.b,max=Math.max(...a),n=a.length-1,g=pw/(n+1),bw=Math.max(2,g*.75);ctx.clearRect(0,0,w,h);ctx.beginPath();ctx.moveTo(m.l,m.t);ctx.lineTo(m.l,h-m.b);ctx.lineTo(w-m.r,h-m.b);ctx.stroke();for(let k=0;k<=n;k++){let bh=a[k]/max*ph,x=m.l+k*g+(g-bw)/2,y=h-m.b-bh;ctx.fillStyle=flag(k)?'#b91c1c':'#2563eb';ctx.fillRect(x,y,bw,bh)}ctx.fillStyle='#111827';ctx.font='13px Arial';let step=Math.max(1,Math.ceil(n/10));for(let k=0;k<=n;k+=step)ctx.fillText(k,m.l+k*g+g/2,h-15)}
function table(a,flag){let n=a.length-1,step=n>80?Math.ceil((n+1)/80):1,html='<table><tr><th>x</th><th>P(X=x)</th><th>P(X≤x)</th><th>P(X≥x)</th></tr>';for(let k=0;k<=n;k+=step)html+=`<tr class="${flag(k)?'flag':''}"><td>${k}</td><td>${f(a[k])}</td><td>${f(cum(a,k))}</td><td>${f(up(a,k))}</td></tr>`;$('table').innerHTML=html+'</table>'}
function update(){let n=Math.max(1,Math.min(200,Math.round(+$('n').value||50))),p=Math.max(.001,Math.min(.999,+$('p').value||.2)),x=Math.max(0,Math.min(n,Math.round(+$('x').value||0))),alt=$('alt').value,alpha=+$('alpha').value,a=probs(n,p);$('n').value=n;$('p').value=p;$('x').value=x;$('x').max=n;$('h0').textContent=`p = ${p}`;$('h1').textContent=alt==='less'?`p < ${p}`:alt==='greater'?`p > ${p}`:`p ≠ ${p}`;$('dist').textContent=`X ~ B(${n}, ${p})`;$('exp').textContent=f(n*p);let prob,thr,work,flag;if(alt==='less'){prob=cum(a,x);thr=alpha;work=`P(X ≤ ${x}) = ${f(prob)}`;flag=k=>k<=x}else if(alt==='greater'){prob=up(a,x);thr=alpha;work=`P(X ≥ ${x}) = 1 - P(X ≤ ${x-1}) = ${f(prob)}`;flag=k=>k>=x}else{let low=x<=n*p;prob=low?cum(a,x):up(a,x);thr=alpha/2;work=low?`Two-tailed: use P(X ≤ ${x}) = ${f(prob)}`:`Two-tailed: use P(X ≥ ${x}) = ${f(prob)}`;flag=k=>low?k<=x:k>=x}$('tail').textContent=f(prob);$('thr').textContent=f(thr);$('work').textContent=work+', compare with '+f(thr);$('crit').textContent=crit(a,alt,alpha);let rej=prob<thr;$('dec').className='decision '+(rej?'reject':'keep');$('dec').innerHTML=rej?'<h3>Reject H₀</h3><p>There is evidence for H₁. Finish in context.</p>':'<h3>Do not reject H₀</h3><p>There is not enough evidence to reject H₀.</p>';draw(a,flag);table(a,flag)}
['n','p','x','alt','alpha'].forEach(id=>$(id).addEventListener('input',update));$('run').addEventListener('click',update);update();
</script></body></html>
