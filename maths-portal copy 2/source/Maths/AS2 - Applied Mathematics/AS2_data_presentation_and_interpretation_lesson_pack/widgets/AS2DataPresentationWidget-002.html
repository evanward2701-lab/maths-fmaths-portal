<!-- Asset ID: AS2DataPresentationWidget-002 | Source: histogram scaling evidence | Purpose: frequency density and area = k × frequency explorer. -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AS2 Histogram Scaling Explorer</title><style>body{font-family:Arial,sans-serif;background:#f8fafc;color:#172033;margin:0}.wrap{max-width:1100px;margin:24px auto;padding:20px}.card{background:#fff;border:1px solid #d7dee8;border-radius:18px;padding:22px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}label{display:block;font-weight:700;margin-bottom:6px}input{width:100%;box-sizing:border-box;border:1px solid #d7dee8;border-radius:12px;padding:10px}.panel{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}.box{border:1px solid #d7dee8;border-radius:14px;padding:16px;background:#edf4ff}.graph{width:100%;height:320px;border:1px solid #d7dee8;border-radius:14px;background:#fff}button{background:#2457d6;color:#fff;border:0;border-radius:999px;padding:10px 14px;font-weight:700;margin-top:16px}@media(max-width:860px){.grid,.panel{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="card"><h1>Histogram Scaling Explorer</h1><p>At A-Level, histogram area is proportional to frequency: area = k × frequency.</p><div class="grid"><div><label>Known width</label><input id="knownWidth" type="number" value="5"></div><div><label>Known height</label><input id="knownHeight" type="number" value="3"></div><div><label>Known frequency</label><input id="knownFreq" type="number" value="37.5"></div><div><label>Target area</label><input id="targetArea" type="number" value="6"></div><div><label>Class width</label><input id="classWidth" type="number" value="5"></div><div><label>Frequency</label><input id="frequency" type="number" value="15"></div><div><label>Drawn width</label><input id="drawnWidth" type="number" value="6"></div><div><label>Drawn height</label><input id="drawnHeight" type="number" value="8"></div></div><button onclick="calc()">Update</button><div class="panel"><div class="box"><h2>Scaling result</h2><div id="scaling"></div></div><div class="box"><h2>Frequency density</h2><div id="density"></div></div><svg id="svg" class="graph" viewBox="0 0 720 320"></svg><div class="box"><h2>Drawn bar scaling</h2><div id="drawn"></div></div></div><p><strong>Exam warning:</strong> Do not assume area is numerically equal to frequency unless the scale makes it true.</p></section></main><script>function n(id){return +document.getElementById(id).value}function f(x){return Math.round(x*1000)/1000}function calc(){let kw=n('knownWidth'),kh=n('knownHeight'),kf=n('knownFreq'),ta=n('targetArea'),cw=n('classWidth'),fr=n('frequency'),dw=n('drawnWidth'),dh=n('drawnHeight');let area=kw*kh,k=area/kf,tf=ta/k,fd=fr/cw,da=dw*dh,dk=da/fr;scaling.innerHTML=`<p>Known area = ${kw} × ${kh} = ${f(area)}</p><p>k = ${f(area)} ÷ ${kf} = ${f(k)}</p><p>Target frequency = ${ta} ÷ ${f(k)} = ${f(tf)}</p>`;density.innerHTML=`<p>frequency density = frequency ÷ class width</p><p>${fr} ÷ ${cw} = ${f(fd)}</p>`;drawn.innerHTML=`<p>Drawn area = ${dw} × ${dh} = ${f(da)}</p><p>Area-frequency scale = ${f(da)} ÷ ${fr} = ${f(dk)}</p>`;draw(area,ta,k)}function draw(area,ta,k){let s=document.getElementById('svg');s.innerHTML='';function e(t,a,text){let x=document.createElementNS('http://www.w3.org/2000/svg',t);Object.entries(a).forEach(([k,v])=>x.setAttribute(k,v));if(text)x.textContent=text;s.appendChild(x)}e('line',{x1:60,y1:260,x2:660,y2:260,stroke:'#172033','stroke-width':3});e('line',{x1:60,y1:260,x2:60,y2:40,stroke:'#172033','stroke-width':3});e('rect',{x:110,y:110,width:170,height:150,fill:'#dbeafe',stroke:'#172033','stroke-width':2});e('text',{x:195,y:95,'text-anchor':'middle','font-size':14},`known area ${f(area)}`);e('rect',{x:410,y:160,width:120,height:100,fill:'#dcfce7',stroke:'#172033','stroke-width':2});e('text',{x:470,y:145,'text-anchor':'middle','font-size':14},`target area ${f(ta)}`);e('text',{x:360,y:28,'text-anchor':'middle','font-size':15,'font-weight':'700'},`area = k × frequency, k = ${f(k)}`)}calc()</script></body></html>
