<!-- Asset ID: AS2DataPresentationWidget-003 | Source: cumulative frequency diagrams evidence | Purpose: cumulative frequency table and quartile reader. -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AS2 Cumulative Frequency Reader</title><style>body{font-family:Arial,sans-serif;background:#f8fafc;color:#172033;margin:0}.wrap{max-width:1100px;margin:24px auto;padding:20px}.card{background:#fff;border:1px solid #d7dee8;border-radius:18px;padding:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}textarea,input{width:100%;box-sizing:border-box;border:1px solid #d7dee8;border-radius:12px;padding:10px;font-size:16px}textarea{min-height:150px;font-family:monospace}.output{margin-top:20px;display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.graph{width:100%;height:380px;border:1px solid #d7dee8;border-radius:14px;background:white}.box{border:1px solid #d7dee8;border-radius:14px;padding:16px;background:#edf4ff}button{background:#2457d6;color:#fff;border:0;border-radius:999px;padding:10px 14px;font-weight:700;margin-top:16px}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border:1px solid #d7dee8;padding:8px;text-align:center}th{background:#f1f5f9}@media(max-width:860px){.grid,.output{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="card"><h1>Cumulative Frequency Reader</h1><p>Enter class boundaries and frequencies. The widget calculates cumulative frequencies and estimates quartiles using straight-line interpolation.</p><div class="grid"><div><label>Class data: lower, upper, frequency</label><textarea id="data">9.6, 9.7, 1
9.7, 9.9, 4
9.9, 10.05, 10
10.05, 10.2, 17</textarea></div><div><label>Query value A</label><input id="queryA" type="number" step="any" value="9.95"><label>Query value B</label><input id="queryB" type="number" step="any" value="10.15"><button onclick="calc()">Update graph</button></div></div><div class="output"><svg id="svg" class="graph" viewBox="0 0 760 380"></svg><div class="box"><h2>Readings</h2><div id="readings"></div></div></div><div id="tableArea"></div><p><strong>Reminder:</strong> Cumulative frequency means “up to this value”. More than a value is total minus cumulative frequency.</p></section></main><script>function f(x){return Math.round(x*1000)/1000}function rows(){return data.value.split(/\n+/).map(r=>r.split(/[\s,]+/).map(Number).filter(Number.isFinite)).filter(r=>r.length>=3).map(r=>({l:r[0],u:r[1],fr:r[2]}))}function pts(rs){let c=0,p=[];if(rs.length)p.push({x:rs[0].l,y:0});rs.forEach(r=>{c+=r.fr;p.push({x:r.u,y:c})});return{p,total:c}}function ix(p,y){for(let i=1;i<p.length;i++){let a=p[i-1],b=p[i];if(y>=a.y&&y<=b.y){let t=(y-a.y)/(b.y-a.y||1);return a.x+t*(b.x-a.x)}}return y<=0?p[0].x:p[p.length-1].x}function iy(p,x){if(x<=p[0].x)return p[0].y;if(x>=p[p.length-1].x)return p[p.length-1].y;for(let i=1;i<p.length;i++){let a=p[i-1],b=p[i];if(x>=a.x&&x<=b.x){let t=(x-a.x)/(b.x-a.x||1);return a.y+t*(b.y-a.y)}}return NaN}function calc(){let rs=rows(),q=pts(rs),p=q.p,total=q.total;if(p.length<2)return;let q1p=total/4,q2p=total/2,q3p=3*total/4,q1=ix(p,q1p),q2=ix(p,q2p),q3=ix(p,q3p),a=+queryA.value,b=+queryB.value,ca=iy(p,a),cb=iy(p,b);readings.innerHTML=`<p>Total frequency: ${f(total)}</p><p>Q₁ position ${f(q1p)}, so Q₁ ≈ ${f(q1)}</p><p>Median position ${f(q2p)}, so median ≈ ${f(q2)}</p><p>Q₃ position ${f(q3p)}, so Q₃ ≈ ${f(q3)}</p><p>IQR ≈ ${f(q3-q1)}</p><hr><p>Less than A: ${f(ca)}</p><p>More than A: ${f(total-ca)}</p><p>Between A and B: ${f(Math.abs(cb-ca))}</p>`;tableArea.innerHTML='<table><tr><th>Class interval</th><th>Frequency</th><th>Cumulative frequency</th></tr>'+rs.reduce((s,r)=>{s.c+=r.fr;s.html+=`<tr><td>${f(r.l)} to ${f(r.u)}</td><td>${f(r.fr)}</td><td>${f(s.c)}</td></tr>`;return s},{c:0,html:''}).html+'</table>';draw(p,total,q1p,q2p,q3p,q1,q2,q3,a,b,ca,cb)}function draw(p,total,q1p,q2p,q3p,q1,q2,q3,a,b,ca,cb){let s=svg;s.innerHTML='';let xmin=Math.min(...p.map(x=>x.x)),xmax=Math.max(...p.map(x=>x.x)),left=70,top=30,w=620,h=280,sx=x=>left+((x-xmin)/(xmax-xmin||1))*w,sy=y=>top+h-(y/(total||1))*h;function e(t,a,text){let n=document.createElementNS('http://www.w3.org/2000/svg',t);Object.entries(a).forEach(([k,v])=>n.setAttribute(k,v));if(text)n.textContent=text;s.appendChild(n)}e('line',{x1:left,y1:top+h,x2:left+w,y2:top+h,stroke:'#172033','stroke-width':3});e('line',{x1:left,y1:top+h,x2:left,y2:top,stroke:'#172033','stroke-width':3});e('path',{d:p.map((x,i)=>(i?'L':'M')+' '+sx(x.x)+' '+sy(x.y)).join(' '),fill:'none',stroke:'#172033','stroke-width':3});p.forEach(x=>e('circle',{cx:sx(x.x),cy:sy(x.y),r:5,fill:'#172033'}));[[q1p,q1,'Q₁'],[q2p,q2,'Q₂'],[q3p,q3,'Q₃']].forEach(q=>{e('line',{x1:left,y1:sy(q[0]),x2:sx(q[1]),y2:sy(q[0]),stroke:'#b42318','stroke-width':2,'stroke-dasharray':'5 5'});e('line',{x1:sx(q[1]),y1:sy(q[0]),x2:sx(q[1]),y2:top+h,stroke:'#b42318','stroke-width':2,'stroke-dasharray':'5 5'});e('text',{x:sx(q[1])+6,y:sy(q[0])-6,'font-size':13,fill:'#b42318'},`${q[2]} ≈ ${f(q[1])}`)});[[a,ca,'A'],[b,cb,'B']].forEach(z=>{e('circle',{cx:sx(z[0]),cy:sy(z[1]),r:6,fill:'#2457d6'});e('text',{x:sx(z[0])+8,y:sy(z[1])+4,'font-size':13,fill:'#2457d6'},z[2])})}calc()</script></body></html>
