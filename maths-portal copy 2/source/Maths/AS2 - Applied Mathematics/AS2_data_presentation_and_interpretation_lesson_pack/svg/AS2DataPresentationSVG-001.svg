<title id="title">Box Plot Anatomy</title>
<desc id="desc">Minimum, quartiles, median, IQR and range.</desc>
<rect width="960" height="540" fill="#ffffff"/>
<text x="40" y="55" font-family="Arial, sans-serif" font-size="30" font-weight="700">Box Plot Anatomy</text>
<text x="40" y="86" font-family="Arial, sans-serif" font-size="16" fill="#334155">Minimum, quartiles, median, IQR and range.</text>

<metadata>Asset ID: AS2DataPresentationSVG-001; Source: Box plot recap evidence; Section: Core Theory, Box Plots; Purpose: Label core parts of a box plot.</metadata>
<line x1="110" y1="420" x2="850" y2="420" stroke="#222" stroke-width="3"/>
<g font-family="Arial" font-size="14" text-anchor="middle"><text x="110" y="455">0</text><text x="230" y="455">5</text><text x="350" y="455">10</text><text x="470" y="455">15</text><text x="590" y="455">20</text><text x="710" y="455">25</text><text x="830" y="455">30</text></g>
<g stroke="#111" stroke-width="4" fill="none"><line x1="182" y1="300" x2="470" y2="300"/><line x1="638" y1="300" x2="758" y2="300"/><rect x="470" y="250" width="168" height="100" fill="#f8fbff"/><line x1="518" y1="250" x2="518" y2="350"/><line x1="182" y1="270" x2="182" y2="330"/><line x1="758" y1="270" x2="758" y2="330"/></g>
<g font-family="Arial" font-size="16" text-anchor="middle"><text x="182" y="185">Minimum 3</text><text x="470" y="185">Q₁ 15</text><text x="518" y="165">Median 17</text><text x="638" y="185">Q₃ 22</text><text x="758" y="185">Maximum 27</text></g>
<path d="M470 220 L470 205 L638 205 L638 220" fill="none" stroke="#005f73" stroke-width="3"/><text x="554" y="195" font-family="Arial" font-size="18" text-anchor="middle" fill="#005f73" font-weight="700">IQR = Q₃ − Q₁</text>
<path d="M182 390 L182 372 L758 372 L758 390" fill="none" stroke="#9b2226" stroke-width="3"/><text x="470" y="365" font-family="Arial" font-size="18" text-anchor="middle" fill="#9b2226" font-weight="700">Range = maximum − minimum</text>
