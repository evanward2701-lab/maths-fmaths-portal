<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Velocity-Time Graph Types</title><desc id="desc">Stationary, constant velocity and constant acceleration velocity-time graphs.</desc><metadata>asset_id: AS2ConstantAccelerationSVG-002; source: MechYr1 Chapter 9 Constant Acceleration PDF; related_LOs: AS2-KIN-LO001, AS2-KIN-LO002</metadata><rect width="1200" height="700" fill="white"/><text x="60" y="70" font-family="Arial" font-size="38" font-weight="700">Velocity-Time Graphs</text><text x="60" y="110" font-family="Arial" font-size="22">Gradient gives acceleration. Area gives displacement or distance travelled.</text><g transform="translate(70,160)"><text x="20" y="0" font-family="Arial" font-size="26" font-weight="700">Stationary</text><line x1="40" y1="260" x2="280" y2="260" stroke="#111" stroke-width="4"/><line x1="40" y1="260" x2="40" y2="40" stroke="#111" stroke-width="4"/><line x1="70" y1="260" x2="250" y2="260" stroke="#2f6fbb" stroke-width="6"/><text x="30" y="310" font-family="Arial" font-size="22">v = 0</text></g><g transform="translate(450,160)"><text x="20" y="0" font-family="Arial" font-size="26" font-weight="700">Constant velocity</text><line x1="40" y1="260" x2="280" y2="260" stroke="#111" stroke-width="4"/><line x1="40" y1="260" x2="40" y2="40" stroke="#111" stroke-width="4"/><rect x="70" y="120" width="180" height="140" fill="#d9e8f8"/><line x1="70" y1="120" x2="250" y2="120" stroke="#2f6fbb" stroke-width="6"/><text x="30" y="310" font-family="Arial" font-size="22">gradient = 0</text></g><g transform="translate(830,160)"><text x="20" y="0" font-family="Arial" font-size="26" font-weight="700">Constant acceleration</text><line x1="40" y1="260" x2="280" y2="260" stroke="#111" stroke-width="4"/><line x1="40" y1="260" x2="40" y2="40" stroke="#111" stroke-width="4"/><polygon points="70,260 70,210 250,70 250,260" fill="#d9e8f8"/><line x1="70" y1="210" x2="250" y2="70" stroke="#2f6fbb" stroke-width="6"/><text x="30" y="310" font-family="Arial" font-size="22">constant gradient</text></g><text x="80" y="650" font-family="Arial" font-size="24" font-weight="700">Key facts: gradient = acceleration, shaded area = displacement/distance.</text></svg>