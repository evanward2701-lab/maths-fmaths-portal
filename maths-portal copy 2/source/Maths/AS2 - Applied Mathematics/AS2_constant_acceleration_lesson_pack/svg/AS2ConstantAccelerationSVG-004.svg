<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Vertical Motion Sign Conventions</title><desc id="desc">Upward-positive and downward-positive sign conventions with gravity.</desc><metadata>asset_id: AS2ConstantAccelerationSVG-004; source: MechYr1 Chapter 9 Constant Acceleration PDF; related_LOs: AS2-KIN-LO003, AS2-FORCES-LO005, AS2-FORCES-LO006</metadata><rect width="1200" height="720" fill="white"/><text x="60" y="70" font-family="Arial" font-size="38" font-weight="700">Vertical Motion Under Gravity</text><text x="60" y="110" font-family="Arial" font-size="22">Choose a positive direction and keep every sign consistent.</text><rect x="80" y="160" width="490" height="430" rx="22" fill="#f7f7f7" stroke="#111"/><text x="125" y="215" font-family="Arial" font-size="29" font-weight="700">Upwards is positive</text><line x1="180" y1="500" x2="180" y2="270" stroke="#111" stroke-width="4"/><polygon points="180,270 168,292 192,292" fill="#111"/><circle cx="330" cy="345" r="34" fill="#d9e8f8" stroke="#2f6fbb" stroke-width="4"/><line x1="330" y1="385" x2="330" y2="500" stroke="#c0392b" stroke-width="5"/><polygon points="330,500 316,474 344,474" fill="#c0392b"/><text x="145" y="547" font-family="Arial" font-size="25">a = -9.8 m s⁻²</text><rect x="630" y="160" width="490" height="430" rx="22" fill="#f7f7f7" stroke="#111"/><text x="675" y="215" font-family="Arial" font-size="29" font-weight="700">Downwards is positive</text><line x1="730" y1="270" x2="730" y2="500" stroke="#111" stroke-width="4"/><polygon points="730,500 718,478 742,478" fill="#111"/><circle cx="880" cy="345" r="34" fill="#d9e8f8" stroke="#2f6fbb" stroke-width="4"/><line x1="880" y1="385" x2="880" y2="500" stroke="#c0392b" stroke-width="5"/><polygon points="880,500 866,474 894,474" fill="#c0392b"/><text x="695" y="547" font-family="Arial" font-size="25">a = +9.8 m s⁻²</text><text x="90" y="680" font-family="Arial" font-size="22" font-weight="700">Warning: do not switch sign convention halfway through a calculation.</text></svg>