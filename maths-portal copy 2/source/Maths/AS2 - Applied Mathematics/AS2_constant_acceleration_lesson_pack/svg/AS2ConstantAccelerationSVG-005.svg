<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">SUVAT Derivation from a Velocity-Time Graph</title><desc id="desc">Straight-line velocity-time graph from u to v over time t.</desc><metadata>asset_id: AS2ConstantAccelerationSVG-005; source: MechYr1 Chapter 9 Constant Acceleration PDF; related_LOs: AS2-KIN-LO003</metadata><rect width="1200" height="760" fill="white"/><text x="60" y="70" font-family="Arial" font-size="38" font-weight="700">SUVAT from a Velocity-Time Graph</text><line x1="140" y1="560" x2="620" y2="560" stroke="#111" stroke-width="4"/><line x1="140" y1="560" x2="140" y2="170" stroke="#111" stroke-width="4"/><text x="632" y="570" font-family="Arial" font-size="27">time</text><text x="92" y="165" font-family="Arial" font-size="27">velocity</text><polygon points="140,560 140,440 520,260 520,560" fill="#d9e8f8" stroke="#2f6fbb" stroke-width="4"/><line x1="140" y1="440" x2="520" y2="260" stroke="#2f6fbb" stroke-width="7"/><line x1="140" y1="440" x2="520" y2="440" stroke="#888" stroke-dasharray="8 8"/><line x1="140" y1="260" x2="520" y2="260" stroke="#888" stroke-dasharray="8 8"/><text x="105" y="448" font-family="Arial" font-size="30">u</text><text x="105" y="268" font-family="Arial" font-size="30">v</text><text x="510" y="600" font-family="Arial" font-size="30">t</text><rect x="690" y="165" width="430" height="150" rx="18" fill="#f7f7f7" stroke="#111"/><text x="720" y="208" font-family="Arial" font-size="26" font-weight="700">Gradient gives acceleration</text><text x="720" y="252" font-family="Arial" font-size="25">a = (v - u) / t</text><text x="720" y="290" font-family="Arial" font-size="25">v = u + at</text><rect x="690" y="350" width="430" height="150" rx="18" fill="#f7f7f7" stroke="#111"/><text x="720" y="393" font-family="Arial" font-size="26" font-weight="700">Area gives displacement</text><text x="720" y="437" font-family="Arial" font-size="25">s = ((u + v) / 2)t</text><rect x="690" y="535" width="430" height="145" rx="18" fill="#f7f7f7" stroke="#111"/><text x="720" y="578" font-family="Arial" font-size="26" font-weight="700">Other formulae derived</text><text x="720" y="620" font-family="Arial" font-size="24">v² = u² + 2as</text><text x="720" y="652" font-family="Arial" font-size="24">s = ut + ½at²; s = vt - ½at²</text><text x="100" y="720" font-family="Arial" font-size="22" font-weight="700">Condition: these formulae require constant acceleration.</text></svg>