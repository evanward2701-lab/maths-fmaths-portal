<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Area Under a Velocity-Time Graph</title><desc id="desc">A trapezium under a velocity-time graph showing area equals displacement or distance.</desc><metadata>asset_id: AS2ConstantAccelerationSVG-003; source: MechYr1 Chapter 9 Constant Acceleration PDF and transcript; related_LOs: AS2-KIN-LO002</metadata><rect width="1200" height="720" fill="white"/><text x="60" y="70" font-family="Arial" font-size="38" font-weight="700">Area Under a Velocity-Time Graph</text><line x1="160" y1="570" x2="940" y2="570" stroke="#111" stroke-width="4"/><line x1="160" y1="570" x2="160" y2="160" stroke="#111" stroke-width="4"/><text x="950" y="580" font-family="Arial" font-size="28">t</text><text x="120" y="150" font-family="Arial" font-size="28">v</text><polygon points="240,570 240,300 640,300 820,570" fill="#d9e8f8" stroke="#2f6fbb" stroke-width="4"/><line x1="240" y1="300" x2="640" y2="300" stroke="#2f6fbb" stroke-width="7"/><line x1="640" y1="300" x2="820" y2="570" stroke="#2f6fbb" stroke-width="7"/><text x="220" y="610" font-family="Arial" font-size="24">0</text><text x="620" y="610" font-family="Arial" font-size="24">8</text><text x="800" y="610" font-family="Arial" font-size="24">12</text><text x="120" y="308" font-family="Arial" font-size="24">6</text><rect x="690" y="190" width="420" height="230" rx="18" fill="#f7f7f7" stroke="#111"/><text x="720" y="235" font-family="Arial" font-size="26" font-weight="700">Trapezium area</text><text x="720" y="285" font-family="Arial" font-size="24">s = ((8 + 12) / 2) × 6</text><text x="720" y="325" font-family="Arial" font-size="24">s = 60 m</text><text x="80" y="680" font-family="Arial" font-size="22" font-weight="700">Exam habit: use the trapezium formula when a velocity-time graph forms a trapezium.</text></svg>