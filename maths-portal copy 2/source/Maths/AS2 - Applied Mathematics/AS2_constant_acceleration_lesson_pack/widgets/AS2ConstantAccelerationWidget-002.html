<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Vertical Motion Sign Convention Explorer</title><style>body{font-family:Arial,Helvetica,sans-serif;background:#f6f7fb;color:#172033;margin:0}.shell{max-width:1000px;margin:auto;padding:28px}.card{background:#fff;border:1px solid #d6d9e3;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 6px 20px #0001}.grid{display:grid;grid-template-columns:360px 1fr;gap:14px}label{font-weight:800;display:block;margin-top:12px}input,select,button{width:100%;padding:11px;border:1px solid #d6d9e3;border-radius:10px;font-size:1rem}button{background:#315efb;color:#fff;font-weight:900;margin-top:16px;cursor:pointer}.out{background:#e9eeff;border-radius:14px;padding:14px;margin-top:12px}.math{font-family:"Times New Roman",serif;font-size:1.25rem}.good{color:#0f7b3d;font-weight:900}.bad{color:#a12929;font-weight:900}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main class="shell"><section class="card"><h1>Vertical Motion Sign Convention Explorer</h1><p>Gravity acts downwards. Change the positive direction and watch the signs change while the physical motion stays the same.</p></section><section class="grid"><div class="card"><label>Initial height above ground H / m</label><input id="H" type="number" value="7" step="0.1"><label>Initial speed / m s⁻¹</label><input id="speed" type="number" value="21" step="0.1"><label>Initial direction</label><select id="dir"><option value="up">Projected upwards</option><option value="down">Projected downwards</option><option value="rest">Dropped from rest</option></select><label>Positive direction</label><select id="pos"><option value="up">Upwards is positive</option><option value="down">Downwards is positive</option></select><button onclick="render()">Calculate</button></div><div class="card"><h2>Signed values</h2><div id="values" class="out"></div><h2>Equation to reach ground</h2><div id="eq" class="out"></div><h2>Result</h2><div id="res" class="out"></div></div></section></main><script>const H=document.getElementById('H'),speed=document.getElementById('speed'),dir=document.getElementById('dir'),pos=document.getElementById('pos'),values=document.getElementById('values'),eq=document.getElementById('eq'),res=document.getElementById('res');function r(x){return Number.isFinite(x)?Number.parseFloat(x.toFixed(3)):x}function sgn(x){return x>0?'+'+r(x):''+r(x)}function solve(A,B,C){const D=B*B-4*A*C;if(D<0)return[];if(Math.abs(A)<1e-12)return[-C/B];const root=Math.sqrt(D);return[(-B-root)/(2*A),(-B+root)/(2*A)].sort((a,b)=>a-b)}function render(){const h=Math.max(0,+H.value), sp=Math.max(0,+speed.value), p=pos.value;let u=0;if(dir.value==='up')u=p==='up'?sp:-sp;if(dir.value==='down')u=p==='down'?sp:-sp;const a=p==='up'?-9.8:9.8;const sg=p==='up'?-h:h;const A=.5*a,B=u,C=-sg;const roots=solve(A,B,C);const valid=roots.filter(t=>t>=-1e-9);values.innerHTML=`<p class="math">u = ${sgn(u)} m s⁻¹</p><p class="math">a = ${sgn(a)} m s⁻²</p><p class="math">s = ${sgn(sg)} m</p>`;eq.innerHTML=`<p class="math">s = ut + ½at²</p><p class="math">${sgn(sg)} = (${sgn(u)})t + ½(${sgn(a)})t²</p><p class="math">${r(A)}t² + ${r(B)}t + ${r(C)} = 0</p>`;if(!valid.length){res.innerHTML='<p class="bad">No valid positive time found.</p>';return}const t=valid[0],v=u+a*t;res.innerHTML=`<p class="good">Ground impact found.</p><p class="math">time = ${r(t)} s</p><p class="math">signed impact velocity = ${sgn(v)} m s⁻¹</p><p class="math">impact speed = ${r(Math.abs(v))} m s⁻¹</p><p>Reject negative time roots for this physical journey.</p>`}render();</script></body></html>
