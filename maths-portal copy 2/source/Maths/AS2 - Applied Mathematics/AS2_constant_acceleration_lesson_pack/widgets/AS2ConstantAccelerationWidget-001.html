<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SUVAT Formula Selector</title><style>body{font-family:Arial,Helvetica,sans-serif;background:#f7f7fb;color:#172033;margin:0}.shell{max-width:960px;margin:auto;padding:28px}.card{background:white;border:1px solid #d6d9e3;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 6px 20px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.checks{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.check{border:1px solid #d6d9e3;border-radius:10px;padding:10px;background:#fff}.formula{padding:12px;border-radius:12px;border:1px solid #d6d9e3;margin:8px 0}.good{background:#ecfff3;border-color:#0f7b3d}.possible{background:#e9eeff}.math{font-family:"Times New Roman",serif;font-size:1.35rem}.warn{color:#a15c00;font-weight:800}.ok{color:#0f7b3d;font-weight:800}@media(max-width:760px){.grid{grid-template-columns:1fr}.checks{grid-template-columns:1fr 1fr}}</style></head><body><main class="shell"><section class="card"><h1>SUVAT Formula Selector</h1><p>Tick what you know, choose what you need, and use SUVAT only when acceleration is constant.</p></section><section class="grid"><div class="card"><h2>Unknown</h2><select id="unknown"><option value="s">s - displacement</option><option value="u">u - initial velocity</option><option value="v">v - final velocity</option><option value="a">a - acceleration</option><option value="t">t - time</option></select></div><div class="card"><h2>Known values</h2><div class="checks" id="checks"><label class="check"><input type="checkbox" value="s"> s</label><label class="check"><input type="checkbox" value="u" checked> u</label><label class="check"><input type="checkbox" value="v" checked> v</label><label class="check"><input type="checkbox" value="a"> a</label><label class="check"><input type="checkbox" value="t" checked> t</label></div></div></section><section class="card"><h2>Suggested formula</h2><div id="result"></div></section><section class="card"><h2>Formula cabinet</h2><div id="list"></div></section></main><script>const formulas=[{ex:"s",vars:["u","v","a","t"],d:"v = u + at"},{ex:"a",vars:["s","u","v","t"],d:"s = ((u + v) / 2)t"},{ex:"t",vars:["s","u","v","a"],d:"v² = u² + 2as"},{ex:"v",vars:["s","u","a","t"],d:"s = ut + ½at²"},{ex:"u",vars:["s","v","a","t"],d:"s = vt - ½at²"}];const names={s:"displacement",u:"initial velocity",v:"final velocity",a:"acceleration",t:"time"};const unknown=document.getElementById('unknown'),checks=document.getElementById('checks'),result=document.getElementById('result'),list=document.getElementById('list');function known(){return [...checks.querySelectorAll('input:checked')].map(x=>x.value)}function usable(f,target,k){return f.vars.includes(target)&&f.vars.every(v=>v===target||k.includes(v))}function render(){const target=unknown.value;checks.querySelectorAll('input').forEach(b=>{b.disabled=b.value===target;if(b.disabled)b.checked=false});const k=known();const u=formulas.filter(f=>usable(f,target,k));result.innerHTML=u.length?`<p class="ok">Good route found.</p><p>You want <b>${target}</b>, ${names[target]}.</p><p class="math">${u[0].d}</p><p>Substitute values first, then solve.</p>`:`<p class="warn">No complete SUVAT equation yet.</p><p>Look for hidden information such as rest, gravity, graph area or graph gradient.</p>`;list.innerHTML=formulas.map(f=>{const cls=usable(f,target,k)?'formula good':f.vars.includes(target)?'formula possible':'formula';return `<div class="${cls}"><div class="math">${f.d}</div><small>Excludes ${f.ex}</small></div>`}).join('')}unknown.onchange=render;checks.onchange=render;render();</script></body></html>
