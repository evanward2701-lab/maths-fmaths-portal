<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
<title id="title">Census vs Sample</title><desc id="desc">A comparison table showing advantages and disadvantages of using a census or a sample.</desc>
<metadata>Asset ID: AS2StatisticalSamplingSVG-002; Source: Data Collection PDF page 7 and transcript Data Collection 1.</metadata>
<rect width="1100" height="720" fill="#fbfaf7"/>
<text x="50" y="60" font-family="Arial" font-size="34" font-weight="700" fill="#111827">Census vs Sample</text>
<text x="50" y="92" font-family="Arial" font-size="18" fill="#374151">A census uses the whole population. A sample uses a subset intended to represent it.</text>
<g font-family="Arial"><rect x="60" y="135" width="980" height="58" rx="8" fill="#111827"/><text x="125" y="172" font-size="20" font-weight="700" fill="#fff">Method</text><text x="390" y="172" font-size="20" font-weight="700" fill="#fff">Advantages</text><text x="780" y="172" font-size="20" font-weight="700" fill="#fff">Disadvantages</text>
<rect x="60" y="193" width="200" height="170" fill="#fff" stroke="#d1d5db"/><rect x="260" y="193" width="390" height="170" fill="#fff" stroke="#d1d5db"/><rect x="650" y="193" width="390" height="170" fill="#fff" stroke="#d1d5db"/><text x="95" y="270" font-size="21" font-weight="700">Census</text><text x="290" y="235" font-size="17">Should give a completely</text><text x="290" y="264" font-size="17">accurate result.</text><text x="680" y="225" font-size="17">• Time consuming and expensive.</text><text x="680" y="258" font-size="17">• Cannot be used when testing</text><text x="700" y="282" font-size="17">involves destruction.</text><text x="680" y="315" font-size="17">• Large volume of data to process.</text>
<rect x="60" y="363" width="200" height="170" fill="#f3f4f6" stroke="#d1d5db"/><rect x="260" y="363" width="390" height="170" fill="#f3f4f6" stroke="#d1d5db"/><rect x="650" y="363" width="390" height="170" fill="#f3f4f6" stroke="#d1d5db"/><text x="95" y="442" font-size="21" font-weight="700">Sample</text><text x="290" y="405" font-size="17">• Cheaper.</text><text x="290" y="438" font-size="17">• Quicker.</text><text x="290" y="471" font-size="17">• Less data to process.</text><text x="680" y="405" font-size="17">• Data may not be accurate.</text><text x="680" y="438" font-size="17">• May not represent small</text><text x="700" y="462" font-size="17">subgroups well.</text>
<rect x="90" y="575" width="920" height="92" rx="18" fill="#fff7ed" stroke="#f97316" stroke-width="3"/><text x="125" y="612" font-size="20" font-weight="700" fill="#9a3412">Destructive testing check</text><text x="125" y="642" font-size="16" fill="#374151">If testing damages or destroys each item, a census is unsuitable. Use a sample instead.</text><text x="125" y="665" font-size="16" fill="#374151">Example: cutting open every avocado to test ripeness would leave none to sell.</text></g></svg>
