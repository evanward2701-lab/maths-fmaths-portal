<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Stratified sampling proportional allocation</title><desc id="desc">A population divided into four strata and a proportional sample taken from each stratum.</desc><metadata>Asset ID: AS2StatisticalSamplingSVG-003; Source: Data Collection PDF pages 13-14 and transcript Data Collection 2.</metadata><rect width="1200" height="760" fill="#fbfaf7"/><text x="50" y="58" font-family="Arial" font-size="34" font-weight="700" fill="#111827">Stratified Sampling</text><text x="50" y="90" font-family="Arial" font-size="18" fill="#374151">Divide the population into strata, then take the same proportion from each stratum.</text><rect x="50" y="125" width="520" height="490" rx="18" fill="#fff" stroke="#d1d5db" stroke-width="2"/><text x="80" y="162" font-family="Arial" font-size="18" font-weight="700">Population divided into strata</text><text x="80" y="188" font-family="Arial" font-size="15" fill="#374151">Example: total population = 50, sample = 10, so sample 20% from each stratum.</text><rect x="90" y="220" width="420" height="320" rx="16" fill="#fff" stroke="#111827" stroke-width="3"/>
<g font-family="Arial" font-size="18" font-weight="700"><text x="110" y="250">Blue stratum: 20</text><text x="110" y="370">Orange stratum: 10</text><text x="110" y="455">Green stratum: 15</text><text x="110" y="540">Red stratum: 5</text></g>
<g stroke-width="2"><circle cx="125" cy="285" r="12" fill="#bfdbfe" stroke="#111827" stroke-width="4"/><circle cx="165" cy="285" r="12" fill="#bfdbfe" stroke="#111827" stroke-width="4"/><circle cx="205" cy="285" r="12" fill="#bfdbfe" stroke="#111827" stroke-width="4"/><circle cx="245" cy="285" r="12" fill="#bfdbfe" stroke="#111827" stroke-width="4"/><circle cx="285" cy="285" r="12" fill="#bfdbfe" stroke="#1d4ed8"/><circle cx="325" cy="285" r="12" fill="#bfdbfe" stroke="#1d4ed8"/><circle cx="365" cy="285" r="12" fill="#bfdbfe" stroke="#1d4ed8"/><circle cx="405" cy="285" r="12" fill="#bfdbfe" stroke="#1d4ed8"/><circle cx="445" cy="285" r="12" fill="#bfdbfe" stroke="#1d4ed8"/><circle cx="125" cy="325" r="12" fill="#bfdbfe" stroke="#1d4ed8"/><circle cx="165" cy="325" r="12" fill="#bfdbfe" stroke="#1d4ed8"/><circle cx="205" cy="325" r="12" fill="#bfdbfe" stroke="#1d4ed8"/>
<circle cx="125" cy="405" r="12" fill="#fed7aa" stroke="#111827" stroke-width="4"/><circle cx="165" cy="405" r="12" fill="#fed7aa" stroke="#111827" stroke-width="4"/><circle cx="205" cy="405" r="12" fill="#fed7aa" stroke="#c2410c"/><circle cx="245" cy="405" r="12" fill="#fed7aa" stroke="#c2410c"/><circle cx="285" cy="405" r="12" fill="#fed7aa" stroke="#c2410c"/><circle cx="325" cy="405" r="12" fill="#fed7aa" stroke="#c2410c"/><circle cx="365" cy="405" r="12" fill="#fed7aa" stroke="#c2410c"/><circle cx="405" cy="405" r="12" fill="#fed7aa" stroke="#c2410c"/>
<circle cx="125" cy="490" r="12" fill="#bbf7d0" stroke="#111827" stroke-width="4"/><circle cx="165" cy="490" r="12" fill="#bbf7d0" stroke="#111827" stroke-width="4"/><circle cx="205" cy="490" r="12" fill="#bbf7d0" stroke="#111827" stroke-width="4"/><circle cx="245" cy="490" r="12" fill="#bbf7d0" stroke="#15803d"/><circle cx="285" cy="490" r="12" fill="#bbf7d0" stroke="#15803d"/><circle cx="325" cy="490" r="12" fill="#bbf7d0" stroke="#15803d"/><circle cx="365" cy="490" r="12" fill="#bbf7d0" stroke="#15803d"/>
<circle cx="305" cy="565" r="12" fill="#fecaca" stroke="#111827" stroke-width="4"/><circle cx="345" cy="565" r="12" fill="#fecaca" stroke="#b91c1c"/><circle cx="385" cy="565" r="12" fill="#fecaca" stroke="#b91c1c"/></g>
<path d="M585 360 C640 360 665 360 705 360" fill="none" stroke="#111827" stroke-width="3"/><rect x="720" y="125" width="420" height="490" rx="18" fill="#fff" stroke="#d1d5db" stroke-width="2"/><text x="750" y="162" font-family="Arial" font-size="18" font-weight="700">Proportional allocation</text><text x="750" y="220" font-family="Arial" font-size="24" font-weight="700">nₕ = (Nₕ / N) × n</text><text x="750" y="252" font-family="Arial" font-size="15" fill="#374151">N = total population size</text><text x="750" y="278" font-family="Arial" font-size="15" fill="#374151">n = total sample size</text><text x="750" y="304" font-family="Arial" font-size="15" fill="#374151">Nₕ = size of stratum h</text><text x="750" y="330" font-family="Arial" font-size="15" fill="#374151">nₕ = sample size from stratum h</text><rect x="750" y="365" width="350" height="175" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="775" y="398" font-family="Arial" font-size="18" font-weight="700">Example: sample 20%</text><text x="775" y="430" font-family="Arial" font-size="15">Blue: 20% of 20 = 4</text><text x="775" y="458" font-family="Arial" font-size="15">Orange: 20% of 10 = 2</text><text x="775" y="486" font-family="Arial" font-size="15">Green: 20% of 15 = 3</text><text x="775" y="514" font-family="Arial" font-size="15">Red: 20% of 5 = 1</text><text x="750" y="580" font-family="Arial" font-size="13" fill="#374151">Final exam sentence: randomly select within each stratum.</text></svg>
