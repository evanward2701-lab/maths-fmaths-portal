<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="740" viewBox="0 0 1100 740" role="img" aria-labelledby="title desc"><title id="title">Types of data classification tree</title><desc id="desc">A flowchart classifying data into qualitative and quantitative, then quantitative data into discrete and continuous.</desc><metadata>Asset ID: AS2StatisticalSamplingSVG-004; Source: Data Collection PDF page 20 and transcript Data Collection 5.</metadata><rect width="1100" height="740" fill="#fbfaf7"/><text x="50" y="60" font-family="Arial" font-size="34" font-weight="700" fill="#111827">Types of Data</text><text x="50" y="92" font-family="Arial" font-size="18" fill="#374151">First decide whether the data is non-numerical or numerical. Then classify numerical data further.</text><g font-family="Arial"><rect x="425" y="130" width="250" height="75" rx="16" fill="#111827"/><text x="510" y="176" font-size="24" font-weight="700" fill="#fff">Data</text><path d="M500 205 C420 255 320 275 260 315" fill="none" stroke="#111827" stroke-width="4"/><path d="M600 205 C680 255 780 275 840 315" fill="none" stroke="#111827" stroke-width="4"/><rect x="105" y="315" width="315" height="82" rx="16" fill="#111827"/><text x="155" y="365" font-size="24" font-weight="700" fill="#fff">Qualitative / Categorical</text><rect x="685" y="315" width="310" height="82" rx="16" fill="#111827"/><text x="765" y="365" font-size="24" font-weight="700" fill="#fff">Quantitative</text><text x="110" y="430" font-size="17" fill="#374151">Non-numerical values.</text><text x="110" y="458" font-size="17" fill="#374151">Examples: colour, type, species.</text><text x="690" y="430" font-size="17" fill="#374151">Numerical values.</text><text x="690" y="458" font-size="17" fill="#374151">Examples: height, age, mass, count.</text><path d="M780 397 C700 475 610 500 535 535" fill="none" stroke="#111827" stroke-width="4"/><path d="M900 397 C960 475 980 500 980 535" fill="none" stroke="#111827" stroke-width="4"/><rect x="390" y="535" width="275" height="82" rx="16" fill="#fff" stroke="#111827" stroke-width="3"/><text x="475" y="585" font-size="22" font-weight="700" fill="#111827">Discrete</text><rect x="820" y="535" width="275" height="82" rx="16" fill="#fff" stroke="#111827" stroke-width="3"/><text x="910" y="585" font-size="22" font-weight="700" fill="#111827">Continuous</text><text x="385" y="650" font-size="17" fill="#374151">Can only take specific values.</text><text x="385" y="678" font-size="17" fill="#374151">Examples: shoe size, number of children.</text><text x="805" y="650" font-size="17" fill="#374151">Can take any decimal value within</text><text x="805" y="678" font-size="17" fill="#374151">a possible specified range.</text><rect x="55" y="535" width="290" height="118" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="80" y="570" font-size="22" font-weight="700" fill="#111827">Exam warning</text><text x="80" y="600" font-size="14" fill="#374151">Discrete does not mean finite.</text><text x="80" y="625" font-size="14" fill="#374151">The number of attempts before</text><text x="80" y="648" font-size="14" fill="#374151">success is discrete but unbounded.</text></g></svg>
