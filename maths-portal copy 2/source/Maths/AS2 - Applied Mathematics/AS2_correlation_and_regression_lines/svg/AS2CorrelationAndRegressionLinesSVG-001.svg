<!--
Asset ID: AS2CorrelationAndRegressionLinesSVG-001
Source: CCEA AS2-DPI-LO005 + S1-Chp4-Correlation.pdf page 5
Related lesson section: Core Theory - Describing correlation
Purpose: Show four scatter-diagram patterns: weak positive, weak negative, strong positive and no correlation.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Correlation type and strength grid</title>
  <desc id="desc">Four scatter diagrams showing weak positive correlation, weak negative correlation, strong positive correlation and no correlation.</desc>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="#111827">Correlation = strength + type</text>
  <text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="18" fill="#374151">Strength is about how close the points are to a trend, not how steep the trend is.</text>
  <g fill="#f9fafb" stroke="#d1d5db" stroke-width="2"><rect x="70" y="120" width="500" height="260" rx="18"/><rect x="630" y="120" width="500" height="260" rx="18"/><rect x="70" y="430" width="500" height="260" rx="18"/><rect x="630" y="430" width="500" height="260" rx="18"/></g>
  <g transform="translate(115,155)"><text x="205" y="-10" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#065f46">Weak positive correlation</text><line x1="40" y1="190" x2="400" y2="190" stroke="#111827" stroke-width="2"/><line x1="40" y1="190" x2="40" y2="20" stroke="#111827" stroke-width="2"/><line x1="70" y1="165" x2="365" y2="55" stroke="#10b981" stroke-width="4" stroke-dasharray="8 8"/><g fill="#2563eb" stroke="#1e3a8a"><circle cx="80" cy="150" r="6"/><circle cx="110" cy="125" r="6"/><circle cx="145" cy="138" r="6"/><circle cx="175" cy="96" r="6"/><circle cx="215" cy="112" r="6"/><circle cx="250" cy="74" r="6"/><circle cx="280" cy="90" r="6"/><circle cx="320" cy="40" r="6"/><circle cx="355" cy="65" r="6"/></g><text x="220" y="225" text-anchor="middle" font-family="Arial" font-size="15">as x increases, y tends to increase</text></g>
  <g transform="translate(675,155)"><text x="205" y="-10" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#92400e">Weak negative correlation</text><line x1="40" y1="190" x2="400" y2="190" stroke="#111827" stroke-width="2"/><line x1="40" y1="190" x2="40" y2="20" stroke="#111827" stroke-width="2"/><line x1="70" y1="55" x2="365" y2="165" stroke="#f59e0b" stroke-width="4" stroke-dasharray="8 8"/><g fill="#2563eb" stroke="#1e3a8a"><circle cx="80" cy="54" r="6"/><circle cx="115" cy="83" r="6"/><circle cx="150" cy="60" r="6"/><circle cx="185" cy="115" r="6"/><circle cx="220" cy="98" r="6"/><circle cx="255" cy="142" r="6"/><circle cx="295" cy="132" r="6"/><circle cx="330" cy="168" r="6"/><circle cx="365" cy="150" r="6"/></g><text x="220" y="225" text-anchor="middle" font-family="Arial" font-size="15">as x increases, y tends to decrease</text></g>
  <g transform="translate(115,465)"><text x="205" y="-10" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#1d4ed8">Strong positive correlation</text><line x1="40" y1="190" x2="400" y2="190" stroke="#111827" stroke-width="2"/><line x1="40" y1="190" x2="40" y2="20" stroke="#111827" stroke-width="2"/><line x1="70" y1="170" x2="365" y2="42" stroke="#2563eb" stroke-width="4"/><g fill="#2563eb" stroke="#1e3a8a"><circle cx="80" cy="165" r="6"/><circle cx="115" cy="150" r="6"/><circle cx="150" cy="134" r="6"/><circle cx="185" cy="118" r="6"/><circle cx="220" cy="102" r="6"/><circle cx="255" cy="84" r="6"/><circle cx="290" cy="70" r="6"/><circle cx="325" cy="54" r="6"/><circle cx="360" cy="42" r="6"/></g><text x="220" y="225" text-anchor="middle" font-family="Arial" font-size="15">points sit close to an upward trend</text></g>
  <g transform="translate(675,465)"><text x="205" y="-10" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#7f1d1d">No correlation</text><line x1="40" y1="190" x2="400" y2="190" stroke="#111827" stroke-width="2"/><line x1="40" y1="190" x2="40" y2="20" stroke="#111827" stroke-width="2"/><g fill="#2563eb" stroke="#1e3a8a"><circle cx="85" cy="78" r="6"/><circle cx="118" cy="160" r="6"/><circle cx="150" cy="55" r="6"/><circle cx="190" cy="130" r="6"/><circle cx="225" cy="90" r="6"/><circle cx="260" cy="170" r="6"/><circle cx="300" cy="66" r="6"/><circle cx="335" cy="145" r="6"/><circle cx="365" cy="105" r="6"/></g><text x="220" y="225" text-anchor="middle" font-family="Arial" font-size="15">no clear increasing or decreasing pattern</text></g>
</svg>
