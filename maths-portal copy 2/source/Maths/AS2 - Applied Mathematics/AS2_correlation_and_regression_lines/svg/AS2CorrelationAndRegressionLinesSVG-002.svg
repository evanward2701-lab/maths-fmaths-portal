<!-- Asset ID: AS2CorrelationAndRegressionLinesSVG-002 | Purpose: Label independent/explanatory and dependent/response variables. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Independent and dependent variables on a scatter diagram</title><desc id="desc">A scatter diagram showing distance travelled on the horizontal axis and train fare cost on the vertical axis.</desc><rect width="1200" height="720" fill="#fff"/><text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700">Scatter diagrams: which variable goes where?</text><text x="600" y="84" text-anchor="middle" font-family="Arial" font-size="18" fill="#4b5563">The response variable usually depends on the explanatory variable.</text><rect x="150" y="130" width="620" height="430" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/><line x1="190" y1="515" x2="735" y2="515" stroke="#111827" stroke-width="3"/><line x1="190" y1="515" x2="190" y2="160" stroke="#111827" stroke-width="3"/><line x1="215" y1="490" x2="705" y2="205" stroke="#2563eb" stroke-width="4" opacity=".75"/><g fill="#059669" stroke="#064e3b"><circle cx="230" cy="482" r="7"/><circle cx="275" cy="455" r="7"/><circle cx="320" cy="426" r="7"/><circle cx="370" cy="395" r="7"/><circle cx="425" cy="362" r="7"/><circle cx="485" cy="326" r="7"/><circle cx="555" cy="287" r="7"/><circle cx="625" cy="250" r="7"/><circle cx="690" cy="215" r="7"/></g><text x="462" y="585" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Distance travelled, x km</text><text x="85" y="340" text-anchor="middle" transform="rotate(-90 85 340)" font-family="Arial" font-size="22" font-weight="700">Cost of train fare, y</text><rect x="815" y="145" width="300" height="160" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/><text x="965" y="185" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#065f46">x-axis</text><text x="965" y="220" text-anchor="middle" font-family="Arial" font-size="19">independent / explanatory</text><text x="965" y="255" text-anchor="middle" font-family="Arial" font-size="17">used to explain or predict</text><rect x="815" y="360" width="300" height="160" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="965" y="400" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#1e3a8a">y-axis</text><text x="965" y="435" text-anchor="middle" font-family="Arial" font-size="19">dependent / response</text><text x="965" y="470" text-anchor="middle" font-family="Arial" font-size="17">responds to the x variable</text><rect x="165" y="620" width="870" height="56" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="600" y="655" text-anchor="middle" font-family="Arial" font-size="20" fill="#78350f">Interpretation: as distance travelled increases, the train fare tends to increase.</text></svg>
