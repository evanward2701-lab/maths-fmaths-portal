<!-- Asset ID: AS2CorrelationAndRegressionLinesSVG-003 | Purpose: Show a regression line with gradient/intercept interpretation and residual distances. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Regression line interpretation</title><desc id="desc">Scatter diagram with a regression line, residual distances, intercept and gradient interpretation for y equals a plus bx.</desc><rect width="1200" height="760" fill="#fff"/><text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700">Regression line: y = a + bx</text><text x="600" y="84" text-anchor="middle" font-family="Arial" font-size="18" fill="#4b5563">Interpret the given line. Do not calculate the regression line for AS2-DPI-LO004.</text><rect x="90" y="125" width="650" height="480" rx="18" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/><line x1="150" y1="540" x2="700" y2="540" stroke="#111827" stroke-width="3"/><line x1="150" y1="540" x2="150" y2="165" stroke="#111827" stroke-width="3"/><line x1="150" y1="455" x2="690" y2="205" stroke="#2563eb" stroke-width="5"/><text x="470" y="245" font-family="Arial" font-size="28" font-weight="700" fill="#1d4ed8">y = 20 + 3x</text><g fill="#111827"><circle cx="190" cy="438" r="7"/><circle cx="235" cy="425" r="7"/><circle cx="280" cy="390" r="7"/><circle cx="330" cy="405" r="7"/><circle cx="375" cy="342" r="7"/><circle cx="420" cy="365" r="7"/><circle cx="470" cy="300" r="7"/><circle cx="520" cy="285" r="7"/><circle cx="575" cy="245" r="7"/><circle cx="625" cy="260" r="7"/></g><g stroke="#ef4444" stroke-width="3" stroke-dasharray="5 5"><line x1="330" y1="405" x2="330" y2="372"/><line x1="420" y1="365" x2="420" y2="330"/><line x1="625" y1="260" x2="625" y2="235"/></g><circle cx="150" cy="455" r="8" fill="#f59e0b"/><text x="175" y="458" font-family="Arial" font-size="18" fill="#92400e">intercept a = 20</text><path d="M520 285 L620 285 L620 239" fill="none" stroke="#10b981" stroke-width="4"/><text x="570" y="310" text-anchor="middle" font-family="Arial" font-size="16" fill="#065f46">+1 in x</text><text x="645" y="264" font-family="Arial" font-size="16" fill="#065f46">+3 in y</text><text x="425" y="590" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Time spent revising, x hours</text><text x="55" y="365" text-anchor="middle" transform="rotate(-90 55 365)" font-family="Arial" font-size="22" font-weight="700">Exam mark, y</text><rect x="790" y="145" width="330" height="150" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="955" y="185" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1e3a8a">Gradient b = 3</text><text x="955" y="225" text-anchor="middle" font-family="Arial" font-size="18">Each extra hour revising</text><text x="955" y="252" text-anchor="middle" font-family="Arial" font-size="18">adds 3 predicted marks.</text><rect x="790" y="330" width="330" height="150" rx="18" fill="#fffbeb" stroke="#f59e0b" stroke-width="3"/><text x="955" y="370" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#92400e">Intercept a = 20</text><text x="955" y="410" text-anchor="middle" font-family="Arial" font-size="18">Predicted mark when x=0.</text></svg>
