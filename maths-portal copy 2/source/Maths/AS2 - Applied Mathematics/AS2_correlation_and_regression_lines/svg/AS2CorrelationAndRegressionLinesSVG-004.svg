<!-- Asset ID: AS2CorrelationAndRegressionLinesSVG-004 | Purpose: Show interpolation inside the data range and extrapolation outside the data range. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Interpolation and extrapolation</title><desc id="desc">Regression line with observed data range, interpolation and extrapolation labels.</desc><rect width="1200" height="760" fill="#fff"/><text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700">Regression estimates: inside or outside the data range?</text><text x="600" y="84" text-anchor="middle" font-family="Arial" font-size="18" fill="#4b5563">Interpolation lives inside the evidence. Extrapolation wanders beyond the fence.</text><rect x="100" y="125" width="690" height="500" rx="18" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/><line x1="170" y1="560" x2="735" y2="560" stroke="#111827" stroke-width="3"/><line x1="170" y1="560" x2="170" y2="170" stroke="#111827" stroke-width="3"/><rect x="330" y="185" width="315" height="375" fill="#dcfce7" opacity="0.55"/><line x1="330" y1="560" x2="330" y2="185" stroke="#16a34a" stroke-width="3" stroke-dasharray="8 8"/><line x1="645" y1="560" x2="645" y2="185" stroke="#16a34a" stroke-width="3" stroke-dasharray="8 8"/><text x="487" y="210" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#166534">observed data range</text><line x1="245" y1="505" x2="710" y2="255" stroke="#2563eb" stroke-width="5"/><g fill="#2563eb" stroke="#1e3a8a"><circle cx="345" cy="470" r="7"/><circle cx="375" cy="430" r="7"/><circle cx="405" cy="452" r="7"/><circle cx="440" cy="390" r="7"/><circle cx="470" cy="405" r="7"/><circle cx="505" cy="350" r="7"/><circle cx="545" cy="330" r="7"/><circle cx="585" cy="305" r="7"/><circle cx="625" cy="285" r="7"/></g><line x1="575" y1="560" x2="575" y2="328" stroke="#059669" stroke-width="4"/><circle cx="575" cy="328" r="9" fill="#059669"/><text x="575" y="535" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#065f46">x=39</text><text x="575" y="628" text-anchor="middle" font-family="Arial" font-size="17" fill="#065f46">interpolation</text><line x1="245" y1="560" x2="245" y2="505" stroke="#dc2626" stroke-width="4"/><circle cx="245" cy="505" r="9" fill="#dc2626"/><text x="245" y="535" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#7f1d1d">x=30</text><text x="245" y="628" text-anchor="middle" font-family="Arial" font-size="17" fill="#7f1d1d">extrapolation</text><rect x="840" y="145" width="300" height="140" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/><text x="990" y="185" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#065f46">Interpolation</text><text x="990" y="225" text-anchor="middle" font-family="Arial" font-size="18">inside the data range</text><rect x="840" y="330" width="300" height="140" rx="18" fill="#fef2f2" stroke="#ef4444" stroke-width="3"/><text x="990" y="370" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#7f1d1d">Extrapolation</text><text x="990" y="410" text-anchor="middle" font-family="Arial" font-size="18">outside the data range</text><rect x="840" y="515" width="300" height="130" rx="18" fill="#fffbeb" stroke="#f59e0b" stroke-width="3"/><text x="990" y="555" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#92400e">Do not reverse it</text><text x="990" y="592" text-anchor="middle" font-family="Arial" font-size="17">A line of y on x predicts</text><text x="990" y="617" text-anchor="middle" font-family="Arial" font-size="17">y from x, not x from y.</text></svg>
