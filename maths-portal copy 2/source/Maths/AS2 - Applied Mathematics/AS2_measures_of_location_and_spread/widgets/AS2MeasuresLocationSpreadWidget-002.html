<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Variance and Standard Deviation Widget</title><style>body{font-family:Arial,sans-serif;background:#f8fafc;color:#111827;padding:24px}.widget{max-width:950px;margin:auto;background:white;border:1px solid #d1d5db;border-radius:20px;box-shadow:0 10px 25px #0002;overflow:hidden}header{background:#111827;color:white;padding:20px}.grid{display:grid;grid-template-columns:340px 1fr}.controls{padding:18px;background:#f8fafc;border-right:1px solid #ddd}.out{padding:18px}label{display:block;font-weight:700;margin-top:12px}textarea,input,select{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:9px}button{margin-top:15px;width:100%;padding:12px;border:0;border-radius:10px;background:#7c3aed;color:white;font-weight:700}.card{border:1px solid #ddd;border-radius:14px;padding:14px;margin-bottom:12px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;padding:10px}.stat b{display:block;color:#4b5563}.stat span{font-size:1.25rem;font-weight:800;color:#2563eb}@media(max-width:760px){.grid{grid-template-columns:1fr}.controls{border-right:0;border-bottom:1px solid #ddd}}</style></head><body><div class="widget"><header><h1>Variance and Standard Deviation Explorer</h1><p>Calculate population or sample spread from raw values or summary statistics.</p></header><div class="grid"><section class="controls"><label>Mode</label><select id="mode"><option value="raw">Raw data</option><option value="summary">Summary stats</option></select><div id="raw"><label>Raw values</label><textarea id="vals">4, 7, 9, 10, 15</textarea></div><div id="summary" style="display:none"><label>n</label><input id="n" type="number" value="20"><label>Σx</label><input id="sx" type="number" value="374"><label>Σx²</label><input id="sx2" type="number" value="7600"></div><label>Type</label><select id="kind"><option value="pop">Population: divide by n</option><option value="sample">Sample: divide by n - 1</option></select><button onclick="calc()">Calculate</button></section><section class="out"><div class="card stats"><div class="stat"><b>n</b><span id="on"></span></div><div class="stat"><b>Σx</b><span id="osx"></span></div><div class="stat"><b>Σx²</b><span id="osx2"></span></div><div class="stat"><b>Mean</b><span id="omean"></span></div><div class="stat"><b>Variance</b><span id="ovar"></span></div><div class="stat"><b>SD</b><span id="osd"></span></div></div><div class="card"><h2>Steps</h2><ol id="steps"></ol><p id="warn" style="color:#dc2626;font-weight:700"></p></div></section></div></div><script>function f(x){return Number(x.toFixed(5)).toString()}function rawVals(){return vals.value.split(/[,\s]+/).filter(Boolean).map(Number).filter(Number.isFinite)}function toggle(){raw.style.display=mode.value==='raw'?'block':'none';summary.style.display=mode.value==='summary'?'block':'none';calc()}function calc(){let N,S,S2;if(mode.value==='raw'){let a=rawVals();N=a.length;S=a.reduce((x,y)=>x+y,0);S2=a.reduce((x,y)=>x+y*y,0)}else{N=+n.value;S=+sx.value;S2=+sx2.value}steps.innerHTML='';warn.textContent='';if(N<=0||!isFinite(S)||!isFinite(S2)){warn.textContent='Enter valid data.';return}let mean=S/N, variance;if(kind.value==='pop'){variance=S2/N-mean*mean}else{if(N<=1){warn.textContent='Sample SD needs n > 1.';return}variance=(S2-S*S/N)/(N-1)}if(variance<0&&variance>-1e-10)variance=0;let sd=Math.sqrt(variance);on.textContent=N;osx.textContent=f(S);osx2.textContent=f(S2);omean.textContent=f(mean);ovar.textContent=f(variance);osd.textContent=f(sd);let lines=kind.value==='pop'?[`x̄ = Σx/n = ${f(S)}/${N} = ${f(mean)}`,`σ² = Σx²/n - x̄² = ${f(S2)}/${N} - (${f(mean)})² = ${f(variance)}`,`σ = √${f(variance)} = ${f(sd)}`]:[`x̄ = ${f(mean)}`,`s² = (Σx² - (Σx)²/n)/(n-1) = ${f(variance)}`,`s = √${f(variance)} = ${f(sd)}`];lines.forEach(s=>{let li=document.createElement('li');li.textContent=s;steps.appendChild(li)})}mode.addEventListener('change',toggle);document.querySelectorAll('input,textarea,select').forEach(e=>e.addEventListener('input',calc));calc()</script></body></html>
