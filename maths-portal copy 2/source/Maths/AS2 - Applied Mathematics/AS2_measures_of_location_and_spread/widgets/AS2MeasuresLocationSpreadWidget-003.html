<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Coding Transformation Widget</title><style>body{font-family:Arial,sans-serif;background:#fff7ed;color:#111827;padding:24px}.widget{max-width:900px;margin:auto;background:white;border:1px solid #d1d5db;border-radius:20px;box-shadow:0 10px 25px #0002;overflow:hidden}header{background:#111827;color:white;padding:20px}.grid{display:grid;grid-template-columns:320px 1fr}.controls{padding:18px;background:#f8fafc;border-right:1px solid #ddd}.out{padding:18px}label{display:block;font-weight:700;margin-top:12px}input{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:9px}button{margin-top:15px;width:100%;padding:12px;border:0;border-radius:10px;background:#ea580c;color:white;font-weight:700}.card{border:1px solid #ddd;border-radius:14px;padding:14px;margin-bottom:12px}.res{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.res div{background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;padding:10px}.res b{display:block;color:#4b5563}.res span{font-size:1.2rem;font-weight:800;color:#2563eb}.boundary{color:#dc2626;font-weight:700}@media(max-width:760px){.grid{grid-template-columns:1fr}.controls{border-right:0;border-bottom:1px solid #ddd}.res{grid-template-columns:1fr}}</style></head><body><div class="widget"><header><h1>Coding Transformation Explorer</h1><p>For y = ax + b: mean uses the full transformation; standard deviation only scales by |a|; variance scales by a².</p></header><div class="grid"><section class="controls"><label>Mean of x</label><input id="mx" type="number" value="12"><label>SD of x</label><input id="sdx" type="number" value="5"><label>a</label><input id="a" type="number" value="3"><label>b</label><input id="b" type="number" value="-7"><button onclick="calc()">Transform</button></section><section class="out"><div class="card"><h2 id="eq">y = 3x - 7</h2></div><div class="card res"><div><b>Mean of y</b><span id="my"></span></div><div><b>SD of y</b><span id="sdy"></span></div><div><b>Variance of y</b><span id="vy"></span></div></div><div class="card"><h2>Steps</h2><ol id="steps"></ol></div><div class="card"><p class="boundary">Boundary note: coding is retained as enrichment/support, not as a separate supplied CCEA LO.</p></div></section></div></div><script>function f(x){return Number(x.toFixed(5)).toString()}function s(v){return v<0?`- ${f(Math.abs(v))}`:`+ ${f(v)}`}function calc(){let M=+mx.value,SD=+sdx.value,A=+a.value,B=+b.value;let MY=A*M+B,SDY=Math.abs(A)*SD,VY=A*A*SD*SD;eq.textContent=`y = ${f(A)}x ${s(B)}`;my.textContent=f(MY);sdy.textContent=f(SDY);vy.textContent=f(VY);steps.innerHTML='';[`ȳ = a x̄ + b = ${f(A)} × ${f(M)} ${s(B)} = ${f(MY)}`,`σy = |a| σx = |${f(A)}| × ${f(SD)} = ${f(SDY)}`,`σy² = a²σx² = (${f(A)})² × (${f(SD)})² = ${f(VY)}`].forEach(t=>{let li=document.createElement('li');li.textContent=t;steps.appendChild(li)})}document.querySelectorAll('input').forEach(e=>e.addEventListener('input',calc));calc()</script></body></html>
