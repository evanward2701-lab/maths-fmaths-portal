<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Linear Interpolation Widget</title><style>body{font-family:Arial,sans-serif;background:#f8fafc;color:#111827;padding:24px}.widget{max-width:900px;margin:auto;background:white;border:1px solid #d1d5db;border-radius:20px;box-shadow:0 10px 25px #0002;overflow:hidden}header{background:#111827;color:white;padding:20px}.grid{display:grid;grid-template-columns:320px 1fr}.controls{padding:18px;background:#f8fafc;border-right:1px solid #ddd}.out{padding:18px}label{display:block;font-weight:700;margin-top:12px}input,select{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:9px}button{margin-top:15px;width:100%;padding:12px;border:0;border-radius:10px;background:#2563eb;color:white;font-weight:700}.card{border:1px solid #ddd;border-radius:14px;padding:14px;margin-bottom:12px}.ans{font-size:1.4rem;font-weight:800;color:#16a34a}@media(max-width:760px){.grid{grid-template-columns:1fr}.controls{border-right:0;border-bottom:1px solid #ddd}}</style></head><body><div class="widget"><header><h1>Linear Interpolation for Grouped Data</h1><p>Estimate a grouped-data median or quartile with the formula L + ((k - Cbefore)/(Cafter - Cbefore))w.</p></header><div class="grid"><section class="controls"><label>Position type</label><select id="type"><option value="median">Median n/2</option><option value="q1">Q1 n/4</option><option value="q3">Q3 3n/4</option><option value="custom">Custom k</option></select><label>Total frequency n</label><input id="n" type="number" value="150"><label>Custom k</label><input id="k" type="number" value="75"><label>Cumulative before</label><input id="cb" type="number" value="55"><label>Cumulative after</label><input id="ca" type="number" value="100"><label>Lower boundary L</label><input id="l" type="number" value="0.60" step="0.01"><label>Upper boundary</label><input id="u" type="number" value="0.65" step="0.01"><button onclick="calc()">Calculate</button></section><section class="out"><div class="card"><h2>Formula</h2><p id="formula"></p></div><div class="card"><h2>Steps</h2><ol id="steps"></ol></div><div class="card"><h2>Answer</h2><p class="ans" id="answer"></p><p id="warn" style="color:#dc2626;font-weight:700"></p></div></section></div></div><script>function f(x){return Number(x.toFixed(5)).toString()}function pos(){let t=type.value,N=+n.value;if(t==='median')return N/2;if(t==='q1')return N/4;if(t==='q3')return 3*N/4;return +k.value}function calc(){let K=pos(),CB=+cb.value,CA=+ca.value,L=+l.value,U=+u.value,W=U-L,D=CA-CB;steps.innerHTML='';warn.textContent='';if(D<=0||W<=0){answer.textContent='';warn.textContent='Check cumulative frequencies and class boundaries.';return}if(K<CB||K>CA)warn.textContent='Warning: k is not between the cumulative frequencies, so check the class.';let frac=(K-CB)/D,est=L+frac*W;formula.textContent=`estimate = ${f(L)} + ((${f(K)} - ${f(CB)}) / (${f(CA)} - ${f(CB)})) × ${f(W)}`;[ `k = ${f(K)}`,`frequency fraction = (${f(K)} - ${f(CB)}) / (${f(CA)} - ${f(CB)}) = ${f(frac)}`,`class width = ${f(U)} - ${f(L)} = ${f(W)}`,`estimate = ${f(est)}`].forEach(s=>{let li=document.createElement('li');li.textContent=s;steps.appendChild(li)});answer.textContent=`Estimate = ${f(est)}`}document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',calc));calc()</script></body></html>
