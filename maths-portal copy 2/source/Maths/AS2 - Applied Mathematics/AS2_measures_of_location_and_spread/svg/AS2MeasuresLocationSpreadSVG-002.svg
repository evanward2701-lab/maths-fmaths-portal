<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc"><title id="title">Linear Interpolation for Grouped Data</title><desc id="desc">Frequency fraction mapped onto the class interval.</desc><rect width="1200" height="740" fill="#fbfbf7"/><text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#111827">Linear Interpolation</text><text x="600" y="95" text-anchor="middle" font-family="Arial" font-size="20" fill="#374151">Match the fraction through cumulative frequency to the same fraction through class width.</text><line x1="190" y1="245" x2="1010" y2="245" stroke="#374151" stroke-width="5" stroke-linecap="round"/><circle cx="190" cy="245" r="10" fill="#2563eb"/><circle cx="555" cy="245" r="10" fill="#dc2626"/><circle cx="1010" cy="245" r="10" fill="#2563eb"/><text x="190" y="205" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#1d4ed8">55</text><text x="555" y="205" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#b91c1c">75</text><text x="1010" y="205" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#1d4ed8">100</text><text x="374" y="405" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#b91c1c">fraction = (75 - 55) / (100 - 55) = 20 / 45</text><line x1="190" y1="505" x2="1010" y2="505" stroke="#374151" stroke-width="5" stroke-linecap="round"/><circle cx="190" cy="505" r="10" fill="#16a34a"/><circle cx="555" cy="505" r="10" fill="#dc2626"/><circle cx="1010" cy="505" r="10" fill="#16a34a"/><text x="190" y="553" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#166534">0.60 m</text><text x="555" y="553" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#b91c1c">Median</text><text x="1010" y="553" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#166534">0.65 m</text><path d="M555 335 C600 390, 600 450, 555 505" fill="none" stroke="#7c3aed" stroke-width="4" stroke-dasharray="10 8"/><text x="735" y="423" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#6d28d9">same fraction along class width</text><rect x="215" y="625" width="770" height="62" rx="18" fill="#ffffff" stroke="#111827" stroke-width="2"/><text x="600" y="664" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#111827">estimate = L + ((k - C_before) / (C_after - C_before)) × w</text></svg>