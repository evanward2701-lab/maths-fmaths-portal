<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Measures of Location and Spread</title><desc id="desc">Measures of central tendency as a subset of location, and spread as a separate group.</desc><rect width="1200" height="720" fill="#fbfbf7"/><text x="600" y="58" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#1f2937">Measures of Location and Spread</text><ellipse cx="360" cy="380" rx="290" ry="230" fill="#eef6ff" stroke="#2563eb" stroke-width="5"/><text x="360" y="185" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#1d4ed8">Measures of Location</text><text x="360" y="218" text-anchor="middle" font-family="Arial" font-size="18" fill="#1e3a8a">single values describing a position in a data set</text><ellipse cx="300" cy="380" rx="155" ry="112" fill="#ffffff" stroke="#0f766e" stroke-width="4"/><text x="300" y="318" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#0f766e">Central Tendency</text><text x="300" y="350" text-anchor="middle" font-family="Arial" font-size="18" fill="#134e4a">centre of the data</text><circle cx="235" cy="410" r="38" fill="#d1fae5" stroke="#0f766e" stroke-width="2"/><text x="235" y="416" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#064e3b">Mean</text><circle cx="300" cy="455" r="42" fill="#d1fae5" stroke="#0f766e" stroke-width="2"/><text x="300" y="461" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#064e3b">Median</text><circle cx="370" cy="410" r="38" fill="#d1fae5" stroke="#0f766e" stroke-width="2"/><text x="370" y="416" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#064e3b">Mode</text><rect x="465" y="305" width="130" height="48" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="530" y="336" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#1e40af">Maximum</text><rect x="455" y="370" width="130" height="48" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="520" y="401" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#1e40af">Minimum</text><rect x="430" y="435" width="130" height="48" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="495" y="466" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#1e40af">Quartiles</text><rect x="180" y="535" width="145" height="48" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="252" y="566" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#1e40af">Deciles</text><rect x="350" y="535" width="155" height="48" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="428" y="566" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#1e40af">Percentiles</text><ellipse cx="875" cy="380" rx="225" ry="205" fill="#fff7ed" stroke="#f97316" stroke-width="5"/><text x="875" y="215" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#c2410c">Measures of Spread</text><text x="875" y="248" text-anchor="middle" font-family="Arial" font-size="18" fill="#9a3412">how spread out the data are</text><rect x="760" y="310" width="145" height="52" rx="15" fill="#ffedd5" stroke="#f97316" stroke-width="2"/><text x="832" y="343" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#9a3412">Range</text><rect x="920" y="310" width="145" height="52" rx="15" fill="#ffedd5" stroke="#f97316" stroke-width="2"/><text x="992" y="333" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#9a3412">Interquartile</text><text x="992" y="354" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#9a3412">Range</text><rect x="760" y="405" width="145" height="58" rx="15" fill="#ffedd5" stroke="#f97316" stroke-width="2"/><text x="832" y="429" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#9a3412">Standard</text><text x="832" y="451" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#9a3412">Deviation</text><rect x="920" y="405" width="145" height="58" rx="15" fill="#ffedd5" stroke="#f97316" stroke-width="2"/><text x="992" y="441" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#9a3412">Variance</text><text x="600" y="660" text-anchor="middle" font-family="Arial" font-size="20" fill="#374151">Key exam idea: centre and spread answer different questions.</text></svg>