<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">True Class Limits</title><desc id="desc">Rounded class intervals becoming continuous true class boundaries.</desc><rect width="1200" height="720" fill="#fbfbf7"/><text x="600" y="58" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#111827">True Class Limits</text><text x="600" y="100" text-anchor="middle" font-family="Arial" font-size="20" fill="#374151">Rounded class intervals often hide the real continuous boundaries.</text><rect x="120" y="165" width="960" height="105" rx="22" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="600" y="208" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#92400e">Written class: 10 - 12</text><text x="600" y="244" text-anchor="middle" font-family="Arial" font-size="19" fill="#92400e">Values were measured to the nearest whole number.</text><line x1="165" y1="430" x2="1035" y2="430" stroke="#111827" stroke-width="5" stroke-linecap="round"/><line x1="275" y1="390" x2="275" y2="470" stroke="#2563eb" stroke-width="5"/><line x1="600" y1="390" x2="600" y2="470" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 8"/><line x1="925" y1="390" x2="925" y2="470" stroke="#2563eb" stroke-width="5"/><text x="275" y="372" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1d4ed8">9.5</text><text x="600" y="372" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#b91c1c">11</text><text x="925" y="372" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1d4ed8">12.5</text><rect x="275" y="480" width="650" height="70" fill="#dbeafe" opacity="0.85" stroke="#2563eb" stroke-width="3"/><text x="600" y="525" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1e40af">True interval: 9.5 ≤ x &lt; 12.5</text><path d="M275 585 L925 585" stroke="#16a34a" stroke-width="6" stroke-linecap="round"/><text x="600" y="630" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#166534">Class width = 12.5 - 9.5 = 3</text><rect x="120" y="610" width="315" height="58" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="278" y="646" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#991b1b">Exam trap: not 12 - 10 = 2</text></svg>