<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Quartiles and Interquartile Range</title><desc id="desc">Q1, Q2, Q3 and the interquartile range.</desc><rect width="1200" height="720" fill="#fbfbf7"/><text x="600" y="58" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#111827">Quartiles and Interquartile Range</text><text x="600" y="102" text-anchor="middle" font-family="Arial" font-size="20" fill="#374151">Quartiles split ordered data into quarters. The IQR measures the spread of the middle 50%.</text><line x1="150" y1="350" x2="1050" y2="350" stroke="#111827" stroke-width="6" stroke-linecap="round"/><rect x="325" y="303" width="550" height="94" fill="#dcfce7" stroke="#16a34a" stroke-width="3" opacity="0.9"/><text x="600" y="292" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#166534">Middle 50% of data</text><line x1="150" y1="310" x2="150" y2="390" stroke="#6b7280" stroke-width="4"/><line x1="325" y1="285" x2="325" y2="415" stroke="#2563eb" stroke-width="5"/><line x1="600" y1="285" x2="600" y2="415" stroke="#7c3aed" stroke-width="5"/><line x1="875" y1="285" x2="875" y2="415" stroke="#2563eb" stroke-width="5"/><line x1="1050" y1="310" x2="1050" y2="390" stroke="#6b7280" stroke-width="4"/><text x="150" y="445" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#4b5563">Minimum</text><text x="325" y="445" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1d4ed8">Q1</text><text x="600" y="445" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#6d28d9">Q2</text><text x="875" y="445" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1d4ed8">Q3</text><text x="1050" y="445" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#4b5563">Maximum</text><text x="325" y="475" text-anchor="middle" font-family="Arial" font-size="18" fill="#1e40af">25% position</text><text x="600" y="475" text-anchor="middle" font-family="Arial" font-size="18" fill="#6d28d9">median</text><text x="875" y="475" text-anchor="middle" font-family="Arial" font-size="18" fill="#1e40af">75% position</text><path d="M325 530 L875 530" stroke="#16a34a" stroke-width="6" stroke-linecap="round"/><text x="600" y="573" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#166534">IQR = Q3 - Q1</text><rect x="225" y="610" width="750" height="54" rx="18" fill="#ffffff" stroke="#111827" stroke-width="2"/><text x="600" y="645" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827">IQR is less affected by extreme values than the full range.</text></svg>