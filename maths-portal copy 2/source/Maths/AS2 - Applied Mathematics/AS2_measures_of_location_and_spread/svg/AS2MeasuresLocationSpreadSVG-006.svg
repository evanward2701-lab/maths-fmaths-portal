<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Coding Transformation Effects</title><desc id="desc">How y equals ax plus b affects mean, standard deviation and variance.</desc><rect width="1200" height="760" fill="#fbfbf7"/><text x="600" y="58" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#111827">Coding: y = ax + b</text><text x="600" y="100" text-anchor="middle" font-family="Arial" font-size="20" fill="#374151">Coding transforms data. Location and spread do not respond in the same way.</text><rect x="170" y="155" width="860" height="78" rx="22" fill="#ffffff" stroke="#111827" stroke-width="3"/><text x="600" y="205" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#111827">y = ax + b</text><rect x="90" y="300" width="300" height="235" rx="24" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="240" y="345" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#1d4ed8">Mean</text><text x="240" y="395" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#1e40af">ȳ = a x̄ + b</text><text x="240" y="448" text-anchor="middle" font-family="Arial" font-size="18" fill="#1e3a8a">Full transformation applies.</text><rect x="450" y="300" width="300" height="235" rx="24" fill="#ecfdf5" stroke="#16a34a" stroke-width="4"/><text x="600" y="345" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#166534">Standard Deviation</text><text x="600" y="395" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#166534">σᵧ = |a| σₓ</text><text x="600" y="448" text-anchor="middle" font-family="Arial" font-size="18" fill="#14532d">Only the scale factor affects spread.</text><rect x="810" y="300" width="300" height="235" rx="24" fill="#fff7ed" stroke="#f97316" stroke-width="4"/><text x="960" y="345" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#9a3412">Variance</text><text x="960" y="395" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#9a3412">σᵧ² = a² σₓ²</text><text x="960" y="448" text-anchor="middle" font-family="Arial" font-size="18" fill="#7c2d12">Scale factor is squared.</text><rect x="130" y="600" width="940" height="82" rx="22" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="600" y="635" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#991b1b">Boundary note</text><text x="600" y="665" text-anchor="middle" font-family="Arial" font-size="19" fill="#991b1b">Coding is retained as enrichment/support, not as a separate supplied CCEA LO.</text></svg>