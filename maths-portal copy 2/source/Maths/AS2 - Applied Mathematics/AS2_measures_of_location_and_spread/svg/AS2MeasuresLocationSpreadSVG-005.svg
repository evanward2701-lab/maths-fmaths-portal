<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Variance and Standard Deviation</title><desc id="desc">Data values, distances from the mean, variance and standard deviation.</desc><rect width="1200" height="760" fill="#fbfbf7"/><text x="600" y="58" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#111827">Variance and Standard Deviation</text><text x="600" y="100" text-anchor="middle" font-family="Arial" font-size="20" fill="#374151">Variance measures average squared distance from the mean. Standard deviation is the square root of variance.</text><line x1="135" y1="285" x2="1065" y2="285" stroke="#111827" stroke-width="5" stroke-linecap="round"/><line x1="600" y1="205" x2="600" y2="365" stroke="#dc2626" stroke-width="5"/><text x="600" y="190" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#b91c1c">mean x̄</text><circle cx="300" cy="285" r="12" fill="#2563eb"/><circle cx="450" cy="285" r="12" fill="#2563eb"/><circle cx="735" cy="285" r="12" fill="#2563eb"/><circle cx="900" cy="285" r="12" fill="#2563eb"/><text x="300" y="330" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#1d4ed8">x₁</text><text x="450" y="330" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#1d4ed8">x₂</text><text x="735" y="330" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#1d4ed8">x₃</text><text x="900" y="330" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#1d4ed8">x₄</text><path d="M300 248 L600 248" stroke="#f97316" stroke-width="4" stroke-dasharray="9 7"/><path d="M450 235 L600 235" stroke="#f97316" stroke-width="4" stroke-dasharray="9 7"/><path d="M600 235 L735 235" stroke="#f97316" stroke-width="4" stroke-dasharray="9 7"/><path d="M600 248 L900 248" stroke="#f97316" stroke-width="4" stroke-dasharray="9 7"/><rect x="120" y="430" width="960" height="96" rx="22" fill="#fff7ed" stroke="#f97316" stroke-width="3"/><text x="600" y="466" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#9a3412">variance = average of squared distances from the mean</text><text x="600" y="505" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#9a3412">σ² = Σ(x - x̄)² / n</text><rect x="120" y="560" width="460" height="110" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="350" y="598" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1d4ed8">Shortcut</text><text x="350" y="640" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1d4ed8">σ² = Σx² / n - x̄²</text><rect x="620" y="560" width="460" height="110" rx="22" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/><text x="850" y="598" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#166534">Standard deviation</text><text x="850" y="640" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#166534">σ = √σ²</text></svg>