<text x="600" y="60" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#111">Number sets for rational and irrational proofs</text>
<rect x="90" y="130" width="1020" height="500" rx="28" fill="#f9fbff" stroke="#203864" stroke-width="4"/><text x="140" y="180" font-family="Arial" font-size="32" font-weight="700">ℝ real numbers</text><rect x="165" y="230" width="570" height="340" rx="24" fill="#eef5ff" stroke="#285f9f" stroke-width="3"/><text x="205" y="280" font-family="Arial" font-size="32" font-weight="700">ℚ rational</text><text x="450" y="330" text-anchor="middle" font-family="Arial" font-size="24">a / b, where a,b ∈ ℤ, b≠0</text><rect x="245" y="390" width="390" height="120" rx="20" fill="#effced" stroke="#2b7a2b" stroke-width="3"/><text x="285" y="440" font-family="Arial" font-size="32" font-weight="700">ℤ integers</text><text x="440" y="480" text-anchor="middle" font-family="Arial" font-size="21">..., -2, -1, 0, 1, 2, ...</text><rect x="795" y="230" width="240" height="340" rx="24" fill="#fff8e8" stroke="#946200" stroke-width="3"/><text x="915" y="280" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700">Irrational</text><text x="915" y="330" text-anchor="middle" font-family="Arial" font-size="22">not in ℚ</text><text x="915" y="385" text-anchor="middle" font-family="Arial" font-size="24">√2, √3, π, e</text><text x="600" y="675" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#a00020">Proof warning: never write an irrational number as a fraction. Force it to become one instead.</text>
</svg>