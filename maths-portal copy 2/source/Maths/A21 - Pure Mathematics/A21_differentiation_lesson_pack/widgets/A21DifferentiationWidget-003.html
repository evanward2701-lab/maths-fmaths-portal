<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>A21 Derivative Flashcards</title><style>
body{font-family:Arial,sans-serif;background:#eef8f1;margin:0}.wrap{max-width:820px;margin:24px auto;padding:20px}.card{background:white;border:2px solid #b9dfc3;border-radius:20px;padding:24px}h1{color:#1b5e20}.flashcard{min-height:170px;border-radius:18px;background:#e8f5e9;border:2px solid #81c784;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:28px;font-weight:bold;margin:18px 0}button{padding:12px 16px;border:0;border-radius:12px;background:#2e7d32;color:white;font-weight:bold;cursor:pointer;margin:5px}.hint{margin-top:16px;padding:12px;border-radius:12px;background:#fffde7;border-left:6px solid #fbc02d}
</style></head><body><div class="wrap"><div class="card"><h1>Derivative Flashcard Trainer</h1><div id="flashcard" class="flashcard"></div><button onclick="reveal()">Reveal answer</button><button onclick="nextCard()">Next card</button><button onclick="shuffleCards()">Shuffle</button><div id="hint" class="hint"></div></div></div><script>
let cards=[["d/dx [sin x]","cos x","Sine differentiates to cosine."],["d/dx [cos x]","-sin x","Cosine picks up a negative sign."],["d/dx [sin(kx)]","k cos(kx)","Keep kx inside."],["d/dx [cos(kx)]","-k sin(kx)","Negative sign plus multiplier."],["d/dx [tan x]","sec²x","Tan goes to sec squared."],["d/dx [e^(kx)]","k e^(kx)","Multiply by k."],["d/dx [a^x]","ln(a)a^x","Multiply by ln of the base."],["d/dx [ln(kx)]","1/x","ln(kx)=ln k + ln x."],["d/dx [sec x]","sec x tan x","Sec goes to sec tan."],["d/dx [cosec x]","-cosec x cot x","Co-version has a negative sign."],["d/dx [cot x]","-cosec²x","Cot goes to negative cosec squared."]];let i=0,back=false;function render(){flashcard.textContent=back?cards[i][1]:cards[i][0];hint.textContent=back?cards[i][2]:"Try the derivative first, then reveal.";}function reveal(){back=true;render();}function nextCard(){i=(i+1)%cards.length;back=false;render();}function shuffleCards(){cards.sort(()=>Math.random()-0.5);i=0;back=false;render();}render();
</script></body></html>
