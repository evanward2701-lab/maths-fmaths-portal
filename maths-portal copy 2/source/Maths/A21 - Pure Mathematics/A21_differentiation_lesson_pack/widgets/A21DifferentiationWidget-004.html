<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>A21 Concavity Explorer</title><style>
body{font-family:Arial,sans-serif;background:#fff7f2;margin:0}.wrap{max-width:980px;margin:24px auto;padding:20px}.card{background:#fff;border:2px solid #f3c9ad;border-radius:18px;padding:24px}h1{color:#bf360c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}input{width:100%;box-sizing:border-box;padding:10px;margin-top:6px;border-radius:10px;border:1px solid #bfa18d}button{margin-top:18px;padding:12px 18px;background:#bf360c;color:white;border:0;border-radius:12px;font-weight:bold;cursor:pointer}.output{margin-top:18px;padding:16px;border-radius:14px;background:#fff3e0;border-left:6px solid #ef6c00;line-height:1.65}canvas{margin-top:18px;background:#fff;border:1px solid #e1b899;border-radius:14px;width:100%;height:360px}
</style></head><body><div class="wrap"><div class="card"><h1>Concavity Explorer</h1><p>Explore <b>y = ax³ + bx² + cx + d</b>.</p><div class="grid"><div>a<input id="a" type="number" step="any" value="1"></div><div>b<input id="b" type="number" step="any" value="-2"></div><div>c<input id="c" type="number" step="any" value="-4"></div><div>d<input id="d" type="number" step="any" value="5"></div></div><button onclick="analyse()">Analyse concavity</button><div id="output" class="output"></div><canvas id="canvas" width="900" height="360"></canvas></div></div><script>
function fmt(x){return Math.round(x*1000)/1000;}function yv(a,b,c,d,x){return a*x*x*x+b*x*x+c*x+d;}function analyse(){let A=parseFloat(a.value),B=parseFloat(b.value),C=parseFloat(c.value),D=parseFloat(d.value);let h=`<p><b>y</b> = ${A}x³ + ${B}x² + ${C}x + ${D}</p><p><b>dy/dx</b> = ${3*A}x² + ${2*B}x + ${C}</p><p><b>d²y/dx²</b> = ${6*A}x + ${2*B}</p>`;if(A!==0){let xi=-B/(3*A),yi=yv(A,B,C,D,xi);h+=`<p>d²y/dx² = 0 gives x = ${fmt(xi)}.</p><p>Possible point of inflection: <b>(${fmt(xi)}, ${fmt(yi)})</b>.</p><p>Check concavity changes either side.</p>`;}output.innerHTML=h;draw(A,B,C,D);}function draw(A,B,C,D){let ctx=canvas.getContext("2d"),W=canvas.width,H=canvas.height;ctx.clearRect(0,0,W,H);let xMin=-5,xMax=5,yMin=Infinity,yMax=-Infinity;for(let p=0;p<=W;p++){let x=xMin+p/W*(xMax-xMin),y=yv(A,B,C,D,x);yMin=Math.min(yMin,y);yMax=Math.max(yMax,y);}let pad=.12*(yMax-yMin||1);yMin-=pad;yMax+=pad;let sx=x=>(x-xMin)/(xMax-xMin)*W,sy=y=>H-(y-yMin)/(yMax-yMin)*H;ctx.strokeStyle="#333";ctx.beginPath();ctx.moveTo(sx(0),0);ctx.lineTo(sx(0),H);ctx.stroke();ctx.beginPath();ctx.moveTo(0,sy(0));ctx.lineTo(W,sy(0));ctx.stroke();ctx.strokeStyle="#1976d2";ctx.lineWidth=4;ctx.beginPath();for(let p=0;p<=W;p++){let x=xMin+p/W*(xMax-xMin),y=yv(A,B,C,D,x);p?ctx.lineTo(p,sy(y)):ctx.moveTo(p,sy(y));}ctx.stroke();if(A!==0){let xi=-B/(3*A),yi=yv(A,B,C,D,xi);if(xi>=xMin&&xi<=xMax){ctx.fillStyle="#d32f2f";ctx.beginPath();ctx.arc(sx(xi),sy(yi),7,0,2*Math.PI);ctx.fill();ctx.fillText("inflection",sx(xi)+10,sy(yi)-10);}}}analyse();
</script></body></html>
