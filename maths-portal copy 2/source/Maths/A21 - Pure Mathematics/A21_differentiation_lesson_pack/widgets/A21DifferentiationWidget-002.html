<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>A21 Rule Selector Quiz</title><style>
body{font-family:Arial,sans-serif;background:#f7f3ff;margin:0}.wrap{max-width:900px;margin:24px auto;padding:20px}.card{background:#fff;border:2px solid #d8c7ff;border-radius:18px;padding:24px}h1{color:#4a148c}.question{font-size:24px;font-weight:bold;padding:16px;border-radius:12px;background:#f0e7ff;margin:16px 0}.buttons{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}button{padding:12px;border:0;border-radius:12px;background:#6a1b9a;color:white;font-weight:bold;cursor:pointer}.feedback{margin-top:18px;padding:16px;border-radius:12px;background:#eef6ff;border-left:6px solid #1976d2;line-height:1.55}
</style></head><body><div class="wrap"><div class="card"><h1>Differentiation Rule Selector</h1><div id="question" class="question"></div><div class="buttons"><button onclick="answer('Chain rule')">Chain rule</button><button onclick="answer('Product rule')">Product rule</button><button onclick="answer('Quotient rule')">Quotient rule</button><button onclick="answer('Parametric differentiation')">Parametric differentiation</button><button onclick="answer('Implicit differentiation')">Implicit differentiation</button><button onclick="answer('Connected rates')">Connected rates</button><button onclick="answer('Direct standard rule')">Direct standard rule</button></div><div id="feedback" class="feedback">Choose a rule.</div><p id="score"></p><button onclick="nextQuestion()">Next question</button></div></div><script>
const qs=[["y = (3x + 1)^5","Chain rule","A function is inside another function."],["y = x sin x","Product rule","Two functions are multiplied."],["y = sin x / x","Quotient rule","One function is divided by another."],["x = t² + 1, y = t³ - 2t","Parametric differentiation","Both x and y are in terms of t."],["x² + xy + y² = 7","Implicit differentiation","x and y are mixed together."],["A radius increases at 5 cm/s. Find dA/dt.","Connected rates","A time rate is given and another rate is required."],["y = sin(4x)","Direct standard rule","Use d/dx sin(kx)=k cos(kx)."]];let i=0,c=0,a=0;function show(){question.textContent=qs[i][0];feedback.textContent="Choose a rule.";score.textContent=`Score: ${c}/${a}`;}function answer(x){a++;let q=qs[i];if(x===q[1]){c++;feedback.innerHTML=`<b>Correct.</b> ${q[2]}`;}else{feedback.innerHTML=`<b>Not quite.</b> Best choice: <b>${q[1]}</b>. ${q[2]}`;}score.textContent=`Score: ${c}/${a}`;}function nextQuestion(){i=(i+1)%qs.length;show();}show();
</script></body></html>
