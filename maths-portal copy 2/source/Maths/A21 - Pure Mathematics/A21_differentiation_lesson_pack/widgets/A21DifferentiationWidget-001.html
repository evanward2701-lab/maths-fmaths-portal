<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>A21 Connected Rates Builder</title><style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:980px;margin:24px auto;padding:20px}.card{background:white;border:2px solid #d7e2f0;border-radius:18px;padding:22px;box-shadow:0 10px 24px rgba(20,40,80,.08)}h1{margin-top:0;color:#123c69}label{font-weight:bold;display:block;margin-top:14px}select,input{padding:10px;width:100%;margin-top:6px;border:1px solid #aab7c4;border-radius:10px;font-size:16px}button{margin-top:18px;padding:12px 18px;border:0;border-radius:12px;background:#123c69;color:white;font-weight:bold;cursor:pointer;font-size:16px}.output{margin-top:20px;padding:18px;border-radius:14px;background:#eef6ff;border:1px solid #8bbbea;line-height:1.65}.warning{margin-top:14px;padding:12px;background:#fff8e1;border-left:5px solid #f9a825;border-radius:8px}
</style></head><body><div class="wrap"><div class="card"><h1>Connected Rates Builder</h1><p>Choose a model, enter the current size and given rate.</p><label for="model">Model</label><select id="model"><option value="circleArea">Circle area: A = πr²</option><option value="sphereVolume">Sphere volume: V = 4/3 πr³</option><option value="lessonCylinder">Lesson cylinder: V = 5πx³</option></select><label for="value">Current radius / variable value</label><input id="value" type="number" step="any" value="3"><label for="rate">Given rate of radius / variable change</label><input id="rate" type="number" step="any" value="5"><button onclick="calculate()">Build rate chain</button><div id="result" class="output">Pick a model and press the button.</div></div></div><script>
function r(v){return Math.round(v*1000)/1000;}function calculate(){const m=document.getElementById("model").value,x=parseFloat(document.getElementById("value").value),rate=parseFloat(document.getElementById("rate").value),out=document.getElementById("result");if(Number.isNaN(x)||Number.isNaN(rate)){out.innerHTML="Please enter numbers.";return;}let h="";if(m==="circleArea"){let val=2*Math.PI*x*rate;h=`<h3>A = πr²</h3><p>dA/dr = 2πr</p><p>dA/dt = (dA/dr)(dr/dt)</p><p>dA/dt = 2π(${x})(${rate}) = <b>${r(val)}</b></p><p>Units: square units per unit time.</p>`;}if(m==="sphereVolume"){let val=4*Math.PI*x*x*rate;h=`<h3>V = 4/3πr³</h3><p>dV/dr = 4πr²</p><p>dV/dt = (dV/dr)(dr/dt)</p><p>dV/dt = 4π(${x})²(${rate}) = <b>${r(val)}</b></p><p>Units: cubic units per unit time.</p>`;}if(m==="lessonCylinder"){let val=15*Math.PI*x*x*rate;h=`<h3>V = 5πx³</h3><p>dV/dx = 15πx²</p><p>dV/dt = (dV/dx)(dx/dt)</p><p>dV/dt = 15π(${x})²(${rate}) = <b>${r(val)}</b></p><p>Units: cubic units per unit time.</p>`;}out.innerHTML=h+`<div class="warning"><b>Exam check:</b> write the derivative chain before substituting numbers, and attach units.</div>`;}
</script></body></html>
