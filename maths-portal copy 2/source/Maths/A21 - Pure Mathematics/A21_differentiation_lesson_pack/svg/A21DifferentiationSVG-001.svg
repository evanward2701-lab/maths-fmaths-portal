<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<title>A21DifferentiationSVG-001: Radians versus degrees near zero</title>
<metadata>Asset ID: A21DifferentiationSVG-001; Source: Chapter 9 transcript and slide PDF; Section: Core Theory 2; Purpose: Compare sine in radians and degrees.</metadata>
<rect width="1200" height="620" fill="white"/>
<text x="600" y="45" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold">Why trig differentiation uses radians</text>
<rect x="70" y="120" width="500" height="390" fill="#fafafa" stroke="#222" stroke-width="2"/>
<text x="320" y="155" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">x measured in radians</text>
<line x1="110" y1="320" x2="540" y2="320" stroke="#333" stroke-width="2"/>
<line x1="320" y1="490" x2="320" y2="185" stroke="#333" stroke-width="2"/>
<path d="M110,450 C180,380 245,330 320,320 C400,310 470,250 540,190" fill="none" stroke="#1976d2" stroke-width="5"/>
<line x1="245" y1="395" x2="395" y2="245" stroke="#d32f2f" stroke-width="4" stroke-dasharray="10,8"/>
<text x="320" y="545" text-anchor="middle" font-family="Arial" font-size="18">Near x = 0, sin x ≈ x, so gradient ≈ 1.</text>
<rect x="630" y="120" width="500" height="390" fill="#fafafa" stroke="#222" stroke-width="2"/>
<text x="880" y="155" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">x measured in degrees</text>
<line x1="670" y1="320" x2="1100" y2="320" stroke="#333" stroke-width="2"/>
<line x1="880" y1="490" x2="880" y2="185" stroke="#333" stroke-width="2"/>
<path d="M670,323 C750,322 820,321 880,320 C940,319 1020,318 1100,317" fill="none" stroke="#1976d2" stroke-width="5"/>
<line x1="790" y1="322" x2="970" y2="318" stroke="#d32f2f" stroke-width="4" stroke-dasharray="10,8"/>
<text x="880" y="545" text-anchor="middle" font-family="Arial" font-size="18">On the same scale, degree-mode sine is much flatter.</text>
<rect x="255" y="570" width="690" height="34" rx="8" fill="#eef6ff" stroke="#1976d2"/>
<text x="600" y="592" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Therefore A-Level trig derivative rules use radians.</text>
</svg>