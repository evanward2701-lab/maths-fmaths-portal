<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680">
<title>A21DifferentiationSVG-003: Concavity, convexity and inflection</title>
<metadata>Asset ID: A21DifferentiationSVG-003; Source: Chapter 9 second derivative evidence; Section: Core Theory 9; Purpose: Visualise second derivative sign.</metadata>
<rect width="1100" height="680" fill="white"/>
<text x="550" y="50" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold">Second derivative: concavity and inflection</text>
<rect x="90" y="100" width="920" height="440" fill="#fbfbfb" stroke="#222" stroke-width="2"/>
<line x1="150" y1="330" x2="950" y2="330" stroke="#333" stroke-width="2"/>
<line x1="540" y1="500" x2="540" y2="135" stroke="#333" stroke-width="2"/>
<path d="M140,445 C250,250 355,205 455,285 C505,325 555,365 620,380 C735,405 825,300 950,170" fill="none" stroke="#1976d2" stroke-width="6"/>
<circle cx="540" cy="350" r="8" fill="#d32f2f"/>
<text x="555" y="365" font-family="Arial" font-size="18" fill="#d32f2f" font-weight="bold">point of inflection</text>
<rect x="140" y="120" width="300" height="92" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
<text x="290" y="150" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">Concave</text>
<text x="290" y="178" text-anchor="middle" font-family="Arial" font-size="18">d²y/dx² &lt; 0</text>
<rect x="660" y="385" width="300" height="92" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="810" y="415" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">Convex</text>
<text x="810" y="443" text-anchor="middle" font-family="Arial" font-size="18">d²y/dx² &gt; 0</text>
<rect x="150" y="575" width="800" height="64" rx="10" fill="#eef6ff" stroke="#1976d2" stroke-width="2"/>
<text x="550" y="602" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">A point of inflection occurs where the curve changes concavity.</text>
<text x="550" y="628" text-anchor="middle" font-family="Arial" font-size="16">d²y/dx² = 0 is a clue, but the sign change must be checked.</text>
</svg>