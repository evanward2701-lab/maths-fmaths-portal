<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<title>A21DifferentiationSVG-002: Gradient function of sin x is cos x</title>
<metadata>Asset ID: A21DifferentiationSVG-002; Source: Chapter 9 transcript; Section: Core Theory 3; Purpose: Gradient function visual.</metadata>
<rect width="1200" height="760" fill="white"/>
<text x="600" y="46" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold">The derivative of sin x is cos x</text>
<rect x="80" y="90" width="1040" height="270" fill="#fbfbfb" stroke="#222" stroke-width="2"/>
<text x="600" y="122" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">y = sin x with tangent gradients</text>
<line x1="130" y1="225" x2="1080" y2="225" stroke="#333" stroke-width="2"/>
<line x1="130" y1="330" x2="130" y2="140" stroke="#333" stroke-width="2"/>
<path d="M130,225 C210,120 295,120 367.5,225 C445,330 525,330 605,225 C685,120 765,120 842.5,225 C920,330 1000,330 1080,225" fill="none" stroke="#1976d2" stroke-width="5"/>
<line x1="90" y1="265" x2="170" y2="185" stroke="#d32f2f" stroke-width="4"/>
<line x1="322" y1="120" x2="413" y2="120" stroke="#d32f2f" stroke-width="4"/>
<line x1="565" y1="185" x2="645" y2="265" stroke="#d32f2f" stroke-width="4"/>
<line x1="797" y1="330" x2="888" y2="330" stroke="#d32f2f" stroke-width="4"/>
<line x1="1040" y1="265" x2="1120" y2="185" stroke="#d32f2f" stroke-width="4"/>
<rect x="80" y="420" width="1040" height="270" fill="#fbfbfb" stroke="#222" stroke-width="2"/>
<text x="600" y="452" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">Plotting gradients gives y = cos x</text>
<line x1="130" y1="555" x2="1080" y2="555" stroke="#333" stroke-width="2"/>
<line x1="130" y1="660" x2="130" y2="470" stroke="#333" stroke-width="2"/>
<path d="M130,475 C210,475 295,555 367.5,555 C445,555 525,635 605,635 C685,635 765,555 842.5,555 C920,555 1000,475 1080,475" fill="none" stroke="#2e7d32" stroke-width="5"/>
<g fill="#111"><circle cx="130" cy="475" r="6"/><circle cx="367.5" cy="555" r="6"/><circle cx="605" cy="635" r="6"/><circle cx="842.5" cy="555" r="6"/><circle cx="1080" cy="475" r="6"/></g>
<text x="600" y="724" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">Therefore d/dx(sin x) = cos x.</text>
</svg>