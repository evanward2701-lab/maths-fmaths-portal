<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<title>A21DifferentiationSVG-005: Connected rates circle and cylinder</title>
<metadata>Asset ID: A21DifferentiationSVG-005; Source: Chapter 9 connected rates evidence; Section: Core Theory 10; Purpose: Translate contextual rates into derivative chains.</metadata>
<rect width="1200" height="720" fill="white"/>
<text x="600" y="48" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold">Connected rates of change</text>
<rect x="70" y="120" width="500" height="500" fill="#fbfbfb" stroke="#222" stroke-width="2"/>
<text x="320" y="158" text-anchor="middle" font-family="Arial" font-size="23" font-weight="bold">Circle: area and radius</text>
<circle cx="320" cy="330" r="120" fill="#e3f2fd" stroke="#1976d2" stroke-width="5"/>
<line x1="320" y1="330" x2="440" y2="330" stroke="#d32f2f" stroke-width="4"/>
<text x="380" y="315" text-anchor="middle" font-family="Arial" font-size="20" fill="#d32f2f" font-weight="bold">r</text>
<rect x="120" y="480" width="400" height="105" rx="10" fill="white" stroke="#1976d2" stroke-width="2"/>
<text x="320" y="510" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold">A = πr²</text>
<text x="320" y="542" text-anchor="middle" font-family="Arial" font-size="18">dA/dr = 2πr</text>
<text x="320" y="574" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">dA/dt = (dA/dr)(dr/dt)</text>
<rect x="630" y="120" width="500" height="500" fill="#fbfbfb" stroke="#222" stroke-width="2"/>
<text x="880" y="158" text-anchor="middle" font-family="Arial" font-size="23" font-weight="bold">Cylinder: area and volume rates</text>
<ellipse cx="880" cy="235" rx="120" ry="42" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/>
<path d="M760,235 L760,410" fill="none" stroke="#2e7d32" stroke-width="4"/>
<path d="M1000,235 L1000,410" fill="none" stroke="#2e7d32" stroke-width="4"/>
<ellipse cx="880" cy="410" rx="120" ry="42" fill="#f1f8e9" stroke="#2e7d32" stroke-width="4"/>
<line x1="880" y1="235" x2="1000" y2="235" stroke="#d32f2f" stroke-width="4"/>
<text x="940" y="220" text-anchor="middle" font-family="Arial" font-size="20" fill="#d32f2f" font-weight="bold">x</text>
<rect x="680" y="480" width="400" height="105" rx="10" fill="white" stroke="#2e7d32" stroke-width="2"/>
<text x="880" y="510" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">A = πx², dA/dt = (dA/dx)(dx/dt)</text>
<text x="880" y="542" text-anchor="middle" font-family="Arial" font-size="18">V = 5πx³ in the lesson example</text>
<text x="880" y="574" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">dV/dt = (dV/dx)(dx/dt)</text>
<rect x="130" y="650" width="940" height="46" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
<text x="600" y="680" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold">Translate words → formula → differentiate → connect rates → substitute → units.</text>
</svg>