<svg role="img" aria-label="Counterexample for Sine Addition Error" xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect width="1200" height="760" fill="white"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700">Common Error: Splitting a Trig Function</text>
<rect x="120" y="100" width="960" height="80" rx="14" fill="#f7f7f7" stroke="#111" stroke-width="2"/>
<text x="600" y="148" text-anchor="middle" font-family="Arial" font-size="28">False claim: sin(A+B)=sinA+sinB</text>
<text x="600" y="230" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700">Test A=30°, B=60°</text>
<rect x="100" y="280" width="460" height="270" rx="18" fill="#f7f7f7" stroke="#111" stroke-width="2"/>
<rect x="640" y="280" width="460" height="270" rx="18" fill="#f7f7f7" stroke="#111" stroke-width="2"/>
<text x="330" y="325" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700">Left-hand side</text>
<text x="330" y="385" text-anchor="middle" font-family="Arial" font-size="24">sin(30°+60°)=sin90°=1</text>
<text x="870" y="325" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700">Right-hand side</text>
<text x="870" y="385" text-anchor="middle" font-family="Arial" font-size="24">sin30°+sin60°=(1+√3)/2</text>
<text x="600" y="430" text-anchor="middle" font-family="Arial" font-size="42" font-weight="700">≠</text>
<rect x="170" y="610" width="860" height="90" rx="14" fill="#f2f2f2" stroke="#111" stroke-width="2"/>
<text x="600" y="668" text-anchor="middle" font-family="Arial" font-size="24">Correct: sin(A+B)=sinA cosB+cosA sinB</text>
</svg>