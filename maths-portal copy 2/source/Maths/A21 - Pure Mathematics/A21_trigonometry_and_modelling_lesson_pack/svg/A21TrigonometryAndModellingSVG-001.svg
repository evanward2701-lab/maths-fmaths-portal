<svg role="img" aria-label="Addition Formulae Memory Map" xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850">
<rect width="1200" height="850" fill="white"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700">Addition Formulae</text>
<rect x="70" y="140" width="320" height="520" rx="18" fill="#f7f7f7" stroke="#111" stroke-width="2"/>
<rect x="440" y="140" width="320" height="520" rx="18" fill="#f7f7f7" stroke="#111" stroke-width="2"/>
<rect x="810" y="140" width="320" height="520" rx="18" fill="#f7f7f7" stroke="#111" stroke-width="2"/>
<text x="230" y="185" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">Sine</text>
<text x="230" y="250" text-anchor="middle" font-family="Arial" font-size="21">sin(A+B)=sinA cosB+cosA sinB</text>
<text x="230" y="310" text-anchor="middle" font-family="Arial" font-size="21">sin(A−B)=sinA cosB−cosA sinB</text>
<text x="230" y="430" text-anchor="middle" font-family="Arial" font-size="19">sign stays same; mix sin/cos</text>
<text x="600" y="185" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">Cosine</text>
<text x="600" y="250" text-anchor="middle" font-family="Arial" font-size="21">cos(A+B)=cosA cosB−sinA sinB</text>
<text x="600" y="310" text-anchor="middle" font-family="Arial" font-size="21">cos(A−B)=cosA cosB+sinA sinB</text>
<text x="600" y="430" text-anchor="middle" font-family="Arial" font-size="19">sign switches; cos/cos, sin/sin</text>
<text x="970" y="185" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">Tangent</text>
<text x="970" y="250" text-anchor="middle" font-family="Arial" font-size="20">tan(A+B)=(tanA+tanB)/(1−tanA tanB)</text>
<text x="970" y="310" text-anchor="middle" font-family="Arial" font-size="20">tan(A−B)=(tanA−tanB)/(1+tanA tanB)</text>
<text x="970" y="430" text-anchor="middle" font-family="Arial" font-size="19">same sign on top; opposite on bottom</text>
<rect x="175" y="705" width="850" height="85" rx="14" fill="#f2f2f2" stroke="#111" stroke-width="2"/>
<text x="600" y="755" text-anchor="middle" font-family="Arial" font-size="21">Use forwards to expand and backwards to compress.</text>
</svg>