<svg role="img" aria-label="Double Angle Formula Derivation Map" xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850">
<rect width="1200" height="850" fill="white"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700">Double Angle Formulae</text>
<rect x="385" y="90" width="430" height="70" rx="14" fill="#f7f7f7" stroke="#111" stroke-width="2"/>
<text x="600" y="135" text-anchor="middle" font-family="Arial" font-size="26">Key idea: 2A=A+A</text>
<rect x="70" y="220" width="320" height="440" rx="18" fill="#f7f7f7" stroke="#111" stroke-width="2"/>
<rect x="440" y="220" width="320" height="440" rx="18" fill="#f7f7f7" stroke="#111" stroke-width="2"/>
<rect x="810" y="220" width="320" height="440" rx="18" fill="#f7f7f7" stroke="#111" stroke-width="2"/>
<text x="230" y="265" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700">Sine</text>
<text x="230" y="355" text-anchor="middle" font-family="Arial" font-size="20">sin(A+A)=sinA cosA+cosA sinA</text>
<text x="230" y="420" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">sin2A=2sinAcosA</text>
<text x="600" y="265" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700">Cosine</text>
<text x="600" y="350" text-anchor="middle" font-family="Arial" font-size="19">cos(A+A)=cosA cosA−sinA sinA</text>
<text x="600" y="405" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700">cos2A=cos²A−sin²A</text>
<text x="600" y="475" text-anchor="middle" font-family="Arial" font-size="20">cos2A=1−2sin²A</text>
<text x="600" y="525" text-anchor="middle" font-family="Arial" font-size="20">cos2A=2cos²A−1</text>
<text x="970" y="265" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700">Tangent</text>
<text x="970" y="360" text-anchor="middle" font-family="Arial" font-size="20">tan(A+A)=(tanA+tanA)/(1−tan²A)</text>
<text x="970" y="455" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700">tan2A=2tanA/(1−tan²A)</text>
</svg>