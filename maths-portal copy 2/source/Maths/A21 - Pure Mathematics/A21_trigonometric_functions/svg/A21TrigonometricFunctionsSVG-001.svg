<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">Reciprocal trigonometric graphs</title>
  <desc id="desc">Three panels comparing sine with cosecant, cosine with secant, and tangent with cotangent over zero to two pi.</desc>
  <metadata>
    Asset ID: A21TrigonometricFunctionsSVG-001
    Source: Chapter 6 Trigonometric Functions PDF and transcript
    Related lesson section: Core Theory - Graphs of reciprocal trig functions
    Purpose: Show how reciprocal trig graphs arise from y-values of sine, cosine and tangent.
  </metadata>
  <defs>
    <style>
      .title{font-family:Arial,sans-serif;font-size:30px;font-weight:700;fill:#111827}.panel{fill:#f9fafb;stroke:#d1d5db;stroke-width:1.2;rx:12}.pt{font-family:Arial,sans-serif;font-size:20px;font-weight:700;fill:#111827}.label{font-family:Arial,sans-serif;font-size:15px;fill:#111827}.small{font-family:Arial,sans-serif;font-size:12px;fill:#374151}.axis{stroke:#111827;stroke-width:1.5}.grid{stroke:#d1d5db;stroke-width:1}.asym{stroke:#ef4444;stroke-width:1.5;stroke-dasharray:6 5}.orig{fill:none;stroke:#2563eb;stroke-width:2.4;stroke-dasharray:7 5}.recip{fill:none;stroke:#7c3aed;stroke-width:3}.note{font-family:Arial,sans-serif;font-size:13px;fill:#4b5563}
    </style>
  </defs>
  <rect width="1200" height="850" fill="#fff"/>
  <text x="60" y="45" class="title">Reciprocal trigonometric graphs over 0 ≤ x ≤ 2π</text>
  <text x="60" y="72" class="note">Dashed blue: original function. Purple: reciprocal function. Red dashed lines: vertical asymptotes.</text>

  <rect x="55" y="95" width="1090" height="205" class="panel"/><text x="75" y="125" class="pt">1. From y = sin x to y = cosec x</text>
  <line x1="120" y1="170" x2="1080" y2="170" class="axis"/><line x1="120" y1="90" x2="120" y2="260" class="axis"/>
  <line x1="120" y1="145" x2="1080" y2="145" class="grid"/><line x1="120" y1="195" x2="1080" y2="195" class="grid"/>
  <line x1="120" y1="90" x2="120" y2="260" class="asym"/><line x1="600" y1="90" x2="600" y2="260" class="asym"/><line x1="1080" y1="90" x2="1080" y2="260" class="asym"/>
  <polyline class="orig" points="120,170 200,157 280,148 360,145 440,148 520,158 600,170 680,182 760,192 840,195 920,192 1000,182 1080,170"/>
  <path class="recip" d="M150 92 C210 128,290 145,360 145 C430 145,510 128,570 92"/>
  <path class="recip" d="M630 248 C690 212,770 195,840 195 C910 195,990 212,1050 248"/>
  <text x="900" y="125" class="label">blue: sin x</text><text x="900" y="150" class="label">purple: cosec x</text>

  <rect x="55" y="335" width="1090" height="205" class="panel"/><text x="75" y="365" class="pt">2. From y = cos x to y = sec x</text>
  <line x1="120" y1="430" x2="1080" y2="430" class="axis"/><line x1="120" y1="350" x2="120" y2="520" class="axis"/>
  <line x1="120" y1="405" x2="1080" y2="405" class="grid"/><line x1="120" y1="455" x2="1080" y2="455" class="grid"/>
  <line x1="360" y1="350" x2="360" y2="520" class="asym"/><line x1="840" y1="350" x2="840" y2="520" class="asym"/>
  <polyline class="orig" points="120,405 200,408 280,418 360,430 440,442 520,452 600,455 680,452 760,442 840,430 920,418 1000,408 1080,405"/>
  <path class="recip" d="M120 405 C210 405,300 372,350 350"/><path class="recip" d="M370 510 C430 480,520 455,600 455 C680 455,770 480,830 510"/><path class="recip" d="M850 350 C900 372,990 405,1080 405"/>
  <text x="900" y="365" class="label">blue: cos x</text><text x="900" y="390" class="label">purple: sec x</text>

  <rect x="55" y="575" width="1090" height="205" class="panel"/><text x="75" y="605" class="pt">3. From y = tan x to y = cot x</text>
  <line x1="120" y1="690" x2="1080" y2="690" class="axis"/><line x1="120" y1="610" x2="120" y2="760" class="axis"/>
  <line x1="120" y1="665" x2="1080" y2="665" class="grid"/><line x1="120" y1="715" x2="1080" y2="715" class="grid"/>
  <line x1="120" y1="610" x2="120" y2="760" class="asym"/><line x1="600" y1="610" x2="600" y2="760" class="asym"/><line x1="1080" y1="610" x2="1080" y2="760" class="asym"/>
  <path class="orig" d="M135 690 C205 680,305 640,350 612 M370 768 C430 735,520 700,590 690 M615 690 C685 680,785 640,830 612 M850 768 C910 735,1000 700,1070 690"/>
  <path class="recip" d="M150 612 C195 625,215 650,240 665 C305 690,420 690,480 715 C510 735,545 755,570 770"/>
  <path class="recip" d="M630 612 C675 625,695 650,720 665 C785 690,900 690,960 715 C990 735,1025 755,1050 770"/>
  <text x="900" y="625" class="label">blue: tan x</text><text x="900" y="650" class="label">purple: cot x</text>
  <text x="115" y="812" class="small">0</text><text x="350" y="812" class="small">π/2</text><text x="593" y="812" class="small">π</text><text x="828" y="812" class="small">3π/2</text><text x="1070" y="812" class="small">2π</text>
</svg>
