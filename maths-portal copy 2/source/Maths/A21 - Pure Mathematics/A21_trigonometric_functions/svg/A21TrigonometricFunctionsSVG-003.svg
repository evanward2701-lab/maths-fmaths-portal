<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc">
  <title id="title">Reciprocal versus inverse trigonometric notation</title>
  <desc id="desc">A warning diagram distinguishing cos squared, inverse cosine and secant.</desc>
  <metadata>
    Asset ID: A21TrigonometricFunctionsSVG-003
    Source: Chapter 6 Trigonometric Functions notation warning
    Related lesson section: Key Definitions and Notation
    Purpose: Show that cos to the minus one means arccos, not sec.
  </metadata>
  <defs><style>.title{font-family:Arial,sans-serif;font-size:30px;font-weight:700;fill:#111827}.box{fill:#f9fafb;stroke:#d1d5db;stroke-width:1.5;rx:16}.good{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:16}.warn{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:16}.bad{fill:#fef2f2;stroke:#ef4444;stroke-width:2;rx:16}.math{font-family:Georgia,serif;font-size:34px;fill:#111827}.label{font-family:Arial,sans-serif;font-size:18px;font-weight:700;fill:#111827}.text{font-family:Arial,sans-serif;font-size:15px;fill:#374151}.cross{stroke:#ef4444;stroke-width:5;stroke-linecap:round}</style></defs>
  <rect width="1100" height="640" fill="#fff"/>
  <text x="55" y="50" class="title">Notation trap: reciprocal trig is not inverse trig</text>
  <rect x="60" y="125" width="300" height="170" class="box"/><text x="85" y="160" class="label">Squared trig notation</text><text x="85" y="215" class="math">cos²x = (cos x)²</text><text x="85" y="255" class="text">The 2 really is a power.</text>
  <rect x="400" y="125" width="300" height="170" class="warn"/><text x="425" y="160" class="label">Inverse trig notation</text><text x="425" y="215" class="math">cos⁻¹x = arccos x</text><text x="425" y="255" class="text">This means: the angle whose cosine is x.</text>
  <rect x="740" y="125" width="300" height="170" class="good"/><text x="765" y="160" class="label">Reciprocal trig notation</text><text x="765" y="215" class="math">sec x = 1/cos x</text><text x="765" y="255" class="text">This is the reciprocal of cos x.</text>
  <rect x="200" y="370" width="700" height="170" class="bad"/><text x="235" y="410" class="label">Do not write this</text><text x="285" y="475" class="math">cos⁻¹x = 1/cos x</text><line x1="270" y1="430" x2="830" y2="505" class="cross"/><line x1="830" y1="430" x2="270" y2="505" class="cross"/><text x="235" y="525" class="text">Correct version: cos⁻¹x = arccos x, while sec x = 1/cos x.</text>
</svg>
