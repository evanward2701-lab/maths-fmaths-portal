<svg xmlns="http://www.w3.org/2000/svg" width="980" height="650" viewBox="0 0 980 650" role="img" aria-labelledby="title desc">
  <title id="title">AS1VectorsSVG-003: Position vectors and vector difference</title>
  <desc id="desc">Diagram showing position vectors OA and OB from the origin, and AB as OB minus OA.</desc>
  <!-- Asset ID: AS1VectorsSVG-003 | Source: CCEA AS1-VEC-LO004, AS1-VEC-LO005 | Purpose: Position vectors and distance | Boundary: 2D only -->
  <rect width="980" height="650" fill="white"/>
  <text x="40" y="55" font-family="Arial" font-size="30" font-weight="700">Position vectors</text>
  <line x1="110" y1="540" x2="850" y2="540" stroke="black" stroke-width="3"/>
  <line x1="110" y1="540" x2="110" y2="120" stroke="black" stroke-width="3"/>
  <polygon points="850,540 832,531 832,549" fill="black"/><polygon points="110,120 101,138 119,138" fill="black"/>
  <text x="865" y="548" font-family="Arial" font-size="24">x</text><text x="100" y="105" font-family="Arial" font-size="24">y</text>
  <circle cx="110" cy="540" r="5" fill="black"/><text x="82" y="570" font-family="Arial" font-size="22">O</text>
  <circle cx="350" cy="360" r="7" fill="black"/><text x="330" y="340" font-family="Arial" font-size="22">A(x₁, y₁)</text>
  <circle cx="680" cy="230" r="7" fill="black"/><text x="695" y="225" font-family="Arial" font-size="22">B(x₂, y₂)</text>
  <line x1="110" y1="540" x2="350" y2="360" stroke="black" stroke-width="4"/><polygon points="350,360 325,365 338,384" fill="black"/>
  <text x="205" y="430" font-family="Arial" font-size="23">OA</text>
  <line x1="110" y1="540" x2="680" y2="230" stroke="black" stroke-width="4"/><polygon points="680,230 655,232 669,253" fill="black"/>
  <text x="410" y="345" font-family="Arial" font-size="23">OB</text>
  <line x1="350" y1="360" x2="680" y2="230" stroke="black" stroke-width="5" stroke-dasharray="12 8"/><polygon points="680,230 655,232 668,253" fill="black"/>
  <text x="505" y="275" font-family="Arial" font-size="26" font-weight="700">AB</text>
  <rect x="500" y="395" width="420" height="170" rx="12" fill="white" stroke="black" stroke-width="2"/>
  <text x="525" y="430" font-family="Arial" font-size="22" font-weight="700">Key formulae</text>
  <text x="525" y="468" font-family="Arial" font-size="20">AB = OB - OA</text>
  <text x="525" y="504" font-family="Arial" font-size="20">AB = (x₂ - x₁, y₂ - y₁)</text>
  <text x="525" y="540" font-family="Arial" font-size="20">Distance AB = √((x₂ - x₁)² + (y₂ - y₁)²)</text>
</svg>
