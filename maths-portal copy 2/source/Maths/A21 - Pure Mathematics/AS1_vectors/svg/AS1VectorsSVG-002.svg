<svg xmlns="http://www.w3.org/2000/svg" width="980" height="650" viewBox="0 0 980 650" role="img" aria-labelledby="title desc">
  <title id="title">AS1VectorsSVG-002: Triangle and parallelogram laws</title>
  <desc id="desc">Two diagrams showing vector addition using the triangle law and parallelogram law.</desc>
  <!-- Asset ID: AS1VectorsSVG-002 | Source: CCEA AS1-VEC-LO003 | Purpose: Geometrical meaning of vector addition | Boundary: 2D only -->
  <rect width="980" height="650" fill="white"/>
  <text x="40" y="55" font-family="Arial" font-size="30" font-weight="700">Vector addition</text>
  <rect x="40" y="130" width="430" height="460" rx="12" fill="white" stroke="black" stroke-width="2"/>
  <text x="65" y="170" font-family="Arial" font-size="24" font-weight="700">Triangle law</text>
  <line x1="100" y1="470" x2="260" y2="360" stroke="black" stroke-width="5"/><polygon points="260,360 235,364 249,383" fill="black"/>
  <text x="165" y="400" font-family="Arial" font-size="24">a</text>
  <line x1="260" y1="360" x2="380" y2="230" stroke="black" stroke-width="5"/><polygon points="380,230 356,237 371,254" fill="black"/>
  <text x="320" y="295" font-family="Arial" font-size="24">b</text>
  <line x1="100" y1="470" x2="380" y2="230" stroke="black" stroke-width="4" stroke-dasharray="10 8"/><polygon points="380,230 355,234 369,254" fill="black"/>
  <text x="220" y="315" font-family="Arial" font-size="24" font-weight="700">a + b</text>
  <rect x="510" y="130" width="430" height="460" rx="12" fill="white" stroke="black" stroke-width="2"/>
  <text x="535" y="170" font-family="Arial" font-size="24" font-weight="700">Parallelogram law</text>
  <line x1="570" y1="470" x2="750" y2="470" stroke="black" stroke-width="5"/><polygon points="750,470 728,459 728,481" fill="black"/>
  <text x="655" y="500" font-family="Arial" font-size="24">a</text>
  <line x1="570" y1="470" x2="670" y2="300" stroke="black" stroke-width="5"/><polygon points="670,300 649,314 670,325" fill="black"/>
  <text x="590" y="375" font-family="Arial" font-size="24">b</text>
  <line x1="670" y1="300" x2="850" y2="300" stroke="black" stroke-width="3" stroke-dasharray="8 8"/>
  <line x1="750" y1="470" x2="850" y2="300" stroke="black" stroke-width="3" stroke-dasharray="8 8"/>
  <line x1="570" y1="470" x2="850" y2="300" stroke="black" stroke-width="4"/><polygon points="850,300 825,305 838,325" fill="black"/>
  <text x="715" y="365" font-family="Arial" font-size="24" font-weight="700">a + b</text>
</svg>
