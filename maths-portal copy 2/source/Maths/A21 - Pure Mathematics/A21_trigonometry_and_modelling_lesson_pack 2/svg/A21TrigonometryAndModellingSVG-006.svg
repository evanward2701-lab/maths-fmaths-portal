<svg role="img" aria-label="Sinusoidal Model Interpretation" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<rect width="1200" height="800" fill="white"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700">Interpreting a Sinusoidal Model</text>
<text x="600" y="95" text-anchor="middle" font-family="Arial" font-size="22">y=d+R sin(kx+α)</text>
<line x1="110" y1="420" x2="1090" y2="420" stroke="#111" stroke-width="2"/>
<line x1="160" y1="140" x2="160" y2="680" stroke="#111" stroke-width="2"/>
<line x1="160" y1="240" x2="1090" y2="240" stroke="#777" stroke-dasharray="8 8"/>
<line x1="160" y1="600" x2="1090" y2="600" stroke="#777" stroke-dasharray="8 8"/>
<text x="118" y="427" text-anchor="end" font-family="Arial" font-size="20" font-weight="700">d</text>
<text x="118" y="247" text-anchor="end" font-family="Arial" font-size="18">d+R</text>
<text x="118" y="607" text-anchor="end" font-family="Arial" font-size="18">d−R</text>
<path d="M160 420 C230 300 300 240 380 240 C460 240 530 300 600 420 C670 540 740 600 820 600 C900 600 970 540 1040 420" fill="none" stroke="#111" stroke-width="5"/>
<line x1="380" y1="420" x2="380" y2="240" stroke="#111" stroke-width="3"/>
<text x="420" y="335" font-family="Arial" font-size="22" font-weight="700">amplitude=R</text>
<line x1="380" y1="690" x2="1040" y2="690" stroke="#111" stroke-width="3"/>
<text x="710" y="725" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">period=2π/k</text>
</svg>