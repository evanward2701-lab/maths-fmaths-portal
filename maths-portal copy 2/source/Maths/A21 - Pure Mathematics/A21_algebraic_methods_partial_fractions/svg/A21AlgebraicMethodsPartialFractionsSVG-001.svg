<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">A21 Partial Fractions Template Table</title>
  <desc id="desc">Template table showing distinct linear factors, repeated squared linear factors, and improper rational functions for CCEA A21 partial fractions.</desc>

  <!--
    Asset ID: A21AlgebraicMethodsPartialFractionsSVG-001
    Source: CCEA specification map A21-AF-LO008 + Chapter 1b algebraic methods transcript
    Related lesson section: Core Theory; Worked Examples; Exam Technique Notes
    Purpose: Show the correct partial-fraction template for each on-spec denominator type.
  -->

  <rect x="0" y="0" width="1200" height="820" fill="#ffffff"/>

  <text x="60" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111111">
    Partial Fractions: Which Template?
  </text>

  <text x="60" y="112" font-family="Arial, sans-serif" font-size="19" fill="#333333">
    CCEA A21 boundary: denominators no more complicated than squared linear terms.
  </text>

  <rect x="60" y="150" width="1080" height="62" rx="10" fill="#111111"/>
  <text x="90" y="190" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Case</text>
  <text x="360" y="190" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Starting rational function</text>
  <text x="765" y="190" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Partial-fraction template</text>

  <rect x="60" y="225" width="1080" height="150" rx="14" fill="#f4f4f4" stroke="#222222" stroke-width="2"/>
  <text x="90" y="270" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111111">
    Distinct linear
  </text>
  <text x="90" y="300" font-family="Arial, sans-serif" font-size="18" fill="#444444">
    Two different linear factors
  </text>

  <text x="360" y="278" font-family="Arial, sans-serif" font-size="26" fill="#111111">
    P(x)
  </text>
  <line x1="350" y1="292" x2="555" y2="292" stroke="#111111" stroke-width="2"/>
  <text x="348" y="325" font-family="Arial, sans-serif" font-size="24" fill="#111111">
    (x-a)(x-b)
  </text>

  <text x="765" y="278" font-family="Arial, sans-serif" font-size="26" fill="#111111">
    A
  </text>
  <line x1="755" y1="292" x2="842" y2="292" stroke="#111111" stroke-width="2"/>
  <text x="755" y="325" font-family="Arial, sans-serif" font-size="24" fill="#111111">
    x-a
  </text>
  <text x="866" y="305" font-family="Arial, sans-serif" font-size="30" fill="#111111">+</text>
  <text x="915" y="278" font-family="Arial, sans-serif" font-size="26" fill="#111111">
    B
  </text>
  <line x1="905" y1="292" x2="992" y2="292" stroke="#111111" stroke-width="2"/>
  <text x="905" y="325" font-family="Arial, sans-serif" font-size="24" fill="#111111">
    x-b
  </text>

  <rect x="60" y="395" width="1080" height="170" rx="14" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="90" y="440" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111111">
    Repeated squared
  </text>
  <text x="90" y="470" font-family="Arial, sans-serif" font-size="18" fill="#444444">
    Include both levels of the repeated factor
  </text>

  <text x="360" y="448" font-family="Arial, sans-serif" font-size="26" fill="#111111">
    P(x)
  </text>
  <line x1="350" y1="462" x2="585" y2="462" stroke="#111111" stroke-width="2"/>
  <text x="345" y="497" font-family="Arial, sans-serif" font-size="24" fill="#111111">
    (x-a)²(x-b)
  </text>

  <text x="765" y="433" font-family="Arial, sans-serif" font-size="25" fill="#111111">
    A
  </text>
  <line x1="755" y1="447" x2="842" y2="447" stroke="#111111" stroke-width="2"/>
  <text x="755" y="480" font-family="Arial, sans-serif" font-size="23" fill="#111111">
    x-a
  </text>
  <text x="865" y="462" font-family="Arial, sans-serif" font-size="28" fill="#111111">+</text>

  <text x="912" y="433" font-family="Arial, sans-serif" font-size="25" fill="#111111">
    B
  </text>
  <line x1="902" y1="447" x2="1006" y2="447" stroke="#111111" stroke-width="2"/>
  <text x="902" y="480" font-family="Arial, sans-serif" font-size="23" fill="#111111">
    (x-a)²
  </text>
  <text x="1030" y="462" font-family="Arial, sans-serif" font-size="28" fill="#111111">+</text>

  <text x="1070" y="433" font-family="Arial, sans-serif" font-size="25" fill="#111111">
    C
  </text>
  <line x1="1060" y1="447" x2="1147" y2="447" stroke="#111111" stroke-width="2"/>
  <text x="1060" y="480" font-family="Arial, sans-serif" font-size="23" fill="#111111">
    x-b
  </text>

  <text x="765" y="530" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#111111">
    Key warning:
  </text>
  <text x="875" y="530" font-family="Arial, sans-serif" font-size="18" fill="#333333">
    do not skip A/(x-a) when (x-a)² appears.
  </text>

  <rect x="60" y="585" width="1080" height="155" rx="14" fill="#f4f4f4" stroke="#222222" stroke-width="2"/>
  <text x="90" y="630" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111111">
    Improper fraction
  </text>
  <text x="90" y="660" font-family="Arial, sans-serif" font-size="18" fill="#444444">
    Degree of numerator ≥ degree of denominator
  </text>

  <text x="360" y="638" font-family="Arial, sans-serif" font-size="26" fill="#111111">
    P(x)
  </text>
  <line x1="350" y1="652" x2="555" y2="652" stroke="#111111" stroke-width="2"/>
  <text x="348" y="685" font-family="Arial, sans-serif" font-size="24" fill="#111111">
    Q(x)
  </text>

  <text x="765" y="635" font-family="Arial, sans-serif" font-size="24" fill="#111111">
    quotient + proper remainder fraction
  </text>
  <text x="765" y="675" font-family="Arial, sans-serif" font-size="23" fill="#111111">
    e.g.  k + A/(x-a) + B/(x-b)
  </text>
  <text x="765" y="712" font-family="Arial, sans-serif" font-size="18" fill="#333333">
    Divide first, or include the quotient in one identity.
  </text>

  <text x="60" y="785" font-family="Arial, sans-serif" font-size="17" fill="#555555">
    Check by recombining the fractions: your answer should return the original rational expression.
  </text>
</svg>
