<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Legal and Illegal Cancellation in Algebraic Fractions</title>
  <desc id="desc">Diagram comparing legal cancellation of common factors with illegal cancellation inside a sum.</desc>

  <!--
    Asset ID: A21AlgebraicMethodsPartialFractionsSVG-002
    Source: Chapter 1b algebraic methods transcript + A21-AF-LO001 rational-expression simplification
    Related lesson section: Prerequisite Recap; Core Theory; Common Mistakes and Exam Traps
    Purpose: Show legal cancellation by common factor versus illegal cancellation inside a sum.
  -->

  <rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>

  <text x="60" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111111">
    Cancellation: Factor or Trap?
  </text>

  <text x="60" y="112" font-family="Arial, sans-serif" font-size="19" fill="#333333">
    You may cancel common factors. You may not cancel isolated terms inside a sum.
  </text>

  <rect x="60" y="155" width="520" height="480" rx="20" fill="#f4f4f4" stroke="#222222" stroke-width="3"/>
  <rect x="60" y="155" width="520" height="68" rx="20" fill="#111111"/>
  <text x="95" y="199" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">
    Legal cancellation
  </text>

  <text x="95" y="270" font-family="Arial, sans-serif" font-size="22" fill="#111111">
    Same factor multiplies the whole top and bottom.
  </text>

  <text x="145" y="345" font-family="Arial, sans-serif" font-size="34" fill="#111111">ab</text>
  <line x1="125" y1="360" x2="225" y2="360" stroke="#111111" stroke-width="3"/>
  <text x="145" y="402" font-family="Arial, sans-serif" font-size="34" fill="#111111">bc</text>

  <text x="265" y="380" font-family="Arial, sans-serif" font-size="36" fill="#111111">=</text>

  <text x="330" y="345" font-family="Arial, sans-serif" font-size="34" fill="#111111">a</text>
  <line x1="315" y1="360" x2="390" y2="360" stroke="#111111" stroke-width="3"/>
  <text x="330" y="402" font-family="Arial, sans-serif" font-size="34" fill="#111111">c</text>

  <line x1="171" y1="325" x2="191" y2="348" stroke="#006400" stroke-width="4"/>
  <line x1="171" y1="390" x2="191" y2="413" stroke="#006400" stroke-width="4"/>
  <text x="112" y="470" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#006400">
    Why it works:
  </text>
  <text x="112" y="505" font-family="Arial, sans-serif" font-size="20" fill="#333333">
    You divide the numerator and denominator
  </text>
  <text x="112" y="535" font-family="Arial, sans-serif" font-size="20" fill="#333333">
    by the same complete factor, b.
  </text>

  <rect x="110" y="570" width="415" height="38" rx="10" fill="#ffffff" stroke="#006400" stroke-width="2"/>
  <text x="128" y="596" font-family="Arial, sans-serif" font-size="18" fill="#006400">
    Test: factor first, then cancel whole factors.
  </text>

  <rect x="620" y="155" width="520" height="480" rx="20" fill="#ffffff" stroke="#222222" stroke-width="3"/>
  <rect x="620" y="155" width="520" height="68" rx="20" fill="#111111"/>
  <text x="655" y="199" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">
    Illegal cancellation
  </text>

  <text x="655" y="270" font-family="Arial, sans-serif" font-size="22" fill="#111111">
    A term inside a sum cannot be snipped out.
  </text>

  <text x="690" y="345" font-family="Arial, sans-serif" font-size="32" fill="#111111">ac + ab</text>
  <line x1="680" y1="360" x2="840" y2="360" stroke="#111111" stroke-width="3"/>
  <text x="750" y="402" font-family="Arial, sans-serif" font-size="32" fill="#111111">b</text>

  <text x="875" y="380" font-family="Arial, sans-serif" font-size="36" fill="#aa0000">≠</text>

  <text x="940" y="380" font-family="Arial, sans-serif" font-size="32" fill="#111111">ac + a</text>

  <line x1="785" y1="318" x2="826" y2="405" stroke="#aa0000" stroke-width="5"/>
  <line x1="826" y1="318" x2="785" y2="405" stroke="#aa0000" stroke-width="5"/>

  <text x="672" y="470" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#aa0000">
    Why it fails:
  </text>
  <text x="672" y="505" font-family="Arial, sans-serif" font-size="20" fill="#333333">
    The whole numerator is ac + ab.
  </text>
  <text x="672" y="535" font-family="Arial, sans-serif" font-size="20" fill="#333333">
    The term ac is also being divided by b.
  </text>

  <rect x="670" y="570" width="420" height="38" rx="10" fill="#fff5f5" stroke="#aa0000" stroke-width="2"/>
  <text x="688" y="596" font-family="Arial, sans-serif" font-size="18" fill="#aa0000">
    Warning: do not cancel across addition or subtraction.
  </text>

  <rect x="60" y="670" width="1080" height="58" rx="14" fill="#111111"/>
  <text x="92" y="707" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">
    Exam rule:
  </text>
  <text x="220" y="707" font-family="Arial, sans-serif" font-size="22" fill="#ffffff">
    cancel factors only after factorising the whole numerator and denominator.
  </text>
</svg>
