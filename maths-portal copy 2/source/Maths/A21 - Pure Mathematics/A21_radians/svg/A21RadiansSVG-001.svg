<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" role="img" aria-labelledby="title desc"><title id="title">One radian definition diagram</title><desc id="desc">A circle with two radii enclosing one radian; arc length equals radius.</desc><rect width="700" height="460" fill="#fff"/><text x="35" y="48" font-family="Arial" font-size="30" font-weight="700">One radian</text><text x="35" y="82" font-family="Arial" font-size="16" fill="#333">If arc length equals radius, the angle at the centre is 1 radian.</text><circle cx="280" cy="255" r="140" fill="none" stroke="#2f8f5b" stroke-width="4"/><line x1="280" y1="255" x2="420" y2="255" stroke="#1f4e79" stroke-width="5"/><line x1="280" y1="255" x2="355.7" y2="137.2" stroke="#1f4e79" stroke-width="5"/><path d="M 420 255 A 140 140 0 0 0 355.7 137.2" fill="none" stroke="#c0392b" stroke-width="7" stroke-linecap="round"/><path d="M 325 255 A 45 45 0 0 0 304.3 217.1" fill="none" stroke="#111" stroke-width="2"/><text x="323" y="224" font-family="Arial" font-size="18">1 rad</text><text x="343" y="274" font-family="Arial" font-size="18" fill="#1f4e79">radius r</text><text x="330" y="187" font-family="Arial" font-size="18" fill="#1f4e79">radius r</text><text x="435" y="198" font-family="Arial" font-size="18" fill="#c0392b">arc length r</text><circle cx="280" cy="255" r="6" fill="#111"/><circle cx="420" cy="255" r="5" fill="#111"/><circle cx="355.7" cy="137.2" r="5" fill="#111"/><rect x="475" y="145" width="185" height="170" rx="12" fill="#f4f7fb" stroke="#ccc"/><text x="495" y="180" font-family="Arial" font-size="19" font-weight="700">Definition</text><text x="495" y="215" font-family="Arial" font-size="17">arc length = radius</text><text x="495" y="250" font-family="Arial" font-size="17">angle = 1 radian</text><text x="495" y="285" font-family="Arial" font-size="17">θ = 1</text></svg>
