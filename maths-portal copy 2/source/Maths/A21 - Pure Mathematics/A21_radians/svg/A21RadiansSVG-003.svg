<!-- Asset ID: A21RadiansSVG-003 | Sine and cosine graphs in radians -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" role="img" aria-labelledby="title desc"><title id="title">Sine and cosine graphs in radians</title><desc id="desc">Sine and cosine graphs from 0 to 2 pi.</desc><rect width="820" height="560" fill="#fff"/><text x="35" y="45" font-family="Arial" font-size="30" font-weight="700">Graph sketching with radians</text><text x="35" y="78" font-family="Arial" font-size="16" fill="#333">Replace 90°, 180°, 270°, 360° with π/2, π, 3π/2, 2π.</text><rect x="45" y="120" width="340" height="350" fill="#fbfbfb" stroke="#ddd"/><text x="145" y="150" font-family="Arial" font-size="22" font-weight="700">y = sin x</text><line x1="80" y1="295" x2="360" y2="295" stroke="#111" stroke-width="2"/><line x1="80" y1="170" x2="80" y2="420" stroke="#111" stroke-width="2"/><path d="M 80 295 C 112 235, 122 190, 150 190 C 178 190, 188 235, 220 295 C 252 355, 262 400, 290 400 C 318 400, 328 355, 360 295" fill="none" stroke="#1f4e79" stroke-width="4"/><text x="143" y="320" font-family="Arial" font-size="14">π/2</text><text x="214" y="320" font-family="Arial" font-size="14">π</text><text x="278" y="320" font-family="Arial" font-size="14">3π/2</text><text x="350" y="320" font-family="Arial" font-size="14">2π</text><text x="58" y="195" font-family="Arial" font-size="14">1</text><text x="52" y="405" font-family="Arial" font-size="14">−1</text><rect x="435" y="120" width="340" height="350" fill="#fbfbfb" stroke="#ddd"/><text x="528" y="150" font-family="Arial" font-size="22" font-weight="700">y = cos x</text><line x1="470" y1="295" x2="750" y2="295" stroke="#111" stroke-width="2"/><line x1="470" y1="170" x2="470" y2="420" stroke="#111" stroke-width="2"/><path d="M 470 190 C 502 190, 512 235, 540 295 C 568 355, 582 400, 610 400 C 638 400, 652 355, 680 295 C 708 235, 718 190, 750 190" fill="none" stroke="#7a3e9d" stroke-width="4"/><text x="533" y="320" font-family="Arial" font-size="14">π/2</text><text x="604" y="320" font-family="Arial" font-size="14">π</text><text x="668" y="320" font-family="Arial" font-size="14">3π/2</text><text x="740" y="320" font-family="Arial" font-size="14">2π</text><text x="448" y="195" font-family="Arial" font-size="14">1</text><text x="442" y="405" font-family="Arial" font-size="14">−1</text><rect x="115" y="492" width="590" height="44" rx="10" fill="#f4f7fb" stroke="#ccc"/><text x="132" y="520" font-family="Arial" font-size="16">Shape is unchanged. Only the angle measure on the x-axis has changed.</text></svg>
