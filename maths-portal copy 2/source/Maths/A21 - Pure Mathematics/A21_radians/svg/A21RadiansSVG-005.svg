<!-- Asset ID: A21RadiansSVG-005 | Segment area as sector minus triangle -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="title desc"><title id="title">Segment area as sector minus triangle</title><desc id="desc">Segment area equals sector area minus triangle area.</desc><rect width="780" height="520" fill="#fff"/><text x="35" y="48" font-family="Arial" font-size="30" font-weight="700">Segment area</text><text x="35" y="82" font-family="Arial" font-size="16" fill="#333">A segment is found by subtracting the triangle from the sector.</text><g transform="translate(70,95)"><path d="M 220 300 L 410 300 A 190 190 0 0 0 314.9 135.5 Z" fill="#e7f1fb" stroke="#1f4e79" stroke-width="4"/><path d="M 410 300 A 190 190 0 0 0 314.9 135.5 L 410 300 Z" fill="#fde2e2" stroke="#c0392b" stroke-width="3"/><path d="M 220 300 L 410 300 L 314.9 135.5 Z" fill="#e7f1fb" fill-opacity="0.55" stroke="#1f4e79" stroke-width="3"/><line x1="410" y1="300" x2="314.9" y2="135.5" stroke="#111" stroke-width="3"/><line x1="220" y1="300" x2="410" y2="300" stroke="#1f4e79" stroke-width="4"/><line x1="220" y1="300" x2="314.9" y2="135.5" stroke="#1f4e79" stroke-width="4"/><path d="M 270 300 A 50 50 0 0 0 244.9 256.7" fill="none" stroke="#111" stroke-width="2"/><text x="270" y="265" font-family="Arial" font-size="22">θ</text><circle cx="220" cy="300" r="6" fill="#111"/><text x="210" y="325" font-family="Arial" font-size="18">O</text><text x="310" y="323" font-family="Arial" font-size="18" fill="#1f4e79">r</text><text x="250" y="215" font-family="Arial" font-size="18" fill="#1f4e79">r</text><text x="365" y="205" font-family="Arial" font-size="18" fill="#c0392b">segment</text><text x="305" y="275" font-family="Arial" font-size="18" fill="#1f4e79">triangle</text></g><rect x="500" y="150" width="230" height="245" rx="12" fill="#f4f7fb" stroke="#ccc"/><text x="520" y="185" font-family="Arial" font-size="19" font-weight="700">Method</text><text x="520" y="222" font-family="Arial" font-size="17">segment area</text><text x="542" y="250" font-family="Arial" font-size="17">= sector − triangle</text><text x="520" y="292" font-family="Arial" font-size="17">sector = 1/2 r²θ</text><text x="520" y="322" font-family="Arial" font-size="17">triangle = 1/2 r² sinθ</text><text x="520" y="365" font-family="Arial" font-size="21" font-weight="700">A = 1/2 r²(θ − sinθ)</text><rect x="45" y="452" width="690" height="42" rx="10" fill="#fff7e8" stroke="#d6a84f"/><text x="62" y="479" font-family="Arial" font-size="16">θ must be in radians. The sine calculation must also be done in radians mode.</text></svg>
