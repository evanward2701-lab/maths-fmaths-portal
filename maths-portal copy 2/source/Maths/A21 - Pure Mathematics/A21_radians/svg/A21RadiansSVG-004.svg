<!-- Asset ID: A21RadiansSVG-004 | Sector formulas in radians -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="title desc"><title id="title">Sector formulas in radians</title><desc id="desc">Sector diagram with radius, angle and arc length.</desc><rect width="760" height="500" fill="#fff"/><text x="35" y="48" font-family="Arial" font-size="30" font-weight="700">Sector formulae in radians</text><text x="35" y="82" font-family="Arial" font-size="16" fill="#333">These formulae require θ to be measured in radians.</text><g transform="translate(120,80)"><path d="M 200 280 L 380 280 A 180 180 0 0 0 276.1 116.8 Z" fill="#e7f1fb" stroke="#1f4e79" stroke-width="4"/><path d="M 380 280 A 180 180 0 0 0 276.1 116.8" fill="none" stroke="#c0392b" stroke-width="7" stroke-linecap="round"/><line x1="200" y1="280" x2="380" y2="280" stroke="#1f4e79" stroke-width="4"/><line x1="200" y1="280" x2="276.1" y2="116.8" stroke="#1f4e79" stroke-width="4"/><circle cx="200" cy="280" r="6" fill="#111"/><text x="192" y="305" font-family="Arial" font-size="18">O</text><text x="285" y="303" font-family="Arial" font-size="19" fill="#1f4e79">r</text><text x="232" y="190" font-family="Arial" font-size="19" fill="#1f4e79">r</text><text x="338" y="196" font-family="Arial" font-size="19" fill="#c0392b">arc length l</text><path d="M 250 280 A 50 50 0 0 0 221.1 234.7" fill="none" stroke="#111" stroke-width="2"/><text x="248" y="247" font-family="Arial" font-size="22">θ</text></g><rect x="490" y="155" width="225" height="90" rx="12" fill="#f4f7fb" stroke="#ccc"/><text x="510" y="185" font-family="Arial" font-size="18" font-weight="700">Arc length</text><text x="510" y="222" font-family="Arial" font-size="28">l = rθ</text><rect x="490" y="275" width="225" height="105" rx="12" fill="#f4f7fb" stroke="#ccc"/><text x="510" y="305" font-family="Arial" font-size="18" font-weight="700">Sector area</text><text x="510" y="345" font-family="Arial" font-size="28">A = 1/2 r²θ</text><rect x="42" y="430" width="670" height="45" rx="10" fill="#fff7e8" stroke="#d6a84f"/><text x="60" y="458" font-family="Arial" font-size="16">A full turn is 2π radians, so the fraction of the circle is θ divided by 2π.</text></svg>
