<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>A21 Sigma Notation Explorer</title><style>body{font-family:Arial;margin:24px;background:#fafafa}.box{max-width:900px;margin:auto;background:white;border:3px solid #111;border-radius:18px;padding:20px}input,button{font-size:16px;padding:8px;margin:4px;border:2px solid #111;border-radius:8px}button{background:#111;color:#fff}table{border-collapse:collapse;width:100%;margin-top:12px}td,th{border:1px solid #ccc;padding:8px;text-align:right}th{background:#f4f4f4}</style></head><body><div class="box"><h1>A21 Sigma Notation Explorer</h1><p>Expand a sigma sum and count its terms.</p><label>Variable <input id="v" value="r"></label><label>Lower <input id="lo" type="number" value="4"></label><label>Upper <input id="hi" type="number" value="20"></label><label>Expression <input id="expr" value="3*r-5"></label><button onclick="go()">Expand</button><p id="summary"></p><table><thead><tr><th>index</th><th>term</th></tr></thead><tbody id="rows"></tbody></table></div><script>function f(expr,v,x){return Function(v,'return '+expr.replaceAll('^','**'))(x)}function fmt(x){return Math.abs(x-Math.round(x))<1e-9?Math.round(x):Number(x.toFixed(8))}function go(){let v=document.getElementById('v').value||'r',lo=+document.getElementById('lo').value,hi=+document.getElementById('hi').value,e=document.getElementById('expr').value,rows='',sum=0,vals=[];for(let k=lo;k<=hi;k++){let y=f(e,v,k);vals.push(y);sum+=y;rows+=`<tr><td>${k}</td><td>${fmt(y)}</td></tr>`}document.getElementById('rows').innerHTML=rows;document.getElementById('summary').innerHTML=`Terms = ${hi-lo+1}; expanded terms: ${vals.map(fmt).join(' + ').replaceAll('+ -','- ')}; total = <b>${fmt(sum)}</b>.`}go()</script></body></html>
