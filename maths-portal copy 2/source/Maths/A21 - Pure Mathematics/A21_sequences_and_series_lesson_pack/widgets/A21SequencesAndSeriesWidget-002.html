<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>A21 Recurrence Generator</title><style>body{font-family:Arial;margin:24px;background:#fafafa}.box{max-width:900px;margin:auto;background:white;border:3px solid #111;border-radius:18px;padding:20px}input,button{font-size:16px;padding:8px;margin:4px;border:2px solid #111;border-radius:8px}button{background:#111;color:#fff}table{border-collapse:collapse;width:100%;margin-top:12px}td,th{border:1px solid #ccc;padding:8px;text-align:right}th{background:#f4f4f4}</style></head><body><div class="box"><h1>A21 Recurrence Relation Generator</h1><p>Generate terms from x<sub>n+1</sub>=f(x<sub>n</sub>).</p><label>x1 <input id="start" type="number" value="3"></label><label>rule in x <input id="rule" value="2*x+4"></label><label>terms <input id="count" type="number" value="10"></label><button onclick="go()">Generate</button><p id="summary"></p><table><thead><tr><th>n</th><th>x_n</th><th>difference</th><th>ratio</th></tr></thead><tbody id="rows"></tbody></table></div><script>function f(expr,x){return Function('x','return '+expr.replaceAll('^','**'))(x)}function fmt(x){return Math.abs(x-Math.round(x))<1e-9?Math.round(x):Number(x.toFixed(8))}function go(){let x=+document.getElementById('start').value,rule=document.getElementById('rule').value,n=+document.getElementById('count').value,vals=[x];for(let i=1;i<n;i++)vals.push(f(rule,vals[i-1]));let rows='';for(let i=0;i<vals.length;i++){let d=i?fmt(vals[i]-vals[i-1]):'',r=i&&vals[i-1]!=0?fmt(vals[i]/vals[i-1]):'';rows+=`<tr><td>${i+1}</td><td>${fmt(vals[i])}</td><td>${d}</td><td>${r}</td></tr>`}document.getElementById('rows').innerHTML=rows;document.getElementById('summary').innerHTML='Exam method: generate terms first, then inspect differences, ratios or repeating blocks.'}go()</script></body></html>
