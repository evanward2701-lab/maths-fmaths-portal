<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>A21 Modelling Comparator</title><style>body{font-family:Arial;margin:24px;background:#fafafa}.box{max-width:950px;margin:auto;background:white;border:3px solid #111;border-radius:18px;padding:20px}input,button{font-size:16px;padding:8px;margin:4px;border:2px solid #111;border-radius:8px}button{background:#111;color:#fff}table{border-collapse:collapse;width:100%;margin-top:12px}td,th{border:1px solid #ccc;padding:8px;text-align:right}th{background:#f4f4f4}</style></head><body><div class="box"><h1>A21 Arithmetic vs Geometric Modelling Comparator</h1><label>Initial a <input id="a" type="number" value="20000"></label><label>Fixed change d <input id="d" type="number" value="5000"></label><label>% change <input id="p" type="number" value="5"></label><label>Years <input id="n" type="number" value="20"></label><button onclick="go()">Compare</button><p id="summary"></p><table><thead><tr><th>year</th><th>arithmetic</th><th>geometric</th></tr></thead><tbody id="rows"></tbody></table></div><script>function money(x){return '£'+x.toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2})}function go(){let a=+document.getElementById('a').value,d=+document.getElementById('d').value,p=+document.getElementById('p').value,n=+document.getElementById('n').value,r=1+p/100,rows='',sa=0,sg=0;for(let i=1;i<=n;i++){let ar=a+(i-1)*d,geo=a*Math.pow(r,i-1);sa+=ar;sg+=geo;rows+=`<tr><td>${i}</td><td>${money(ar)}</td><td>${money(geo)}</td></tr>`}document.getElementById('rows').innerHTML=rows;document.getElementById('summary').innerHTML=`Arithmetic total ${money(sa)}; geometric total ${money(sg)}; multiplier r=${r}. Limitation: real values may not change at a constant rate.`}go()</script></body></html>
