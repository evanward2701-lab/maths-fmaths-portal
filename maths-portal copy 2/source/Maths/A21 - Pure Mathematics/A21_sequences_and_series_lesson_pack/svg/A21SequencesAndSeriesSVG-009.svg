<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">Position-to-term versus recurrence</title><desc id="desc">Compare uₙ = 2n+3 with xₙ₊₁ = 2xₙ+4.</desc>
<rect x="20" y="20" width="960" height="380" rx="24" fill="#fff" stroke="#111" stroke-width="3"/>
<text x="50" y="75" font-family="Arial" font-size="34" font-weight="700">Position-to-term versus recurrence</text>
<text x="50" y="120" font-family="Arial" font-size="22">Compare uₙ = 2n+3 with xₙ₊₁ = 2xₙ+4.</text>
<rect x="80" y="165" width="840" height="70" rx="16" fill="#f4f4f4" stroke="#111" stroke-width="2"/>
<text x="115" y="210" font-family="Arial" font-size="28">u₅₀ = 2(50)+3</text>
<rect x="80" y="270" width="840" height="70" rx="16" fill="#f4f4f4" stroke="#111" stroke-width="2"/>
<text x="115" y="315" font-family="Arial" font-size="28">3 → 10 → 24 → 52</text>
</svg>