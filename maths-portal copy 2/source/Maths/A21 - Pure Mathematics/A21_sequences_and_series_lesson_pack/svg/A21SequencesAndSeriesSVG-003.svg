<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">Arithmetic series reverse-pairing proof</title><desc id="desc">Sₙ forwards and backwards; opposite pairs have the same total.</desc>
<rect x="20" y="20" width="960" height="380" rx="24" fill="#fff" stroke="#111" stroke-width="3"/>
<text x="50" y="75" font-family="Arial" font-size="34" font-weight="700">Arithmetic series reverse-pairing proof</text>
<text x="50" y="120" font-family="Arial" font-size="22">Sₙ forwards and backwards; opposite pairs have the same total.</text>
<rect x="80" y="165" width="840" height="70" rx="16" fill="#f4f4f4" stroke="#111" stroke-width="2"/>
<text x="115" y="210" font-family="Arial" font-size="28">2Sₙ = n(2a+(n−1)d)</text>
<rect x="80" y="270" width="840" height="70" rx="16" fill="#f4f4f4" stroke="#111" stroke-width="2"/>
<text x="115" y="315" font-family="Arial" font-size="28">Sₙ = n/2(2a+(n−1)d)</text>
</svg>