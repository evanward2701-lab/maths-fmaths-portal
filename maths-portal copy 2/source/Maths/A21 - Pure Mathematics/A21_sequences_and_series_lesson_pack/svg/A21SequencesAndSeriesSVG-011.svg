<text x="115" y="210" font-family="Arial" font-size="28">Fixed amount: d</text>
<rect x="80" y="270" width="840" height="70" rx="16" fill="#f4f4f4" stroke="#111" stroke-width="2"/>
<text x="115" y="315" font-family="Arial" font-size="28">Fixed percentage: r</text>
