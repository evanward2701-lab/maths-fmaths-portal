<text x="50" y="75" font-family="Arial" font-size="34" font-weight="700">Arithmetic versus geometric modelling</text>
<text x="50" y="120" font-family="Arial" font-size="22">Fixed amount gives arithmetic; fixed percentage gives geometric.</text>
