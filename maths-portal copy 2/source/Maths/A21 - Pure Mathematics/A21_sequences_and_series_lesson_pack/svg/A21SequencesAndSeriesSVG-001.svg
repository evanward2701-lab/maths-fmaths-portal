<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
<title id="title">Arithmetic sequence common difference</title><desc id="desc">2, 5, 8, 11, 14 with +3 jumps</desc>
<rect x="20" y="20" width="960" height="320" rx="24" fill="#fff" stroke="#111" stroke-width="3"/>
<text x="50" y="75" font-family="Arial" font-size="34" font-weight="700">Arithmetic sequence common difference</text>
<text x="50" y="115" font-family="Arial" font-size="22">2, 5, 8, 11, 14 with +3 jumps</text>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#111"/></marker></defs>
<g font-family="Arial" font-size="48" font-weight="700"><text x="110" y="220">2</text><text x="270" y="220">5</text><text x="430" y="220">8</text><text x="590" y="220">11</text><text x="750" y="220">14</text></g>
<g stroke="#111" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M155 190 C190 145,235 145,270 190"/><path d="M315 190 C350 145,395 145,430 190"/><path d="M475 190 C510 145,555 145,590 190"/><path d="M635 190 C670 145,715 145,750 190"/></g>
<g font-family="Arial" font-size="24" font-weight="700"><text x="165" y="155">+3</text><text x="325" y="155">+3</text><text x="485" y="155">+3</text><text x="645" y="155">+3</text></g>
<rect x="600" y="70" width="330" height="60" rx="12" fill="#f4f4f4" stroke="#111" stroke-width="2"/>
<text x="625" y="110" font-family="Arial" font-size="27">uₙ = a + (n−1)d</text>
</svg>