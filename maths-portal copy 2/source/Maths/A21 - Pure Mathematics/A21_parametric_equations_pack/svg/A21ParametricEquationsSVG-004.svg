<?xml version="1.0" encoding="UTF-8"?>
<svg width="1100" height="640" viewBox="0 0 1100 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">A21ParametricEquationsSVG-004 Table Generated Curve</title>
<desc id="desc">Shows a curve generated by parameter values.</desc>
<metadata>
Asset ID: A21ParametricEquationsSVG-004
Source: Transcript sketching section; CCEA A21-CG-LO001.
Related lesson section: Core Theory; Sketching Parametric Curves.
Purpose: Show sketching by parameter values when Cartesian form is awkward.
</metadata>
<rect width="1100" height="640" fill="#ffffff"/>
<text x="55" y="55" font-family="Georgia, serif" font-size="34" font-weight="700">Sketching by parameter values</text>
<text x="55" y="92" font-family="Arial, sans-serif" font-size="17">If Cartesian form is awkward, choose t-values, calculate x and y, then plot points in order.</text>

<rect x="70" y="125" width="700" height="455" rx="18" fill="#f7f9fc" stroke="#c7d2e5" stroke-width="2"/>
<line x1="120" y1="350" x2="720" y2="350" stroke="#333" stroke-width="2"/>
<line x1="420" y1="540" x2="420" y2="160" stroke="#333" stroke-width="2"/>
<text x="728" y="355" font-family="Arial" font-size="16">x</text>
<text x="428" y="165" font-family="Arial" font-size="16">y</text>

<path d="M 420 350 C 470 335 490 390 440 425 C 350 490 250 390 305 280 C 380 130 620 190 680 395" fill="none" stroke="#6a5acd" stroke-width="5"/>
<circle cx="420" cy="350" r="6" fill="#1b4ed8"/>
<circle cx="440" cy="425" r="6" fill="#1b4ed8"/>
<circle cx="305" cy="280" r="6" fill="#1b4ed8"/>
<circle cx="680" cy="395" r="6" fill="#1b4ed8"/>
<rect x="805" y="145" width="275" height="390" rx="18" fill="#fff8e6" stroke="#e2ad37" stroke-width="2"/>
<text x="830" y="190" font-family="Arial" font-size="22" font-weight="700">Point table</text>
<text x="830" y="230" font-family="Georgia" font-size="18">x = θ cos θ</text>
<text x="830" y="260" font-family="Georgia" font-size="18">y = θ sin θ</text>
<text x="830" y="320" font-family="Arial" font-size="16">Plot points in order.</text>

</svg>
