<text x="728" y="355" font-family="Arial" font-size="16">x</text>
<text x="428" y="165" font-family="Arial" font-size="16">y</text>

<path d="M 210 210 C 150 285 150 415 210 490" fill="none" stroke="#5067a0" stroke-width="5"/>
<path d="M 630 210 C 690 285 690 415 630 490" fill="none" stroke="#5067a0" stroke-width="5"/>
<text x="165" y="175" font-family="Georgia" font-size="22">x² − y² = 5</text>
<rect x="810" y="150" width="240" height="350" rx="18" fill="#fff8e6" stroke="#e2ad37" stroke-width="2"/>
<text x="835" y="200" font-family="Georgia" font-size="22">x = sin(t)</text>
<text x="835" y="240" font-family="Georgia" font-size="22">y = t²</text>
<text x="835" y="310" font-family="Arial" font-size="16">Choose t</text>
