<rect width="1100" height="640" fill="#ffffff"/>
<text x="55" y="55" font-family="Georgia, serif" font-size="34" font-weight="700">Cartesian equation versus parametric equations</text>
<text x="55" y="92" font-family="Arial, sans-serif" font-size="17">A Cartesian equation relates x and y directly. Parametric equations use t to generate both coordinates.</text>

<rect x="70" y="125" width="700" height="455" rx="18" fill="#f7f9fc" stroke="#c7d2e5" stroke-width="2"/>
<line x1="120" y1="350" x2="720" y2="350" stroke="#333" stroke-width="2"/>
