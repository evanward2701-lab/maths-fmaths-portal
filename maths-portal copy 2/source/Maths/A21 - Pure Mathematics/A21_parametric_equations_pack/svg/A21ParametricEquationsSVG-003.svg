<?xml version="1.0" encoding="UTF-8"?>
<svg width="1100" height="640" viewBox="0 0 1100 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">A21ParametricEquationsSVG-003 Parametric Circle</title>
<desc id="desc">Shows circle from x=sin t+2 and y=cos t-3.</desc>
<metadata>
Asset ID: A21ParametricEquationsSVG-003
Source: Transcript section 2; CCEA A21-CG-LO001.
Related lesson section: Worked Example 3.
Purpose: Show the circle generated by trig parametric equations.
</metadata>
<rect width="1100" height="640" fill="#ffffff"/>
<text x="55" y="55" font-family="Georgia, serif" font-size="34" font-weight="700">A circle from trig parametric equations</text>
<text x="55" y="92" font-family="Arial, sans-serif" font-size="17">Use sin²t + cos²t = 1 instead of trying to make t the subject.</text>

<rect x="70" y="125" width="700" height="455" rx="18" fill="#f7f9fc" stroke="#c7d2e5" stroke-width="2"/>
<line x1="120" y1="350" x2="720" y2="350" stroke="#333" stroke-width="2"/>
<line x1="420" y1="540" x2="420" y2="160" stroke="#333" stroke-width="2"/>
<text x="728" y="355" font-family="Arial" font-size="16">x</text>
<text x="428" y="165" font-family="Arial" font-size="16">y</text>

<circle cx="470" cy="400" r="95" fill="#eef3ff" stroke="#2d5be3" stroke-width="6"/>
<circle cx="470" cy="400" r="7" fill="#d61f69"/>
<line x1="470" y1="400" x2="565" y2="400" stroke="#d61f69" stroke-width="3"/>
<text x="485" y="390" font-family="Arial" font-size="17">centre (2,-3)</text>
<text x="500" y="425" font-family="Arial" font-size="17">radius 1</text>
<rect x="810" y="150" width="260" height="360" rx="18" fill="#fff8e6" stroke="#e2ad37" stroke-width="2"/>
<text x="835" y="195" font-family="Georgia" font-size="18">x = sin t + 2</text>
<text x="835" y="230" font-family="Georgia" font-size="18">sin t = x − 2</text>
<text x="835" y="275" font-family="Georgia" font-size="18">y = cos t − 3</text>
<text x="835" y="310" font-family="Georgia" font-size="18">cos t = y + 3</text>
<text x="835" y="365" font-family="Georgia" font-size="18">(x−2)²+(y+3)²=1</text>

</svg>
