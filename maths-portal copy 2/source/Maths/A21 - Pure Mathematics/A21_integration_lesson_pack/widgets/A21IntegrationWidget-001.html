<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>A21IntegrationWidget-001</title>
<style>
body{font-family:Arial,sans-serif;background:#f8fafc;color:#0f172a;margin:0;padding:20px}
main{max-width:900px;margin:auto;background:white;border:2px solid #cbd5e1;border-radius:20px;padding:20px}
canvas{width:100%;max-width:650px;border:1px solid #cbd5e1;border-radius:12px;background:white}
.controls{margin-top:12px}
label{font-weight:700}
</style>
</head>
<body><main><h1>Riemann Sum Explorer</h1>
<p>Vary the number of right-endpoint rectangles for <strong>f(x)=x²</strong> on <strong>[0,1]</strong>. Exact value: <strong>1/3</strong>.</p>
<canvas id="c" width="650" height="420"></canvas>
<div class="controls"><label>Rectangles: <span id="nOut">8</span></label><input id="n" type="range" min="1" max="80" value="8"></div>
<p>Approximation: <strong id="sum"></strong></p>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),n=document.getElementById('n'),nOut=document.getElementById('nOut'),sumOut=document.getElementById('sum');
function X(x){return 60+500*x} function Y(y){return 360-280*y} function f(x){return x*x}
function draw(){let N=+n.value;nOut.textContent=N;ctx.clearRect(0,0,650,420);ctx.strokeStyle='#0f172a';ctx.beginPath();ctx.moveTo(X(0),Y(0));ctx.lineTo(X(1.08),Y(0));ctx.moveTo(X(0),Y(0));ctx.lineTo(X(0),Y(1.08));ctx.stroke();let h=1/N,s=0;for(let r=1;r<=N;r++){let xl=(r-1)*h,xr=r*h,ht=f(xr);s+=ht*h;ctx.fillStyle='rgba(37,99,235,.25)';ctx.strokeStyle='#2563eb';ctx.fillRect(X(xl),Y(ht),X(xr)-X(xl),Y(0)-Y(ht));ctx.strokeRect(X(xl),Y(ht),X(xr)-X(xl),Y(0)-Y(ht));}ctx.strokeStyle='#dc2626';ctx.beginPath();for(let i=0;i<=200;i++){let x=i/200,y=f(x);if(i===0)ctx.moveTo(X(x),Y(y));else ctx.lineTo(X(x),Y(y));}ctx.stroke();sumOut.textContent=s.toFixed(6);}
n.oninput=draw;draw();
</script></main></body></html>
