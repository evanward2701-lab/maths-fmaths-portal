<text x="450" y="150" text-anchor="middle" font-family="Arial" font-size="26">d/dx[sin(3x+1)] = 3cos(3x+1)</text><text x="450" y="240" text-anchor="middle" font-family="Arial" font-size="26">∫cos(3x+1) dx = ⅓sin(3x+1)+C</text><text x="450" y="340" text-anchor="middle" font-family="Arial" font-size="22" fill="#475569">Divide by the coefficient of x when the inside is linear.</text>
