<text x="450" y="180" text-anchor="middle" font-family="Arial" font-size="28">d/dx(sin x) = cos x</text><text x="450" y="250" text-anchor="middle" font-family="Arial" font-size="28">∫ cos x dx = sin x + C</text><text x="450" y="350" text-anchor="middle" font-family="Arial" font-size="24" fill="#475569">Check integrals by differentiating.</text>
