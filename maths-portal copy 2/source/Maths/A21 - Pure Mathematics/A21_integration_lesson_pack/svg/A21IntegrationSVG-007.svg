<text x="450" y="160" text-anchor="middle" font-family="Arial" font-size="25">Product rule: d(uv)/dx = u dv/dx + v du/dx</text><text x="450" y="250" text-anchor="middle" font-family="Arial" font-size="25">∫u(dv/dx)dx = uv - ∫v(du/dx)dx</text><text x="450" y="340" text-anchor="middle" font-family="Arial" font-size="22">Example: ∫xcosx dx = xsinx + cosx + C</text>
