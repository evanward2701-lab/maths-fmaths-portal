<text x="450" y="65" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">Substitution workflow</text>
<text x="450" y="145" text-anchor="middle" font-family="Arial" font-size="24">u = 2x+5</text><text x="450" y="215" text-anchor="middle" font-family="Arial" font-size="24">x = (u-5)/2</text><text x="450" y="285" text-anchor="middle" font-family="Arial" font-size="24">dx = ½du</text><text x="450" y="355" text-anchor="middle" font-family="Arial" font-size="22" fill="#475569">Rewrite the whole integral in u.</text>
