<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">Separable differential equations</title>
<desc id="desc">Separable differential equations for A21 Integration.</desc>
<!-- Asset ID: A21IntegrationSVG-010 | Source: CCEA A21 Integration + lesson evidence | Purpose: teaching visual -->
<rect x="20" y="20" width="860" height="520" rx="24" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="450" y="65" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">Separable differential equations</text>
<text x="450" y="140" text-anchor="middle" font-family="Arial" font-size="24">dV/dt = -kV</text><text x="450" y="210" text-anchor="middle" font-family="Arial" font-size="24">(1/V)dV = -kdt</text><text x="450" y="280" text-anchor="middle" font-family="Arial" font-size="24">ln|V| = -kt + C</text><text x="450" y="350" text-anchor="middle" font-family="Arial" font-size="24">V = Ae^(-kt)</text>
</svg>