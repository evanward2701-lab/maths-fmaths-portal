<title id="title">Reverse chain rule</title>
<desc id="desc">Reverse chain rule for A21 Integration.</desc>
<!-- Asset ID: A21IntegrationSVG-005 | Source: CCEA A21 Integration + lesson evidence | Purpose: teaching visual -->
<rect x="20" y="20" width="860" height="520" rx="24" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="450" y="65" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">Reverse chain rule</text>
<text x="450" y="145" text-anchor="middle" font-family="Arial" font-size="24">Target: ∫x(x²+5)³ dx</text><text x="450" y="215" text-anchor="middle" font-family="Arial" font-size="24">Consider: (x²+5)⁴</text><text x="450" y="285" text-anchor="middle" font-family="Arial" font-size="24">Differentiate: 8x(x²+5)³</text><text x="450" y="355" text-anchor="middle" font-family="Arial" font-size="24">Scale: ⅛(x²+5)⁴ + C</text>
</svg>