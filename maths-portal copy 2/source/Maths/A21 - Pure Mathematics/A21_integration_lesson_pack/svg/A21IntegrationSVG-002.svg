<text x="450" y="130" text-anchor="middle" font-family="Arial" font-size="22">∫xⁿ dx = xⁿ⁺¹/(n+1)+C, n≠-1</text><text x="450" y="180" text-anchor="middle" font-family="Arial" font-size="22">∫1/x dx = ln|x|+C</text><text x="450" y="230" text-anchor="middle" font-family="Arial" font-size="22">∫cos x dx = sin x+C</text><text x="450" y="280" text-anchor="middle" font-family="Arial" font-size="22">∫sin x dx = -cos x+C</text><text x="450" y="330" text-anchor="middle" font-family="Arial" font-size="22">∫sec²x dx = tan x+C</text>
