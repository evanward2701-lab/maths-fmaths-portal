<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">A21FunctionsAndGraphsSVG-001: Graph of y = |x|</title><desc id="desc">Shows a table of values and V-shaped graph for y equals modulus x.</desc><metadata>Asset ID: A21FunctionsAndGraphsSVG-001; Unit: A21; Topic code: A21-AF; Related LO IDs: A21-AF-LO006; Purpose: Show the graph of y=|x|.</metadata><rect width="900" height="560" fill="white"/><text x="40" y="50" font-family="Arial" font-size="30" font-weight="700">The modulus graph: y = |x|</text><g transform="translate(80,90)" font-family="Arial" font-size="20"><rect x="0" y="0" width="600" height="82" fill="none" stroke="black" stroke-width="2"/><line x1="0" y1="41" x2="600" y2="41" stroke="black" stroke-width="2"/><line x1="100" y1="0" x2="100" y2="82" stroke="black" stroke-width="2"/><line x1="200" y1="0" x2="200" y2="82" stroke="black"/><line x1="300" y1="0" x2="300" y2="82" stroke="black"/><line x1="400" y1="0" x2="400" y2="82" stroke="black"/><line x1="500" y1="0" x2="500" y2="82" stroke="black"/><text x="42" y="28" text-anchor="middle" font-weight="700">x</text><text x="42" y="68" text-anchor="middle" font-weight="700">|x|</text><text x="150" y="28" text-anchor="middle">-2</text><text x="250" y="28" text-anchor="middle">-1</text><text x="350" y="28" text-anchor="middle">0</text><text x="450" y="28" text-anchor="middle">1</text><text x="550" y="28" text-anchor="middle">2</text><text x="150" y="68" text-anchor="middle">2</text><text x="250" y="68" text-anchor="middle">1</text><text x="350" y="68" text-anchor="middle">0</text><text x="450" y="68" text-anchor="middle">1</text><text x="550" y="68" text-anchor="middle">2</text></g><g transform="translate(160,210)"><line x1="0" y1="250" x2="600" y2="250" stroke="black" stroke-width="2"/><line x1="300" y1="300" x2="300" y2="20" stroke="black" stroke-width="2"/><polygon points="600,250 588,244 588,256" fill="black"/><polygon points="300,20 294,32 306,32" fill="black"/><g font-family="Arial" font-size="18"><text x="604" y="256">x</text><text x="308" y="25">y</text><text x="100" y="278" text-anchor="middle">-2</text><text x="200" y="278" text-anchor="middle">-1</text><text x="300" y="278" text-anchor="middle">0</text><text x="400" y="278" text-anchor="middle">1</text><text x="500" y="278" text-anchor="middle">2</text></g><polyline points="100,50 200,150 300,250 400,150 500,50" fill="none" stroke="black" stroke-width="4"/><g fill="black"><circle cx="100" cy="50" r="7"/><circle cx="200" cy="150" r="7"/><circle cx="300" cy="250" r="7"/><circle cx="400" cy="150" r="7"/><circle cx="500" cy="50" r="7"/></g><g font-family="Arial" font-size="17"><text x="72" y="40">(-2,2)</text><text x="172" y="140">(-1,1)</text><text x="310" y="240">(0,0)</text><text x="410" y="140">(1,1)</text><text x="510" y="40">(2,2)</text></g></g></svg>