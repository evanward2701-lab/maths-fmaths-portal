<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560"><title>A21FunctionsAndGraphsSVG-008: Combined transformations of points</title><metadata>Asset ID: A21FunctionsAndGraphsSVG-008; LO: A21-AF-LO007.</metadata><rect width="900" height="560" fill="white"/><text x="35" y="48" font-family="Arial" font-size="28" font-weight="700">Combined transformations using points</text><text x="55" y="86" font-family="Arial" font-size="20">Original points on y = f(x): A(2,-1), B(6,4)</text><g font-family="Arial"><rect x="55" y="115" width="790" height="350" fill="white" stroke="black" stroke-width="2"/><line x1="55" y1="175" x2="845" y2="175" stroke="black" stroke-width="2"/><line x1="55" y1="260" x2="845" y2="260" stroke="black"/><line x1="55" y1="345" x2="845" y2="345" stroke="black"/><line x1="295" y1="115" x2="295" y2="465" stroke="black" stroke-width="2"/><line x1="570" y1="115" x2="570" y2="465" stroke="black" stroke-width="2"/><text x="175" y="153" text-anchor="middle" font-size="21" font-weight="700">Transformation</text><text x="432" y="153" text-anchor="middle" font-size="21" font-weight="700">A(2,-1)</text><text x="707" y="153" text-anchor="middle" font-size="21" font-weight="700">B(6,4)</text><text x="175" y="223" text-anchor="middle" font-size="20">y = 2f(x+2)</text><text x="432" y="213" text-anchor="middle" font-size="18">x: 2 → 0</text><text x="432" y="239" text-anchor="middle" font-size="18">y: -1 → -2</text><text x="707" y="213" text-anchor="middle" font-size="18">x: 6 → 4</text><text x="707" y="239" text-anchor="middle" font-size="18">y: 4 → 8</text><text x="175" y="308" text-anchor="middle" font-size="20">y = -f(2x)</text><text x="432" y="298" text-anchor="middle" font-size="18">x: 2 → 1</text><text x="432" y="324" text-anchor="middle" font-size="18">y: -1 → 1</text><text x="707" y="298" text-anchor="middle" font-size="18">x: 6 → 3</text><text x="707" y="324" text-anchor="middle" font-size="18">y: 4 → -4</text><text x="175" y="393" text-anchor="middle" font-size="20">y = |f(-x)|</text><text x="432" y="383" text-anchor="middle" font-size="18">x: 2 → -2</text><text x="432" y="409" text-anchor="middle" font-size="18">y: -1 → 1</text><text x="707" y="383" text-anchor="middle" font-size="18">x: 6 → -6</text><text x="707" y="409" text-anchor="middle" font-size="18">y: 4 → 4</text></g><rect x="55" y="490" width="790" height="45" rx="9" fill="white" stroke="black"/><text x="75" y="519" font-family="Arial" font-size="19">Inside changes affect x-values oppositely. Outside changes affect y-values directly.</text></svg>