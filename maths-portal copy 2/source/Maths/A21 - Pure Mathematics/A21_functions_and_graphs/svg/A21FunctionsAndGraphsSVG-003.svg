<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560"><title>A21FunctionsAndGraphsSVG-003: Solving modulus inequality</title><metadata>Asset ID: A21FunctionsAndGraphsSVG-003; LO: A21-AF-LO006.</metadata><rect width="900" height="560" fill="white"/><text x="35" y="48" font-family="Arial" font-size="28" font-weight="700">Solving |3x - 5| &gt; 2 - 1/2 x</text><g transform="translate(90,80)"><line x1="0" y1="360" x2="740" y2="360" stroke="black" stroke-width="2"/><line x1="210" y1="430" x2="210" y2="30" stroke="black" stroke-width="2"/><polygon points="740,360 728,354 728,366"/><polygon points="210,30 204,42 216,42"/><g font-family="Arial" font-size="17"><text x="745" y="366">x</text><text x="218" y="35">y</text><text x="368" y="382" text-anchor="middle">6/5</text><text x="430" y="382" text-anchor="middle">5/3</text><text x="475" y="382" text-anchor="middle">2</text></g><polyline points="80,50 430,360 700,60" fill="none" stroke="black" stroke-width="4"/><text x="510" y="95" font-family="Arial" font-size="19">y = |3x - 5|</text><line x1="30" y1="230" x2="720" y2="390" stroke="black" stroke-width="3"/><text x="535" y="330" font-family="Arial" font-size="19">y = 2 - 1/2 x</text><circle cx="368" cy="305" r="7"/><circle cx="475" cy="300" r="7"/><line x1="368" y1="305" x2="368" y2="360" stroke="black" stroke-dasharray="6 6"/><line x1="475" y1="300" x2="475" y2="360" stroke="black" stroke-dasharray="6 6"/><text x="286" y="292" font-family="Arial" font-size="18">x = 6/5</text><text x="490" y="290" font-family="Arial" font-size="18">x = 2</text><text x="60" y="468" font-family="Arial" font-size="22" font-weight="700">Solution: x &lt; 6/5 or x &gt; 2</text><text x="60" y="498" font-family="Arial" font-size="18">The modulus graph must be above the line.</text></g></svg>