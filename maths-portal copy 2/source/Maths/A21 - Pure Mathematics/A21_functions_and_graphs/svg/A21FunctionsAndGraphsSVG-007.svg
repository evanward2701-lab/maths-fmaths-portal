<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560"><title>A21FunctionsAndGraphsSVG-007: Inverse graph reflection</title><metadata>Asset ID: A21FunctionsAndGraphsSVG-007; LO: A21-AF-LO005.</metadata><rect width="900" height="560" fill="white"/><text x="35" y="48" font-family="Arial" font-size="28" font-weight="700">Inverse functions reflect in y = x</text><g transform="translate(130,75)"><line x1="0" y1="350" x2="650" y2="350" stroke="black" stroke-width="2"/><line x1="250" y1="450" x2="250" y2="35" stroke="black" stroke-width="2"/><polygon points="650,350 638,344 638,356"/><polygon points="250,35 244,47 256,47"/><line x1="50" y1="550" x2="650" y2="-50" stroke="black" stroke-width="2" stroke-dasharray="9 8"/><text x="540" y="85" font-family="Arial" font-size="20">y = x</text><line x1="130" y1="480" x2="520" y2="-300" stroke="black" stroke-width="4"/><text x="390" y="105" font-family="Arial" font-size="20">y = f(x)</text><line x1="-30" y1="490" x2="730" y2="110" stroke="black" stroke-width="4"/><text x="430" y="270" font-family="Arial" font-size="20">y = f⁻¹(x)</text><circle cx="300" cy="250" r="7"/><circle cx="400" cy="300" r="7"/><line x1="300" y1="250" x2="400" y2="300" stroke="black" stroke-dasharray="5 5"/><text x="212" y="242" font-family="Arial" font-size="17">(a,b)</text><text x="410" y="306" font-family="Arial" font-size="17">(b,a)</text><rect x="35" y="455" width="600" height="55" rx="9" fill="white" stroke="black"/><text x="55" y="488" font-family="Arial" font-size="20">Domain and range swap when you take the inverse.</text></g></svg>