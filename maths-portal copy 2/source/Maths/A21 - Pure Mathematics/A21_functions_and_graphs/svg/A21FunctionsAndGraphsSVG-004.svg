<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560"><title>A21FunctionsAndGraphsSVG-004: Parameter modulus graph</title><metadata>Asset ID: A21FunctionsAndGraphsSVG-004; LO: A21-AF-LO006.</metadata><rect width="900" height="560" fill="white"/><text x="35" y="48" font-family="Arial" font-size="27" font-weight="700">Exactly one solution: |6 - x| = 1/2 x + k</text><g transform="translate(100,75)"><line x1="0" y1="360" x2="720" y2="360" stroke="black" stroke-width="2"/><line x1="95" y1="430" x2="95" y2="35" stroke="black" stroke-width="2"/><polygon points="720,360 708,354 708,366"/><polygon points="95,35 89,47 101,47"/><g font-family="Arial" font-size="18"><text x="725" y="366">x</text><text x="103" y="40">y</text><text x="575" y="383" text-anchor="middle">6</text><text x="76" y="80" text-anchor="end">6</text></g><polyline points="95,60 575,360 705,275" fill="none" stroke="black" stroke-width="4"/><circle cx="575" cy="360" r="7"/><text x="590" y="352" font-family="Arial" font-size="18">vertex (6,0)</text><text x="265" y="130" font-family="Arial" font-size="20">y = |6 - x|</text><line x1="95" y1="660" x2="705" y2="55" stroke="black" stroke-width="3"/><text x="445" y="125" font-family="Arial" font-size="19">y = 1/2 x - 3</text><line x1="95" y1="710" x2="705" y2="105" stroke="black" stroke-width="2" stroke-dasharray="8 7"/><rect x="70" y="445" width="650" height="72" rx="10" fill="white" stroke="black"/><text x="90" y="474" font-family="Arial" font-size="20">For exactly one solution, the line must pass through (6,0).</text><text x="90" y="502" font-family="Arial" font-size="20">0 = 1/2(6) + k, so k = -3 and the solution is x = 6.</text></g></svg>