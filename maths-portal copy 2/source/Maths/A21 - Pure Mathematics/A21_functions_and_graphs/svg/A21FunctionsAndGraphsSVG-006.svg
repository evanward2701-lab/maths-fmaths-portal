<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560"><title>A21FunctionsAndGraphsSVG-006: Piecewise function graph</title><metadata>Asset ID: A21FunctionsAndGraphsSVG-006; LO: A21-AF-LO002, A21-AF-LO003.</metadata><rect width="900" height="560" fill="white"/><text x="35" y="48" font-family="Arial" font-size="28" font-weight="700">Piecewise function and range</text><text x="60" y="88" font-family="Arial" font-size="20">f(x) = 5 - 2x for x &lt; 1, and f(x) = x² + 3 for x ≥ 1</text><g transform="translate(120,95)"><line x1="0" y1="340" x2="680" y2="340" stroke="black" stroke-width="2"/><line x1="300" y1="420" x2="300" y2="35" stroke="black" stroke-width="2"/><polygon points="680,340 668,334 668,346"/><polygon points="300,35 294,47 306,47"/><text x="685" y="346" font-family="Arial" font-size="18">x</text><text x="308" y="40" font-family="Arial" font-size="18">f(x)</text><line x1="20" y1="-20" x2="390" y2="185" stroke="black" stroke-width="4"/><path d="M390,130 C430,128 500,80 630,-60" fill="none" stroke="black" stroke-width="4"/><line x1="390" y1="35" x2="390" y2="420" stroke="black" stroke-dasharray="6 6"/><circle cx="390" cy="185" r="9" fill="white" stroke="black" stroke-width="3"/><circle cx="390" cy="130" r="9" fill="black"/><text x="405" y="190" font-family="Arial" font-size="17">open: line branch not included</text><text x="405" y="127" font-family="Arial" font-size="17">filled: quadratic branch included</text><rect x="30" y="445" width="590" height="60" rx="9" fill="white" stroke="black"/><text x="52" y="482" font-family="Arial" font-size="22" font-weight="700">Range: f(x) &gt; 3</text></g></svg>