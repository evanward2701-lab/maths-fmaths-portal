<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560"><title>A21FunctionsAndGraphsSVG-010: Solving transformed modulus equation</title><metadata>Asset ID: A21FunctionsAndGraphsSVG-010; LO: A21-AF-LO006, A21-AF-LO007.</metadata><rect width="940" height="560" fill="white"/><text x="35" y="48" font-family="Arial" font-size="27" font-weight="700">Solving 3|x - 1| - 2 = 1/2 x + 3</text><g transform="translate(105,70)"><line x1="0" y1="350" x2="730" y2="350" stroke="black" stroke-width="2"/><line x1="260" y1="440" x2="260" y2="35" stroke="black" stroke-width="2"/><polygon points="730,350 718,344 718,356"/><polygon points="260,35 254,47 266,47"/><g font-family="Arial" font-size="17"><text x="735" y="356">x</text><text x="268" y="40">y</text><text x="355" y="374" text-anchor="middle">1</text><text x="208" y="374" text-anchor="middle">-4/7</text><text x="560" y="374" text-anchor="middle">16/5</text><text x="340" y="430">vertex (1,-2)</text></g><polyline points="95,55 355,410 690,25" fill="none" stroke="black" stroke-width="4"/><circle cx="355" cy="410" r="7"/><line x1="30" y1="205" x2="710" y2="80" stroke="black" stroke-width="3"/><text x="480" y="90" font-family="Arial" font-size="20">y = 1/2 x + 3</text><text x="595" y="45" font-family="Arial" font-size="20">y = 3|x - 1| - 2</text><circle cx="208" cy="233" r="7"/><circle cx="560" cy="108" r="7"/><line x1="208" y1="233" x2="208" y2="350" stroke="black" stroke-dasharray="6 6"/><line x1="560" y1="108" x2="560" y2="350" stroke="black" stroke-dasharray="6 6"/><text x="120" y="220" font-family="Arial" font-size="18">x = -4/7</text><text x="575" y="120" font-family="Arial" font-size="18">x = 16/5</text><rect x="30" y="455" width="650" height="65" rx="9" fill="white" stroke="black"/><text x="50" y="482" font-family="Arial" font-size="18">Right branch: 3(x - 1) - 2 = 1/2x + 3 gives x = 16/5.</text><text x="50" y="510" font-family="Arial" font-size="18">Left branch: 3(-x + 1) - 2 = 1/2x + 3 gives x = -4/7.</text></g></svg>