<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560"><title>A21FunctionsAndGraphsSVG-009: Comparing transformed modulus graphs</title><metadata>Asset ID: A21FunctionsAndGraphsSVG-009; LO: A21-AF-LO006, A21-AF-LO007.</metadata><rect width="960" height="560" fill="white"/><text x="35" y="45" font-family="Arial" font-size="27" font-weight="700">Outside modulus vs inside modulus</text><g transform="translate(45,85)"><text x="120" y="0" font-family="Arial" font-size="22" font-weight="700" text-anchor="middle">y = f(x)</text><rect x="0" y="20" width="270" height="350" fill="white" stroke="black"/><line x1="25" y1="245" x2="245" y2="245" stroke="black"/><line x1="135" y1="335" x2="135" y2="45" stroke="black"/><path d="M20,60 C75,315 185,315 245,60" fill="none" stroke="black" stroke-width="3"/><text x="35" y="395" font-family="Arial" font-size="16">Middle section below x-axis.</text></g><g transform="translate(345,85)"><text x="135" y="0" font-family="Arial" font-size="22" font-weight="700" text-anchor="middle">y = |f(x)|</text><rect x="0" y="20" width="270" height="350" fill="white" stroke="black"/><line x1="25" y1="245" x2="245" y2="245" stroke="black"/><line x1="135" y1="335" x2="135" y2="45" stroke="black"/><path d="M20,60 C48,190 65,245 65,245" fill="none" stroke="black" stroke-width="3"/><path d="M65,245 C105,170 165,170 205,245" fill="none" stroke="black" stroke-width="3"/><path d="M205,245 C220,190 235,120 245,60" fill="none" stroke="black" stroke-width="3"/><text x="30" y="395" font-family="Arial" font-size="16">Negative y-values reflect upwards.</text></g><g transform="translate(645,85)"><text x="135" y="0" font-family="Arial" font-size="22" font-weight="700" text-anchor="middle">y = f(|x|)</text><rect x="0" y="20" width="270" height="350" fill="white" stroke="black"/><line x1="25" y1="245" x2="245" y2="245" stroke="black"/><line x1="135" y1="335" x2="135" y2="45" stroke="black"/><path d="M135,315 C175,300 215,190 245,60" fill="none" stroke="black" stroke-width="3"/><path d="M135,315 C95,300 55,190 25,60" fill="none" stroke="black" stroke-width="3"/><line x1="135" y1="45" x2="135" y2="335" stroke="black" stroke-dasharray="5 5"/><text x="28" y="395" font-family="Arial" font-size="16">Right side copied into left side.</text></g><text x="55" y="530" font-family="Arial" font-size="20">y = |f(x)| changes outputs. y = f(|x|) changes inputs and creates y-axis symmetry.</text></svg>