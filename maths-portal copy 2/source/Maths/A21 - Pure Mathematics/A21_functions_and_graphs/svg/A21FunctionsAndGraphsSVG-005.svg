<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560"><title>A21FunctionsAndGraphsSVG-005: Restricted quadratic range</title><metadata>Asset ID: A21FunctionsAndGraphsSVG-005; LO: A21-AF-LO003.</metadata><rect width="900" height="560" fill="white"/><text x="35" y="48" font-family="Arial" font-size="28" font-weight="700">Range of g(x) = x² - 4x + 1, 0 ≤ x ≤ 5</text><g transform="translate(100,75)"><line x1="0" y1="340" x2="720" y2="340" stroke="black" stroke-width="2"/><line x1="90" y1="430" x2="90" y2="35" stroke="black" stroke-width="2"/><polygon points="720,340 708,334 708,346"/><polygon points="90,35 84,47 96,47"/><g font-family="Arial" font-size="18"><text x="725" y="346">x</text><text x="98" y="40">g(x)</text><text x="90" y="364" text-anchor="middle">0</text><text x="270" y="364" text-anchor="middle">2</text><text x="540" y="364" text-anchor="middle">5</text><text x="70" y="255" text-anchor="end">1</text><text x="70" y="420" text-anchor="end">-3</text><text x="70" y="90" text-anchor="end">6</text></g><path d="M90,250 C150,390 215,420 270,420 C360,420 460,250 540,90" fill="none" stroke="black" stroke-width="4"/><circle cx="90" cy="250" r="7"/><circle cx="270" cy="420" r="7"/><circle cx="540" cy="90" r="7"/><text x="105" y="243" font-family="Arial" font-size="18">(0,1)</text><text x="285" y="415" font-family="Arial" font-size="18">minimum (2,-3)</text><text x="555" y="90" font-family="Arial" font-size="18">(5,6)</text><line x1="650" y1="420" x2="650" y2="90" stroke="black" stroke-width="4"/><text x="670" y="260" font-family="Arial" font-size="22" font-weight="700">-3 ≤ g(x) ≤ 6</text><rect x="55" y="455" width="610" height="55" rx="9" fill="white" stroke="black"/><text x="75" y="489" font-family="Arial" font-size="20">Endpoint values are not enough: check the turning point too.</text></g></svg>