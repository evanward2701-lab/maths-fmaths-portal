<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>A21 Binomial Approximation Explorer</title>
<style>body{font-family:Arial,sans-serif;margin:0;padding:24px;color:#111}main{max-width:1000px;margin:auto;border:2px solid #222;border-radius:18px;padding:24px}label{font-weight:700;display:block;margin-top:12px}input,select,button{width:100%;padding:10px;margin-top:6px;border:1.5px solid #222;border-radius:10px}button{background:#111;color:#fff;font-weight:700;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card{border:1.5px solid #222;border-radius:14px;padding:16px;margin-top:16px;background:#f7f7f7}.ok{background:#d1e7dd}.bad{background:#f8d7da}table{border-collapse:collapse;width:100%}td,th{border:1px solid #222;padding:8px}</style></head>
<body><main><h1>A21 Binomial Approximation Explorer</h1><p>Explore truncated expansions of <strong>(a+bx)<sup>n</sup></strong> and the validity condition <strong>|bx/a| &lt; 1</strong>.</p>
<div class="grid"><div><label>a</label><input id="a" type="number" step="any" value="4"></div><div><label>b</label><input id="b" type="number" step="any" value="1"></div><div><label>n</label><input id="n" type="number" step="any" value="0.5"></div><div><label>x</label><input id="x" type="number" step="any" value="0.1"></div><div><label>terms</label><input id="terms" type="number" value="4" min="1" max="8"></div></div><button onclick="calc()">Calculate</button><div id="status" class="card"></div><div class="card"><h2>Comparison</h2><table><tr><th>Exact</th><td id="exact"></td></tr><tr><th>Approx</th><td id="approx"></td></tr><tr><th>Error</th><td id="error"></td></tr></table></div><div class="card"><h2>Terms</h2><table><thead><tr><th>r</th><th>Term value</th></tr></thead><tbody id="termsbody"></tbody></table></div></main>
<script>function choose(n,r){let num=1,den=1;for(let k=0;k<r;k++)num*=n-k;for(let k=1;k<=r;k++)den*=k;return num/den}function fmt(v){return Number.isFinite(v)?Number(v).toPrecision(10):'undefined'}function calc(){const a=+document.getElementById('a').value,b=+document.getElementById('b').value,n=+document.getElementById('n').value,x=+document.getElementById('x').value,T=+document.getElementById('terms').value;const u=b*x/a;let sum=0,html='';for(let r=0;r<T;r++){const term=Math.pow(a,n)*choose(n,r)*Math.pow(u,r);sum+=term;html+=`<tr><td>${r}</td><td>${fmt(term)}</td></tr>`}const exact=Math.pow(a+b*x,n);document.getElementById('termsbody').innerHTML=html;document.getElementById('exact').textContent=fmt(exact);document.getElementById('approx').textContent=fmt(sum);document.getElementById('error').textContent=fmt(Math.abs(exact-sum));const ok=Math.abs(u)<1;const st=document.getElementById('status');st.className='card '+(ok?'ok':'bad');st.innerHTML=`Small part u = bx/a = ${fmt(u)}. ${ok?'Valid because |u| < 1.':'Not valid because |u| is not less than 1.'}`;}calc();</script></body></html>
