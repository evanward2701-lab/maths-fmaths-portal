<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>A21 Binomial Validity Trainer</title><style>body{font-family:Arial,sans-serif;margin:0;padding:24px;color:#111}main{max-width:900px;margin:auto;border:2px solid #222;border-radius:18px;padding:24px}label{font-weight:700;display:block;margin-top:12px}input,button{width:100%;padding:10px;margin-top:6px;border:1.5px solid #222;border-radius:10px}button{background:#111;color:#fff;font-weight:700;margin-top:16px}.card{border:1.5px solid #222;border-radius:14px;padding:16px;margin-top:16px;background:#f7f7f7}.ok{background:#d1e7dd}.bad{background:#f8d7da}</style></head><body><main><h1>A21 Binomial Validity Trainer</h1><p>For <strong>(a+bx)<sup>n</sup></strong>, rewrite as <strong>a<sup>n</sup>(1+bx/a)<sup>n</sup></strong>. The expansion is valid when <strong>|bx/a| &lt; 1</strong>.</p><label>a</label><input id="a" type="number" value="4" step="any"><label>b</label><input id="b" type="number" value="1" step="any"><label>n</label><input id="n" type="number" value="0.5" step="any"><button onclick="show()">Show solution</button><div id="out" class="card"></div><label>Your bound c for |x| &lt; c</label><input id="guess" type="number" step="any"><button onclick="check()">Check</button><div id="feedback" class="card">Try a value.</div></main><script>function fmt(v){return Number.isInteger(v)?String(v):Number(v).toPrecision(8)}function bound(){return Math.abs(+a.value/+b.value)}function show(){const av=+a.value,bv=+b.value,nv=+n.value,c=bound();out.innerHTML=`<p>Expression: (${av} ${bv>=0?'+':'-'} ${Math.abs(bv)}x)^${nv}</p><p>Rewrite: ${av}^${nv}(1 + (${bv/av})x)^${nv}</p><p>Small part: u = (${bv/av})x.</p><p>Require |(${bv/av})x| &lt; 1, so <strong>|x| &lt; ${fmt(c)}</strong>.</p>`}function check(){const c=bound(),g=+guess.value;feedback.className='card '+(Math.abs(g-c)<1e-8?'ok':'bad');feedback.innerHTML=Math.abs(g-c)<1e-8?'Correct.':'Not quite. The bound is |a/b| = '+fmt(c)+'.';}show();</script></body></html>
