<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Rewriting (a + bx)^n</title>
  <desc id="desc">A21 Binomial Expansion visual asset 003.</desc>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111111">Rewriting (a + bx)^n</text>
  <text x="600" y="140" text-anchor="middle" font-family="Arial" font-size="30">(a + bx)^n = [a(1 + bx/a)]^n = a^n(1 + bx/a)^n</text>
  <rect x="90" y="250" width="280" height="100" rx="18" fill="#f8fbff" stroke="#111111" stroke-width="2"/>
  <text x="230" y="310" text-anchor="middle" font-family="Arial" font-size="25">Start: (a+bx)^n</text>
  <rect x="460" y="250" width="280" height="100" rx="18" fill="#fffaf2" stroke="#111111" stroke-width="2"/>
  <text x="600" y="310" text-anchor="middle" font-family="Arial" font-size="25">Factor out a</text>
  <rect x="830" y="250" width="280" height="100" rx="18" fill="#f8fff7" stroke="#111111" stroke-width="2"/>
  <text x="970" y="310" text-anchor="middle" font-family="Arial" font-size="25">Apply the power</text>
  <text x="600" y="500" text-anchor="middle" font-family="Arial" font-size="26">Example: (4+x)^(1/2)=2(1+x/4)^(1/2), valid when |x|&lt;4.</text>
</svg>
